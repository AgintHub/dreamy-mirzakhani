dag_type: plain_text
description: A highly concurrent workflow that gathers diagnostics, validates configurations,
  and summarizes issues for a live AWS EKS cluster.
name: debug_live_eks_cluster
nodes:
  authenticate_aws_cli:
    agent: false
    description: Run `aws configure` or use existing credentials to ensure the AWS
      CLI can call EKS APIs.
    name: authenticate_aws_cli
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Verify that the AWS CLI is configured with valid access key, secret key,
      and region. Output the result of `aws sts get-caller-identity`.
  check_cluster_autoscaler_status:
    agent: false
    description: Determine if the Cluster Autoscaler deployment (if any) is healthy.
    name: check_cluster_autoscaler_status
    nodes_depended_on:
    - list_pod_status
    nodes_dependent_on: []
    prompt: Search for pods in the `kube-system` namespace with label `app=cluster-autoscaler`.
      Report their Ready condition and any recent events.
  check_control_plane_health:
    agent: false
    description: Verify that the EKS control plane API server is reachable and reports
      healthy metrics.
    name: check_control_plane_health
    nodes_depended_on:
    - collect_cluster_info
    nodes_dependent_on: []
    prompt: Perform a `curl -k <endpoint>/healthz` (using the endpoint from cluster
      info) and report HTTP status and response body.
  check_security_group_rules:
    agent: false
    description: Inspect the security groups attached to the control plane and worker
      nodes for required inbound/outbound ports.
    name: check_security_group_rules
    nodes_depended_on:
    - authenticate_aws_cli
    - collect_cluster_info
    nodes_dependent_on: []
    prompt: Using the VpcId from cluster info, list security groups for the control
      plane ENIs and node ENIs. Ensure ports 443 (HTTPS) and 1025‑65535 (node communication)
      are allowed as appropriate.
  collect_cluster_info:
    agent: false
    description: Retrieve basic cluster metadata (version, endpoint, VPC, status).
    name: collect_cluster_info
    nodes_depended_on:
    - authenticate_aws_cli
    nodes_dependent_on: []
    prompt: Run `aws eks describe-cluster --name <cluster-name> --region <region>`
      and extract ClusterVersion, Endpoint, VpcId, and Status. Present as a JSON snippet.
  describe_services:
    agent: false
    description: Show the configuration of all Kubernetes Services and their associated
      LoadBalancer/Ingress IPs.
    name: describe_services
    nodes_depended_on:
    - set_kubeconfig
    nodes_dependent_on: []
    prompt: Run `kubectl get svc --all-namespaces -o json` and list ServiceName, Namespace,
      Type, ClusterIP, ExternalIP(s), and Ports.
  get_recent_pod_logs:
    agent: false
    description: Collect the last 200 lines of logs from pods that are not in Running/Completed
      state.
    name: get_recent_pod_logs
    nodes_depended_on:
    - list_pod_status
    nodes_dependent_on: []
    prompt: For each pod identified as CrashLoopBackOff, ImagePullBackOff, or Pending,
      run `kubectl logs <pod> -n <ns> --tail=200` and store the output.
  list_node_status:
    agent: false
    description: Get the health and readiness state of all worker nodes.
    name: list_node_status
    nodes_depended_on:
    - set_kubeconfig
    nodes_dependent_on: []
    prompt: Run `kubectl get nodes -o json` and list each node with its Ready condition,
      instance type, and any NotReady reasons.
  list_pod_status:
    agent: false
    description: Enumerate all pods across all namespaces with their phase and restart
      count.
    name: list_pod_status
    nodes_depended_on:
    - set_kubeconfig
    nodes_dependent_on: []
    prompt: 'Execute `kubectl get pods --all-namespaces -o json` and produce a table:
      Namespace, PodName, Phase, Restarts, Ready/Total.'
  set_kubeconfig:
    agent: false
    description: Generate a kubeconfig entry for the target EKS cluster using the
      AWS CLI.
    name: set_kubeconfig
    nodes_depended_on:
    - authenticate_aws_cli
    nodes_dependent_on: []
    prompt: Execute `aws eks update-kubeconfig --name <cluster-name> --region <region>`
      and confirm that `kubectl config current-context` points to the cluster. Return
      any error messages.
  summarize_findings:
    agent: false
    description: Aggregate all collected diagnostics into a concise troubleshooting
      report.
    name: summarize_findings
    nodes_depended_on:
    - collect_cluster_info
    - list_node_status
    - list_pod_status
    - get_recent_pod_logs
    - describe_services
    - check_control_plane_health
    - verify_iam_roles
    - check_security_group_rules
    - check_cluster_autoscaler_status
    nodes_dependent_on: []
    prompt: Combine the outputs of all preceding steps. Highlight any errors, non‑Ready
      nodes, failing pods, IAM mismatches, security‑group gaps, or control‑plane health
      issues. Provide a prioritized list of next‑step actions.
  verify_iam_roles:
    agent: false
    description: Confirm that the Node Instance Role and Cluster IAM Role have required
      policies attached.
    name: verify_iam_roles
    nodes_depended_on:
    - authenticate_aws_cli
    nodes_dependent_on: []
    prompt: Identify the IAM role ARN for the node group (from `aws eks describe-nodegroup`)
      and the EKS service role. Run `aws iam list-attached-role-policies` for each
      and verify presence of `AmazonEKSWorkerNodePolicy`, `AmazonEKS_CNI_Policy`,
      and `AmazonEC2ContainerRegistryReadOnly`.
