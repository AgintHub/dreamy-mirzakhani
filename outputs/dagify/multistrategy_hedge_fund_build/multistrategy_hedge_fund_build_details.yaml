dag_type: plain_text
description: Creates a complete, concurrent execution plan for launching a hedge fund
  that trades every asset class in every global market, routes each class to its own
  trading system, and enforces firm‑wide risk and compliance controls.
name: multistrategy_hedge_fund_build
nodes:
  assemble_launch_timeline:
    agent: false
    description: Create a month‑by‑month schedule of milestones from planning through
      go‑live.
    name: assemble_launch_timeline
    nodes_depended_on:
    - draft_operations_workflow
    - select_technology_stack
    - create_hiring_plan
    - compile_service_provider_checklist
    - identify_regulatory_jurisdictions
    nodes_dependent_on: []
    prompt: 'Present a table with columns: Month | Milestone (e.g., "Finalize legal
      entity", "Onboard prime broker", "Deploy data lake", "Run end‑to‑end simulation").
      Include 12 months.'
  build_integration_blueprint:
    agent: false
    description: Define how each per‑asset trading system will connect to the shared
      data layer and risk/compliance engines.
    name: build_integration_blueprint
    nodes_depended_on:
    - specify_per_asset_trading_systems
    - define_data_architecture
    - design_firmwide_risk_framework
    - design_firmwide_compliance_program
    nodes_dependent_on: []
    prompt: 'Provide a textual diagram that shows, for a generic asset class, the
      flow: MarketData → DataLake → SignalEngine → RiskEngine (pre‑trade) → OrderRouter
      → Execution → Post‑Trade Risk → Compliance → Settlement.'
  clarify_fund_mission:
    agent: false
    description: State the high‑level mission, profit objective, and competitive edge
      of the multistrategy fund.
    name: clarify_fund_mission
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Write a concise bullet list (max 6 items) describing the fund’s mission,
      target return profile, and why a truly multi‑asset, global approach is a competitive
      advantage.
  compile_service_provider_checklist:
    agent: false
    description: List all external service providers (prime broker, admin, auditor,
      legal, CI, cloud) needed for launch.
    name: compile_service_provider_checklist
    nodes_depended_on:
    - identify_regulatory_jurisdictions
    nodes_dependent_on: []
    prompt: 'Create a checklist with columns: ProviderType | RecommendedVendor | PrimaryRole.
      Include exactly the categories needed for a multi‑asset global fund.'
  create_hiring_plan:
    agent: false
    description: Determine the core internal roles required to run the fund and support
      each system.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    - select_technology_stack
    nodes_dependent_on: []
    prompt: List positions (e.g., Head of Quantitative Strategies, Asset‑Class Leads,
      Risk Manager, Compliance Officer, DevOps Lead, Data Engineer) with a one‑sentence
      responsibility each.
  define_data_architecture:
    agent: false
    description: Specify the unified data lake and messaging layer that will feed
      all per‑asset trading systems and the risk/compliance engines.
    name: define_data_architecture
    nodes_depended_on:
    - specify_per_asset_trading_systems
    - design_firmwide_risk_framework
    - design_firmwide_compliance_program
    nodes_dependent_on: []
    prompt: Describe the data ingestion pipeline (market data, reference data, execution
      reports) and storage format (e.g., Parquet on cloud object store). Include a
      diagram‑style text outline of topics, schemas, and access controls.
  define_global_markets:
    agent: false
    description: Identify the geographic markets (regions/exchanges) for each asset
      class.
    name: define_global_markets
    nodes_depended_on:
    - list_target_asset_classes
    nodes_dependent_on: []
    prompt: 'For every asset class listed, produce a comma‑separated list of the major
      markets where it will be traded (e.g., Equities → NYSE, LSE, TSE). Output one
      line per asset class in the format "AssetClass: Market1, Market2, …".'
  design_firmwide_compliance_program:
    agent: false
    description: Create a compliance checklist that satisfies the regulatory regimes
      of every jurisdiction and asset class.
    name: design_firmwide_compliance_program
    nodes_depended_on:
    - clarify_fund_mission
    nodes_dependent_on: []
    prompt: List compliance requirements grouped by type (e.g., Reporting, Position
      Limits, Market Abuse, Data Retention). Provide a one‑line description of the
      internal policy needed for each requirement.
  design_firmwide_risk_framework:
    agent: false
    description: Outline the firm‑wide risk policies, limits, and measurement methodology
      that apply across all asset classes.
    name: design_firmwide_risk_framework
    nodes_depended_on:
    - clarify_fund_mission
    nodes_dependent_on: []
    prompt: Produce a bullet list of risk controls (e.g., aggregate VaR cap, liquidity
      stress limits, cross‑asset concentration caps, leverage ceiling). Include the
      metric, calculation frequency, and escalation procedure for each.
  draft_operations_workflow:
    agent: false
    description: Map the end‑to‑end trade lifecycle common to all asset classes, highlighting
      where firm‑wide risk checks intervene.
    name: draft_operations_workflow
    nodes_depended_on:
    - specify_per_asset_trading_systems
    - design_firmwide_risk_framework
    nodes_dependent_on: []
    prompt: List each step in order (Idea → Signal → Order → Execution → Confirmation
      → Settlement → Reconciliation) and annotate which step triggers the firm‑wide
      risk engine and which triggers compliance verification.
  identify_regulatory_jurisdictions:
    agent: false
    description: Enumerate the regulatory bodies and registrations required for each
      market and asset class.
    name: identify_regulatory_jurisdictions
    nodes_depended_on:
    - define_global_markets
    nodes_dependent_on: []
    prompt: 'For every market in the list, output a line "Market: Regulator(s) – Required
      Registration(s)". Use only regulator names and registration titles.'
  list_target_asset_classes:
    agent: false
    description: Enumerate all asset classes the fund will trade.
    name: list_target_asset_classes
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Provide a flat list of asset‑class identifiers the fund will actively
      trade (e.g., Equities, Fixed Income, FX, Commodities, Crypto, Derivatives, Real
      Estate, Private Credit). No description, just the names.
  produce_final_fund_blueprint:
    agent: false
    description: Synthesize all previous outputs into a single executive summary document.
    name: produce_final_fund_blueprint
    nodes_depended_on:
    - clarify_fund_mission
    - list_target_asset_classes
    - define_global_markets
    - specify_per_asset_trading_systems
    - design_firmwide_risk_framework
    - design_firmwide_compliance_program
    - define_data_architecture
    - select_technology_stack
    - draft_operations_workflow
    - identify_regulatory_jurisdictions
    - compile_service_provider_checklist
    - create_hiring_plan
    - build_integration_blueprint
    - assemble_launch_timeline
    nodes_dependent_on: []
    prompt: Write an executive summary (≤400 words) that briefly describes the fund
      mission, asset‑class coverage, per‑asset system design, firm‑wide risk & compliance
      approach, technology stack, key service providers, staffing, regulatory footprint,
      integration model, and launch timeline.
  select_technology_stack:
    agent: false
    description: Choose the core technology components (cloud provider, container
      orchestration, messaging, DB, CI/CD) that support all systems.
    name: select_technology_stack
    nodes_depended_on:
    - define_data_architecture
    nodes_dependent_on: []
    prompt: 'Provide a 2‑column table: Component | Selected Tool (e.g., CloudProvider
      | AWS, Orchestrator | Kubernetes, Messaging | Kafka, TimeSeriesDB | InfluxDB).
      Keep the list to essential components only.'
  specify_per_asset_trading_systems:
    agent: false
    description: Define the functional specification for the dedicated trading system
      of each asset class.
    name: specify_per_asset_trading_systems
    nodes_depended_on:
    - list_target_asset_classes
    - define_global_markets
    nodes_dependent_on: []
    prompt: 'Create a table with columns: AssetClass | CoreModules (e.g., SignalEngine,
      OrderRouter, MarketDataFeed) | PreferredTechnologyStack. Fill one row per asset
      class. Keep each cell concise.'
