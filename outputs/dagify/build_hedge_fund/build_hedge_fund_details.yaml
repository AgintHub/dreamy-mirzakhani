dag_type: stub
description: Generated workflow from UI.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    code_node_type: stub
    description: Chooses a high-level investment strategy
    implementation: "from pydantic import BaseModel, Field\n\n\nclass ClarifyFundObjectivesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for clarify_fund_objectives node outputs.\"\"\"\n\
      \    investment_purpose: str = Field(..., description=\"Investment purpose\"\
      )\n    target_return_profile: str = Field(..., description=\"Target return profile\"\
      )\n    competitive_advantage: str = Field(..., description=\"Competitive advantage\"\
      )\n    long_term_vision: str = Field(..., description=\"Long-term vision\")\n\
      \    other_objectives: str = Field(..., description=\"Other fund objectives\"\
      )\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for choose_investment_strategy node outputs.\"\"\"\n    chosen_investment_strategy:\
      \ str = (\n        Field(..., description=\"The chosen high-level investment\
      \ strategy\")\n    )\n    justification: str = (\n        Field(..., description=\"\
      A one-sentence justification for the chosen investment strategy\")\n    )\n\n\
      \ndef choose_investment_strategy(clarify_fund_objectives_input: ClarifyFundObjectivesOutput,\
      \ **kwargs) -> ChooseInvestmentStrategyOutput:\n    \"\"\"\n    Selects a primary\
      \ hedge-fund strategy category that best serves the\n    objectives.\n\n   \
      \ Parameters\n    ----------\n    fund_objectives : dict\n        Output from\
      \ 'clarify_fund_objectives' node containing primary\n        business objectives.\n\
      \n    Returns\n    -------\n    dict\n        A dictionary containing the 'chosen_investment_strategy'\
      \ and\n        'justification' values.\n\n    Examples\n    --------\n    >>>\
      \ fund_objectives = {'investment_purpose': 'Capital appreciation',\n    'target_return_profile':\
      \ 'Above market', 'competitive_advantage': 'Active\n    management', 'long_term_vision':\
      \ 'Long-term growth'}\"\n    \"chosen_investment_strategy, justification =\n\
      \    choose_investment_strategy(fund_objectives)\n    {'chosen_investment_strategy':\
      \ 'Activemanagement', 'justification': 'To\n    capture above-market returns\
      \ through active management'}\n\n    \"\"\"\n    return ChooseInvestmentStrategyOutput(\n\
      \        chosen_investment_strategy=\"\",\n        justification=\"\",\n   \
      \ )"
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen high-level investment strategy
      key: chosen_investment_strategy
      type: str
    - description: A one-sentence justification for the chosen investment strategy
      key: justification
      type: str
    prd:
      conceptual_info: Chooses a high-level investment strategy based on the objectives
        of the fund.
      docstring:
        examples:
        - lines:
          - "fund_objectives = {'investment_purpose': 'Capital appreciation', 'target_return_profile':\
            \ 'Above market', 'competitive_advantage': 'Active management', 'long_term_vision':\
            \ 'Long-term growth'}\"\n                \"chosen_investment_strategy,\
            \ justification = choose_investment_strategy(fund_objectives)"
          output: '{''chosen_investment_strategy'': ''Activemanagement'', ''justification'':
            ''To capture above-market returns through active management''}'
        parameters:
        - description: Output from 'clarify_fund_objectives' node containing primary
            business objectives.
          name: fund_objectives
          type: dict
        raises: []
        returns:
          description: A dictionary containing the 'chosen_investment_strategy' and
            'justification' values.
          type: dict
        summary: Selects a primary hedge-fund strategy category that best serves the
          objectives.
    prompt: Select a primary hedge-fund strategy category that best serves the objectives.
      Provide a one-sentence justification.
    shims: []
  choose_legal_entity_type:
    agent: false
    code_node_type: stub
    description: Selects the legal entity form for the fund.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass SelectJurisdictionOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for select_jurisdiction node outputs.\"\"\"\n    chosen_jurisdiction:\
      \ str = (\n        Field(..., description=\"The selected jurisdiction for the\
      \ fund (e.g., Cayman, Delaware, Luxembourg).\")\n    )\n    advantages: str\
      \ = (\n        Field(..., description=\"A list containing two advantages of\
      \ the chosen jurisdiction.\")\n    )\n    disadvantages: str = (\n        Field(...,\
      \ description=\"A list containing two disadvantages of the chosen jurisdiction.\"\
      )\n    )\n    rationale: str = (\n        Field(..., description=\"The reasoning\
      \ behind selecting this jurisdiction, including strategic, regulatory, and operational\
      \ factors.\")\n    )\n\n\nclass ChooseLegalEntityTypeOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for choose_legal_entity_type node outputs.\"\"\"\n \
      \   selected_entity_type: str = (\n        Field(..., description=\"The selected\
      \ legal vehicle structure for the fund's chosen jurisdiction.\")\n    )\n  \
      \  entity_type_rationale: str = (\n        Field(..., description=\"A brief\
      \ one-sentence explanation for the selected legal vehicle structure.\")\n  \
      \  )\n\n\ndef choose_legal_entity_type(select_jurisdiction_input: SelectJurisdictionOutput,\
      \ **kwargs) -> ChooseLegalEntityTypeOutput:\n    \"\"\"\n    Selects the legal\
      \ entity form for the fund based on the selected\n    jurisdiction.\n\n    Parameters\n\
      \    ----------\n    selected_jurisdiction : str\n        The legal jurisdiction\
      \ selected by the fund.\n\n    Returns\n    -------\n    dict[str, str]\n  \
      \      A dictionary containing the selected legal vehicle structure and its\n\
      \        brief explanation.\n\n    Raises\n    ------\n    ValueError\n    \
      \    If the input jurisdiction is invalid or unsupported.\n\n    Examples\n\
      \    --------\n    >>> selected_jurisdiction = 'Cayman'\n    >>> chosen_entity\
      \ = choose_legal_entity_type(selected_jurisdiction)\n    >>> print(chosen_entity)\n\
      \    {\"selected_entity_type\": 'LP', \"entity_type_rationale\": 'brief explanation'}\n\
      \n    \"\"\"\n    return ChooseLegalEntityTypeOutput(\n        selected_entity_type=\"\
      \",\n        entity_type_rationale=\"\",\n    )"
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The selected legal vehicle structure for the fund's chosen jurisdiction.
      key: selected_entity_type
      type: str
    - description: A brief one-sentence explanation for the selected legal vehicle
        structure.
      key: entity_type_rationale
      type: str
    prd:
      conceptual_info: This node selects the appropriate legal entity form (LP, LLC,
        SICAV, etc.) for the fund based on the selected jurisdiction.
      docstring:
        examples:
        - lines:
          - selected_jurisdiction = 'Cayman'
          - chosen_entity = choose_legal_entity_type(selected_jurisdiction)
          - print(chosen_entity)
          output: '{"selected_entity_type": ''LP'', "entity_type_rationale": ''brief
            explanation''}'
        parameters:
        - description: The legal jurisdiction selected by the fund.
          name: selected_jurisdiction
          type: str
        raises:
        - description: If the input jurisdiction is invalid or unsupported.
          type: ValueError
        returns:
          description: A dictionary containing the selected legal vehicle structure
            and its brief explanation.
          type: dict[str, str]
        summary: Selects the legal entity form for the fund based on the selected
          jurisdiction.
    prompt: Specify the legal vehicle structure appropriate for the chosen jurisdiction
      (e.g., LP, LLC, SICAV). Provide a brief one-sentence explanation.
    shims: []
  clarify_fund_objectives:
    agent: false
    code_node_type: stub
    description: Produces a bullet-list of the fund's primary business objectives.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass ClarifyFundObjectivesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for clarify_fund_objectives node outputs.\"\"\"\n\
      \    investment_purpose: str = Field(..., description=\"Investment purpose\"\
      )\n    target_return_profile: str = Field(..., description=\"Target return profile\"\
      )\n    competitive_advantage: str = Field(..., description=\"Competitive advantage\"\
      )\n    long_term_vision: str = Field(..., description=\"Long-term vision\")\n\
      \    other_objectives: str = Field(..., description=\"Other fund objectives\"\
      )\n\n\ndef clarify_fund_objectives(general_input: str, **kwargs) -> ClarifyFundObjectivesOutput:\n\
      \    \"\"\"\n    clarify_fund_objectives\n\n    Returns\n    -------\n    dict[str,\
      \ str]\n        fund objectives\n\n    Examples\n    --------\n    >>> result\
      \ = clarify_fund_objectives()\n    >>> print(result)\n    {'investment_purpose':\
      \ 'Generate absolute returns', 'target_return_profile':\n    'High returns with\
      \ moderate risk', 'competitive_advantage': 'Active risk\n    management', 'long_term_vision':\
      \ 'Achieve long-term capital appreciation',\n    'other_objectives': 'Grow AUM\
      \ and increase investor base'}\n\n    >>> result = clarify_fund_objectives()\n\
      \    >>> print(result)\n    {'investment_purpose': 'Maximize return on investment',\n\
      \    'target_return_profile': 'High returns with high risk',\n    'competitive_advantage':\
      \ 'Active risk management',\n        'long_term_vision': 'Achieve long-term\
      \ capital growth',\n    'other_objectives': 'Grow AUM and increase investor\
      \ base'}\n\n    \"\"\"\n    return ClarifyFundObjectivesOutput(\n        investment_purpose=\"\
      \",\n        target_return_profile=\"\",\n        competitive_advantage=\"\"\
      ,\n        long_term_vision=\"\",\n        other_objectives=\"\",\n    )"
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Investment purpose
      key: investment_purpose
      type: str
    - description: Target return profile
      key: target_return_profile
      type: str
    - description: Competitive advantage
      key: competitive_advantage
      type: str
    - description: Long-term vision
      key: long_term_vision
      type: str
    - description: Other fund objectives
      key: other_objectives
      type: str
    prd:
      conceptual_info: Clarify the primary business objectives of a hedge fund, including
        investment purpose, target return profile, competitive advantage, and long-term
        vision.
      docstring:
        examples:
        - lines:
          - result = clarify_fund_objectives()
          - print(result)
          output: '{''investment_purpose'': ''Generate absolute returns'', ''target_return_profile'':
            ''High returns with moderate risk'', ''competitive_advantage'': ''Active
            risk management'', ''long_term_vision'': ''Achieve long-term capital appreciation'',
            ''other_objectives'': ''Grow AUM and increase investor base''}'
        - lines:
          - result = clarify_fund_objectives()
          - print(result)
          output: "{'investment_purpose': 'Maximize return on investment', 'target_return_profile':\
            \ 'High returns with high risk', 'competitive_advantage': 'Active risk\
            \ management',\n    'long_term_vision': 'Achieve long-term capital growth',\
            \ 'other_objectives': 'Grow AUM and increase investor base'}"
        parameters: []
        raises: []
        returns:
          description: fund objectives
          type: dict[str, str]
        summary: clarify_fund_objectives
    prompt: List the core objectives of the hedge fund in up to eight concise bullet
      points. Cover investment purpose, target return profile, competitive advantage,
      and long-term vision. Do not include any strategy or structural details.
    shims: []
  compile_pitch_deck_outline:
    agent: false
    code_node_type: stub
    description: Provides the structure for fundraising presentation materials.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass ClarifyFundObjectivesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for clarify_fund_objectives node outputs.\"\"\"\n\
      \    investment_purpose: str = Field(..., description=\"Investment purpose\"\
      )\n    target_return_profile: str = Field(..., description=\"Target return profile\"\
      )\n    competitive_advantage: str = Field(..., description=\"Competitive advantage\"\
      )\n    long_term_vision: str = Field(..., description=\"Long-term vision\")\n\
      \    other_objectives: str = Field(..., description=\"Other fund objectives\"\
      )\n\n\nclass DefineInvestorProfileOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for define_investor_profile node outputs.\"\"\"\n    investor_type: str =\
      \ (\n        Field(..., description=\"The type of investor (e.g., family offices,\
      \ pension funds, high-net-worth individuals)\")\n    )\n    ticket_size: int\
      \ = (\n        Field(..., description=\"The typical ticket size for the investor\"\
      )\n    )\n    risk_tolerance: float = (\n        Field(..., description=\"The\
      \ investor's risk tolerance\")\n    )\n    liquidity_preference: str = (\n \
      \       Field(..., description=\"The investor's liquidity preference\")\n  \
      \  )\n    geographic_focus: str = (\n        Field(..., description=\"The investor's\
      \ geographic focus\")\n    )\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_investment_strategy node outputs.\"\"\"\
      \n    chosen_investment_strategy: str = (\n        Field(..., description=\"\
      The chosen high-level investment strategy\")\n    )\n    justification: str\
      \ = (\n        Field(..., description=\"A one-sentence justification for the\
      \ chosen investment strategy\")\n    )\n\n\nclass SetPerformanceAndRiskTargetsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_performance_and_risk_targets node outputs.\"\
      \"\"\n    annual_gross_return: float = (\n        Field(..., description=\"\
      Target annual gross return for the chosen strategy\")\n    )\n    annual_volatility:\
      \ float = (\n        Field(..., description=\"Target annual volatility for the\
      \ chosen strategy\")\n    )\n    Sharpe_ratio: float = (\n        Field(...,\
      \ description=\"Target Sharpe ratio for the chosen strategy\")\n    )\n    maximum_drawdown:\
      \ float = (\n        Field(..., description=\"Target maximum drawdown for the\
      \ strategy\")\n    )\n    performance_targets: float = (\n        Field(...,\
      \ description=\"A list of key performance metric targets for the strategy\"\
      )\n    )\n    risk_targets: float = (\n        Field(..., description=\"A list\
      \ of risk metric targets for the strategy\")\n    )\n\n\nclass DraftFeeStructureOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for draft_fee_structure node outputs.\"\"\"\n    management_fees:\
      \ str = (\n        Field(..., description=\"Management fees percentage or structure\"\
      )\n    )\n    performance_fees: str = (\n        Field(..., description=\"Performance\
      \ fees percentage or structure\")\n    )\n    hurdle_rate: str = (\n       \
      \ Field(..., description=\"Hurdle rate or other performance targets\")\n   \
      \ )\n    fee_schedules: str = (\n        Field(..., description=\"List of fee\
      \ schedules or payment structures\")\n    )\n\n\nclass DesignRiskManagementFrameworkOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for design_risk_management_framework node outputs.\"\
      \"\"\n    risk_control_1: str = (\n        Field(..., description=\"First risk\
      \ control (e.g., position limits)\")\n    )\n    risk_control_2: str = (\n \
      \       Field(..., description=\"Second risk control (e.g., VaR caps)\")\n \
      \   )\n    risk_control_3: str = (\n        Field(..., description=\"Third risk\
      \ control (e.g., stop-loss levels)\")\n    )\n    risk_control_4: str = (\n\
      \        Field(..., description=\"Fourth risk control (e.g., liquidity thresholds)\"\
      )\n    )\n    risk_control_5: str = (\n        Field(..., description=\"Fifth\
      \ risk control (optional)\")\n    )\n    risk_control_6: str = (\n        Field(...,\
      \ description=\"Sixth risk control (optional)\")\n    )\n\n\nclass CompilePitchDeckOutlineOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for compile_pitch_deck_outline node outputs.\"\"\"\
      \n    objectives: str = Field(..., description=\"Objectives slide title\")\n\
      \    strategy: str = Field(..., description=\"Strategy slide title\")\n    team:\
      \ str = Field(..., description=\"Team slide title\")\n    edge: str = Field(...,\
      \ description=\"Edge slide title\")\n    risk_controls: str = Field(..., description=\"\
      Risk controls slide title\")\n    fees: str = Field(..., description=\"Fees\
      \ slide title\")\n    target_returns: str = Field(..., description=\"Target\
      \ returns slide title\")\n    market_opportunity: str = (\n        Field(...,\
      \ description=\"Market opportunity slide title\")\n    )\n    service_providers:\
      \ str = (\n        Field(..., description=\"Service providers slide title\"\
      )\n    )\n    timeline: str = Field(..., description=\"Timeline slide title\"\
      )\n\n\ndef compile_pitch_deck_outline(clarify_fund_objectives_input: ClarifyFundObjectivesOutput,\
      \ define_investor_profile_input: DefineInvestorProfileOutput, choose_investment_strategy_input:\
      \ ChooseInvestmentStrategyOutput, set_performance_and_risk_targets_input: SetPerformanceAndRiskTargetsOutput,\
      \ draft_fee_structure_input: DraftFeeStructureOutput, design_risk_management_framework_input:\
      \ DesignRiskManagementFrameworkOutput, **kwargs) -> CompilePitchDeckOutlineOutput:\n\
      \    \"\"\"\n    Creates a 10-slide outline for an investor pitch deck.\n\n\
      \    Parameters\n    ----------\n    investment_purpose : str\n        Investment\
      \ purpose from clarify_fund_objectives\n    strategy : str\n        Investment\
      \ strategy from clarify_fund_objectives\n    team : str\n        Team title\
      \ from define_investor_profile\n    edge : str\n        Edge title from clarify_fund_objectives\n\
      \    risk_controls : str\n        Risk controls title from design_risk_management_framework\n\
      \    fees : str\n        Fees title from draft_fee_structure\n    target_returns\
      \ : str\n        Target returns title from set_performance_and_risk_targets\n\
      \    market_opportunity : str\n        Market opportunity title from clarify_fund_objectives\n\
      \    service_providers : str\n        Service providers title from list_service_providers\n\
      \    timeline : str\n        Timeline title from develop_timeline_and_milestones\n\
      \n    Returns\n    -------\n    -> dict[str, str]\n        A dictionary with\
      \ 10 keys representing the slide titles\n\n    Raises\n    ------\n    ValueError\n\
      \        If any input is missing\n\n    Examples\n    --------\n    >>> investment_purpose\
      \ = 'Invest in stocks and bonds'\n    >>> strategy = 'Grow and diversify assets'\n\
      \    >>> team = 'Our Investment Team'\n    >>> edge = 'Our edge in the market'\n\
      \    >>> risk_controls = 'Risk controls in place'\n    >>> fees = 'Management\
      \ and performance fees'\n    >>> target_returns = 'Target return on investment'\n\
      \    >>> market_opportunity = 'Market opportunity'\n    >>> service_providers\
      \ = 'Service providers'\n    >>> timeline = 'Launch timeline'\n    {'objectives':\
      \ 'Objectives slide title', 'strategy': 'Strategy slide title',\n    'team':\
      \ 'Team slide title', 'edge': 'Edge slide title', 'risk_controls':\n    'Risk\
      \ controls slide title', 'fees': 'Fees slide title', 'target_returns':\n   \
      \ 'Target returns slide title', 'market_opportunity': 'Market opportunity\n\
      \    slide title', 'service_providers': 'Service providers slide title',\n \
      \   'timeline': 'Timeline slide title'}\n\n    \"\"\"\n    return CompilePitchDeckOutlineOutput(\n\
      \        objectives=\"\",\n        strategy=\"\",\n        team=\"\",\n    \
      \    edge=\"\",\n        risk_controls=\"\",\n        fees=\"\",\n        target_returns=\"\
      \",\n        market_opportunity=\"\",\n        service_providers=\"\",\n   \
      \     timeline=\"\",\n    )"
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: Objectives slide title
      key: objectives
      type: str
    - description: Strategy slide title
      key: strategy
      type: str
    - description: Team slide title
      key: team
      type: str
    - description: Edge slide title
      key: edge
      type: str
    - description: Risk controls slide title
      key: risk_controls
      type: str
    - description: Fees slide title
      key: fees
      type: str
    - description: Target returns slide title
      key: target_returns
      type: str
    - description: Market opportunity slide title
      key: market_opportunity
      type: str
    - description: Service providers slide title
      key: service_providers
      type: str
    - description: Timeline slide title
      key: timeline
      type: str
    prd:
      conceptual_info: This node creates a 10-slide outline for an investor pitch
        deck.
      docstring:
        examples:
        - lines:
          - investment_purpose = 'Invest in stocks and bonds'
          - strategy = 'Grow and diversify assets'
          - team = 'Our Investment Team'
          - edge = 'Our edge in the market'
          - risk_controls = 'Risk controls in place'
          - fees = 'Management and performance fees'
          - target_returns = 'Target return on investment'
          - market_opportunity = 'Market opportunity'
          - service_providers = 'Service providers'
          - timeline = 'Launch timeline'
          output: '{''objectives'': ''Objectives slide title'', ''strategy'': ''Strategy
            slide title'', ''team'': ''Team slide title'', ''edge'': ''Edge slide
            title'', ''risk_controls'': ''Risk controls slide title'', ''fees'': ''Fees
            slide title'', ''target_returns'': ''Target returns slide title'', ''market_opportunity'':
            ''Market opportunity slide title'', ''service_providers'': ''Service providers
            slide title'', ''timeline'': ''Timeline slide title''}'
        parameters:
        - description: Investment purpose from clarify_fund_objectives
          name: investment_purpose
          type: str
        - description: Investment strategy from clarify_fund_objectives
          name: strategy
          type: str
        - description: Team title from define_investor_profile
          name: team
          type: str
        - description: Edge title from clarify_fund_objectives
          name: edge
          type: str
        - description: Risk controls title from design_risk_management_framework
          name: risk_controls
          type: str
        - description: Fees title from draft_fee_structure
          name: fees
          type: str
        - description: Target returns title from set_performance_and_risk_targets
          name: target_returns
          type: str
        - description: Market opportunity title from clarify_fund_objectives
          name: market_opportunity
          type: str
        - description: Service providers title from list_service_providers
          name: service_providers
          type: str
        - description: Timeline title from develop_timeline_and_milestones
          name: timeline
          type: str
        raises:
        - description: If any input is missing
          type: ValueError
        returns:
          description: A dictionary with 10 keys representing the slide titles
          type: -> dict[str, str]
        summary: Creates a 10-slide outline for an investor pitch deck.
    prompt: Create a 10-slide outline (titles only) for an investor pitch deck covering
      objectives, strategy, team, edge, risk controls, fees, target returns, market
      opportunity, service providers, and timeline.
    shims: []
  create_hiring_plan:
    agent: false
    code_node_type: stub
    description: Determines initial staffing requirements.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DraftOperationsWorkflowOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for draft_operations_workflow node outputs.\"\"\"\n    tradelifecycle_steps:\
      \ List[str] = (\n        Field(..., description=\"Sequence of daily trade lifecycle\
      \ steps from idea generation to reconciliation.\")\n    )\n    responsible_parties:\
      \ List[str] = (\n        Field(..., description=\"Primary responsible parties\
      \ (internal team or external providers) for each trade lifecycle step.\")\n\
      \    )\n\n\nclass CreateHiringPlanOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for create_hiring_plan node outputs.\"\"\"\n    roles_needed: List[str] =\
      \ (\n        Field(..., description=\"List of essential full-time roles needed\
      \ at launch, including their one-line responsibilities.\")\n    )\n    count_roles:\
      \ int = Field(..., description=\"Count of roles needed.\")\n\n\ndef create_hiring_plan(draft_operations_workflow_input:\
      \ DraftOperationsWorkflowOutput, **kwargs) -> CreateHiringPlanOutput:\n    \"\
      \"\"\n    Determine initial staffing requirements based on drafted operations\n\
      \    workflow.\n\n    Parameters\n    ----------\n    tradelifecycle_steps :\
      \ List[str]\n        List of daily trade lifecycle steps from drafted operations\n\
      \        workflow.\n\n    Returns\n    -------\n    dict\n        A dictionary\
      \ containing 'roles_needed' and 'count_roles'.\n\n    Raises\n    ------\n \
      \   ValueError\n        If 'tradelifecycle_steps' is empty.\n\n    Examples\n\
      \    --------\n    >>> create_hiring_plan(tradelifecycle_steps=['Idea generation',\
      \ 'Order\n    creation', 'Execution', 'Confirmation', 'Settlement', 'Reconciliation'])\n\
      \    \n    role_needed = roles_needed\n    count_roles = count_roles\n    print(role_needed)\n\
      \    print(count_roles)\n\n    >>> create_hiring_plan(tradelifecycle_steps=['Idea\
      \ generation', 'Order\n    creation', 'Execution', 'Confirmation', 'Settlement',\
      \ 'Reconciliation',\n    'Market Analysis'])\n    \n    role_needed = roles_needed\n\
      \    count_roles = count_roles\n    print(role_needed)\n    print(count_roles)\n\
      \n    \"\"\"\n    return CreateHiringPlanOutput(\n        roles_needed=[],\n\
      \        count_roles=0,\n    )"
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of essential full-time roles needed at launch, including their
        one-line responsibilities.
      key: roles_needed
      type: List[str]
    - description: Count of roles needed.
      key: count_roles
