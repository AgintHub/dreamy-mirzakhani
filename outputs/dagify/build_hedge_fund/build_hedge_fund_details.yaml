      \ SetPerformanceAndRiskTargetsOutput, estimate_setup_and_operating_costs_input:\
      \ EstimateSetupAndOperatingCostsOutput, **kwargs) -> DraftFeeStructureOutput:\n\
      \    \"\"\"\n    Define the management and performance fee percentages, hurdle\
      \ rate, and fee\n    structures for the fund, considering market standards and\
      \ internal cost\n    recovery goals.\n\n    Parameters\n    ----------\n   \
      \ set_performance_and_risk_targets : dict\n        Outputs from the parent node\
      \ defining risk and performance targets,\n        influencing fee structure\
