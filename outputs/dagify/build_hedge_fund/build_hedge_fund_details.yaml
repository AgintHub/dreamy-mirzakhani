      \ '15%', 'hurdle_rate':\n    'None', 'fee_schedules': 'High-water mark with\
      \ clawback'}\n\n    \"\"\"\n    return DraftFeeStructureOutput(\n        management_fees=\"\
      \",\n        performance_fees=\"\",\n        hurdle_rate=\"\",\n        fee_schedules=\"\
      \",\n    )"
