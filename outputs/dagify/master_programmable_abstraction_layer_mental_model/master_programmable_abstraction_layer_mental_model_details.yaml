    name: define_mode
    nodes_depended_on:
    - enumerate_abstraction_components
    nodes_dependent_on: []
    prompt: Define mode in two sentences, indicating how it switches an agent’s operating
      parameters such as creativity, verbosity, or safety level.
  define_permission:
    agent: false
    description: Provide a concise definition of permission within the programmable
      abstraction layer.
    name: define_permission
    nodes_depended_on:
    - enumerate_abstraction_components
    nodes_dependent_on: []
    prompt: Define permission in two sentences, covering how it governs what actions
      an agent or tool may perform on resources.
  define_plugin:
    agent: false
    description: Provide a concise definition of a plugin within the programmable
      abstraction layer.
    name: define_plugin
    nodes_depended_on:
    - enumerate_abstraction_components
    nodes_dependent_on: []
    prompt: Define a plugin in two sentences, explaining how it extends or modifies
