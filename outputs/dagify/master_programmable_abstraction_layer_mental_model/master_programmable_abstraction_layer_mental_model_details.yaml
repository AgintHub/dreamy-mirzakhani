    agent: false
    description: Identify three common pitfalls of an agent in this abstraction layer.
    name: list_pitfalls_agent
    nodes_depended_on:
    - define_agent
    nodes_dependent_on: []
    prompt: Using the agent definition, list three pitfalls or limitations of agents,
      such as unpredictability, resource usage, and interpretability challenges. Provide
      bullet points.
  list_pitfalls_context:
    agent: false
    description: Identify three common pitfalls of context in this abstraction layer.
    name: list_pitfalls_context
    nodes_depended_on:
    - define_context
    nodes_dependent_on: []
    prompt: Using the context definition, enumerate three pitfalls of context, including
      stale information, overload, and leakage across sessions. Bullet format.
  list_pitfalls_hook:
    agent: false
    description: Identify three common pitfalls of a hook in this abstraction layer.
