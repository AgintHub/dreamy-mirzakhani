dag_type: spec
description: Generated workflow from UI.
name: basic_functional_test_suite
nodes:
  create_defect_template:
    agent: false
    description: Standardize defect logging format
    name: create_defect_template
    nodes_depended_on:
    - identify_test_requirements
    nodes_dependent_on: []
    output_structure:
    - description: The title or short summary of the defect
      key: defect_title
      type: str
    - description: Detailed description of the defect
      key: defect_description
      type: str
    - description: Ordered list of steps required to reproduce the defect
      key: reproduction_steps
      type: List[str]
    - description: The expected outcome if the defect were not present
      key: expected_result
      type: str
    - description: The actual outcome observed when the defect occurs
      key: actual_result
      type: str
    - description: Numeric severity rating (e.g., 1 = critical, 5 = trivial)
      key: severity_level
      type: int
    - description: Numeric priority rating for defect handling
      key: priority_level
      type: int
    - description: Identifier of the requirement that the defect relates to
      key: requirement_id
      type: str
    - description: Identifier of the test case that failed
      key: test_case_id
      type: str
    - description: Name of the person who logged the defect
      key: reporter_name
      type: str
    - description: Date when the defect was logged (ISO 8601 format)
      key: date_reported
      type: str
    - description: Current status of the defect (e.g., Open, In Progress, Resolved,
        Closed)
      key: status
      type: str
    prd:
      conceptual_info: Creates a unified defect record template to ensure consistency
        and traceability across all testing artifacts. The function produces a structured
        dictionary that includes all essential fields required by downstream defect
        tracking systems and reporting tools.
      docstring:
        examples:
        - lines:
          - record = create_defect_template()
          - print(record['defect_title'])
          output: '''Sample Defect Title'''
        - lines:
          - record = create_defect_template()
          - print(record)
          output: '{''defect_title'': ''Sample Defect Title'', ''defect_description'':
            ''A detailed description of the defect.'', ''reproduction_steps'': [''Step
            1'', ''Step 2'', ''Step 3''], ''expected_result'': ''Expected outcome.'',
            ''actual_result'': ''Actual outcome.'', ''severity_level'': 3, ''priority_level'':
            2, ''requirement_id'': ''REQ-001'', ''test_case_id'': ''TC-001'', ''reporter_name'':
            ''Alice'', ''date_reported'': ''2026-01-12'', ''status'': ''Open''}'
        parameters: []
        raises:
        - description: Raised if an internal validation fails (unlikely for a static
            template).
          type: ValueError
        returns:
          description: A dictionary containing the complete defect record with all
            required fields.
          type: Dict[str, Any]
        summary: Generate a standardized defect record template for consistent bug
          logging.
    prompt: Define fields and structure for consistent bug tracking including title,
      description, steps, expected/actual results, and metadata fields
  create_test_cases:
    agent: false
    description: Develop detailed test scenarios and procedures
    name: create_test_cases
    nodes_depended_on:
    - identify_test_requirements
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifiers for each test case
      key: test_case_ids
      type: List[str]
    - description: Identifier of the requirement each test case verifies
      key: requirement_ids
      type: List[str]
    - description: Brief title summarising the purpose of each test case
      key: test_titles
      type: List[str]
    - description: Detailed description of what the test case validates
      key: test_descriptions
      type: List[str]
    - description: Semicolon‑separated list of steps to execute the test case
      key: test_steps
      type: List[str]
    - description: Expected outcome for each test case
      key: expected_results
      type: List[str]
    - description: Priority level of each test case (1 = high, 5 = low)
      key: priority_levels
      type: List[int]
    prd:
      conceptual_info: The create_test_cases node takes a prioritized list of functional
        and technical requirements and automatically generates a comprehensive set
        of executable test cases. It maps each requirement to multiple detailed scenarios,
        assigns unique identifiers, and ranks each test case according to its criticality.
        These test cases feed directly into subsequent integration, system, and unit
        test executions.
      docstring:
        examples:
        - lines:
          - requirement_ids = [1, 2]
          - requirement_descriptions = ["Login must be HTTPS", "Password must be at
            least 12 characters"]
          - priority_levels = [1, 2]
          - result = create_test_cases(requirement_ids, requirement_descriptions,
            priority_levels)
          - print(result["test_titles"])
          output: '["HTTPS Login Test", "Password Length Validation Test"]'
        - lines:
          - '# Minimal example with a single requirement'
          - requirement_ids = [3]
          - requirement_descriptions = ["User profile can be updated"]
          - priority_levels = [3]
          - result = create_test_cases(requirement_ids, requirement_descriptions,
            priority_levels)
          - print(len(result["test_case_ids"]))
          output: '1'
        parameters:
        - description: Sequential numeric IDs assigned to each requirement by identify_test_requirements.
          name: requirement_ids
          type: List[int]
        - description: Human‑readable text describing each requirement.
          name: requirement_descriptions
          type: List[str]
        - description: Priority ranking for each requirement (1 = highest, 50 = lowest).
          name: priority_levels
          type: List[int]
        raises:
        - description: Raised when the input lists are empty or of mismatched lengths.
          type: ValueError
        - description: Raised when an input parameter is not of the expected type.
          type: TypeError
        returns:
          description: A dictionary containing lists of test case IDs, the requirement
            IDs they map to, titles, detailed descriptions, step sequences, expected
            outcomes, and priority levels.
          type: Dict[str, Any]
        summary: Generate a full suite of test cases from a list of testable requirements.
    prompt: Design 50-100 test cases covering all listed requirements with test steps,
      expected results, and priority levels
  define_test_scope:
    agent: false
    description: Establish boundaries and objectives of the testing cycle
    name: define_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Description of the system boundaries to be tested
      key: system_boundaries
      type: str
    - description: Objectives that the test cycle aims to achieve
      key: testing_objectives
      type: str
    - description: Criteria that determine whether the system meets the required standards
      key: acceptance_criteria
      type: str
    prd:
      conceptual_info: The `define_test_scope` node generates a concise, 200‑word
        document that delineates the scope of the testing cycle. It specifies what
        parts of the system are under test, the goals of the cycle, and the acceptance
        thresholds that must be satisfied for the cycle to be considered complete.
      docstring:
        examples:
        - lines:
          - print(scope['testing_objectives'])
          output: '"The primary objectives of this test cycle are to validate functional
            correctness, confirm boundary‑value handling, and ensure that all user‑visible
            flows meet the acceptance criteria defined in the requirements. Additional
            goals include identifying regressions from recent code changes and verifying
            that the system behaves predictably under normal load conditions."

            '
        parameters: []
        raises:
        - description: Raised if the generated document is not exactly 200 words.
          type: ValueError
        returns:
          description: A dictionary containing the keys `system_boundaries`, `testing_objectives`,
            and `acceptance_criteria`, each mapping to a string of the appropriate
            content.
          type: dict
        summary: Generate a 200‑word test scope document.
    prompt: Create a 200-word scope document defining system boundaries, testing objectives,
      and acceptance criteria for the test cycle
  execute_integration_tests:
    agent: false
    description: Verify component interaction stability
    name: execute_integration_tests
    nodes_depended_on:
    - create_test_cases
    - setup_test_environment
    - prepare_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers for each executed integration test case.
      key: test_case_id
      type: List[str]
    - description: Component(s) whose interface or dependency was validated in each
        test case.
      key: component_under_test
      type: List[str]
    - description: Pass (true) or fail (false) status for each test case.
      key: execution_status
      type: List[bool]
    - description: Execution duration in seconds for each test case.
      key: execution_time_seconds
      type: List[float]
    - description: Error or failure message for failed test cases; empty string for
        passed cases.
      key: error_message
      type: List[str]
    - description: List of components affected or involved in the test case.
      key: affected_components
      type: List[str]
    - description: Total number of integration test cases executed.
      key: total_tests_run
      type: int
    - description: Number of test cases that passed.
      key: passed_count
      type: int
    - description: Number of test cases that failed.
      key: failed_count
      type: int
    - description: 'Overall stability flag: true if all tests passed, false otherwise.'
      key: is_stable
      type: bool
    prd:
      conceptual_info: This node orchestrates the execution of integration test cases,
        validating that components interact correctly within the configured environment
        using supplied test data, and aggregates detailed results for reporting and
        defect logging.
      docstring:
        examples:
        - lines:
          - '# Prepare minimal mock inputs'
          - test_cases = [
          - '    {'
          - '        ''test_case_ids'': [''TC001''],'
          - '        ''requirement_ids'': [''REQ1''],'
          - '        ''test_titles'': [''Test DB Connection''],'
          - '        ''test_descriptions'': [''Verify DB connectivity''],'
          - '        ''test_steps'': [''Connect to DB'', ''Execute ping query''],'
          - '        ''expected_results'': [''Success''],'
          - '        ''priority_levels'': [1]'
          - '    }'
          - ']'
          - test_data = [
          - '    {'
          - '        ''requirement_id'': ''REQ1'','
          - '        ''requirement_title'': ''Database Connectivity'','
          - '        ''data_type'': ''str'','
          - '        ''valid_samples'': [''valid_connection_string''],'
          - '        ''invalid_samples'': [''invalid_connection_string''],'
          - '        ''sample_count'': 2'
          - '    }'
          - ']'
          - env_config = {
          - '    ''environment_name'': ''dev'','
          - '    ''hardware_configurations'': [''CPU:4 cores''],'
          - '    ''software_configurations'': [''Python 3.11'', ''PostgreSQL 15''],'
          - '    ''network_parameters'': [''localhost:5432''],'
          - '    ''data_setup_steps'': [''Create test DB''],'
          - '    ''configuration_document_path'': ''/docs/env/dev.yaml'','
          - '    ''setup_success'': True'
          - '}'
          - results = execute_integration_tests(test_cases, test_data, env_config)
          - print(results['total_tests_run'])
          output: '1'
        - lines:
          - '# Example with two test cases, one passing and one failing'
          - test_cases = [
          - '    {'
          - '        ''test_case_ids'': [''TC002''],'
          - '        ''requirement_ids'': [''REQ2''],'
          - '        ''test_titles'': [''Test API Endpoint''],'
          - '        ''test_descriptions'': [''Validate /users API''],'
          - '        ''test_steps'': [''Send GET /users'', ''Check status 200''],'
          - '        ''expected_results'': [''200 OK''],'
          - '        ''priority_levels'': [2]'
          - '    },'
          - '    {'
          - '        ''test_case_ids'': [''TC003''],'
          - '        ''requirement_ids'': [''REQ3''],'
          - '        ''test_titles'': [''Test Payment Processing''],'
          - '        ''test_descriptions'': [''Validate payment flow''],'
          - '        ''test_steps'': [''Initiate payment'', ''Verify receipt''],'
          - '        ''expected_results'': [''Receipt received''],'
          - '        ''priority_levels'': [1]'
          - '    }'
          - ']'
          - '# Assume test_data and env_config are defined as above'
          - results = execute_integration_tests(test_cases, test_data, env_config)
          - print(results['passed_count'])
          - print(results['failed_count'])
          output: '1

            1'
        parameters:
        - description: List of test case definitions generated by `create_test_cases`.
            Each dict must contain keys such as `test_case_ids`, `requirement_ids`,
            `test_titles`, `test_descriptions`, `test_steps`, `expected_results`,
            and `priority_levels`.
          name: test_cases
          type: List[Dict[str, Any]]
        - description: Synthetic input data produced by `prepare_test_data`. Each
            dict should include `requirement_id`, `requirement_title`, `data_type`,
            `valid_samples`, `invalid_samples`, and `sample_count`.
          name: test_data
          type: List[Dict[str, Any]]
        - description: Environment configuration from `setup_test_environment`, containing
            details like `environment_name`, `hardware_configurations`, `software_configurations`,
            `network_parameters`, `data_setup_steps`, `configuration_document_path`,
            and `setup_success`.
          name: env_config
          type: Dict[str, Any]
        raises:
        - description: If any of the input parameters are missing or empty.
          type: ValueError
        - description: If the test execution environment reports a configuration failure
            or a test harness error occurs.
          type: RuntimeError
        returns:
          description: A dictionary containing integration test results, including
            per-test status, timing, errors, affected components, and aggregated summary
            metrics.
          type: Dict[str, Any]
        summary: Execute integration tests and report detailed outcomes.
    prompt: Execute test cases validating interface/dependency relationships with
      associated test data and document execution results
  execute_system_tests:
    agent: false
    description: Validate full system conformance
    name: execute_system_tests
    nodes_depended_on:
    - create_test_cases
    - setup_test_environment
    - prepare_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers of the system test cases executed
      key: test_case_ids
      type: List[str]
    - description: Boolean flag indicating pass (true) or fail (false) for each test
        case
      key: passed_flags
      type: List[bool]
    - description: Execution time in seconds for each test case
      key: execution_times
      type: List[float]
    - description: List of defect identifiers discovered during execution
      key: defect_ids
      type: List[str]
    - description: Total number of test cases executed
      key: total_tests
      type: int
    - description: Number of test cases that passed
      key: total_passed
      type: int
    - description: Number of test cases that failed
      key: total_failed
      type: int
    - description: Overall pass rate expressed as a decimal between 0 and 1
      key: overall_pass_rate
      type: float
    prd:
      conceptual_info: The execute_system_tests node orchestrates full end‑to‑end
        validation of the target system. It receives a comprehensive list of test
        cases, the test environment configuration, and the corresponding synthetic
        or real test data. The node runs each test case against the fully deployed
        system, records pass/fail status, execution latency, and any defects that
        surface. The resulting aggregate metrics and defect identifiers are returned
        for downstream reporting and defect tracking.
      docstring:
        examples:
        - lines:
          - results = execute_system_tests(
          - '    test_cases=[{'
          - '        ''id'': ''TC001'','
          - '        ''steps'': ''Open app; Log in; Submit form; Verify confirmation'''
          - '    }],'
          - '    environment={'
          - '        ''url'': ''https://staging.example.com'','
          - '        ''auth'': ''Bearer token123'''
          - '    },'
          - '    test_data=[{'
          - '        ''requirement_id'': ''REQ001'','
          - '        ''valid_samples'': [''valid1'', ''valid2'']'
          - '    }])'
          output: "{\n  'test_case_ids': ['TC001'],\n  'passed_flags': [True],\n \
            \ 'execution_times': [12.3],\n  'defect_ids': [],\n  'total_tests': 1,\n\
            \  'total_passed': 1,\n  'total_failed': 0,\n  'overall_pass_rate': 1.0\n\
            }"
        - lines:
          - results = execute_system_tests([], {}, [])
          output: 'ValueError: Input lists must not be empty.'
        parameters:
        - description: A list of test case definitions generated by create_test_cases.
            Each dictionary must contain at least a unique 'id' field and the steps
            to execute.
          name: test_cases
          type: List[Dict[str, Any]]
        - description: Configuration dictionary describing the test environment returned
            by setup_test_environment. Includes deployment URLs, credentials, and
            runtime settings.
          name: environment
          type: Dict[str, Any]
        - description: Synthetic or pre‑seeded input data generated by prepare_test_data,
            keyed by requirement or test case id.
          name: test_data
          type: List[Dict[str, Any]]
        raises:
        - description: Raised if any of the required inputs (test_cases, environment,
            test_data) are missing or empty.
          type: ValueError
        - description: Raised when a test execution fails due to environment misconfiguration
            or unexpected runtime exceptions.
          type: RuntimeError
        returns:
          description: 'A dictionary containing per‑test metadata and aggregate statistics:

            - ''test_case_ids'': List[str]

            - ''passed_flags'': List[bool]

            - ''execution_times'': List[float]

            - ''defect_ids'': List[str]

            - ''total_tests'': int

            - ''total_passed'': int

            - ''total_failed'': int

            - ''overall_pass_rate'': float'
          type: Dict[str, Any]
        summary: Run full system conformance tests and return detailed results.
    prompt: Execute end-to-end test cases against complete system with associated
      test data and document execution results
  execute_unit_tests:
    agent: false
    description: Run lowest‑level component validation tests
    name: execute_unit_tests
    nodes_depended_on:
    - create_test_cases
    - setup_test_environment
    - prepare_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers of each unit test case executed
      key: test_case_ids
      type: List[str]
    - description: Number of test cases that passed
      key: passed_count
      type: int
    - description: Number of test cases that failed
      key: failed_count
      type: int
    - description: Percentage of test cases that passed (0.0 to 1.0)
      key: pass_rate
      type: float
    - description: Identifiers of test cases that failed
      key: failed_test_ids
      type: List[str]
    - description: Human‑readable failure details for each failed test case
      key: failure_descriptions
      type: List[str]
    - description: True if all unit tests passed, otherwise False
      key: is_successful
      type: bool
    prd:
      conceptual_info: The execute_unit_tests node is the low‑level validator that
        runs a suite of atomic unit tests against individual components in a pre‑configured
        test environment, aggregates pass/fail statistics, and surfaces any failures
        for defect logging and reporting.
      docstring:
        examples:
        - lines:
          - results = execute_unit_tests(
          - '    test_cases=["UT01", "UT02", "UT03"],'
          - '    test_data=['
          - '        {"name": "UT01", "inputs": [1, 2], "expected": 3},'
          - '        {"name": "UT02", "inputs": [5, 5], "expected": 10},'
          - '        {"name": "UT03", "inputs": [0, 0], "expected": 0},'
          - '    ],'
          - "    environment={\"environment_name\": \"dev-env\", \"setup_success\"\
            : True}\"\n                \")"
          - print(results["is_successful"])
          output: 'True'
        - lines:
          - results = execute_unit_tests(
          - '    test_cases=["UT01", "UT02"],'
          - '    test_data=['
          - '        {"name": "UT01", "inputs": [1, 2], "expected": 3},'
          - '        {"name": "UT02", "inputs": [5, 5], "expected": 11},  # intentional
            failure'
          - '    ],'
          - "    environment={\"environment_name\": \"dev-env\", \"setup_success\"\
            : True}\"\n                \")"
          - print(results["failed_test_ids"])
          - print(results["failure_descriptions"])
          output: '["UT02"]

            ["AssertionError: Expected 11, got 10 for test UT02"]'
        parameters:
        - description: A list of unique identifiers for unit tests to run.
          name: test_cases
          type: List[str]
        - description: A list of dictionaries containing input parameters and expected
            outputs for each test case.
          name: test_data
          type: List[Dict[str, Any]]
        - description: Configuration data returned from setup_test_environment, e.g.,
            hardware and software versions.
          name: environment
          type: Dict[str, Any]
        raises:
        - description: Raised when any required input list is empty or missing.
          type: ValueError
        - description: Raised if execution of any test case crashes or times out.
          type: RuntimeError
        returns:
          description: A dictionary containing aggregated test metrics and detailed
            failure information, conforming to the node's output structure.
          type: Dict[str, Any]
        summary: Executes unit test cases and aggregates the results.
    prompt: Execute test cases targeting atomic functionality with associated test
      data and document execution results
  generate_test_report:
    agent: false
    description: Compile statistical analysis and recommendations
    name: generate_test_report
    nodes_depended_on:
    - execute_unit_tests
    - execute_integration_tests
    - execute_system_tests
    - retest_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of test cases executed across all test types
      key: total_tests
      type: int
    - description: Total number of test cases that passed
      key: passed_tests
      type: int
    - description: Total number of test cases that failed
      key: failed_tests
      type: int
    - description: Percentage of tests that passed (0.0 to 100.0)
      key: pass_rate
      type: float
    - description: Percentage of tests that failed (0.0 to 100.0)
      key: fail_rate
      type: float
    - description: Total number of defects logged during the test cycle
      key: defect_count
      type: int
    - description: Counts of defects categorized by severity level in order [low,
        medium, high]
      key: defects_by_severity
      type: List[int]
    - description: Overall trend indicator (positive for improvement, negative for
        regression)
      key: trend_score
      type: float
    - description: Indicates if the system meets release readiness criteria
      key: ready_for_release
      type: bool
    - description: Date the report was generated (YYYY-MM-DD)
      key: report_date
      type: str
    prd:
      conceptual_info: generate_test_report aggregates unit, integration, system,
        and retest results to produce a concise statistical summary, defect overview,
        trend assessment, and a release readiness flag.
      docstring:
        examples:
        - lines:
          - unit_results = {
          - '    ''test_case_ids'': [''UT1'', ''UT2''],'
          - '    ''passed_count'': 2,'
          - '    ''failed_count'': 0,'
          - '    ''pass_rate'': 1.0,'
          - '    ''failed_test_ids'': [],'
          - '    ''failure_descriptions'': [],'
          - '    ''is_successful'': True'
          - '}'
          - integration_results = {
          - '    ''test_case_id'': [''IT1'', ''IT2'', ''IT3''],'
          - '    ''component_under_test'': [''CompA'', ''CompB'', ''CompC''],'
          - '    ''execution_status'': [True, False, True],'
          - '    ''execution_time_seconds'': [0.5, 1.2, 0.8],'
          - '    ''error_message'': ['''', ''NullPointer'', ''''],'
          - '    ''affected_components'': [''CompA'', ''CompB'', ''CompC''],'
          - '    ''total_tests_run'': 3,'
          - '    ''passed_count'': 2,'
          - '    ''failed_count'': 1,'
          - '    ''is_stable'': False'
          - '}'
          - system_results = {
          - '    ''test_case_ids'': [''ST1'', ''ST2'', ''ST3'', ''ST4''],'
          - '    ''passed_flags'': [True, True, False, True],'
          - '    ''execution_times'': [2.3, 1.9, 3.1, 2.0],'
          - '    ''defect_ids'': [''D1'', ''D2''],'
          - '    ''total_tests'': 4,'
          - '    ''total_passed'': 3,'
          - '    ''total_failed'': 1,'
          - '    ''overall_pass_rate'': 0.75'
          - '}'
          - retest_results = {
          - '    ''retested_defect_ids'': [''D1''],'
          - '    ''retest_pass_count'': 1,'
          - '    ''retest_fail_count'': 0,'
          - '    ''overall_retest_success'': True,'
          - '    ''retest_date'': ''2026-01-10'','
          - '    ''retest_summary'': ''All retested defects resolved.'''
          - '}'
          - report = generate_test_report(unit_results, integration_results, system_results,
            retest_results)
          - print(report['total_tests'])
          - print(report['defect_count'])
          output: '10

            2'
        - lines:
          - '# When all tests pass with no defects'
          - unit_results = {
          - '    ''test_case_ids'': [''UT1''],'
          - '    ''passed_count'': 1,'
          - '    ''failed_count'': 0,'
          - '    ''pass_rate'': 1.0,'
          - '    ''failed_test_ids'': [],'
          - '    ''failure_descriptions'': [],'
          - '    ''is_successful'': True'
          - '}'
          - integration_results = {
          - '    ''test_case_id'': [''IT1''],'
          - '    ''component_under_test'': [''CompA''],'
          - '    ''execution_status'': [True],'
          - '    ''execution_time_seconds'': [0.7],'
          - '    ''error_message'': [''''],'
          - '    ''affected_components'': [''CompA''],'
          - '    ''total_tests_run'': 1,'
          - '    ''passed_count'': 1,'
          - '    ''failed_count'': 0,'
          - '    ''is_stable'': True'
          - '}'
          - system_results = {
          - '    ''test_case_ids'': [''ST1''],'
          - '    ''passed_flags'': [True],'
          - '    ''execution_times'': [2.1],'
          - '    ''defect_ids'': [],'
          - '    ''total_tests'': 1,'
          - '    ''total_passed'': 1,'
          - '    ''total_failed'': 0,'
          - '    ''overall_pass_rate'': 1.0'
          - '}'
          - retest_results = {
          - '    ''retested_defect_ids'': [],'
          - '    ''retest_pass_count'': 0,'
          - '    ''retest_fail_count'': 0,'
          - '    ''overall_retest_success'': True,'
          - '    ''retest_date'': ''2026-01-10'','
          - '    ''retest_summary'': ''No defects to retest.'''
          - '}'
          - report = generate_test_report(unit_results, integration_results, system_results,
            retest_results)
          - print(report['pass_rate'])
          - print(report['ready_for_release'])
          output: '100.0

            True'
        parameters:
        - description: 'Output dictionary from execute_unit_tests. Expected keys:
            test_case_ids, passed_count, failed_count, pass_rate, failed_test_ids,
            failure_descriptions, is_successful.'
          name: unit_results
          type: dict
        - description: Output dictionary from execute_integration_tests. Expected
            keys include test_case_id, component_under_test, execution_status, execution_time_seconds,
            error_message, affected_components, total_tests_run, passed_count, failed_count,
            is_stable.
          name: integration_results
          type: dict
        - description: Output dictionary from execute_system_tests. Expected keys
            include test_case_ids, passed_flags, execution_times, defect_ids, total_tests,
            total_passed, total_failed, overall_pass_rate.
          name: system_results
          type: dict
        - description: Output dictionary from retest_defects. Expected keys include
            retested_defect_ids, retest_pass_count, retest_fail_count, overall_retest_success,
            retest_date, retest_summary.
          name: retest_results
          type: dict
        raises:
        - description: If any required key is missing from an input dictionary.
          type: ValueError
        - description: If the type of any input does not match the expected dictionary
            structure.
          type: TypeError
        returns:
          description: Dictionary containing the aggregated test statistics, defect
            counts, trend score, release readiness flag, and report generation date.
          type: dict
        summary: Generate a comprehensive test report from multiple test stages.
    prompt: Create test summary including pass/fail rates, defect statistics, trend
      analysis, and readiness assessment
  identify_test_requirements:
    agent: false
    description: Extract functional/technical requirements for verification
    name: identify_test_requirements
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Sequential numeric IDs assigned to each requirement
      key: requirement_ids
      type: List[int]
    - description: Textual description of each testable requirement
      key: requirement_descriptions
      type: List[str]
    - description: Priority ranking for each requirement (1 = highest, 50 = lowest)
      key: priority_levels
      type: List[int]
    prd:
      conceptual_info: The node analyses the test scope document to surface concrete,
        verifiable requirements that will guide test case design and defect tracking.
      docstring:
        examples:
        - lines:
          - "requirements = identify_test_requirements(\n    system_boundaries='User\
            \ authentication module',"
          - '    testing_objectives=''Verify login/logout flows'','
          - '    acceptance_criteria=''All flows pass with 99.9% uptime''

            )'
          - print(requirements['requirement_ids'][:5])
          - print(requirements['requirement_descriptions'][0])
          - print(requirements['priority_levels'][0])
          output: '[1, 2, 3, 4, 5]

            "User can log in with valid credentials"

            1'
        - lines:
          - 'try:'
          - '    identify_test_requirements(system_boundaries='''', testing_objectives=''X'',
            acceptance_criteria=''Y'')'
          - 'except ValueError as e:'
          - '    print(str(e))'
          output: '"system_boundaries cannot be empty."'
        parameters:
        - description: Description of the system boundaries to be tested (from define_test_scope
            output).
          name: system_boundaries
          type: str
        - description: Objectives that the test cycle aims to achieve (from define_test_scope
            output).
          name: testing_objectives
          type: str
        - description: Criteria that determine whether the system meets the required
            standards (from define_test_scope output).
          name: acceptance_criteria
          type: str
        raises:
        - description: Raised if any of the input strings is empty or None.
          type: ValueError
        - description: Raised if the inputs are not of type str.
          type: TypeError
        returns:
          description: 'A dictionary containing three keys: ''requirement_ids'' (List[int]),
            ''requirement_descriptions'' (List[str]), and ''priority_levels'' (List[int]).'
          type: dict
        summary: Generate a prioritized list of testable requirements based on the
          provided test scope.
    prompt: Generate a prioritized list of 25-50 testable requirements from documentation
      based on the established test scope
  log_defects:
    agent: false
    description: Record failed test cases with diagnostic information
    name: log_defects
    nodes_depended_on:
    - execute_unit_tests
    - execute_integration_tests
    - execute_system_tests
    nodes_dependent_on: []
    output_structure:
    - description: Unique numeric identifier of the test case that failed
      key: test_case_id
      type: int
    - description: Human‑readable name or description of the test case
      key: test_name
      type: str
    - description: ISO 8601 timestamp when the test case was executed
      key: execution_timestamp
      type: str
    - description: 'Category of the test: unit, integration, or system'
      key: test_type
      type: str
    - description: Configuration or environment where the failure occurred
      key: environment
      type: str
    - description: Ordered list of steps to reproduce the failure
      key: reproduction_steps
      type: str
    - description: Result that was expected according to the test specification
      key: expected_result
      type: str
    - description: Result that actually occurred during the test run
      key: actual_result
      type: str
    - description: 'Textual severity classification: Low, Medium, High, or Critical'
      key: severity_level
      type: str
    - description: Numeric code for severity (1=Low, 2=Medium, 3=High, 4=Critical)
      key: severity_code
      type: int
    - description: Identifier assigned to the logged defect in the tracking system
      key: defect_id
      type: str
    - description: 'Current status of the defect: Open, In Progress, Fixed, or Closed'
      key: defect_status
      type: str
    - description: Additional notes or observations about the failure
      key: comments
      type: str
    prd:
      conceptual_info: The log_defects node aggregates all failed test executions
        from unit, integration, and system test runs. It transforms raw failure metadata
        into a structured defect record that can be imported into a tracking system.
        Each defect record includes reproduction steps, expected vs actual outcomes,
        severity classification, and a unique defect ID for downstream retesting.
      docstring:
        examples:
        - lines:
          - unit_results = {
          - '    ''test_case_ids'': [''UC1'', ''UC2''],'
          - '    ''failed_test_ids'': [''UC2''],'
          - '    ''failure_descriptions'': [''Failed due to timeout''],'
          - '    ''is_successful'': False'
          - '}'
          - integration_results = {
          - '    ''test_case_id'': [''IT1'', ''IT2''],'
          - '    ''execution_status'': [True, False],'
          - '    ''error_message'': ['''', ''NullPointerException''],'
          - '    ''component_under_test'': [''AuthService'', ''AuthService''],'
          - '    ''execution_time_seconds'': [0.12, 0.47],'
          - '    ''affected_components'': [''AuthService''],'
          - '    ''is_stable'': False'
          - '}'
          - system_results = {
          - '    ''test_case_ids'': [''ST1''],'
          - '    ''passed_flags'': [False],'
          - '    ''defect_ids'': [''D123''],'
          - '    ''execution_times'': [3.5],'
          - '    ''overall_pass_rate'': 0.0'
          - '}'
          - defect_logs = log_defects(unit_results, integration_results, system_results)
          - print(defect_logs[0]['test_case_id'])
          output: UC2
        - lines:
          - '# Using a custom severity map'
          - 'severity_map = {''Low'': 1, ''Medium'': 2, ''High'': 3, ''Critical'':
            4}'
          - defect_logs = log_defects(unit_results, integration_results, system_results,
            severity_map)
          - print(defect_logs[1]['severity_code'])
          output: '3'
        parameters:
        - description: 'Dictionary containing unit test execution results. Expected
            keys: ''test_case_ids'', ''failed_test_ids'', ''failure_descriptions'',
            ''is_successful''. Each failure description should include the test name,
            timestamp, environment, reproduction steps, expected and actual results.'
          name: unit_results
          type: dict
        - description: 'Dictionary containing integration test execution results.
            Expected keys: ''test_case_id'', ''execution_status'', ''error_message'',
            ''component_under_test'', ''execution_time_seconds'', ''affected_components'',
            ''is_stable''. For each failed test, the error_message and component information
            are required.'
          name: integration_results
          type: dict
        - description: 'Dictionary containing system test execution results. Expected
            keys: ''test_case_ids'', ''passed_flags'', ''defect_ids'', ''execution_times'',
            ''overall_pass_rate''. For each failed test, the corresponding defect_id
            must be provided.'
          name: system_results
          type: dict
        - description: Optional mapping from textual severity to numeric code. Keys
            are severity strings ('Low', 'Medium', 'High', 'Critical') and values
            are integers 1–4. If omitted, a default mapping is used.
          name: severity_map
          type: dict
        raises:
        - description: If required fields are missing from any of the input result
            dictionaries.
          type: ValueError
        - description: If the input arguments are not of the expected types.
          type: TypeError
        returns:
          description: A list of defect dictionaries, each matching the output structure
            defined above.
          type: List[Dict[str, Any]]
        summary: Create defect logs from failed test results.
    prompt: Document failed test cases with detailed reproduction steps, expected
      vs actual results, and severity classification
  prepare_test_data:
    agent: false
    description: Generate input data for test execution
    name: prepare_test_data
    nodes_depended_on:
    - setup_test_environment
    - identify_test_requirements
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the requirement being tested
      key: requirement_id
      type: str
    - description: Short title or description of the requirement
      key: requirement_title
      type: str
    - description: Data type expected for this requirement (e.g., int, float, str,
        bool)
      key: data_type
      type: str
    - description: List of synthetic values that satisfy the requirement
      key: valid_samples
      type: str
    - description: List of synthetic values that intentionally violate the requirement
      key: invalid_samples
      type: str
    - description: Total number of sample values generated (sum of valid and invalid
        samples)
      key: sample_count
      type: int
    prd:
      conceptual_info: The prepare_test_data node fabricates realistic yet synthetic
        input payloads for each requirement, ensuring that downstream test execution
        modules have deterministic, verifiable data to validate system behavior under
        both normal and edge-case conditions.
      docstring:
        examples:
        - lines:
          - '# Sample requirement input'
          - requirements = [{
          - '    ''requirement_id'': ''R001'','
          - '    ''requirement_descriptions'': [''Maximum length of username''],'
          - '    ''priority_levels'': [1]'
          - '}]'
          - '# Sample environment (minimal stub)'
          - env_config = {
          - '    ''environment_name'': ''test-env-1'','
          - '    ''hardware_configurations'': [''CPU: 2 cores'', ''RAM: 4GB'']'
          - '}'
          - '# Invoke the node function'
          - test_data = prepare_test_data(env_config, requirements)
          output: "[{\n  'requirement_id': 'R001',\n  'requirement_title': 'Maximum\
            \ length of username',\n  'data_type': 'str',\n  'valid_samples': ['alice',\
            \ 'bob123'],\n  'invalid_samples': ['a'*51],\n  'sample_count': 3\n}]"
        - lines:
          - '# Another requirement with numeric data'
          - requirements = [{
          - '    ''requirement_id'': ''R002'','
          - '    ''requirement_descriptions'': [''Temperature threshold''],'
          - '    ''priority_levels'': [2]'
          - '}]'
          - test_data = prepare_test_data(env_config, requirements)
          output: "[{\n  'requirement_id': 'R002',\n  'requirement_title': 'Temperature\
            \ threshold',\n  'data_type': 'float',\n  'valid_samples': ['23.5', '30.0'],\n\
            \  'invalid_samples': ['-10', 'abc'],\n  'sample_count': 4\n}]"
        parameters:
        - description: Dictionary containing the environment configuration output
            from setup_test_environment.
          name: env_config
          type: dict
        - description: List of requirement dictionaries produced by identify_test_requirements.
            Each dictionary must contain at least 'requirement_id', 'requirement_descriptions',
            and 'priority_levels'.
          name: requirements
          type: List[dict]
        raises:
        - description: If env_config or requirements are missing required fields.
          type: ValueError
        - description: If an unsupported data_type is encountered.
          type: TypeError
        returns:
          description: A list of dictionaries, each conforming to the node's output
            structure.
          type: List[dict]
        summary: Generate structured test data for each requirement.
    prompt: Create synthetic test data with valid/invalid values for each identified
      requirement needing verifiable input
  retest_defects:
    agent: false
    description: Confirm defect resolution after fixes
    name: retest_defects
    nodes_depended_on:
    - log_defects
    nodes_dependent_on: []
    output_structure:
    - description: List of defect identifiers that were retested
      key: retested_defect_ids
      type: List[str]
    - description: Number of defects that passed retest
      key: retest_pass_count
      type: int
    - description: Number of defects that failed retest
      key: retest_fail_count
      type: int
    - description: Whether all retested defects passed
      key: overall_retest_success
      type: bool
    - description: Date when the retest was performed
      key: retest_date
      type: str
    - description: Brief summary of retest outcomes and observations
      key: retest_summary
      type: str
    prd:
      conceptual_info: The `retest_defects` node validates that defects logged during
        earlier test runs have been fixed. It re‑executes the exact test cases that
        originally failed, captures their new pass/fail status, aggregates statistics,
        and produces a concise report for integration into the overall test report.
      docstring:
        examples:
        - lines:
          - defect_records = [
          - '    {'
          - '        ''defect_id'': ''D-001'','
          - '        ''test_case_id'': 101,'
          - '        ''test_type'': ''unit'','
          - '        ''environment'': ''staging'','
          - '        ''execution_timestamp'': ''2025-12-01T10:15:00Z'','
          - '        ''test_name'': ''Login Validation'','
          - '        ''severity_level'': ''High'','
          - '        ''severity_code'': 3,'
          - '        ''defect_status'': ''Fixed'','
          - '        ''comments'': '''''
          - '    },'
          - '    {'
          - '        ''defect_id'': ''D-002'','
          - '        ''test_case_id'': 205,'
          - '        ''test_type'': ''integration'','
          - '        ''environment'': ''staging'','
          - '        ''execution_timestamp'': ''2025-12-01T10:18:00Z'','
          - '        ''test_name'': ''Payment Flow'','
          - '        ''severity_level'': ''Critical'','
          - '        ''severity_code'': 4,'
          - '        ''defect_status'': ''Fixed'','
          - '        ''comments'': '''''
          - '    }'
          - ']'
          - results = retest_defects(defect_records)
          - print(results['overall_retest_success'])
          output: 'True'
        - lines:
          - defect_records = [
          - '    {'
          - '        ''defect_id'': ''D-003'','
          - '        ''test_case_id'': 310,'
          - '        ''test_type'': ''system'','
          - '        ''environment'': ''production'','
          - '        ''execution_timestamp'': ''2025-12-01T11:00:00Z'','
          - '        ''test_name'': ''Data Export'','
          - '        ''severity_level'': ''Medium'','
          - '        ''severity_code'': 2,'
          - '        ''defect_status'': ''Fixed'','
          - '        ''comments'': '''''
          - '    }'
          - ']'
          - results = retest_defects(defect_records)
          - print(results['retest_summary'])
          output: '"1 defect(s) retested: 0 passed, 1 failed. Further investigation
            required for defect D-003."'
        parameters:
        - description: List of defect dictionaries produced by the `log_defects` node.
            Each dictionary must contain at least `defect_id`, `test_case_id`, `test_type`,
            `environment`, and `execution_timestamp` fields.
          name: defect_records
          type: List[Dict[str, Any]]
        raises:
        - description: Raised if the input list is empty or any required field is
            missing.
          type: ValueError
        - description: Raised if the underlying test execution framework cannot be
            reached.
          type: RuntimeError
        returns:
          description: A dictionary containing the retest results with keys matching
            the node's output structure.
          type: Dict[str, Any]
        summary: Run re‑testing of previously failed defects and report outcomes.
    prompt: Execute previously failed test cases against fixed system to verify resolution
      and document retest outcomes
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and configurations
    name: setup_test_environment
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Name of the test environment instance
      key: environment_name
      type: str
    - description: List of required hardware components and specifications
      key: hardware_configurations
      type: List[str]
    - description: List of software versions, patches, and configurations needed
      key: software_configurations
      type: List[str]
    - description: List of network settings such as IP ranges, port mappings, and
        protocols
      key: network_parameters
      type: List[str]
    - description: Step‑by‑step instructions for populating the environment with test
        data
      key: data_setup_steps
      type: List[str]
    - description: File system path or URL to the full configuration document
      key: configuration_document_path
      type: str
    - description: Indicates whether the environment was successfully configured
      key: setup_success
      type: bool
    prd:
      conceptual_info: This node orchestrates the creation of a fully configured test
        environment. It consumes the scope definitions produced by the `define_test_scope`
        node and transforms them into a concrete infrastructure specification, including
        hardware, software, networking, and data provisioning details. The output
        serves as the foundation for all downstream test execution nodes, ensuring
        that each test run occurs in a consistent and reproducible context.
      docstring:
        examples:
        - lines:
          - 'env = setup_test_environment(

            '
          - '    system_boundaries=''API layer only'',

            '
          - '    testing_objectives=''Validate CRUD operations'',

            '
          - '    acceptance_criteria=''All CRUD operations must return 200 OK and
            correct data.''

            '
          - )
          - print(env['environment_name'])
          output: '"Prod-API-Test-Env"'
        - lines:
          - 'env = setup_test_environment(

            '
          - '    system_boundaries=''Full stack'',

            '
          - '    testing_objectives=''Performance under load'',

            '
          - '    acceptance_criteria=''Response time < 500ms for 95% of requests.''

            '
          - )
          - print(env['network_parameters'])
          output: '["IP Range: 10.0.0.0/24", "Port 443: TLS", "Protocol: HTTPS"]'
        parameters:
        - description: Description of the system boundaries to be tested, as produced
            by `define_test_scope`.
          name: system_boundaries
          type: str
        - description: Objectives that the test cycle aims to achieve, as produced
            by `define_test_scope`.
          name: testing_objectives
          type: str
        - description: Criteria that determine whether the system meets the required
            standards, as produced by `define_test_scope`.
          name: acceptance_criteria
          type: str
        raises:
        - description: If any of the input parameters are empty or None, indicating
            incomplete scope information.
          type: ValueError
        returns:
          description: A dictionary containing the fully specified test environment
            configuration.
          type: dict
        summary: Prepare a fully‑configured test environment based on the test scope.
    prompt: Document all required hardware/software configurations, network parameters,
      and data setup steps for test environment
