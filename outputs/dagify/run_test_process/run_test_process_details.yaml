dag_type: plain_text
description: A self-contained workflow to execute a test process with parallelized
  test execution and result aggregation
name: run_test_process
nodes:
  analyze_test_results:
    agent: false
    description: Interpret quality metrics
    name: analyze_test_results
    nodes_depended_on:
    - collect_test_results
    nodes_dependent_on:
    - generate_test_report
    prompt: Analyze aggregated test results. Identify critical failures, performance
      anomalies, and pass rates
  collect_test_results:
    agent: false
    description: Aggregate test outcomes
    name: collect_test_results
    nodes_depended_on:
    - execute_unit_tests
    - execute_integration_tests
    - execute_performance_tests
    nodes_dependent_on:
    - analyze_test_results
    prompt: Compile all test execution results into standardized format. Format as
      JSON containing status codes, timestamps, and metrics
  create_test_data:
    agent: false
    description: Generate synthetic test data
    name: create_test_data
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - execute_unit_tests
    - execute_integration_tests
    - execute_performance_tests
    prompt: Create test datasets matching test requirements. Output should contain
      only test data specifications in JSON format
  define_test_scope:
    agent: false
    description: Specify the test objectives and boundaries
    name: define_test_scope
    nodes_depended_on: []
    nodes_dependent_on:
    - setup_test_environment
    - create_test_data
    prompt: 'Define the test scope: specify systems/components to test, test objectives,
      and success criteria. Output should be a single concise paragraph'
  execute_integration_tests:
    agent: false
    description: Validate system component interaction
    name: execute_integration_tests
    nodes_depended_on:
    - setup_test_environment
    - create_test_data
    nodes_dependent_on:
    - collect_test_results
    prompt: Run integration tests verifying component interfaces. Report status (SUCCESS/FAILURE)
      and error context for any failures
  execute_performance_tests:
    agent: false
    description: Stress and load testing
    name: execute_performance_tests
    nodes_depended_on:
    - setup_test_environment
    - create_test_data
    nodes_dependent_on:
    - collect_test_results
    prompt: Conduct load/performance testing. Provide throughput metrics, error rates,
      and response time statistics
  execute_unit_tests:
    agent: false
    description: Run atomic verification tests
    name: execute_unit_tests
    nodes_depended_on:
    - setup_test_environment
    - create_test_data
    nodes_dependent_on:
    - collect_test_results
    prompt: Execute unit level validation tests against core components. Output test
      status (PASS/FAIL) and brief error details if any
  generate_test_report:
    agent: false
    description: Create summary documentation
    name: generate_test_report
    nodes_depended_on:
    - analyze_test_results
    nodes_dependent_on: []
    prompt: 'Produce final test report: include test coverage statistics, failure
      analysis, and confidence levels. Format as concise markdown document'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure
    name: setup_test_environment
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - execute_unit_tests
    - execute_integration_tests
    prompt: 'Configure test environment: establish required systems, data pipelines,
      and monitoring tools. List only key infrastructure components'
