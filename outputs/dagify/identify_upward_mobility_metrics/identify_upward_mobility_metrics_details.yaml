dag_type: plain_text
description: Identifies and compiles key upward mobility metrics for the US by analyzing
  economic, educational, housing, healthcare, and socioeconomic factors through parallel
  research streams and validation steps.
name: identify_upward_mobility_metrics
nodes:
  collect_mobility_case_studies:
    agent: false
    description: Gather real-world mobility examples and expert analyses
    name: collect_mobility_case_studies
    nodes_depended_on:
    - identify_economic_mobility_metrics
    - identify_educational_mobility_metrics
    - identify_housing_mobility_metrics
    - identify_healthcare_mobility_metrics
    - identify_employment_mobility_metrics
    - identify_wealth_mobility_metrics
    - identify_inequality_mobility_metrics
    - identify_social_mobility_indices
    nodes_dependent_on:
    - rank_mobility_metrics
    prompt: Compile three case studies demonstrating high/low US mobility outcomes.
      Include academic research references, state-level experiments, and demographic-specific
      mobility patterns. Summarize findings.
  compile_mobility_metrics_report:
    agent: false
    description: Create final structured report with recommendations
    name: compile_mobility_metrics_report
    nodes_depended_on:
    - rank_mobility_metrics
    nodes_dependent_on: []
    prompt: 'Format all validated mobility metrics into a structured document. Include:
      1) quantitative metrics with sources, 2) case study conclusions, 3) ranked recommendations
      for policymakers, and 4) limitations of current metric frameworks.'
  identify_economic_mobility_metrics:
    agent: false
    description: List economic indicators used to measure long-term upward mobility
      in the US
    name: identify_economic_mobility_metrics
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: List five economic indicators used to measure upward mobility in the US,
      including GDP per capita growth, income growth rates, consumption patterns,
      employment-to-poverty ratios, and savings trends. Briefly explain each metric's
      relevance to mobility.
  identify_educational_mobility_metrics:
    agent: false
    description: Generate metrics for measuring educational advancement as a mobility
      factor
    name: identify_educational_mobility_metrics
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: 'Identify four educational mobility metrics: high school graduation rates,
      college enrollment ratios, STEM degree attainment, and scholarship accessibility.
      Explain how each impacts intergenerational mobility.'
  identify_employment_mobility_metrics:
    agent: false
    description: Generate employment-based upward mobility indicators
    name: identify_employment_mobility_metrics
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: 'List five employment mobility metrics: median wage growth, unionization
      rates, gig economy participation, job training program accessibility, and occupational
      mobility rates. Explain each metric''s relevance.'
  identify_healthcare_mobility_metrics:
    agent: false
    description: List healthcare access metrics for mobility evaluation
    name: identify_healthcare_mobility_metrics
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: 'Create a list of two healthcare mobility metrics: insurance coverage
      rates by income bracket and geographic healthcare access disparities. Briefly
      link each to long-term mobility patterns.'
  identify_housing_mobility_metrics:
    agent: false
    description: Create list of housing-related metrics for mobility analysis
    name: identify_housing_mobility_metrics
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: 'Generate three housing mobility indicators: homeownership rates, cost-burden
      percentages, and mortgage approval disparities across demographic groups. Describe
      each metric''s impact on economic mobility.'
  identify_inequality_mobility_metrics:
    agent: false
    description: Formulate inequality metrics that indicate mobility barriers
    name: identify_inequality_mobility_metrics
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: 'List three inequality-based mobility metrics: Gini coefficient trends,
      wealth distribution percentages across deciles, and income mobility ratios between
      birth and adult earnings. Explain each metric''s significance.'
  identify_policy_mobility_metrics:
    agent: false
    description: Generate government policy-linked mobility metrics
    name: identify_policy_mobility_metrics
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: 'List four policy-linked mobility metrics: earned income tax credit participation
      rates, childcare subsidy accessibility, housing voucher redemption rates, and
      vocational training program outcomes. Explain their mobility impact.'
  identify_social_mobility_indices:
    agent: false
    description: Identify existing composite mobility indices for US analysis
    name: identify_social_mobility_indices
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: 'List three national mobility indices: Social Mobility Index (SMI), Economic
      Opportunity Index (EOI), and Family Impact Rating Scale (FIRS). Describe the
      components of each composite metric.'
  identify_wealth_mobility_metrics:
    agent: false
    description: Create net worth and asset accumulation metrics for mobility analysis
    name: identify_wealth_mobility_metrics
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    prompt: 'Generate three wealth mobility indicators: net worth growth by income
      quintile, 401(k) participation rates across demographics, and intergenerational
      wealth transfer patterns. Describe each metric''s mobility implications.'
  rank_mobility_metrics:
    agent: false
    description: Prioritize metrics based on impact and data reliability
    name: rank_mobility_metrics
    nodes_depended_on:
    - validate_mobility_metrics_sources
    - collect_mobility_case_studies
    nodes_dependent_on:
    - compile_mobility_metrics_report
    prompt: Rank metrics by data accessibility, policy relevance, and analytical depth.
      Focus on US-specific metrics, grouping them by economic, educational, and structural
      categories. Include three most actionable recommendations.
  validate_mobility_metrics_sources:
    agent: false
    description: Evaluate data quality for all mobility metrics
    name: validate_mobility_metrics_sources
    nodes_depended_on:
    - identify_economic_mobility_metrics
    - identify_educational_mobility_metrics
    - identify_housing_mobility_metrics
    - identify_healthcare_mobility_metrics
    - identify_employment_mobility_metrics
    - identify_wealth_mobility_metrics
    - identify_inequality_mobility_metrics
    - identify_social_mobility_indices
    nodes_dependent_on:
    - rank_mobility_metrics
    prompt: Validate data quality for each listed mobility metric. For each, identify
      source agency, publication frequency, methodological consistency, and data limitations.
      Focus on US-specific datasets.
