      \ (\n        Field(..., description=\"List of core messages for each slide\"\
      )\n    )\n    objectives_summary: str = (\n        Field(..., description=\"\
      Summary of the objectives slides\")\n    )\n    strategy_overview: str = (\n\
      \        Field(..., description=\"Overview of the strategy slides\")\n    )\n\
      \    risk_return_analysis: str = (\n        Field(..., description=\"Summary\
      \ of the risk-return analysis slide\")\n    )\n    team_description: str = (\n\
      \        Field(..., description=\"Description of the team slide\")\n    )\n\
      \    operations_compliance_summary: str = (\n        Field(..., description=\"\
      Summary of the operations/compliance slides\")\n    )\n    financials_summary:\
      \ str = (\n        Field(..., description=\"Summary of the financials slides\"\
      )\n    )\n    qa_topics: List[str] = Field(..., description=\"List of Q&A topics\"\
      )\n\n\ndef compile_pitch_deck_outline(clarify_fund_objectives_input: ClarifyFundObjectivesOutput,\
      \ choose_investment_strategy_input: ChooseInvestmentStrategyOutput, define_investor_profile_input:\
      \ DefineInvestorProfileOutput, set_performance_and_risk_targets_input: SetPerformanceAndRiskTargetsOutput,\
      \ estimate_setup_and_operating_costs_input: EstimateSetupAndOperatingCostsOutput,\
      \ design_risk_management_framework_input: DesignRiskManagementFrameworkOutput,\
      \ draft_operations_workflow_input: DraftOperationsWorkflowOutput, **kwargs)\
      \ -> CompilePitchDeckOutlineOutput:\n    \"\"\"\n    Compile a comprehensive\
      \ outline for a 15-slide investor pitch deck,\n    integrating insights from\
      \ fund objectives, investment strategy, risk\n    management, and operational\
      \ compliance.\n\n    Parameters\n    ----------\n    objectives : List[str]\n\
      \        List of bullet points summarizing investment purpose, competitive\n\
