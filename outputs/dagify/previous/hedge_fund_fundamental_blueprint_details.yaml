dag_type: shim
description: Generated workflow from UI.
name: hedge_fund_fundamental_blueprint
nodes:
  choose_investment_strategy:
    agent: false
    code_node_type: shim
    description: Select primary investment approach
    implementation: "from ._choose_investment_strategy.validate_objectives_bullets\
      \ import validate_objectives_bullets\nfrom ._choose_investment_strategy.parse_fund_objectives\
      \ import parse_fund_objectives\nfrom ._choose_investment_strategy.determine_strategy_category\
      \ import determine_strategy_category\nfrom ._choose_investment_strategy.generate_strategy_rationale\
      \ import generate_strategy_rationale\nfrom ._choose_investment_strategy.assess_risk_profile\
      \ import assess_risk_profile\n\nfrom pydantic import BaseModel, Field\nfrom\
      \ typing import List\n\n\nclass ClarifyFundObjectivesOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for clarify_fund_objectives node outputs.\"\"\"\n  \
      \  objectives_bullets: List[str] = (\n        Field(..., description = (\n \
      \           \"Bullet points summarizing investment purpose, competitive advantages,\
      \ target return profiles, and long-term vision (maximum 8 bullets)\")\n    \
      \    )\n    )\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n    \"\"\
      \"Pydantic model for choose_investment_strategy node outputs.\"\"\"\n    strategy_category:\
      \ str = (\n        Field(..., description = (\n            \"The chosen primary\
      \ investment strategy category.\")\n        )\n    )\n    rationale: str = (\n\
      \        Field(..., description = (\n            \"A one-paragraph explanation\
      \ aligning the strategy with the fund's objectives.\")\n        )\n    )\n \
      \   risk_profile: str = (\n        Field(..., description = (\n            \"\
      A concise description of the expected risk profile associated with the chosen\
      \ strategy.\")\n        )\n    )\n\n\ndef choose_investment_strategy(clarify_fund_objectives_input:\
      \ ClarifyFundObjectivesOutput, **kwargs) -> ChooseInvestmentStrategyOutput:\n\
      \    \"\"\"\n    Selects the primary investment strategy category and generates\
      \ a rationale\n    and risk profile based on the fund's objectives.\n\n    Parameters\n\
      \    ----------\n    objectives_bullets : List[str]\n        Bullet points summarizing\
      \ the fund’s investment purpose, competitive\n        advantages, target return\
      \ profiles, and long-term vision (maximum 8\n        bullets). These are the\
      \ outputs of the parent node\n        `clarify_fund_objectives`.\n\n    Returns\n\
      \    -------\n    Dict[str, str]\n        A dictionary with keys `strategy_category`,\
      \ `rationale`, and\n        `risk_profile`, each mapping to a string describing\
      \ the chosen\n        strategy, its alignment with objectives, and the anticipated\
      \ risk\n        characteristics.\n\n    Raises\n    ------\n    ValueError\n\
      \        Raised if `objectives_bullets` is empty or does not contain any\n \
      \       actionable points.\n    RuntimeError\n        Raised if no suitable\
      \ strategy category can be inferred from the\n        provided objectives.\n\
      \n    Examples\n    --------\n    >>> strategy = choose_investment_strategy(objectives_bullets=[\n\
      \    ...     \"Generate 15% annual gross return through diversified equity\n\
      \    strategies.\",\n    ...     \"Maintain low correlation with global macro\
      \ factors.\",\n    ...     \"Leverage proprietary quantitative models.\",\n\
      \    ...     \"Target a volatility of 8-10%.\",\n    ...     \"Seek alpha in\
      \ both bull and bear markets.\",\n    ...     \"Operate within a liquid asset\
      \ universe.\",\n    ...     \"Aim for a Sharpe ratio above 1.5.\",\n    ...\
      \     \"Focus on long-term capital preservation.\"] )\n    >>> print(strategy['strategy_category'])\n\
      \    >>> print(strategy['rationale'])\n    >>> print(strategy['risk_profile'])\n\
      \    \"Event‑Driven Equity\"\\n\"The fund will focus on exploiting corporate\
      \ event\n    catalysts such as M&A, restructurings, and spin‑offs, leveraging\
      \ its\n    quantitative edge to generate asymmetric returns in both bullish\
      \ and bearish\n    market regimes. This aligns with the objective of producing\
      \ 15% gross annual\n    returns while maintaining low correlation to macro trends.\\\
      n\"The strategy\n    offers medium to high volatility with potential for sharp\
      \ downside during\n    illiquid event periods, but mitigated by strict position\
      \ limits and\n    liquidity buffers. Expected volatility: 8‑10% with drawdown\
      \ controls at\n    25%.\"\n\n    >>> strategy = choose_investment_strategy(objectives_bullets=[\n\
      \    ...     \"Provide long‑term growth for institutional pension funds.\",\n\
      \    ...     \"Capitalize on global macro opportunities.\",\n    ...     \"\
      Maintain a conservative risk appetite.\"] )\n    >>> print(strategy['strategy_category'])\n\
      \    \"Global Macro\"\n\n    \"\"\"\n    objectives_bullets = clarify_fund_objectives_input.objectives_bullets\n\
      \    \n    validated_objectives: List[str] = validate_objectives_bullets(objectives_bullets=objectives_bullets)\n\
      \    \n    parsed_objectives: dict = parse_fund_objectives(objectives_bullets=validated_objectives)\n\
      \    \n    strategy_category: str = determine_strategy_category(parsed_objectives=parsed_objectives)\n\
      \    \n    rationale: str = generate_strategy_rationale(strategy_category=strategy_category,\
      \ objectives=parsed_objectives)\n    \n    risk_profile: str = assess_risk_profile(strategy_category=strategy_category,\
      \ objectives=parsed_objectives)\n    \n    return ChooseInvestmentStrategyOutput(\n\
      \        strategy_category=strategy_category,\n        rationale=rationale,\n\
      \        risk_profile=risk_profile\n    )"
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen primary investment strategy category.
      key: strategy_category
      type: str
    - description: A one-paragraph explanation aligning the strategy with the fund's
        objectives.
      key: rationale
      type: str
    - description: A concise description of the expected risk profile associated with
        the chosen strategy.
      key: risk_profile
      type: str
    prd:
      conceptual_info: This node determines the flagship investment strategy for the
        hedge fund, ensuring alignment with the fund’s stated objectives, competitive
        positioning, and target return profile.
      docstring:
        examples:
        - lines:
          - strategy = choose_investment_strategy(objectives_bullets=[
          - '    "Generate 15% annual gross return through diversified equity strategies.",'
          - '    "Maintain low correlation with global macro factors.",'
          - '    "Leverage proprietary quantitative models.",'
          - '    "Target a volatility of 8-10%.",'
          - '    "Seek alpha in both bull and bear markets.",'
          - '    "Operate within a liquid asset universe.",'
          - '    "Aim for a Sharpe ratio above 1.5.",'
          - '    "Focus on long-term capital preservation."] )'
          - print(strategy['strategy_category'])
          - print(strategy['rationale'])
          - print(strategy['risk_profile'])
          output: '"Event‑Driven Equity"\n"The fund will focus on exploiting corporate
            event catalysts such as M&A, restructurings, and spin‑offs, leveraging
            its quantitative edge to generate asymmetric returns in both bullish and
            bearish market regimes. This aligns with the objective of producing 15%
            gross annual returns while maintaining low correlation to macro trends.\n"The
            strategy offers medium to high volatility with potential for sharp downside
            during illiquid event periods, but mitigated by strict position limits
            and liquidity buffers. Expected volatility: 8‑10% with drawdown controls
            at 25%."'
        - lines:
          - strategy = choose_investment_strategy(objectives_bullets=[
          - '    "Provide long‑term growth for institutional pension funds.",'
          - '    "Capitalize on global macro opportunities.",'
          - '    "Maintain a conservative risk appetite."] )'
          - print(strategy['strategy_category'])
          output: '"Global Macro"'
        parameters:
        - description: Bullet points summarizing the fund’s investment purpose, competitive
            advantages, target return profiles, and long-term vision (maximum 8 bullets).
            These are the outputs of the parent node `clarify_fund_objectives`.
          name: objectives_bullets
          type: List[str]
        raises:
        - description: Raised if `objectives_bullets` is empty or does not contain
            any actionable points.
          type: ValueError
        - description: Raised if no suitable strategy category can be inferred from
            the provided objectives.
          type: RuntimeError
        returns:
          description: A dictionary with keys `strategy_category`, `rationale`, and
            `risk_profile`, each mapping to a string describing the chosen strategy,
            its alignment with objectives, and the anticipated risk characteristics.
          type: Dict[str, str]
        summary: Selects the primary investment strategy category and generates a
          rationale and risk profile based on the fund's objectives.
    prompt: Identify one primary investment strategy category (e.g., long/short equity,
      event-driven, global macro) and provide a one-paragraph rationale aligning with
      the fund's objectives. Include expected risk profile.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: This shim function validates a list of bullet points summarizing
        investment purposes, competitive advantages, target return profiles, and long-term
        vision.
      implementation: "from typing import List\n\n\ndef validate_objectives_bullets(objectives_bullets:\
        \ str) -> List[str]:\n    \"\"\"\n    Validate a string of bullet points representing\
        \ investment objectives and\n    return a list of validated bullets.\n\n \
        \   Parameters\n    ----------\n    objectives_bullets : str\n        A string\
        \ containing bullet points to be validated, each representing\n        an\
        \ investment objective.\n\n    Returns\n    -------\n    List[str]\n     \
        \   A list of validated bullet points, with each point being a string.\n\n\
        \    Raises\n    ------\n    ValueError\n        If the input string is not\
        \ properly formatted or if any bullet point\n        is empty or missing.\n\
        \    TypeError\n        If the input is not a string.\n\n    Examples\n  \
        \  --------\n    >>> validated_bullets = validate_objectives_bullets(\"\\\
        n- Objective 1\\n-\n    Objective 2\\n\")\n    [\"- Objective 1\", \"- Objective\
        \ 2\"]\n\n    >>> try:\\n    validate_objectives_bullets(123)\\nexcept TypeError\
        \ as e:\\n\n    print(e)\n    Input must be a string.\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: validate_objectives_bullets
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: objectives_bullets
        type: str
      prd:
        conceptual_info: The validate_objectives_bullets shim plays a crucial role
          in the investment strategy selection process by ensuring the quality and
          consistency of the investment objectives provided.
        docstring:
          examples:
          - lines:
            - validated_bullets = validate_objectives_bullets("\n- Objective 1\n-
              Objective 2\n")
            output: '["- Objective 1", "- Objective 2"]'
          - lines:
            - try:\n    validate_objectives_bullets(123)\nexcept TypeError as e:\n    print(e)
            output: Input must be a string.
          parameters:
          - description: A string containing bullet points to be validated, each representing
              an investment objective.
            name: objectives_bullets
            type: str
          raises:
          - description: If the input string is not properly formatted or if any bullet
              point is empty or missing.
            type: ValueError
          - description: If the input is not a string.
            type: TypeError
          returns:
            description: A list of validated bullet points, with each point being
              a string.
            type: List[str]
          summary: Validate a string of bullet points representing investment objectives
            and return a list of validated bullets.
      prompt: Validate investment objectives bullets
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim function takes a string of fund objectives bullet points
        as input and returns a dictionary representing the parsed objectives.
      implementation: "def parse_fund_objectives(objectives_bullets: str) -> str:\n\
        \    \"\"\"\n    Parses a string of fund objectives bullet points into a structured\n\
        \    dictionary format.\n\n    Parameters\n    ----------\n    objectives_bullets\
        \ : str\n        A string containing fund objectives as bullet points.\n\n\
        \    Returns\n    -------\n    str\n        A JSON string representing the\
        \ parsed objectives as a dictionary.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the input string is not a valid representation of bullet points\n\
        \        or if parsing fails.\n    TypeError\n        If the input is not\
        \ a string.\n\n    Examples\n    --------\n    >>> objectives_str = \"• Investment\
        \ purpose: Long-term growth\\n• Competitive\n    advantages: Diversified portfolio\\\
        n• Target return profiles: 8-12% per\n    annum\"\n    >>> parsed_objectives\
        \ =\n    parse_fund_objectives(objectives_bullets=objectives_str)\n    {'investment_purpose':\
        \ 'Long-term growth', 'competitive_advantages':\n    'Diversified portfolio',\
        \ 'target_return_profiles': '8-12% per annum'}\n\n    >>> objectives_str =\
        \ \"• Long-term vision: Market leadership\\n• Risk\n    tolerance: Moderate\"\
        \n    >>> parsed_objectives =\n    parse_fund_objectives(objectives_bullets=objectives_str)\n\
        \    {'long_term_vision': 'Market leadership', 'risk_tolerance': 'Moderate'}\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: parse_fund_objectives
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: objectives_bullets
        type: str
      prd:
        conceptual_info: The parse_fund_objectives shim is responsible for interpreting
          and structuring fund objectives provided as unstructured bullet points into
          a usable format for further analysis or processing.
        docstring:
          examples:
          - lines:
            - 'objectives_str = "• Investment purpose: Long-term growth\n• Competitive
              advantages: Diversified portfolio\n• Target return profiles: 8-12% per
              annum"'
            - parsed_objectives = parse_fund_objectives(objectives_bullets=objectives_str)
            output: '{''investment_purpose'': ''Long-term growth'', ''competitive_advantages'':
              ''Diversified portfolio'', ''target_return_profiles'': ''8-12% per annum''}'
          - lines:
            - 'objectives_str = "• Long-term vision: Market leadership\n• Risk tolerance:
              Moderate"'
            - parsed_objectives = parse_fund_objectives(objectives_bullets=objectives_str)
            output: '{''long_term_vision'': ''Market leadership'', ''risk_tolerance'':
              ''Moderate''}'
          parameters:
          - description: A string containing fund objectives as bullet points.
            name: objectives_bullets
            type: str
          raises:
          - description: If the input string is not a valid representation of bullet
              points or if parsing fails.
            type: ValueError
          - description: If the input is not a string.
            type: TypeError
          returns:
            description: A JSON string representing the parsed objectives as a dictionary.
            type: str
          summary: Parses a string of fund objectives bullet points into a structured
            dictionary format.
      prompt: Implement a function to parse fund objectives from a given string of
        bullet points.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim determines the primary investment strategy category based
        on the parsed fund objectives.
      implementation: "def determine_strategy_category(parsed_objectives: str) ->\
        \ str:\n    \"\"\"\n    Determine the primary investment strategy category\
        \ based on the parsed fund\n    objectives.\n\n    Parameters\n    ----------\n\
        \    parsed_objectives : dict\n        A dictionary containing the parsed\
        \ fund objectives, including\n        investment purpose, competitive advantages,\
        \ target return profiles,\n        and long-term vision.\n\n    Returns\n\
        \    -------\n    str\n        The primary investment strategy category, such\
        \ as 'growth',\n        'income', 'balanced', or 'other'.\n\n    Raises\n\
        \    ------\n    ValueError\n        If the parsed objectives are invalid\
        \ or do not contain the required\n        information.\n    TypeError\n  \
        \      If the input is not a dictionary or does not match the expected\n \
        \       structure.\n\n    Examples\n    --------\n    >>> determine_strategy_category(parsed_objectives={'investment_purpose':\n\
        \    'long-term growth', 'target_return': 'high'})\n    'growth'\n\n    >>>\
        \ determine_strategy_category(parsed_objectives={'investment_purpose':\n \
        \   'income generation', 'target_return': 'low'})\n    'income'\n\n    \"\"\
        \"\n    raise NotImplementedError(\"This is a virtual stub node that needs\
        \ to be implemented\")"
      name: determine_strategy_category
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: parsed_objectives
        type: str
      prd:
        conceptual_info: This shim plays a crucial role in the investment strategy
          selection process by categorizing the primary investment strategy based
          on the fund's objectives.
        docstring:
          examples:
          - lines:
            - 'determine_strategy_category(parsed_objectives={''investment_purpose'':
              ''long-term growth'', ''target_return'': ''high''})'
            output: '''growth'''
          - lines:
            - 'determine_strategy_category(parsed_objectives={''investment_purpose'':
              ''income generation'', ''target_return'': ''low''})'
            output: '''income'''
          parameters:
          - description: A dictionary containing the parsed fund objectives, including
              investment purpose, competitive advantages, target return profiles,
              and long-term vision.
            name: parsed_objectives
            type: dict
          raises:
          - description: If the parsed objectives are invalid or do not contain the
              required information.
            type: ValueError
          - description: If the input is not a dictionary or does not match the expected
              structure.
            type: TypeError
          returns:
            description: The primary investment strategy category, such as 'growth',
              'income', 'balanced', or 'other'.
            type: str
          summary: Determine the primary investment strategy category based on the
            parsed fund objectives.
      prompt: Implement a function to determine the primary investment strategy category
        based on the provided parsed fund objectives.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim generates a rationale explaining why a particular investment
        strategy category is chosen based on the provided objectives.
      implementation: "def generate_strategy_rationale(strategy_category: str, objectives:\
        \ str) -> str:\n    \"\"\"\n    Generates a rationale for the chosen investment\
        \ strategy category based on\n    the provided objectives, serving as a key\
        \ component in justifying investment\n    decisions.\n\n    Parameters\n \
        \   ----------\n    strategy_category : str\n        The primary investment\
        \ strategy category chosen.\n    objectives : str\n        The fund's objectives,\
        \ including investment purpose, competitive\n        advantages, target return\
        \ profiles, and long-term vision.\n\n    Returns\n    -------\n    str\n \
        \       A one-paragraph explanation aligning the strategy with the fund's\n\
        \        objectives.\n\n    Raises\n    ------\n    ValueError\n        If\
        \ the strategy category or objectives are invalid or cannot be\n        aligned.\n\
        \    TypeError\n        If the input parameters are not of the correct type.\n\
        \n    Examples\n    --------\n    >>> rationale = generate_strategy_rationale(strategy_category=\"\
        Growth\",\n    objectives=\"Maximize returns, minimize risk\")\n    The growth\
        \ strategy is chosen to maximize returns while minimizing risk,\n    aligning\
        \ with the fund's objectives.\n\n    >>> rationale = generate_strategy_rationale(strategy_category=\"\
        Income\",\n    objectives=\"Generate consistent income, preserve capital\"\
        )\n    The income strategy is chosen to generate consistent income while preserving\n\
        \    capital, meeting the fund's investment goals.\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: generate_strategy_rationale
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: strategy_category
        type: str
      - description: Input parameter of type str
        key: objectives
        type: str
      prd:
        conceptual_info: The generate_strategy_rationale shim is responsible for creating
          a justification for selecting a specific investment strategy based on the
          fund's goals and objectives, serving as a crucial component in the investment
          strategy selection process.
        docstring:
          examples:
          - lines:
            - rationale = generate_strategy_rationale(strategy_category="Growth",
              objectives="Maximize returns, minimize risk")
            output: The growth strategy is chosen to maximize returns while minimizing
              risk, aligning with the fund's objectives.
          - lines:
            - rationale = generate_strategy_rationale(strategy_category="Income",
              objectives="Generate consistent income, preserve capital")
            output: The income strategy is chosen to generate consistent income while
              preserving capital, meeting the fund's investment goals.
          parameters:
          - description: The primary investment strategy category chosen.
            name: strategy_category
            type: str
          - description: The fund's objectives, including investment purpose, competitive
              advantages, target return profiles, and long-term vision.
            name: objectives
            type: str
          raises:
          - description: If the strategy category or objectives are invalid or cannot
              be aligned.
            type: ValueError
          - description: If the input parameters are not of the correct type.
            type: TypeError
          returns:
            description: A one-paragraph explanation aligning the strategy with the
              fund's objectives.
            type: str
          summary: Generates a rationale for the chosen investment strategy category
            based on the provided objectives, serving as a key component in justifying
            investment decisions.
      prompt: Generate a rationale for the chosen investment strategy category based
        on the fund's objectives.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: The assess_risk_profile shim evaluates and returns the risk profile
        associated with a given investment strategy category and fund objectives.
      implementation: "def assess_risk_profile(strategy_category: str, objectives:\
        \ str) -> str:\n    \"\"\"\n    Assesses the risk profile for an investment\
        \ strategy based on its category\n    and objectives, returning a concise\
        \ description of the expected risk.\n\n    Parameters\n    ----------\n  \
        \  strategy_category : str\n        The primary investment strategy category\
        \ (e.g., conservative,\n        moderate, aggressive).\n    objectives : str\n\
        \        The investment objectives of the fund, including purpose,\n     \
        \   competitive advantages, target return profiles, and long-term\n      \
        \  vision.\n\n    Returns\n    -------\n    str\n        A concise description\
        \ of the expected risk profile associated with\n        the chosen investment\
        \ strategy.\n\n    Raises\n    ------\n    ValueError\n        If the input\
        \ strategy category or objectives are invalid or cannot\n        be processed.\n\
        \    TypeError\n        If the input parameters are not of the correct type\
        \ (i.e., not\n        strings).\n\n    Examples\n    --------\n    >>> risk_profile\
        \ = assess_risk_profile('moderate', 'long-term growth with\n    moderate risk')\n\
        \    'The risk profile for this investment strategy is moderate, with potential\n\
        \    for long-term growth.'\n\n    >>> risk_profile = assess_risk_profile('aggressive',\
        \ 'high-return\n    investments with high risk tolerance')\n    'The risk\
        \ profile for this investment strategy is high, with potential for\n    significant\
        \ returns but also significant potential losses.'\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: assess_risk_profile
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: strategy_category
        type: str
      - description: Input parameter of type str
        key: objectives
        type: str
      prd:
        conceptual_info: The assess_risk_profile shim serves as a critical component
          in evaluating the risk associated with different investment strategies,
          helping to inform investment decisions.
        docstring:
          examples:
          - lines:
            - risk_profile = assess_risk_profile('moderate', 'long-term growth with
              moderate risk')
            output: '''The risk profile for this investment strategy is moderate,
              with potential for long-term growth.'''
          - lines:
            - risk_profile = assess_risk_profile('aggressive', 'high-return investments
              with high risk tolerance')
            output: '''The risk profile for this investment strategy is high, with
              potential for significant returns but also significant potential losses.'''
          parameters:
          - description: The primary investment strategy category (e.g., conservative,
              moderate, aggressive).
            name: strategy_category
            type: str
          - description: The investment objectives of the fund, including purpose,
              competitive advantages, target return profiles, and long-term vision.
            name: objectives
            type: str
          raises:
          - description: If the input strategy category or objectives are invalid
              or cannot be processed.
            type: ValueError
          - description: If the input parameters are not of the correct type (i.e.,
              not strings).
            type: TypeError
          returns:
            description: A concise description of the expected risk profile associated
              with the chosen investment strategy.
            type: str
          summary: Assesses the risk profile for an investment strategy based on its
            category and objectives, returning a concise description of the expected
            risk.
      prompt: Assess the risk profile for an investment strategy based on its category
        and objectives.
      shims: []
  choose_legal_entity_type:
    agent: false
    code_node_type: stub
    description: Determine appropriate legal structure
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass SelectJurisdictionOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ select_jurisdiction node outputs.\"\"\"\n    chosen_jurisdiction: str = (\n\
      \        Field(..., description=\"The name of the selected fund domicile\")\n\
      \    )\n    advantages: List[str] = (\n        Field(..., description = (\n\
      \            \"A list of two key advantages of the chosen jurisdiction\")\n\
