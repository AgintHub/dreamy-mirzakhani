    code_node_type: shim
    description: Creates a structured outline of the daily operational workflow for
      a hedge fund, mapping each stage of the trade lifecycle to responsible parties
      and indicating whether a vendor is involved.
    implementation: "from ._draft_operations_workflow.validate_input_requirements\
      \ import validate_input_requirements\nfrom ._draft_operations_workflow.define_operational_stages\
      \ import define_operational_stages\nfrom ._draft_operations_workflow.assign_stage_responsibilities\
      \ import assign_stage_responsibilities\nfrom ._draft_operations_workflow.determine_vendor_involvement\
      \ import determine_vendor_involvement\nfrom ._draft_operations_workflow.generate_stage_descriptions\
      \ import generate_stage_descriptions\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass DefineAssetUniverseOutput(BaseModel):\n \
      \   \"\"\"Pydantic model for define_asset_universe node outputs.\"\"\"\n   \
      \ instrument_names: List[str] = (\n        Field(..., description=\"Names of\
      \ the 10 selected tradable instruments\")\n    )\n    instrument_rationales:\
      \ List[str] = (\n        Field(..., description = (\n            \"Brief rationale\
      \ for each of the 10 selected instruments\")\n        )\n    )\n    asset_class_count:\
      \ int = (\n        Field(..., description = (\n            \"Total number of\
      \ distinct asset classes represented among the 10 instruments\")\n        )\n\
      \    )\n\n\nclass ListServiceProvidersOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for list_service_providers node outputs.\"\"\"\n    provider_names:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of mandatory\
      \ external service provider names in the order: prime broker, custodian, fund\
      \ administrator, legal counsel, compliance consultant.\")\n        )\n    )\n\
      \    provider_functions: List[str] = (\n        Field(..., description = (\n\
      \            \"Core function description for each provider, matching the order\
      \ of provider_names.\")\n        )\n    )\n\n\nclass DraftOperationsWorkflowOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for draft_operations_workflow node outputs.\"\"\"\n\
      \    stages: List[str] = (\n        Field(..., description = (\n           \
      \ \"Ordered list of operational stages from idea generation to settlement\"\
      )\n        )\n    )\n    responsible_parties: List[str] = (\n        Field(...,\
      \ description = (\n            \"Corresponding responsible party for each stage\
      \ (e.g., \"In-house\", \"Prime Broker\")\")\n        )\n    )\n    vendor_involved:\
      \ List[bool] = (\n        Field(..., description = (\n            \"Boolean\
      \ flag per stage indicating whether a vendor is involved (true = vendor, false\
      \ = in-house)\")\n        )\n    )\n    stage_descriptions: List[str] = (\n\
      \        Field(..., description = (\n            \"Brief description of activities\
      \ performed in each stage\")\n        )\n    )\n\n\ndef draft_operations_workflow(define_asset_universe_input:\
      \ DefineAssetUniverseOutput, list_service_providers_input: ListServiceProvidersOutput,\
      \ **kwargs) -> DraftOperationsWorkflowOutput:\n    \"\"\"\n    Builds a step‑by‑step\
      \ operational workflow for trade execution, mapping\n    responsibilities and\
      \ vendor involvement.\n\n    Parameters\n    ----------\n    asset_universe\
      \ : dict\n        Output of the `define_asset_universe` node containing\n  \
      \      `instrument_names`, `instrument_rationales`, and\n        `asset_class_count`.\
      \ Used to contextualize which assets will be\n        traded.\n    service_providers\
      \ : dict\n        Output of the `list_service_providers` node containing\n \
      \       `provider_names` and `provider_functions`. Provides the names of key\n\
      \        third‑party vendors.\n\n    Returns\n    -------\n    dict\n      \
      \  Dictionary with keys `stages`, `responsible_parties`,\n        `vendor_involved`,\
      \ and `stage_descriptions`, each holding a list of\n        strings or booleans.\n\
      \n    Raises\n    ------\n    ValueError\n        Raised if either input dict\
      \ is missing required keys.\n\n    Examples\n    --------\n    >>> # Mock inputs\n\
      \    >>> asset_universe = {\n    ...     'instrument_names': ['S&P 500 Futures',\
      \ 'Emerging Market Debt',\n    'Crude Oil Futures'],\n    ...     'instrument_rationales':\
      \ ['Liquidity', 'Yield potential',\n    'Diversification'],\n    ...     'asset_class_count':\
      \ 3\n    >>> }\n    >>> service_providers = {\n    ...     'provider_names':\
      \ ['Prime Broker', 'Custodian', 'Fund\n    Administrator', 'Legal Counsel',\
      \ 'Compliance Consultant'],\n    ...     'provider_functions': ['Order routing',\
      \ 'Safekeeping', 'NAV\n    calculations', 'Contract review', 'AML monitoring']\n\
      \    >>> }\n    >>> output = draft_operations_workflow(asset_universe, service_providers)\n\
      \    >>> print(output['stages'])\n    ['Idea Generation', 'Signal Generation',\
      \ 'Order Entry', 'Execution\n    Management', 'Position Monitoring', 'Reconciliation',\
      \ 'Settlement']\n\n    >>> print(output['vendor_involved'])\n    [False, False,\
      \ False, True, False, True, True]\n\n    \"\"\"\n    validate_input_requirements(asset_universe=define_asset_universe_input,\
      \ service_providers=list_service_providers_input)\n    \n    workflow_stages:\
      \ List[str] = define_operational_stages(asset_context=define_asset_universe_input)\n\
      \    \n    responsibility_mapping: List[str] = assign_stage_responsibilities(stages=workflow_stages,\
      \ providers=list_service_providers_input)\n    \n    vendor_flags: List[bool]\
      \ = determine_vendor_involvement(responsible_parties=responsibility_mapping)\n\
      \    \n    stage_descriptions: List[str] = generate_stage_descriptions(stages=workflow_stages,\
      \ asset_universe=define_asset_universe_input)\n    \n    return DraftOperationsWorkflowOutput(\n\
      \        stages=workflow_stages,\n        responsible_parties=responsibility_mapping,\n\
      \        vendor_involved=vendor_flags,\n        stage_descriptions=stage_descriptions\n\
      \    )"
