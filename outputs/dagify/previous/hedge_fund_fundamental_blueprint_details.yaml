  define_asset_universe:
    agent: false
    code_node_type: shim
    description: Specify eligible investment instruments for the hedge fund, ensuring
      alignment with the chosen investment strategy and compliance requirements.
    implementation: "from ._define_asset_universe.validate_input_parameters import\
      \ validate_input_parameters\nfrom ._define_asset_universe.get_available_instruments_database\
      \ import get_available_instruments_database\nfrom ._define_asset_universe.filter_instruments_by_strategy\
      \ import filter_instruments_by_strategy\nfrom ._define_asset_universe.prioritize_by_risk_profile\
      \ import prioritize_by_risk_profile\nfrom ._define_asset_universe.select_balanced_instruments\
      \ import select_balanced_instruments\nfrom ._define_asset_universe.extract_instrument_names\
      \ import extract_instrument_names\nfrom ._define_asset_universe.generate_instrument_rationales\
      \ import generate_instrument_rationales\nfrom ._define_asset_universe.count_distinct_asset_classes\
      \ import count_distinct_asset_classes\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_investment_strategy node outputs.\"\"\"\
      \n    strategy_category: str = (\n        Field(..., description = (\n     \
      \       \"The chosen primary investment strategy category.\")\n        )\n \
      \   )\n    rationale: str = (\n        Field(..., description = (\n        \
      \    \"A one-paragraph explanation aligning the strategy with the fund's objectives.\"\
      )\n        )\n    )\n    risk_profile: str = (\n        Field(..., description\
      \ = (\n            \"A concise description of the expected risk profile associated\
      \ with the chosen strategy.\")\n        )\n    )\n\n\nclass DefineAssetUniverseOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_asset_universe node outputs.\"\"\"\n  \
      \  instrument_names: List[str] = (\n        Field(..., description=\"Names of\
      \ the 10 selected tradable instruments\")\n    )\n    instrument_rationales:\
      \ List[str] = (\n        Field(..., description = (\n            \"Brief rationale\
      \ for each of the 10 selected instruments\")\n        )\n    )\n    asset_class_count:\
      \ int = (\n        Field(..., description = (\n            \"Total number of\
      \ distinct asset classes represented among the 10 instruments\")\n        )\n\
      \    )\n\n\ndef define_asset_universe(choose_investment_strategy_input: ChooseInvestmentStrategyOutput,\
      \ **kwargs) -> DefineAssetUniverseOutput:\n    \"\"\"\n    Generate a list of\
      \ 10 tradable financial instruments along with short\n    rationales and compute\
      \ the distinct asset class count.\n\n    Parameters\n    ----------\n    strategy_category\
      \ : str\n        Primary investment strategy category determined by the parent\
      \ node\n        (e.g., 'Long/Short Equity', 'Global Macro', 'Event‑Driven').\
      \ This\n        informs the asset selection.\n    strategy_rationale : str\n\
      \        One‑paragraph justification of the chosen strategy, used for\n    \
      \    contextual filtering of instruments.\n    risk_profile : str\n        Concise\
      \ description of the expected risk profile (e.g., 'High\n        volatility,\
      \ leverage‑enabled'). Helps prioritize high‑yield or\n        high‑liquidity\
      \ assets.\n\n    Returns\n    -------\n    dict\n        Dictionary with keys\
      \ `instrument_names` (List[str]),\n        `instrument_rationales` (List[str]),\
      \ and `asset_class_count` (int)\n        as defined in the node’s output structure.\n\
      \n    Raises\n    ------\n    ValueError\n        If any of the input parameters\
      \ are missing or empty.\n    RuntimeError\n        If the algorithm fails to\
      \ assemble 10 distinct instruments after\n        exhaustive search.\n\n   \
      \ Examples\n    --------\n    >>> # Example 1: Long/Short Equity strategy with\
      \ moderate risk\n    >>> result = define_asset_universe(\n\n    ...     strategy_category='Long/Short\
      \ Equity',\n\n    ...     strategy_rationale='Capitalize on market inefficiencies\
      \ while\n    providing downside protection.',\n    ...     risk_profile='Moderate\
      \ volatility with limited leverage.'\n\n    >>> )\n    {\n      'instrument_names':\
      \ [\n        'S&P 500 Equity Index',\n        'Nasdaq 100 Equity Index',\n \
      \       'US Treasury 10‑Year Bond',\n        'US Treasury 30‑Year Bond',\n \
      \       'Gold Futures',\n        'Oil Futures',\n        'EUR/USD Spot',\n \
      \       'US 10‑Year Treasury Futures',\n        'Emerging Market Corporate Bond\
      \ Index',\n        'Credit Default Swap on S&P 500'\n      ],\n      'instrument_rationales':\
      \ [\n        'Large‑cap equity exposure for core long bets.',\n        'High‑growth\
      \ tech exposure to balance risk.',\n        'Cash‑like instrument for portfolio\
      \ liquidity.',\n        'Long‑term yield curve play for duration control.',\n\
      \        'Inflation hedge and commodity diversification.',\n        'Oil price\
      \ volatility capture.',\n        'Currency overlay for hedge and speculation.',\n\
      \        'Leverage and duration adjustment via futures.',\n        'Diversification\
      \ into high‑yield debt markets.',\n        'Credit risk exposure and spread\
      \ trading.'\n      ],\n      'asset_class_count': 5\n    }\n\n    >>> # Example\
      \ 2: Global Macro strategy with high risk tolerance\n    >>> result = define_asset_universe(\n\
      \n    ...     strategy_category='Global Macro',\n\n    ...     strategy_rationale='Exploit\
      \ macroeconomic trends across asset\n    classes worldwide.',\n    ...     risk_profile='High\
      \ volatility, aggressive leverage allowed.'\n    )\n    {\n      'instrument_names':\
      \ [\n        'S&P 500 Futures',\n        'Euro Stoxx 50 Futures',\n        'US\
      \ Treasury 10‑Year Futures',\n        'US Treasury 30‑Year Futures',\n     \
      \   'Gold Spot',\n        'Crude Oil Spot',\n        'EUR/USD Forward',\n  \
      \      'Emerging Market Debt Futures',\n        'Credit Default Swap Index on\
      \ Emerging Markets',\n        'Volatility Index (VIX) Futures'\n      ],\n \
      \     'instrument_rationales': [\n        'Leverage on major equity markets.',\n\
      \        'Exposure to European equity trends.',\n        'Yield curve trade\
      \ for duration control.',\n        'Long‑term interest rate play.',\n      \
      \  'Inflation hedge.',\n        'Energy market speculation.',\n        'Currency\
      \ overlay for macro bets.',\n        'Emerging market debt trend exploitation.',\n\
      \        'Credit spread trading across emerging markets.',\n        'Volatility\
      \ capture and risk management.'\n      ],\n      'asset_class_count': 5\n  \
      \  }\n\n    \"\"\"\n    validate_input_parameters(\n        strategy_category=choose_investment_strategy_input.strategy_category,\n\
      \        strategy_rationale=choose_investment_strategy_input.rationale,\n  \
      \      risk_profile=choose_investment_strategy_input.risk_profile\n    )\n \
      \   \n    available_instruments: List[dict] = get_available_instruments_database()\n\
      \    \n    filtered_instruments: List[dict] = filter_instruments_by_strategy(\n\
      \        instruments=available_instruments,\n        strategy_category=choose_investment_strategy_input.strategy_category,\n\
      \        strategy_rationale=choose_investment_strategy_input.rationale\n   \
      \ )\n    \n    risk_prioritized_instruments: List[dict] = prioritize_by_risk_profile(\n\
      \        instruments=filtered_instruments,\n        risk_profile=choose_investment_strategy_input.risk_profile\n\
      \    )\n    \n    selected_instruments: List[dict] = select_balanced_instruments(\n\
      \        instruments=risk_prioritized_instruments,\n        target_count=10\n\
      \    )\n    \n    if len(selected_instruments) < 10:\n        raise RuntimeError(\"\
      Algorithm failed to assemble 10 distinct instruments after exhaustive search.\"\
      )\n    \n    instrument_names: List[str] = extract_instrument_names(instruments=selected_instruments)\n\
      \    instrument_rationales: List[str] = generate_instrument_rationales(\n  \
      \      instruments=selected_instruments,\n        strategy_category=choose_investment_strategy_input.strategy_category\n\
      \    )\n    \n    asset_class_count: int = count_distinct_asset_classes(instruments=selected_instruments)\n\
      \    \n    return DefineAssetUniverseOutput(\n        instrument_names=instrument_names,\n\
      \        instrument_rationales=instrument_rationales,\n        asset_class_count=asset_class_count\n\
      \    )"
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
