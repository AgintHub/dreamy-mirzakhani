  estimate_setup_and_operating_costs:
    agent: false
    code_node_type: stub
    description: Quantify financial requirements for launching a hedge fund by assembling
      a detailed cost matrix that aggregates vendor fees, technology implementation
      costs, and operational overhead. The node consumes structured outputs from three
      parent nodes—service provider list, technology stack details, and governance
      roles—to ensure that all relevant cost categories are captured. It outputs a
      list of line items with monthly and annual figures, cumulative budgets, and
      a concise textual overview highlighting key cost drivers.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ListServiceProvidersOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ list_service_providers node outputs.\"\"\"\n    provider_names: List[str]\
      \ = (\n        Field(..., description = (\n            \"List of mandatory external\
      \ service provider names in the order: prime broker, custodian, fund administrator,\
      \ legal counsel, compliance consultant.\")\n        )\n    )\n    provider_functions:\
      \ List[str] = (\n        Field(..., description = (\n            \"Core function\
      \ description for each provider, matching the order of provider_names.\")\n\
      \        )\n    )\n\n\nclass DefineTechnologyStackOutput(BaseModel):\n    \"\
      \"\"Pydantic model for define_technology_stack node outputs.\"\"\"\n    workflow_stages:\
      \ List[str] = (\n        Field(..., description = (\n            \"Ordered list\
      \ of workflow stages (e.g., Idea Generation, Signal Generation, Order Entry,\
      \ Execution Management, Position Monitoring, Reconciliation, Settlement).\"\
      )\n        )\n    )\n    technology_solutions: List[str] = (\n        Field(...,\
      \ description = (\n            \"Corresponding technology solution for each\
      \ stage (e.g., Data Analytics Platform, Portfolio Management System, OMS, FIX\
      \ Gateway, Risk Engine, Reconciliation Tool).\")\n        )\n    )\n    vendor_in_house_flags:\
      \ List[bool] = (\n        Field(..., description = (\n            \"Boolean\
      \ flag for each stage indicating whether the solution is implemented in-house\
      \ (true) or outsourced to a vendor (false).\")\n        )\n    )\n\n\nclass\
      \ OutlinerGovernanceStructureOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ outliner_governance_structure node outputs.\"\"\"\n    role_names: List[str]\
      \ = Field(..., description=\"Names of the roles\")\n    role_responsibility_1:\
      \ List[str] = (\n        Field(..., description=\"First responsibility for each\
      \ role\")\n    )\n    role_responsibility_2: List[str] = (\n        Field(...,\
      \ description=\"Second responsibility for each role\")\n    )\n    role_responsibility_3:\
      \ List[str] = (\n        Field(..., description=\"Third responsibility for each\
      \ role\")\n    )\n    role_authority_scope: List[str] = (\n        Field(...,\
      \ description=\"Authority scope for each role\")\n    )\n\n\nclass EstimateSetupAndOperatingCostsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for estimate_setup_and_operating_costs node outputs.\"\
      \"\"\n    service_provider_name: List[str] = (\n        Field(..., description\
      \ = (\n            \"Names of the service providers or cost categories\")\n\
      \        )\n    )\n    monthly_cost: List[float] = (\n        Field(..., description=\"\
      Monthly cost in USD for each service provider\")\n    )\n    annual_total: List[float]\
      \ = (\n        Field(..., description = (\n            \"Annual total cost in\
      \ USD for each service provider (Monthly Cost \\u00d7 12)\")\n        )\n  \
      \  )\n    total_monthly_budget: float = (\n        Field(..., description=\"\
      Sum of all monthly costs across providers\")\n    )\n    total_annual_budget:\
      \ float = (\n        Field(..., description=\"Sum of all annual totals across\
      \ providers\")\n    )\n    line_item_count: int = (\n        Field(..., description\
      \ = (\n            \"Number of line items included in the cost matrix (typically\
      \ 10\\u201115)\")\n        )\n    )\n    budget_overview: str = (\n        Field(...,\
      \ description = (\n            \"Short textual summary of the overall budget,\
      \ highlighting major cost drivers\")\n        )\n    )\n\n\ndef estimate_setup_and_operating_costs(list_service_providers_input:\
      \ ListServiceProvidersOutput, define_technology_stack_input: DefineTechnologyStackOutput,\
      \ outliner_governance_structure_input: OutlinerGovernanceStructureOutput, **kwargs)\
      \ -> EstimateSetupAndOperatingCostsOutput:\n    \"\"\"\n    Generate a cost\
      \ matrix that aggregates monthly and annual expenditures for\n    all service\
      \ providers, technology implementations, and governance roles.\n\n    Parameters\n\
      \    ----------\n    provider_names : List[str]\n        List of mandatory external\
      \ service provider names in the order:\n        prime broker, custodian, fund\
      \ administrator, legal counsel,\n        compliance consultant.\n    provider_functions\
      \ : List[str]\n        Core function description for each provider, matching\
      \ the order of\n        provider_names.\n    workflow_stages : List[str]\n \
      \       Ordered list of operational stages (e.g., Idea Generation, Signal\n\
      \        Generation, Order Entry, Execution Management, Position Monitoring,\n\
      \        Reconciliation, Settlement).\n    technology_solutions : List[str]\n\
      \        Corresponding technology solution for each workflow stage.\n    vendor_in_house_flags\
      \ : List[bool]\n        Boolean flag for each stage indicating whether the solution\
      \ is\n        implemented in‑house (True) or outsourced to a vendor (False).\n\
      \    role_names : List[str]\n        Names of internal governance roles.\n \
      \   role_responsibility_1 : List[str]\n        First responsibility for each\
      \ role.\n    role_responsibility_2 : List[str]\n        Second responsibility\
      \ for each role.\n    role_responsibility_3 : List[str]\n        Third responsibility\
      \ for each role.\n    role_authority_scope : List[str]\n        Authority scope\
      \ for each role.\n\n    Returns\n    -------\n    Dict[str, Union[List[str],\
      \ List[float], float, int]]\n        A dictionary containing the cost matrix,\
      \ totals, line item count,\n        and budget overview.\n\n    Raises\n   \
      \ ------\n    ValueError\n        Raised if any of the input lists have mismatched\
      \ lengths.\n    TypeError\n        Raised if inputs are not of the expected\
      \ types.\n\n    Examples\n    --------\n    >>> provider_names = [\"Prime Broker\"\
      , \"Custodian\", \"Fund Admin\", \"Legal\n    Counsel\", \"Compliance Consultant\"\
      ],\n    >>> provider_functions = [\"Trade execution and clearing\", \"Asset\n\
      \    safekeeping\", \"NAV calculation and reporting\", \"Legal advice\", \"\
      AML & KYC\n    oversight\"],\n    >>> workflow_stages = [\"Idea Generation\"\
      , \"Signal Generation\", \"Order\n    Entry\", \"Execution Management\", \"\
      Position Monitoring\", \"Reconciliation\",\n    \"Settlement\"],\n    >>> technology_solutions\
      \ = [\"Data Analytics\", \"Portfolio Mgmt\", \"OMS\", \"FIX\n    Gateway\",\
      \ \"Risk Engine\", \"Reconciliation Tool\", \"Settlement System\"],\n    >>>\
      \ vendor_in_house_flags = [True, True, False, False, True, False, False],\n\
      \    >>> role_names = [\"GP\", \"Investment Manager\", \"Compliance Officer\"\
      , \"Chief\n    Risk Officer\", \"Chief Operating Officer\"],\n    >>> role_responsibility_1\
      \ = [\"Set investment mandate\", \"Develop strategies\",\n    \"Ensure regulatory\
      \ compliance\", \"Define risk limits\", \"Oversee operations\"],\n    >>> role_responsibility_2\
      \ = [\"Allocate capital\", \"Monitor performance\",\n    \"Review AML policies\"\
      , \"Approve risk models\", \"Manage budgets\"],\n    >>> role_responsibility_3\
      \ = [\"Stakeholder communication\", \"Approve trades\",\n    \"Report violations\"\
      , \"Maintain risk register\", \"Coordinate vendors\"],\n    >>> role_authority_scope\
      \ = [\"Full authority\", \"Decision authority on\n    trades\", \"Legal & compliance\
      \ decisions\", \"Risk approval\", \"Operational\n    decisions\"],\n    >>>\
      \ budget = estimate_setup_and_operating_costs(provider_names,\n    provider_functions,\
      \ workflow_stages, technology_solutions,\n    vendor_in_house_flags, role_names,\
      \ role_responsibility_1,\n    role_responsibility_2, role_responsibility_3,\
      \ role_authority_scope)\n    {\\n  \"service_provider_name\": [\"Prime Broker\"\
      , \"Custodian\", \"Fund Admin\",\n    \"Legal Counsel\", \"Compliance Consultant\"\
      , \"Data Analytics\", \"Portfolio\n    Mgmt\", \"OMS\", \"FIX Gateway\", \"\
      Risk Engine\", \"Reconciliation Tool\",\n    \"Settlement System\"],\\n  \"\
      monthly_cost\": [12000.0, 8000.0, 5000.0, 3000.0,\n    2500.0, 4000.0, 3500.0,\
      \ 6000.0, 2000.0, 4500.0, 3000.0, 2500.0],\\n\n    \"annual_total\": [144000.0,\
      \ 96000.0, 60000.0, 36000.0, 30000.0, 48000.0,\n    42000.0, 72000.0, 24000.0,\
      \ 54000.0, 36000.0, 30000.0],\\n\n    \"total_monthly_budget\": 52000.0,\\n\
      \  \"total_annual_budget\": 624000.0,\\n\n    \"line_item_count\": 12,\\n  \"\
      budget_overview\": \"The annual budget totals\n    $624k, driven primarily by\
      \ prime broker ($144k), custodial services ($96k),\n    and technology implementations\
      \ such as OMS ($72k).\"\\n}\n\n    \"\"\"\n    return EstimateSetupAndOperatingCostsOutput(\n\
      \        service_provider_name=[],\n        monthly_cost=[],\n        annual_total=[],\n\
      \        total_monthly_budget=0.0,\n        total_annual_budget=0.0,\n     \
      \   line_item_count=0,\n        budget_overview=\"\",\n    )"
