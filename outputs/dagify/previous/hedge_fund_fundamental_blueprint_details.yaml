  define_technology_stack:
    agent: false
    code_node_type: stub
    description: Specify system infrastructure requirements
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DraftOperationsWorkflowOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for draft_operations_workflow node outputs.\"\"\"\n    stages: List[str] =\
      \ (\n        Field(..., description = (\n            \"Ordered list of operational\
      \ stages from idea generation to settlement\")\n        )\n    )\n    responsible_parties:\
      \ List[str] = (\n        Field(..., description = (\n            \"Corresponding\
      \ responsible party for each stage (e.g., \"In-house\", \"Prime Broker\")\"\
      )\n        )\n    )\n    vendor_involved: List[bool] = (\n        Field(...,\
      \ description = (\n            \"Boolean flag per stage indicating whether a\
      \ vendor is involved (true = vendor, false = in-house)\")\n        )\n    )\n\
      \    stage_descriptions: List[str] = (\n        Field(..., description = (\n\
      \            \"Brief description of activities performed in each stage\")\n\
      \        )\n    )\n\n\nclass DefineTechnologyStackOutput(BaseModel):\n    \"\
      \"\"Pydantic model for define_technology_stack node outputs.\"\"\"\n    workflow_stages:\
      \ List[str] = (\n        Field(..., description = (\n            \"Ordered list\
      \ of workflow stages (e.g., Idea Generation, Signal Generation, Order Entry,\
      \ Execution Management, Position Monitoring, Reconciliation, Settlement).\"\
      )\n        )\n    )\n    technology_solutions: List[str] = (\n        Field(...,\
      \ description = (\n            \"Corresponding technology solution for each\
      \ stage (e.g., Data Analytics Platform, Portfolio Management System, OMS, FIX\
      \ Gateway, Risk Engine, Reconciliation Tool).\")\n        )\n    )\n    vendor_in_house_flags:\
      \ List[bool] = (\n        Field(..., description = (\n            \"Boolean\
      \ flag for each stage indicating whether the solution is implemented in-house\
      \ (true) or outsourced to a vendor (false).\")\n        )\n    )\n\n\ndef define_technology_stack(draft_operations_workflow_input:\
      \ DraftOperationsWorkflowOutput, **kwargs) -> DefineTechnologyStackOutput:\n\
      \    \"\"\"\n    Generate a technology stack mapping for the hedge fund’s operational\n\
      \    workflow.\n\n    Parameters\n    ----------\n    workflow_stages : List[str]\n\
      \        Ordered list of workflow stages as produced by\n        `draft_operations_workflow`.\n\
      \    stage_descriptions : List[str]\n        Brief description of activities\
      \ performed in each stage (used for\n        contextual mapping).\n\n    Returns\n\
      \    -------\n    Dict[str, List[Any]]\n        A dictionary containing three\
      \ keys: - `workflow_stages` (List[str])\n        - `technology_solutions` (List[str])\
      \ - `vendor_in_house_flags`\n        (List[bool])\n\n    Raises\n    ------\n\
      \    ValueError\n        If the length of `workflow_stages` and `stage_descriptions`\
      \ do not\n        match.\n    KeyError\n        If a known workflow stage is\
      \ not present in the internal mapping.\n\n    Examples\n    --------\n    >>>\
      \ workflow_stages = [\"Idea Generation\", \"Signal Generation\", \"Order\n \
      \   Entry\", \"Execution Management\", \"Position Monitoring\", \"Reconciliation\"\
      ,\n    \"Settlement\"],\n    >>> stage_descriptions = [\n    ...     \"Generate\
      \ investment ideas via research and data analysis.\",\n    ...     \"Generate\
      \ buy/sell signals from quantitative models.\",\n    ...     \"Create order\
      \ records in the OMS.\",\n    ...     \"Route orders to market via FIX gateway.\"\
      ,\n    ...     \"Track open positions and P&L.\",\n    ...     \"Automated P&L\
      \ and trade reconciliation.\",\n    ...     \"Confirm settlements with custodians\
      \ and counterparties.\"]\n    >>> result = define_technology_stack(workflow_stages,\
      \ stage_descriptions)\n    >>> print(result)\n    {\n      \"workflow_stages\"\
      : [\"Idea Generation\", \"Signal Generation\", \"Order Entry\",\n    \"Execution\
      \ Management\", \"Position Monitoring\", \"Reconciliation\",\n    \"Settlement\"\
      ],\n      \"technology_solutions\": [\"Data Analytics Platform\", \"Quant Model\
      \ Engine\",\n    \"Order Management System\", \"FIX Gateway\", \"Risk Engine\"\
      , \"Reconciliation\n    Tool\", \"Settlement Service\"],\n      \"vendor_in_house_flags\"\
      : [true, true, false, false, true, false, false]\n    }\n\n    >>> # Using a\
      \ shortened workflow workflow_stages = [\"Signal Generation\",\n    \"Order\
      \ Entry\", \"Execution Management\"],\n    >>> stage_descriptions = [\n    ...\
      \     \"Generate buy/sell signals.\",\n    ...     \"Create orders.\",\n   \
      \ ...     \"Route to market.\"]\n    >>> print(define_technology_stack(workflow_stages,\
      \ stage_descriptions))\n    {\n      \"workflow_stages\": [\"Signal Generation\"\
      , \"Order Entry\", \"Execution\n    Management\"],\n      \"technology_solutions\"\
      : [\"Quant Model Engine\", \"Order Management System\",\n    \"FIX Gateway\"\
      ],\n      \"vendor_in_house_flags\": [true, false, false]\n    }\n\n    \"\"\
      \"\n    return DefineTechnologyStackOutput(\n        workflow_stages=[],\n \
      \       technology_solutions=[],\n        vendor_in_house_flags=[],\n    )"
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of workflow stages (e.g., Idea Generation, Signal
        Generation, Order Entry, Execution Management, Position Monitoring, Reconciliation,
        Settlement).
      key: workflow_stages
      type: List[str]
    - description: Corresponding technology solution for each stage (e.g., Data Analytics
        Platform, Portfolio Management System, OMS, FIX Gateway, Risk Engine, Reconciliation
        Tool).
      key: technology_solutions
      type: List[str]
    - description: Boolean flag for each stage indicating whether the solution is
        implemented in-house (true) or outsourced to a vendor (false).
      key: vendor_in_house_flags
      type: List[bool]
    prd:
      conceptual_info: The `define_technology_stack` node translates the operational
        workflow defined in `draft_operations_workflow` into a concrete technology
        roadmap. It aligns each lifecycle stage with a suitable platform or service
        and flags whether the capability will be built internally or sourced from
        a third‑party vendor. The output feeds cost estimation and vendor selection
        nodes downstream.
      docstring:
        examples:
        - lines:
          - workflow_stages = ["Idea Generation", "Signal Generation", "Order Entry",
            "Execution Management", "Position Monitoring", "Reconciliation", "Settlement"],
          - stage_descriptions = [
          - '    "Generate investment ideas via research and data analysis.",'
          - '    "Generate buy/sell signals from quantitative models.",'
          - '    "Create order records in the OMS.",'
          - '    "Route orders to market via FIX gateway.",'
          - '    "Track open positions and P&L.",'
          - '    "Automated P&L and trade reconciliation.",'
          - '    "Confirm settlements with custodians and counterparties."]'
          - result = define_technology_stack(workflow_stages, stage_descriptions)
          - print(result)
          output: "{\n  \"workflow_stages\": [\"Idea Generation\", \"Signal Generation\"\
            , \"Order Entry\", \"Execution Management\", \"Position Monitoring\",\
            \ \"Reconciliation\", \"Settlement\"],\n  \"technology_solutions\": [\"\
            Data Analytics Platform\", \"Quant Model Engine\", \"Order Management\
            \ System\", \"FIX Gateway\", \"Risk Engine\", \"Reconciliation Tool\"\
            , \"Settlement Service\"],\n  \"vendor_in_house_flags\": [true, true,\
            \ false, false, true, false, false]\n}"
        - lines:
          - '# Using a shortened workflow

            workflow_stages = ["Signal Generation", "Order Entry", "Execution Management"],'
          - stage_descriptions = [
          - '    "Generate buy/sell signals.",'
          - '    "Create orders.",'
          - '    "Route to market."]'
          - print(define_technology_stack(workflow_stages, stage_descriptions))
          output: "{\n  \"workflow_stages\": [\"Signal Generation\", \"Order Entry\"\
            , \"Execution Management\"],\n  \"technology_solutions\": [\"Quant Model\
            \ Engine\", \"Order Management System\", \"FIX Gateway\"],\n  \"vendor_in_house_flags\"\
            : [true, false, false]\n}"
        parameters:
        - description: Ordered list of workflow stages as produced by `draft_operations_workflow`.
          name: workflow_stages
          type: List[str]
        - description: Brief description of activities performed in each stage (used
            for contextual mapping).
          name: stage_descriptions
          type: List[str]
        raises:
        - description: If the length of `workflow_stages` and `stage_descriptions`
            do not match.
          type: ValueError
        - description: If a known workflow stage is not present in the internal mapping.
          type: KeyError
        returns:
          description: 'A dictionary containing three keys:

            - `workflow_stages` (List[str])

            - `technology_solutions` (List[str])

            - `vendor_in_house_flags` (List[bool])'
          type: Dict[str, List[Any]]
        summary: Generate a technology stack mapping for the hedge fund’s operational
          workflow.
    prompt: 'List required operational technology components for each workflow stage
      (e.g., order management system for trade execution). Format as two-column table:
      Workflow Stage | Technology Solution.'
    shims: []
  design_compliance_program:
    agent: false
    code_node_type: shim
    description: Creates a regulatory control framework by mapping required compliance
      items across three key domains—investor accreditation, subscription verification,
      and anti-money laundering—alongside their planned implementation dates.
    implementation: "from ._design_compliance_program.validate_inputs import validate_inputs\n\
      from ._design_compliance_program.generate_accreditation_items import generate_accreditation_items\n\
      from ._design_compliance_program.calculate_implementation_dates import calculate_implementation_dates\n\
      from ._design_compliance_program.generate_subscription_items import generate_subscription_items\n\
      from ._design_compliance_program.generate_aml_items import generate_aml_items\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ IdentifyRegulatoryRequirementsOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for identify_regulatory_requirements node outputs.\"\"\"\n    requirement:\
      \ str = (\n        Field(..., description = (\n            \"The specific regulatory\
      \ filing or registration required.\")\n        )\n    )\n    agency_citation:\
      \ str = (\n        Field(..., description = (\n            \"The regulatory\
      \ agency and citation or form number associated with the requirement.\")\n \
      \       )\n    )\n    implementation_notes: List[str] = (\n        Field(...,\
      \ description = (\n            \"One or two brief notes describing how to implement\
      \ or comply with the requirement.\")\n        )\n    )\n\n\nclass DefineInvestorProfileOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_investor_profile node outputs.\"\"\"\n\
      \    typical_investor_types: List[str] = (\n        Field(..., description =\
      \ (\n            \"List of typical investor types (e.g., family offices, pensions)\"\
      )\n        )\n    )\n    required_minimum_investment: int = (\n        Field(...,\
      \ description=\"Required minimum investment in USD\")\n    )\n    liquidity_expectations:\
      \ str = (\n        Field(..., description=\"Description of liquidity expectations\"\
      )\n    )\n    risk_tolerance_levels: List[str] = (\n        Field(..., description\
      \ = (\n            \"List of risk tolerance levels (e.g., aggressive, conservative)\"\
      )\n        )\n    )\n    geographic_focus: str = (\n        Field(..., description=\"\
      Description of geographic focus\")\n    )\n\n\nclass DesignComplianceProgramOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for design_compliance_program node outputs.\"\"\"\n\
      \    accreditation_items: List[str] = (\n        Field(..., description = (\n\
      \            \"List of investor accreditation standard items required for compliance\"\
      )\n        )\n    )\n    accreditation_dates: List[str] = (\n        Field(...,\
      \ description = (\n            \"Implementation dates for each accreditation\
      \ item (YYYY-MM-DD format)\")\n        )\n    )\n    subscription_items: List[str]\
      \ = (\n        Field(..., description = (\n            \"List of subscription\
      \ verification procedures to be followed\")\n        )\n    )\n    subscription_dates:\
      \ List[str] = (\n        Field(..., description = (\n            \"Implementation\
      \ dates for each subscription procedure (YYYY-MM-DD format)\")\n        )\n\
      \    )\n    aml_items: List[str] = (\n        Field(..., description = (\n \
      \           \"List of anti-money laundering policy items to implement\")\n \
      \       )\n    )\n    aml_dates: List[str] = (\n        Field(..., description\
      \ = (\n            \"Implementation dates for each AML policy item (YYYY-MM-DD\
      \ format)\")\n        )\n    )\n\n\ndef design_compliance_program(identify_regulatory_requirements_input:\
      \ IdentifyRegulatoryRequirementsOutput, define_investor_profile_input: DefineInvestorProfileOutput,\
      \ **kwargs) -> DesignComplianceProgramOutput:\n    \"\"\"\n    Generate compliance\
      \ checklists for investor accreditation, subscription\n    verification, and\
      \ AML policies, each paired with an implementation date.\n\n    Parameters\n\
      \    ----------\n    regulatory_requirements : List[Dict[str, Any]]\n      \
      \  Output from identify_regulatory_requirements. Each dict contains\n      \
      \  keys 'requirement', 'agency_citation', and 'implementation_notes'.\n    \
      \    These provide the regulatory basis for accreditation, subscription,\n \
      \       and AML items.\n    investor_profile : Dict[str, Any]\n        Output\
      \ from define_investor_profile. Contains fields such as\n        'typical_investor_types',\
      \ 'required_minimum_investment',\n        'liquidity_expectations', 'risk_tolerance_levels',\
      \ and\n        'geographic_focus'. These inform the specificity of accreditation\n\
      \        and subscription items.\n\n    Returns\n    -------\n    Dict[str,\
      \ List[str]]\n        A dictionary with six keys—accreditation_items, accreditation_dates,\n\
      \        subscription_items, subscription_dates, aml_items, aml_dates—each\n\
      \        mapping to a list of strings.\n\n    Raises\n    ------\n    ValueError\n\
      \        If either input list is empty or missing required keys.\n    TypeError\n\
      \        If inputs are not of the expected types.\n\n    Examples\n    --------\n\
      \    >>> # Example 1: Basic compliance program generation\n    >>> reg_req =\
      \ [\n    ...   {'requirement': 'SEC Form ADV', 'agency_citation': 'SEC',\n \
      \   'implementation_notes': ['File annually', 'Update bi‑annually']},\n    ...\
      \   {'requirement': 'FINRA Membership', 'agency_citation': 'FINRA',\n    'implementation_notes':\
      \ ['Apply within 30 days']}\n    >>> ]\n    >>> inv_prof = {\n    ...   'typical_investor_types':\
      \ ['Family Office', 'Pension Fund'],\n    ...   'required_minimum_investment':\
      \ 5000000,\n    ...   'liquidity_expectations': 'Monthly',\n    ...   'risk_tolerance_levels':\
      \ ['Aggressive'],\n    ...   'geographic_focus': 'US'\"\n                \"\
      }\n    >>> result = design_compliance_program(reg_req, inv_prof)\n    >>> print(result['accreditation_items'])\n\
      \    ['SEC Form ADV', 'FINRA Membership']\n\n    >>> # Example 2: Validation\
      \ error when inputs missing\n    >>> try:\n    ...   design_compliance_program([],\
      \ inv_prof)\n    >>> except ValueError as e:\n    ...   print(str(e))\n    Input\
      \ regulatory_requirements list is empty.\n\n    \"\"\"\n    validate_inputs(regulatory_requirements=identify_regulatory_requirements_input,\
      \ investor_profile=define_investor_profile_input)\n    \n    accreditation_items:\
      \ List[str] = generate_accreditation_items(regulatory_requirements=identify_regulatory_requirements_input,\
      \ investor_profile=define_investor_profile_input)\n    accreditation_dates:\
      \ List[str] = calculate_implementation_dates(items=accreditation_items, category=\"\
      accreditation\")\n    \n    subscription_items: List[str] = generate_subscription_items(regulatory_requirements=identify_regulatory_requirements_input,\
      \ investor_profile=define_investor_profile_input)\n    subscription_dates: List[str]\
      \ = calculate_implementation_dates(items=subscription_items, category=\"subscription\"\
      )\n    \n    aml_items: List[str] = generate_aml_items(regulatory_requirements=identify_regulatory_requirements_input,\
      \ investor_profile=define_investor_profile_input)\n    aml_dates: List[str]\
      \ = calculate_implementation_dates(items=aml_items, category=\"aml\")\n    \n\
      \    return DesignComplianceProgramOutput(\n        accreditation_items=accreditation_items,\n\
      \        accreditation_dates=accreditation_dates,\n        subscription_items=subscription_items,\n\
      \        subscription_dates=subscription_dates,\n        aml_items=aml_items,\n\
      \        aml_dates=aml_dates\n    )"
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - define_investor_profile
    nodes_dependent_on: []
    output_structure:
    - description: List of investor accreditation standard items required for compliance
      key: accreditation_items
      type: List[str]
    - description: Implementation dates for each accreditation item (YYYY-MM-DD format)
      key: accreditation_dates
      type: List[str]
    - description: List of subscription verification procedures to be followed
      key: subscription_items
      type: List[str]
    - description: Implementation dates for each subscription procedure (YYYY-MM-DD
        format)
      key: subscription_dates
      type: List[str]
    - description: List of anti-money laundering policy items to implement
      key: aml_items
      type: List[str]
    - description: Implementation dates for each AML policy item (YYYY-MM-DD format)
      key: aml_dates
      type: List[str]
    prd:
      conceptual_info: The node synthesizes regulatory requirements identified earlier
        and investor profile constraints into a structured compliance program. It
        outputs three parallel lists of checklist items and their corresponding launch
        dates, ready for inclusion in a spreadsheet or project tracking tool.
      docstring:
        examples:
        - lines:
          - '# Example 1: Basic compliance program generation'
          - reg_req = [
          - '  {''requirement'': ''SEC Form ADV'', ''agency_citation'': ''SEC'', ''implementation_notes'':
            [''File annually'', ''Update bi‑annually'']},'
          - '  {''requirement'': ''FINRA Membership'', ''agency_citation'': ''FINRA'',
            ''implementation_notes'': [''Apply within 30 days'']}'
          - ']'
          - inv_prof = {
          - '  ''typical_investor_types'': [''Family Office'', ''Pension Fund''],'
          - '  ''required_minimum_investment'': 5000000,'
          - '  ''liquidity_expectations'': ''Monthly'','
          - '  ''risk_tolerance_levels'': [''Aggressive''],'
          - "  'geographic_focus': 'US'\"\n                \"}"
          - result = design_compliance_program(reg_req, inv_prof)
          - print(result['accreditation_items'])
          output: '[''SEC Form ADV'', ''FINRA Membership'']'
        - lines:
          - '# Example 2: Validation error when inputs missing'
          - 'try:'
          - '  design_compliance_program([], inv_prof)'
          - 'except ValueError as e:'
          - '  print(str(e))'
          output: Input regulatory_requirements list is empty.
        parameters:
