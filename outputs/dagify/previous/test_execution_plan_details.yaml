dag_type: plain_text
description: A workflow that creates a test environment, writes a sample test script,
  runs the tests, and captures the results.
name: test_execution_plan
nodes:
  collect_test_results:
    agent: false
    description: Analyzes the test run result and formats it for reporting.
    name: collect_test_results
    nodes_depended_on:
    - run_test_script
    nodes_dependent_on: []
    prompt: 'Parse the captured output to determine if the test passed or failed.
      Return a JSON object with keys `status` (values: `passed` or `failed`) and `details`
      containing the raw output.'
  create_test_directory:
    agent: false
    description: Sets up the folder structure required for test files.
    name: create_test_directory
    nodes_depended_on: []
    nodes_dependent_on:
    - write_test_script
    prompt: Create a directory named `tests` in the current working directory. If
      the directory already exists, do nothing.
  run_test_script:
    agent: false
    description: Runs the test and collects raw output.
    name: run_test_script
    nodes_depended_on:
    - write_test_script
    nodes_dependent_on:
    - collect_test_results
    prompt: Execute the test script using the command `python -m unittest tests/sample_test.py`
      and capture the stdout and exit code.
  write_test_script:
    agent: false
    description: Writes a minimal test script to be executed.
    name: write_test_script
    nodes_depended_on:
    - create_test_directory
    nodes_dependent_on:
    - run_test_script
    prompt: Create a file `tests/sample_test.py` containing a simple unit test that
      asserts `1 + 1 == 2`. Use Python's `unittest` framework.
