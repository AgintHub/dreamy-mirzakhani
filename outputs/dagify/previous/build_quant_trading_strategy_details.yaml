dag_type: plain_text
description: A detailed, concurrent workflow for designing, testing, and deploying
  a quantitative trading strategy from data acquisition to live execution.
name: build_quant_trading_strategy
nodes:
  adjust_risk_controls:
    agent: false
    description: Modify risk parameters to align with performance objectives.
    name: adjust_risk_controls
    nodes_depended_on:
    - evaluate_backtest_results
    nodes_dependent_on:
    - finalize_strategy_documentation
    prompt: If drawdown exceeds the target, suggest position‑size scaling or tighter
      stop‑loss. If Sharpe is low, propose feature or model adjustments. Return a
      revised trading rule if changes are made.
  backtest_strategy:
    agent: false
    description: Simulate strategy performance on unseen data.
    name: backtest_strategy
    nodes_depended_on:
    - normalize_and_split_data
    - develop_trading_rule
    nodes_dependent_on:
    - evaluate_backtest_results
    - adjust_risk_controls
    prompt: Run the trading rule on the test set, simulating daily orders, slippage
      0.05%, and transaction costs 5 bps. Generate P&L, drawdown, Sharpe, and turnover
      metrics. Output a CSV of trade logs.
  clean_and_store_raw_data:
    agent: false
    description: Prepare clean, stored market data ready for feature engineering.
    name: clean_and_store_raw_data
    nodes_depended_on:
    - collect_market_data
    - define_eligibility_criteria
    nodes_dependent_on:
    - generate_feature_set
    prompt: 'For each selected instrument, clean the data: adjust for splits/dividends,
      interpolate missing values, and store in a time‑series database. Provide a status
      report of cleaned records.'
  collect_market_data:
    agent: false
    description: Gather raw market data required for analysis.
    name: collect_market_data
    nodes_depended_on:
    - select_asset_universe
    nodes_dependent_on:
    - clean_and_store_raw_data
    - extract_market_factors
    prompt: Retrieve historical price and volume data for each instrument in the asset
      universe covering the last 10 years. Include OHLCV and adjusted close. Output
      in CSV format.
  define_eligibility_criteria:
    agent: false
    description: Filter the asset universe to suitable trading candidates.
    name: define_eligibility_criteria
    nodes_depended_on:
    - select_asset_universe
    nodes_dependent_on:
    - clean_and_store_raw_data
    prompt: 'Specify filtering rules for the assets: minimum market cap, liquidity
      threshold (average daily volume > 1M shares), and data availability. Return
      a list of instruments that meet all criteria.'
  define_strategy_goals:
    agent: false
    description: Establish the quantitative performance and risk targets that the
      strategy must meet.
    name: define_strategy_goals
    nodes_depended_on: []
    nodes_dependent_on:
    - select_asset_universe
    - set_performance_targets
    prompt: 'Specify the primary objectives of the strategy: expected annual return,
      maximum drawdown, target Sharpe ratio, and maximum position size. Provide concise
      bullet points.'
  develop_trading_rule:
    agent: false
    description: Create the concrete trading logic that will be backtested.
    name: develop_trading_rule
    nodes_depended_on:
    - select_best_model
    nodes_dependent_on:
    - backtest_strategy
    prompt: 'Define a trading rule that maps model predictions to position sizes:
      e.g., long if predicted return > 0.5% and scale by z‑score. Include stop‑loss
      and take‑profit thresholds. Output the rule in pseudocode.'
  evaluate_backtest_results:
    agent: false
    description: Assess whether the backtest meets the predefined goals.
    name: evaluate_backtest_results
    nodes_depended_on:
    - backtest_strategy
    nodes_dependent_on:
    - adjust_risk_controls
    prompt: Compare backtest metrics to performance targets set in define_strategy_goals.
      Highlight any shortfalls in a concise report.
  evaluate_feature_importance:
    agent: false
    description: Assess which features contribute most to predictive power.
    name: evaluate_feature_importance
    nodes_depended_on:
    - generate_feature_set
    nodes_dependent_on:
    - select_features
    prompt: Using a simple random forest regressor, compute feature importance scores
      on a hold‑out sample. Return a ranked list of features with importance values.
  extract_market_factors:
    agent: false
    description: Generate macro and factor data to be used in feature construction.
    name: extract_market_factors
    nodes_depended_on:
    - collect_market_data
    nodes_dependent_on:
    - generate_feature_set
    prompt: Compute standard market factors (e.g., Fama–French 3 factors, momentum)
      for the universe over the same period. Output factor time series with dates.
  generate_feature_set:
    agent: false
    description: Construct the raw feature set for model training.
    name: generate_feature_set
    nodes_depended_on:
    - clean_and_store_raw_data
    - extract_market_factors
    nodes_dependent_on:
    - evaluate_feature_importance
    - normalize_and_split_data
    prompt: 'Create a comprehensive feature matrix: price‑based (returns, moving averages,
      volatility), volume‑based, macro factors, and sentiment indicators. Include
      lagged and rolling window features. Output a CSV with timestamps.'
  normalize_and_split_data:
    agent: false
    description: Prepare data for modeling and evaluation.
    name: normalize_and_split_data
    nodes_depended_on:
    - select_features
    nodes_dependent_on:
    - train_and_tune_models
    - backtest_strategy
    prompt: Standardize the feature matrix (z‑score). Split into training (70%), validation
      (15%), and test (15%) sets using rolling origin cross‑validation. Output the
      split datasets in separate CSVs.
  select_asset_universe:
    agent: false
    description: Define the set of tradable securities for the strategy.
    name: select_asset_universe
    nodes_depended_on: []
    nodes_dependent_on:
    - collect_market_data
    - define_eligibility_criteria
    prompt: List the asset classes and specific instruments the strategy will trade
      (e.g., NYSE equities, E-mini S&P futures, EUR/USD). Include ticker symbols and
      market identifiers.
  select_best_model:
    agent: false
    description: Identify the optimal predictive model for deployment.
    name: select_best_model
    nodes_depended_on:
    - train_and_tune_models
    nodes_dependent_on:
    - develop_trading_rule
    prompt: Choose the model with the lowest validation RMSE that also meets a minimum
      Sharpe ratio on the validation set. Return the model architecture and hyperparameters.
  select_features:
    agent: false
    description: Filter the feature set to a manageable subset.
    name: select_features
    nodes_depended_on:
    - evaluate_feature_importance
    nodes_dependent_on:
    - normalize_and_split_data
    prompt: Choose the top 30 features based on importance, removing highly collinear
      pairs (R > 0.85). List selected feature names.
  set_performance_targets:
    agent: false
    description: Convert strategic objectives into measurable numeric targets.
    name: set_performance_targets
    nodes_depended_on: []
    nodes_dependent_on:
    - define_strategy_goals
    prompt: 'Translate the strategy goals into quantitative metrics: target annual
      return %, max drawdown %, minimum Sharpe ratio, and maximum position size %
      of portfolio. Use a table format.'
  train_and_tune_models:
    agent: false
    description: Generate multiple predictive models with tuned parameters.
    name: train_and_tune_models
    nodes_depended_on:
    - normalize_and_split_data
    nodes_dependent_on:
    - select_best_model
    prompt: Train a portfolio of candidate models (linear regression, LSTM, XGBoost,
      CatBoost, SVM) on the training set. Perform hyperparameter tuning via Bayesian
      search on the validation set. Return model performance metrics (RMSE, MAE) and
      the best hyperparameters.
