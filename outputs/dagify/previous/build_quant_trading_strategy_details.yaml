dag_type: plain_text
description: A workflow to develop a quantitative trading strategy including data
  processing, model design, backtesting, optimization, and deployment planning.
name: build_quant_trading_strategy
nodes:
  calculate_performance_metrics:
    agent: false
    description: Quantify strategy effectiveness
    name: calculate_performance_metrics
    nodes_depended_on:
    - execute_backtesting
    nodes_dependent_on: []
    prompt: Compute full performance report (CAGR, Sharpe ratio, max drawdown, win
      rate) and risk-adjusted metrics (Ulcer index, Calmar ratio). Include benchmark
      comparisons.
  choose_strategy_type:
    agent: false
    description: Select quant strategy category framework
    name: choose_strategy_type
    nodes_depended_on:
    - define_strategy_objectives
    nodes_dependent_on: []
    prompt: Select one primary strategy type (market neutral, statistical arbitrage,
      momentum, mean reversion, trend following). Provide one-sentence rationale linking
      to objectives.
  clean_fundamental_data:
    agent: false
    description: Standardize fundamental metrics
    name: clean_fundamental_data
    nodes_depended_on:
    - retrieve_fundamental_data
    nodes_dependent_on: []
    prompt: Reconcile differing reporting standards across 50 companies. Transform
      earnings, revenues, EPS into consistent units and reporting periods.
  clean_price_data:
    agent: false
    description: Standardize pricing dataset
    name: clean_price_data
    nodes_depended_on:
    - retrieve_historical_price_data
    nodes_dependent_on: []
    prompt: Identify and resolve missing values, duplicates, and jumps in 50 instrument
      price time series. Return cleaned dataset with adjusted prices and continuous
      time intervals.
  create_risk_framework:
    agent: false
    description: Define capital protection rules
    name: create_risk_framework
    nodes_depended_on:
    - optimize_parameters
    - choose_strategy_type
    nodes_dependent_on: []
    prompt: Design 5 risk management controls including position sizing, maximum exposure
      per instrument, drawdown-based trading halts, and daily P&L limits.
  define_strategy_objectives:
    agent: false
    description: Specify the primary goals of the trading strategy
    name: define_strategy_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Define 3-5 specific investment goals (e.g. annual return target, risk
      constraints, asset classes, trading frequency). Focus only on objectives, not
      implementation details.
  define_strategy_parameters:
    agent: false
    description: Establish model rules in mathematical terms
    name: define_strategy_parameters
    nodes_depended_on:
    - choose_strategy_type
    nodes_dependent_on: []
    prompt: Define 5 core parameters and their mathematical expressions (e.g. MACD
      periods, volatility decay model, factor weights). Specify parameter ranges for
      exploration.
  develop_algorithmic_logic:
    agent: false
    description: Create signal generation equations
    name: develop_algorithmic_logic
    nodes_depended_on:
    - choose_strategy_type
    - define_strategy_parameters
    nodes_dependent_on: []
    prompt: Formulate 3-5 mathematical equations to transform inputs into 0-1 signals.
      Include weighting factors, lookback windows, and normalization.
  document_live_trading_plan:
    agent: false
    description: Create operational requirements
    name: document_live_trading_plan
    nodes_depended_on:
    - create_risk_framework
    - generate_deployment_blueprint
    nodes_dependent_on: []
    prompt: Outline 10 required actions for production deployment including latency
      requirements, fallback strategies during connection failures, and daily monitoring
      procedures.
  execute_backtesting:
    agent: false
    description: Apply algorithm to historical data
    name: execute_backtesting
    nodes_depended_on:
    - implement_signal_processing
    - clean_price_data
    - clean_fundamental_data
    nodes_dependent_on: []
    prompt: Simulate strategy execution from 2018 to 2022 using walk-forward analysis.
      Include transaction costs and slippage model.
  execute_out_of_sample:
    agent: false
    description: Validate generalization capability
    name: execute_out_of_sample
    nodes_depended_on:
    - verify_backtest_integrity
    nodes_dependent_on: []
    prompt: Run full strategy on 6-month unseen data set. Document performance divergence
      from training period.
  generate_deployment_blueprint:
    agent: false
    description: Prepare implementation guide
    name: generate_deployment_blueprint
    nodes_depended_on:
    - test_overfitting
    - create_risk_framework
    nodes_dependent_on: []
    prompt: Document API integration requirements, execution platform characteristics,
      and monitoring dashboards needed for live implementation.
  implement_signal_processing:
    agent: false
    description: Convert logic into executable algorithm
    name: implement_signal_processing
    nodes_depended_on:
    - develop_algorithmic_logic
    nodes_dependent_on: []
    prompt: Outline step-by-step signal calculation using Python pseudocode. Include
      input validation and edge case handling.
  list_required_data_assets:
    agent: false
    description: Identify necessary data sources
    name: list_required_data_assets
    nodes_depended_on:
    - choose_strategy_type
    nodes_dependent_on: []
    prompt: List 4-8 distinct data types needed for implementation (e.g. OHLC bars,
      volume, volatility surfaces, fundamental ratios). Categorize as market data,
      orderflow, fundamentals, macro.
  optimize_parameters:
    agent: false
    description: Refine model inputs
    name: optimize_parameters
    nodes_depended_on:
    - calculate_performance_metrics
    - define_strategy_parameters
    nodes_dependent_on: []
    prompt: Use genetic algorithm to find parameter set maximizing Sharpe ratio. Specify
      convergence criteria and population size.
  retrieve_fundamental_data:
    agent: false
    description: Collect non-price financial information
    name: retrieve_fundamental_data
    nodes_depended_on:
    - list_required_data_assets
    nodes_dependent_on: []
    prompt: Request quarterly earnings reports, balance sheet metrics, and dividend
      history for 50 companies from Bloomberg and Yahoo Finance APIs.
  retrieve_historical_price_data:
    agent: false
    description: Acquire pricing data from specified sources
    name: retrieve_historical_price_data
    nodes_depended_on:
    - list_required_data_assets
    nodes_dependent_on: []
    prompt: Request granular price data from 3 exchanges (start date 2010-01-01 to
      2024-01-01) for 50 liquid equity instruments. Specify timeframe (e.g. 1m bars,
      daily bars, weekly bars).
  test_overfitting:
    agent: false
    description: Detect excessive parameter fitting
    name: test_overfitting
    nodes_depended_on:
    - execute_out_of_sample
    nodes_dependent_on: []
    prompt: Conduct stability test with parameter perturbations of ±20% and 5x random
      samples. Chart performance distribution vs. original optimized set.
  verify_backtest_integrity:
    agent: false
    description: Test results robustness
    name: verify_backtest_integrity
    nodes_depended_on:
    - execute_backtesting
    - create_risk_framework
    nodes_dependent_on: []
    prompt: Execute out-of-sample test on 2023-2024 data with new random seed. Compare
      performance to training period and identify parameter sensitivity.
