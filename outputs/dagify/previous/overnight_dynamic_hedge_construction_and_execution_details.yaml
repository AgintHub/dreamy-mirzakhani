dag_type: plain_text
description: Workflow to gather financial data on stocks, ETFs, and futures, analyze
  an equity portfolio, construct a daily overnight dynamic hedge based on implied
  valuation vs NAV, and send orders for execution at the next morning's opening auction,
  rebalancing daily.
name: overnight_dynamic_hedge_construction_and_execution
nodes:
  compute_implied_valuation_vs_nav:
    agent: false
    description: Calculate the implied valuation difference for stocks based on NAV
      and market prices.
    name: compute_implied_valuation_vs_nav
    nodes_depended_on:
    - fetch_stock_financial_data
    - fetch_etf_financial_data
    - fetch_futures_financial_data
    - fetch_portfolio_holdings
    nodes_dependent_on:
    - construct_hedge_ratios
    prompt: Using fetched stock, ETF, and futures data along with portfolio holdings,
      calculate for each stock the implied valuation metric relative to its NAV or
      benchmark, producing a valuation delta per security.
  construct_hedge_ratios:
    agent: false
    description: Formulate target hedge ratios for each stock based on implied valuation
      differences.
    name: construct_hedge_ratios
    nodes_depended_on:
    - compute_implied_valuation_vs_nav
    nodes_dependent_on:
    - generate_hedging_instructions
    prompt: Translate valuation deltas into specific hedge ratios per stock, indicating
      the notional exposure or quantity of each hedging instrument required to neutralize
      valuation risk.
  fetch_etf_financial_data:
    agent: false
    description: Retrieve latest financial data for ETFs in the investment universe.
    name: fetch_etf_financial_data
    nodes_depended_on: []
    nodes_dependent_on:
    - fetch_stock_financial_data
    - fetch_futures_financial_data
    - fetch_portfolio_holdings
    prompt: Fetch the latest market and NAV data for all ETFs, including price, volume,
      NAV, and holdings data as of the most recent market close.
  fetch_futures_financial_data:
    agent: false
    description: Retrieve latest price and volume data for futures contracts relevant
      to hedging.
    name: fetch_futures_financial_data
    nodes_depended_on: []
    nodes_dependent_on:
    - fetch_stock_financial_data
    - fetch_etf_financial_data
    - fetch_portfolio_holdings
    prompt: Fetch the latest settlement prices, volumes, and open interest for futures
      contracts covering indexes and sectors related to the equity portfolio as of
      the most recent close.
  fetch_portfolio_holdings:
    agent: false
    description: Retrieve current equity portfolio holdings and weights.
    name: fetch_portfolio_holdings
    nodes_depended_on: []
    nodes_dependent_on:
    - compute_implied_valuation_vs_nav
    prompt: Obtain the list of stocks in the equity portfolio with quantities and
      current weights as of market close.
  fetch_stock_financial_data:
    agent: false
    description: Retrieve latest financial data for stocks in the portfolio universe.
    name: fetch_stock_financial_data
    nodes_depended_on: []
    nodes_dependent_on:
    - fetch_etf_financial_data
    - fetch_futures_financial_data
    - fetch_portfolio_holdings
    prompt: Fetch the latest market and fundamental data for all relevant stocks,
      including price, volume, dividend, and earnings data as of the most recent market
      close.
  format_trade_orders:
    agent: false
    description: Format the generated hedge trade instructions into the standard order
      entry format required by the execution system.
    name: format_trade_orders
    nodes_depended_on:
    - generate_hedging_instructions
    nodes_dependent_on:
    - submit_trade_orders
    prompt: Convert the list of hedge trade instructions into properly formatted trade
      orders, with standardized fields such as instrument ID, order type, quantity,
      price limit, and order timing parameters for opening auction execution.
  generate_hedging_instructions:
    agent: false
    description: Create explicit trading instructions representing the hedge trades
      required to balance portfolio risks overnight.
    name: generate_hedging_instructions
    nodes_depended_on:
    - construct_hedge_ratios
    nodes_dependent_on:
    - format_trade_orders
    prompt: Based on the hedge ratios per security, generate a detailed list of buy/sell
      instructions specifying instrument, quantity, and direction for the overnight
      hedge targeting the next morning's market open auction.
  schedule_daily_rebalance:
    agent: false
    description: Set up automated daily rescheduling of the entire hedge construction
      and execution workflow.
    name: schedule_daily_rebalance
    nodes_depended_on:
    - verify_order_submission
    nodes_dependent_on: []
    prompt: Create a recurring schedule to trigger this workflow after daily market
      close to perform data refresh, hedge recalculation, order preparation, and submission
      for daily portfolio rebalancing.
  submit_trade_orders:
    agent: false
    description: Send formatted trade orders to the execution system for placing during
      the next morning's opening auction.
    name: submit_trade_orders
    nodes_depended_on:
    - format_trade_orders
    nodes_dependent_on:
    - verify_order_submission
    prompt: Transmit the formatted trade orders to the authorized execution platform
      or broker with instructions to fill at the market open auction the following
      trading day.
  verify_order_submission:
    agent: false
    description: Confirm successful submission of hedge trade orders to the execution
      venue.
    name: verify_order_submission
    nodes_depended_on:
    - submit_trade_orders
    nodes_dependent_on:
    - schedule_daily_rebalance
    prompt: Check the execution system's response to confirm that all hedge trade
      orders have been accepted and queued for the next market opening auction. Report
      any errors or rejections.
