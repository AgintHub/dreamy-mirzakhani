dag_type: typed
description: Generated workflow from UI.
name: pure_functional_quicksort_with_recursion_point
nodes:
  concatenate_result:
    agent: false
    description: Combine the sorted left partition, pivot partition, and sorted right
      partition
    name: concatenate_result
    nodes_depended_on:
    - sort_left
    - partition_list
    - sort_right
    nodes_dependent_on: []
    output_structure:
    - description: The fully sorted list resulting from concatenating the sorted left
        partition, the pivot partition, and the sorted right partition
      key: final_sorted_list
      type: List[int]
    prompt: 'Concatenate the following three components: 1) the sorted left partition
      from the quicksort operation, 2) the pivot partition from the original partitioned
      data, and 3) the sorted right partition from the quicksort operation. Return
      the final sorted list.'
  input_list:
    agent: false
    description: The original unsorted input list to be sorted
    name: input_list
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The raw unsorted list of integers to be sorted
      key: unsorted_values
      type: List[int]
    prompt: Provide the raw unsorted input list to be processed.
  partition_list:
    agent: false
    description: Divide the input list into three partitions based on pivot value
    name: partition_list
    nodes_depended_on:
    - input_list
    - select_pivot
    nodes_dependent_on: []
    output_structure:
    - description: List of elements less than the pivot
      key: less_than_pivot
      type: List[int]
    - description: List of elements equal to the pivot
      key: equal_to_pivot
      type: List[int]
    - description: List of elements greater than the pivot
      key: greater_than_pivot
      type: List[int]
    prompt: 'Partition the input list into three sublists: elements less than the
      pivot, elements equal to the pivot, and elements greater than the pivot. Return
      all three partitions in order.'
  quicksort:
    agent: false
    description: Recursively apply quicksort to both the left and right partitions
    name: quicksort
    nodes_depended_on:
    - partition_list
    nodes_dependent_on: []
    output_structure:
    - description: The sorted left partition
      key: sorted_left_partition
      type: List[int]
    - description: The sorted right partition
      key: sorted_right_partition
      type: List[int]
    prompt: Recursively apply the quicksort algorithm to both the left partition (elements
      less than pivot) and the right partition (elements greater than pivot) from
      the previous step. Return the sorted left and right partitions.
  select_pivot:
    agent: false
    description: Select a pivot element from the input list
    name: select_pivot
    nodes_depended_on:
    - input_list
    nodes_dependent_on: []
    output_structure:
    - description: The selected pivot element from the input list
      key: pivot_element
      type: int
    prompt: Select a single pivot element from the input list. Return only the chosen
      pivot element.
  sort_left:
    agent: false
    description: Apply quicksort to the left partition
    name: sort_left
    nodes_depended_on:
    - quicksort
    nodes_dependent_on: []
    output_structure:
    - description: The sorted left partition
      key: sorted_left_partition
      type: List[int]
    prompt: Apply the quicksort algorithm to the left partition from the previous
      step. Return the sorted left partition.
  sort_right:
    agent: false
    description: Apply quicksort to the right partition
    name: sort_right
    nodes_depended_on:
    - quicksort
    nodes_dependent_on: []
    output_structure:
    - description: The right partition sorted in ascending order
      key: sorted_right_partition
      type: List[int]
    prompt: Apply the quicksort algorithm to the right partition from the previous
      step. Return the sorted right partition.
