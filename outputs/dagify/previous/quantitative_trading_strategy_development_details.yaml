dag_type: typed
description: Generated workflow from UI.
name: quantitative_trading_strategy_development
nodes:
  assemble_feature_matrix:
    agent: false
    description: Combine all engineered features into a single matrix.
    name: assemble_feature_matrix
    nodes_depended_on:
    - engineer_market_features
    - engineer_news_features
    - engineer_sentiment_features
    nodes_dependent_on: []
    output_structure:
    - description: The final feature matrix, where each row represents a data sample
        and each column represents an engineered feature.
      key: feature_matrix
      type: List[float]
    - description: The date range covered by the feature matrix, where each string
        represents a specific date in ISO format (e.g., YYYY-MM-DD).
      key: date_range
      type: List[str]
    prompt: Merge all feature CSVs on date and asset, handle missing values with median
      imputation, and generate a final feature matrix. Export as CSV.
  backtest_strategy:
    agent: false
    description: Simulate strategy performance on historical data.
    name: backtest_strategy
    nodes_depended_on:
    - generate_trade_rules
    - assemble_feature_matrix
    nodes_dependent_on: []
    output_structure:
    - description: Daily equity curve values
      key: equity_curve
      type: List[float]
    - description: List of trades with their descriptions
      key: trade_log
      type: List[str]
    - description: Backtest performance metrics (e.g., CAGR, annual volatility, Sharpe
        ratio)
      key: performance_metrics
      type: List[float]
    prompt: Run a backtest over the past 5 years using the generated rules and feature
      matrix. Apply a realistic slippage and commission model. Output daily equity
      curve and trade log.
  calculate_risk_metrics:
    agent: false
    description: Produce detailed risk metrics.
    name: calculate_risk_metrics
    nodes_depended_on:
    - evaluate_performance_metrics
    nodes_dependent_on: []
    output_structure:
    - description: List of CSV files containing risk metrics
      key: risk_reports
      type: List[str]
    - description: List of 95% VaR values for each position
      key: var_95
      type: List[float]
    - description: List of exposure limits for each asset
      key: exposure_limits
      type: List[int]
    - description: Liquidity risk value
      key: liquidity_risk
      type: float
    prompt: From the trade log, calculate position-level VaR at 95%, exposure limits
      per asset, and liquidity risk. Export as CSV.
  clean_market_data:
    agent: false
    description: Clean raw market data.
    name: clean_market_data
    nodes_depended_on:
    - collect_market_data
    nodes_dependent_on: []
    output_structure:
    - description: List of cleaned CSV files containing market data
      key: cleaned_market_data
      type: List[str]
    - description: Number of duplicate bars removed
      key: duplicate_bar_count
      type: int
    - description: Type of timestamp filling used (e.g., forward-fill)
      key: timestamp_fill_type
      type: str
    prompt: Remove duplicate bars, fill missing timestamps with forward-fill, and
      adjust for corporate actions. Output cleaned CSV.
  clean_news_data:
    agent: false
    description: Clean raw news data.
    name: clean_news_data
    nodes_depended_on:
    - collect_news_data
    nodes_dependent_on: []
    output_structure:
    - description: List of cleaned news JSON files
      key: cleaned_news
      type: List[str]
    - description: List of counts of duplicate news items by source
      key: count_duplicate_items
      type: List[int]
    - description: List of counts of non-English news articles by source
      key: count_non_english_articles
      type: List[int]
    - description: List of timestamps applied to news items by source
      key: timestamp_news
      type: List[str]
    prompt: Deduplicate news items, remove non-English articles, and timestamp them.
      Export cleaned JSON.
  clean_sentiment_data:
    agent: false
    description: Clean raw sentiment data.
    name: clean_sentiment_data
    nodes_depended_on:
    - collect_sentiment_data
    nodes_dependent_on: []
    output_structure:
    - description: List of sentiment scores after cleaning
      key: cleaned_sentiment_data
      type: List[float]
    - description: List of aggregated sentiment scores by day
      key: aggregated_sentiment
      type: List[float]
    prompt: Remove entries with null scores, aggregate by day, and align timestamps.
      Output cleaned CSV.
  collect_market_data:
    agent: false
    description: Retrieve raw market price data for the selected assets.
    name: collect_market_data
    nodes_depended_on:
    - select_asset_universe
    nodes_dependent_on: []
    output_structure:
    - description: List of asset symbols retrieved
      key: asset_list
      type: List[str]
    - description: Path to the output CSV file
      key: data_csv
      type: str
    prompt: For each asset in the universe, download historical price and volume data
      at the desired frequency (e.g., 1‑minute) from a reliable source. Output CSV
      files.
  collect_news_data:
    agent: false
    description: Retrieve news content related to the assets.
    name: collect_news_data
    nodes_depended_on:
    - select_asset_universe
    nodes_dependent_on: []
    output_structure:
    - description: List of asset IDs gathered news content for
      key: asset_ids
      type: List[str]
    - description: List of news headlines for each asset
      key: news_headlines
      type: List[str]
    - description: List of news article bodies for each asset
      key: article_bodies
      type: List[str]
    prompt: For each asset, gather news headlines and article bodies from a public
      API for the past two years. Save in JSON format.
  collect_sentiment_data:
    agent: false
    description: Collect social media sentiment data for the assets.
    name: collect_sentiment_data
    nodes_depended_on:
    - select_asset_universe
    nodes_dependent_on: []
    output_structure:
    - description: List of asset symbols
      key: asset_symbols
      type: List[str]
    - description: List of sentiment scores for each asset
      key: sentiment_scores
      type: List[float]
    - description: CSV data containing sentiment scores for each asset
      key: csv_data
      type: str
    prompt: For each asset, collect sentiment scores from a social media platform
      over the past two years. Export as CSV.
  define_strategy_goals:
    agent: false
    description: Specify high-level performance and risk targets for the strategy.
    name: define_strategy_goals
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Target return percentage.
      key: target_return
      type: float
    - description: Risk tolerance in terms of drawdown percentage.
      key: risk_tolerance
      type: float
    - description: Time horizon in months.
      key: time_horizon
      type: int
    - description: Trading frequency (e.g., daily, weekly, monthly).
      key: trading_frequency
      type: str
    - description: List of primary objectives.
      key: primary_objectives
      type: List[str]
    prompt: 'Outline the primary objectives for the strategy: target return, risk
      tolerance, time horizon, and trading frequency. Provide concise bullet points.'
  engineer_market_features:
    agent: false
    description: Create market‑based feature set.
    name: engineer_market_features
    nodes_depended_on:
    - clean_market_data
    nodes_dependent_on: []
    output_structure:
    - description: Generated market feature matrix
      key: feature_matrix
      type: List[float]
    - description: List of indicator names used
      key: indicator_names
      type: List[str]
    - description: Data quality assessment (e.g., complete, incomplete, missing)
      key: data_quality
      type: str
    prompt: 'Generate technical indicators: moving averages, RSI, volatility, momentum,
      and price-action patterns. Save as CSV.'
  engineer_news_features:
    agent: false
    description: Create news‑based feature set.
    name: engineer_news_features
    nodes_depended_on:
    - clean_news_data
    nodes_dependent_on: []
    output_structure:
    - description: Extracted news features for each asset in the universe.
      key: feature_matrix
      type: List[float]
    - description: Extracted key topics from news articles.
      key: key_topics
      type: List[str]
    - description: Computed sentiment polarity for each news article.
      key: sentiment_polarity
      type: List[float]
    - description: Computed keyword frequencies for each asset and article.
      key: keyword_frequencies
      type: List[int]
    prompt: Apply NLP to extract key topics, sentiment polarity, and keyword frequencies.
      Output as CSV.
  engineer_sentiment_features:
    agent: false
    description: Create sentiment-based feature set.
    name: engineer_sentiment_features
    nodes_depended_on:
    - clean_sentiment_data
    nodes_dependent_on: []
    output_structure:
    - description: List of daily average sentiment scores
      key: sentiment_scores
      type: List[float]
    - description: List of volatility measures
      key: volatility_measures
      type: List[float]
    - description: List of trend indicators
      key: trend_indicators
      type: List[str]
    - description: Path to the CSV output file
      key: csv_output
      type: str
    prompt: Transform raw sentiment scores into daily averages, volatility measures,
      and trend indicators. Output as CSV.
  evaluate_performance_metrics:
    agent: false
    description: Generate basic performance statistics.
    name: evaluate_performance_metrics
    nodes_depended_on:
    - backtest_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Compound annual growth rate
      key: cagr
      type: float
    - description: Annualized volatility
      key: annual_volatility
      type: float
    - description: Sharpe ratio
      key: sharpe_ratio
      type: float
    - description: Maximum drawdown
      key: maximum_drawdown
      type: float
    - description: Winning rate
      key: win_rate
      type: float
    - description: Daily equity curve as a CSV string
      key: equity_curve
      type: str
    prompt: Compute CAGR, annual volatility, Sharpe ratio, maximum drawdown, and win-rate
      from the equity curve. Provide results in a CSV.
  forward_test_strategy:
    agent: false
    description: Validate the strategy on unseen data.
    name: forward_test_strategy
    nodes_depended_on:
    - refine_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Result of the paper trade simulation
      key: paper_trade_simulation_result
      type: str
    - description: List of performance metrics
      key: performance_metrics
      type: List[float]
    - description: Trade log output
      key: trade_log
      type: str
    prompt: Run a paper trade simulation on a one-year out-of-sample period with a
      walk-forward approach. Output performance metrics and trade log.
  generate_trade_rules:
    agent: false
    description: Create trade rule specifications.
    name: generate_trade_rules
    nodes_depended_on:
    - select_strategy_models
    nodes_dependent_on: []
    output_structure:
    - description: Name of the selected model
      key: model_name
      type: str
    - description: Threshold value for generating buy/sell signals
      key: signal_threshold
      type: float
    - description: Rule for determining position size based on model predictions
      key: position_sizing_rule
      type: str
    - description: Condition for generating a buy signal
      key: buy_signal
      type: str
    - description: Condition for generating a sell signal
      key: sell_signal
      type: str
    prompt: For each model, define a signal threshold and position sizing rule that
      translates predictions into buy/sell signals. List rules in a table.
  optimize_hyperparameters:
    agent: false
    description: Tune model hyperparameters.
    name: optimize_hyperparameters
    nodes_depended_on:
    - evaluate_performance_metrics
    nodes_dependent_on: []
    output_structure:
    - description: List of model names
      key: model_names
      type: List[str]
    - description: Best metric value (e.g., accuracy, precision, recall) for the model
      key: evaluation_metric
      type: str
    prompt: Perform grid search over each model’s hyperparameters using cross-validation.
      Output the best parameter sets.
  refine_strategy:
    agent: false
    description: Finalize strategy rules and parameters.
    name: refine_strategy
    nodes_depended_on:
    - risk_control_spec
    - optimize_hyperparameters
    nodes_dependent_on: []
    output_structure:
    - description: The finalized strategy blueprint as a string.
      key: strategy_blueprint
      type: str
    - description: A list of risk control parameters applied to the strategy.
      key: risk_controls
      type: List[str]
    - description: The optimized model parameters as a string.
      key: optimized_parameters
      type: str
    prompt: Integrate the optimized parameters and risk controls into the trade rules,
      creating a finalized strategy blueprint.
  risk_control_spec:
    agent: false
    description: Specify risk control parameters.
    name: risk_control_spec
    nodes_depended_on:
    - calculate_risk_metrics
    nodes_dependent_on: []
    output_structure:
    - description: Whether each rule is based on stop-loss
      key: stop_loss_rules
      type: List[bool]
    - description: The take-profit thresholds for each rule
      key: take_profit_rules
      type: List[float]
    - description: The maximum position sizes for each rule
      key: max_position_size_rules
      type: List[int]
    prompt: Define stop-loss, take-profit, and maximum position size rules based on
      the risk metrics. Present as a table.
  select_asset_universe:
    agent: false
    description: Identify the set of assets that will be traded.
    name: select_asset_universe
    nodes_depended_on:
    - define_strategy_goals
    nodes_dependent_on: []
    output_structure:
    - description: List of selected asset instruments
      key: asset_instruments
      type: List[str]
    - description: List of selected market names
      key: markets
      type: List[str]
    - description: Total number of selected instruments
      key: instrument_count
      type: int
    prompt: List the tradable instruments and markets the strategy will target (e.g.,
      S&P 500 stocks, EUR/USD FX). Keep the list under 15 items.
  select_strategy_models:
    agent: false
    description: Select models to evaluate for the strategy.
    name: select_strategy_models
    nodes_depended_on:
    - assemble_feature_matrix
    - define_strategy_goals
    nodes_dependent_on: []
    output_structure:
    - description: List of selected model names
      key: selected_models
      type: List[str]
    - description: Brief justification for the selected models
      key: justification
      type: str
    prompt: 'Choose 3 candidate predictive models: linear regression, random forest,
      LSTM neural network. Provide brief justification for each choice.'
