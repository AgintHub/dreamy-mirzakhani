dag_type: plain_text
description: Collect financial data, calculate implied valuation and NAV, construct
  a hedge, generate and execute trade orders at the morning opening auction, and rebalance
  the portfolio daily.
name: dynamic_equity_hedge_workflow
nodes:
  compute_implied_valuation:
    agent: false
    description: Calculate the portfolio’s implied valuation from options market data.
    name: compute_implied_valuation
    nodes_depended_on:
    - gather_stock_data
    - gather_etf_data
    - gather_futures_data
    nodes_dependent_on:
    - construct_hedge
    prompt: Using the collected option data, estimate the implied valuation of the
      portfolio with an appropriate model such as Black–Scholes or a volatility‑adjusted
      approach.
  compute_nav:
    agent: false
    description: Compute the portfolio’s net asset value (NAV).
    name: compute_nav
    nodes_depended_on:
    - gather_stock_data
    - gather_etf_data
    - gather_futures_data
    nodes_dependent_on:
    - construct_hedge
    prompt: Sum the current market values of all stocks, ETFs, and futures in the
      portfolio to calculate the Net Asset Value.
  construct_hedge:
    agent: false
    description: Create the hedge strategy for the portfolio.
    name: construct_hedge
    nodes_depended_on:
    - compute_implied_valuation
    - compute_nav
    nodes_dependent_on:
    - generate_trade_orders
    prompt: Based on the implied valuation and NAV, design a delta‑neutral or dynamic
      hedge that minimizes risk for the overnight period.
  execute_trades:
    agent: false
    description: Execute the trade orders at the morning opening auction.
    name: execute_trades
    nodes_depended_on:
    - generate_trade_orders
    nodes_dependent_on:
    - rebalance_portfolio
    prompt: Submit the trade orders to the exchange or broker, ensuring execution
      at the opening auction and monitoring for completion or issues.
  gather_etf_data:
    agent: false
    description: Collect current and option market data for the portfolio's ETFs.
    name: gather_etf_data
    nodes_depended_on: []
    nodes_dependent_on:
    - compute_implied_valuation
    - compute_nav
    prompt: Retrieve the latest daily price, volume, and option data for all ETFs
      in the portfolio from a reliable data source.
  gather_futures_data:
    agent: false
    description: Collect current market data for the portfolio's futures.
    name: gather_futures_data
    nodes_depended_on: []
    nodes_dependent_on:
    - compute_implied_valuation
    - compute_nav
    prompt: Retrieve the latest daily price and volume data for all futures contracts
      related to the portfolio from a reliable data source.
  gather_stock_data:
    agent: false
    description: Collect current and option market data for the portfolio's stocks.
    name: gather_stock_data
    nodes_depended_on: []
    nodes_dependent_on:
    - compute_implied_valuation
    - compute_nav
    prompt: Retrieve the latest daily price, volume, and option data for all stocks
      in the portfolio from a reliable data source.
  generate_trade_orders:
    agent: false
    description: Generate the trade orders to be executed at the opening auction.
    name: generate_trade_orders
    nodes_depended_on:
    - construct_hedge
    nodes_dependent_on:
    - execute_trades
    prompt: Translate the hedge strategy into executable trade orders, specifying
      assets, quantities, and target prices for the morning opening auction.
  rebalance_portfolio:
    agent: false
    description: Rebalance the portfolio daily after trade execution.
    name: rebalance_portfolio
    nodes_depended_on:
    - execute_trades
    nodes_dependent_on: []
    prompt: Adjust the portfolio holdings by buying or selling assets to maintain
      the target hedge ratio and account for any changes in market conditions.
