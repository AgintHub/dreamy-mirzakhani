      n  'EU UCITS\n    Directive',\\n  'FINRA 24-13'\\n]\"\n\n    >>> output = identify_regulatory_requirements('SICAV')\n\
      \    >>> print(output['regulatory_filings'])\n    \"[\\n  'Luxembourg AIFMD\
      \ Registration',\\n  'Luxembourg Fund Law Filing',\\n\n    'EU UCITS Directive',\\\
