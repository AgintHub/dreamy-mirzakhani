dag_type: plain_text
description: A workflow that constructs a hedge fund plan from objectives to final
  executive summary.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Select the high-level investment strategy.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - define_asset_universe
    - set_performance_and_risk_targets
    - compile_pitch_deck_outline
    prompt: Select one primary hedge fund strategy category (e.g., long/short equity,
      global macro, event-driven). Provide a one-sentence rationale.
  choose_legal_entity_type:
    agent: false
    description: Determine the legal structure for the fund.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on:
    - list_service_providers
    - outline_governance_structure
    - identify_regulatory_requirements
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Provide a one-sentence explanation.
  clarify_fund_objectives:
    agent: false
    description: Define the hedge fund's primary business objectives.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - select_jurisdiction
    - choose_investment_strategy
    - define_investor_profile
    - design_risk_management_framework
    - compile_pitch_deck_outline
    prompt: List the core objectives of the hedge fund in bullet form, covering investment
      purpose, competitive edge, long-term vision, etc. Max 8 bullets.
  compile_pitch_deck_outline:
    agent: false
    description: Outline the investor presentation.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: Create a 10-slide outline (slide titles only) for an investor pitch deck
      incorporating objectives, strategy, team, edge, risk controls, fees, expected
      returns.
  create_hiring_plan:
    agent: false
    description: Plan initial staffing.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: List essential full-time positions for launch (max 8), with one-line responsibility
      each. Align roles with operations workflow gaps.
  define_asset_universe:
    agent: false
    description: Identify tradable assets for the strategy.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - draft_operations_workflow
    prompt: List the specific asset classes and instruments that the chosen strategy
      will trade. Keep list ≤10 items.
  define_investor_profile:
    agent: false
    description: Describe the target investor segment.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: 'Specify the ideal target investor profile: typical ticket size, risk
      tolerance, liquidity preference, geographic focus.'
  define_technology_stack:
    agent: false
    description: Specify technology requirements.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: 'Identify required software and infrastructure for each operation step
      (OMS, EMS, risk system). Present as 2-column table: Ops Step | Tech Component.'
  design_compliance_program:
    agent: false
    description: Create the compliance program.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on:
    - produce_final_fund_plan_summary
    prompt: 'Generate a compliance checklist mapping each regulatory requirement to
      an internal policy. Table with columns: Requirement | Policy Reference.'
  design_risk_management_framework:
    agent: false
    description: Outline risk management policies.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on:
    - design_compliance_program
    - draft_operations_workflow
    - compile_pitch_deck_outline
    prompt: 'List core risk controls aligned with target metrics: position limits,
      VaR limits, stop-loss rules, liquidity thresholds. Provide 4–6 bullet points.'
  develop_timeline_and_milestones:
    agent: false
    description: Set launch schedule.
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on:
    - produce_final_fund_plan_summary
    prompt: Prepare a launch timeline with monthly milestones over the next 12 months.
      Include regulatory filing, service provider onboarding, capital raise, tech
      deployment, and go-live.
  draft_fee_structure:
    agent: false
    description: Design the fee schedule.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: Propose management and performance fee percentages with incentive hurdle
      if relevant. Summarize in ≤3 sentences.
  draft_operations_workflow:
    agent: false
    description: Map core operational steps.
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on:
    - define_technology_stack
    - create_hiring_plan
    - develop_timeline_and_milestones
    prompt: 'Sketch daily trade lifecycle: idea generation → order entry → execution
      → confirmation → settlement → reconciliation. List each step with primary responsible
      party.'
  estimate_setup_and_operating_costs:
    agent: false
    description: Estimate annual cost of service providers and overhead.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on:
    - draft_fee_structure
    prompt: 'Provide a simple annual cost estimate in USD for each listed service
      provider plus overhead. Two columns: Cost Item | Estimated USD.'
  identify_regulatory_requirements:
    agent: false
    description: Identify required regulatory filings.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - design_compliance_program
    prompt: List the primary registrations or filings required for the selected entity
      and jurisdiction (e.g., SEC Form ADV). Provide governing body names.
  list_service_providers:
    agent: false
    description: Enumerate required third‑party providers.
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - estimate_setup_and_operating_costs
    - draft_operations_workflow
    prompt: 'Generate a checklist of mandatory external service providers: prime broker,
      fund administrator, auditor, legal counsel, compliance consultant, custodian.
      No descriptions.'
  outline_governance_structure:
    agent: false
    description: Define governance roles and responsibilities.
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: 'Draft a simple governance chart: roles of GP, investment manager, board.
      Limit to 5 roles with one-line duties each.'
  produce_final_fund_plan_summary:
    agent: false
    description: Create the final fund launch summary.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    prompt: Synthesize prior outputs into a concise executive summary (≤400 words)
      covering strategy, structure, risk, ops, fees, timeline.
  select_jurisdiction:
    agent: false
    description: Choose the fund's domicile location.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - choose_legal_entity_type
    - identify_regulatory_requirements
    prompt: Given the fund objectives, select an optimal jurisdiction and list 2 pros
      and 2 cons.
  set_performance_and_risk_targets:
    agent: false
    description: Quantify return and risk objectives.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - draft_fee_structure
    - design_risk_management_framework
    - compile_pitch_deck_outline
    prompt: Define numerical annual targets for gross return, volatility, Sharpe ratio,
      maximum drawdown consistent with the chosen strategy. Present as a 4-row table.
