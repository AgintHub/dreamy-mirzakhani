      \ and human infrastructure\")\n    )\n\n\ndef estimate_setup_and_operating_costs(define_technology_stack_input:\
      \ DefineTechnologyStackOutput, list_service_providers_input: ListServiceProvidersOutput,\
      \ **kwargs) -> EstimateSetupAndOperatingCostsOutput:\n    \"\"\"\n    Estimate\
      \ annual costs for service providers, technology systems, and\n    office/human\
