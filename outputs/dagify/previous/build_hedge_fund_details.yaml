      \ (\n        Field(..., description=\"Total number of essential FTE roles\"\
      )\n    )\n\n\nclass DevelopTimelineAndMilestonesOutput(BaseModel):\n    \"\"\
      \"Pydantic model for develop_timeline_and_milestones node outputs.\"\"\"\n \
