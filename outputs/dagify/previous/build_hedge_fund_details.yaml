          output: '["Research Analyst", "Senior Analyst", "Portfolio Manager", "Head
            of Trading", "Trading Desk", "Execution Team", "Post‑Trade Analyst", "Performance
            Analyst"]'
        parameters:
        - description: Asset classes/instruments that will constitute the investable
            universe, as returned by the `define_asset_universe` node.
          name: asset_classes
          type: List[str]
        - description: Mandatory third‑party service provider categories required
            for the fund, as returned by the `list_service_providers` node.
          name: service_provider_categories
          type: List[str]
        - description: Quantitative risk controls with their thresholds, as returned
            by the `design_risk_management_framework` node. Each tuple contains a
            control name and its numeric limit.
          name: risk_controls
          type: List[Tuple[str, float]]
        raises:
        - description: If any of the input lists are empty or have mismatched lengths.
          type: ValueError
        - description: If an input is not of the expected type.
          type: TypeError
        returns:
          description: 'A dictionary containing five keys: `step_sequence`, `responsible_party`,
            `asset_classes`, `risk_controls`, and `service_providers`. Each value
            is a list of strings ordered to match the trade lifecycle.'
          type: Dict[str, List[str]]
        summary: Generate a structured trade‑lifecycle workflow table for a hedge
          fund.
    prompt: Document trade lifecycle steps (idea generation → order entry → execution
      → etc.) with primary responsible party for each step in a 6-column table.
