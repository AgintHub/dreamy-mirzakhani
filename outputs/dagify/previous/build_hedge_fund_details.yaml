      \ AUM\", \"Deploy OMS and risk engine\", \"Go\n    live\", \"\", \"\", \"\"\
      , \"\", \"\", \"\", \"\"]}\n\n    \"\"\"\n    return DevelopTimelineAndMilestonesOutput(\n\
      \        month_numbers=[],\n        milestone_names=[],\n        milestone_descriptions=[],\n\
      \    )"
