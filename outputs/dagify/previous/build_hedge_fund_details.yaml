dag_type: plain_text
description: Generated workflow from UI.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Define the high‑level investment approach.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - define_asset_universe
    - set_performance_and_risk_targets
    prompt: Select one primary hedge fund strategy category that best serves the fund
      objectives (e.g., long/short equity, global macro). Provide a one‑sentence rationale.
  choose_legal_entity_type:
    agent: false
    description: Determine the legal vehicle for the fund.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on:
    - define_legal_entity_type
    - identify_regulatory_requirements
    - list_service_providers
    - outline_governance_structure
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Give a one‑sentence explanation.
  clarify_fund_objectives:
    agent: false
    description: Generate a concise objective statement that will guide all subsequent
      decisions.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - choose_investment_strategy
    - define_investor_profile
    - select_jurisdiction
    prompt: List the primary business objectives for the hedge fund. Produce a concise
      bullet list covering investment purpose, competitive edge, and long‑term vision
      (max 8 bullets). Do not include strategy details.
  create_hiring_plan:
    agent: false
    description: Determine initial staffing requirements.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    nodes_dependent_on:
    - execute_hiring_plan
    prompt: List essential full‑time positions for launch (max 8), with one‑line responsibility
      each. Align roles with operations workflow gaps.
  define_asset_universe:
    agent: false
    description: Enumerate tradable assets for the strategy.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - draft_operations_workflow
    prompt: List the specific asset classes and instruments the chosen strategy will
      trade (e.g., US large‑cap equities, S&P futures). Keep list ≤10 items.
  define_investor_profile:
    agent: false
    description: Identify the target investor segment.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: 'Based on the stated objectives, specify the ideal target investor profile
      (e.g., family offices, pensions). List key characteristics: typical ticket size,
      risk tolerance, liquidity preference, and geographic focus.'
  define_legal_entity_type:
    agent: false
    description: Determine the legal vehicle for the fund.
    name: define_legal_entity_type
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Give a one‑sentence explanation.
  define_technology_stack:
    agent: false
    description: Specify technology tools supporting operations.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on:
    - estimate_setup_and_operating_costs
    prompt: 'Identify required software and infrastructure components for each operations
      step (e.g., OMS, EMS, risk system). Present as 2‑column table: Ops Step | Tech
      Component.'
  design_compliance_program:
    agent: false
    description: Create internal compliance policies aligned with regulations.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: 'Generate a compliance checklist mapping each regulatory requirement to
      a specific internal policy or procedure. Table with columns: Requirement | Policy
      Reference.'
  design_risk_management_framework:
    agent: false
    description: Outline quantitative and qualitative risk controls.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on:
    - draft_operations_workflow
    prompt: 'List core risk controls aligned with the target metrics: position limits,
      VaR limits, stop‑loss rules, liquidity thresholds. Provide 4–6 bullet points.'
  draft_fee_structure:
    agent: false
    description: Define fee structure for the fund.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    prompt: Propose management and performance fee percentages that balance cost recovery
      and competitiveness. Include incentive hurdle if relevant. Summarize in ≤3 sentences.
  draft_operations_workflow:
    agent: false
    description: Map core trade and post‑trade operations.
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on:
    - define_technology_stack
    - estimate_setup_and_operating_costs
    prompt: 'Sketch the daily trade lifecycle: idea generation → order entry → execution
      → confirmation → settlement → reconciliation. List each step with primary responsible
      party (internal or provider).'
  estimate_setup_and_operating_costs:
    agent: false
    description: Estimate annual setup and operating expenses.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    - define_technology_stack
    nodes_dependent_on: []
    prompt: 'Provide a simple annual cost estimate (in USD) for each listed service
      provider plus overhead (office, tech). Present as two columns: Cost Item | Estimated
      USD.'
  execute_hiring_plan:
    agent: false
    description: Execute the hiring plan by specifying hiring steps and timelines.
    name: execute_hiring_plan
    nodes_depended_on:
    - create_hiring_plan
    nodes_dependent_on: []
    prompt: Outline the execution steps to hire the defined positions, including posting
      channels, interview process, and onboarding timeline.
  identify_regulatory_requirements:
    agent: false
    description: Catalog mandatory regulatory filings.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - design_compliance_program
    prompt: List the primary registrations or filings required for the selected entity
      and jurisdiction (e.g., SEC Form ADV). Provide citation to governing body names
      only.
  list_service_providers:
    agent: false
    description: Enumerate required third‑party service providers.
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - draft_operations_workflow
    - estimate_setup_and_operating_costs
    prompt: 'Generate a checklist of mandatory external service providers: prime broker,
      fund administrator, auditor, legal counsel, compliance consultant, and custodian.
      No descriptive text—just provider types.'
  outline_governance_structure:
    agent: false
    description: Define internal governance roles and duties.
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: 'Draft a simple governance chart: roles of GP, investment manager, board
      (if any). Limit to 5 roles with one‑line duties each.'
  select_jurisdiction:
    agent: false
    description: Identify the jurisdiction that best supports the fund’s objectives.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - choose_legal_entity_type
    prompt: Choose the optimal fund domicile (e.g., Cayman, Delaware, Luxembourg)
      considering the stated objectives. Provide 2 pros and 2 cons for the selected
      jurisdiction only.
  set_performance_and_risk_targets:
    agent: false
    description: Quantify desired performance and risk metrics.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - design_risk_management_framework
    - draft_fee_structure
    prompt: Define numerical annual targets for gross return, volatility (standard
      deviation), Sharpe ratio, and maximum drawdown consistent with the chosen strategy.
      Present as a 4‑row table.
