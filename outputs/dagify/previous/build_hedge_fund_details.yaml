  design_risk_management_framework:
    agent: false
    code_node_type: stub
    description: Create risk mitigation mechanism
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for choose_investment_strategy node outputs.\"\"\"\n    chosen_strategy: str\
      \ = (\n        Field(..., description=\"The specific hedge fund strategy selected\
      \ from the predefined categories\")\n    )\n    alignment_explanation: str =\
      \ (\n        Field(..., description=\"A one-sentence explanation of how the\
      \ chosen strategy supports the fund's objectives\")\n    )\n\n\nclass SetPerformanceAndRiskTargetsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_performance_and_risk_targets node outputs.\"\
      \"\"\n    annual_gross_return_target: float = (\n        Field(..., description=\"\
      Target annual gross return expressed as a decimal (e.g., 0.12 for 12%)\")\n\
      \    )\n    volatility_limit_pct: float = (\n        Field(..., description=\"\
      Maximum acceptable annual volatility expressed as a percentage (e.g., 15 for\
      \ 15%)\")\n    )\n    sharpe_ratio_goal: float = (\n        Field(..., description=\"\
      Desired Sharpe ratio target for the fund\")\n    )\n    max_drawdown_pct: float\
      \ = (\n        Field(..., description=\"Maximum acceptable peak\\u2011to\\u2011trough\
      \ drawdown expressed as a percentage (e.g., 20 for 20%)\")\n    )\n\n\nclass\
      \ DesignRiskManagementFrameworkOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for design_risk_management_framework node outputs.\"\"\"\n    control_name:\
      \ List[str] = (\n        Field(..., description=\"Names of the quantitative\
      \ risk controls implemented\")\n    )\n    control_limit: List[float] = (\n\
      \        Field(..., description=\"Numerical limit or threshold associated with\
      \ each control (e.g., VaR in % of AUM, position size cap in % of portfolio)\"\
      )\n    )\n\n\ndef design_risk_management_framework(choose_investment_strategy_input:\
      \ ChooseInvestmentStrategyOutput, set_performance_and_risk_targets_input: SetPerformanceAndRiskTargetsOutput,\
      \ **kwargs) -> DesignRiskManagementFrameworkOutput:\n    \"\"\"\n    Generate\
      \ a list of quantitative risk controls and their numeric limits based\n    on\
      \ the chosen investment strategy and performance targets.\n\n    Parameters\n\
      \    ----------\n    chosen_strategy : str\n        The hedge fund strategy\
      \ selected in the `choose_investment_strategy`\n        node (e.g., \"long/short\
      \ equity\", \"market neutral\", etc.).\n    annual_gross_return_target : float\n\
      \        Target annual gross return expressed as a decimal (e.g., 0.12 for\n\
      \        12%).\n    volatility_limit_pct : float\n        Maximum acceptable\
      \ annual volatility expressed as a percentage\n        (e.g., 15 for 15%).\n\
      \    sharpe_ratio_goal : float\n        Desired Sharpe ratio target for the\
      \ fund.\n    max_drawdown_pct : float\n        Maximum acceptable peak‑to‑trough\
      \ drawdown expressed as a percentage\n        (e.g., 20 for 20%).\n\n    Returns\n\
      \    -------\n    Tuple[List[str], List[float]]\n        Two lists: control_name\
      \ and control_limit, each element\n        corresponding by index.\n\n    Raises\n\
      \    ------\n    ValueError\n        If any numeric target is negative or out\
      \ of a realistic range (e.g.,\n        VaR > 100%).\n    KeyError\n        If\
      \ a required input key is missing from the arguments.\n\n    Examples\n    --------\n\
      \    >>> control_name, control_limit = design_risk_management_framework(\n \
      \   ...     chosen_strategy=\"long/short equity\",\n    ...     annual_gross_return_target=0.15,\n\
      \    ...     volatility_limit_pct=12.0,\n    ...     sharpe_ratio_goal=1.5,\n\
      \    ...     max_drawdown_pct=18.0)\n    >>> ]\n    \"control_name\": [\"VaR\
      \ limit\", \"Position size cap\", \"Liquidity threshold\",\n    \"Stop‑loss\
      \ level\"],\\n\"control_limit\": [2.5, 10.0, 5.0, 3.0]\n\n    >>> control_name,\
      \ control_limit = design_risk_management_framework(\n    ...     chosen_strategy=\"\
      market neutral\",\n    ...     annual_gross_return_target=0.10,\n    ...   \
      \  volatility_limit_pct=8.0,\n    ...     sharpe_ratio_goal=1.2,\n    ...  \
      \   max_drawdown_pct=12.0)\n    >>> ]\n    \"control_name\": [\"VaR limit\"\
      , \"Position size cap\", \"Liquidity\n    threshold\"],\\n\"control_limit\"\
      : [1.8, 8.0, 4.0]\n\n    \"\"\"\n    return DesignRiskManagementFrameworkOutput(\n\
      \        control_name=[],\n        control_limit=[],\n    )"
    name: design_risk_management_framework
    nodes_depended_on:
    - choose_investment_strategy
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    output_structure:
    - description: Names of the quantitative risk controls implemented
      key: control_name
      type: List[str]
    - description: Numerical limit or threshold associated with each control (e.g.,
        VaR in % of AUM, position size cap in % of portfolio)
      key: control_limit
      type: List[float]
    prd:
      conceptual_info: This node specifies the quantitative risk controls that will
        govern the hedge fund’s trading activities.  It takes the investment strategy
        and the performance‑and‑risk targets defined upstream to produce a concise
        list of control names and their numeric thresholds, enabling downstream nodes
        to incorporate these limits into the pitch deck, compliance program, and operations
        workflow.
      docstring:
        examples:
        - lines:
          - control_name, control_limit = design_risk_management_framework(
          - '    chosen_strategy="long/short equity",'
          - '    annual_gross_return_target=0.15,'
          - '    volatility_limit_pct=12.0,'
          - '    sharpe_ratio_goal=1.5,'
          - '    max_drawdown_pct=18.0)'
          - ']'
          output: '"control_name": ["VaR limit", "Position size cap", "Liquidity threshold",
            "Stop‑loss level"],\n"control_limit": [2.5, 10.0, 5.0, 3.0]'
        - lines:
          - control_name, control_limit = design_risk_management_framework(
          - '    chosen_strategy="market neutral",'
          - '    annual_gross_return_target=0.10,'
          - '    volatility_limit_pct=8.0,'
          - '    sharpe_ratio_goal=1.2,'
          - '    max_drawdown_pct=12.0)'
          - ']'
          output: '"control_name": ["VaR limit", "Position size cap", "Liquidity threshold"],\n"control_limit":
            [1.8, 8.0, 4.0]'
        parameters:
        - description: The hedge fund strategy selected in the `choose_investment_strategy`
            node (e.g., "long/short equity", "market neutral", etc.).
          name: chosen_strategy
          type: str
        - description: Target annual gross return expressed as a decimal (e.g., 0.12
            for 12%).
          name: annual_gross_return_target
          type: float
        - description: Maximum acceptable annual volatility expressed as a percentage
            (e.g., 15 for 15%).
          name: volatility_limit_pct
          type: float
        - description: Desired Sharpe ratio target for the fund.
          name: sharpe_ratio_goal
          type: float
        - description: Maximum acceptable peak‑to‑trough drawdown expressed as a percentage
            (e.g., 20 for 20%).
          name: max_drawdown_pct
          type: float
        raises:
        - description: If any numeric target is negative or out of a realistic range
            (e.g., VaR > 100%).
          type: ValueError
        - description: If a required input key is missing from the arguments.
          type: KeyError
        returns:
          description: 'Two lists: control_name and control_limit, each element corresponding
            by index.'
          type: Tuple[List[str], List[float]]
        summary: Generate a list of quantitative risk controls and their numeric limits
          based on the chosen investment strategy and performance targets.
    prompt: List 4-6 quantitative risk controls (e.g., VaR limits, position size caps,
      liquidity thresholds, stop-loss levels) in bullet form.
    shims: []
