dag_type: typed
description: Generated workflow from UI.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Select primary investment approach and strategy classification
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The specific hedge fund strategy selected from the predefined categories
      key: chosen_strategy
      type: str
    - description: A one‑sentence explanation of how the chosen strategy supports
        the fund's objectives
      key: alignment_explanation
      type: str
    prompt: 'Select one specific hedge fund strategy from these categories: long/short
      equity, market neutral, global macro, event-driven, or arbitrage. Explain in
      one sentence how it aligns with the stated objectives.'
  choose_legal_entity_type:
    agent: false
    description: Specify fund structure and legal form
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The chosen legal entity type (e.g., LP, LLC, SICAV)
      key: legal_entity_type
      type: str
    - description: One-sentence explanation of why this structure suits the strategic
        goals
      key: rationale
      type: str
    prompt: Select the legal entity type (e.g., LP, LLC, SICAV) for the chosen jurisdiction.
      Explain in one sentence why this structure suits the strategic goals.
  clarify_fund_objectives:
    agent: false
    description: Define the core business and investment objectives for the hedge
      fund
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A list of up to eight bullet points outlining the hedge fund's
        primary business objectives, covering investment purpose, risk/reward expectations,
        and target market differentiation.
      key: investment_objectives
      type: List[str]
    prompt: State the primary business objectives for the hedge fund in bullet list
      format (maximum 8 bullets). Focus only on investment purpose, risk/reward expectations,
      and target market differentiation.
  compile_pitch_deck_outline:
    agent: false
    description: Framework for investor presentation
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    - outline_governance_structure
    nodes_dependent_on: []
    output_structure:
    - description: An ordered list of the 10 slide titles for the investor pitch deck
      key: slide_titles
      type: List[str]
    prompt: Create 10-slide presentation outline (slide titles only) covering objectives,
      strategy, investor profile, risk controls, fee model, and operations.
  create_hiring_plan:
    agent: false
    description: Determine staffing requirements
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    - outline_governance_structure
    nodes_dependent_on: []
    output_structure:
    - description: List of essential FTE roles
      key: essential_roles
      type: List[str]
    - description: List of core responsibilities for each role
      key: core_responsibilities
      type: List[str]
    - description: Total number of essential FTE roles
      key: role_count
      type: int
    prompt: List 8-10 essential FTE roles with core responsibilities in bullet form.
      Align roles with operations workflow gaps.
  define_asset_universe:
    agent: false
    description: Specify tradable asset categories
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: List of specific asset classes/instruments that will constitute
        the investable universe
      key: asset_classes
      type: List[str]
    - description: Number of asset classes listed
      key: number_of_assets
      type: int
    prompt: List 5-10 specific asset classes/instruments (e.g., US equities, emerging
      markets bonds, commodities futures) that will constitute the investable universe.
  define_investor_profile:
    agent: false
    description: Characterize target investor demographic
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: List of 4 key characteristics of the target investor profile
      key: investor_profile_characteristics
      type: List[str]
    prompt: Specify the ideal investor profile (e.g., institutional vs retail, geography,
      minimum investment, liquidity requirements). List 4 key characteristics in bullet
      form.
  define_technology_stack:
    agent: false
    description: Specify required software systems
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of operational steps as identified in the draft_operations_workflow
        node
      key: step_names
      type: List[str]
    - description: Ordered list of corresponding technology components needed for
        each step; each entry aligns with the same index in step_names
      key: tech_components
      type: List[str]
    prompt: Create 2-column table matching each operational step to its required technology
      component (e.g., Order Management System for order entry).
  design_compliance_program:
    agent: false
    description: Create regulatory compliance framework
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: List of regulatory requirements identified for the fund
      key: regulations
      type: List[str]
    - description: List of corresponding internal policies or controls mapped to each
        regulatory requirement
      key: policies_controls
      type: List[str]
    - description: Total number of regulatory-policy/control entries created (should
        be between 7 and 10)
      key: entry_count
      type: int
    prompt: Map each regulatory requirement to a specific internal policy/control
      with 7-10 entries in a 2-column table.
  design_risk_management_framework:
    agent: false
    description: Create risk mitigation mechanism
    name: design_risk_management_framework
    nodes_depended_on:
    - choose_investment_strategy
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    output_structure:
    - description: Names of the quantitative risk controls implemented
      key: control_name
      type: List[str]
    - description: Numerical limit or threshold associated with each control (e.g.,
        VaR in % of AUM, position size cap in % of portfolio)
      key: control_limit
      type: List[float]
    prompt: List 4-6 quantitative risk controls (e.g., VaR limits, position size caps,
      liquidity thresholds, stop-loss levels) in bullet form.
  develop_timeline_and_milestones:
    agent: false
    description: Create implementation schedule
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - compile_pitch_deck_outline
    - draft_fee_structure
    - estimate_setup_and_operating_costs
    - create_hiring_plan
    nodes_dependent_on: []
    output_structure:
    - description: Sequence of month numbers (1-12) for the roadmap
      key: month_numbers
      type: List[int]
    - description: Short name of each milestone corresponding to each month
      key: milestone_names
      type: List[str]
    - description: Brief description of each milestone activity for the given month
      key: milestone_descriptions
      type: List[str]
    prompt: 'Prepare 12-month roadmap with these milestones: regulatory filing, service
      provider onboarding, capital raise, tech deployment, and launch.'
  draft_fee_structure:
    agent: false
    description: Define fee model parameters
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    output_structure:
    - description: Management fee as a percentage of assets under management (AUM).
      key: management_fee_percent
      type: float
    - description: Performance fee as a percentage of returns generated by the fund.
      key: performance_fee_percent
      type: float
    - description: Hurdle rate as a percentage of returns that must be achieved before
        performance fee is applied. Use 0 if not applicable.
      key: hurdle_rate_percent
      type: float
    - description: Short explanatory sentence summarizing the fee structure and its
        alignment with fund objectives.
      key: fee_commentary
      type: str
    prompt: Specify management fee (x% AUM) and performance fee (y% returns) with
      hurdle rate (z%) if applicable in ≤3 sentences.
  draft_operations_workflow:
    agent: false
    description: Map operational processes
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of trade lifecycle steps.
      key: step_sequence
      type: List[str]
    - description: Primary responsible party for each corresponding step.
      key: responsible_party
      type: List[str]
    - description: List of asset classes/instruments in the investable universe.
      key: asset_classes
      type: List[str]
    - description: Quantitative risk controls applied to the workflow.
      key: risk_controls
      type: List[str]
    - description: Mandatory third‑party service provider categories required for
        execution.
      key: service_providers
      type: List[str]
    prompt: Document trade lifecycle steps (idea generation → order entry → execution
      → etc.) with primary responsible party for each step in a 6-column table.
  estimate_setup_and_operating_costs:
    agent: false
    description: Quantify financial resources needed
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - define_technology_stack
    - list_service_providers
    nodes_dependent_on: []
    output_structure:
    - description: Estimated total annual cost in USD for all service providers listed
      key: service_provider_cost_usd
      type: float
    - description: Estimated total annual cost in USD for all required technology
        systems
      key: technology_systems_cost_usd
      type: float
    - description: Estimated total annual cost in USD for office space, hardware,
        and human infrastructure
      key: office_human_infrastructure_cost_usd
      type: float
    prompt: 'Provide USD cost estimates for: 1) service providers, 2) technology systems,
      3) office/human infrastructure in a 3-column table.'
  identify_regulatory_requirements:
    agent: false
    description: List mandatory compliance obligations
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: The legal entity type selected for the fund (e.g., LP, LLC, SICAV).
      key: legal_entity_type
      type: str
    - description: A list of 6 to 8 required regulatory filings or registrations applicable
        to the selected entity and jurisdiction.
      key: regulatory_filings
      type: List[str]
    prompt: List 6-8 required regulatory filings/registrations (e.g., SEC Form CFA,
      EFIS, AIFM) for the selected entity/jurisdiction.
  list_service_providers:
    agent: false
    description: Identify required third-party vendors
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: List of mandatory service provider categories required for the
        hedge fund setup
      key: service_provider_categories
      type: List[str]
    prompt: List 6-8 mandatory service provider categories (e.g., prime broker, custodian,
      compliance consultant) with no additional descriptions.
  outline_governance_structure:
    agent: false
    description: Define management and oversight framework
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: List of the five leadership roles defined for the fund
      key: roles
      type: List[str]
    - description: One-sentence duty description corresponding to each role in the
        same order as the roles list
      key: duties
      type: List[str]
    prompt: Specify 5 leadership roles (e.g., GP, CIO, CFO, etc.) with one-sentence
      duties each in a bullet list.
  produce_final_fund_plan_summary:
    agent: false
    description: Generate consolidated launch document
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - develop_timeline_and_milestones
    - compile_pitch_deck_outline
    - design_compliance_program
    nodes_dependent_on: []
    output_structure:
    - description: Bullet points summarizing the investment strategy
      key: strategy_bullet_points
      type: List[str]
    - description: Bullet points summarizing the legal entity and organizational structure
      key: structure_bullet_points
      type: List[str]
    - description: Bullet points outlining the risk management framework
      key: risk_framework_bullet_points
      type: List[str]
    - description: Bullet points describing the operational workflow and staffing
      key: operational_plan_bullet_points
      type: List[str]
    - description: Bullet points detailing the management and performance fee structure
      key: fee_model_bullet_points
      type: List[str]
    - description: Bullet points presenting the 12‑month implementation timeline
      key: timeline_bullet_points
      type: List[str]
    - description: Total word count of the executive summary
      key: word_count
      type: int
    prompt: Synthesize fund DNA into ≤400 word executive summary covering strategy,
      structure, risk framework, operational plan, fee model, and timeline using bullet
      points.
  select_jurisdiction:
    agent: false
    description: Determine optimal fund registration location
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen fund domicile name
      key: jurisdiction_name
      type: str
    - description: One sentence explanation for selecting this jurisdiction
      key: rationale
      type: str
    - description: Two key advantages of the chosen jurisdiction
      key: pros
      type: List[str]
    - description: Two key disadvantages or challenges of the chosen jurisdiction
      key: cons
      type: List[str]
    prompt: Choose a fund domicile (e.g., Cayman Islands, Delaware, Luxembourg) based
      on the stated objectives. Provide one sentence rationale with 2 pros/2 cons
      for this jurisdiction choice.
  set_performance_and_risk_targets:
    agent: false
    description: Quantify financial and risk metrics
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Target annual gross return expressed as a decimal (e.g., 0.12 for
        12%)
      key: annual_gross_return_target
      type: float
    - description: Maximum acceptable annual volatility expressed as a percentage
        (e.g., 15 for 15%)
      key: volatility_limit_pct
      type: float
    - description: Desired Sharpe ratio target for the fund
      key: sharpe_ratio_goal
      type: float
    - description: Maximum acceptable peak‑to‑trough drawdown expressed as a percentage
        (e.g., 20 for 20%)
      key: max_drawdown_pct
      type: float
    prompt: Define annual gross return target, volatility limit (as %), Sharpe ratio
      goal, and maximum acceptable drawdown (as %) in a 4-row table.
