  draft_operations_workflow:
    agent: false
    code_node_type: stub
    description: Map operational processes
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefineAssetUniverseOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ define_asset_universe node outputs.\"\"\"\n    asset_classes: List[str] =\
      \ (\n        Field(..., description=\"List of specific asset classes/instruments\
      \ that will constitute the investable universe\")\n    )\n    number_of_assets:\
      \ int = (\n        Field(..., description=\"Number of asset classes listed\"\
      )\n    )\n\n\nclass ListServiceProvidersOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for list_service_providers node outputs.\"\"\"\n    service_provider_categories:\
      \ List[str] = (\n        Field(..., description=\"List of mandatory service\
      \ provider categories required for the hedge fund setup\")\n    )\n\n\nclass\
      \ DesignRiskManagementFrameworkOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for design_risk_management_framework node outputs.\"\"\"\n    control_name:\
      \ List[str] = (\n        Field(..., description=\"Names of the quantitative\
      \ risk controls implemented\")\n    )\n    control_limit: List[float] = (\n\
      \        Field(..., description=\"Numerical limit or threshold associated with\
      \ each control (e.g., VaR in % of AUM, position size cap in % of portfolio)\"\
      )\n    )\n\n\nclass DraftOperationsWorkflowOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for draft_operations_workflow node outputs.\"\"\"\n    step_sequence:\
      \ List[str] = (\n        Field(..., description=\"Ordered list of trade lifecycle\
      \ steps.\")\n    )\n    responsible_party: List[str] = (\n        Field(...,\
      \ description=\"Primary responsible party for each corresponding step.\")\n\
      \    )\n    asset_classes: List[str] = (\n        Field(..., description=\"\
      List of asset classes/instruments in the investable universe.\")\n    )\n  \
      \  risk_controls: List[str] = (\n        Field(..., description=\"Quantitative\
      \ risk controls applied to the workflow.\")\n    )\n    service_providers: List[str]\
      \ = (\n        Field(..., description=\"Mandatory third\\u2011party service\
      \ provider categories required for execution.\")\n    )\n\n\ndef draft_operations_workflow(define_asset_universe_input:\
      \ DefineAssetUniverseOutput, list_service_providers_input: ListServiceProvidersOutput,\
      \ design_risk_management_framework_input: DesignRiskManagementFrameworkOutput,\
      \ **kwargs) -> DraftOperationsWorkflowOutput:\n    \"\"\"\n    Generate a structured\
      \ trade‑lifecycle workflow table for a hedge fund.\n\n    Parameters\n    ----------\n\
      \    asset_classes : List[str]\n        Asset classes/instruments that will\
      \ constitute the investable\n        universe, as returned by the `define_asset_universe`\
      \ node.\n    service_provider_categories : List[str]\n        Mandatory third‑party\
      \ service provider categories required for the\n        fund, as returned by\
      \ the `list_service_providers` node.\n    risk_controls : List[Tuple[str, float]]\n\
      \        Quantitative risk controls with their thresholds, as returned by the\n\
      \        `design_risk_management_framework` node. Each tuple contains a\n  \
      \      control name and its numeric limit.\n\n    Returns\n    -------\n   \
      \ Dict[str, List[str]]\n        A dictionary containing five keys: `step_sequence`,\n\
      \        `responsible_party`, `asset_classes`, `risk_controls`, and\n      \
      \  `service_providers`. Each value is a list of strings ordered to\n       \
      \ match the trade lifecycle.\n\n    Raises\n    ------\n    ValueError\n   \
      \     If any of the input lists are empty or have mismatched lengths.\n    TypeError\n\
      \        If an input is not of the expected type.\n\n    Examples\n    --------\n\
      \    >>> asset_classes = [\"US Equities\", \"Emerging Markets Bonds\", \"Commodities\n\
      \    Futures\"],\n    >>> service_provider_categories = [\"Prime Broker\", \"\
      Custodian\", \"Compliance\n    Consultant\"],\n    >>> risk_controls = [(\"\
      VaR Limit\", 2.5), (\"Position Size Cap\", 5.0),\n    (\"Liquidity Threshold\"\
      , 3.0)]\n    >>> workflow = draft_operations_workflow(asset_classes,\n    service_provider_categories,\
      \ risk_controls)\n    >>> print(workflow[\"step_sequence\"])\n    [\"Idea Generation\"\
      , \"Idea Screening\", \"Research\", \"Trade Decision\", \"Order\n    Entry\"\
      , \"Execution\", \"Post‑Trade Processing\", \"Performance Reporting\"]\n\n \
      \   >>> print(workflow[\"responsible_party\"])\n    [\"Research Analyst\", \"\
      Senior Analyst\", \"Portfolio Manager\", \"Head of\n    Trading\", \"Trading\
      \ Desk\", \"Execution Team\", \"Post‑Trade Analyst\",\n    \"Performance Analyst\"\
      ]\n\n    \"\"\"\n    return DraftOperationsWorkflowOutput(\n        step_sequence=[],\n\
      \        responsible_party=[],\n        asset_classes=[],\n        risk_controls=[],\n\
      \        service_providers=[],\n    )"
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of trade lifecycle steps.
      key: step_sequence
