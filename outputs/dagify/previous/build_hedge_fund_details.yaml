name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    code_node_type: stub
    description: Select primary investment approach and strategy classification
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ClarifyFundObjectivesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for clarify_fund_objectives node outputs.\"\"\"\n    investment_objectives:\
      \ List[str] = (\n        Field(..., description=\"A list of up to eight bullet\
      \ points outlining the hedge fund's primary business objectives, covering investment\
      \ purpose, risk/reward expectations, and target market differentiation.\")\n\
      \    )\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for choose_investment_strategy node outputs.\"\"\"\n    chosen_strategy:\
      \ str = (\n        Field(..., description=\"The specific hedge fund strategy\
      \ selected from the predefined categories\")\n    )\n    alignment_explanation:\
      \ str = (\n        Field(..., description=\"A one-sentence explanation of how\
      \ the chosen strategy supports the fund's objectives\")\n    )\n\n\ndef choose_investment_strategy(clarify_fund_objectives_input:\
      \ ClarifyFundObjectivesOutput, **kwargs) -> ChooseInvestmentStrategyOutput:\n\
      \    \"\"\"\n    Selects a hedge fund strategy and explains its alignment with\
      \ fund\n    objectives.\n\n    Parameters\n    ----------\n    investment_objectives\
      \ : List[str]\n        List of fund objectives defined in the clarify_fund_objectives\
      \ node\n\n    Returns\n    -------\n    {chosen_strategy: str, alignment_explanation:\
      \ str}\n        A dictionary containing the chosen strategy and its alignment\n\
      \        explanation\n\n    Raises\n    ------\n    ValueError\n        If the\
      \ chosen strategy is not one of the predefined categories\n\n    Examples\n\
      \    --------\n    >>> investment_objectives = ['generate alpha', 'manage risk']\n\
      \    >>> chosen_strategy = 'long/short equity'\n    >>> alignment_explanation\
      \ = 'The long/short equity strategy aligns with the\n    objectives by generating\
      \ alpha through stock selection and managing risk\n    through hedging'\n  \
      \  {'chosen_strategy': 'long/short equity', 'alignment_explanation': 'The\n\
      \    long/short equity strategy aligns with the objectives by generating alpha\n\
      \    through stock selection and managing risk through hedging'}\n\n    \"\"\
      \"\n    return ChooseInvestmentStrategyOutput(\n        chosen_strategy=\"\"\
      ,\n        alignment_explanation=\"\",\n    )"
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The specific hedge fund strategy selected from the predefined categories
      key: chosen_strategy
      type: str
    - description: A one-sentence explanation of how the chosen strategy supports
        the fund's objectives
      key: alignment_explanation
      type: str
    prd:
      conceptual_info: This node selects a primary investment strategy and explains
        its alignment with the fund's objectives.
      docstring:
        examples:
        - lines:
          - investment_objectives = ['generate alpha', 'manage risk']
          - chosen_strategy = 'long/short equity'
          - alignment_explanation = 'The long/short equity strategy aligns with the
            objectives by generating alpha through stock selection and managing risk
            through hedging'
          output: '{''chosen_strategy'': ''long/short equity'', ''alignment_explanation'':
            ''The long/short equity strategy aligns with the objectives by generating
            alpha through stock selection and managing risk through hedging''}'
        parameters:
        - description: List of fund objectives defined in the clarify_fund_objectives
            node
          name: investment_objectives
          type: List[str]
        raises:
        - description: If the chosen strategy is not one of the predefined categories
          type: ValueError
        returns:
          description: A dictionary containing the chosen strategy and its alignment
            explanation
          type: '{chosen_strategy: str, alignment_explanation: str}'
        summary: Selects a hedge fund strategy and explains its alignment with fund
          objectives.
    prompt: 'Select one specific hedge fund strategy from these categories: long/short
      equity, market neutral, global macro, event-driven, or arbitrage. Explain in
      one sentence how it aligns with the stated objectives.'
    shims: []
  choose_legal_entity_type:
    agent: false
    code_node_type: stub
    description: Specify fund structure and legal form
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass SelectJurisdictionOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ select_jurisdiction node outputs.\"\"\"\n    jurisdiction_name: str = (\n\
      \        Field(..., description=\"The chosen fund domicile name\")\n    )\n\
      \    rationale: str = (\n        Field(..., description=\"One sentence explanation\
      \ for selecting this jurisdiction\")\n    )\n    pros: List[str] = (\n     \
      \   Field(..., description=\"Two key advantages of the chosen jurisdiction\"\
      )\n    )\n    cons: List[str] = (\n        Field(..., description=\"Two key\
      \ disadvantages or challenges of the chosen jurisdiction\")\n    )\n\n\nclass\
      \ ChooseLegalEntityTypeOutput(BaseModel):\n    \"\"\"Pydantic model for choose_legal_entity_type\
      \ node outputs.\"\"\"\n    legal_entity_type: str = (\n        Field(..., description=\"\
      The chosen legal entity type (e.g., LP, LLC, SICAV)\")\n    )\n    rationale:\
      \ str = (\n        Field(..., description=\"One-sentence explanation of why\
      \ this structure suits the strategic goals\")\n    )\n\n\ndef choose_legal_entity_type(select_jurisdiction_input:\
      \ SelectJurisdictionOutput, **kwargs) -> ChooseLegalEntityTypeOutput:\n    \"\
      \"\"\n    Executes the selection of a legal entity type based on the chosen\n\
      \    jurisdiction and provides a rationale for the choice.\n\n    Parameters\n\
      \    ----------\n    jurisdiction_name : str\n        The name of the jurisdiction\
      \ selected in the previous node.\n    rationale_for_jurisdiction : str\n   \
      \     The rationale provided for choosing the jurisdiction.\n\n    Returns\n\
      \    -------\n    dict\n        A dictionary containing the chosen legal entity\
      \ type and the\n        rationale for the selection.\n\n    Raises\n    ------\n\
      \    ValueError\n        If the jurisdiction name or rationale is empty.\n\n\
      \    Examples\n    --------\n    >>> choose_legal_entity_type(jurisdiction_name='Cayman\
      \ Islands',\n    rationale_for_jurisdiction='Tax efficiency and minimal regulatory\n\
      \    oversight.')\n    {'legal_entity_type': 'LP', 'rationale': 'LP structure\
      \ is suitable for the\n    Cayman Islands due to its flexibility and tax benefits.'}\n\
      \n    \"\"\"\n    return ChooseLegalEntityTypeOutput(\n        legal_entity_type=\"\
      \",\n        rationale=\"\",\n    )"
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The chosen legal entity type (e.g., LP, LLC, SICAV)
      key: legal_entity_type
      type: str
    - description: One-sentence explanation of why this structure suits the strategic
        goals
      key: rationale
      type: str
    prd:
      conceptual_info: This node determines the appropriate legal structure for a
        hedge fund based on the previously selected jurisdiction.
      docstring:
        examples:
        - lines:
          - choose_legal_entity_type(jurisdiction_name='Cayman Islands', rationale_for_jurisdiction='Tax
            efficiency and minimal regulatory oversight.')
          output: '{''legal_entity_type'': ''LP'', ''rationale'': ''LP structure is
            suitable for the Cayman Islands due to its flexibility and tax benefits.''}'
        parameters:
        - description: The name of the jurisdiction selected in the previous node.
          name: jurisdiction_name
          type: str
        - description: The rationale provided for choosing the jurisdiction.
          name: rationale_for_jurisdiction
          type: str
        raises:
        - description: If the jurisdiction name or rationale is empty.
          type: ValueError
        returns:
          description: A dictionary containing the chosen legal entity type and the
            rationale for the selection.
          type: dict
        summary: Executes the selection of a legal entity type based on the chosen
          jurisdiction and provides a rationale for the choice.
    prompt: Select the legal entity type (e.g., LP, LLC, SICAV) for the chosen jurisdiction.
      Explain in one sentence why this structure suits the strategic goals.
    shims: []
  clarify_fund_objectives:
    agent: false
    code_node_type: stub
    description: Define the core business and investment objectives for the hedge
      fund
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ClarifyFundObjectivesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for clarify_fund_objectives node outputs.\"\"\"\n    investment_objectives:\
      \ List[str] = (\n        Field(..., description=\"A list of up to eight bullet\
      \ points outlining the hedge fund's primary business objectives, covering investment\
      \ purpose, risk/reward expectations, and target market differentiation.\")\n\
      \    )\n\n\ndef clarify_fund_objectives(general_input: str, **kwargs) -> ClarifyFundObjectivesOutput:\n\
      \    \"\"\"\n    Generate a list of up to eight bullet points that capture the\
      \ hedge fund’s\n    investment purpose, risk/reward expectations, and target\
      \ market\n    differentiation.\n\n    Parameters\n    ----------\n    prompt\
      \ : str\n        Instruction string that specifies the maximum number of bullets\
      \ and\n        the focus areas (investment purpose, risk/reward, target market).\n\
      \n    Returns\n    -------\n    List[str]\n        A list of bullet‑point strings,\
      \ each describing a distinct business\n        or investment objective.\n\n\
      \    Raises\n    ------\n    ValueError\n        Raised if the input prompt\
      \ is empty or does not contain a clear\n        instruction.\n\n    Examples\n\
      \    --------\n    >>> output = clarify_fund_objectives(prompt)\n    >>> print(output)\n\
      \    [\"Generate alpha through a diversified long/short equity strategy.\",\n\
      \    \"Maintain portfolio volatility below 15% annualized.\", \"Deliver 20%\
      \ gross\n    annual returns to institutional investors.\", \"Differentiate by\
      \ leveraging\n    proprietary quantitative models.\"]\n\n    >>> output = clarify_fund_objectives(prompt)\n\
      \    >>> print(len(output))\n    4\n\n    \"\"\"\n    return ClarifyFundObjectivesOutput(\n\
      \        investment_objectives=[],\n    )"
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A list of up to eight bullet points outlining the hedge fund's
        primary business objectives, covering investment purpose, risk/reward expectations,
        and target market differentiation.
      key: investment_objectives
      type: List[str]
    prd:
      conceptual_info: Generates a concise, bullet‑point list of the hedge fund’s
        core business and investment objectives, providing a clear foundation for
        strategy selection, legal structuring, investor targeting, and jurisdiction
        choice.
      docstring:
        examples:
        - lines:
          - output = clarify_fund_objectives(prompt)
          - print(output)
          output: '["Generate alpha through a diversified long/short equity strategy.",
            "Maintain portfolio volatility below 15% annualized.", "Deliver 20% gross
            annual returns to institutional investors.", "Differentiate by leveraging
            proprietary quantitative models."]'
        - lines:
          - output = clarify_fund_objectives(prompt)
          - print(len(output))
          output: '4'
        parameters:
        - description: Instruction string that specifies the maximum number of bullets
            and the focus areas (investment purpose, risk/reward, target market).
          name: prompt
          type: str
        raises:
        - description: Raised if the input prompt is empty or does not contain a clear
            instruction.
          type: ValueError
        returns:
          description: A list of bullet‑point strings, each describing a distinct
            business or investment objective.
          type: List[str]
        summary: Generate a list of up to eight bullet points that capture the hedge
          fund’s investment purpose, risk/reward expectations, and target market differentiation.
    prompt: State the primary business objectives for the hedge fund in bullet list
      format (maximum 8 bullets). Focus only on investment purpose, risk/reward expectations,
      and target market differentiation.
    shims: []
  compile_pitch_deck_outline:
    agent: false
    code_node_type: stub
    description: Generates a concise list of 10 slide titles for an investor pitch
      deck, pulling key themes from related fund design nodes.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ClarifyFundObjectivesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for clarify_fund_objectives node outputs.\"\"\"\n    investment_objectives:\
      \ List[str] = (\n        Field(..., description=\"A list of up to eight bullet\
      \ points outlining the hedge fund's primary business objectives, covering investment\
      \ purpose, risk/reward expectations, and target market differentiation.\")\n\
      \    )\n\n\nclass DefineInvestorProfileOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for define_investor_profile node outputs.\"\"\"\n    investor_profile_characteristics:\
      \ List[str] = (\n        Field(..., description=\"List of 4 key characteristics\
      \ of the target investor profile\")\n    )\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_investment_strategy node outputs.\"\"\"\
      \n    chosen_strategy: str = (\n        Field(..., description=\"The specific\
      \ hedge fund strategy selected from the predefined categories\")\n    )\n  \
      \  alignment_explanation: str = (\n        Field(..., description=\"A one-sentence\
      \ explanation of how the chosen strategy supports the fund's objectives\")\n\
      \    )\n\n\nclass SetPerformanceAndRiskTargetsOutput(BaseModel):\n    \"\"\"\
      Pydantic model for set_performance_and_risk_targets node outputs.\"\"\"\n  \
      \  annual_gross_return_target: float = (\n        Field(..., description=\"\
      Target annual gross return expressed as a decimal (e.g., 0.12 for 12%)\")\n\
      \    )\n    volatility_limit_pct: float = (\n        Field(..., description=\"\
      Maximum acceptable annual volatility expressed as a percentage (e.g., 15 for\
      \ 15%)\")\n    )\n    sharpe_ratio_goal: float = (\n        Field(..., description=\"\
      Desired Sharpe ratio target for the fund\")\n    )\n    max_drawdown_pct: float\
      \ = (\n        Field(..., description=\"Maximum acceptable peak\\u2011to\\u2011trough\
      \ drawdown expressed as a percentage (e.g., 20 for 20%)\")\n    )\n\n\nclass\
      \ DraftFeeStructureOutput(BaseModel):\n    \"\"\"Pydantic model for draft_fee_structure\
      \ node outputs.\"\"\"\n    management_fee_percent: float = (\n        Field(...,\
      \ description=\"Management fee as a percentage of assets under management (AUM).\"\
      )\n    )\n    performance_fee_percent: float = (\n        Field(..., description=\"\
      Performance fee as a percentage of returns generated by the fund.\")\n    )\n\
      \    hurdle_rate_percent: float = (\n        Field(..., description=\"Hurdle\
      \ rate as a percentage of returns that must be achieved before performance fee\
      \ is applied. Use 0 if not applicable.\")\n    )\n    fee_commentary: str =\
      \ (\n        Field(..., description=\"Short explanatory sentence summarizing\
      \ the fee structure and its alignment with fund objectives.\")\n    )\n\n\n\
      class DesignRiskManagementFrameworkOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for design_risk_management_framework node outputs.\"\"\"\n    control_name:\
      \ List[str] = (\n        Field(..., description=\"Names of the quantitative\
      \ risk controls implemented\")\n    )\n    control_limit: List[float] = (\n\
      \        Field(..., description=\"Numerical limit or threshold associated with\
      \ each control (e.g., VaR in % of AUM, position size cap in % of portfolio)\"\
      )\n    )\n\n\nclass OutlineGovernanceStructureOutput(BaseModel):\n    \"\"\"\
      Pydantic model for outline_governance_structure node outputs.\"\"\"\n    roles:\
      \ List[str] = (\n        Field(..., description=\"List of the five leadership\
      \ roles defined for the fund\")\n    )\n    duties: List[str] = (\n        Field(...,\
      \ description=\"One-sentence duty description corresponding to each role in\
      \ the same order as the roles list\")\n    )\n\n\nclass CompilePitchDeckOutlineOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for compile_pitch_deck_outline node outputs.\"\"\"\
      \n    slide_titles: List[str] = (\n        Field(..., description=\"An ordered\
      \ list of the 10 slide titles for the investor pitch deck.\")\n    )\n\n\ndef\
      \ compile_pitch_deck_outline(clarify_fund_objectives_input: ClarifyFundObjectivesOutput,\
      \ define_investor_profile_input: DefineInvestorProfileOutput, choose_investment_strategy_input:\
      \ ChooseInvestmentStrategyOutput, set_performance_and_risk_targets_input: SetPerformanceAndRiskTargetsOutput,\
      \ draft_fee_structure_input: DraftFeeStructureOutput, design_risk_management_framework_input:\
      \ DesignRiskManagementFrameworkOutput, outline_governance_structure_input: OutlineGovernanceStructureOutput,\
      \ **kwargs) -> CompilePitchDeckOutlineOutput:\n    \"\"\"\n    Generate a 10‑slide\
      \ title list for an investor pitch deck.\n\n    Parameters\n    ----------\n\
      \    investment_objectives : List[str]\n        Bullet points from clarify_fund_objectives\
      \ outlining the fund’s\n        purpose, risk/reward, and market differentiation.\n\
      \    investor_profile_characteristics : List[str]\n        Four key traits defining\
      \ the target investor demographic, sourced\n        from define_investor_profile.\n\
      \    chosen_strategy : str\n        Primary hedge‑fund strategy selected in\
      \ choose_investment_strategy.\n    alignment_explanation : str\n        One‑sentence\
      \ rationale linking the chosen strategy to the fund’s\n        objectives.\n\
      \    annual_gross_return_target : float\n        Target gross return (decimal)\
      \ from set_performance_and_risk_targets.\n    volatility_limit_pct : float\n\
      \        Maximum acceptable volatility (percentage) from\n        set_performance_and_risk_targets.\n\
      \    sharpe_ratio_goal : float\n        Desired Sharpe ratio from set_performance_and_risk_targets.\n\
      \    max_drawdown_pct : float\n        Maximum acceptable drawdown (percentage)\
      \ from\n        set_performance_and_risk_targets.\n    management_fee_percent\
      \ : float\n        Management fee percentage (AUM) from draft_fee_structure.\n\
      \    performance_fee_percent : float\n        Performance fee percentage (returns)\
      \ from draft_fee_structure.\n    hurdle_rate_percent : float\n        Hurdle\
      \ rate percentage from draft_fee_structure.\n    control_name : List[str]\n\
      \        Names of quantitative risk controls from\n        design_risk_management_framework.\n\
      \    control_limit : List[float]\n        Numerical limits for each risk control.\n\
      \    roles : List[str]\n        Five leadership roles from outline_governance_structure.\n\
      \    duties : List[str]\n        One‑sentence duty for each leadership role.\n\
      \n    Returns\n    -------\n    List[str]\n        An ordered list of 10 slide\
      \ titles.\n\n    Raises\n    ------\n    ValueError\n        If any required\
      \ input list is empty or contains fewer items than\n        expected.\n\n  \
      \  Examples\n    --------\n    >>> slide_titles = compile_pitch_deck_outline(\n\
      \    ...     investment_objectives=['Generate alpha through market‑neutral\n\
      \    strategies', 'Cap volatility at 12%'],\n    ...     investor_profile_characteristics=['Institutional',\
      \ 'North America',\n    'Minimum $10M', 'Medium liquidity'],\n    ...     chosen_strategy='market\
      \ neutral',\n    ...     alignment_explanation='Aligns with low volatility goal',\n\
      \    ...     annual_gross_return_target=0.15,\n    ...     volatility_limit_pct=12.0,\n\
      \    ...     sharpe_ratio_goal=1.5,\n    ...     max_drawdown_pct=18.0,\n  \
      \  ...     management_fee_percent=1.5,\n    ...     performance_fee_percent=20.0,\n\
      \    ...     hurdle_rate_percent=5.0,\n    ...     control_name=['VaR limit',\
      \ 'Position size cap'],\n    ...     control_limit=[1.5, 5.0],\n    ...    \
      \ roles=['GP', 'CIO', 'CFO', 'Head of Ops', 'Chief Compliance'],\n    ...  \
      \   duties=['Oversight', 'Strategy', 'Finance', 'Operations',\n    'Compliance']\"\
      \                 \")\n    [\"1. Fund Objectives & Investment Thesis\", \"2.\
      \ Target Investor Profile\", \"3.\n    Core Investment Strategy\", \"4. Performance\
      \ & Risk Targets\", \"5. Fee &\n    Incentive Structure\", \"6. Quantitative\
      \ Risk Controls\", \"7. Governance &\n    Leadership\", \"8. Operations & Execution\
      \ Model\", \"9. Timeline & Milestones\",\n    \"10. Closing & Q&A\"]\n\n   \
      \ >>> slide_titles = compile_pitch_deck_outline(\n    ...     investment_objectives=['Alpha\
      \ generation', 'Risk‑adjusted returns'],\n    ...     investor_profile_characteristics=['Institutional',\
      \ 'Europe',\n    'Minimum $5M', 'High liquidity'],\n    ...     chosen_strategy='global\
      \ macro',\n    ...     alignment_explanation='Supports alpha generation via\
      \ macro\n    exposure',\n    ...     annual_gross_return_target=0.18,\n    ...\
      \     volatility_limit_pct=15.0,\n    ...     sharpe_ratio_goal=1.8,\n    ...\
      \     max_drawdown_pct=20.0,\n    ...     management_fee_percent=2.0,\n    ...\
      \     performance_fee_percent=25.0,\n    ...     hurdle_rate_percent=7.0,\n\
      \    ...     control_name=['Liquidity threshold'],\n    ...     control_limit=[10.0],\n\
      \    ...     roles=['GP', 'CIO', 'CFO', 'Head of Ops', 'Compliance Officer'],\n\
      \    ...     duties=['Oversight', 'Strategy', 'Finance', 'Operations',\n   \
      \ 'Compliance']\n    >>> )\n    [\"1. Fund Objectives & Investment Thesis\"\
      , \"2. Target Investor Profile\", \"3.\n    Core Investment Strategy\", \"4.\
      \ Performance & Risk Targets\", \"5. Fee &\n    Incentive Structure\", \"6.\
      \ Quantitative Risk Controls\", \"7. Governance &\n    Leadership\", \"8. Operations\
      \ & Execution Model\", \"9. Timeline & Milestones\",\n    \"10. Closing & Q&A\"\
      ]\n\n    \"\"\"\n    return CompilePitchDeckOutlineOutput(\n        slide_titles=[],\n\
      \    )"
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    - outline_governance_structure
    nodes_dependent_on: []
    output_structure:
    - description: An ordered list of the 10 slide titles for the investor pitch deck.
      key: slide_titles
      type: List[str]
    prd:
      conceptual_info: The node consolidates critical fund attributes into a structured
        slide‑title list, enabling a clear, investor‑focused narrative.
      docstring:
        examples:
        - lines:
          - slide_titles = compile_pitch_deck_outline(
          - '    investment_objectives=[''Generate alpha through market‑neutral strategies'',
            ''Cap volatility at 12%''],'
          - '    investor_profile_characteristics=[''Institutional'', ''North America'',
            ''Minimum $10M'', ''Medium liquidity''],'
          - '    chosen_strategy=''market neutral'','
          - '    alignment_explanation=''Aligns with low volatility goal'','
          - '    annual_gross_return_target=0.15,'
          - '    volatility_limit_pct=12.0,'
          - '    sharpe_ratio_goal=1.5,'
          - '    max_drawdown_pct=18.0,'
          - '    management_fee_percent=1.5,'
          - '    performance_fee_percent=20.0,'
          - '    hurdle_rate_percent=5.0,'
          - '    control_name=[''VaR limit'', ''Position size cap''],'
          - '    control_limit=[1.5, 5.0],'
          - '    roles=[''GP'', ''CIO'', ''CFO'', ''Head of Ops'', ''Chief Compliance''],'
          - "    duties=['Oversight', 'Strategy', 'Finance', 'Operations', 'Compliance']\"\
            \n                \")"
          output: '["1. Fund Objectives & Investment Thesis", "2. Target Investor
            Profile", "3. Core Investment Strategy", "4. Performance & Risk Targets",
            "5. Fee & Incentive Structure", "6. Quantitative Risk Controls", "7. Governance
            & Leadership", "8. Operations & Execution Model", "9. Timeline & Milestones",
            "10. Closing & Q&A"]'
        - lines:
          - slide_titles = compile_pitch_deck_outline(
          - '    investment_objectives=[''Alpha generation'', ''Risk‑adjusted returns''],'
          - '    investor_profile_characteristics=[''Institutional'', ''Europe'',
            ''Minimum $5M'', ''High liquidity''],'
          - '    chosen_strategy=''global macro'','
          - '    alignment_explanation=''Supports alpha generation via macro exposure'','
          - '    annual_gross_return_target=0.18,'
          - '    volatility_limit_pct=15.0,'
          - '    sharpe_ratio_goal=1.8,'
          - '    max_drawdown_pct=20.0,'
          - '    management_fee_percent=2.0,'
          - '    performance_fee_percent=25.0,'
          - '    hurdle_rate_percent=7.0,'
          - '    control_name=[''Liquidity threshold''],'
          - '    control_limit=[10.0],'
          - '    roles=[''GP'', ''CIO'', ''CFO'', ''Head of Ops'', ''Compliance Officer''],'
          - '    duties=[''Oversight'', ''Strategy'', ''Finance'', ''Operations'',
            ''Compliance'']'
          - )
          output: '["1. Fund Objectives & Investment Thesis", "2. Target Investor
            Profile", "3. Core Investment Strategy", "4. Performance & Risk Targets",
            "5. Fee & Incentive Structure", "6. Quantitative Risk Controls", "7. Governance
            & Leadership", "8. Operations & Execution Model", "9. Timeline & Milestones",
            "10. Closing & Q&A"]'
        parameters:
        - description: Bullet points from clarify_fund_objectives outlining the fund’s
            purpose, risk/reward, and market differentiation.
          name: investment_objectives
          type: List[str]
        - description: Four key traits defining the target investor demographic, sourced
            from define_investor_profile.
          name: investor_profile_characteristics
          type: List[str]
        - description: Primary hedge‑fund strategy selected in choose_investment_strategy.
