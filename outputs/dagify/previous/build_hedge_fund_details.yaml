      \    -------\n    Tuple[float, float, float]\n        A tuple containing the\
      \ annual cost estimates for service providers,\n        technology systems,\
      \ and office/human infrastructure, respectively.\n\n    Raises\n    ------\n\
      \    ValueError\n        If any input list is empty or if the lengths of `step_names`\
      \ and\n        `tech_components` differ.\n    TypeError\n        If any input\
      \ is not of the expected type.\n\n    Examples\n    --------\n    >>> service_provider_categories\
      \ = [\"Prime Broker\", \"Custodian\", \"Compliance\n    Consultant\", \"Legal\
      \ Advisor\", \"Fund Administrator\", \"Auditor\"]\n    >>> step_names = [\"\
      Idea Generation\", \"Order Entry\", \"Execution\", \"Post‑Trade\n    Processing\"\
      , \"Reporting\"]\n    >>> tech_components = [\"Research Platform\", \"OMS\"\
      , \"Execution System\",\n    \"Post‑Trade System\", \"Reporting Suite\"]\n \
      \   >>> costs = estimate_setup_and_operating_costs(service_provider_categories,\n\
      \    step_names, tech_components)\n    >>> print(costs)\n    (225000.0, 180000.0,\
      \ 125000.0)\n\n    >>> service_provider_categories = []\n    >>> step_names\
      \ = []\n    >>> tech_components = []\n    >>> try:\n    ...     estimate_setup_and_operating_costs(service_provider_categories,\n\
      \    step_names, tech_components)\n    >>> except ValueError as e:\n    ...\
      \     print(str(e))\n    Input lists must not be empty.\n\n    \"\"\"\n    return\
      \ EstimateSetupAndOperatingCostsOutput(\n        service_provider_cost_usd=0.0,\n\
      \        technology_systems_cost_usd=0.0,\n        office_human_infrastructure_cost_usd=0.0,\n\
      \    )"
