dag_type: plain_text
description: A workflow for planning, creating, executing, and reporting on a generic
  software test.
name: generic_test_workflow
nodes:
  analyze_failures:
    agent: false
    description: Investigate why tests failed.
    name: analyze_failures
    nodes_depended_on:
    - capture_test_results
    nodes_dependent_on: []
    prompt: For each failed test case, provide a concise root cause hypothesis and
      suggest potential fixes.
  capture_test_results:
    agent: false
    description: Aggregate raw results from the test run.
    name: capture_test_results
    nodes_depended_on:
    - execute_test_cases
    nodes_dependent_on:
    - analyze_failures
    - report_test_results
    prompt: Collect all test execution data, including pass/fail status, execution
      time, and any failure details.
  create_test_cases:
    agent: false
    description: Develop individual test cases that will be executed.
    name: create_test_cases
    nodes_depended_on:
    - define_test_objectives
    - identify_test_scope
    nodes_dependent_on:
    - execute_test_cases
    - report_test_results
    prompt: Generate a list of test case IDs with short titles, preconditions, steps,
      expected results, and priority.
  define_test_objectives:
    agent: false
    description: Establish the main goals that the test suite should achieve.
    name: define_test_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - identify_test_scope
    - create_test_cases
    prompt: List the primary objectives of the test in concise bullet points (e.g.,
      verify functionality, performance, security).
  execute_test_cases:
    agent: false
    description: Perform the actual test execution.
    name: execute_test_cases
    nodes_depended_on:
    - create_test_cases
    - prepare_test_environment
    nodes_dependent_on:
    - capture_test_results
    prompt: Run each test case in the order given, record whether it passed or failed,
      and capture any error logs or screenshots.
  identify_test_scope:
    agent: false
    description: Determine the boundaries and focus areas of the testing effort.
    name: identify_test_scope
    nodes_depended_on:
    - define_test_objectives
    nodes_dependent_on:
    - create_test_cases
    - prepare_test_environment
    prompt: 'Based on the test objectives, specify the scope: features, modules, user
      flows, and boundary conditions to be covered.'
  prepare_test_environment:
    agent: false
    description: Set up the necessary test environment.
    name: prepare_test_environment
    nodes_depended_on:
    - identify_test_scope
    nodes_dependent_on:
    - execute_test_cases
    prompt: Outline the required environment setup steps, including hardware, software,
      data, and configuration. List each item as a checklist.
  report_test_results:
    agent: false
    description: Create the final test report.
    name: report_test_results
    nodes_depended_on:
    - capture_test_results
    nodes_dependent_on: []
    prompt: 'Summarize the test outcomes in a report: total tests, passes, failures,
      pass rate, and high‑level observations.'
