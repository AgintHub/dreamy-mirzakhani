dag_type: typed
description: Generated workflow from UI.
name: physician_credentialing_onboarding
nodes:
  assign_clinical_privileges:
    agent: false
    description: Assign specific clinical privileges to the physician in the EMR based
      on committee recommendation.
    name: assign_clinical_privileges
    nodes_depended_on:
    - schedule_privileging_committee_review
    nodes_dependent_on: []
    output_structure:
    - description: List of clinical privileges assigned to the physician
      key: privileges_assigned
      type: List[str]
    - description: Whether the EMR profile was successfully updated
      key: emr_update_status
      type: bool
    prompt: List the approved clinical privileges (e.g., inpatient admission, surgery)
      and update the EMR profile. Return JSON with privileges_assigned array.
  check_pecos:
    agent: false
    description: Checks the physician's PECOS enrollment status, enrollment date,
      and Medicare eligibility.
    name: check_pecos
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: True if the physician is enrolled in PECOS, false otherwise
      key: pecos_enrolled
      type: bool
    - description: Date of PECOS enrollment in YYYY-MM-DD format
      key: pecos_enrollment_date
      type: str
    - description: True if the physician is eligible for Medicare participation, false
        otherwise
      key: medicare_eligible
      type: bool
    prompt: Verify the physician's enrollment in the Provider Enrollment, Chain, and
      Ownership System (PECOS) for Medicare participation.
  collect_physician_basic_info:
    agent: false
    description: Gather all required personal and professional information from the
      physician (name, contact, NPI, license number, DEA number, education, work history).
    name: collect_physician_basic_info
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Full legal name of the physician
      key: name
      type: str
    - description: Primary email address
      key: email
      type: str
    - description: Primary contact phone number
      key: phone
      type: str
    - description: National Provider Identifier
      key: NPI
      type: str
    - description: State medical license number
      key: medical_license_number
      type: str
    - description: Drug Enforcement Administration registration number
      key: DEA_number
      type: str
    - description: List of education entries (e.g., medical school, residency, fellowship)
      key: education_history
      type: List[str]
    - description: List of employment entries (e.g., previous hospitals, practices)
      key: employment_history
      type: List[str]
    - description: Name of the malpractice insurance provider
      key: malpractice_insurance_provider
      type: str
    prompt: 'Create a checklist of required basic information for a new physician
      and format the collected data as a JSON object with keys: name, email, phone,
      NPI, medical_license_number, DEA_number, education_history, employment_history,
      malpractice_insurance_provider.'
  compile_credentialing_report:
    agent: false
    description: Aggregate all verification results into a single credentialing report.
    name: compile_credentialing_report
    nodes_depended_on:
    - verify_medical_license
    - verify_board_certification
    - verify_dea_registration
    - verify_malpractice_insurance
    - verify_education_and_training
    - obtain_professional_references
    - conduct_background_check
    - verify_hospital_privileges_history
    - check_pecos
    nodes_dependent_on: []
    output_structure:
    - description: Status of medical license verification (pass/fail)
      key: medical_license_status
      type: str
    - description: Status of board certification verification (pass/fail)
      key: board_certification_status
      type: str
    - description: Status of DEA registration verification (pass/fail)
      key: dea_registration_status
      type: str
    - description: Status of malpractice insurance verification (pass/fail)
      key: malpractice_insurance_status
      type: str
    - description: Status of education and training verification (pass/fail)
      key: education_and_training_status
      type: str
    - description: List of professional references
      key: professional_references
      type: List[str]
    - description: Status of background check (pass/fail)
      key: background_check_status
      type: str
    - description: List of hospital privileges history
      key: hospital_privileges_history
      type: List[str]
    - description: Status of PECOS enrollment verification (pass/fail)
      key: pecos_enrollment_status
      type: str
    - description: Overall recommendation (approve/hold)
      key: overall_recommendation
      type: str
    prompt: Combine the JSON outputs from all verification steps into one comprehensive
      credentialing report. Include a pass/fail flag for each category and an overall
      recommendation (approve/hold).
  complete_compliance_training:
    agent: false
    description: Enables the physician to complete required compliance and safety
      training modules and records completion status for each module.
    name: complete_compliance_training
    nodes_depended_on:
    - schedule_orientation
    nodes_dependent_on: []
    output_structure:
    - description: List of identifiers for each compliance training module assigned
        to the physician.
      key: training_module_ids
      type: List[str]
    - description: List of boolean values indicating whether each corresponding module
        has been completed (true) or not (false).
      key: completion_status
      type: List[bool]
    prompt: Enroll the physician in the online compliance training modules, track
      completion, and return JSON with training_module_ids and completion_status.
  conduct_background_check:
    agent: false
    description: Run a national criminal background and sanctions check on the physician.
    name: conduct_background_check
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: True if the physician has any criminal records, false otherwise.
      key: criminal_records
      type: bool
    - description: True if the physician is subject to any sanctions, false otherwise.
      key: sanctions
      type: bool
    - description: Detailed information about any criminal records or sanctions, empty
        string if none.
      key: details_if_any
      type: str
    prompt: 'Perform a simulated background check using the physician''s full name
      and DOB, and return JSON: criminal_records (yes/no), sanctions (yes/no), details_if_any.'
  create_provider_profile_in_emr:
    agent: false
    description: Creates a provider profile in the electronic medical record system
      using the physician's credentialing report and signed employment contract, and
      returns the newly assigned provider ID and creation status.
    name: create_provider_profile_in_emr
    nodes_depended_on:
    - compile_credentialing_report
    - obtain_signed_employment_contract
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier assigned to the provider in the EMR system.
      key: provider_id
      type: str
    - description: Creation status of the provider profile (e.g., 'Success', 'Failed').
      key: status
      type: str
    prompt: Using the credentialing report and signed employment contract, populate
      the EMR provider fields (name, NPI, specialties, license, DEA, privileges).
      Return JSON with provider_id and status.
  finalize_credentialing:
    agent: false
    description: Mark the physician as fully credentialed and ready for clinical duties.
    name: finalize_credentialing
    nodes_depended_on:
    - schedule_privileging_committee_review
    - assign_clinical_privileges
    - grant_system_access
    - verify_hippa_acknowledgment
    nodes_dependent_on: []
    output_structure:
    - description: The final credentialing status of the physician, e.g., 'Active'
      key: final_status
      type: str
    - description: The date when the physician was activated, formatted as YYYY-MM-DD
      key: activation_date
      type: str
    prompt: Update the credentialing database status to 'Active', log the date of
      activation, and output JSON with final_status and activation_date.
  grant_system_access:
    agent: false
    description: Provision user accounts for EHR, order entry, and other clinical
      systems.
    name: grant_system_access
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Names of the clinical systems for which accounts are created
      key: system_name
      type: List[str]
    - description: Generated username for each system
      key: username
      type: List[str]
    - description: Temporary password assigned to each system account
      key: temporary_password
      type: List[str]
    prompt: Create login credentials for the physician in each required system, set
      appropriate role-based permissions, and output JSON with system_name, username,
      temporary_password.
  notify_hr_payroll:
    agent: false
    description: Sends a notification to the HR and payroll departments indicating
      that the physician has been activated and is eligible for compensation.
    name: notify_hr_payroll
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: The final credentialing status of the physician (e.g., 'Active').
      key: final_status
      type: str
    - description: The date the physician was activated, formatted as YYYY-MM-DD.
      key: activation_date
      type: str
    prompt: Inform HR and payroll that the physician is active and eligible for compensation.
  obtain_professional_references:
    agent: false
    description: Collect and record at least three professional references from the
      physician's recent supervisors. The node outputs a summary of each reference
      including the reference's name, relationship to the physician, a rating on a
      scale of 1 to 5, and any comments.
    name: obtain_professional_references
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of reference names, one entry per reference
      key: reference_names
      type: List[str]
    - description: List of relationships to the physician, aligned with reference_names
      key: relationships
      type: List[str]
    - description: List of integer ratings (1‑5) for each reference, aligned with
        reference_names
      key: ratings
      type: List[int]
    - description: List of comments or remarks for each reference, aligned with reference_names
      key: comments
      type: List[str]
    prompt: 'Generate a template email to request reference letters, then summarize
      the received responses as JSON: reference_name, relationship, rating (1‑5),
      comments.'
  obtain_signed_employment_contract:
    agent: false
    description: Send the employment contract to the physician and capture the signed
      copy.
    name: obtain_signed_employment_contract
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the employment contract
      key: contract_id
      type: str
    - description: Date the contract was signed in ISO 8601 format (YYYY-MM-DD)
      key: signed_date
      type: str
    prompt: Generate an email with a PDF employment contract attached, request electronic
      signature, and return a JSON receipt with contract_id and signed_date once completed.
  schedule_orientation:
    agent: false
    description: Schedules the mandatory orientation session for the newly credentialed
      physician, selecting a suitable time slot and providing location details.
    name: schedule_orientation
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Date and time of the scheduled orientation session in ISO 8601
        format
      key: orientation_date
      type: str
    - description: Physical or virtual location where the orientation will take place
      key: location
      type: str
    - description: Outcome of the scheduling operation (e.g., 'scheduled', 'conflict',
        'failed')
      key: status
      type: str
    prompt: Select an available orientation slot, send calendar invitation to the
      physician, and return JSON with orientation_date and location.
  schedule_privileging_committee_review:
    agent: false
    description: Schedules the physician for the next privileging committee meeting
      and records the meeting details.
    name: schedule_privileging_committee_review
    nodes_depended_on:
    - compile_credentialing_report
    nodes_dependent_on: []
    output_structure:
    - description: The scheduled date of the committee meeting in YYYY-MM-DD format
      key: meeting_date
      type: str
    - description: The scheduled start time of the committee meeting in HH:MM format
      key: meeting_time
      type: str
    - description: Full name of the physician attending the meeting
      key: physician_name
      type: str
    - description: The location or virtual link where the meeting will be held
      key: meeting_location
      type: str
    - description: Unique identifier assigned to the scheduled meeting
      key: meeting_id
      type: str
    - description: Identifier of the attached credentialing report
      key: credentialing_report_id
      type: str
    prompt: Create a calendar entry for the privileging committee with date, time,
      physician name, and attach the credentialing report.
  update_credentialing_database:
    agent: false
    description: Record all verification results and final status in the central credentialing
      repository, returning a confirmation of the database entry.
    name: update_credentialing_database
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the database entry.
      key: record_id
      type: int
    - description: Date and time when the record was created, in ISO 8601 format.
      key: timestamp
      type: str
    prompt: Insert the compiled credentialing report and final status into the credentialing
      database. Return JSON confirming record_id and timestamp.
  verify_board_certification:
    agent: false
    description: Validates the physician's board certification(s) and current status
      by querying the certifying board database.
    name: verify_board_certification
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of certification bodies the physician is certified by
      key: certification_body
      type: List[str]
    - description: List of specialties corresponding to each certification
      key: specialty
      type: List[str]
    - description: Current status of each certification (e.g., active, expired, pending)
      key: certification_status
      type: List[str]
    - description: Expiration date for each certification in ISO 8601 format
      key: expiration_date
      type: List[str]
    prompt: Check the physician's board certification(s) against the certifying board
      database and output JSON with certification_body, specialty, certification_status,
      and expiration_date.
  verify_dea_registration:
    agent: false
    description: Confirm the DEA registration is active and matches the physician's
      name.
    name: verify_dea_registration
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Current status of the DEA registration (e.g., 'Active', 'Inactive',
        'Suspended').
      key: dea_status
      type: str
    - description: Expiration date of the DEA registration in ISO 8601 format (YYYY-MM-DD).
      key: expiration_date
      type: str
    - description: Indicates whether the name on the DEA registration matches the
        physician's legal name.
      key: name_match
      type: bool
    prompt: 'Validate the DEA_number provided, returning JSON: dea_status, expiration_date,
      name_match (true/false).'
  verify_education_and_training:
    agent: false
    description: Authenticate the physician's medical school, residency, and fellowship
      credentials by verifying each education entry against the relevant accrediting
      body.
    name: verify_education_and_training
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of educational institutions attended.
      key: institution_list
      type: List[str]
    - description: List of degrees earned (e.g., MD, DO, MSc).
      key: degree_list
      type: List[str]
    - description: List of fields of study or specialties.
      key: field_of_study_list
      type: List[str]
    - description: List of start years for each education entry.
      key: start_year_list
      type: List[int]
    - description: List of end years for each education entry.
      key: end_year_list
      type: List[int]
    - description: List of accrediting bodies that approved each program.
      key: accreditation_body_list
      type: List[str]
    - description: List indicating if the education entry was verified (e.g., 'verified',
        'not verified').
      key: verification_status_list
      type: List[str]
    - description: List of dates when each education entry was verified.
      key: verification_date_list
      type: List[str]
    prompt: Cross-reference each entry in education_history with the appropriate accrediting
      body and output JSON for each entry.
  verify_hippa_acknowledgment:
    agent: false
    description: Records the physician's acknowledgment of HIPAA policies, including
      the date of acknowledgment and the name of the person who signed.
    name: verify_hippa_acknowledgment
    nodes_depended_on:
    - complete_compliance_training
    nodes_dependent_on: []
    output_structure:
    - description: Date when the HIPAA acknowledgment was signed, formatted as YYYY-MM-DD
      key: acknowledgment_date
      type: str
    - description: Full name of the person who signed the HIPAA acknowledgment form
      key: signed_by
      type: str
    prompt: Capture the electronic signature on the HIPAA acknowledgment form and
      return JSON with acknowledgment_date and signed_by.
  verify_hospital_privileges_history:
    agent: false
    description: Review the physician's prior hospital privileging history for any
      revocations, suspensions, or limitations and produce a concise summary.
    name: verify_hospital_privileges_history
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Concise textual summary of the hospital privileges history
      key: summary_text
      type: str
    - description: Number of hospital privileges that have been revoked
      key: revoked_count
      type: int
    - description: Number of hospital privileges that have been suspended
      key: suspended_count
      type: int
    - description: Number of hospital privileges that have been limited
      key: limited_count
      type: int
    - description: True if any privileges were revoked, otherwise False
      key: has_revoked
      type: bool
    - description: True if any privileges were suspended, otherwise False
      key: has_suspended
      type: bool
    - description: True if any privileges were limited, otherwise False
      key: has_limited
      type: bool
    prompt: Summarize the physician's past hospital privileges, indicating any revoked,
      suspended, or limited privileges, in JSON format.
  verify_malpractice_insurance:
    agent: false
    description: Ensure the physician carries adequate malpractice coverage with no
      lapses by verifying provider details and coverage status.
    name: verify_malpractice_insurance
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the malpractice insurance carrier
      key: carrier_name
      type: str
    - description: Insurance policy number issued to the physician
      key: policy_number
      type: str
    - description: Maximum coverage limit per claim in monetary units
      key: coverage_limit
      type: float
    - description: Date the policy became effective (ISO 8601 format)
      key: effective_date
      type: str
    - description: Date the policy expires (ISO 8601 format)
      key: expiration_date
      type: str
    - description: Indicates whether there are any coverage gaps or lapses
      key: any_gaps
      type: bool
    prompt: 'Contact the malpractice insurance provider listed and return JSON: carrier_name,
      policy_number, coverage_limit, effective_date, expiration_date, any_gaps.'
  verify_medical_license:
    agent: false
    description: Confirm the physician's medical license status and validity.
    name: verify_medical_license
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The physician's medical license number.
      key: medical_license_number
      type: str
    - description: Current status of the license (e.g., Active, Suspended, Revoked).
      key: status
      type: str
    - description: Expiration date of the medical license in YYYY-MM-DD format.
      key: expiration_date
      type: str
    - description: Whether the license is currently active.
      key: is_active
      type: bool
    - description: Any error or note encountered during verification.
      key: error_message
      type: str
    prompt: Verify medical license using license number from basic information.
