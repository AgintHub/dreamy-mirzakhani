dag_type: plain_text
description: Generated workflow from UI.
name: physician_credentialing_onboarding
nodes:
  assign_clinical_privileges:
    agent: false
    description: Based on committee recommendation, assign specific clinical privileges
      to the physician in the EMR.
    name: assign_clinical_privileges
    nodes_depended_on:
    - schedule_privileging_committee_review
    nodes_dependent_on: []
    output_structure:
    - description: List of assigned clinical privileges
      key: privileges_assigned
      type: List[str]
    - description: Whether the EMR profile has been updated
      key: emr_profile_updated
      type: bool
    prompt: List the approved clinical privileges (e.g., inpatient admission, surgery)
      and update the EMR profile. Return JSON with privileges_assigned array.
  check_pecos:
    agent: false
    description: Verify the physician's enrollment in the Provider Enrollment, Chain,
      and Ownership System (PECOS) for Medicare participation.
    name: check_pecos
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The physician's National Provider Identifier
      key: npi
      type: str
    - description: The physician's enrollment status in PECOS
      key: pecos_enrollment_status
      type: str
    - description: The date of the physician's PECOS enrollment
      key: enrollment_date
      type: str
    - description: The physician's opt-out status in PECOS
      key: opt_out_status
      type: str
    prompt: 'Query the PECOS database using the physician''s NPI to confirm Medicare
      enrollment status. Return JSON with fields: npi, pecos_enrollment_status, enrollment_date,
      opt_out_status.'
  collect_physician_basic_info:
    agent: false
    description: Gather all required personal and professional information from the
      physician (name, contact, NPI, license number, DEA number, education, work history).
    name: collect_physician_basic_info
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The physician's name.
      key: name
      type: str
    - description: The physician's email address.
      key: email
      type: str
    - description: The physician's contact phone number.
      key: phone
      type: str
    - description: The physician's National Provider Identifier (NPI).
      key: NPI
      type: str
    - description: The physician's medical license number.
      key: medical_license_number
      type: str
    - description: The physician's DEA registration number.
      key: DEA_number
      type: str
    - description: A list of the physician's education history.
      key: education_history
      type: str
    - description: A list of the physician's employment history.
      key: employment_history
      type: str
    - description: The name of the physician's malpractice insurance provider.
      key: malpractice_insurance_provider
      type: str
    prompt: 'Create a checklist of required basic information for a new physician
      and format the collected data as a JSON object with keys: name, email, phone,
      NPI, medical_license_number, DEA_number, education_history, employment_history,
      malpractice_insurance_provider.'
  compile_credentialing_report:
    agent: false
    description: Aggregate all verification results into a single credentialing report.
    name: compile_credentialing_report
    nodes_depended_on:
    - verify_medical_license
    - verify_board_certification
    - verify_dea_registration
    - verify_malpractice_insurance
    - verify_education_and_training
    - obtain_professional_references
    - conduct_background_check
    - verify_hospital_privileges_history
    - check_pecos
    nodes_dependent_on: []
    prompt: Combine the JSON outputs from all verification steps into one comprehensive
      credentialing report. Include a pass/fail flag for each category and an overall
      recommendation (approve/hold).
  complete_compliance_training:
    agent: false
    description: Ensure the physician completes required compliance and safety trainings.
    name: complete_compliance_training
    nodes_depended_on:
    - schedule_orientation
    nodes_dependent_on: []
    output_structure:
    - description: List of training module IDs
      key: training_module_ids
      type: List[str]
    - description: Status of training completion (e.g., completed, incomplete)
      key: completion_status
      type: str
    prompt: Enroll the physician in the online compliance training modules, track
      completion, and return JSON with training_module_ids and completion_status.
  conduct_background_check:
    agent: false
    description: Run a national criminal background and sanctions check on the physician.
    name: conduct_background_check
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Whether the physician has any criminal records
      key: criminal_records
      type: bool
    - description: Whether the physician has any sanctions
      key: sanctions
      type: bool
    - description: Any additional details about the background check
      key: details_if_any
      type: str
    prompt: 'Perform a simulated background check using the physician''s full name
      and DOB, and return JSON: criminal_records (yes/no), sanctions (yes/no), details_if_any.'
  create_provider_profile_in_emr:
    agent: false
    description: Enter the physician's credentials into the electronic medical record
      system and create a provider profile.
    name: create_provider_profile_in_emr
    nodes_depended_on:
    - compile_credentialing_report
    - obtain_signed_employment_contract
    nodes_dependent_on: []
    output_structure:
    - description: Provider ID in the EMR system
      key: provider_id
      type: str
    - description: Status of the provider profile creation
      key: status
      type: str
    prompt: Using the credentialing report and contract, populate the EMR provider
      fields (name, NPI, specialties, license, DEA, privileges). Return JSON with
      provider_id and status.
  finalize_credentialing:
    agent: false
    description: Mark the physician as fully credentialed and ready for clinical duties.
    name: finalize_credentialing
    nodes_depended_on:
    - schedule_privileging_committee_review
    - assign_clinical_privileges
    - grant_system_access
    - verify_hippa_acknowledgment
    nodes_dependent_on: []
    output_structure:
    - description: The final status of the credentialing process
      key: final_status
      type: str
    - description: The date when the physician is marked as fully credentialed and
        ready for clinical duties
      key: activation_date
      type: str
    prompt: Update the credentialing database status to 'Active', log the date of
      activation, and output JSON with final_status and activation_date.
  grant_system_access:
    agent: false
    description: Provision user accounts for EHR, order entry, and other clinical
      systems.
    name: grant_system_access
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Name of the system
      key: system_name
      type: str
    - description: Username for the physician
      key: username
      type: str
    - description: Temporary password for the physician
      key: temporary_password
      type: str
    - description: Timestamp when the access was granted
      key: grant_time
      type: str
    prompt: Create login credentials for the physician in each required system, set
      appropriate role-based permissions, and output JSON with system_name, username,
      temporary_password.
  notify_hr_payroll:
    agent: false
    description: Inform HR and payroll that the physician is active and eligible for
      compensation.
    name: notify_hr_payroll
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the notification
      key: notification_id
      type: str
    - description: Name of the physician
      key: physician_name
      type: str
    - description: ID of the physician in the system
      key: provider_id
      type: int
    - description: Date the physician is eligible for compensation
      key: start_date
      type: str
    - description: Details of the physician's compensation package
      key: compensation_details
      type: str
    prompt: Send an internal notification email to HR and payroll with physician name,
      provider ID, start date, and compensation details. Return JSON with notification
      ID.
  obtain_professional_references:
    agent: false
    description: Collect and record at least three professional references from the
      physician's recent supervisors.
    name: obtain_professional_references
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Number of received professional references
      key: reference_count
      type: int
    - description: List of names of the professional references
      key: reference_names
      type: List[str]
    - description: List of relationships of the professional references
      key: reference_relationships
      type: List[str]
    - description: List of ratings (1-5) of the professional references
      key: reference_ratings
      type: List[int]
    - description: List of comments from the professional references
      key: reference_comments
      type: List[str]
    prompt: 'Generate a template email to request reference letters, then summarize
      the received responses as JSON: reference_name, relationship, rating (1‑5),
      comments.'
  obtain_signed_employment_contract:
    agent: false
    description: Send the employment contract to the physician and capture the signed
      copy.
    name: obtain_signed_employment_contract
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Receipt ID of the signed employment contract
      key: receipt_id
      type: str
    - description: ID of the employment contract
      key: contract_id
      type: str
    - description: Date when the employment contract was signed
      key: signed_date
      type: str
    prompt: Generate an email with a PDF employment contract attached, request electronic
      signature, and return a JSON receipt with contract_id and signed_date once completed.
  schedule_orientation:
    agent: false
    description: Book the physician for the mandatory orientation session.
    name: schedule_orientation
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Date of the mandatory orientation session
      key: orientation_date
      type: str
    - description: Location of the mandatory orientation session
      key: orientation_location
      type: str
    prompt: Select an available orientation slot, send calendar invitation to the
      physician, and return JSON with orientation_date and location.
  schedule_privileging_committee_review:
    agent: false
    description: Place the physician on the agenda of the next privileging committee
      meeting.
    name: schedule_privileging_committee_review
    nodes_depended_on:
    - compile_credentialing_report
    nodes_dependent_on: []
    output_structure:
    - description: Calendar entry ID
      key: calendar_entry_id
      type: str
    prompt: Create a calendar entry for the privileging committee with date, time,
      physician name, and attach the credentialing report.
  update_credentialing_database:
    agent: false
    description: Record all verification results and final status in the central credentialing
      repository.
    name: update_credentialing_database
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: The ID of the record created in the credentialing database.
      key: record_id
      type: str
    - description: The timestamp when the record was created.
      key: timestamp
      type: str
    - description: Whether the record creation was successful.
      key: success
      type: bool
    prompt: Insert the compiled credentialing report and final status into the credentialing
      database. Return JSON confirming record_id and timestamp.
  verify_board_certification:
    agent: false
    description: Validate the physician's board certification(s) and current status.
    name: verify_board_certification
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The board certification body for the physician.
      key: certification_body
      type: str
    - description: The specialty of the physician's board certification.
      key: specialty
      type: str
    - description: The current status of the physician's board certification (e.g.
        active, inactive).
      key: certification_status
      type: str
    - description: The date the physician's board certification is set to expire.
      key: expiration_date
      type: str
    prompt: 'Check the physician''s board certification(s) against the certifying
      board database and output JSON: certification_body, specialty, certification_status,
      expiration_date.'
  verify_dea_registration:
    agent: false
    description: Confirm the DEA registration is active and matches the physician's
      name.
    name: verify_dea_registration
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Status of DEA registration (active/inactive)
      key: dea_status
      type: str
    - description: Date of DEA registration expiration
      key: expiration_date
      type: str
    - description: Whether the DEA registration matches the physician's name
      key: name_match
      type: bool
    prompt: 'Validate the DEA_number provided, returning JSON: dea_status, expiration_date,
      name_match (true/false).'
  verify_education_and_training:
    agent: false
    description: Authenticate the physician's medical school, residency, and fellowship
      credentials.
    name: verify_education_and_training
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Total institutions verified
      key: total_institutions
      type: int
    - description: List of verified institutions
      key: institutions_verified
      type: List[str]
    - description: List of verified degrees
      key: degrees_verified
      type: List[str]
    - description: List of verified graduation years
      key: graduation_years_verified
      type: List[int]
    - description: Number of verifications pending
      key: verifications_pending
      type: int
    - description: Number of verifications failed
      key: verifications_failed
      type: int
    prompt: Cross-reference each entry in education_history with the appropriate accrediting
      body and output JSON for each entry.
  verify_hippa_acknowledgment:
    agent: false
    description: Record the physician's acknowledgment of HIPAA policies.
    name: verify_hippa_acknowledgment
    nodes_depended_on:
    - complete_compliance_training
    nodes_dependent_on: []
    output_structure:
    - description: The date of HIPAA acknowledgment.
      key: acknowledgment_date
      type: str
    - description: The name of the person signing the acknowledgment.
      key: signed_by
      type: str
    - description: Whether the acknowledgment is complete or incomplete, for example,
        complete or N/A.
      key: acknowledgment_status
      type: str
    prompt: Capture the electronic signature on the HIPAA acknowledgment form and
      return JSON with acknowledgment_date and signed_by.
  verify_hospital_privileges_history:
    agent: false
    description: Review the physician's prior hospital privileging history for any
      revocations or limitations.
    name: verify_hospital_privileges_history
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Summary of hospital privileges reviewed
      key: hospital_privileges_reviewed
      type: str
    - description: List of revoked privileges
      key: revoked_privileges
      type: List[str]
    - description: List of suspended privileges
      key: suspended_privileges
      type: List[str]
    - description: List of limited privileges
      key: limited_privileges
      type: List[str]
    prompt: Summarize the physician's past hospital privileges, indicating any revoked,
      suspended, or limited privileges, in JSON format.
  verify_malpractice_insurance:
    agent: false
    description: Ensure the physician carries adequate malpractice coverage with no
      lapses.
    name: verify_malpractice_insurance
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Malpractice insurance carrier name
      key: carrier_name
      type: str
    - description: Malpractice insurance policy number
      key: policy_number
      type: str
    - description: Malpractice insurance coverage limit
      key: coverage_limit
      type: float
    - description: Malpractice insurance effective date
      key: effective_date
      type: str
    - description: Malpractice insurance expiration date
      key: expiration_date
      type: str
    - description: Whether there are any gaps in malpractice insurance coverage
      key: any_gaps
      type: bool
    prompt: 'Contact the malpractice_insurance_provider listed and return JSON: carrier_name,
      policy_number, coverage_limit, effective_date, expiration_date, any_gaps.'
  verify_medical_license:
    agent: false
    description: Confirm that the physician's medical license is valid and in good
      standing in the state of practice.
    name: verify_medical_license
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Current status of the physician's medical license
      key: license_status
      type: str
    - description: Date of expiration for the physician's medical license
      key: expiration_date
      type: str
    - description: Whether the physician's medical license has any disciplinary actions
      key: any_disciplinary_actions
      type: bool
    prompt: 'Using the medical_license_number from the basic info, query the state
      medical board (or simulate) and return a JSON result with fields: license_status,
      expiration_date, any_disciplinary_actions.'
