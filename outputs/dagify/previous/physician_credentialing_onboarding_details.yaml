dag_type: typed
description: Generated workflow from UI.
name: physician_credentialing_onboarding
nodes:
  assign_clinical_privileges:
    agent: false
    description: Based on committee recommendation, assign specific clinical privileges
      to the physician in the EMR.
    name: assign_clinical_privileges
    nodes_depended_on:
    - schedule_privileging_committee_review
    nodes_dependent_on: []
    output_structure:
    - description: List of assigned clinical privileges
      key: privileges_assigned
      type: List[str]
    prompt: List the approved clinical privileges (e.g., inpatient admission, surgery)
      and update the EMR profile. Return JSON with privileges_assigned array.
  check_pecos:
    agent: false
    description: Verify the physician's enrollment in the Provider Enrollment, Chain,
      and Ownership System (PECOS) for Medicare participation.
    name: check_pecos
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Physician's NPI
      key: npi
      type: str
    - description: PECOS enrollment status
      key: pecos_enrollment_status
      type: str
    - description: Date of enrollement
      key: enrollment_date
      type: str
    - description: Opt-out status
      key: opt_out_status
      type: str
    prompt: 'Query the PECOS database using the physician''s NPI to confirm Medicare
      enrollment status. Return JSON with fields: npi, pecos_enrollment_status, enrollment_date,
      opt_out_status.'
  collect_physician_basic_info:
    agent: false
    description: Gather all required personal and professional information from the
      physician (name, contact, NPI, license number, DEA number, education, work history).
    name: collect_physician_basic_info
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Name of the physician
      key: name
      type: str
    - description: Email of the physician
      key: email
      type: str
    - description: Phone number of the physician
      key: phone
      type: str
    - description: National Provider Identifier of the physician
      key: NPI
      type: str
    - description: Medical license number of the physician
      key: medical_license_number
      type: str
    - description: DEA registration number of the physician
      key: DEA_number
      type: str
    - description: List of the physician's educational institutions and degrees
      key: education_history
      type: List[str]
    - description: List of the physician's previous employers and job titles
      key: employment_history
      type: List[str]
    - description: Name of the malpractice insurance provider
      key: malpractice_insurance_provider
      type: str
    prompt: 'Create a checklist of required basic information for a new physician
      and format the collected data as a JSON object with keys: name, email, phone,
      NPI, medical_license_number, DEA_number, education_history, employment_history,
      malpractice_insurance_provider.'
  compile_credentialing_report:
    agent: false
    description: Aggregate all verification results into a single credentialing report.
    name: compile_credentialing_report
    nodes_depended_on:
    - verify_medical_license
    - verify_board_certification
    - verify_dea_registration
    - verify_malpractice_insurance
    - verify_education_and_training
    - obtain_professional_references
    - conduct_background_check
    - verify_hospital_privileges_history
    - check_pecos
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail flags for each verification category
      key: pass_fail_flags
      type: List[bool]
    - description: Overall recommendation (approve or hold)
      key: overall_recommendation
      type: str
    - description: Comprehensive credentialing report in JSON format
      key: credentialing_report
      type: str
    prompt: Combine the JSON outputs from all verification steps into one comprehensive
      credentialing report. Include a pass/fail flag for each category and an overall
      recommendation (approve/hold).
  complete_compliance_training:
    agent: false
    description: Ensure the physician completes required compliance and safety trainings.
    name: complete_compliance_training
    nodes_depended_on:
    - schedule_orientation
    nodes_dependent_on: []
    output_structure:
    - description: Whether the physician has completed required compliance and safety
        trainings
      key: training_completed
      type: bool
    - description: IDs of the training modules completed by the physician
      key: training_module_ids
      type: List[str]
    prompt: Enroll the physician in the online compliance training modules, track
      completion, and return JSON with training_module_ids and completion_status.
  conduct_background_check:
    agent: false
    description: Run a national criminal background and sanctions check on the physician.
    name: conduct_background_check
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Whether any criminal records were found
      key: criminal_records
      type: bool
    - description: Whether any sanctions were found
      key: sanctions
      type: bool
    - description: Any details about the criminal records or sanctions
      key: details_if_any
      type: List[str]
    prompt: 'Perform a simulated background check using the physician''s full name
      and DOB, and return JSON: criminal_records (yes/no), sanctions (yes/no), details_if_any.'
  create_provider_profile_in_emr:
    agent: false
    description: Enter the physician's credentials into the electronic medical record
      system and create a provider profile.
    name: create_provider_profile_in_emr
    nodes_depended_on:
    - compile_credentialing_report
    - obtain_signed_employment_contract
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the provider
      key: provider_id
      type: str
    - description: Current status of the provider profile
      key: status
      type: str
    prompt: Using the credentialing report and contract, populate the EMR provider
      fields (name, NPI, specialties, license, DEA, privileges). Return JSON with
      provider_id and status.
  finalize_credentialing:
    agent: false
    description: Mark the physician as fully credentialed and ready for clinical duties.
    name: finalize_credentialing
    nodes_depended_on:
    - schedule_privileging_committee_review
    - assign_clinical_privileges
    - grant_system_access
    - verify_hippa_acknowledgment
    nodes_dependent_on: []
    output_structure:
    - description: Final status of credentialing
      key: final_status
      type: str
    - description: Date when credentialing was activated
      key: activation_date
      type: str
    prompt: Update the credentialing database status to 'Active', log the date of
      activation, and output JSON with final_status and activation_date.
  grant_system_access:
    agent: false
    description: Provision user accounts for EHR, order entry, and other clinical
      systems.
    name: grant_system_access
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Name of the clinical system.
      key: system_name
      type: str
    - description: Username for the physician in the clinical system.
      key: username
      type: str
    - description: Temporary password for the physician in the clinical system.
      key: temporary_password
      type: str
    prompt: Create login credentials for the physician in each required system, set
      appropriate role-based permissions, and output JSON with system_name, username,
      temporary_password.
  notify_hr_payroll:
    agent: false
    description: Inform HR and payroll that the physician is active and eligible for
      compensation.
    name: notify_hr_payroll
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Name of the physician
      key: physician_name
      type: str
    - description: ID of the physician's provider profile
      key: provider_id
      type: str
    - description: Start date of the physician's active duty
      key: start_date
      type: str
    - description: Details of the physician's compensation package
      key: compensation_details
      type: str
    - description: Unique ID of the notification sent to HR and payroll
      key: notification_id
      type: str
    prompt: Send an internal notification email to HR and payroll with physician name,
      provider ID, start date, and compensation details. Return JSON with notification
      ID.
  obtain_professional_references:
    agent: false
    description: Collect and record at least three professional references from the
      physician's recent supervisors.
    name: obtain_professional_references
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Number of professional references obtained
      key: reference_count
      type: int
    - description: List of names of professional references
      key: reference_names
      type: List[str]
    - description: List of relationships of professional references
      key: reference_relationships
      type: List[str]
    - description: List of ratings given by professional references (1-5)
      key: reference_ratings
      type: List[int]
    - description: List of comments provided by professional references
      key: reference_comments
      type: List[str]
    prompt: 'Generate a template email to request reference letters, then summarize
      the received responses as JSON: reference_name, relationship, rating (1‑5),
      comments.'
  obtain_signed_employment_contract:
    agent: false
    description: Send the employment contract to the physician and capture the signed
      copy.
    name: obtain_signed_employment_contract
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The ID of the signed employment contract
      key: contract_id
      type: str
    - description: The date the physician signed the employment contract
      key: signed_date
      type: str
    prompt: Generate an email with a PDF employment contract attached, request electronic
      signature, and return a JSON receipt with contract_id and signed_date once completed.
  schedule_orientation:
    agent: false
    description: Book the physician for the mandatory orientation session.
    name: schedule_orientation
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Date of the orientation session
      key: orientation_date
      type: str
    - description: Location of the orientation session
      key: location
      type: str
    prompt: Select an available orientation slot, send calendar invitation to the
      physician, and return JSON with orientation_date and location.
  schedule_privileging_committee_review:
    agent: false
    description: Place the physician on the agenda of the next privileging committee
      meeting.
    name: schedule_privileging_committee_review
    nodes_depended_on:
    - compile_credentialing_report
    nodes_dependent_on: []
    output_structure:
    - description: Date of the committee meeting
      key: committees_date
      type: str
    - description: Time of the committee meeting
      key: committees_time
      type: str
    - description: Name of the physician placed on the agenda
      key: physician_name
      type: str
    - description: URL of the credentialing report attached to the meeting invite
      key: credentialing_report_url
      type: str
    prompt: Create a calendar entry for the privileging committee with date, time,
      physician name, and attach the credentialing report.
  update_credentialing_database:
    agent: false
    description: Record all verification results and final status in the central credentialing
      repository.
    name: update_credentialing_database
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier of the record created in the credentialing database
      key: record_id
      type: str
    - description: Date and time when the record was created
      key: timestamp
      type: str
    prompt: Insert the compiled credentialing report and final status into the credentialing
      database. Return JSON confirming record_id and timestamp.
  verify_board_certification:
    agent: false
    description: Validate the physician's board certification(s) and current status.
    name: verify_board_certification
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the certifying board
      key: certification_body
      type: str
    - description: Medical specialty of the physician's certification
      key: specialty
      type: str
    - description: Current status of the physician's certification (e.g., active,
        inactive, revoked)
      key: certification_status
      type: str
    - description: Date when the physician's certification expires
      key: expiration_date
      type: str
    prompt: 'Check the physician''s board certification(s) against the certifying
      board database and output JSON: certification_body, specialty, certification_status,
      expiration_date.'
  verify_dea_registration:
    agent: false
    description: Confirm the DEA registration is active and matches the physician's
      name.
    name: verify_dea_registration
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Status of the DEA registration (active/inactive)
      key: dea_status
      type: str
    - description: Date of DEA registration expiration
      key: expiration_date
      type: str
    - description: Whether the DEA registration matches the physician's name
      key: name_match
      type: bool
    prompt: 'Validate the DEA_number provided, returning JSON: dea_status, expiration_date,
      name_match (true/false).'
  verify_education_and_training:
    agent: false
    description: Authenticate the physician's medical school, residency, and fellowship
      credentials.
    name: verify_education_and_training
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the educational institution
      key: educational_institution
      type: str
    - description: Accrediting body for the educational institution
      key: accrediting_body
      type: str
    - description: Date of graduation
      key: graduation_date
      type: str
    - description: Verification status of the medical school
      key: medical_school_verification_status
      type: str
    - description: Verification status of the residency program
      key: residency_program_verification_status
      type: str
    - description: Verification status of the fellowship program
      key: fellowship_program_verification_status
      type: str
    prompt: Cross-reference each entry in education_history with the appropriate accrediting
      body and output JSON for each entry.
  verify_hippa_acknowledgment:
    agent: false
    description: Record the physician's acknowledgment of HIPAA policies.
    name: verify_hippa_acknowledgment
    nodes_depended_on:
    - complete_compliance_training
    nodes_dependent_on: []
    output_structure:
    - description: Date of HIPAA acknowledgment
      key: acknowledgment_date
      type: str
    - description: Name of the person who signed the HIPAA acknowledgment
      key: signed_by
      type: str
    prompt: Capture the electronic signature on the HIPAA acknowledgment form and
      return JSON with acknowledgment_date and signed_by.
  verify_hospital_privileges_history:
    agent: false
    description: Review the physician's prior hospital privileging history for any
      revocations or limitations.
    name: verify_hospital_privileges_history
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Summary of any necessary actions to address revoked or suspended
        privileges.
      key: privilege_remediation_plan
      type: str
    - description: List of revoked hospital privileges for the physician.
      key: revoked_privileges
      type: List[str]
    - description: List of suspended hospital privileges for the physician.
      key: suspended_privileges
      type: List[str]
    - description: List of limited hospital privileges for the physician.
      key: limited_privileges
      type: List[str]
    prompt: Summarize the physician's past hospital privileges, indicating any revoked,
      suspended, or limited privileges, in JSON format.
  verify_malpractice_insurance:
    agent: false
    description: Ensure the physician carries adequate malpractice coverage with no
      lapses.
    name: verify_malpractice_insurance
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the malpractice insurance carrier
      key: carrier_name
      type: str
    - description: Policy number issued to the physician
      key: policy_number
      type: str
    - description: Total coverage limit for the physician
      key: coverage_limit
      type: float
    - description: Date when the malpractice insurance coverage became effective
      key: effective_date
      type: str
    - description: Date when the malpractice insurance coverage is set to expire
      key: expiration_date
      type: str
    - description: Whether there are any gaps in the malpractice insurance coverage
      key: any_gaps
      type: bool
    prompt: 'Contact the malpractice_insurance_provider listed and return JSON: carrier_name,
      policy_number, coverage_limit, effective_date, expiration_date, any_gaps.'
  verify_medical_license:
    agent: false
    description: Confirm the physician's medical license status and validity
    name: verify_medical_license
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Current status of the medical license
      key: license_status
      type: str
    - description: Date when the medical license will expire
      key: expiration_date
      type: str
    - description: Whether there are any disciplinary actions against the physician
      key: disciplinary_actions
      type: bool
    prompt: Verify medical license using license number from basic information.
