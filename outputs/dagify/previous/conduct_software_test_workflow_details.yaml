dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: List of interface failure descriptions
      key: interface_failures
      type: List[str]
    - description: List of component pairs involved in failures
      key: component_pairs
      type: List[str]
    - description: List of data exchange problems identified during testing
      key: data_exchange_issues
      type: List[str]
    - description: List of descriptions of contract violations
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: This node analyzes the output of `run_integration_tests` and
        extracts information on interface failures.
      docstring:
        examples:
        - lines:
          - parent_output = ...
          - failures, pairs, issues, violations = analyze_integration_test_results(parent_output)
          output: '{''interface_failures'': [...], ''component_pairs'': [...], ''data_exchange_issues'':
            [...], ''contract_violations'': [...]}'
        parameters:
        - description: Output of `run_integration_tests` containing interface validation
            results.
          name: parent_output
          type: Dict[str, Object]
        raises: []
        returns:
          description: Dictionary containing interface failures, component pairs,
            data exchange issues, and contract violations.
          type: Dict[str, Object]
        summary: Analyze `run_integration_tests` output to identify interface-level
          issues.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered
      key: regression_summary
      type: str
    prd:
      conceptual_info: Analyze regression test results to identify regression risks.
      docstring:
        examples:
        - lines:
          - regression_anomalies = analyze_regression_test_results('baseline_vs_actual_results',
            'state_drift_indicators', 'performance_metrics')
          - print(regression_anomalies)
          output: '{''feature_name'': ''Feature1'', ''before_after_state_comparison'':
            ''Before: 10, After: 20'', ''impact_severity_estimation'': 5, ''regression_summary'':
            ''Regression issues encountered''}'
        - lines:
          - regression_anomalies = analyze_regression_test_results('baseline_vs_actual_results',
            'state_drift_indicators', 'performance_metrics')
          - print(regression_anomalies)
          output: '{''feature_name'': ''Feature2'', ''before_after_state_comparison'':
            ''Before: 5, After: 15'', ''impact_severity_estimation'': 3, ''regression_summary'':
            ''Regression issues encountered''}'
        parameters: []
        raises:
        - description: If the input is invalid or missing.
          type: ValueError
        returns:
          description: A dictionary containing the feature name, before/after state
            comparison, impact severity estimation, and regression summary.
          type: dict
        summary: Analyze regression test results to identify regression risks.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Identify unit-level anomalies
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: The name of the test case that failed
      key: test_case_name
      type: List[str]
    - description: The actual output of the test case that failed
      key: actual_output
      type: List[str]
    - description: A suggested root cause of the failure from an implementation perspective
      key: suggested_root_cause
      type: List[str]
    - description: The type of test that failed
      key: test_type
      type: List[str]
    - description: A list of test cases that passed
      key: passed_tests
      type: List[str]
    - description: A list of test cases that failed
      key: failed_tests
      type: List[str]
    prd:
      conceptual_info: This node analyzes the output of the run_unit_tests node to
        identify unit-level anomalies.
      docstring:
        examples:
        - lines:
          - 'analyze_unit_test_results(run_unit_tests_output={''test_cases'': [(''test1'',
            ''pass''), (''test2'', ''fail'')]})'
          output: '{''test_case_name'': [''test2''], ''actual_output'': []}'
        - lines:
          - 'analyze_unit_test_results(run_unit_tests_output={''test_cases'': [(''test1'',
            ''pass''), (''test2'', ''fail'')]})'
          output: '{''test_case_name'': [''test2''], ''actual_output'': []}'
        parameters:
        - description: The output of the run_unit_tests node
          name: run_unit_tests_output
          type: dict
        raises:
        - description: If the run_unit_tests_output is empty or None
          type: ValueError
        returns:
          description: A dictionary containing the test case names, actual outputs,
            suggested root causes, test types, passed tests, and failed tests
          type: dict
        summary: Analyze the output of run_unit_tests to identify unit-level anomalies.
    prompt: 'List all test failures with: 1) Test case name, 2) Actual output, 3)
      Suggested root cause from implementation perspective.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: This node generates test cases for component interactions,
        including component pairs, data flow paths, and dependency validations.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Test component A interacts with component B', 'Test
            component C interacts with component D']
          - 'component_dependencies = {''A'': [''B''], ''B'': [''A''], ''C'': [''D''],
            ''D'': [''C'']}'
          - 'plan_test_scope = {''test_objectives'': test_objectives, ''component_dependencies'':
            component_dependencies}'
          - integration_test_scenarios = generate_integration_test_scenarios(plan_test_scope)
          output: '{ ''component_pairs'': [''A-B'', ''C-D''], ''data_flow_paths'':
            [''A->B->C->D''], ''dependency_validations'': [''A depends on B'', ''C
            depends on D''] }'
        parameters:
        - description: Dictionary containing test objectives and component dependencies
          name: plan_test_scope
          type: dict
        raises:
        - description: If plan_test_scope is empty or missing required fields
          type: ValueError
        returns:
          description: Dictionary containing integration test scenarios, including
            component pairs, data flow paths, and dependency validations.
          type: dict
        summary: Generate integration test scenarios based on test objectives and
          component dependencies.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: Design regression test cases for unchanged features validation.
      docstring:
        examples:
        - lines:
          - "inputs = {'plan_test_scope': {'test_objectives':\"\n                +\
            \ \"['Objectives for test scope'], 'core_functionality_requirements':\"\
            \n                + \"['Requirements for core functionality']\"}}"
          - output = design_regression_test_cases(inputs)
          output: "[['Feature A', 'Feature B'],\"\n              + \"['Setup for Feature\
            \ A, Step 1', 'Setup for Feature B, Step 1'],\"\n              + \"['Expected\
            \ State for Feature A', 'Expected State for Feature B']]"
        - lines:
          - "inputs = {'plan_test_scope': {'test_objectives':\"\n                +\
            \ \"['Objectives for test scope with edge cases'], 'core_functionality_requirements':\"\
            \n                + \"['Requirements for core functionality with edge\
            \ cases']\"}}"
          - output = design_regression_test_cases(inputs)
          output: "[['Feature A', 'Feature B'],\"\n              + \"['Setup for Feature\
            \ A, Step 1 with edge case 1', 'Setup for Feature B, Step 1 with edge\
            \ case 2'],\"\n              + \"['Expected State for Feature A with edge\
            \ case 1', 'Expected State for Feature B with edge case 2']]"
        parameters:
        - description: Input plan for test scope including high-risk features and
            test objectives.
          name: plan_test_scope
          type: PlanTestScope
        raises:
        - description: Raised if the input plan is incomplete or invalid.
          type: ' ValueError'
        returns:
          description: A tuple containing high-risk features, precondition setup instructions,
            and expected state preservation descriptions.
          type: Tuple[List[str], List[str], List[str]]
        summary: Design and generate regression test scenarios targeting high-risk
          features.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the test case
      key: test_id
      type: str
    - description: List of input parameters required for the test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for the test case
      key: expected_output
      type: List[str]
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Number of tests that failed
      key: fail_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: This node aggregates test results from the parent nodes and
        provides a summary report.
      docstring:
        examples:
        - lines:
          - test_results = generate_test_report(report_defects)
          output: "{\n  'total_tests_executed': 100,\n  'pass_count': 80,\n  'fail_count':\
            \ 20,\n  'defect_density': 0.2,\n  'risk_assessment_rating': 8\n}"
        - lines:
          - test_results = generate_test_report(report_defects)
          - print(test_results)
          output: "{\n  'total_tests_executed': 100,\n  'pass_count': 80,\n  'fail_count':\
            \ 20,\n  'defect_density': 0.2,\n  'risk_assessment_rating': 8\n}"
        parameters: []
        raises:
        - description: If input data types are incorrect
          type: TypeError
        returns:
          description: A dictionary containing test results summary metrics
          type: dict
        summary: Compile test results summary from parent nodes.
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: This node defines high-level test objectives, core functionality
        requirements, edge case requirements, and performance requirements for the
        software under test.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Verify user login functionality', 'Test edge case
            scenarios']
          - core_functionality_requirements = ['User login should be successful with
            valid credentials', 'User should be denied login with invalid credentials']
          - edge_case_requirements = ['User login should fail with an empty password',
            'User login should fail with a wrong username']
          - performance_requirements = ['System response time should be less than
            2 seconds', 'System should handle a large number of concurrent users']
          - return test_objectives, core_functionality_requirements, edge_case_requirements,
            performance_requirements
          output: (['Verify user login functionality', 'Test edge case scenarios'],
            ['User login should be successful with valid credentials', 'User should
            be denied login with invalid credentials'], ['User login should fail with
            an empty password', 'User login should fail with a wrong username'], ['System
            response time should be less than 2 seconds', 'System should handle a
            large number of concurrent users'])
        parameters: []
        raises:
        - description: If input parameters are not in the correct format.
          type: TypeError
        returns:
          description: A tuple containing test objectives, core functionality requirements,
            edge case requirements, and performance requirements.
          type: tuple
        summary: Define high-level test objectives, core functionality requirements,
          edge case requirements, and performance requirements.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Aggregate and summarize defects from different testing scenarios.
      docstring:
        examples:
        - lines:
          - 'defect_summary = report_defects(analyze_unit_test_results={''test_case_name'':
            [''test1'', ''test2''], ''actual_output'': [''out1'', ''out2''], ''suggested_root_cause'':
            [''cause1'', ''cause2'']}, analyze_integration_test_results={''interface_failures'':
            [''failure1'', ''failure2''], ''component_pairs'': [''pair1'', ''pair2''],
            ''data_exchange_issues'': [''issue1'', ''issue2''], ''contract_violations'':
            [''violation1'', ''violation2'']}, analyze_regression_test_results={''feature_name'':
            [''feature1'', ''feature2''], ''before_after_state_comparison'': [''comparison1'',
            ''comparison2''], ''impact_severity_estimation'': [1, 2], ''regression_summary'':
            [''summary1'', ''summary2'']})'
          - print(defect_summary)
          output: '{''test_type'': [''unit'', ''integration'', ''regression''], ''component_info'':
            ['''', ''''], ''description'': [''defect description''], ''severity'':
            [''severity''], ''reproduction_steps'': [''reproduction steps'']}'
        parameters:
        - description: Result of unit test analysis, containing test case names, actual
            outputs, and suggested root causes.
          name: analyze_unit_test_results
          type: Dict[str, List[str]]
        - description: Result of integration test analysis, containing interface failures,
            component pairs, data exchange issues, and contract violations.
          name: analyze_integration_test_results
          type: Dict[str, List[str]]
        - description: Result of regression test analysis, containing feature names,
            before/after state comparisons, impact severity estimations, and regression
            summaries.
          name: analyze_regression_test_results
          type: Dict[str, List[str]]
        raises:
        - description: If the input type is incorrect or missing.
          type: TypeError
        returns:
          description: A dictionary containing the aggregated and summarized defects
            from different testing scenarios.
          type: Dict[str, str]
        summary: Aggregate and summarize defects from unit, integration, and regression
          testing scenarios.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: The run_integration_tests node executes component interaction
        tests, documenting communication logs and interface validation outcomes.
      docstring:
        examples:
        - lines:
          - 'integration_test_results = run_integration_tests(design_integration_test_cases={''scenario1'':
            {''component_pairs'': [''A'', ''B''], ''data_flow_paths'': [''path1'',
            ''path2''], ''dependency_validations'': [''val1'', ''val2'']}})'
          output: '{''communication_logs'': [''log1'', ''log2''], ''interface_validation_results'':
            [''result1'', ''result2''], ''test_scenario_ids'': [''scenario1'']}'
        - lines:
          - 'integration_test_results = run_integration_tests(setup_test_environment={''hardware_specs'':
            [''spec1'', ''spec2''], ''software_specs'': [''spec3'', ''spec4''], ''test_data_sets'':
            [''data1'', ''data2''], ''mock_services'': [''service1'', ''service2'']})'
          output: '{''communication_logs'': [''log3'', ''log4''], ''interface_validation_results'':
            [''result3'', ''result4''], ''test_scenario_ids'': [''scenario2'']}'
        parameters:
        - description: Test scenarios to be executed, including component pairs, data
            flow paths, and dependency validations
          name: design_integration_test_cases
          type: dict
        - description: Test environment setup, including hardware specs, software
            specs, test data sets, and mock services needed for testing
          name: setup_test_environment
          type: dict
        raises:
        - description: Raised if the input test scenarios or test environment setup
            are invalid
          type: ValueError
        returns:
          description: A dictionary containing 1) communication_logs, 2) interface_validation_results,
            and 3) test_scenario_ids, each with type List[str]
          type: dict
        summary: This function runs integration test scenarios and returns the communication
          logs, interface validation results, and test scenario IDs.
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: Execute unchanged feature validation
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of baseline vs actual results
      key: baseline_vs_actual_results
      type: List[str]
    - description: List of state drift indicators
      key: state_drift_indicators
      type: List[str]
    - description: List of performance metrics
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: This node executes regression tests to identify any changes
        in the system's behavior.
      docstring:
        examples:
        - lines:
          - test_cases = ['case1', 'case2', 'case3']
          - 'test_environment_config = {''hardware'': ''cpu'', ''software'': ''memory''}'
          output: '{""baseline_vs_actual_results": ["case1_result", "case2_result",
            "case3_result"],""state_drift_indicators": ["indicator1", "indicator2"],""performance_metrics":
            ["metric1", "metric2"]'
        parameters:
        - description: List of test cases to execute
          name: test_cases
          type: List[str]
        - description: Configuration of the test environment
          name: test_environment_config
          type: Dict[str, str]
        raises:
        - description: If the test environment configuration is invalid
          type: ValueError
        returns:
          description: Dictionary with baseline vs actual results, state drift indicators,
            and performance metrics as key-value pairs
          type: Dict[str, List[str]]
        summary: Executes regression tests to record baseline vs actual results, state
          drift indicators, and performance metrics.
    prompt: 'Execute regression scenarios and record: 1) Baseline vs actual results,
      2) State drift indicators, 3) Performance metrics.'
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: bool
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: str
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: str
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up
      key: environment_status
      type: bool
    prd:
      conceptual_info: The setup_test_environment node is responsible for preparing
        the testing infrastructure and dependencies required for testing.
      docstring:
        examples:
        - lines:
          - setup_test_environment(test_objectives=['Test Objective 1', 'Test Objective
            2'])
          output: "{\n    'hardware_specs': ['Hardware Spec 1', 'Hardware Spec 2'],\n\
            \    'software_specs': ['Software Spec 1', 'Software Spec 2'],\n    'test_data_sets':\
            \ ['Test Data Set 1', 'Test Data Set 2'],\n    'mock_services': ['Mock\
            \ Service 1', 'Mock Service 2'],\n    'environment_status': True\n}"
        parameters:
        - description: The high-level test objectives as defined by the plan_test_scope
            node
          name: test_objectives
          type: List[str]
        raises:
        - description: If the test_objectives are not provided or are invalid
          type: ValueError
        returns:
          description: The test environment details, including hardware specs, software
            specs, test data sets, mock services, and environment status
          type: dict[str, bool or str or List[str]]
        summary: This function sets up the test environment by gathering the required
          hardware and software specifications, test data sets, and mock services.
    prompt: 'List 3-5 environment requirements: hardware/software specs, test data
      sets, mock services needed for testing.'
  sign_off_test_cycle:
    agent: false
    description: Final quality validation status
    name: sign_off_test_cycle
    nodes_depended_on:
    - generate_test_report
    nodes_dependent_on: []
    output_structure:
    - description: Validation status of the test cycle
      key: validation_status
      type: str
    - description: Residual risk acceptance statement from the product owner
      key: residual_risk_acceptance_statement
      type: str
    - description: Validation status of the test cycle as signed off by the QA lead
      key: qa_lead_validation_status
      type: str
    - description: List of completion metrics for the test cycle, such as pass/fail
        counts, defect density, and risk assessment rating
      key: test_cycle_completion_metrics
      type: List[str]
    prd:
      conceptual_info: This node is responsible for confirming test cycle completion
        and aggregating validation metrics.
      docstring:
        examples:
        - lines:
          - 'sign_off_test_cycle(qa_lead_approval=''Approved'', product_owner_acceptance=''Accept'',
            test_report={''pass_count'': 10, ''fail_count'': 2})'
          output: '{''validation_status'': ''Approved'', ''residual_risk_acceptance_statement'':
            ''Accept'', ''qa_lead_validation_status'': ''Approved'', ''test_cycle_completion_metrics'':
            [''pass_count: 10, fail_count: 2'', ''risk_assessment_rating: 5'']}'
        - lines:
          - 'sign_off_test_cycle(qa_lead_approval=''Rejected'', product_owner_acceptance=''Reject'',
            test_report={''pass_count'': 15, ''fail_count'': 3})'
          output: '{''validation_status'': ''Rejected'', ''residual_risk_acceptance_statement'':
            ''Reject'', ''qa_lead_validation_status'': ''Rejected'', ''test_cycle_completion_metrics'':
            [''pass_count: 15, fail_count: 3'', ''risk_assessment_rating: 2]}]'
        parameters:
        - description: Validation status of the test cycle as signed off by the QA
            lead
          name: qa_lead_approval
          type: str
        - description: Residual risk acceptance statement from the product owner
          name: product_owner_acceptance
          type: str
        - description: Test report generated by generate_test_report node
          name: test_report
          type: dict
        raises:
        - description: If QA lead approval status or product owner acceptance statement
            is invalid.
          type: ValueError
        returns:
          description: '{''validation_status'': str, ''residual_risk_acceptance_statement'':
            str, ''qa_lead_validation_status'': str, ''test_cycle_completion_metrics'':
            List[str]}'
          type: dict
        summary: Validates test cycle completion based on QA lead approval and product
          owner acceptance.
    prompt: 'Confirm test cycle completion with: 1) Approved sign-off by QA lead,
      2) Residual risk acceptance statement from product owner.'
