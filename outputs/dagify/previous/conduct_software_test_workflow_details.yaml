dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: List of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: List of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: List of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: List of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: Analyzing integration test results to identify interface-level
        issues, such as component pairs, data exchange issues, and contract violations.
      docstring:
        examples:
        - lines:
          - interface_failures, component_pairs, data_exchange_issues, contract_violations
            = analyze_integration_test_results(results)
          - print(interface_failures)
          output: '[''Interface failure 1'', ''Interface failure 2'']'
        - lines:
          - interface_failures, component_pairs, data_exchange_issues, contract_violations
            = analyze_integration_test_results(results)
          - print(component_pairs)
          output: '[''Component pair 1'', ''Component pair 2'']'
        parameters: []
        raises: []
        returns:
          description: A tuple containing the interface failures, component pairs,
            data exchange issues, and contract violations.
          type: Tuple[List[str], List[str], List[str], List[str]]
        summary: Analyzes integration test results to identify interface-level issues.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered
      key: regression_summary
      type: str
    prd:
      conceptual_info: This node analyzes regression test results to identify potential
        risks and issues.
      docstring:
        examples:
        - lines:
          - analyze_regression_test_results(regression_test_results=[['baseline_vs_actual_1',
            'state_drift_indicators_1', 'performance_metrics_1']]
          - analyze_regression_test_results(regression_test_results=[['baseline_vs_actual_2',
            'state_drift_indicators_2', 'performance_metrics_2']])
          output: '{''feature_name'': ''Feature 1'', ''before_after_state_comparison'':
            ''Comparison 1'', ''impact_severity_estimation'': 1, ''regression_summary'':
            ''Summary 1''}'
        - lines:
          - analyze_regression_test_results(regression_test_results=[['baseline_vs_actual_3',
            'state_drift_indicators_3', 'performance_metrics_3']]
          - analyze_regression_test_results(regression_test_results=[['baseline_vs_actual_4',
            'state_drift_indicators_4', 'performance_metrics_4']])
          output: '{''feature_name'': ''Feature 2'', ''before_after_state_comparison'':
            ''Comparison 2'', ''impact_severity_estimation'': 2, ''regression_summary'':
            ''Summary 2''}'
        parameters:
        - description: The output of the run_regression_tests node, containing baseline
            vs actual results, state drift indicators, and performance metrics.
          name: regression_test_results
          type: list of str
        raises:
        - description: If the input regression test results are not valid or are missing
            required information.
          type: ValueError
        returns:
          description: A dictionary containing the feature name, before/after state
            comparison, impact severity estimation, and regression summary.
          type: dict of PrimitiveType
        summary: Analyzes regression test results to identify potential risks and
          issues.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Identify unit-level anomalies
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: The name of the test case that failed
      key: test_case_name
      type: List[str]
    - description: The actual output of the test case that failed
      key: actual_output
      type: List[str]
    - description: A suggested root cause of the failure from an implementation perspective
      key: suggested_root_cause
      type: List[str]
    - description: The type of test that failed
      key: test_type
      type: List[str]
    - description: A list of test cases that passed
      key: passed_tests
      type: List[str]
    - description: A list of test cases that failed
      key: failed_tests
      type: List[str]
    prd:
      conceptual_info: Analyze unit test results to identify failures and suggest
        root causes.
      docstring:
        examples:
        - lines:
          - analysis_result = analyze_unit_test_results(run_unit_tests_result)
          output: '{''test_case_name'': [''test_case_1''], ''actual_output'': [''actual_output_1''],
            ''suggested_root_cause'': [''root_cause_1''], ''test_type'': [''unit''],
            ''passed_tests'': [''test_case_2''], ''failed_tests'': [''test_case_3'']}'
        parameters: []
        raises:
        - description: If the input is not a dictionary or if any of the required
            keys are missing.
          type: ValueError
        returns:
          description: A list of dictionaries containing test case name, actual output,
            suggested root cause, test type, passed tests, and failed tests.
          type: List[dict]
        summary: Analyze unit test results to identify failures and suggest root causes.
    prompt: 'List all test failures with: 1) Test case name, 2) Actual output, 3)
      Suggested root cause from implementation perspective.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: This node generates integration test scenarios based on the
        high-level test objectives defined in the plan_test_scope node.
      docstring:
        examples:
        - lines:
          - integration_test_cases = design_integration_test_cases(plan_test_scope.test_objectives)
          output: '{''component_pairs'': [''pair1'', ''pair2''], ''data_flow_paths'':
            [''path1'', ''path2''], ''dependency_validations'': [''validation1'',
            ''validation2''], ''integration_test_scenarios'': [''scenario1'', ''scenario2'']}'
        - lines:
          - integration_test_cases = design_integration_test_cases(plan_test_scope.test_objectives)
          output: '{''component_pairs'': [''pair1'', ''pair2''], ''data_flow_paths'':
            [''path1'', ''path2''], ''dependency_validations'': [''validation1'',
            ''validation2''], ''integration_test_scenarios'': [''scenario1'', ''scenario2'']}'
        parameters: []
        raises:
        - description: If the high-level test objectives are not properly defined.
          type: ValueError
        returns:
          description: A dictionary containing the component pairs, data flow paths,
            dependency validations, and integration test scenarios for the generated
            test cases.
          type: Dict[str, List[str]]
        summary: Generates integration test scenarios from high-level test objectives.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: This node generates test cases for unchanged high-risk features,
        ensuring proper functionality and state preservation.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Feature A', 'Feature B', 'Feature C']
          - design_regression_test_cases(test_objectives)
          output: "{'high_risk_features': ['Feature A', 'Feature B', 'Feature C'],\
            \ \"\n               + \"'precondition_setup': ['Setup instructions for\
            \ Feature A', 'Setup instructions for Feature B', \"\n               +\
            \ \"'Setup instructions for Feature C'], \"\n               + \"'expected_state_preservation':\
            \ ['Expected state preservation for Feature A', \"\n               + \"\
            'Expected state preservation for Feature B', \"\n               + \"'Expected\
            \ state preservation for Feature C']"
        - lines:
          - test_objectives = []
          - 'try: design_regression_test_cases(test_objectives) except ValueError
            as e: print(e)'
          output: Input test objectives cannot be empty or NULL.
        parameters:
        - description: List of high-level test objectives from the plan_test_scope
            node.
          name: test_objectives
          type: List[str]
        raises:
        - description: If the input test objectives are empty or not provided.
          type: ValueError
        returns:
          description: Dictionary with high-risk features, precondition setup, and
            expected state preservation for each regression test scenario.
          type: dict
        summary: Design and generate regression test cases targeting high-risk features.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the test case
      key: test_id
      type: str
    - description: List of input parameters required for the test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for the test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: This node creates unit test cases for module-level validation
        based on the high-level test objectives and coverage requirements defined
        by the planning process.
      docstring:
        examples:
        - lines:
          - test_objectives = ['High-level test objective 1', 'High-level test objective
            2']
          - core_functionality_requirements = ['Core functionality requirement 1',
            'Core functionality requirement 2']
          - edge_case_requirements = ['Edge case requirement 1', 'Edge case requirement
            2']
          - performance_requirements = ['Performance requirement 1', 'Performance
            requirement 2']
          - unit_test_cases = design_unit_test_cases(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements)
          output: '''''

            test_id: Unit Test Case 1

            input_parameters: [''Input parameter 1'
        parameters:
        - description: List of high-level test objectives
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements
          name: performance_requirements
          type: List[str]
        raises:
        - description: If test_objectives, core_functionality_requirements, edge_case_requirements,
            or performance_requirements lists are empty.
          type: ValueError
        returns:
          description: A dictionary containing a list of unit test case templates
            with unique IDs, input parameters, and expected output values.
          type: Dict[str, List[str]]
        summary: Generate unit test case templates based on high-level test objectives
          and coverage requirements.
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Number of tests that failed
      key: fail_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: The generate_test_report node compiles test results into a
        summary report, providing metrics such as total tests executed, pass/fail
        counts, defect density, and risk assessment rating.
      docstring:
        examples:
        - lines:
          - report = generate_test_report(test_results)
          - print(report['total_tests_executed'])
          - print(report['pass_count'])
          - print(report['fail_count'])
          - print(report['defect_density'])
          - print(report['risk_assessment_rating'])
          output: '100

            80

            20

            0.25

            8'
        parameters:
        - description: Test results aggregated from unit, integration, and regression
            tests.
          name: test_results
          type: report_defects
        raises:
        - description: If the test results are missing or invalid.
          type: TypeError
        returns:
          description: A dictionary containing the test summary report metrics.
          type: dict
        summary: Generates a test summary report with metrics.
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: Defines high-level test objectives and coverage requirements
        for the software under test.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Test Objective 1', 'Test Objective 2', 'Test Objective
            3']
          - core_functionality_requirements = ['Functional Requirement 1', 'Functional
            Requirement 2']
          - edge_case_requirements = ['Edge Case Requirement 1', 'Edge Case Requirement
            2']
          - performance_requirements = ['Performance Requirement 1', 'Performance
            Requirement 2']
          - plan_test_scope_outputs = plan_test_scope(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements)
          - print(plan_test_scope_outputs)
          output: "{\n  'test_objectives': ['Test Objective 1', 'Test Objective 2',\
            \ 'Test Objective 3'],\n  'core_functionality_requirements': ['Functional\
            \ Requirement 1', 'Functional Requirement 2'],\n  'edge_case_requirements':\
            \ ['Edge Case Requirement 1', 'Edge Case Requirement 2'],\n  'performance_requirements':\
            \ ['Performance Requirement 1', 'Performance Requirement 2']\n}"
        parameters:
        - description: List of test objectives.
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements.
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements.
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements.
          name: performance_requirements
          type: List[str]
        raises:
        - description: Raised if input parameters are invalid.
          type: ValueError
        returns:
          description: A dictionary with high-level test objectives and coverage requirements
            as values.
          type: Dict[str, List[str]]
        summary: Defines high-level test objectives and coverage requirements.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: This node executes and documents the result of integration
        tests.
      docstring:
        examples:
        - lines:
          - 'design_integration_test_cases_result = {"component_pairs": ["pair1",
            "pair2"]}'
          - 'setup_test_environment_result = {"hardware_specs": ["spec1", "spec2"]}'
          - result = run_integration_tests(design_integration_test_cases_result, setup_test_environment_result)
          output: "''\n                {\n                  \"communication_logs\"\
            : [\"log1\", \"log2\"],\n                  \"interface_validation_results\"\
            : [\"result1\", \"result2\"],\n                  \"test_scenario_ids\"\
            : [\"scen1\", \"scen2\"]\n                }\n              ''"
        parameters:
        - description: Output from the 'design_integration_test_cases' node containing
            pre-defined test scenarios.
          name: design_integration_test_cases
          type: dict
        - description: Output from the 'setup_test_environment' node containing information
            about the test environment.
          name: setup_test_environment
          type: dict
        raises:
        - description: Raised if there's an issue during the execution of the integration
            test scenarios.
          type: RuntimeError
        returns:
          description: A dictionary containing the results of the integration test
            scenarios, including communication logs, interface validation outcomes,
            and test scenario IDs.
          type: dict
        summary: Execute integration test scenarios and document their results.
    prompt: "\n        Execute integration test scenarios and document:\n        1)\
      \ Communication logs,\n        2) Interface validation outcomes per test step.\n\
      \      "
  run_regression_tests:
    agent: false
    description: Execute unchanged feature validation
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of baseline vs actual results
      key: baseline_vs_actual_results
      type: List[str]
    - description: List of state drift indicators
      key: state_drift_indicators
      type: List[str]
    - description: List of performance metrics
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: The run_regression_tests node is responsible for executing
        regression scenarios and recording baseline vs actual results, state drift
        indicators, and performance metrics.
      docstring:
        examples:
        - lines:
          - design_regression_test_cases=design_regression_test_cases_output(high_risk_features=['Feature
            A', 'Feature B'], precondition_setup=['Setup A', 'Setup B'], expected_state_preservation=['Perservation
            A', 'Perservation B'])
          - setup_test_environment=setup_test_environment_output(hardware_specs=['Hardware
            A', 'Hardware B'], software_specs=['Software A', 'Software B'], test_data_sets=['Data
            A', 'Data B'], mock_services=['Service A', 'Service B'], environment_status=True)
          - run_regression_tests(design_regression_test_cases, setup_test_environment)
          output: '[''Baseline Result 1 vs Actual Result 1'', ''Baseline Result 2
            vs Actual Result 2'', ''State Drift Indicator 1'', ''State Drift Indicator
            2'', ''Performance Metric 1'', ''Performance Metric 2'']'
        - lines:
          - design_regression_test_cases=design_regression_test_cases_output(high_risk_features=['Feature
            C', 'Feature D'], precondition_setup=['Setup C', 'Setup D'], expected_state_preservation=['Perservation
            C', 'Perservation D'])
          - setup_test_environment=setup_test_environment_output(hardware_specs=['Hardware
            C', 'Hardware D'], software_specs=['Software C', 'Software D'], test_data_sets=['Data
            C', 'Data D'], mock_services=['Service C', 'Service D'], environment_status=True)
          - run_regression_tests(design_regression_test_cases, setup_test_environment)
          output: '[''Baseline Result 3 vs Actual Result 3'', ''Baseline Result 4
            vs Actual Result 4'', ''State Drift Indicator 3'', ''State Drift Indicator
            4'', ''Performance Metric 3'', ''Performance Metric 4'']'
        parameters:
        - description: Regressions test scenarios to execute
          name: design_regression_test_cases
          type: design_regression_test_cases_output
        - description: Prepared test environment
          name: setup_test_environment
          type: setup_test_environment_output
        raises:
        - description: If input data is invalid or incomplete
          type: ValueError
        returns:
          description: 'baseline_vs_actual_results (List[str]): List of baseline vs
            actual results, state_drift_indicators (List[str]): List of state drift
            indicators, performance_metrics (List[str]): List of performance metrics'
          type: Tuple[List[str], List[str], List[str]]
        summary: Execute regression scenarios and record baseline vs actual results,
          state drift indicators, and performance metrics.
    prompt: 'Execute regression scenarios and record: 1) Baseline vs actual results,
      2) State drift indicators, 3) Performance metrics.'
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: bool
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: str
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: str
    prd:
      conceptual_info: This node executes module-level test cases and records the
        pass/fail status, actual output vs expected output, and timestamps for each
        test execution.
      docstring:
        examples:
        - lines:
          - 'design_unit_test_cases = {''test_id'': ''test_1'', ''input_parameters'':
            [''param1'', ''param2''], ''expected_output'': [''output1'', ''output2'']}'
          output: '{''test_id'': ''test_1'', ''input_parameters'': [''param1'', ''param2''],
            ''expected_output'': [''output1'', ''output2'']'
        - lines:
          - 'setup_test_environment = {''hardware_specs'': [''spec1'', ''spec2''],
            ''software_specs'': [''soft1'', ''soft2''], ''test_data_sets'': [''data1'',
            ''data2''], ''mock_services'': [''service1'', ''service2'']}'
          output: '{''hardware_specs'': [''spec1'', ''spec2''], ''software_specs'':
            [''soft1'', ''soft2''], ''test_data_sets'': [''data1'', ''data2''], ''mock_services'':
            [''service1'', ''service2'']'
        parameters:
        - description: Output from `design_unit_test_cases` node containing test case
            templates with test IDs, input parameters, and expected output.
          name: design_unit_test_cases
          type: dict
        - description: Output from `setup_test_environment` node containing environment
            requirements such as hardware, software, test data sets, and mock services.
          name: setup_test_environment
          type: dict
        raises:
        - description: If any of the test cases fail unexpectedly.
          type: Error
        returns:
          description: Dictionary containing test execution status, actual output
            vs expected output, and test case timestamps for each test case.
          type: dict
        summary: Execute unit test cases and record the results.
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing
      key: mock_services
      type: List[str]
