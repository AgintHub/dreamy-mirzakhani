    implementation: "from ._extract_song_metadata.validate_track_data import validate_track_data\n\
      from ._extract_song_metadata.fetch_discogs_metadata import fetch_discogs_metadata\n\
      from ._extract_song_metadata.fetch_musicbrainz_metadata import fetch_musicbrainz_metadata\n\
      from ._extract_song_metadata.fetch_spotify_metadata import fetch_spotify_metadata\n\
      from ._extract_song_metadata.merge_metadata_sources import merge_metadata_sources\n\
      from ._extract_song_metadata.extract_audio_features import extract_audio_features\n\
      from ._extract_song_metadata.normalize_artist_names import normalize_artist_names\n\
      from ._extract_song_metadata.extract_album_info import extract_album_info\n\
      from ._extract_song_metadata.classify_genres import classify_genres\nfrom ._extract_song_metadata.validate_metadata_consistency\
      \ import validate_metadata_consistency\n\nfrom pydantic import BaseModel, Field\n\
      \n\nclass IdentifySampledSongsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ identify_sampled_songs node outputs.\"\"\"\n    track_id: str = (\n      \
      \  Field(..., description = (\n            \"Unique identifier for the candidate\
      \ track in the database.\")\n        )\n    )\n    confidence: float = (\n \
      \       Field(..., description = (\n            \"Confidence score (0.0 to 1.0)\
      \ indicating the likelihood that the candidate matches the sampled snippet.\"\
      )\n        )\n    )\n    start_time: float = (\n        Field(..., description\
      \ = (\n            \"Start timestamp (in seconds) of the matched segment within\
      \ the sampled snippet.\")\n        )\n    )\n    end_time: float = (\n     \
      \   Field(..., description = (\n            \"End timestamp (in seconds) of\
      \ the matched segment within the sampled snippet.\")\n        )\n    )\n   \
      \ artist_name: str = (\n        Field(..., description=\"Name of the artist\
      \ of the candidate track.\")\n    )\n    track_title: str = Field(..., description=\"\
      Title of the candidate track.\")\n    release_date: str = (\n        Field(...,\
      \ description = (\n            \"Release date of the candidate track (ISO 8601\
      \ format).\")\n        )\n    )\n\n\nclass ExtractSongMetadataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for extract_song_metadata node outputs.\"\"\"\n  \
      \  song_title: str = Field(..., description=\"Title of the sampled song\")\n\
      \    artist_names: str = (\n        Field(..., description = (\n           \
      \ \"List of artist names associated with the sampled song\")\n        )\n  \
      \  )\n    album_info: str = (\n        Field(..., description=\"Album information\
      \ for the sampled song\")\n    )\n    release_date: str = (\n        Field(...,\
      \ description=\"Release date of the sampled song\")\n    )\n    genre_classifications:\
      \ str = (\n        Field(..., description = (\n            \"List of genre classifications\
      \ for the sampled song\")\n        )\n    )\n    tempo: float = (\n        Field(...,\
      \ description = (\n            \"Tempo of the sampled song in beats per minute\
      \ (BPM)\")\n        )\n    )\n    key: str = Field(..., description=\"Key of\
      \ the sampled song\")\n    loudness: float = (\n        Field(..., description=\"\
      Loudness of the sampled song in decibels (dB)\")\n    )\n\n\ndef extract_song_metadata(identify_sampled_songs_input:\
      \ IdentifySampledSongsOutput, **kwargs) -> ExtractSongMetadataOutput:\n    \"\
      \"\"\n    Extracts detailed metadata for each sampled song candidate.\n\n  \
      \  Parameters\n    ----------\n    candidate_tracks : List[dict]\n        List\
      \ of candidate track objects returned by identify_sampled_songs.\n        Each\
      \ object must contain at least 'track_id', 'confidence',\n        'start_time',\
      \ 'end_time', and 'metadata' (which includes\n        'artist_name', 'track_title',\
      \ 'release_date').\n\n    Returns\n    -------\n    List[dict]\n        A list\
      \ of metadata dictionaries, each containing the fields:\n        song_title\
      \ (str), artist_names (List[str]), album_info (str),\n        release_date (str),\
      \ genre_classifications (List[str]), tempo\n        (float), key (str), loudness\
      \ (float).\n\n    Raises\n    ------\n    ValueError\n        If candidate_tracks\
      \ is empty or missing required fields.\n    RuntimeError\n        If external\
      \ API calls (Discogs, MusicBrainz, Spotify) fail or return\n        inconsistent\
      \ data.\n\n    Examples\n    --------\n    >>> candidate_tracks = [{\n    ...\
      \   'track_id': '12345',\n    ...   'confidence': 0.92,\n    ...   'start_time':\
      \ 12.3,\n    ...   'end_time': 45.6,\n    ...   'metadata': {\n    ...     'artist_name':\
      \ 'The Sample Artists',\n    ...     'track_title': 'Sample Tune',\n    ...\
      \     'release_date': '2020-07-15'\n    ...   }\n    >>> }\n    [{\\n  'song_title':\
      \ 'Sample Tune',\\n  'artist_names': ['The Sample\n    Artists'],\\n  'album_info':\
      \ 'Unknown Album',\\n  'release_date':\n    '2020-07-15',\\n  'genre_classifications':\
      \ ['Electronic', 'House'],\\n\n    'tempo': 128.0,\\n  'key': 'C minor',\\n\
      \  'loudness': -5.2\\n}]\n\n    >>> candidate_tracks = [{\n    ...   'track_id':\
      \ '67890',\n    ...   'confidence': 0.85,\n    ...   'start_time': 0.0,\n  \
      \  ...   'end_time': 30.0,\n    ...   'metadata': {\n    ...     'artist_name':\
      \ 'Another Artist',\n    ...     'track_title': 'Another Sample',\n    ... \
      \    'release_date': '2018-03-22'\n    ...   }\n    >>> }\n    [{\\n  'song_title':\
      \ 'Another Sample',\\n  'artist_names': ['Another\n    Artist'],\\n  'album_info':\
      \ 'Unknown Album',\\n  'release_date':\n    '2018-03-22',\\n  'genre_classifications':\
      \ ['Pop'],\\n  'tempo': 110.0,\\n\n    'key': 'G major',\\n  'loudness': -7.8\\\
      n}]\n\n    \"\"\"\n    validate_track_data(track_data=identify_sampled_songs_input)\n\
      \    \n    discogs_data: dict = fetch_discogs_metadata(track_id=identify_sampled_songs_input.track_id,\
      \ artist=identify_sampled_songs_input.artist_name, title=identify_sampled_songs_input.track_title)\n\
      \    \n    musicbrainz_data: dict = fetch_musicbrainz_metadata(track_id=identify_sampled_songs_input.track_id,\
      \ artist=identify_sampled_songs_input.artist_name, title=identify_sampled_songs_input.track_title)\n\
      \    \n    spotify_data: dict = fetch_spotify_metadata(track_id=identify_sampled_songs_input.track_id,\
      \ artist=identify_sampled_songs_input.artist_name, title=identify_sampled_songs_input.track_title)\n\
      \    \n    merged_metadata: dict = merge_metadata_sources(discogs=discogs_data,\
      \ musicbrainz=musicbrainz_data, spotify=spotify_data)\n    \n    audio_features:\
      \ dict = extract_audio_features(track_id=identify_sampled_songs_input.track_id,\
      \ start_time=identify_sampled_songs_input.start_time, end_time=identify_sampled_songs_input.end_time)\n\
      \    \n    normalized_artists: str = normalize_artist_names(raw_artists=merged_metadata.get('artists',\
      \ identify_sampled_songs_input.artist_name))\n    \n    album_info: str = extract_album_info(metadata=merged_metadata)\n\
      \    \n    genre_list: str = classify_genres(metadata=merged_metadata, audio_features=audio_features)\n\
      \    \n    validated_metadata: dict = validate_metadata_consistency(metadata=merged_metadata,\
      \ audio_features=audio_features)\n    \n    return ExtractSongMetadataOutput(\n\
      \        song_title=identify_sampled_songs_input.track_title,\n        artist_names=normalized_artists,\n\
      \        album_info=album_info,\n        release_date=identify_sampled_songs_input.release_date,\n\
      \        genre_classifications=genre_list,\n        tempo=audio_features.get('tempo',\
      \ 120.0),\n        key=audio_features.get('key', 'C major'),\n        loudness=audio_features.get('loudness',\
      \ -6.0)\n    )"
