    code_node_type: shim
    description: Detects and identifies the original songs sampled within a recorded
      audio snippet by combining traditional audio fingerprinting techniques (Chromaprint,
      pHash) with deep‑learning embeddings (VGGish/PANNs) and efficient approximate
      nearest‑neighbor similarity search (FAISS/Annoy). The node outputs a ranked
      list of candidate tracks, confidence scores, and relevant metadata, enabling
      downstream verification and attribution.
    implementation: "from ._identify_sampled_songs.validate_audio_data import validate_audio_data\n\
      from ._identify_sampled_songs.generate_audio_fingerprint import generate_audio_fingerprint\n\
      from ._identify_sampled_songs.extract_deep_learning_embeddings import extract_deep_learning_embeddings\n\
      from ._identify_sampled_songs.perform_similarity_search import perform_similarity_search\n\
      from ._identify_sampled_songs.select_best_candidate import select_best_candidate\n\
      from ._identify_sampled_songs.calculate_segment_timing import calculate_segment_timing\n\
      from ._identify_sampled_songs.fetch_track_metadata import fetch_track_metadata\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ PreprocessAudioDataOutput(BaseModel):\n    \"\"\"Pydantic model for preprocess_audio_data\
      \ node outputs.\"\"\"\n    processed_audio_base64: str = (\n        Field(...,\
      \ description = (\n            \"Base64-encoded binary payload of the processed\
      \ audio ready for downstream consumption.\")\n        )\n    )\n    duration_seconds:\
      \ float = (\n        Field(..., description = (\n            \"Total duration\
      \ of the processed audio in seconds.\")\n        )\n    )\n    sample_rate_hz:\
      \ int = (\n        Field(..., description=\"Sampling rate of the processed audio\
      \ in Hertz.\")\n    )\n    codec: str = (\n        Field(..., description =\
      \ (\n            \"Audio codec used for encoding the processed audio (e.g.,\
      \ Opus, PCM).\")\n        )\n    )\n    vad_confidence: float = (\n        Field(...,\
      \ description = (\n            \"Confidence score (0.0\\u20131.0) of Voice Activity\
      \ Detection applied during preprocessing.\")\n        )\n    )\n    noise_reduction_method:\
      \ str = (\n        Field(..., description = (\n            \"Method used for\
      \ noise reduction (e.g., spectral_subtraction, wiener_filter, deep_learning).\"\
      )\n        )\n    )\n    normalization_method: str = (\n        Field(..., description\
      \ = (\n            \"Method used for audio normalization (e.g., peak_normalization,\
      \ loudness_normalization).\")\n        )\n    )\n    feature_vectors: List[float]\
      \ = (\n        Field(..., description = (\n            \"Flattened list of extracted\
      \ audio feature vectors (e.g., MFCCs, chroma, spectral contrast).\")\n     \
      \   )\n    )\n    processing_success: bool = (\n        Field(..., description\
      \ = (\n            \"Indicates whether the preprocessing pipeline completed\
      \ successfully without critical errors.\")\n        )\n    )\n\n\nclass IdentifySampledSongsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_sampled_songs node outputs.\"\"\"\n \
      \   track_id: str = (\n        Field(..., description = (\n            \"Unique\
      \ identifier for the candidate track in the database.\")\n        )\n    )\n\
      \    confidence: float = (\n        Field(..., description = (\n           \
      \ \"Confidence score (0.0 to 1.0) indicating the likelihood that the candidate\
      \ matches the sampled snippet.\")\n        )\n    )\n    start_time: float =\
      \ (\n        Field(..., description = (\n            \"Start timestamp (in seconds)\
      \ of the matched segment within the sampled snippet.\")\n        )\n    )\n\
      \    end_time: float = (\n        Field(..., description = (\n            \"\
      End timestamp (in seconds) of the matched segment within the sampled snippet.\"\
      )\n        )\n    )\n    artist_name: str = (\n        Field(..., description=\"\
      Name of the artist of the candidate track.\")\n    )\n    track_title: str =\
      \ Field(..., description=\"Title of the candidate track.\")\n    release_date:\
      \ str = (\n        Field(..., description = (\n            \"Release date of\
      \ the candidate track (ISO 8601 format).\")\n        )\n    )\n\n\ndef identify_sampled_songs(preprocess_audio_data_input:\
      \ PreprocessAudioDataOutput, **kwargs) -> IdentifySampledSongsOutput:\n    \"\
      \"\"\n    Identifies sampled songs by extracting features, generating fingerprints,\n\
      \    and performing similarity search.\n\n    Parameters\n    ----------\n \
      \   processed_audio_data : dict\n        Preprocessed audio data containing\
      \ base64 encoded audio, duration,\n        sample rate, and feature vectors.\n\
      \n    Returns\n    -------\n    List[dict]\n        A list of dictionaries containing\
      \ track_id, confidence, start_time,\n        end_time, and metadata for each\
      \ identified candidate track.\n\n    Raises\n    ------\n    ValueError\n  \
      \      If the input audio data is invalid or corrupted.\n    RuntimeError\n\
      \        If the similarity search or fingerprint generation fails.\n\n    Examples\n\
      \    --------\n    >>> processed_audio_data = {'processed_audio_base64': '...',\n\
      \    'duration_seconds': 10.0, 'sample_rate_hz': 44100, 'feature_vectors': [...]\n\
      \    >>> identified_tracks = identify_sampled_songs(processed_audio_data)\n\
      \    [{'track_id': 'TRK123', 'confidence': 0.9, 'start_time': 2.5, 'end_time':\n\
      \    5.0, 'artist_name': 'Artist1', 'track_title': 'Track1', 'release_date':\n\
      \    '2020-01-01'}]\n\n    \"\"\"\n    validated_audio = validate_audio_data(audio_data=preprocess_audio_data_input)\n\
      \    audio_fingerprint = generate_audio_fingerprint(audio_base64=validated_audio.processed_audio_base64,\
      \ sample_rate=validated_audio.sample_rate_hz)\n    embedding_features = extract_deep_learning_embeddings(feature_vectors=validated_audio.feature_vectors,\
      \ audio_data=validated_audio)\n    candidate_matches = perform_similarity_search(fingerprint=audio_fingerprint,\
      \ embeddings=embedding_features, duration=validated_audio.duration_seconds)\n\
      \    best_match = select_best_candidate(candidates=candidate_matches)\n    segment_timing\
      \ = calculate_segment_timing(match=best_match, audio_duration=validated_audio.duration_seconds)\n\
      \    track_metadata = fetch_track_metadata(track_id=best_match[\"track_id\"\
      ])\n    return IdentifySampledSongsOutput(\n        track_id=best_match[\"track_id\"\
      ],\n        confidence=best_match[\"confidence\"],\n        start_time=segment_timing[\"\
      start_time\"],\n        end_time=segment_timing[\"end_time\"],\n        artist_name=track_metadata[\"\
      artist_name\"],\n        track_title=track_metadata[\"track_title\"],\n    \
      \    release_date=track_metadata[\"release_date\"]\n    )"
