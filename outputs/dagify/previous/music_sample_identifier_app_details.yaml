    prompt: "1. **Feature Extraction**: Convert the pre‑processed audio snippet into\
      \ a robust representation:\n   - Compute constant‑Q transform (CQT) spectrograms\
      \ and mel‑spectrograms using librosa.\n   - Derive MFCCs, chroma, and spectral\
      \ contrast features.\n   - Apply a deep‑learning embedding model (e.g., VGGish\
      \ or PANNs) to obtain a 128‑dimensional latent vector.\n\n2. **Fingerprint Generation**:\
      \ Generate compact fingerprints for the snippet:\n   - Use the Chromaprint algorithm\
      \ (via Acoustid) to produce a 64‑bit hash.\n   - Create a perceptual hash (pHash)\
      \ from the CQT spectrogram for cross‑validation.\n\n3. **Similarity Search**:\
      \ Query a curated database of known tracks:\n   - Store database fingerprints\
      \ in an approximate nearest neighbor index (FAISS or Annoy).\n   - Perform a\
      \ two‑stage search: first match Chromaprint hashes, then refine with cosine\
      \ similarity on VGGish embeddings.\n\n4. **Result Consolidation**: Return the\
      \ top‑k candidate tracks with match scores:\n   - Include confidence percentages,\
