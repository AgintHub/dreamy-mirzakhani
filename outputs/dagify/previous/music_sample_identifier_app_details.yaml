      \ snippet\")\n    )\n    codec: str = (\n        Field(..., description=\"Codec\
      \ used for encoding the audio snippet\")\n    )\n    vad_confidence: float =\
      \ (\n        Field(..., description = (\n            \"Confidence score of the\
      \ Voice Activity Detection\")\n        )\n    )\n\n\ndef record_audio_snippet(general_input:\
      \ str, **kwargs) -> RecordAudioSnippetOutput:\n    \"\"\"\n    Records a short\
      \ audio snippet from the user's microphone, normalizes and\n    trims silence,\
      \ optionally applies VAD, encodes the signal with Opus, and\n    returns the\
      \ binary payload with metadata.\n\n    Returns\n    -------\n    dict\n    \
      \    Dictionary containing audio_data, metadata, duration, sample_rate,\n  \
      \      codec, and vad_confidence.\n\n    Raises\n    ------\n    AudioCaptureError\n\
      \        Raised when the audio capture hardware fails or the recording is\n\
      \        interrupted.\n    PermissionError\n        Raised when the application\
      \ does not have permission to access the\n        microphone.\n\n    Examples\n\
      \    --------\n    >>> result = record_audio_snippet()\n    {\n      \"audio_data\"\
      : \"<binary base64>\",\n      \"metadata\": [\"5.0\", \"48000\", \"Opus\", \"\
      0.95\"],\n      \"duration\": 5.0,\n      \"sample_rate\": 48000,\n      \"\
      codec\": \"Opus\",\n      \"vad_confidence\": 0.95\n    }\n\n    >>> try:\n\
