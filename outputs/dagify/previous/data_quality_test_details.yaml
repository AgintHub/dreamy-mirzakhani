dag_type: plain_text
description: A workflow to perform comprehensive data quality validation against a
  dataset, checking for missing values, data types, value ranges, and uniqueness constraints.
name: data_quality_test
nodes:
  check_missing_values:
    agent: false
    description: Identify and quantify missing values per column
    name: check_missing_values
    nodes_depended_on:
    - load_dataset
    nodes_dependent_on:
    - generate_summary_report
    prompt: Analyze the dataset to identify columns with missing values. Report the
      total count and percentage of missing entries for each affected column.
  check_unique_constraints:
    agent: false
    description: Validate that certain fields contain only unique values
    name: check_unique_constraints
    nodes_depended_on:
    - load_dataset
    nodes_dependent_on:
    - generate_summary_report
    prompt: Identify columns requiring uniqueness constraints and check for duplicates.
      Report the number of duplicate entries found in each affected column.
  generate_summary_report:
    agent: false
    description: Aggregate and present all validation results
    name: generate_summary_report
    nodes_depended_on:
    - check_missing_values
    - validate_data_types
    - verify_value_ranges
    - check_unique_constraints
    nodes_dependent_on: []
    prompt: 'Synthesize results from all prior validation steps into a single summary
      report. Include: total valid records, count of validation failures by type,
      and key error samples.'
  load_dataset:
    agent: false
    description: Load the dataset into memory for validation
    name: load_dataset
    nodes_depended_on: []
    nodes_dependent_on:
    - check_missing_values
    - validate_data_types
    - verify_value_ranges
    - check_unique_constraints
    prompt: Load the provided data file into memory. Confirm successful loading by
      reporting total rows and column names.
  validate_data_types:
    agent: false
    description: Verify that all fields match expected data types
    name: validate_data_types
    nodes_depended_on:
    - load_dataset
    nodes_dependent_on:
    - generate_summary_report
    prompt: Validate that each column in the dataset contains values of the correct
      data type (e.g., string, numeric, date). For each violation, report the column
      name, expected type, and example of invalid value.
  verify_value_ranges:
    agent: false
    description: Ensure numeric values fall within defined boundaries
    name: verify_value_ranges
    nodes_depended_on:
    - load_dataset
    nodes_dependent_on:
    - generate_summary_report
    prompt: Check numeric columns for out-of-bounds values. For each violation, report
      the column name, expected minimum/maximum, and example of invalid value.
