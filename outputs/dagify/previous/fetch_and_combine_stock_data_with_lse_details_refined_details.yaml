    prompt: "Persist the unified, schema‑validated stock dataset into the company‑wide\
      \ data lake.\n\n1. **Ingestion protocol**: Use HTTPS/REST with TLS 1.3 to transmit\
      \ the consolidated JSON payload to the regional ingestion API endpoint of Azure\
      \ Data Lake Gen 2.  Include a retry‑on‑5xx policy with exponential back‑off\
      \ (max 3 retries, base delay 200 ms).\n\n2. **Latency targets**: The end‑to‑end\
      \ pipeline (fetch → parse → aggregate → store) must finish in under 400 ms per\
      \ batch.  Typical latencies are: \n   - LSE feed: 180 ms (London datacenter)\
      \ \n   - NYSE feed: 160 ms (New York datacenter) \n   - NASDAQ feed: 170 ms\
      \ (New York datacenter) \n   - TSX feed: 190 ms (Toronto datacenter)\n   - Aggregation\
      \ & validation: 80 ms\n   - Storage write: 120 ms\n\n3. **Geographic distribution**:\
      \ Store the data in three geo‑redundant containers:\n   - `us-east-1` (Virginia)\n\
      \   - `europe-west-2` (Frankfurt)\n   - `ca-central-1` (Toronto)\n\n4. **Data\
      \ format & schema**: Write each record as Parquet with Avro schema versioning.\
      \  Include a checksum field for integrity verification.\n\n5. **Post‑write actions**:\
      \ Trigger an Azure Function that updates the metadata catalog and publishes\
      \ a Kafka event to the `stock-data-available` topic.\n\nReturn a JSON summary\
      \ containing the batch ID, total records, write timestamps per region, and any\
      \ validation errors."
