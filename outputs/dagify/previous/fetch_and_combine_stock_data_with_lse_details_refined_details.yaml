    - description: Opening price (IEEE 754 double) for each record
      key: open
      type: List[float]
    - description: Highest price for each record
      key: high
      type: List[float]
    - description: Lowest price for each record
      key: low
      type: List[float]
    - description: Closing price for each record
      key: close
      type: List[float]
    - description: Traded volume for each record
      key: volume
      type: List[int]
    - description: Adjusted closing price for each record
      key: adjusted_close
      type: List[float]
    - description: Market capitalization for each record
