dag_type: typed
description: Generated workflow from UI.
name: fetch_and_combine_stock_data_with_lse_details_refined
nodes:
  construct_lse_api_request:
    agent: false
    description: Builds a robust, protocol‑optimized HTTP/2 request to the LSE API,
      embedding all necessary query parameters, headers, authentication, latency considerations,
      and datacenter routing logic to fetch historical or real‑time quote data for
      the identified stock symbols.
    name: construct_lse_api_request
    nodes_depended_on:
    - identify_lse_stocks
    nodes_dependent_on: []
    output_structure:
    - description: Fully‑qualified HTTPS URL including endpoint and query parameters
      key: request_url
      type: str
    - description: 'List of HTTP header strings in the format ''Header-Name: value'''
      key: request_headers
      type: List[str]
    - description: Bearer token used for authentication, sourced from the environment
      key: auth_token
      type: str
    - description: Protocol details such as 'HTTP/2 over TLS 1.3'
      key: protocol_version
      type: str
    - description: 'HSTS header value ''Strict-Transport-Security: max-age=63072000;
        includeSubDomains'''
      key: hsts_header
      type: str
    - description: Hostname of the primary datacenter (e.g., 'dc-eu-central.lse.com')
      key: primary_datacenter
      type: str
    - description: Hostname of the fallback datacenter (e.g., 'dc-us-west.lse.com')
      key: fallback_datacenter
      type: str
    - description: Expected round‑trip latency in milliseconds for the primary datacenter
      key: expected_latency_ms
      type: int
    - description: Maximum number of retry attempts for 5xx or network failures
      key: retry_count
      type: int
    - description: Initial back‑off delay in milliseconds before the first retry
      key: initial_backoff_ms
      type: int
    - description: Multiplier used to double the back‑off delay after each retry
      key: backoff_multiplier
      type: float
    prompt: "Construct a fully-qualified HTTPS request to the London Stock Exchange\
      \ (LSE) API for the stock symbols provided by the previous step. Include the\
      \ following components:\n1. **Endpoint**: `https://api.londonstockexchange.com/v1/quotes`.\n\
      2. **Query parameters**:\n   - `symbols` – comma‑separated list of ticker symbols.\n\
      \   - `frequency` – desired data frequency (`daily`, `weekly`, `monthly`).\n\
      \   - `start_date` and `end_date` – ISO‑8601 formatted dates defining the time\
      \ window.\n3. **Headers**:\n   - `Accept: application/json`.\n   - `User-Agent:\
      \ LSEDataFetcher/1.0`.\n4. **Authentication**: Attach a Bearer token supplied\
      \ by the environment.\n5. **Protocol details**:\n   - Use HTTP/2 over TLS 1.3\
      \ for maximum throughput.\n   - Enable HSTS with `Strict-Transport-Security:\
      \ max-age=63072000; includeSubDomains`.\n6. **Latency expectations**:\n   -\
      \ Expected round‑trip latency per request: 120 ms ± 30 ms when routed through\
      \ the EU‑Central datacenter.\n7. **Datacenter routing**:\n   - Default to the\
      \ EU‑Central datacenter (`dc-eu-central.lse.com`).\n   - Provide an alternative\
      \ route to the US‑West datacenter (`dc-us-west.lse.com`) with a higher latency\
      \ of 240 ms ± 45 ms, useful if the primary is unreachable.\n8. **Retry logic**:\n\
      \   - On HTTP 5xx or network failures, retry up to 3 times with exponential\
      \ back‑off (initial 200 ms, doubling each retry).\nGenerate the final URL and\
      \ a JSON payload representing the request configuration ready for dispatch by\
      \ the next node."
  construct_nasdaq_api_request:
    agent: false
    description: Builds a secure, protocol‑compliant HTTP(S) request to the NASDAQ
      public API for real‑time stock data, embedding authentication, field selection,
      and latency considerations. The generated request includes explicit TLS settings,
      HSTS enforcement, retry logic, and datacenter targeting to guarantee low‑latency,
      highly available data retrieval.
    name: construct_nasdaq_api_request
    nodes_depended_on:
    - identify_nasdaq_stocks
    nodes_dependent_on: []
    output_structure:
    - description: The fully‑qualified HTTPS URL including base endpoint and all query
        parameters.
      key: full_url
      type: str
    - description: A list of HTTP header lines to be sent with the request.
      key: headers_list
      type: List[str]
    - description: Human‑readable description of the expected round‑trip latency range
        (e.g., "<120 ms from primary US datacenter").
      key: expected_latency_ms_range
      type: str
    prompt: "Using the list of stock symbols from the previous node, compose a fully-qualified\
      \ HTTPS GET request to the NASDAQ data service. Include: \n        1. Base URL:\
      \ `https://api.nasdaq.com/api/quotes` \n        2. Query parameters: \n    \
      \       - `symbols` – comma‑separated symbols (e.g., `AAPL,MSFT`) \n       \
      \    - `fields` – comma‑separated list of fields (e.g., `price,volume,change`)\
      \ \n           - `format=json` \n        3. Headers: \n           - `Accept:\
      \ application/json` \n           - `User-Agent: NASDAQDataFetcher/1.0` \n  \
      \         - `X-Api-Key: <YOUR_KEY>` \n        4. Protocol details: \n      \
      \     - Use TLS 1.3 with cipher suite `TLS_AES_128_GCM_SHA256`. \n         \
      \  - Enforce HSTS with `max-age=31536000`. \n        5. Latency expectations:\
      \ \n           - Expected round‑trip time per request: < 120 ms from primary\
      \ US datacenter. \n           - Retry policy: exponential backoff up to 3 attempts\
      \ with a base delay of 200 ms. \n        6. Data center selection: \n      \
      \     - Primary: `us-east-1` (Virginia) \n           - Secondary: `us-west-2`\
      \ (Oregon) \n           - Tertiary: `eu-central-1` (Frankfurt) for cross‑border\
      \ compliance. \n        Construct the request string and provide a JSON object\
      \ with the full URL, headers, and expected latency range."
  construct_nyse_api_request:
    agent: false
    description: Constructs the API request for fetching NYSE stock data, incorporating
      identified stock symbols, API endpoint specifics, protocol level technical details,
      latency considerations, and available data centers to ensure efficient and reliable
      data retrieval.
    name: construct_nyse_api_request
    nodes_depended_on:
    - identify_nyse_stocks
    nodes_dependent_on: []
    output_structure:
    - description: The full HTTPS endpoint URL to be called.
      key: endpoint_url
      type: str
    - description: Comma‑separated list of stock symbols to query.
      key: query_symbols
      type: List[str]
    - description: ISO‑8601 start date for the data range.
      key: query_start_date
      type: str
    - description: ISO‑8601 end date for the data range.
      key: query_end_date
      type: str
    - description: Desired data frequency (e.g., '1min', 'daily').
      key: query_frequency
      type: str
    - description: User-Agent header value.
      key: headers_user_agent
      type: str
    - description: API key header value.
      key: headers_api_key
      type: str
    - description: TLS protocol version to be used (e.g., 'TLS1.2').
      key: tls_version
      type: str
    - description: Certificate hashing algorithm (e.g., 'SHA-256').
      key: cert_hash_algo
      type: str
    - description: Maximum number of requests allowed in a burst.
      key: rate_limit_burst
      type: int
    - description: Minimum expected latency in milliseconds.
      key: latency_expected_min
      type: int
    - description: Maximum expected latency in milliseconds.
      key: latency_expected_max
      type: int
    - description: Number of retry attempts on failure.
      key: retry_attempts
      type: int
    - description: Initial back‑off delay in milliseconds.
      key: retry_backoff_initial_ms
      type: int
    - description: Multiplier applied to the back‑off delay for each retry.
      key: retry_backoff_multiplier
      type: float
    - description: List of datacenter identifiers used for failover (e.g., ['NY4','CH1','LD4']).
      key: failover_datacenters
      type: List[str]
    prompt: Construct a RESTful API request for fetching NYSE stock data via HTTPS
      protocol, using the identified stock symbols, with an expected latency of 50-100
      ms, and available data centers in New York (NY4), Chicago (CH1), and London
      (LD4). The API endpoint should support JSON data format, implement rate limiting
      with a burst capacity of 100 requests per second, and provide failover mechanisms
      to handle temporary service disruptions. The request should include query parameters
      for stock symbols, date range, and data frequency, such as 1-minute or daily
      bars, and may utilize optional parameters for filtering and sorting. Specify
      the User-Agent header, API key authentication, and TLS 1.2 encryption with SHA-256
      certificate hashing to ensure secure data transmission. Provide a comprehensive
      set of error handling mechanisms, including retry logic with exponential backoff,
      to mitigate potential connection issues and API rate limiting errors.
  construct_toronto_stock_exchange_api_request:
    agent: false
    description: Constructs a technically sophisticated API request for retrieving
      data from the Toronto Stock Exchange, incorporating essential parameters such
      as API endpoints, data feed specifications, latency requirements, and API key
      authentication, to facilitate efficient and secure data acquisition for the
      specified stock symbols.
    name: construct_toronto_stock_exchange_api_request
    nodes_depended_on:
    - identify_toronto_stock_exchange_stocks
    nodes_dependent_on: []
    output_structure:
    - description: Fully-qualified HTTPS endpoint for the TSE API request.
      key: endpoint_url
      type: str
    - description: HTTP method used for the request (e.g., GET, POST).
      key: request_method
      type: str
    - description: Comma‑separated list of stock symbols to include in the query string.
      key: query_params_symbols
      type: List[str]
    - description: Value of the 'Accept' header.
      key: header_accept
      type: str
    - description: Value of the 'Content-Type' header.
      key: header_content_type
      type: str
    - description: Authorization header containing the API key.
      key: header_authorization
      type: str
    - description: List of stock symbols included in the JSON request body.
      key: body_symbols
      type: List[str]
    - description: Time interval specification (e.g., '1d', '1h') for historical data.
      key: body_time_intervals
      type: str
    - description: Requested data format (e.g., 'json', 'csv').
      key: body_data_format
      type: str
    - description: Maximum allowed request rate as per TSE API usage guidelines.
      key: max_requests_per_second
      type: int
    - description: Indicates whether gzip compression is enabled for the request payload.
      key: compression_enabled
      type: bool
    prompt: Construct a secure, RESTful API request to the Toronto Stock Exchange
      (TSE) for fetching real‑time and historical stock data, utilizing the HTTPS
      protocol with TLS 1.2 encryption and specifying the API endpoint as https://www.tmx.com/rs/api/
      with a latency of less than 50ms, supporting data feeds from data centers located
      in Toronto, New York, and London. Ensure the request includes the stock symbols
      identified in the previous step, utilizes gzip compression for efficient data
      transfer, and adheres to the TSE's API usage guidelines with a maximum of 100
      requests per second. Specify the API request headers, including 'Accept' as
      'application/json', 'Content-Type' as 'application/json', and 'Authorization'
      with a valid API key. The request body should be formatted in JSON, containing
      the stock symbols and any additional required parameters, such as time intervals
      and data formats.
  fetch_lse_stock_data:
    agent: false
    description: Initiates a secured, HTTPS-based data fetch operation from the London
      Stock Exchange (LSE) via a meticulously constructed API request, incorporating
      detailed parameters for stock symbols, data frequency, and time range, while
      ensuring robust error handling and exception management to guarantee data integrity
      and consistency, across multiple datacenters in London, New York, and Singapore
      with latency averaging 50ms, 100ms, and 120ms respectively.
    name: fetch_lse_stock_data
    nodes_depended_on:
    - construct_lse_api_request
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the HTTP request completed successfully without
        HTTP errors.
      key: request_successful
      type: bool
    - description: The final HTTP status code returned by the LSE API after all retry
        attempts.
      key: http_status_code
      type: int
    - description: Measured round‑trip latency in milliseconds for the successful
        request.
      key: latency_ms
      type: int
    - description: The datacenter (e.g., London, NewYork, Singapore) that was used
        for the successful fetch.
      key: selected_datacenter
      type: str
    - description: Number of retry attempts performed before achieving a successful
        response.
      key: retry_attempts
      type: int
    - description: Whether the circuit breaker was triggered during this fetch operation.
      key: circuit_breaker_activated
      type: bool
    - description: List of error messages captured during the fetch process, if any.
      key: error_messages
      type: List[str]
    prompt: 'Fetch the stock data from the LSE using the previously constructed API
      request, handling errors and exceptions through retry mechanisms with exponential
      backoff, logging anomalous responses, and implementing circuit breakers to prevent
      cascading failures. Ensure compliance with LSE''s API usage policies and rate
      limits. Utilize available data feeds from primary datacenters in London (latency:
      50ms), New York (latency: 100ms), and Singapore (latency: 120ms), and gracefully
      switch between them based on real-time latency and availability metrics. Leverage
      HTTP/2 for multiplexed, concurrent data transfers and TLS 1.3 for enhanced security
      and encryption.'
  fetch_nasdaq_stock_data:
    agent: false
    description: Retrieves the stock data from the NASDAQ exchange through a technically
      sophisticated API request, incorporating multiple protocol layers, latency considerations,
      and datacenter redundancy to ensure high availability and reliability of the
      retrieved data, supporting real-time and historical data feeds with varying
      latency and throughput characteristics.
    name: fetch_nasdaq_stock_data
    nodes_depended_on:
    - construct_nasdaq_api_request
    nodes_dependent_on: []
    output_structure:
    - description: Whether the HTTP request succeeded without server errors
      key: request_successful
      type: bool
    - description: HTTP status code returned by the NASDAQ API
      key: http_status_code
      type: int
    - description: Raw response payload (JSON string) returned by the API
      key: response_body
      type: str
    - description: Measured round‑trip latency in milliseconds for the successful
        request
      key: fetch_latency_ms
      type: int
    - description: Error message if the request failed or a non‑200 status code was
        returned; empty string on success
      key: error_message
      type: str
    - description: Identifier of the NASDAQ datacenter that served the request (e.g.,
        us-east-1, us-west-2, eu-central-1)
      key: datacenter_used
      type: str
    - description: Number of retry attempts performed (0 if no retry was needed)
      key: retries_attempted
      type: int
    prompt: Fetch the stock data from the NASDAQ using the constructed API request
      over HTTPS, with a timeout of 5 seconds and retry mechanism for handling 500-level
      server errors, incorporating technical details such as API endpoint URIs, query
      parameters for specifying stock symbols and date ranges, HTTP headers for authentication
      and rate limiting, and support for multiple data feeds from NASDAQ's primary
      datacenters in Carteret, New Jersey, and secondary datacenters in Chicago, Illinois,
      and London, United Kingdom, with a latency of 10-50 milliseconds for real-time
      data and 100-500 milliseconds for historical data, providing additional metadata
      on data feed availability, server response times, and any error messages encountered
      during the request.
  fetch_nyse_stock_data:
    agent: false
    description: Executes the authenticated HTTP request to the NYSE data feed, retrieves
      the latest market snapshot for the specified symbols, measures network latency,
      records the data center source, and returns a clean, structured dataset ready
      for analytical processing.
    name: fetch_nyse_stock_data
    nodes_depended_on:
    - construct_nyse_api_request
    nodes_dependent_on: []
    output_structure:
    - description: List of ticker symbols returned in the response
      key: symbol_list
      type: List[str]
    - description: ISO‑8601 UTC timestamps for each record
      key: timestamp_list
      type: List[str]
    - description: Opening price for each symbol
      key: open_list
      type: List[float]
    - description: Highest price for each symbol
      key: high_list
      type: List[float]
    - description: Lowest price for each symbol
      key: low_list
      type: List[float]
    - description: Closing price for each symbol
      key: close_list
      type: List[float]
    - description: Trade volume for each symbol
      key: volume_list
      type: List[int]
    - description: Adjusted closing price for each symbol
      key: adjusted_close_list
      type: List[float]
    - description: Round‑trip latency of the HTTP request in milliseconds
      key: request_latency_ms
      type: int
    - description: Data center region reported in the `x-datacenter-location` header
      key: data_center_region
      type: str
    - description: HTTP status code returned by the NYSE API
      key: http_status
      type: int
    - description: Number of retry attempts performed due to 429 or 5xx errors
      key: retry_attempts
      type: int
    prompt: 'Using the API request constructed by `construct_nyse_api_request`, send
      an HTTPS GET to the NYSE data feed endpoint with the appropriate `Authorization`
      bearer token and `Accept: application/json`. Retrieve the response payload,
      handling HTTP status codes 200‑206 for success and implementing exponential
      back‑off for 429 and 5xx errors. Parse the JSON, extract the fields: `symbol`,
      `timestamp`, `open`, `high`, `low`, `close`, `volume`, and `adjusted_close`.
      Log request latency (in milliseconds) and data center region (e.g., US‑East‑Coast,
      US‑West‑Coast) from the `x-datacenter-location` header. Store the parsed records
      in a structured format (e.g., Pandas DataFrame or Parquet) for downstream analysis.'
  fetch_toronto_stock_exchange_stock_data:
    agent: false
    description: Retrieves real‑time stock price and volume data for the identified
      Toronto Stock Exchange securities. The node performs a secure HTTPS request
      to the TSE API, handling authentication, failover between primary and secondary
      data centers, and ensuring low‑latency delivery. It validates the response schema,
      logs errors, and emits a clean JSON payload for downstream analytics.
    name: fetch_toronto_stock_exchange_stock_data
    nodes_depended_on:
    - construct_toronto_stock_exchange_api_request
    nodes_dependent_on: []
    output_structure:
    - description: True if the final HTTP request returned a 2xx status code; otherwise
        False.
      key: request_successful
      type: bool
    - description: Measured round‑trip latency in milliseconds for the HTTP request
        that returned the final response.
      key: response_latency_ms
      type: int
    - description: Number of retry attempts performed before achieving a successful
        response (0 if first attempt succeeded).
      key: retry_attempts
      type: int
    - description: The HTTP status code returned by the final request.
      key: http_status_code
      type: int
    - description: Size of the JSON payload received, in bytes.
      key: response_size_bytes
      type: int
    - description: Number of stock quote records contained in the parsed JSON payload.
      key: record_count
      type: int
    - description: True if the JSON payload conforms to the TSE public schema; otherwise
        False.
      key: valid_schema
      type: bool
    - description: Error message if the request failed or the schema validation failed;
        empty string otherwise.
      key: error_message
      type: str
    prompt: 'Using the fully constructed API request, perform a HTTPS GET to the Toronto
      Stock Exchange data service at `https://api.tse.ca/v1/quotes` with the specified
      query parameters and authentication headers. Ensure the request includes a `User-Agent:
      DataPipeline/1.0` and a `Cache-Control: no-cache`. Execute the call against
      the primary data center located in Toronto (Canada Central) with an expected
      round‑trip latency of 80–120 ms; if a failover is required, automatically redirect
      to the secondary data center in London (EU West) with a 120–160 ms latency.
      Capture the JSON response, validate the schema against the TSE public spec,
      and return the payload as a parsed JSON object. Log any HTTP status codes outside
      the 2xx range and retry up to two times with exponential backoff (initial delay
      200 ms, multiplier 2).'
  identify_lse_stocks:
    agent: false
    description: Generates a comprehensive, protocol‑aware catalogue of London Stock
      Exchange (LSE) equities to be queried. The output includes precise data‑feed
      details—protocol, latency expectations, and geographically proximate data‑centre
      information—to enable downstream nodes to select the optimal ingestion pathway
      and satisfy strict performance SLAs.
    name: identify_lse_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The ticker symbols of the LSE equities to be fetched.
      key: symbol
      type: List[str]
    - description: The primary market code (e.g., "LON") for each symbol.
      key: market
      type: List[str]
    - description: The preferred data feed protocol for each symbol (e.g., FIX, REST,
        WebSocket).
      key: protocol
      type: List[str]
    - description: Expected latency window in milliseconds for real‑time quotes and
        end‑of‑day snapshots for each symbol.
      key: latency_ms
      type: List[int]
    - description: The nearest data centre location for each symbol (e.g., "London‑West",
        "London‑East").
      key: datacenter
      type: List[str]
    - description: The subscription tier required for each symbol (e.g., Tier 1, Tier 2,
        Tier 3).
      key: tier
      type: List[str]
    prompt: 'Retrieve the list of LSE stock symbols to be fetched. For each symbol,
      specify:

      1. The primary market code (e.g., "LON") and ticker.

      2. The preferred data feed protocol (e.g., FIX, REST, WebSocket).

      3. Expected latency window (ms) for real‑time quotes and end‑of‑day snapshots.

      4. The nearest data centre location (e.g., "London‑West", "London‑East").

      5. Optional: the subscription tier required (e.g., Tier 1, Tier 2, Tier 3).

      Ensure the output is a JSON array where each element contains the keys: `symbol`,
      `market`, `protocol`, `latency_ms`, `datacenter`, `tier`.'
  identify_nasdaq_stocks:
    agent: false
    description: Selects a curated set of NASDAQ-listed equities for data retrieval,
      specifying for each the optimal data feed protocol, expected latency, and preferred
      datacenter location. This node equips downstream analytics with precise, low‑latency
      access to both historical and real‑time market data while respecting feed‑specific
      authentication and rate‑limit policies.
    name: identify_nasdaq_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Comma‑separated list of NASDAQ stock symbols to retrieve
      key: symbol_list
      type: List[str]
    - description: Primary data feed protocol for each symbol (e.g., Bloomberg API
        v4, Refinitiv Eikon REST, IEX Cloud, Nasdaq TotalView 2.0)
      key: feed_list
      type: List[str]
    - description: Expected round‑trip latency for historical and real‑time data in
        the format "historical:xx,real‑time:yy" (in milliseconds)
      key: latency_ms_list
      type: List[str]
    - description: Nearest available data center or region for each feed (e.g., US‑East‑Coast,
        EU‑London, APAC‑Tokyo)
      key: datacenter_list
      type: List[str]
    - description: Protocol‑specific authentication or rate‑limit constraints to respect
        for each symbol
      key: constraints_list
      type: List[str]
    prompt: 'Generate a comma‑separated list of the NASDAQ stock symbols that should
      be retrieved. For each symbol, include: - The primary data feed protocol to
      use (e.g., Bloomberg API v4, Refinitiv Eikon REST, IEX Cloud, Nasdaq TotalView
      2.0) - The expected round‑trip latency (in milliseconds) for historical price
      data and for real‑time tick updates - The nearest available data center or region
      (e.g., US‑East‑Coast, EU‑London, APAC‑Tokyo) that offers the lowest latency
      for each feed - Any protocol‑specific authentication or rate‑limit constraints
      that must be respected Return the information in a structured JSON array where
      each element has the keys: "symbol", "feed", "latency_ms", "datacenter", and
      "constraints". Ensure the list is concise (no more than 20 symbols) and prioritizes
      high‑volume, high‑liquidity stocks suitable for intraday analytics.'
  identify_nyse_stocks:
    agent: false
    description: Retrieves the comprehensive, real-time list of NYSE equities by querying
      the NYSE public data feed via HTTPS/2 with TLS 1.3, handling pagination, authentication,
      and rate‑limit retries. The node captures per-request latency, identifies the
      serving data center, and outputs a clean JSON array of symbols along with company
      names and listing dates for downstream analysis.
    name: identify_nyse_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of NYSE equity symbols retrieved.
      key: symbols
      type: List[str]
    - description: Corresponding company names for each symbol.
      key: company_names
      type: List[str]
    - description: ISO 8601 dates when each equity was listed.
      key: listing_dates
      type: List[str]
    - description: Round‑trip latency in milliseconds for each API request page.
      key: latency_ms
      type: List[int]
    - description: Data center region (us-east-1, us-west-2, eu-central-1) from which
        each request was served.
      key: data_centers
      type: List[str]
    prompt: 'Query the NYSE market data API to enumerate all active equities for the
      current trading day. Request the list using the HTTPS/2 protocol with TLS 1.3
      encryption, specifying a `Content-Type: application/json` header and a `Accept:
      application/json` header. Ensure the request includes a `User-Agent: NYSE-DataClient/1.0`
      string and an `X-API-Token` authentication header. The API endpoint `https://api.nyse.com/v1/market/equities`
      supports pagination; retrieve all pages by following the `Link` header `rel="next"`.
      For each equity, extract the `symbol`, `companyName`, and `listingDate` fields.
      Return a JSON array where each element is a JSON object containing these three
      keys. The response should be retrieved with a timeout of 5 seconds per request,
      and the client must retry up to 3 times on HTTP 429 or 5xx responses with exponential
      backoff. Additionally, provide the latency in milliseconds for each request
      and indicate the data center region (`us-east-1`, `us-west-2`, or `eu-central-1`)
      from which the data was served, as reported in the `X-DataCenter-Location` header.
      If any symbol cannot be fetched after retries, log the symbol and error code
      but continue processing the remaining symbols.'
  identify_toronto_stock_exchange_stocks:
    agent: false
    description: Compiles a comprehensive, protocol-aware catalog of active Toronto
      Stock Exchange equities for automated data ingestion. The node specifies each
      ticker's sector, market-cap classification, optimal data-feed protocol with
      associated latency expectations, and the primary data-center location to enable
