    prompt: "Normalize the unified stock dataset obtained from `store_combined_stock_data`.\
      \ The dataset consolidates tick‑level feeds from LSE, NASDAQ, NYSE, and Toronto\
      \ Stock Exchange. Perform the following steps:\n\n1. **Protocol Alignment**\
      \ – Convert all timestamps to UTC, enforce ISO‑8601 format, and reconcile time‑zone\
      \ offsets using the exchange’s official time‑zone metadata.\n2. **Missing‑Value\
      \ Imputation** – Apply exchange‑specific imputation strategies: forward‑fill\
      \ for intra‑day price series, linear interpolation for cross‑exchange arbitrage\
      \ gaps, and mean‑substitution for low‑frequency fundamental fields.\n3. **Data\
      \ Consistency Checks** – Validate price bounds, trade‑volume sanity, and symbol‑to‑ticker\
      \ mapping consistency. Flag and discard entries violating ±3σ bounds.\n4. **Latency\
      \ Annotation** – Append a `ingest_latency_ms` field capturing the round‑trip\
      \ delay from feed reception to storage, sampled from a 5‑second moving window\
      \ per exchange.\n5. **Datacenter Tagging** – Tag each record with `storage_datacenter`\
      \ (e.g., \"us-east‑1\", \"eu-west-2\") based on the region where `store_combined_stock_data`\
      \ persisted the data.\n6. **Output Schema** – Return a Parquet file with the\
      \ following columns:\n   - `exchange_id`, `symbol`, `timestamp_utc`, `price`,\
      \ `volume`, `ingest_latency_ms`, `storage_datacenter`, `normalized_flag`.\n\n\
