      key: fetch_latency_ms
      type: int
    - description: Time (ms) taken to parse the entire payload
      key: parse_duration_ms
      type: int
    prompt: 'Parse the raw NASDAQ JSON payload returned by the API into a normalized,
      query-ready table. The input will include a timestamped, multi-asset bundle
      from a specific datacenter (US-East or US-West). For each record, extract the
      fields: symbol, date, open, high, low, close, volume, adjusted_close, and market_cap.
      Convert all numeric fields to IEEE 754 doubles, ensure dates are ISO-8601 UTC,
      and flag any missing or NaN values with a sentinel NULL. Output a JSON array
      where each element is a flat object keyed by these columns, and include metadata:
      source_datacenter, fetch_latency_ms, and parse_duration_ms. The parsing must
      honor the latency constraints specified by the datafeed: 100 ms per 1 kB chunk,
      with an upper bound of 5 s per full payload. If the payload exceeds 10 MB, split
      it into paginated segments and process each sequentially, aggregating the results
      into the final array.'
  parse_nyse_stock_data:
    agent: false
    description: Transforms raw NYSE stock data retrieved over HTTPS into a normalized,
      time‑stamped JSON structure, incorporating latency metrics, datacenter provenance,
      and rigorous validation to ensure downstream consistency.
    name: parse_nyse_stock_data
    nodes_depended_on:
    - fetch_nyse_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: Total number of validated records output by the node.
      key: records_count
      type: int
    - description: ISO‑8601 UTC timestamps of each record ingestion, in chronological
        order.
      key: record_timestamps
      type: List[str]
    - description: Ticker symbols corresponding to each record, aligned with `record_timestamps`.
      key: record_symbols
      type: List[str]
    - description: Last traded price for each record, aligned with `record_timestamps`.
      key: record_prices
      type: List[float]
    - description: Total traded volume for each record, aligned with `record_timestamps`.
      key: record_volumes
      type: List[int]
    - description: Network latency in milliseconds recorded for each request, aligned
        with `record_timestamps`.
      key: record_metadata_latency_ms
      type: List[int]
    - description: Datacenter region (e.g., US‑East‑1, EU‑West‑2) that served each
        record, aligned with `record_timestamps`.
      key: record_metadata_datacenter
      type: List[str]
    - description: Source URL from which each record was fetched, aligned with `record_timestamps`.
      key: record_metadata_source_url
      type: List[str]
    prompt: "Parse the fetched NYSE stock data into a clean, query-friendly schema:\n\
      \n1. **Protocol details** – Assume the data arrives over HTTPS via the NYSE’s\
      \ public API using JSON-lines format with `application/json` content-type.\n\
      2. **Latency handling** – The raw payload may contain up to 200 ms of network\
      \ latency; implement a timeout of 5 s and retry logic with exponential back-off\
      \ (max 3 attempts).\n3. **Datacenter mapping** – NYSE data is replicated across\
      \ two primary datacenters: **New York (US‑East‑1)** and **London (EU‑West‑2)**.\
      \ Select the nearest datacenter based on the client’s IP location and record\
      \ the chosen region in the output metadata.\n4. **Output structure** – Emit\
      \ a JSON object with the following keys:\n   * `timestamp` – ISO‑8601 UTC of\
      \ record ingestion.\n   * `exchange` – \"NYSE\".\n   * `symbol` – ticker symbol.\n\
      \   * `price` – last traded price (float).\n   * `volume` – total traded volume\
      \ (integer).\n   * `metadata` – object containing `latency_ms`, `datacenter`,\
      \ and `source_url`.\n5. **Validation** – Verify that all numeric fields are\
      \ non‑negative and that `timestamp` is within ±30 seconds of the current system\
      \ time. Flag and discard any malformed records.\n6. **Return** – A list of validated,\
      \ structured records ready for downstream analytics or storage."
  parse_toronto_stock_exchange_stock_data:
    agent: false
    description: Transforms the raw JSON stock feed from the Toronto Stock Exchange
      into a rigorously validated, high‑precision time‑series DataFrame, enriching
      it with latency and datacenter provenance metadata for auditability and downstream
      analytics.
    name: parse_toronto_stock_exchange_stock_data
    nodes_depended_on:
    - fetch_toronto_stock_exchange_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: Ticker symbol of the security
      key: ticker
      type: str
    - description: ISO 8601 UTC timestamp of the trade record
      key: timestamp_utc
      type: str
    - description: Opening price of the interval
      key: open_price
      type: float
    - description: Highest price of the interval
      key: high_price
      type: float
    - description: Lowest price of the interval
      key: low_price
      type: float
    - description: Closing price of the interval
      key: close_price
      type: float
    - description: Adjusted close price accounting for splits/dividends
      key: adjusted_close_price
      type: float
    - description: Total traded volume for the interval
      key: volume_traded
      type: int
    - description: True if price jump exceeds 10× previous day range
      key: anomaly_detected
      type: bool
    - description: True if fetch latency exceeded 200 ms or an error code was received
      key: warning_flag
      type: bool
    - description: URL of the data source API
      key: source_url
      type: str
    - description: Round‑trip latency reported by the fetch node in milliseconds
      key: request_latency_ms
      type: int
    - description: CDN edge or datacenter that served the data (e.g., toronto-east,
        toronto-west)
      key: datacenter_origin
      type: str
    prompt: 'Parse the raw JSON payload returned from the Toronto Stock Exchange API
      into a canonical, time-series DataFrame with the following schema:


      1. **Ticker** (string) – Ticker symbol.

      2. **Timestamp** (ISO 8601 UTC) – Exact trade timestamp.

      3. **Open** (float) – Opening price.

      4. **High** (float) – Highest price during the interval.

      5. **Low** (float) – Lowest price during the interval.

      6. **Close** (float) – Closing price.

      7. **Volume** (integer) – Traded volume.

      8. **Adjusted Close** (float) – Adjusted close for splits/dividends.


      The parser must:

      - Validate the presence of all required fields and discard rows with missing
      or NaN values.

      - Convert numeric fields to high‑precision `Decimal` to avoid floating‑point
      drift.

      - Ensure timestamps are coerced to UTC and sorted ascending.

      - Detect and flag anomalies where price jumps exceed 10× the previous day’s
      range, logging them for downstream risk checks.

      - Output a Pandas DataFrame, serialized as a parquet file (`{ticker}_data.parquet`)
      stored in the designated data lake, with a partition key on `Ticker`.


      Additionally, annotate the output with metadata:

      - **Source**: `https://api.torontostockexchange.com/v1/quotes`.

      - **Request Latency**: Report the round‑trip time recorded by the fetch node
      (in milliseconds).

      - **Datacenter**: Indicate the originating CDN edge (e.g., `toronto-east`, `toronto-west`).


      If the fetch node reports a latency > 200 ms or an error code, the parser should
      emit a warning but continue processing the available payload. The final artifact
      must be consumable by downstream analytics nodes without further transformation.'
  repartition_combined_stock_data:
    agent: false
    description: Reorganizes the normalized stock dataset into an efficient, distributed
      partition layout that matches the chosen storage engine’s key strategy. The
      node orchestrates protocol‑aware data ingestion, enforces low‑latency guarantees
      per data source, and aligns partitions with datacenter geography to reduce cross‑region
      costs and improve query performance.
    name: repartition_combined_stock_data
    nodes_depended_on:
    - normalize_combined_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: Protocol used for data ingestion (e.g., Kafka, Pulsar, Kinesis).
      key: transport_protocol
      type: str
    - description: Target ingestion latency in milliseconds for this data feed.
      key: ingestion_latency_ms
      type: int
    - description: Geographical data center used for repartitioning (e.g., US‑East‑1,
        EU‑Frankfurt, AP‑Tokyo).
      key: datacenter_location
      type: str
    - description: Strategy used for partitioning files (e.g., hash(symbol+date),
        time_window).
      key: partition_scheme
      type: str
    - description: Number of replicas for each partition to ensure durability.
      key: replication_factor
      type: int
    - description: Number of shard rebalancing operations performed during repartitioning.
      key: shard_rebalance_count
      type: int
    - description: Concise text log summarizing partition schema, replication settings,
        and rebalancing actions.
      key: audit_log
      type: str
    prompt: Repartition the normalized combined stock dataset across the distributed
      storage fabric to optimize query latency and ingestion throughput. For each
      data feed, explicitly specify the transport protocol (e.g., Kafka, Pulsar, or
      Amazon Kinesis), the target ingestion latency (≤ 200 ms for real‑time feeds,
      ≤ 5 s for batch feeds), and the geo‑location of the datacenter (US‑East‑1, EU‑Frankfurt,
      AP‑Tokyo). Ensure that the repartitioning logic aligns with the underlying storage
      engine’s partition key strategy (e.g., hash‑based on symbol+date for Parquet,
      time‑windowed for ORC) and that the resulting files are co‑located within the
      same availability zone to minimize cross‑region traffic. Finally, generate a
      concise audit log detailing the new partition schema, replication factor, and
      any shard rebalancing performed.
  store_combined_stock_data:
    agent: false
    description: Persist the aggregated, cleaned, and normalized stock data from LSE,
      NYSE, NASDAQ, and TSX into a fault‑tolerant, geo‑distributed data lake with
