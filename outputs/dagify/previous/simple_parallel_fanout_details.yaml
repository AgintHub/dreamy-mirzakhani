dag_type: plain_text
description: A minimal workflow where a single start step feeds into two parallel
  steps that run independently.
name: simple_parallel_fanout
nodes:
  parallel_step_one:
    agent: false
    description: Perform the first independent task after receiving the start signal.
    name: parallel_step_one
    nodes_depended_on:
    - start_step
    nodes_dependent_on: []
    prompt: When the input is "START", output the result of task one as a short sentence.
  parallel_step_two:
    agent: false
    description: Perform the second independent task after receiving the start signal.
    name: parallel_step_two
    nodes_depended_on:
    - start_step
    nodes_dependent_on: []
    prompt: When the input is "START", output the result of task two as a short sentence.
  start_step:
    agent: false
    description: Generate the initial signal that triggers the parallel work.
    name: start_step
    nodes_depended_on: []
    nodes_dependent_on:
    - parallel_step_one
    - parallel_step_two
    prompt: Output a single token "START" to indicate the beginning of the workflow.
