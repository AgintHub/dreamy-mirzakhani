dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: List of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: List of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: List of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: List of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: This node analyzes integration test results to identify interface-level
        issues.
      docstring:
        examples:
        - lines:
          - 'integration_test_results = {''component_pairs'': [(''A'', ''B'')], ''data_exchange_issues'':
            ['' Issue 1''], ''contract_violations'': [''Contract Violation 1'']}'
          - analyze_integration_test_results(integration_test_results)
          output: '{''interface_failures'': [''Interface Failure 1''], ''component_pairs'':
            [(''A'', ''B'')], ''data_exchange_issues'': ['' Issue 1''], ''contract_violations'':
            [''Contract Violation 1'']}'
        parameters:
        - description: Integration test results.
          name: integration_test_results
          type: dict
        raises:
        - description: If input is not a dictionary.
          type: ValueError
        returns:
          description: Dictionary containing interface failures, component pairs,
            data exchange issues, and contract violations.
          type: dict
        summary: Analyze integration test results to identify interface-level issues.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered
      key: regression_summary
      type: str
    prd:
      conceptual_info: This node analyzes the results of regression tests to identify
        potential risks.
      docstring:
        examples:
        - lines:
          - import numpy as np
          - analyzed_results = analyze_regression_test_results(results)
          - print(analyzed_results)
          output: '[{''feature_name'': ''example_feature'', ''before_after_state_comparison'':
            ''compare_before_after'', ''impact_severity_estimation'': 5, ''regression_summary'':
            ''summary_text''}]'
        parameters: []
        raises: []
        returns:
          description: A list of dictionaries containing the feature name, before/after
            state comparison, impact severity estimation, and regression summary
          type: '[str, str, int, str]'
        summary: This function analyzes the results of regression tests to identify
          potential risks.
    prompt: "List all regression anomalies with: \n1) Feature name, \n2) Before/after\
      \ state comparison, \n3) Impact severity estimation."
  analyze_unit_test_results:
    agent: false
    description: Identify unit-level anomalies
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: The name of the test case that failed
      key: test_case_name
      type: List[str]
    - description: The actual output of the test case that failed
      key: actual_output
      type: List[str]
    - description: A suggested root cause of the failure from an implementation perspective
      key: suggested_root_cause
      type: List[str]
    - description: The type of test that failed
      key: test_type
      type: List[str]
    - description: A list of test cases that passed
      key: passed_tests
      type: List[str]
    - description: A list of test cases that failed
      key: failed_tests
      type: List[str]
    prompt: 'List all test failures with: 1) Test case name, 2) Actual output, 3)
      Suggested root cause from implementation perspective.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: This node generates integration test scenarios based on the
        test objectives and coverage requirements.
      docstring:
        examples:
        - lines:
          - test_objectives = ['core functionality', 'edge cases', 'performance requirements']
          - coverage_requirements = ['functional coverage', 'performance coverage',
            'security coverage']
          - integration_test_scenarios = generate_integration_test_scenarios(test_objectives,
            coverage_requirements)
          output: '[component_pairs: [(''component1'', ''component2''), (''component3'',
            ''component4'')], data_flow_paths: [''component1 -> component2 -> component3'',
            ''component3 -> component4''], dependency_validations: [''component1 &
            component2 validate'', ''component3 & component4 validate''], integration_test_scenarios:
            [''test_scenario1'', ''test_scenario2'']]'
        parameters:
        - description: List of high-level test objectives
          name: test_objectives
          type: List[str]
        - description: List of coverage requirements
          name: coverage_requirements
          type: List[str]
        raises:
        - description: If test objectives or coverage requirements are invalid
          type: ValueError
        returns:
          description: A list of integration test scenarios
          type: List[integration_test_scenario]
        summary: Generate integration test scenarios
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: Design regression test cases to validate unchanged features.
      docstring:
        examples:
        - lines:
          - test_objectives = ['functional testing', 'regression testing', 'performance
            testing']
          - high_risk_features = ['login feature', ' payment gateway', ' user profile']
          - design_regression_test_cases(test_objectives, high_risk_features)
          output: '{"high_risk_features": [''login feature'', ''payment gateway'',
            ''user profile''],}'
        parameters:
        - description: List of high-level test objectives.
          name: test_objectives
          type: List[str]
        - description: List of high-risk features targeted by regression test scenarios.
          name: high_risk_features
          type: List[str]
        raises:
        - description: If input parameters are of incorrect type.
          type: TypeError
        returns:
          description: Dictionary containing high-risk features, precondition setup,
            and expected state preservation.
          type: Dict[str, List[str]]
        summary: Design regression test cases for high-risk features.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the test case
      key: test_id
      type: str
    - description: List of input parameters required for the test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for the test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: This node generates unit test case templates with test IDs,
        input parameters, and expected outputs, focusing on core functional components.
      docstring:
        examples:
        - lines:
          - test_case_templates = design_unit_test_cases(plan_test_scope)
          - print(test_case_templates)
          output: "{\n    'test_id': 'test1',\n    'input_parameters': ['param1',\
            \ 'param2'],\n    'expected_output': ['output1', 'output2']\n}"
        - lines:
          - test_case_templates = design_unit_test_cases(plan_test_scope)
          - print(test_case_templates)
          output: "{\n    'test_id': 'test2',\n    'input_parameters': ['param3',\
            \ 'param4'],\n    'expected_output': ['output3', 'output4']\n}"
        parameters:
        - description: High-level test objectives and coverage requirements defined
            in the plan_test_scope node.
          name: plan_test_scope
          type: dict
        raises:
        - description: If the input plan_test_scope is invalid or missing.
          type: ValueError
        returns:
          description: Dictionary of test case templates with test IDs, input parameters,
            and expected outputs.
          type: dict
        summary: Generates unit test case templates with test IDs, input parameters,
          and expected outputs.
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: This node generates a report summarizing test results, including
        total tests executed, pass/fail counts, defect density, and risk assessment
        rating.
      docstring:
        examples:
        - lines:
          - results_dict = generate_test_report(unit_test_results, integration_test_results,
            regression_test_results, defect_list)
          - print(results_dict)
          output: '{"total_tests_executed": 100, "pass_count": 90, "fail_count": 10,
            "defect_density": 0.1, "risk_assessment_rating": 5}'
        - lines:
          - results_dict = generate_test_report([], [], [], [])
          - print(results_dict)
          output: '{"total_tests_executed": 0, "pass_count": 0, "fail_count": 0, "defect_density":
            0, "risk_assessment_rating": 0}'
        parameters:
        - description: List of unit test execution status
          name: unit_test_results
          type: list[bool]
        - description: List of integration test execution status
          name: integration_test_results
          type: list[bool]
        - description: List of regression test execution status
          name: regression_test_results
          type: list[bool]
        - description: List of detected defects
          name: defect_list
          type: list[dict]
        raises:
        - description: If input data is invalid
          type: ValueError
        returns:
          description: A dictionary containing test summary metrics
          type: dict
        summary: This node takes in test results data and generates a summary report.
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: This node defines the test objectives and coverage requirements
        for the software under test.
      docstring:
        examples:
        - lines:
          - test_objectives, core_functionality_requirements, edge_case_requirements,
            performance_requirements = plan_test_scope()
          - print(test_objectives)
          - print(core_functionality_requirements)
          - print(edge_case_requirements)
          - print(performance_requirements)
          output: '

            List of high-level test objectives

            List of core functionality requirements

            List of edge case requirements

            List of performance requirements'
        parameters: []
        raises:
        - description: If the input parameters are invalid
          type: ValueError
        returns:
          description: A dictionary containing the test objectives and coverage requirements
          type: dict
        summary: This node generates a list of high-level test objectives, core functionality
          requirements, edge case requirements, and performance requirements.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Aggregate testing anomalies from unit, integration, and regression
        test results to generate a defect summary table.
      docstring:
        examples:
        - lines:
          - report_defects(analyze_unit_test_results=results1, analyze_integration_test_results=results2,
            analyze_regression_test_results=results3)
          output: '{''test_type'': ''unit'', ''component_info'': ''component1'', ''description'':
            ''defect1'', ''severity'': ''high'', ''reproduction_steps'': ''steps1''}'
        - lines:
          - report_defects(analyze_unit_test_results=results1, analyze_integration_test_results=results2,
            analyze_regression_test_results=results3)
          output: '{''test_type'': ''integration'', ''component_info'': ''component2'',
            ''description'': ''defect2'', ''severity'': ''medium'', ''reproduction_steps'':
            ''steps2''}'
        parameters:
        - description: Results of unit test analysis, containing test case names,
            actual outputs, suggested root causes, and test types.
          name: analyze_unit_test_results
          type: object
        - description: Results of integration test analysis, containing interface
            failures, component pairs, data exchange issues, and contract violations.
          name: analyze_integration_test_results
          type: object
        - description: Results of regression test analysis, containing feature names,
            baseline vs actual results, state drift indicators, and performance metrics.
          name: analyze_regression_test_results
          type: object
        raises:
        - description: If any of the input objects are missing required keys.
          type: ValueError
        returns:
          description: A defect summary table with columns for test type, component,
            description, severity, and reproduction steps.
          type: object
        summary: Aggregate testing anomalies from unit, integration, and regression
          test results to generate a defect summary table.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: Execute component interaction tests and document communication
        logs and interface validation outcomes.
      docstring:
        examples:
        - lines:
          - 'integration_test_cases = [{''id'': 1, ''description'': ''Test 1''}, {''id'':
            2, ''description'': ''Test 2''}]'
          - 'setup_environment = {''variable1'': ''value1'', ''variable2'': ''value2''}'
          - result = run_integration_tests(integration_test_cases, setup_environment)
          output: '{''communication_logs'': [{''log_id'': 1, ''log_message'': ''Test
            1 completed''}], ''interface_validation_results'': [{''interface_id'':
            1, ''validation_result'': ''Pass''}], ''test_scenario_ids'': [1, 2]}'
        parameters:
        - description: List of integration test cases to execute
          name: integration_test_cases
          type: List[int]
        - description: Setup environment variables for testing
          name: setup_environment
          type: dict
        raises:
        - description: If there is an issue with the integration test cases or setup
            environment
          type: Exception
        returns:
          description: A dictionary containing communication logs, interface validation
            outcomes, and test scenario identifiers
          type: dict
        summary: This node executes integration test scenarios and documents communication
          logs and interface validation outcomes.
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: Execute unchanged feature validation
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of baseline vs actual results
      key: baseline_vs_actual_results
      type: List[str]
    - description: List of state drift indicators
      key: state_drift_indicators
      type: List[str]
    - description: List of performance metrics
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: This node executes unchanged feature validation and records
        the results.
      docstring:
        examples:
        - lines:
          - 'design_regression_test_cases.inputs = {''high_risk_features'': [''feature1'',
            ''feature2''], ''precondition_setup'': [''setup1'', ''setup2''], ''expected_state_preservation'':
            [''preserve1'', ''preserve2'']}'
          - 'setup_test_environment.inputs = {''hardware_specs'': [''spec1'', ''spec2''],
            ''software_specs'': [''spec3'', ''spec4''], ''test_data_sets'': [''data1'',
            ''data2''], ''mock_services'': [''service1'', ''service2'']}'
          - 'run_regression_tests.inputs = {''design_regression_test_cases'': design_regression_test_cases,
            ''setup_test_environment'': setup_test_environment}'
          - run_regression_tests()
          output: '{''baseline_vs_actual_results'': [''result1'', ''result2''], ''state_drift_indicators'':
            [''indicator1'', ''indicator2''], ''performance_metrics'': [''metric1'',
            ''metric2'']}'
        - lines:
          - 'design_regression_test_cases.inputs = {''high_risk_features'': [''feature3'',
            ''feature4''], ''precondition_setup'': [''setup3'', ''setup4''], ''expected_state_preservation'':
            [''preserve3'', ''preserve4'']}'
          - 'setup_test_environment.inputs = {''hardware_specs'': [''spec5'', ''spec6''],
            ''software_specs'': [''spec7'', ''spec8''], ''test_data_sets'': [''data3'',
            ''data4''], ''mock_services'': [''service3'', ''service4'']}'
          - 'run_regression_tests.inputs = {''design_regression_test_cases'': design_regression_test_cases,
            ''setup_test_environment'': setup_test_environment}'
          - run_regression_tests()
          output: '{''baseline_vs_actual_results'': [''result3'', ''result4''], ''state_drift_indicators'':
            [''indicator3'', ''indicator4''], ''performance_metrics'': [''metric3'',
            ''metric4'']}'
        parameters: []
        raises:
        - description: If baseline vs actual results are empty.
          type: ValueError
        - description: If state drift indicators or performance metrics are empty.
          type: Exception
        returns:
          description: Dictionary with baseline vs actual results, state drift indicators,
            and performance metrics.
          type: Dict[str, Union[List[str], List[str], List[str]]]
        summary: Execute unchanged feature validation and record results.
    prompt: 'Execute regression scenarios and record: 1) Baseline vs actual results,
      2) State drift indicators, 3) Performance metrics.'
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: bool
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: str
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: str
    prd:
      conceptual_info: Execute module-level unit tests, record test execution status,
        actual output vs expected output, and timestamps.
      docstring:
        examples:
        - lines:
          - 'design_unit_test_cases = {''test_id'': ''test_1'', ''input_parameters'':
            [''param_1''], ''expected_output'': [''output_1'']}'
          - 'setup_test_environment = {''hardware_specs'': [''spec_1''], ''software_specs'':
            [''spec_2'']}'
          - run_unit_tests(design_unit_test_cases, setup_test_environment)
          output: test_execution_status=True, actual_output_vs_expected_output='None',
            test_case_timestamps='2022-01-01 12:00:00'
        parameters: []
        raises: []
        returns:
          description: tuple of test_execution_status, actual_output_vs_expected_output,
            test_case_timestamps
          type: tuple
        summary: Execute unit tests, record test execution status, actual output vs
          expected output, and timestamps.
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up
      key: environment_status
      type: bool
    prd:
      conceptual_info: Node that prepares testing infrastructure and dependencies
      docstring:
        examples:
        - lines:
          - 'plan_test_scope = {''hardware_specs'': [''spec1'', ''spec2''], ''software_specs'':
            [''app1'', ''app2''], ''test_data_sets'': [''set1'', ''set2''], ''mock_services'':
            [''serv1'', ''serv2'']}'
          - setup_test_environment(plan_test_scope)
          output: '{ ''hardware_specs'': [''spec1'', ''spec2''], ''software_specs'':
            [''app1'', ''app2''], ''test_data_sets'': [''set1'', ''set2''], ''mock_services'':
            [''serv1'', ''serv2''], ''environment_status'': True }'
        parameters:
        - description: Test scope defined to execute tests
          name: plan_test_scope
          type: plan_test_scope
        raises:
        - description: If test scope is not defined
          type: ValueError
        returns:
          description: Environment requirements to execute tests
          type: Dict[str, Any]
        summary: Prepare testing infrastructure and dependencies
    prompt: 'List 3-5 environment requirements: hardware/software specs, test data
      sets, mock services needed for testing.'
  sign_off_test_cycle:
    agent: false
    description: Compile test results summary
    name: sign_off_test_cycle
    nodes_depended_on:
    - generate_test_report
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Number of tests that failed
      key: fail_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: The purpose of this node is to compile a summary of the test
        results, including the total number of tests executed, the number of tests
        that passed and failed, the defect density, and the risk assessment rating.
      docstring:
        examples:
        - lines:
          - from typing import Dict
          - from node_prd import generate_test_report
          output: '{''total_tests_executed'': 100, ''pass_count'': 90, ''fail_count'':
            10, ''defect_density'': 0.1, ''risk_assessment_rating'': 8}'
        - lines:
