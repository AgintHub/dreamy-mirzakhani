dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: A list of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: A list of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: A list of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: A list of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: This node analyzes the results of integration tests to identify
        interface-level issues.
      docstring:
        examples:
        - lines:
          - interface_failures, component_pairs, data_exchange_issues, contract_violations
            = analyze_integration_test_results(communication_logs=['log1', 'log2'],
            interface_validation_results=['result1', 'result2'])
          output: '["Failure1", "Failure2", "Issue1", "Violation1"]'
        - lines:
          - interface_failures, component_pairs, data_exchange_issues, contract_violations
            = analyze_integration_test_results(communication_logs=['log3', 'log4'],
            interface_validation_results=['result3', 'result4'])
          output: '["Failure3", "Failure4", "Issue2", "Violation2"]'
        parameters:
        - description: The communication logs generated during the integration test
            scenarios.
          name: communication_logs
          type: List[str]
        - description: The validation outcomes for each interface per test step.
          name: interface_validation_results
          type: List[str]
        raises:
        - description: If the input types are incorrect.
          type: TypeError
        returns:
          description: A tuple containing the interface failures, component pairs,
            data exchange issues, and contract violations.
          type: Tuple[List[str], List[str], List[str], List[str]]
        summary: Analyze integration test results to identify interface failures and
          related details.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks.
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies.
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions.
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value.
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered.
      key: regression_summary
      type: str
    prd:
      conceptual_info: This node takes the output of the run_regression_tests node
        and identifies regression risks by analyzing the baseline vs actual results,
        state drift indicators, and performance metrics.
      docstring:
        examples:
        - lines:
          - from analyze_regression_test_results import analyze_regression_test_results
          - 'results = {''baseline_vs_actual_results'': [''pass'', ''fail''], ''state_drift_indicators'':
            [''drift''], ''performance_metrics'': [''slow'']}'
          - output = analyze_regression_test_results(results)
          output: '{"feature_name": "feature1", "before_after_state_comparison": "before
            vs after comparison", "impact_severity_estimation": 3, "regression_summary":
            "Regression issues found in feature1"}'
        parameters: []
        raises: []
        returns:
          description: A dictionary containing the feature name, before/after state
            comparison, impact severity estimation, and regression summary.
          type: '{feature_name: str, before_after_state_comparison: str, impact_severity_estimation:
            int, regression_summary: str}'
        summary: Analyze the results of regression tests to identify potential issues
          and risks.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Identify unit-level anomalies
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: The name of the test case that failed
      key: test_case_name
      type: str
    - description: The actual output of the test case that failed
      key: actual_output
      type: str
    - description: A suggested root cause of the failure from an implementation perspective
      key: suggested_root_cause
      type: str
    - description: The type of test that failed
      key: test_type
      type: str
    - description: A list of test cases that passed
      key: passed_tests
      type: str
    - description: A list of test cases that failed
      key: failed_tests
      type: str
    prd:
      conceptual_info: This node identifies unit-level anomalies by analyzing test
        case failures.
      docstring:
        examples:
        - lines:
          - 'def analyze_unit_test_results(test_execution_status, actual_output_vs_expected_output,
            test_case_timestamps):'
          - '    test_case_names = [''test1'', ''test2'', ''test3'']'
          - '    expected_output = [''expected1'', ''expected2'', ''expected3'']'
          - '    root_causes = [''cause1'', ''cause2'', ''cause3'']'
          - '    test_type = ''unit'''
          - '    passed_tests = [''test1'', ''test2'']'
          - '    failed_tests = [''test3'']'
          - '    return {test_case_names[i]: {''actual_output'': actual_output_vs_expected_output[i],
            ''suggested_root_cause'': root_causes[i], ''test_type'': test_type, ''passed_tests'':
            passed_tests, ''failed_tests'': failed_tests} for i in range(len(test_case_names))}'
          output: '{test_case_names[0]: {''actual_output'': ''expected1'', ''suggested_root_cause'':
            ''cause1'', ''test_type'': ''unit'', ''passed_tests'': [''test1'', ''test2''],
            ''failed_tests'': [''test3'']}, test_case_names[1]: {''actual_output'':
            ''expected2'', ''suggested_root_cause'': ''cause2'', ''test_type'': ''unit'',
            ''passed_tests'': [''test1'', ''test2''], ''failed_tests'': [''test3'']},
            test_case_names[2]: {''actual_output'': ''actual_output_vs_expected_output[2]'',
            ''suggested_root_cause'': ''cause3'', ''test_type'': ''unit'', ''passed_tests'':
            [''test1'', ''test2''], ''failed_tests'': [''test3'']}}'
        - lines:
          - 'def analyze_unit_test_results(test_execution_status, actual_output_vs_expected_output,
            test_case_timestamps):'
          - '    return {''error'': ''Test execution failed''}'
          output: 'TypeError: {''error'': ''Test execution failed''}'
        parameters:
        - description: The pass/fail status of each test case
          name: test_execution_status
          type: list of PrimitiveType.BOOL
        - description: The difference between actual and expected output of each test
            case
          name: actual_output_vs_expected_output
          type: list of PrimitiveType.STR
        - description: Timestamps for each test execution
          name: test_case_timestamps
          type: list of PrimitiveType.STR
        raises:
        - description: If input types are incorrect
          type: TypeError
        returns:
          description: '{test_case_name, actual_output, suggested_root_cause, test_type,
            passed_tests, failed_tests}'
          type: dict of str
        summary: This function analyzes test case failures and returns the test case
          name, actual output, suggested root cause, test type, passed tests, and
          failed tests.
    prompt: 'List all test failures with:

      1) Test case name,

      2) Actual output,

      3) Suggested root cause from implementation perspective.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: This node is responsible for designing integration test cases.
      docstring:
        examples:
        - lines:
          - component_pairs = ['comp1', 'comp2', 'comp3']
          - data_flow_paths = ['path1', 'path2', 'path3']
          - dependency_validations = ['validation1', 'validation2', 'validation3']
          - integration_test_scenarios = design_integration_test_cases(component_pairs,
            data_flow_paths, dependency_validations)
          - print(integration_test_scenarios)
          output: '{''component_pairs'': [''comp1'', ''comp2'', ''comp3''], ''data_flow_paths'':
            [''path1'', ''path2'', ''path3''], ''dependency_validations'': [''validation1'',
            ''validation2'', ''validation3''], ''integration_test_scenarios'': [''scenario1'',
            ''scenario2'', ''scenario3'']}'
        parameters:
        - description: List of component pairs for integration test scenarios
          name: component_pairs
          type: List[str]
        - description: List of data flow paths for integration test scenarios
          name: data_flow_paths
          type: List[str]
        - description: List of dependency validations for integration test scenarios
          name: dependency_validations
          type: List[str]
        raises:
        - description: If component_pairs, data_flow_paths, or dependency_validations
            are empty
          type: ValueError
        returns:
          description: A dictionary containing component pairs, data flow paths, and
            dependency validations
          type: dict[str, object]
        summary: Designs integration test cases based on component pairs, data flow
          paths, and dependency validations.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: Create test cases for unchanged features validation.
      docstring:
        examples:
        - lines:
          - 'design_regression_test_cases(plan_test_scope={''test_objectives'': [''core
            functionality'', ''edge cases''], ''core_functionality_requirements'':
            [''test_1'', ''test_2''], ''edge_case_requirements'': [''test_3''], ''performance_requirements'':
            [''test_4'']}'
          output: "{\n  'high_risk_features': ['feature_1', 'feature_2'],\n  'precondition_setup':\
            \ ['setup_1', 'setup_2'],\n  'expected_state_preservation': ['expected_1',\
            \ 'expected_2']\n}"
        - lines:
          - 'design_regression_test_cases(plan_test_scope={''test_objectives'': [''core
            functionality'', ''edge cases''], ''core_functionality_requirements'':
            [''test_1'', ''test_2''], ''edge_case_requirements'': [''test_3''], ''performance_requirements'':
            [''test_4'']})'
          output: "{\n  'high_risk_features': ['feature_5', 'feature_6'],\n  'precondition_setup':\
            \ ['setup_5', 'setup_6'],\n  'expected_state_preservation': ['expected_5',\
            \ 'expected_6']\n}"
        parameters:
        - description: Test objectives and coverage requirements.
          name: plan_test_scope
          type: plan_test_scope
        raises:
        - description: If input test objectives are invalid.
          type: ValueError
        returns:
          description: Dictionary of high-risk features, precondition setup, and expected
            state preservation.
          type: dict
        summary: Generate regression test scenarios for high-risk features.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for each test case
      key: test_id
      type: List[str]
    - description: List of input parameters required for each test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for each test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: This node creates unit test case templates for module-level
        validation.
      docstring:
        examples:
        - lines:
          - 'plan_test_scope_output = {''test_objectives'': [''Objective 1'', ''Objective
            2''], ''core_functionality_requirements'': [''Functionality 1'', ''Functionality
            2'']}'
          - design_unit_test_cases(plan_test_scope_output)
          output: '[{''test_id'': ''Test Case 1'', ''input_parameters'': [''Param
            1'', ''Param 2''], ''expected_output'': [''Expected Output 1'', ''Expected
            Output 2'']}, {''test_id'': ''Test Case 2'', ''input_parameters'': [''Param
            3'', ''Param 4''], ''expected_output'': [''Expected Output 3'', ''Expected
            Output 4'']}]'
        parameters:
        - description: Plan test scope output, including test objectives and coverage
            requirements.
          name: plan_test_scope
          type: plan_test_scope
        raises:
        - description: If the plan_test_scope output is invalid or missing required
            information.
          type: ValueError
        returns:
          description: A list of dictionaries, where each dictionary contains the
            test ID, input parameters, and expected output.
          type: List[dict]
        summary: Generate unit test case templates based on the provided test objectives
          and coverage requirements.
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: This node defines test objectives and coverage requirements,
        serving as a crucial step in software testing.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Ensure core functionality works correctly', 'Test
            for edge cases', 'Verify performance meets requirements']
          - core_functionality_requirements = ['Functionalities should work independently',
            'APIs should respond correctly']
          - edge_case_requirements = ['Negative testing should be performed', 'Edge
            cases should be tested thoroughly']
          - performance_requirements = ['Response time should not exceed 1 second',
            'Throughput should be 100 requests per second']
          output: "{'test_objectives': ['Ensure core functionality works correctly',\
            \ 'Test for edge cases', 'Verify performance meets requirements'],\"\n\
            \              + \"'core_functionality_requirements': ['Functionalities\
            \ should work independently', 'APIs should respond correctly'],\"\n  \
            \            + \"'edge_case_requirements': ['Negative testing should be\
            \ performed', 'Edge cases should be tested thoroughly'],\"\n         \
            \     + \"'performance_requirements': ['Response time should not exceed\
            \ 1 second', 'Throughput should be 100 requests per second']}"
        parameters: []
        raises: []
        returns:
          description: A dictionary with test objectives, core functionality requirements,
            edge case requirements, and performance requirements.
          type: Dict[str, List[str]]
        summary: Plan test scope by defining test objectives and coverage requirements.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: This node aggregates testing anomalies from different types
        of tests to generate a defect summary table.
      docstring:
        examples:
        - lines:
          - 'defect_summary = report_defects(test_results_unit={''test_case_name'':
            ''test_1'', ''actual_output'': ''output_1''}'
          - '                test_results_integration={''interface_failures'': [''failure_1''],
            ''component_pairs'': [''pair_1'']}'
          - '                test_results_regression={''feature_name'': ''feature_1'',
            ''before_after_state_comparison'': ''comparison_1''})'
          - print(defect_summary)
          output: '{''test_type'': ''unit'', ''component_info'': '''', ''description'':
            ''test_1 failed'', ''severity'': ''low'', ''reproduction_steps'': ''output_1''}'
        parameters:
        - description: Analysis results from unit tests
          name: test_results_unit
          type: analyze_unit_test_results
        - description: Analysis results from integration tests
          name: test_results_integration
          type: analyze_integration_test_results
        - description: Analysis results from regression tests
          name: test_results_regression
          type: analyze_regression_test_results
        raises:
        - description: If any of the input test results are invalid
          type: ValueError
        returns:
          description: A dictionary containing the defect summary table data
          type: dict
        summary: Aggregate defects from different types of tests into a summary table.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: This node executes integration test scenarios to validate component
        interactions.
      docstring:
        examples:
        - lines:
          - integration_test_cases = design_integration_test_cases()
          - setup_test_environment = setup_test_environment()
          - communication_logs, interface_validation_results, test_scenario_ids =
            run_integration_tests(integration_test_cases, setup_test_environment)
          output: '{''communication_logs'': [...], ''interface_validation_results'':
            [...], ''test_scenario_ids'': [...]}'
        parameters:
        - description: List of integration test cases to be executed
          name: integration_test_cases
          type: List[str]
        - description: Setup for the test environment (hardware specs, software specs,
            test data sets, mock services)
          name: setup_test_environment
          type: object
        raises:
        - description: If the setup_test_environment is invalid
          type: ValueError
        - description: Any other exception that occurs during test execution
          type: Exception
        returns:
          description: A dictionary containing communication logs, interface validation
            results, and test scenario IDs
          type: dict
        summary: Execute integration test scenarios and document communication logs
          and interface validation outcomes.
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: This node orchestrates the execution of regression test scenarios
      for unchanged features, collecting baseline vs actual results, state drift indicators,
      and performance metrics.
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of results comparing baseline metrics versus current actual
        results for each regression scenario.
      key: baseline_vs_actual_results
      type: List[str]
    - description: Indicators signaling any detected state drift during regression
        tests, such as deviations or anomalies.
      key: state_drift_indicators
      type: List[str]
    - description: Various performance metrics recorded during regression testing,
        such as response times and throughput.
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: This node runs regression test scenarios, collecting results,
        state drift indicators, and performance metrics.
      docstring:
        examples:
        - lines:
          - 'result = run_regression_tests(design_regression_test_cases=[{''high_risk_features'':
            [''feature1''], ''precondition_setup'': ''setup1'', ''expected_state_preservation'':
            ''preserve1''}], setup_test_environment={''hardware_specs'': [''spec1''],
            ''software_specs'': [''spec2''], ''test_data_sets'': [''data1''], ''mock_services'':
            [''service1'']})'
          output: '{\n    "baseline_vs_actual_results": ["baseline1 VS actual1", "baseline2
            VS actual2"],\n    "state_drift_indicators": ["drift1", "drift2"],\n    "performance_metrics":
            ["response_time1", "response_time2"]\n}'
        parameters:
        - description: List of designed regression test cases, including high-risk
            features, precondition setup, and expected state preservation.
          name: design_regression_test_cases
          type: List[dict]
        - description: Prepared test environment with hardware specs, software specs,
            test data sets, and mock services.
          name: setup_test_environment
          type: dict
        raises:
        - description: If input test cases are invalid or test environment is not
            properly set up.
          type: ValueError
        returns:
          description: Resultant output structure with baseline vs actual results,
            state drift indicators, and performance metrics.
          type: dict
        summary: Run regression test scenarios and collect results.
    prompt: Execute regression scenarios and record results
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: List[bool]
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: List[str]
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: List[str]
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing.
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing.
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing.
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing.
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up.
      key: environment_status
      type: bool
    prd:
      conceptual_info: This node is responsible for setting up the test environment
        by retrieving the necessary environment requirements, including hardware,
        software specs, test data sets, and mock services.
      docstring:
        examples:
        - lines:
          - import setup_test_environment
          - plan_test_scope_output = plan_test_scope()
          - setup_test_environment(plan_test_scope_output)
          output: '{''hardware_specs'': [''spec1'', ''spec2''], ''software_specs'':
            [''spec3'', ''spec4''], ''test_data_sets'': [''data1'', ''data2''], ''mock_services'':
            [''service1'', ''service2''], ''environment_status'': True}'
        - lines:
          - import setup_test_environment
          - plan_test_scope_output = plan_test_scope()
          - setup_test_environment(plan_test_scope_output)
          output: '{''hardware_specs'': [''spec3'', ''spec4''], ''software_specs'':
            [''spec1'', ''spec2''], ''test_data_sets'': [''data2'', ''data3''], ''mock_services'':
            [''service2'', ''service3''], ''environment_status'': False}'
        parameters:
        - description: Output of the plan_test_scope node containing high-level test
