dag_type: spec
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: A list of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: A list of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: A list of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: A list of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: Extract and summarize interface-level issues from integration
        test results, producing structured lists that identify failing component interactions,
        data exchange problems, and any contract violations.
      docstring:
        examples:
        - lines:
          - 'integration_results = {''interface_validation_results'': [''A-B contract
            violation: payload size mismatch''], ''data_exchange_issues'': [''payload
            type mismatch''], ''component_pairs'': [''A-B''], ''contract_violations'':
            [''payload size mismatch'']}'
          - analyze_integration_test_results(integration_results)
          output: '{''interface_failures'': [''Interface failure: A-B - contract violation:
            payload size mismatch''], ''component_pairs'': [''A-B''], ''data_exchange_issues'':
            [''payload type mismatch''], ''contract_violations'': [''payload size
            mismatch'']}'
        - lines:
          - 'integration_results = {''interface_validation_results'': [], ''data_exchange_issues'':
            [], ''component_pairs'': [], ''contract_violations'': []}'
          - analyze_integration_test_results(integration_results)
          output: '{''interface_failures'': [], ''component_pairs'': [], ''data_exchange_issues'':
            [], ''contract_violations'': []}'
        parameters:
        - description: Structured results from run_integration_tests, containing fields
            such as interface_validation_results, data_exchange_issues, component_pairs,
            and contract_violations.
          name: integration_test_results
          type: Dict[str, List[str]]
        raises:
        - description: If required keys are missing in the input dictionary.
          type: ValueError
        returns:
          description: 'Dictionary with four lists: interface_failures, component_pairs,
            data_exchange_issues, and contract_violations.'
          type: Dict[str, List[str]]
        summary: Analyze integration test results to produce a structured report of
          interface-level issues.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks by analyzing results from regression testing
      and surface actionable anomalies.
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered
      key: regression_summary
      type: str
    prd:
      conceptual_info: Parses regression test run outputs to extract concrete regression
        anomalies, encapsulating the feature-level impact and a succinct summary for
        triage and defect reporting.
      docstring:
        examples:
        - lines:
          - analyze_regression_test_results(
          - '  baseline_vs_actual_results=["FeatureA: 100ms -> 250ms"],'
          - '  state_drift_indicators=["FeatureA drift detected"],'
          - '  performance_metrics=["avg_latency_increase: 150ms"]'
          - )
          output: '[{''feature_name'': ''FeatureA'', ''before_after_state_comparison'':
            ''baseline 100ms; current 250ms'', ''impact_severity_estimation'': 8,
            ''regression_summary'': ''Significant latency regression observed for
            FeatureA.''}]'
        - lines:
          - analyze_regression_test_results(
          - '  baseline_vs_actual_results=["FeatureB: 200ms -> 290ms"],'
          - '  state_drift_indicators=["FeatureB drift"],'
          - '  performance_metrics=["throughput decline"]'
          - )
          output: '[{''feature_name'': ''FeatureB'', ''before_after_state_comparison'':
            ''before 200ms; after 290ms'', ''impact_severity_estimation'': 9, ''regression_summary'':
            ''Critical latency regression detected for FeatureB.''}]'
        parameters:
        - description: List of baseline vs actual results per regression scenario,
            derived from run_regression_tests.
          name: baseline_vs_actual_results
          type: List[str]
        - description: List of textual indicators signaling state drift or anomalies
            detected during regression tests.
          name: state_drift_indicators
          type: List[str]
        - description: List of performance-related metrics captured during regression
            testing.
          name: performance_metrics
          type: List[str]
        raises:
        - description: Raised if any input is not a list of strings or is None.
          type: TypeError
        - description: Raised if inputs are empty or no anomalies can be inferred.
          type: ValueError
        returns:
          description: A list of regression anomaly records, each with feature_name,
            before_after_state_comparison, impact_severity_estimation, and regression_summary.
          type: List[Dict[str, Union[str, int]]]
        summary: Analyze regression test results to extract structured regression
          anomalies with feature name, before/after state, impact, and a summary.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Aggregate testing anomalies from unit test results and create a defect
      summary table.
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g., high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Transform raw unit-test results into a concise defect-record
        suitable for defect triage. This node distills pass/fail signals and diffs
        from run_unit_tests into a single defect row that is consumed by report_defects.
      docstring:
        examples:
        - lines:
          - analyze_unit_test_results([False], ["expected 3, got 2"], ["2025-01-01
            10:00:00"])
          output: '{\''test_type\'': \''unit\'', \''component_info\'': \''Unknown\'',
            \''description\'': \''Unit test failure: expected 3, got 2\'', \''severity\'':
            \''high\'', \''reproduction_steps\'': \''Failed test at 2025-01-01 10:00:00;
            diff: expected 3, got 2\''}'
        - lines:
          - analyze_unit_test_results([True, True], ["", ""], ["2025-01-01 10:05:00","2025-01-01
            10:06:00"])
          output: '{\''test_type\'': \''unit\'', \''component_info\'': \''Unknown\'',
            \''description\'': \''No unit test anomalies detected.\'', \''severity\'':
            \''low\'', \''reproduction_steps\'': \''N/A\''}'
        parameters:
        - description: Pass/fail status for each unit test from run_unit_tests.
          name: test_execution_status
          type: List[bool]
        - description: Differences between actual and expected outputs for each test.
          name: actual_output_vs_expected_output
          type: List[str]
        - description: Timestamps for each test execution.
          name: test_case_timestamps
          type: List[str]
        raises:
        - description: If inputs are not lists or not of the expected element types.
          type: TypeError
        - description: If input lists have mismatched lengths.
          type: ValueError
        returns:
          description: 'A single defect summary record represented as a dictionary
            with keys: test_type, component_info, description, severity, reproduction_steps.'
          type: Dict[str, str]
        summary: Aggregate unit test anomalies and produce a single defect summary
          record.
    prompt: 'You are an analyzer that processes unit test results produced by run_unit_tests
      and generates a single defect-summary record suitable for inclusion in the defect
      report. Inputs to the function are: test_execution_status (List[bool]) indicating
      pass/fail for each unit test, actual_output_vs_expected_output (List[str]) containing
      diffs between actual and expected outputs for each test, and test_case_timestamps
      (List[str]) with timestamps of each test execution. The function should output
      a dictionary matching the node''s Output Structure with keys: test_type, component_info,
      description, severity, reproduction_steps. If no anomalies are detected, produce
      a single row with test_type = ''unit'', component_info as ''Unknown'', description
      = ''No unit test anomalies detected.'', severity = ''low'', reproduction_steps
      = ''N/A''. If anomalies exist, describe the first failing test or summarize
      the most severe issue, including test index, timestamp, and diff.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases.
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases.
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases.
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios.
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: Generates integration test scenarios for component interactions
        based on plan_test_scope inputs, producing structured artifacts ready for
        execution.
      docstring:
        examples:
        - lines:
          - design_integration_test_cases(
          - '    test_objectives=["Verify component handshake"],'
          - '    core_functionality_requirements=["A<->B data exchange"],'
          - '    edge_case_requirements=["latency spike"],'
          - '    performance_requirements=["latency < 150ms"]'
          - )
          output: '{"component_pairs": ["ComponentA-ComponentB"], "data_flow_paths":
            ["A -> B"], "dependency_validations": ["A requires B"], "integration_test_scenarios":
            ["Scenario 1: Handshake between A and B with latency constraint"]}'
        - lines:
          - design_integration_test_cases(
          - '    test_objectives=["End-to-end data integrity"],'
          - '    core_functionality_requirements=["ServiceX to ServiceY message passing"],'
          - '    edge_case_requirements=["out-of-order messages","partial data loss"],'
          - '    performance_requirements=["end-to-end latency < 200ms"]'
          - )
          output: '{"component_pairs": ["ServiceX-ServiceY"], "data_flow_paths": ["X
            -> Y"], "dependency_validations": ["X depends on Y"], "integration_test_scenarios":
            ["Scenario 2: End-to-end data flow under latency constraint"]}'
        parameters:
        - description: High-level test objectives guiding scenario generation.
          name: test_objectives
          type: List[str]
        - description: Core functionality requirements that must be validated.
          name: core_functionality_requirements
          type: List[str]
        - description: Edge-case considerations and failure modes to cover.
          name: edge_case_requirements
          type: List[str]
        - description: Performance criteria (latency, throughput) to satisfy.
          name: performance_requirements
          type: List[str]
        raises:
        - description: If any input list is None or empty or required plan inputs
            are missing.
          type: ValueError
        returns:
          description: 'Dictionary with keys: component_pairs, data_flow_paths, dependency_validations,
            integration_test_scenarios.'
          type: Dict[str, List[str]]
        summary: Generate integration test cases for component interactions given
          test scope inputs.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations. Use the test scope plan outputs
      (test_objectives, core_functionality_requirements, edge_case_requirements, performance_requirements)
      to guide scenario generation. Return four lists: component_pairs, data_flow_paths,
      dependency_validations, and integration_test_scenarios.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: 'This node generates regression test cases focused on unchanged/high-risk
        features identified from planning inputs. It outputs three parallel lists:
        the names of high-risk features to test, the precondition steps needed to
        reproduce stable baseline conditions for each scenario, and concise descriptions
        of the expected state preservation to validate regression integrity.'
      docstring:
        examples:
        - lines:
          - generate_regression_test_cases(plan_scope)
          output: '{''high_risk_features'': [''auth_token_refresh'', ''checkout_flow_timeout''],
            ''precondition_setup'': [''enable regression flag for feature set'', ''initialize
            baseline user data''], ''expected_state_preservation'': [''user_session
            remains valid'', ''shopping_cart contents unchanged'']}'
        - lines:
          - generate_regression_test_cases(plan_scope_variant)
          output: '{''high_risk_features'': [''session_timeout'', ''pricing_adjustments''],
            ''precondition_setup'': [''set deterministic clock'', ''reset test DB''],
            ''expected_state_preservation'': [''session_id unchanged'', ''order_record
            stable'']}'
        parameters:
        - description: Structured plan scope data produced by plan_test_scope, containing
            planning context (objectives, requirements, and risk context) used to
            select high-risk features for regression testing.
          name: plan_scope
          type: dict
        raises:
        - description: If plan_scope is missing required risk-context information
            or necessary keys to identify high-risk features.
          type: ValueError
        - description: If plan_scope is not a dict.
          type: TypeError
        returns:
          description: Dictionary with keys 'high_risk_features', 'precondition_setup',
            and 'expected_state_preservation', each a List[str].
          type: dict
        summary: Generate 3-5 regression test scenarios targeting high-risk features
          with precondition setup and expected state preservation.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for each test case
      key: test_id
      type: List[str]
    - description: List of input parameters required for each test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for each test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: Generates a compact set of unit test case templates to validate
        module-level behavior, aligning with plan_test_scope objectives and ensuring
        coverage of core functionality.
      docstring:
        examples:
        - lines:
          - 'design_unit_test_cases([''Core functionality: module import'', ''Edge
            case: empty input'', ''Performance: small dataset''])'
          output: '{''test_id'': [''TC-001'', ''TC-002'', ''TC-003'', ''TC-004'',
            ''TC-005''], ''input_parameters'': [''module_name: str'', ''input_data:
            dict''], ''expected_output'': [''Module imports successfully'', ''Raises
            error on empty input'', ''Handles small dataset within time limit'', ''Validates
            input schema'', ''Returns correct result'']}'
        - lines:
          - 'design_unit_test_cases([''Feature: arithmetic operations'', ''Edge: division
            by zero''])'
          output: '{''test_id'': [''TC-006'', ''TC-007'', ''TC-008''], ''input_parameters'':
            [''operation: str'', ''operands: tuple''], ''expected_output'': [''Addition/subtraction
            works'', ''Division by zero raises correct exception'', ''Overflow checks
            pass'']}'
        parameters:
        - description: Serialized outputs from plan_test_scope describing test objectives
            and coverage that guide test case generation.
          name: plan_scope_outputs
          type: List[str]
        raises:
        - description: If plan_scope_outputs is empty or not a list of strings.
          type: ValueError
        - description: If plan_scope_outputs contains non-string elements.
          type: TypeError
        returns:
          description: 'A dictionary containing three keys mapping to lists: ''test_id'',
            ''input_parameters'', and ''expected_output'', representing the generated
            unit test templates.'
          type: Dict[str, List[str]]
        summary: 'Function to generate 5–8 unit test case templates for module-level
          validation, producing three aligned lists: test IDs, input parameter descriptions,
          and expected outputs.'
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed.
      key: total_tests_executed
      type: int
    - description: Number of tests that passed.
      key: pass_count
      type: int
    - description: Defect density metric.
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10).
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: This node synthesizes a concise health summary of the test
        cycle by consuming defect summaries produced by report_defects and execution-level
        results from prior test runs. It computes total tests, successful tests, defect
        density, and a risk rating to convey overall quality and risk posture.
      docstring:
        examples:
        - lines:
          - 'defect_report_summary = ''{"defects": 3, "details": []}'''
          - 'execution_summary = ''{"tests_executed": 120, "passes": 117}'''
          - result = generate_test_report(defect_report_summary, execution_summary)
          output: '{''total_tests_executed'': 120, ''pass_count'': 117, ''defect_density'':
            0.025, ''risk_assessment_rating'': 6}'
        - lines:
          - 'defect_report_summary = ''{"defects": 0, "details": []}'''
          - 'execution_summary = ''{"tests_executed": 80, "passes": 80}'''
          - result = generate_test_report(defect_report_summary, execution_summary)
          output: '{''total_tests_executed'': 80, ''pass_count'': 80, ''defect_density'':
            0.0, ''risk_assessment_rating'': 2}'
        parameters:
        - description: Serialized defect summary produced by report_defects (e.g.,
            JSON string).
          name: defect_report_summary
          type: str
        - description: Serialized execution results summary (e.g., JSON string) with
            total, passes, and optional failures.
          name: execution_summary
          type: str
        raises:
        - description: If inputs are not valid JSON or required fields are missing.
          type: ValueError
        - description: If input types do not conform to expected string inputs.
          type: TypeError
        returns:
          description: 'Dictionary containing the computed metrics: total_tests_executed
            (int), pass_count (int), defect_density (float), risk_assessment_rating
            (int).'
          type: Dict[str, Any]
        summary: Compute a compact test execution summary from defect data and test
          execution outcomes.
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: Define comprehensive test scope by outlining objectives and
        coverage across functional, edge, and performance dimensions for the software
        under test.
      docstring:
        examples:
        - lines:
          - 'plan_test_scope({''software_domain'': ''Web API'', ''version'': ''1.2''})'
          output: '{"test_objectives":["Ensure core functionality is validated end-to-end","Cover
            edge cases including null inputs and boundary conditions","Assess performance
            under peak load"],"core_functionality_requirements":["All primary user
            flows execute without error","APIs respond with correct status codes and
            payloads"],"edge_case_requirements":["Null inputs handled gracefully","Boundary
            conditions tested","Concurrent access behavior validated"],"performance_requirements":["Average
            response time <= 250ms under baseline load","Throughput meets defined
            target at peak load"]}'
        parameters:
        - description: Structured context or free-form description describing the
            software under test and project constraints.
          name: inputs
          type: dict
        raises:
        - description: If inputs is not a dict or missing required context.
          type: ValueError
        returns:
          description: 'Dictionary containing four lists that define the test scope:
            test_objectives, core_functionality_requirements, edge_case_requirements,
            performance_requirements.'
          type: dict
        summary: Plan test scope by generating structured test objectives and coverage
          requirements.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit, integration, or regression)
      key: test_type
      type: str
    - description: Component information related to the defect
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Consolidates defect findings from unit, integration, and regression
        testing into a single, normalized defect summary table suitable for reporting
        and risk assessment. Enables quick triage and traceability to specific test
        types and components.
      docstring:
        examples:
        - lines:
          - unit_results = [
          - '    {''test_type'': ''unit'', ''component_info'': ''AuthService'', ''description'':
            ''Null pointer on login'', ''severity'': ''high'', ''reproduction_steps'':
            ''Invoke login with empty password''},'
          - ']'
          - integration_results = []
          - regression_results = []
          - report_defects(unit_results, integration_results, regression_results)
          output: '[{''test_type'': ''unit'', ''component_info'': ''AuthService'',
            ''description'': ''Null pointer on login'', ''severity'': ''high'', ''reproduction_steps'':
            ''Invoke login with empty password''}]'
        - lines:
          - unit_results = [
          - '    {''test_type'': ''unit'', ''component_info'': ''AuthService'', ''description'':
            ''Null pointer on login'', ''severity'': ''High'', ''reproduction_steps'':
            ''Click login with invalid credentials''},'
          - '    {''test_type'': ''unit'', ''component_info'': ''UserService'', ''description'':
            ''Timeout on user fetch'', ''severity'': ''Medium'', ''reproduction_steps'':
            ''Fetch user details repeatedly until timeout''}'
          - ']'
          - integration_results = [
          - '    {''test_type'': ''integration'', ''component_info'': ''API Gateway
            -> User Service'', ''description'': ''Mismatch in data contract'', ''severity'':
            ''High'', ''reproduction_steps'': ''Call API with payload X''},'
          - ']'
          - regression_results = []
          - report_defects(unit_results, integration_results, regression_results)
          output: '[{''test_type'': ''unit'', ''component_info'': ''AuthService'',
            ''description'': ''Null pointer on login'', ''severity'': ''High'', ''reproduction_steps'':
            ''Click login with invalid credentials''}, {''test_type'': ''unit'', ''component_info'':
            ''UserService'', ''description'': ''Timeout on user fetch'', ''severity'':
            ''Medium'', ''reproduction_steps'': ''Fetch user details repeatedly until
            timeout''}, {''test_type'': ''integration'', ''component_info'': ''API
            Gateway -> User Service'', ''description'': ''Mismatch in data contract'',
            ''severity'': ''High'', ''reproduction_steps'': ''Call API with payload
            X''}]'
        parameters:
        - description: 'Defect records produced by analyze_unit_test_results. Each
            dict should contain keys: test_type, component_info, description, severity,
            reproduction_steps.'
          name: unit_results
          type: List[Dict[str, str]]
        - description: 'Defect records produced by analyze_integration_test_results.
            Each dict should contain keys: test_type, component_info, description,
            severity, reproduction_steps.'
          name: integration_results
          type: List[Dict[str, str]]
        - description: 'Defect records produced by analyze_regression_test_results.
            Each dict should contain keys: test_type, component_info, description,
            severity, reproduction_steps.'
          name: regression_results
          type: List[Dict[str, str]]
        raises:
        - description: If any input is not a list of dictionaries with the required
            keys, or if the combined dataset is empty without a default fallback.
          type: ValueError
        - description: If inputs are provided but are not lists.
          type: TypeError
        returns:
          description: 'A list of defect records, each with keys: test_type, component_info,
            description, severity, reproduction_steps.'
          type: List[Dict[str, str]]
