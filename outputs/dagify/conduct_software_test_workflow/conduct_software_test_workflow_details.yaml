dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: List of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: List of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: List of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: List of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: Analyze integration test results to identify interface-level
        issues and extract relevant data.
      docstring:
        examples:
        - lines:
          - 'integration_test_results = {''component_pairs'': [...], ''data_exchange_issues'':
            [...], ''interface_failures'': [...]}'
          output: '{''interface_failures'': [...], ''component_pairs'': [...], ''data_exchange_issues'':
            [...], ''contract_violations'': [...]}'
        parameters:
        - description: Input logs from integration test execution.
          name: test_logs
          type: PrimitiveType.LIST_STR
        raises:
        - description: If input test logs are missing or corrupted.
          type: ValueError
        returns:
          description: A dictionary containing interface failures, component pairs,
            data exchange issues, and contract violations.
          type: PrimitiveType.DICT
        summary: Analyze interface failures extracted from integration test results.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks.
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies.
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions.
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value.
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered.
      key: regression_summary
      type: str
    prd:
      conceptual_info: Analysis of regression test results to identify potential risks
        and anomalies.
      docstring:
        examples:
        - lines:
          - 'analyze_regression_test_results([{''feature'': ''Feature A'', ''before'':
            ''Before State'', ''after'': ''After State'', ''impact'': 5}])'
          output: '{''feature_name'': ''Feature A'', ''before_after_state_comparison'':
            ''Before State -> After State'', ''impact_severity_estimation'': 5, ''regression_summary'':
            ''Regression issues encountered''}'
        parameters:
        - description: List of test results from regression tests.
          name: input_results
          type: list
        raises:
        - description: If input_results is not a list.
          type: TypeError
        returns:
          description: A dictionary containing the feature name, before/after state
            comparison, impact severity estimation, and regression summary.
          type: dict
        summary: Identifies regression risks by analyzing test results.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Identify unit-level anomalies
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: The name of the test case that failed
      key: test_case_name
      type: str
    - description: The actual output of the test case that failed
      key: actual_output
      type: str
    - description: A suggested root cause of the failure from an implementation perspective
      key: suggested_root_cause
      type: str
    - description: The type of test that failed
      key: test_type
      type: str
    - description: A list of test cases that passed
      key: passed_tests
      type: str
    - description: A list of test cases that failed
      key: failed_tests
      type: str
    prd:
      conceptual_info: This node identifies unit-level anomalies by analyzing test
        failures.
      docstring:
        examples:
        - lines:
          - test_execution_status = [True, False, True]
          - actual_output_vs_expected_output = ['expected', 'actual', 'expected']
          - test_case_timestamps = ['timestamp1', 'timestamp2', 'timestamp3']
          - analyze_unit_test_results(test_execution_status, actual_output_vs_expected_output,
            test_case_timestamps)
          output: '{"test_case_name": "test_case1", "actual_output": "actual_output1",
            "suggested_root_cause": "root_cause1", "test_type": "unit_test", "passed_tests":
            "test_case1", "failed_tests": "test_case2", "test_case_name2": "test_case3",
            "actual_output2": "actual_output3", "suggested_root_cause2": "root_cause2",
            "test_type2": "unit_test2", "passed_tests2": "test_case3", "failed_tests2":
            "test_case4"}'
        - lines:
          - test_execution_status = [False, False, False]
          - actual_output_vs_expected_output = ['actual', 'actual', 'actual']
          - test_case_timestamps = ['timestamp1', 'timestamp2', 'timestamp3']
          - analyze_unit_test_results(test_execution_status, actual_output_vs_expected_output,
            test_case_timestamps)
          output: '{"test_case_name": "test_case1", "actual_output": "actual_output1",
            "suggested_root_cause": "root_cause1", "test_type": "unit_test", "passed_tests":
            "", "failed_tests": "test_case1, test_case2, test_case3"}'
        parameters:
        - description: Pass/fail status of each test case
          name: test_execution_status
          type: list[bool]
        - description: Difference between actual and expected output of each test
            case
          name: actual_output_vs_expected_output
          type: list[str]
        - description: Timestamps for each test execution
          name: test_case_timestamps
          type: list[str]
        raises:
        - description: If a test case is not found in the input results
          type: KeyError
        returns:
          description: A dictionary with keys test_case_name, actual_output, suggested_root_cause,
            test_type, passed_tests, and failed_tests.
          type: dict[str, PrimitiveType]
        summary: Analyzes test failure results to identify unit-level issues.
    prompt: 'List all test failures with: 1) Test case name, 2) Actual output, 3)
      Suggested root cause from implementation perspective.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: Design integration test cases for the software under test.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Test objective 1', 'Test objective 2', 'Test objective
            3']
          - component_pairs, data_flow_paths, dependency_validations, integration_test_scenarios
            = design_integration_test_cases(test_objectives)
          output: '{''component_pairs'': [''Component pair 1'', ''Component pair 2''],
            ''data_flow_paths'': [''Data flow path 1'', ''Data flow path 2''], ''dependency_validations'':
            [''Dependency validation 1'', ''Dependency validation 2''], ''integration_test_scenarios'':
            [''Integration test scenario 1'', ''Integration test scenario 2'']}'
        parameters: []
        raises:
        - description: If the test objectives are not provided or are invalid.
          type: ValueError
        returns:
          description: A dictionary containing the component pairs, data flow paths,
            dependency validations, and integration test scenarios.
          type: Dict[str, str]
        summary: Design and generate integration test cases based on the provided
          test objectives and coverage requirements.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: Create regression test cases for unchanged features validation
        by identifying high-risk features, defining precondition setup, and expected
        state preservation.
      docstring:
        examples:
        - lines:
          - "plan_test_scope_node = {'test_objectives': ['core_functionality', 'edge_cases'],\
            \ 'core_functionality_requirements': ['req1', 'req2'], 'edge_case_requirements':\
            \ ['requirement1'], 'performance_requirements': ['perf_req1']} \ndesign_regression_test_cases(plan_test_scope_node)"
          output: '{''high_risk_features'': [''core_functionality'', ''edge_cases''],
            ''precondition_setup'': [''requirement1'', ''req2''], ''expected_state_preservation'':
            [''perf_req1'']}'
        parameters:
        - description: Output of `plan_test_scope` node containing test objectives
            and coverage requirements.
          name: plan_test_scope
          type: dict
        raises:
        - description: If input `plan_test_scope` is empty or malformed.
          type: ValueError
        returns:
          description: Regression test cases for unchanged features validation.
          type: dict
        summary: Design regression test cases for unchanged features validation.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for each test case
      key: test_id
      type: str
    - description: List of input parameters required for each test case
      key: input_parameters
      type: str
    - description: Expected output values for each test case
      key: expected_output
      type: str
    prd:
      conceptual_info: Design unit test cases that validate the functionality of core
        components.
      docstring:
        examples:
        - lines:
          - test_case_templates = design_unit_test_cases(core_functionality_requirements)
          - print(test_case_templates)
          output: '{''test_1'': {''input_params'': [''param_1'', ''param_2''], ''expected_output'':
            [''output_1'', ''output_2'']}'
        - lines:
          - test_case_templates = design_unit_test_cases(core_functionality_requirements)
          - print(test_case_templates['test_2']['input_params'])
          output: '[''param_3'', ''param_4'']'
        parameters:
        - description: List of core functionality requirements from the test scope
            plan
          name: core_functionality_requirements
          type: list[str]
        raises:
        - description: If core_functionality_requirements is invalid or incomplete
          type: ValueError
        returns:
          description: A dictionary of unit test case templates with test ID, input
            parameters, and expected output
          type: dict[str, str]
        summary: Generates unit test templates for core functional components.
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: This node compiles test results summary from aggregated defect
        report.
      docstring:
        examples:
        - lines:
          - 'def generate_test_report(report_defects_output):'
          - '    return report_defects_output[''total_tests_executed''],'
          - '           report_defects_output[''pass_count''],'
          - '           report_defects_output[''defect_density''],'
          - '           report_defects_output[''risk_assessment_rating'']'
          output: '{''total_tests_executed'': 100, ''pass_count'': 80, ''defect_density'':
            0.2, ''risk_assessment_rating'': 7}'
        parameters: []
        raises:
        - description: If report_defects output is invalid
          type: ValueError
        returns:
          description: A dictionary containing total tests executed, pass/fail counts,
            defect density, and risk assessment rating.
          type: '{''total_tests_executed'': int, ''pass_count'': int, ''defect_density'':
            float, ''risk_assessment_rating'': int}'
        summary: This function aggregates test results and returns a summary with
          total tests executed, pass/fail counts, defect density, and risk assessment
          rating.
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: This node aggregates testing anomalies from unit, integration,
        and regression tests.
      docstring:
        examples:
        - lines:
          - report_defects(analyze_unit_test_results(), analyze_integration_test_results(),
            analyze_regression_test_results())
          output: '{"test_type": "unit", "component_info": "comp1", "description":
            "desc1", "severity": "high", "reproduction_steps": "steps1"}'
        - lines:
          - report_defects(analyze_unit_test_results(), analyze_integration_test_results(),
            analyze_regression_test_results())
          output: '{"test_type": "integration", "component_info": "comp2", "description":
            "desc2", "severity": "medium", "reproduction_steps": "steps2"}'
        parameters: []
        raises: []
        returns:
          description: 'Defect summary table with columns: Test Type, Component, Description,
            Severity, Reproduction Steps.'
          type: dict
        summary: Report defects by aggregating testing anomalies.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: Execute integration test scenarios and document communication
        logs and interface validation outcomes.
      docstring:
        examples:
        - lines:
          - integration_test_scenarios = design_integration_test_cases();
          - setup_settings = setup_test_environment();
          - run_integration_tests(integration_test_scenarios, setup_settings)
          output: "{\n  'communication_logs': [...],\n  'interface_validation_results':\
            \ [...],\n  'test_scenario_ids': [...] \n}"
        parameters:
        - description: List of integration test scenarios created through design
          name: design_integration_test_cases
          type: List[dict]
        - description: Prepared test environment settings
          name: setup_test_environment
          type: dict
        raises:
        - description: Raised when integration test scenario creation or execution
            fails
          type: Exception
        returns:
          description: Output result containing communication logs, interface validation
            outcomes, and test scenario identifiers
          type: dict
        summary: Execute integration test scenarios and produce test outcome reports.
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: This node orchestrates the execution of regression test scenarios
      for unchanged features, collecting baseline vs actual results, state drift indicators,
      and performance metrics. It depends on predefined test cases and a prepared
      test environment to validate feature stability over time.
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of results comparing baseline metrics versus current actual
        results for each regression scenario.
      key: baseline_vs_actual_results
      type: List[str]
    - description: Indicators signaling any detected state drift during regression
        tests, such as deviations or anomalies.
      key: state_drift_indicators
      type: List[str]
    - description: Various performance metrics recorded during regression testing,
        such as response times and throughput.
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: This node automates the execution of regression test scenarios
        for unchanged features, capturing key performance and stability metrics to
        monitor for regressions and drift over time.
      docstring:
        examples:
        - lines:
          - results = run_regression_tests(test_cases, environment)
          - print(results['baseline_vs_actual_results'])
          - print(results['state_drift_indicators'])
          - print(results['performance_metrics'])
          output: "{\n  'baseline_vs_actual_results': ['Scenario 1: Pass', 'Scenario\
            \ 2: Pass'],\n  'state_drift_indicators': ['No drift detected'],\n  'performance_metrics':\
            \ ['Avg. response time: 120ms', 'Throughput: 200 req/sec']\n}"
        - lines:
          - regression_results = run_regression_tests(regression_test_cases, env_config)
          output: "{\n  'baseline_vs_actual_results': ['Login feature: OK vs OK'],\n\
            \  'state_drift_indicators': ['No deviation'],\n  'performance_metrics':\
            \ ['Response time: 115ms']\n}"
        parameters:
        - description: Input list of test case identifiers or configurations created
            for regression validation.
          name: design_regression_test_cases
          type: List[str]
        - description: Configuration details of the test environment including hardware,
            software, data, and mock services.
          name: setup_test_environment
          type: dict
        raises:
        - description: If execution of test scenarios fails or times out.
          type: RuntimeError
        - description: If input test cases or environment configurations are invalid
            or missing.
          type: ValueError
        returns:
          description: A dictionary with keys 'baseline_vs_actual_results', 'state_drift_indicators',
            and 'performance_metrics', each containing a list of strings with recorded
            outcomes.
          type: dict
        summary: Runs defined regression test scenarios to verify feature stability
          and performance metrics, recording baseline comparisons and drift indicators.
    prompt: Execute regression scenarios and record results
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: List[bool]
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: List[str]
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: List[str]
    prd:
      conceptual_info: This node executes module-level test cases and records pass/fail
        status, actual output versus expected output, and timestamps for each test
        execution.
      docstring:
        examples:
        - lines:
          - unit_test_cases = ['case1', 'case2', 'case3']
          - setup_environment()
          - execute_unit_tests(unit_test_cases)
          output: '{''test_execution_status'': [True, False, True], ''actual_output_vs_expected_output'':
            [''match1'', ''mismatch2'', ''match3''], ''test_case_timestamps'': [''2022-01-01
            12:00:00'', ''2022-01-01 12:05:00'', ''2022-01-01 12:10:00'']}'
        parameters: []
        raises:
        - description: If test cases are not properly designed or environment is not
            set up correctly.
          type: ValueError
        returns:
          description: A dictionary with test_execution_status, actual_output_vs_expected_output,
            and test_case_timestamps as keys and their respective values as values.
          type: Dict[str, List[bool]]
        summary: Execute unit test cases and record pass/fail status, actual output
          versus expected output, and timestamps for each test execution.
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing.
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing.
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing.
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing.
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up.
      key: environment_status
      type: bool
    prd:
      conceptual_info: Prepare testing infrastructure and dependencies by listing
        necessary hardware specs, software specs, test data sets, and mock services.
      docstring:
        examples:
        - lines:
          - 'setup_test_environment(plan_test_scope={''test_objectives'': [''object1'',
            ''object2''], ''core_functionality_requirements'': [''req1'', ''req2''],
            ''edge_case_requirements'': [''case1'', ''case2''], ''performance_requirements'':
            [''perf1'', ''perf2'']})'
          output: '{''hardware_specs'': [''hw1'', ''hw2''], ''software_specs'': [''sw1'',
            ''sw2''], ''test_data_sets'': [''ts1'', ''ts2''], ''mock_services'': [''ms1'',
            ''ms2''], ''environment_status'': True}'
        parameters: []
        raises: []
        returns:
          description: Dictionary containing hardware specs, software specs, test
            data sets, mock services, and environment status.
          type: dict
        summary: Set up test environment based on plan_test_scope output.
    prompt: 'List 3-5 environment requirements: hardware/software specs, test data
      sets, mock services needed for testing.'
  sign_off_test_cycle:
    agent: false
    description: Compile test results summary
    name: sign_off_test_cycle
    nodes_depended_on:
    - generate_test_report
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Number of tests that failed
      key: fail_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
