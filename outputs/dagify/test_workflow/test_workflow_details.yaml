          type: ValueError
        - description: Raised if an unexpected error occurs while executing tests.
          type: RuntimeError
        returns:
          description: 'A dictionary containing the end‑to‑end test metrics: total_test_cases,
            passed_test_cases, failed_test_cases, pass_rate_percentage, critical_failure_detected,
            average_response_time_ms, performance_metrics_ms, and error_messages.'
          type: dict
        summary: Execute end‑to‑end tests that simulate user journeys through the
          entire system, reporting pass/fail counts, critical failures, and performance
          metrics.
    prompt: Run end-to-end tests simulating user journeys through the complete system.Validate
      workflow integrity and performance characteristics.
  unit_test_suite:
    agent: false
    description: Execute unit tests for core components
    name: unit_test_suite
    nodes_depended_on:
    - create_test_environment
    - generate_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Total number of unit tests executed
      key: total_tests
      type: int
    - description: Number of tests that passed
      key: passed_tests
      type: int
    - description: Number of tests that failed
      key: failed_tests
      type: int
    - description: Code coverage percentage achieved by the unit test run
      key: coverage_percent
      type: float
    - description: Names or identifiers of the tests that failed
      key: failed_test_names
      type: List[str]
    - description: Error or exception messages associated with each failed test
      key: error_messages
      type: List[str]
    - description: 'Overall success flag: true if all tests passed and coverage meets
        required threshold'
      key: is_successful
      type: bool
    prd:
      conceptual_info: Runs the complete unit‑test suite for the core codebase, aggregates
        results, measures coverage, and determines overall success based on pass count
        and a configurable coverage threshold.
      docstring:
        examples:
        - lines:
          - result = unit_test_suite(
          - '    env_ready=True,'
          - '    test_data_paths=[''/tmp/data1.json'', ''/tmp/data2.json''],'
          - '    coverage_threshold=85.0'
          - )
          output: "{\n  'total_tests': 120,\n  'passed_tests': 118,\n  'failed_tests':\
            \ 2,\n  'coverage_percent': 87.3,\n  'failed_test_names': ['test_calc_edge',\
            \ 'test_invalid_input'],\n  'error_messages': ['AssertionError in test_calc_edge',\
            \ 'ValueError in test_invalid_input'],\n  'is_successful': True\n}"
        - lines:
          - unit_test_suite(False, [], 80.0)
          output: 'RuntimeError: Test environment is not ready.'
        parameters:
        - description: Flag indicating that the test environment is ready (output
            of `create_test_environment`).
          name: env_ready
          type: bool
        - description: File system paths to synthetic test data files produced by
            `generate_test_data`.
          name: test_data_paths
          type: List[str]
        - description: Minimum acceptable code coverage percentage (e.g., 80.0).
          name: coverage_threshold
          type: float
        raises:
        - description: If the test environment is not ready (`env_ready` is False).
          type: RuntimeError
        - description: If any path in `test_data_paths` does not exist.
          type: FileNotFoundError
        - description: If `coverage_threshold` is not between 0 and 100.
          type: ValueError
        returns:
          description: Dictionary containing keys `total_tests`, `passed_tests`, `failed_tests`,
            `coverage_percent`, `failed_test_names`, `error_messages`, and `is_successful`
            as defined in the node's output structure.
          type: dict
        summary: Execute all unit tests, compute coverage, and return a structured
          result summary.
    prompt: Run all unit tests to verify individual functions and methods. Focus on
      code coverage, boundary conditions, and error path coverage.
