          name: environment_ready
          type: bool
        - description: Names of packages installed during environment setup.
          name: installed_packages
          type: List[str]
        - description: Names of testing frameworks (e.g., pytest, unittest) configured
            for the suite.
          name: frameworks_configured
          type: List[str]
        - description: Human‑readable status strings for each service that was started.
          name: services_status
          type: List[str]
        - description: Detailed health‑check output for each component of the test
            environment.
          name: health_check_messages
          type: List[str]
        - description: File system paths to the synthetic test data files generated
            by generate_test_data.
          name: data_file_paths
          type: List[str]
        - description: Total number of records across all data files.
          name: total_records
          type: int
        - description: Whether the dataset contains explicitly crafted edge‑case records.
          name: includes_edge_cases
          type: bool
        - description: Brief description of the data schema (field names and types).
          name: schema_description
          type: str
        - description: Number of intentionally invalid or malformed records for negative
