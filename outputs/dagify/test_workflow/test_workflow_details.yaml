dag_type: spec
description: Generated workflow from UI.
name: test_workflow
nodes:
  acceptance_test_suite:
    agent: false
    description: Verify business rule compliance
    name: acceptance_test_suite
    nodes_depended_on:
    - create_test_environment
    - generate_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers or names of the acceptance test cases that were run.
      key: executed_test_cases
      type: List[str]
    - description: List of test case identifiers that passed the acceptance criteria.
      key: passed_test_cases
      type: List[str]
    - description: List of test case identifiers that failed the acceptance criteria.
      key: failed_test_cases
      type: List[str]
    - description: Overall result indicating whether all acceptance criteria were
        satisfied.
      key: overall_pass
      type: bool
    - description: Proportion of passed test cases expressed as a value between 0
        and 1.
      key: pass_rate
      type: float
    - description: Brief textual summary of any defects or issues discovered during
        acceptance testing.
      key: defect_summary
      type: str
    prd:
      conceptual_info: Runs the Acceptance Test Suite after the test environment and
        synthetic data are prepared. It executes business‑rule‑level test cases, evaluates
        each against acceptance criteria, and produces a concise execution summary
        for downstream aggregation.
      docstring:
        examples:
        - lines:
          - result = acceptance_test_suite(
          - '    environment_ready=True,'
          - '    test_data_paths=[''/tmp/data1.json'', ''/tmp/data2.json''],'
          - '    test_cases_definition=['
          - '        {''id'': ''A1'', ''description'': ''Verify login'', ''expected_result'':
            ''success''},'
          - '        {''id'': ''A2'', ''description'': ''Reject invalid email'', ''expected_result'':
            ''error''}'
          - '    ]'
          - )
          output: "{\n  'executed_test_cases': ['A1', 'A2'],\n  'passed_test_cases':\
            \ ['A1'],\n  'failed_test_cases': ['A2'],\n  'overall_pass': False,\n\
            \  'pass_rate': 0.5,\n  'defect_summary': 'A2 failed: system returned\
            \ success for invalid email.'\n}"
        - lines:
          - acceptance_test_suite(True, ['/tmp/data.json'], [{'id':'B1','description':'Check
            checkout','expected_result':'success'}])
          output: '{''executed_test_cases'': [''B1''], ''passed_test_cases'': [''B1''],
            ''failed_test_cases'': [], ''overall_pass'': True, ''pass_rate'': 1.0,
            ''defect_summary'': ''''}'
        parameters:
        - description: Flag from `create_test_environment` indicating the test environment
            is healthy and ready.
          name: environment_ready
          type: bool
        - description: List of file system paths to the generated test data files
            from `generate_test_data`.
          name: test_data_paths
          type: List[str]
        - description: 'Structured definitions of acceptance test cases (e.g., {''id'':
            ''TC01'', ''description'': ..., ''expected_result'': ...}).'
          name: test_cases_definition
          type: List[dict]
        raises:
        - description: If `environment_ready` is False, indicating the environment
            cannot run tests.
          type: RuntimeError
        - description: If any path in `test_data_paths` does not exist or is unreadable.
          type: FileNotFoundError
        - description: If `test_cases_definition` is empty or malformed.
          type: ValueError
        returns:
          description: A dictionary containing execution lists, pass/fail aggregates,
            pass rate, and a defect summary matching the node's output_structure.
          type: dict
        summary: Execute acceptance tests and return detailed results summarizing
          compliance with business rules and user acceptance criteria.
    prompt: Execute tests ensuring system behavior aligns with business requirements
      and user acceptance criteria for functional and non-functional specifications.
  aggregate_test_results:
    agent: false
    description: Compile and analyze test outcomes from all test suites, producing
      a unified view of pass/fail metrics, failure diagnostics, false‑positive detection,
      and performance insights.
    name: aggregate_test_results
    nodes_depended_on:
    - unit_test_suite
    - integration_test_suite
    - system_test_suite
    - acceptance_test_suite
    nodes_dependent_on: []
    output_structure:
    - description: Total number of test cases executed across all suites
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: passed_tests_count
      type: int
    - description: Number of tests that failed
      key: failed_tests_count
      type: int
    - description: Names or identifiers of tests that failed
      key: failed_test_names
      type: List[str]
    - description: Brief description of the reason for each failure
      key: failure_reasons
      type: List[str]
    - description: List of tests identified as false positives
      key: false_positive_tests
      type: List[str]
    - description: Descriptions of identified performance bottlenecks
      key: performance_bottlenecks
      type: List[str]
    - description: Average execution time of all tests in seconds
      key: average_execution_time_seconds
      type: float
    - description: Pass rate expressed as a proportion (0.0 - 1.0)
      key: overall_pass_rate
      type: float
    - description: Human‑readable summary of the aggregated test results
      key: summary_report
      type: str
    prd:
      conceptual_info: The node consolidates raw results from unit, integration, system,
        and acceptance test suites into a single, analytics‑rich report. It quantifies
        overall quality, surfaces recurring failures, filters out false positives,
        and highlights performance hot‑spots to support decision‑making and downstream
        documentation generation.
      docstring:
        examples:
        - lines:
          - unit_results = {
          - '    ''total_tests'': 120,'
          - '    ''passed_tests'': 115,'
          - '    ''failed_tests'': 5,'
          - '    ''failed_test_names'': [''utils.test_add'', ''db.test_connection''],'
          - '    ''error_messages'': [''AssertionError'', ''TimeoutError''],'
          - '    ''is_successful'': False'
          - '}'
          - integration_results = {
          - '    ''executed_test_cases'': [''api.login'', ''api.logout''],'
          - '    ''passed_test_cases'': [''api.login''],'
          - '    ''failed_test_cases'': [''api.logout''],'
          - '    ''overall_success'': False,'
          - '    ''execution_time_seconds'': 42.7,'
          - '    ''error_messages'': [''500 Internal Server Error'']'
          - '}'
          - system_results = {
          - '    ''total_test_cases'': 30,'
          - '    ''passed_test_cases'': 28,'
          - '    ''failed_test_cases'': 2,'
          - '    ''pass_rate_percentage'': 93.33,'
          - '    ''critical_failure_detected'': False,'
          - '    ''average_response_time_ms'': 210.5,'
          - '    ''performance_metrics_ms'': [200, 215, 210],'
          - '    ''error_messages'': [''UI element not found'']'
          - '}'
          - acceptance_results = {
          - '    ''executed_test_cases'': [''login_flow'', ''checkout_flow''],'
          - '    ''passed_test_cases'': [''login_flow''],'
          - '    ''failed_test_cases'': [''checkout_flow''],'
          - '    ''overall_pass'': False,'
          - '    ''pass_rate'': 0.5,'
          - '    ''defect_summary'': ''Checkout fails on discount code.'''
          - '}'
          - report = aggregate_test_results(
          - '    unit_results, integration_results, system_results, acceptance_results'
          - )
          - print(report['summary_report'])
          output: '"Total tests executed: 182\nPassed: 144 (79.12%)\nFailed: 38 (20.88%)\nFailures:
            utils.test_add (AssertionError), db.test_connection (TimeoutError), api.logout
            (500 Internal Server Error), UI element not found, checkout_flow (business
            rule violation)\nFalse positives: []\nPerformance bottlenecks: average
            response time 0.21 s (system tests)\nOverall pass rate: 0.7912"'
        parameters:
        - description: Output dictionary from `unit_test_suite` containing total_tests,
            passed_tests, failed_tests, failed_test_names, error_messages, and is_successful.
          name: unit_results
          type: dict
        - description: Output dictionary from `integration_test_suite` containing
            executed_test_cases, passed_test_cases, failed_test_cases, overall_success,
            execution_time_seconds, and error_messages.
          name: integration_results
          type: dict
        - description: Output dictionary from `system_test_suite` containing total_test_cases,
            passed_test_cases, failed_test_cases, pass_rate_percentage, critical_failure_detected,
            average_response_time_ms, performance_metrics_ms, and error_messages.
          name: system_results
          type: dict
        - description: Output dictionary from `acceptance_test_suite` containing executed_test_cases,
            passed_test_cases, failed_test_cases, overall_pass, pass_rate, and defect_summary.
          name: acceptance_results
          type: dict
        raises:
        - description: If any input dictionary is missing required keys or contains
            non‑numeric counts that prevent aggregation.
          type: ValueError
        - description: If the function cannot compute average execution time due to
            zero total tests.
          type: RuntimeError
        returns:
          description: Aggregated test report matching the node's output_structure;
            keys are the field names listed above.
          type: dict
        summary: Aggregate results from all test suites, compute overall metrics,
          and generate a diagnostic summary.
    prompt: Merge test execution reports into structured results. Identify failure
      patterns, false positives, and performance bottlenecks with clear categorization.
  compile_test_documentation:
    agent: false
    description: Create formal test records by transforming aggregated test results
      into a structured documentation artifact that conforms to the organization’s
      reporting template.
    name: compile_test_documentation
    nodes_depended_on:
    - aggregate_test_results
    nodes_dependent_on: []
    output_structure:
    - description: File system path where the compiled test documentation is saved
      key: documentation_file_path
      type: str
    - description: List of top‑level sections included in the documentation (e.g.,
        Test Plan, Test Cases, Setup Procedures, Results, Conclusions)
      key: document_sections
      type: List[str]
    - description: Number of individual test cases that are described in the documentation
      key: total_test_cases_documented
      type: int
    - description: Indicates whether a concise execution summary (pass/fail counts,
        defects, performance metrics) is included
      key: has_execution_summary
      type: bool
    - description: True if the documentation meets the predefined reporting template
        and quality criteria
      key: compliance_indicator
      type: bool
    prd:
      conceptual_info: This node consumes the aggregated test result summary and produces
        a formal, template‑compliant documentation package that records the test plan,
        individual test cases, setup steps, execution summary and conclusions, ready
        for audit and stakeholder review.
      docstring:
        examples:
        - lines:
          - aggregated = {
          - '    ''total_tests_executed'': 120,'
          - '    ''passed_tests_count'': 110,'
          - '    ''failed_tests_count'': 10,'
          - '    ''failed_test_names'': [''test_login_invalid'', ''test_payment_timeout''],'
          - '    ''failure_reasons'': [''Invalid credentials'', ''Response timeout''],'
          - '    ''false_positive_tests'': [],'
          - '    ''performance_bottlenecks'': [''login service latency''],'
          - '    ''average_execution_time_seconds'': 1.8,'
          - '    ''overall_pass_rate'': 0.9167,'
          - '    ''summary_report'': ''All suites executed successfully with 8.3%
            failure rate.'''
          - '}'
          - doc_info = compile_test_documentation(aggregated)
          output: "{\n  'documentation_file_path': '/tmp/test_documentation_v1.pdf',\n\
            \  'document_sections': ['Test Plan', 'Test Cases', 'Setup Procedures',\
            \ 'Results', 'Conclusions'],\n  'total_test_cases_documented': 120,\n\
            \  'has_execution_summary': True,\n  'compliance_indicator': True\n}"
        - lines:
          - '# Missing required key triggers a ValueError'
          - 'compile_test_documentation({ ''passed_tests_count'': 5 })'
          output: 'ValueError: aggregated_results missing required key ''total_tests_executed'''
        parameters:
        - description: Dictionary produced by `aggregate_test_results` containing
            overall test metrics such as total_tests_executed, passed_tests_count,
            failed_tests_count, failed_test_names, failure_reasons, false_positive_tests,
            performance_bottlenecks, average_execution_time_seconds, overall_pass_rate,
            and summary_report.
          name: aggregated_results
          type: dict
        raises:
        - description: If `aggregated_results` is missing required keys or contains
            incompatible data types.
          type: ValueError
        - description: If the documentation file cannot be written to the target location.
          type: IOError
        returns:
          description: Dictionary with keys `documentation_file_path`, `document_sections`,
            `total_test_cases_documented`, `has_execution_summary`, and `compliance_indicator`
            describing the generated documentation artifact.
          type: dict
        summary: Generate a standardized test documentation file from aggregated test
          results.
    prompt: Develop comprehensive documentation including test plans, case definitions,
      setup procedures, and result interpretations. Format using standardized reporting
      templates.
  create_test_environment:
    agent: false
    description: Set up the required testing environment and dependencies
    name: create_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: True if all components are healthy and ready for testing
      key: environment_ready
      type: bool
    - description: List of package names that were installed during environment setup
      key: installed_packages
      type: List[str]
    - description: List of testing framework names that were set up
      key: frameworks_configured
      type: List[str]
    - description: 'Status strings for each service started (e.g., ''PostgreSQL: running'')'
      key: services_status
      type: List[str]
    - description: Detailed messages from health checks for each component
      key: health_check_messages
      type: List[str]
    prd:
      conceptual_info: Initialises a reproducible, fully‑functional testing environment
        by installing required Python packages, configuring testing frameworks (e.g.,
        pytest, behave), launching auxiliary services such as databases or message
        brokers, and running health‑check diagnostics. The node returns a structured
        status report that downstream test suites consume to guarantee a reliable
        execution context.
      docstring:
        examples:
        - lines:
          - result = create_test_environment()
          - print(result['environment_ready'])
          - print(result['installed_packages'])
          - print(result['frameworks_configured'])
          - print(result['services_status'])
          - print(result['health_check_messages'])
          output: 'True

            [''pytest'', ''requests'', ''psycopg2'']

            [''pytest'']

            [''PostgreSQL: running'', ''Redis: running'']

            [''PostgreSQL reachable'', ''Redis reachable'']'
        - lines:
          - '# Simulate a failure in a service start'
          - 'def mock_start_service(name):'
          - '    if name == ''PostgreSQL'':'
          - '        raise RuntimeError(''Port already in use'')'
          - '    return f"{name}: running"'
          - '# The function would raise RuntimeError'
          - create_test_environment()
          output: 'RuntimeError: Port already in use'
        parameters: []
        raises:
        - description: If any required package fails to install or a service cannot
            be started.
          type: RuntimeError
        - description: If health‑check validation fails, indicating the environment
            is not ready.
          type: ValueError
        returns:
          description: Dictionary containing keys `environment_ready` (bool), `installed_packages`
            (List[str]), `frameworks_configured` (List[str]), `services_status` (List[str]),
            and `health_check_messages` (List[str]) that summarise the environment
            setup outcome.
          type: dict
        summary: Creates and validates a complete test environment, installing packages,
          configuring frameworks, starting services, and performing health checks.
    prompt: Configure the test environment by installing dependencies, setting up
      testing frameworks, and initializing required services. Validate environment
      readiness with health checks.
  generate_summary_report:
    agent: false
    description: Create test cycle summary artifact
    name: generate_summary_report
    nodes_depended_on:
    - compile_test_documentation
    nodes_dependent_on: []
    output_structure:
    - description: Title of the summary report
      key: report_title
      type: str
    - description: Percentage of tests that passed (0.0 – 1.0)
      key: pass_rate
      type: float
    - description: Percentage of tests that failed (0.0 – 1.0)
      key: fail_rate
      type: float
    - description: Number of defects per thousand lines of code or per test case
      key: defect_density
      type: float
    - description: Key performance numbers such as average response time, throughput,
        etc.
      key: performance_metrics
      type: float
    - description: Short description of the most important issues discovered during
        testing
      key: critical_findings
      type: str
    - description: Suggested next steps or actions for stakeholders
      key: recommendations
      type: str
    - description: ISO‑8601 timestamp when the summary report was created
      key: report_generated_timestamp
      type: str
    - description: Indicates whether the report was generated without errors
      key: is_report_successful
      type: bool
    prd:
      conceptual_info: Generate a concise test cycle summary report that consolidates
        key metrics and findings from the compiled test documentation.
      docstring:
        examples:
        - lines:
          - report = generate_summary_report(
          - '    documentation_file_path=''/tmp/test_doc.html'','
          - '    document_sections=[''Test Plan'', ''Results'', ''Conclusion''],'
          - '    total_test_cases_documented=120,'
          - '    has_execution_summary=True,'
          - '    compliance_indicator=True'
          - )
          - print(report['report_title'])
          output: Test Cycle Summary – January 2026
        - lines:
          - report = generate_summary_report(
          - '    documentation_file_path=''/tmp/test_doc.html'','
          - '    document_sections=[''Test Plan'', ''Results''],'
          - '    total_test_cases_documented=120,'
          - '    has_execution_summary=False,'
          - '    compliance_indicator=True'
          - )
          output: 'ValueError: Execution summary missing in the provided documentation.'
        parameters:
        - description: File system path to the compiled test documentation generated
            by 'compile_test_documentation'.
          name: documentation_file_path
          type: str
        - description: Top‑level section titles contained in the documentation (e.g.,
            'Test Plan', 'Results').
          name: document_sections
          type: List[str]
        - description: Number of individual test cases described in the documentation.
          name: total_test_cases_documented
          type: int
        - description: Indicates whether the documentation includes a concise execution
            summary with key metrics.
          name: has_execution_summary
          type: bool
        - description: True if the documentation meets the predefined reporting template
            and quality criteria.
          name: compliance_indicator
          type: bool
        raises:
        - description: Raised if 'documentation_file_path' does not point to an existing
            file.
          type: FileNotFoundError
        - description: Raised when the documentation lacks an execution summary or
            required metrics cannot be extracted.
          type: ValueError
        - description: Raised if parsing the documentation fails for an unexpected
            reason.
          type: RuntimeError
        returns:
          description: Dictionary containing the generated summary report with the
            fields specified in the node's output structure.
          type: dict
        summary: Generates a concise summary report for a test cycle, extracting metrics
          such as pass/fail rates, defect density, and performance numbers from the
          compiled test documentation. The report is produced in a structured dictionary
          suitable for downstream consumption or serialization.
    prompt: Produce concise summary report highlighting key metrics (pass/fail rates,
      defect density, performance metrics), critical findings, and recommended next
      steps for stakeholders.
  generate_test_data:
    agent: false
    description: Create synthetic test data for all required test scenarios
    name: generate_test_data
    nodes_depended_on:
    - create_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: File system paths to the generated test data files
      key: data_file_paths
      type: List[str]
    - description: Total number of test records generated across all files
      key: total_records
      type: int
    - description: Indicates whether the generated dataset contains explicitly crafted
        edge‑case records
      key: includes_edge_cases
      type: bool
    - description: Brief description of the data schema (field names and types) used
        for the generated test data
      key: schema_description
      type: str
    - description: Number of intentionally invalid or malformed records included for
        negative testing
      key: invalid_record_count
      type: int
    prd:
      conceptual_info: Generates a set of synthetic data files that cover normal,
        edge‑case, and erroneous inputs. The data is produced after the testing environment
        is validated, enabling downstream test suites (unit, integration, system,
        acceptance) to consume a ready‑to‑use dataset.
      docstring:
        examples:
        - lines:
          - result = generate_test_data()
          - print(result['includes_edge_cases'])
          - print(result['invalid_record_count'])
          output: 'True

            5'
        - lines:
          - result = generate_test_data()
          - print(result['data_file_paths'])
          output: '["/tmp/test_data/users.json", "/tmp/test_data/orders.json"]'
        parameters: []
        raises:
        - description: If the test environment is not ready (e.g., missing dependencies
            or failed health checks).
          type: RuntimeError
        - description: If file creation fails due to permission errors or insufficient
            disk space.
          type: IOError
        returns:
          description: A dictionary containing paths to generated files, total record
            count, flags for edge‑cases, schema description, and count of invalid
            records.
          type: dict
        summary: Generate synthetic test data covering valid, edge‑case, and invalid
          records for use by all test suites.
    prompt: Generate comprehensive test data including edge cases, valid inputs, and
      invalid scenarios. Structure data for easy ingestion by test suites.
  integration_test_suite:
    agent: false
    description: Verify interactions between components
    name: integration_test_suite
    nodes_depended_on:
    - create_test_environment
    - generate_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers of integration test cases that were run
      key: executed_test_cases
      type: List[str]
    - description: Identifiers of test cases that passed
      key: passed_test_cases
      type: List[str]
    - description: Identifiers of test cases that failed
      key: failed_test_cases
      type: List[str]
    - description: True if all executed test cases passed, otherwise false
      key: overall_success
      type: bool
    - description: Total time taken to run the integration test suite in seconds
      key: execution_time_seconds
      type: float
    - description: List of error messages or exception details for failed test cases
      key: error_messages
      type: List[str]
    prd:
      conceptual_info: Runs the integration test suite after the test environment
        and synthetic data have been prepared. It exercises inter‑component communication,
        external API contracts, and data‑flow consistency, then aggregates detailed
        pass/fail information for downstream reporting.
      docstring:
        examples:
        - lines:
          - report = integration_test_suite(
          - '    environment_ready=True,'
          - '    data_file_paths=[''/tmp/test_data_1.json'', ''/tmp/test_data_2.json'']'
          - )
          output: "{\n  'executed_test_cases': ['TC_INT_001', 'TC_INT_002'],\n  'passed_test_cases':\
            \ ['TC_INT_001'],\n  'failed_test_cases': ['TC_INT_002'],\n  'overall_success':\
            \ False,\n  'execution_time_seconds': 12.34,\n  'error_messages': ['TC_INT_002:\
            \ Unexpected 500 response from /api/orders']\n}"
        - lines:
          - '# When the environment is not ready, an exception is raised'
          - integration_test_suite(environment_ready=False, data_file_paths=[])
          output: 'RuntimeError: Test environment is not ready. Abort integration
            testing.'
        parameters:
        - description: Result from `create_test_environment`; must be True for the
            suite to run.
          name: environment_ready
          type: bool
        - description: List of file paths produced by `generate_test_data` that contain
            the test payloads.
          name: data_file_paths
          type: List[str]
        raises:
        - description: If `environment_ready` is False, indicating the test environment
            failed health checks.
          type: RuntimeError
        - description: If any path in `data_file_paths` does not exist or is unreadable.
          type: FileNotFoundError
        - description: Any unexpected error occurring during test execution (e.g.,
            network time‑outs, unhandled exceptions in the component under test).
          type: Exception
        returns:
          description: Dictionary matching the node's output_structure with keys `executed_test_cases`,
            `passed_test_cases`, `failed_test_cases`, `overall_success`, `execution_time_seconds`,
            and `error_messages`.
          type: dict
        summary: Execute the integration test suite using the prepared environment
          and test data, returning a detailed execution report.
    prompt: Execute tests validating communication between components, API endpoints,
      and external systems. Prioritize interface validation and data consistency.
  system_test_suite:
    agent: false
    description: Validate end-to-end system behavior
    name: system_test_suite
    nodes_depended_on:
    - create_test_environment
    - generate_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Total number of end‑to‑end test cases that were executed.
      key: total_test_cases
      type: int
    - description: Number of test cases that completed successfully.
      key: passed_test_cases
      type: int
    - description: Number of test cases that failed.
      key: failed_test_cases
      type: int
    - description: Percentage of passed test cases (passed / total * 100).
      key: pass_rate_percentage
      type: float
    - description: Indicates whether any critical failures (e.g., workflow breakage)
        were observed.
      key: critical_failure_detected
      type: bool
    - description: Average response time across all end‑to‑end scenarios, measured
        in milliseconds.
      key: average_response_time_ms
      type: float
    - description: List of response time measurements for each individual test case,
        in milliseconds.
      key: performance_metrics_ms
      type: List[float]
    - description: Collected error or exception messages from failed test cases.
      key: error_messages
      type: List[str]
    prd:
      conceptual_info: The system_test_suite node orchestrates comprehensive end‑to‑end
        tests that simulate real user interactions across the entire application stack,
        validating functional correctness, workflow continuity, and performance characteristics
        under realistic conditions.
      docstring:
        examples:
        - lines:
          - results = run_system_test_suite(
          - '    environment_ready=True,'
          - '    installed_packages=[''pytest'', ''requests''],'
          - '    frameworks_configured=[''pytest''],'
          - '    services_status=[''PostgreSQL: running'', ''Redis: running''],'
