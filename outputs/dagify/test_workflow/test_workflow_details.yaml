dag_type: spec
description: Generated workflow from UI.
name: test_workflow
nodes:
  construct_test_workflow:
    agent: false
    description: Construct the fundamental workflow DAG from the mapped tasks.
    name: construct_test_workflow
    nodes_depended_on:
    - map_decomposed_objective
    nodes_dependent_on: []
    output_structure:
    - description: The name of the constructed workflow DAG.
      key: workflow_name
      type: str
    - description: A description of the constructed workflow DAG.
      key: workflow_description
      type: str
    - description: JSON representation of the graph structure of the workflow DAG.
      key: graph_json
      type: str
    - description: List of metrics related to the workflow DAG, such as size and complexity.
      key: dag_metrics
      type: List[float]
    - description: Whether the constructed workflow DAG is acyclic.
      key: acyclicity_status
      type: bool
    prd:
      conceptual_info: This node constructs a fundamental workflow DAG from mapped
        tasks, aiming for maximum concurrency, asynchrony, and parallelism.
      docstring:
        examples:
        - lines:
          - '(task_name, task_description) = construct_test_workflow(mapped_objectives=[{''objective1'':
            ''description1''}]'
          output: '{ ''workflow_name'': ''new_workflow1'', ''workflow_description'':
            ''this is a workflow'', ''graph_json'': ''{1: [2], 2: [3, 4], 3: [], 4:
            []}'', ''dag_metrics'': [1.0, 0.0, 0.0], ''acyclicity_status'': False
            }'
        parameters:
        - description: The mapped objectives from the Elemental Thoughts framework
            to serve as the basis for the workflow DAG.
          name: mapped_objectives
          type: List[object] or MappedObjective object or MappedObjectives list or
            MappedObjectives object
        raises:
        - description: Raised if the mapped objectives are empty or invalid.
          type: ValueError
        returns:
          description: The constructed workflow DAG with its specified attributes.
          type: dict or ConstructedWorkflow object or dict of list/dict structure
        summary: Constructs a fundamental workflow DAG from mapped tasks.
    prompt: Create a fundamental workflow DAG that is maximally concurrent, async,
      and parallel from the mapped tasks and Elemental Thoughts framework.
  decompose_objective:
    agent: false
    description: Decompose the parsed objective into constituent tasks.
    name: decompose_objective
    nodes_depended_on:
    - parse_test_objective
    nodes_dependent_on: []
    output_structure:
    - description: The decomposed task represented as a string
      key: decomposed_task
      type: str
    - description: A list of component tasks
      key: component_tasks
      type: str
    - description: Type of operation
      key: operation_type
      type: str
    prd:
      conceptual_info: Decomposes the given task into constituent tasks to facilitate
        further operations.
      docstring:
        examples:
        - lines:
          - decompose_objective(fundamental_task='execute_service')
          - print(decompose_objective(fundamental_task='execute_service'))
          output: '{''decomposed_task'': ''execute_service'', ''component_tasks'':
            [''task_1'', ''task_2''], ''operation_type'': ''sequential''}'
        - lines:
          - decompose_objective(fundamental_task='run_pipeline')
          - print(decompose_objective(fundamental_task='run_pipeline'))
          output: '{''decomposed_task'': ''run_pipeline'', ''component_tasks'': [''task_3'',
            ''task_4''], ''operation_type'': ''parallel''}'
        parameters:
        - description: The fundamental task to be decomposed.
          name: fundamental_task
          type: str
        raises:
        - description: If the input task is not a string.
          type: TypeError
        returns:
          description: A dictionary containing the decomposed task, list of component
            tasks and type of operation.
          type: dict[str, str|list[str]]
        summary: Decomposes the given task into constituent tasks.
    prompt: Decompose the provided fundamental task into elemental operations.
  execute_test_workflow:
    agent: false
    description: Execute the validated workflow DAG to finalize the test execution.
    name: execute_test_workflow
    nodes_depended_on:
    - validate_test_workflow
    nodes_dependent_on: []
    output_structure:
    - description: Status of the test execution
      key: test_execution_status
      type: str
    - description: List of numerical test results
      key: result_values
      type: List[int]
    - description: Log messages generated during test execution
      key: execution_logs
      type: str
    prompt: Run the validated workflow DAG to execute the fundamental test objective.
  map_decomposed_objective:
    agent: false
    description: Map each decomposed task to Elemental Thoughts framework.
    name: map_decomposed_objective
    nodes_depended_on:
    - decompose_objective
    nodes_dependent_on: []
    output_structure:
    - description: List of objectives mapped to Elemental Thoughts framework
      key: mapped_objectives
      type: List[str]
    - description: List of execution statuses for each decomposed task
      key: task_execution_status
      type: List[str]
    - description: List of error messages encountered during mapping process
      key: error_messages
      type: List[str]
    prd:
      conceptual_info: Maps decomposed tasks from the decomposed_objective node to
        the Elemental Thoughts framework.
      docstring:
        examples:
        - lines:
          - result, statuses, errors = map_decomposed_objective(task)
          - print(result)
          - print(statuses)
          - print(errors)
          output: "['Mapped Object 1', 'Mapped Object 2', ...] \n['Success', 'Failure',\
            \ ...] \n['Error 1', 'Error 2', ...]"
        parameters:
        - description: The decomposed task to be mapped to the Elemental Thoughts
            framework.
          name: task
          type: str
        raises:
        - description: If the task is not in the correct format for mapping.
          type: ValueError
        returns:
          description: A tuple containing the list of objectives mapped to Elemental
            Thoughts framework, the list of execution statuses for each decomposed
            task, and the list of error messages encountered during mapping process.
          type: tuple[List[str], List[str], List[str]]
        summary: Maps decomposed tasks to the Elemental Thoughts framework.
    prompt: Map the decomposed task elements to the Elemental Thoughts framework to
      execute fundamental operations.
  parse_test_objective:
    agent: false
    description: Parse the given Objective description.
    name: parse_test_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure: []
    prompt: Parse the provided Objective description to create a fundamental and specific
      task.
  validate_test_workflow:
    agent: false
    description: Validate that the constructed workflow DAG adheres to acyclicity
      and dependency requirements.
    name: validate_test_workflow
    nodes_depended_on:
    - construct_test_workflow
    nodes_dependent_on: []
    output_structure:
    - description: Whether the constructed workflow DAG is acyclic
      key: dag_acyclicity
      type: bool
    - description: Whether the constructed workflow DAG enforces the correct dependencies
      key: dependency_requirements_met
      type: bool
    - description: Whether the constructed workflow DAG is valid
      key: dag_validation_status
      type: bool
    prd:
      conceptual_info: Validates the constructed workflow DAG's acyclicity and dependency
        adherence.
      docstring:
        examples:
        - lines:
          - inputs = construct_test_workflow()
          - validity_status = validate_test_workflow(inputs)
          - print(validity_status)
          output: 'True'
        - lines:
          - inputs = construct_test_workflow(cyclic_DAG=True)
          - validity_status = validate_test_workflow(inputs)
          - print(validity_status)
          output: 'False'
        parameters: []
        raises:
        - description: If the workflow DAG has cyclic dependencies.
          type: ValueError
        - description: If the workflow DAG does not enforce correct dependencies.
          type: DependencyError
        returns:
          description: A dictionary containing the validation status.
          type: dict
        summary: Verifies the constructed workflow DAG's acyclic nature and correct
          dependency enforcement.
    prompt: Verify that the constructed workflow DAG is acyclic and enforces the correct
      dependencies.
