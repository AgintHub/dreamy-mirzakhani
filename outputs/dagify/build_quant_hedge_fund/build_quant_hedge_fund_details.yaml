dag_type: plain_text
description: A detailed, highly concurrent workflow that produces a complete foundational
  plan for launching a quantitative hedge fund, covering strategy definition, data
  infrastructure, legal setup, operations, risk, technology, staffing, compliance,
  and launch timeline.
name: build_quant_hedge_fund
nodes:
  choose_legal_entity:
    agent: false
    description: Identify the legal structure of the fund vehicle.
    name: choose_legal_entity
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    prompt: Specify the legal vehicle (e.g., LP, LLC, SICAV) suitable for the chosen
      jurisdiction and give a one‑sentence rationale.
  clarify_fund_mission:
    agent: false
    description: Produce a concise bullet list of the fund's overarching mission and
      objectives.
    name: clarify_fund_mission
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List up to eight bullet points that capture the core mission of the quantitative
      hedge fund, including investment focus, desired market impact, and long‑term
      vision.
  compile_pitch_deck_outline:
    agent: false
    description: Create the structure of the fundraising presentation.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_mission
    - define_investment_strategy
    - set_performance_targets
    - draft_fee_structure
    - design_risk_framework
    nodes_dependent_on: []
    prompt: Provide a 10‑slide outline (slide titles only) for an investor pitch deck
      covering mission, strategy, edge, performance targets, risk controls, fees,
      team, service providers, timeline, and ask.
  create_data_pipeline_spec:
    agent: false
    description: Define the quantitative data acquisition and validation process.
    name: create_data_pipeline_spec
    nodes_depended_on:
    - specify_asset_universe
    nodes_dependent_on: []
    prompt: 'Detail a data ingestion pipeline for the asset universe: source types,
      frequency, storage format, and validation checks. Present as a short numbered
      list.'
  create_hiring_plan:
    agent: false
    description: Determine the initial staffing requirements.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_flow
    - define_technology_stack
    nodes_dependent_on: []
    prompt: List up to eight essential full‑time roles for launch (e.g., quant researcher,
      data engineer, risk analyst, portfolio manager, CTO, compliance officer). Include
      a one‑line responsibility for each.
  define_investment_strategy:
    agent: false
    description: Choose the primary quantitative investment strategy.
    name: define_investment_strategy
    nodes_depended_on:
    - clarify_fund_mission
    nodes_dependent_on: []
    prompt: Select a single quantitative strategy category (e.g., statistical arbitrage,
      systematic macro, machine‑learning equity) and provide a brief one‑sentence
      description of its core signal generation approach.
  define_target_investor_profile:
    agent: false
    description: Specify the target investor audience.
    name: define_target_investor_profile
    nodes_depended_on:
    - clarify_fund_mission
    nodes_dependent_on: []
    prompt: 'Describe the ideal investor segment (e.g., family offices, endowments)
      with characteristics: typical ticket size, risk tolerance, liquidity preference,
      and geographic focus.'
  define_technology_stack:
    agent: false
    description: Specify technology tools for each operational step.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_flow
    nodes_dependent_on: []
    prompt: 'Create a two‑column table: Operations Step | Recommended Technology Component
      (e.g., data warehouse, Python back‑tester, order management system, real‑time
      market data feed).'
  design_compliance_program:
    agent: false
    description: Build the fund's compliance framework.
    name: design_compliance_program
    nodes_depended_on:
    - list_regulatory_requirements
    - design_risk_framework
    nodes_dependent_on: []
    prompt: 'Generate a compliance checklist mapping each regulatory requirement to
      an internal policy or procedure. Present as a two‑column table: Requirement
      | Policy Reference.'
  design_model_development_process:
    agent: false
    description: Establish the model development lifecycle.
    name: design_model_development_process
    nodes_depended_on:
    - create_data_pipeline_spec
    - define_investment_strategy
    nodes_dependent_on: []
    prompt: Outline a step‑by‑step workflow for research, model building, back‑testing,
      and validation. Include version control and documentation checkpoints.
  design_risk_framework:
    agent: false
    description: Outline quantitative risk management controls.
    name: design_risk_framework
    nodes_depended_on:
    - set_performance_targets
    - specify_asset_universe
    nodes_dependent_on: []
    prompt: 'List core risk controls aligned with the targets: position limits, sector
      caps, VaR limit, stop‑loss rules, liquidity buffers. Provide 5 bullet points.'
  develop_launch_timeline:
    agent: false
    description: Create a phased schedule leading to fund launch.
    name: develop_launch_timeline
    nodes_depended_on:
    - select_jurisdiction
    - choose_legal_entity
    - list_service_providers
    - draft_operations_flow
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on: []
    prompt: 'Produce a month‑by‑month timeline for the next 12 months, marking key
      milestones: legal filing, service provider contracts, technology deployment,
      hiring, capital raise, mock trading, and go‑live.'
  draft_fee_structure:
    agent: false
    description: Set the fund's fee schedule.
    name: draft_fee_structure
    nodes_depended_on:
    - clarify_fund_mission
    - estimate_setup_costs
    nodes_dependent_on: []
    prompt: Propose a management fee (as % of AUM) and a performance fee (as % of
      profits) that balance cost recovery with market competitiveness. Include a hurdle
      rate if applicable.
  draft_operations_flow:
    agent: false
    description: Map the core operational workflow.
    name: draft_operations_flow
    nodes_depended_on:
    - specify_asset_universe
    - list_service_providers
    - design_risk_framework
    nodes_dependent_on: []
    prompt: 'Sketch the end‑to‑end daily trade lifecycle: idea generation → signal
      computation → order creation → execution → confirmation → settlement → reconciliation
      → reporting. For each step, name the primary responsible party (internal team
      or external provider).'
  estimate_setup_costs:
    agent: false
    description: Produce a rough annual cost model for setup and operations.
    name: estimate_setup_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on: []
    prompt: 'Provide a simple table with two columns: Cost Item | Estimated Annual
      USD. Include each service provider category plus overhead items such as office
      rent and technology licensing.'
  list_regulatory_requirements:
    agent: false
    description: Identify key regulatory obligations.
    name: list_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity
    nodes_dependent_on: []
    prompt: Provide a checklist of the principal regulatory filings and registrations
      required for the selected entity and jurisdiction (e.g., SEC Form ADV, AIFMD
      notification). List only the filing name and governing authority.
  list_service_providers:
    agent: false
    description: Enumerate essential external service providers.
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity
    nodes_dependent_on: []
    prompt: Create a plain list of mandatory third‑party service provider types for
      a hedge fund (e.g., prime broker, fund administrator, auditor, legal counsel,
      compliance consultant, custodian).
  produce_final_fund_plan:
    agent: false
    description: Generate a unified launch blueprint for the quantitative hedge fund.
    name: produce_final_fund_plan
    nodes_depended_on:
    - compile_pitch_deck_outline
    - develop_launch_timeline
    - design_compliance_program
    - draft_fee_structure
    - design_risk_framework
    - define_technology_stack
    - create_hiring_plan
    nodes_dependent_on: []
    prompt: Synthesize all prior outputs into a concise executive summary (≤400 words)
      covering strategy, structure, risk, operations, technology, fees, costs, timeline,
      and compliance.
  select_jurisdiction:
    agent: false
    description: Pick the optimal legal jurisdiction for the fund and justify the
      choice.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_mission
    nodes_dependent_on: []
    prompt: Choose a single primary domicile (e.g., Cayman Islands, Delaware, Luxembourg)
      that best aligns with the mission. Provide two advantages and two disadvantages
      of the chosen jurisdiction.
  set_performance_targets:
    agent: false
    description: Quantify expected risk‑adjusted performance.
    name: set_performance_targets
    nodes_depended_on:
    - define_investment_strategy
    nodes_dependent_on: []
    prompt: Define annual quantitative targets for gross return, volatility (standard
      deviation), Sharpe ratio, and maximum drawdown. Present as a 4‑row table.
  specify_asset_universe:
    agent: false
    description: Enumerate the assets the fund will trade.
    name: specify_asset_universe
    nodes_depended_on:
    - define_investment_strategy
    nodes_dependent_on: []
    prompt: List up to ten tradable instruments or asset classes that the chosen strategy
      will target (e.g., US equities, EUR/USD futures, credit default swaps).
