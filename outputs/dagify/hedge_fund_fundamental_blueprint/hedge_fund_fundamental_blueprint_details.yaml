    description: Establish quantitative performance metrics for the hedge fund.
    implementation: "from ._set_performance_and_risk_targets.validate_input_parameters\
      \ import validate_input_parameters\nfrom ._set_performance_and_risk_targets.get_strategy_target_template\
      \ import get_strategy_target_template\nfrom ._set_performance_and_risk_targets.adjust_targets_for_risk_profile\
      \ import adjust_targets_for_risk_profile\nfrom ._set_performance_and_risk_targets.extract_metric_names\
      \ import extract_metric_names\nfrom ._set_performance_and_risk_targets.extract_target_values\
      \ import extract_target_values\nfrom ._set_performance_and_risk_targets.generate_target_rationales\
      \ import generate_target_rationales\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_investment_strategy node outputs.\"\"\"\
      \n    strategy_category: str = (\n        Field(..., description = (\n     \
      \       \"The chosen primary investment strategy category.\")\n        )\n \
      \   )\n    rationale: str = (\n        Field(..., description = (\n        \
      \    \"A one-paragraph explanation aligning the strategy with the fund's objectives.\"\
      )\n        )\n    )\n    risk_profile: str = (\n        Field(..., description\
      \ = (\n            \"A concise description of the expected risk profile associated\
      \ with the chosen strategy.\")\n        )\n    )\n\n\nclass SetPerformanceAndRiskTargetsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_performance_and_risk_targets node outputs.\"\
      \"\"\n    metric_names: List[str] = (\n        Field(..., description = (\n\
      \            \"Names of the performance and risk metrics (e.g., Gross Return,\
      \ Volatility, Sharpe Ratio, Max Drawdown).\")\n        )\n    )\n    target_values:\
      \ List[float] = (\n        Field(..., description = (\n            \"Numerical\
      \ target values corresponding to each metric (e.g., 0.15 for 15% gross return,\
      \ 0.10 for 10% volatility).\")\n        )\n    )\n    rationale_texts: List[str]\
      \ = (\n        Field(..., description = (\n            \"Brief rationale for\
      \ each target, explaining how it aligns with strategy and risk appetite.\")\n\
      \        )\n    )\n\n\ndef set_performance_and_risk_targets(choose_investment_strategy_input:\
      \ ChooseInvestmentStrategyOutput, **kwargs) -> SetPerformanceAndRiskTargetsOutput:\n\
      \    \"\"\"\n    Compute annual performance and risk targets based on the selected\
      \ investment\n    strategy.\n\n    Parameters\n    ----------\n    strategy_category\
      \ : str\n        Primary investment strategy category selected by the parent\
      \ node\n        (e.g., 'Long/Short Equity', 'Event-Driven', 'Global Macro').\n\
      \    strategy_rationale : str\n        Textual justification for the strategy,\
      \ used to inform target\n        setting.\n    risk_profile : str\n        Brief\
      \ description of the expected risk profile (e.g., 'Moderate\n        volatility,\
      \ high return potential').\n\n    Returns\n    -------\n    dict\n        A\
      \ dictionary with three keys: 'metric_names' (List[str]),\n        'target_values'\
      \ (List[float]), and 'rationale_texts' (List[str]).\n\n    Raises\n    ------\n\
      \    ValueError\n        Raised if any of the input parameters are empty or\
      \ not a string.\n    KeyError\n        Raised if the strategy_category is not\
      \ recognized in the internal\n        mapping of target templates.\n\n    Examples\n\
      \    --------\n    >>> strategy_category = 'Long/Short Equity'\n    >>> strategy_rationale\
      \ = 'Targeting alpha from long positions while hedging\n    with short bets.'\n\
      \    >>> risk_profile = 'Moderate volatility, high return potential'\n    >>>\
      \ targets = set_performance_and_risk_targets(strategy_category,\n    strategy_rationale,\
      \ risk_profile)\n    >>> print(targets['metric_names'])\n    >>> print(targets['target_values'])\n\
      \    >>> print(targets['rationale_texts'])\n    \"['Gross Return', 'Volatility',\
      \ 'Sharpe Ratio', 'Max Drawdown']\"\n    \"[0.15, 0.10, 1.5, 0.20]\"\n    \"\
      ['A 15% return aligns with long/short alpha goals.', '10% volatility\n    matches\
      \ moderate risk appetite.', 'Sharpe of 1.5 indicates efficient\n    risk‑adjusted\
      \ returns.', '20% drawdown tolerance protects capital during\n    market stress.']\n\
      \n    >>> strategy_category = 'Event-Driven'\n    >>> strategy_rationale = 'Profit\
      \ from merger arbitrage and distressed\n    events.'\n    >>> risk_profile =\
      \ 'High volatility, low correlation to markets'\n    >>> targets = set_performance_and_risk_targets(strategy_category,\n\
      \    strategy_rationale, risk_profile)\n    >>> print(targets['target_values'])\n\
      \    [0.18, 0.15, 1.2, 0.25]\n\n    \"\"\"\n    validate_input_parameters(\n\
      \        strategy_category=choose_investment_strategy_input.strategy_category,\n\
      \        strategy_rationale=choose_investment_strategy_input.rationale,\n  \
      \      risk_profile=choose_investment_strategy_input.risk_profile\n    )\n \
      \   \n    base_targets: dict = get_strategy_target_template(strategy_category=choose_investment_strategy_input.strategy_category)\n\
      \    \n    adjusted_targets: dict = adjust_targets_for_risk_profile(\n     \
      \   base_targets=base_targets,\n        risk_profile=choose_investment_strategy_input.risk_profile\n\
      \    )\n    \n    metric_names: List[str] = extract_metric_names(targets=adjusted_targets)\n\
      \    target_values: List[float] = extract_target_values(targets=adjusted_targets)\n\
      \    \n    rationale_texts: List[str] = generate_target_rationales(\n      \
      \  metric_names=metric_names,\n        target_values=target_values,\n      \
      \  strategy_rationale=choose_investment_strategy_input.rationale,\n        risk_profile=choose_investment_strategy_input.risk_profile\n\
      \    )\n    \n    return SetPerformanceAndRiskTargetsOutput(\n        metric_names=metric_names,\n\
      \        target_values=target_values,\n        rationale_texts=rationale_texts\n\
      \    )"
