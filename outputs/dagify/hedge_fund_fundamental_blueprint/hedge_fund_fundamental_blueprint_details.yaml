      \ = [\"Allocate capital\", \"Monitor performance\",\n    \"Review AML policies\"\
      , \"Approve risk models\", \"Manage budgets\"],\n    >>> role_responsibility_3\
      \ = [\"Stakeholder communication\", \"Approve trades\",\n    \"Report violations\"\
