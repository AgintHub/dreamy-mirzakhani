      \ Tool).\")\n    )\n    vendor_in_house_flags: List[bool] = (\n        Field(...,\
      \ description=\"Boolean flag for each stage indicating whether the solution\
      \ is implemented in-house (true) or outsourced to a vendor (false).\")\n   \
      \ )\n\n\ndef define_technology_stack(draft_operations_workflow_input: DraftOperationsWorkflowOutput,\
      \ **kwargs) -> DefineTechnologyStackOutput:\n    \"\"\"\n    Generate a technology\
      \ stack mapping for the hedge fund’s operational\n    workflow.\n\n    Parameters\n\
      \    ----------\n    workflow_stages : List[str]\n        Ordered list of workflow\
      \ stages as produced by\n        `draft_operations_workflow`.\n    stage_descriptions\
      \ : List[str]\n        Brief description of activities performed in each stage\
      \ (used for\n        contextual mapping).\n\n    Returns\n    -------\n    Dict[str,\
      \ List[Any]]\n        A dictionary containing three keys: - `workflow_stages`\
      \ (List[str])\n        - `technology_solutions` (List[str]) - `vendor_in_house_flags`\n\
      \        (List[bool])\n\n    Raises\n    ------\n    ValueError\n        If\
      \ the length of `workflow_stages` and `stage_descriptions` do not\n        match.\n\
      \    KeyError\n        If a known workflow stage is not present in the internal\
      \ mapping.\n\n    Examples\n    --------\n    >>> workflow_stages = [\"Idea\
      \ Generation\", \"Signal Generation\", \"Order\n    Entry\", \"Execution Management\"\
      , \"Position Monitoring\", \"Reconciliation\",\n    \"Settlement\"],\n    >>>\
      \ stage_descriptions = [\n    ...     \"Generate investment ideas via research\
      \ and data analysis.\",\n    ...     \"Generate buy/sell signals from quantitative\
