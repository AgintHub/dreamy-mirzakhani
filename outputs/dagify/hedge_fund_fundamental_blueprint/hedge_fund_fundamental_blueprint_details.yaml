      \ List[str] = (\n        Field(..., description=\"One or two brief notes describing\
      \ how to implement or comply with the requirement.\")\n    )\n\n\ndef identify_regulatory_requirements(choose_legal_entity_type_input:\
      \ ChooseLegalEntityTypeOutput, **kwargs) -> IdentifyRegulatoryRequirementsOutput:\n\
      \    \"\"\"\n    Generate a list of all regulatory filings, registrations, and\
      \ associated\n    implementation notes required for the hedge fund’s chosen\
      \ legal entity and\n    jurisdiction.\n\n    Parameters\n    ----------\n  \
      \  legal_entity_info : dict\n        Dictionary containing the legal entity\
      \ type and jurisdiction as\n        returned by the parent node `choose_legal_entity_type`.\n\
      \n    Returns\n    -------\n    List[dict]\n        A list of dictionaries,\
      \ each containing a `requirement`,\n        `agency_citation`, and `implementation_notes`\
      \ field.\n\n    Raises\n    ------\n    KeyError\n        If `legal_entity_info`\
      \ does not contain expected keys such as\n        `legal_entity_type` or `jurisdiction`.\n\
      \    ValueError\n        If the legal entity type or jurisdiction is unsupported\
      \ or unknown.\n\n    Examples\n    --------\n    >>> legal_entity_info = {\n\
      \    ...     'legal_entity_type': 'LLC',\n    ...     'jurisdiction': 'Delaware'\n\
      \    >>> }\n    [\n      {\n        \"requirement\": \"Register with SEC as\
      \ an investment adviser\",\n        \"agency_citation\": \"SEC, Form ADV\",\n\
