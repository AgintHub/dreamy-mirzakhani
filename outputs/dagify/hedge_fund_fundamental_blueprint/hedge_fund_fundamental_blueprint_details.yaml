      \ and P&L.\",\n    ...     \"Automated P&L and trade reconciliation.\",\n  \
      \  ...     \"Confirm settlements with custodians and counterparties.\"]\n  \
      \  >>> result = define_technology_stack(workflow_stages, stage_descriptions)\n\
      \    >>> print(result)\n    {\n      \"workflow_stages\": [\"Idea Generation\"\
      , \"Signal Generation\", \"Order Entry\",\n    \"Execution Management\", \"\
      Position Monitoring\", \"Reconciliation\",\n    \"Settlement\"],\n      \"technology_solutions\"\
      : [\"Data Analytics Platform\", \"Quant Model Engine\",\n    \"Order Management\
      \ System\", \"FIX Gateway\", \"Risk Engine\", \"Reconciliation\n    Tool\",\
      \ \"Settlement Service\"],\n      \"vendor_in_house_flags\": [true, true, false,\
      \ false, true, false, false]\n    }\n\n    >>> # Using a shortened workflow\
      \ workflow_stages = [\"Signal Generation\",\n    \"Order Entry\", \"Execution\
      \ Management\"],\n    >>> stage_descriptions = [\n    ...     \"Generate buy/sell\
      \ signals.\",\n    ...     \"Create orders.\",\n    ...     \"Route to market.\"\
      ]\n    >>> print(define_technology_stack(workflow_stages, stage_descriptions))\n\
      \    {\n      \"workflow_stages\": [\"Signal Generation\", \"Order Entry\",\
      \ \"Execution\n    Management\"],\n      \"technology_solutions\": [\"Quant\
      \ Model Engine\", \"Order Management System\",\n    \"FIX Gateway\"],\n    \
      \  \"vendor_in_house_flags\": [true, false, false]\n    }\n\n    \"\"\"\n  \
      \  return DefineTechnologyStackOutput(\n        workflow_stages=[],\n      \
      \  technology_solutions=[],\n        vendor_in_house_flags=[],\n    )"
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of workflow stages (e.g., Idea Generation, Signal
        Generation, Order Entry, Execution Management, Position Monitoring, Reconciliation,
        Settlement).
      key: workflow_stages
      type: List[str]
    - description: Corresponding technology solution for each stage (e.g., Data Analytics
        Platform, Portfolio Management System, OMS, FIX Gateway, Risk Engine, Reconciliation
        Tool).
      key: technology_solutions
      type: List[str]
    - description: Boolean flag for each stage indicating whether the solution is
