      )\n    )\n    role_responsibility_3: List[str] = (\n        Field(..., description=\"\
      Third responsibility for each role\")\n    )\n    role_authority_scope: List[str]\
      \ = (\n        Field(..., description=\"Authority scope for each role\")\n \
      \   )\n\n\ndef outliner_governance_structure(choose_legal_entity_type_input:\
      \ ChooseLegalEntityTypeOutput, **kwargs) -> OutlinerGovernanceStructureOutput:\n\
      \    \"\"\"\n    Creates a governance framework for a hedge fund based on the\
      \ selected legal\n    entity type.\n\n    Parameters\n    ----------\n    legal_entity_type\
      \ : str\n        The legal entity type chosen for the fund (e.g., LP, LLC, SICAV).\n\
      \n    Returns\n    -------\n    dict\n        Dictionary containing five lists:\
      \ role_names, role_responsibility_1,\n        role_responsibility_2, role_responsibility_3,\
      \ and\n        role_authority_scope.\n\n    Raises\n    ------\n    ValueError\n\
      \        If `legal_entity_type` is an empty string or not among the supported\n\
      \        entity types.\n\n    Examples\n    --------\n    >>> outliner_governance_structure('LP')\n\
      \    {\n      'role_names': ['GP', 'Investment Manager', 'Compliance Officer',\
      \ 'Chief\n    Operating Officer', 'Investor Relations Officer'],\n      'role_responsibility_1':\
      \ ['Oversee overall fund strategy', 'Develop trade\n    ideas', 'Ensure regulatory\
      \ compliance', 'Manage day‑to‑day operations',\n    'Maintain investor communications'],\n\
      \      'role_responsibility_2': ['Allocate capital', 'Approve trade execution',\n\
      \    'Monitor AML/KYC', 'Coordinate vendor relationships', 'Distribute\n   \
      \ performance reports'],\n      'role_responsibility_3': ['Set performance targets',\
      \ 'Conduct risk\n    reviews', 'Draft compliance policies', 'Report to board',\
      \ 'Handle investor\n    inquiries'],\n      'role_authority_scope': ['Strategic\
      \ decisions', 'Trade approval up to\n    $10M', 'Compliance approvals', 'Operational\
      \ budgets', 'Investor\n    disclosures']\n    }\n\n    >>> outliner_governance_structure('LLC')\n\
      \    {\n      'role_names': ['GP', 'Investment Manager', 'Compliance Officer',\
      \ 'Chief\n    Financial Officer', 'Investor Relations Officer'],\n      'role_responsibility_1':\
      \ ['Set investment mandate', 'Identify market\n    opportunities', 'Maintain\
      \ regulatory filings', 'Oversee financial\n    reporting', 'Engage investors'],\n\
      \      'role_responsibility_2': ['Allocate capital within limits', 'Approve\n\
      \    execution plans', 'Implement AML controls', 'Manage budgets', 'Provide\n\
      \    performance updates'],\n      'role_responsibility_3': ['Define risk appetite',\
      \ 'Conduct compliance\n    audits', 'Prepare annual reports', 'Ensure tax compliance',\
      \ 'Coordinate\n    investor meetings'],\n      'role_authority_scope': ['Strategic\
      \ direction', 'Trade approvals up to\n    $8M', 'Compliance approvals', 'Financial\
      \ oversight', 'Investor disclosure']\n    }\n\n    \"\"\"\n    legal_entity_type:\
      \ str = choose_legal_entity_type_input.legal_entity_type\n    \n    validate_entity_type(entity_type=legal_entity_type)\n\
      \    \n    role_names: List[str] = generate_role_names(entity_type=legal_entity_type)\n\
