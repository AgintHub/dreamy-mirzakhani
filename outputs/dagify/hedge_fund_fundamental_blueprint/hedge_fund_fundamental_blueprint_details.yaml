dag_type: stub
description: Generated workflow from UI.
name: hedge_fund_fundamental_blueprint
nodes:
  choose_investment_strategy:
    agent: false
    code_node_type: stub
    description: Select primary investment approach
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ClarifyFundObjectivesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for clarify_fund_objectives node outputs.\"\"\"\n    objectives_bullets: List[str]\
      \ = (\n        Field(..., description=\"Bullet points summarizing investment\
      \ purpose, competitive advantages, target return profiles, and long-term vision\
      \ (maximum 8 bullets)\")\n    )\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_investment_strategy node outputs.\"\"\"\
      \n    strategy_category: str = (\n        Field(..., description=\"The chosen\
      \ primary investment strategy category.\")\n    )\n    rationale: str = (\n\
      \        Field(..., description=\"A one-paragraph explanation aligning the strategy\
      \ with the fund's objectives.\")\n    )\n    risk_profile: str = (\n       \
      \ Field(..., description=\"A concise description of the expected risk profile\
      \ associated with the chosen strategy.\")\n    )\n\n\ndef choose_investment_strategy(clarify_fund_objectives_input:\
      \ ClarifyFundObjectivesOutput, **kwargs) -> ChooseInvestmentStrategyOutput:\n\
      \    \"\"\"\n    Selects the primary investment strategy category and generates\
      \ a rationale\n    and risk profile based on the fund's objectives.\n\n    Parameters\n\
      \    ----------\n    objectives_bullets : List[str]\n        Bullet points summarizing\
      \ the fund’s investment purpose, competitive\n        advantages, target return\
      \ profiles, and long-term vision (maximum 8\n        bullets). These are the\
      \ outputs of the parent node\n        `clarify_fund_objectives`.\n\n    Returns\n\
      \    -------\n    Dict[str, str]\n        A dictionary with keys `strategy_category`,\
      \ `rationale`, and\n        `risk_profile`, each mapping to a string describing\
      \ the chosen\n        strategy, its alignment with objectives, and the anticipated\
      \ risk\n        characteristics.\n\n    Raises\n    ------\n    ValueError\n\
      \        Raised if `objectives_bullets` is empty or does not contain any\n \
      \       actionable points.\n    RuntimeError\n        Raised if no suitable\
      \ strategy category can be inferred from the\n        provided objectives.\n\
      \n    Examples\n    --------\n    >>> strategy = choose_investment_strategy(objectives_bullets=[\n\
      \    ...     \"Generate 15% annual gross return through diversified equity\n\
      \    strategies.\",\n    ...     \"Maintain low correlation with global macro\
      \ factors.\",\n    ...     \"Leverage proprietary quantitative models.\",\n\
      \    ...     \"Target a volatility of 8-10%.\",\n    ...     \"Seek alpha in\
      \ both bull and bear markets.\",\n    ...     \"Operate within a liquid asset\
      \ universe.\",\n    ...     \"Aim for a Sharpe ratio above 1.5.\",\n    ...\
      \     \"Focus on long-term capital preservation.\"] )\n    >>> print(strategy['strategy_category'])\n\
      \    >>> print(strategy['rationale'])\n    >>> print(strategy['risk_profile'])\n\
      \    \"Event‑Driven Equity\"\\n\"The fund will focus on exploiting corporate\
      \ event\n    catalysts such as M&A, restructurings, and spin‑offs, leveraging\
      \ its\n    quantitative edge to generate asymmetric returns in both bullish\
      \ and bearish\n    market regimes. This aligns with the objective of producing\
      \ 15% gross annual\n    returns while maintaining low correlation to macro trends.\\\
      n\"The strategy\n    offers medium to high volatility with potential for sharp\
      \ downside during\n    illiquid event periods, but mitigated by strict position\
      \ limits and\n    liquidity buffers. Expected volatility: 8‑10% with drawdown\
      \ controls at\n    25%.\"\n\n    >>> strategy = choose_investment_strategy(objectives_bullets=[\n\
      \    ...     \"Provide long‑term growth for institutional pension funds.\",\n\
      \    ...     \"Capitalize on global macro opportunities.\",\n    ...     \"\
      Maintain a conservative risk appetite.\"] )\n    >>> print(strategy['strategy_category'])\n\
      \    \"Global Macro\"\n\n    \"\"\"\n    return ChooseInvestmentStrategyOutput(\n\
      \        strategy_category=\"\",\n        rationale=\"\",\n        risk_profile=\"\
      \",\n    )"
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen primary investment strategy category.
      key: strategy_category
      type: str
    - description: A one-paragraph explanation aligning the strategy with the fund's
        objectives.
      key: rationale
      type: str
    - description: A concise description of the expected risk profile associated with
        the chosen strategy.
      key: risk_profile
      type: str
    prd:
      conceptual_info: This node determines the flagship investment strategy for the
        hedge fund, ensuring alignment with the fund’s stated objectives, competitive
        positioning, and target return profile.
      docstring:
        examples:
        - lines:
          - strategy = choose_investment_strategy(objectives_bullets=[
          - '    "Generate 15% annual gross return through diversified equity strategies.",'
          - '    "Maintain low correlation with global macro factors.",'
          - '    "Leverage proprietary quantitative models.",'
          - '    "Target a volatility of 8-10%.",'
          - '    "Seek alpha in both bull and bear markets.",'
          - '    "Operate within a liquid asset universe.",'
          - '    "Aim for a Sharpe ratio above 1.5.",'
          - '    "Focus on long-term capital preservation."] )'
          - print(strategy['strategy_category'])
          - print(strategy['rationale'])
          - print(strategy['risk_profile'])
          output: '"Event‑Driven Equity"\n"The fund will focus on exploiting corporate
            event catalysts such as M&A, restructurings, and spin‑offs, leveraging
            its quantitative edge to generate asymmetric returns in both bullish and
            bearish market regimes. This aligns with the objective of producing 15%
            gross annual returns while maintaining low correlation to macro trends.\n"The
            strategy offers medium to high volatility with potential for sharp downside
            during illiquid event periods, but mitigated by strict position limits
            and liquidity buffers. Expected volatility: 8‑10% with drawdown controls
            at 25%."'
        - lines:
          - strategy = choose_investment_strategy(objectives_bullets=[
          - '    "Provide long‑term growth for institutional pension funds.",'
          - '    "Capitalize on global macro opportunities.",'
          - '    "Maintain a conservative risk appetite."] )'
          - print(strategy['strategy_category'])
          output: '"Global Macro"'
        parameters:
        - description: Bullet points summarizing the fund’s investment purpose, competitive
            advantages, target return profiles, and long-term vision (maximum 8 bullets).
            These are the outputs of the parent node `clarify_fund_objectives`.
          name: objectives_bullets
          type: List[str]
        raises:
        - description: Raised if `objectives_bullets` is empty or does not contain
            any actionable points.
          type: ValueError
        - description: Raised if no suitable strategy category can be inferred from
            the provided objectives.
          type: RuntimeError
        returns:
          description: A dictionary with keys `strategy_category`, `rationale`, and
            `risk_profile`, each mapping to a string describing the chosen strategy,
            its alignment with objectives, and the anticipated risk characteristics.
          type: Dict[str, str]
        summary: Selects the primary investment strategy category and generates a
          rationale and risk profile based on the fund's objectives.
    prompt: Identify one primary investment strategy category (e.g., long/short equity,
      event-driven, global macro) and provide a one-paragraph rationale aligning with
      the fund's objectives. Include expected risk profile.
    shims: []
  choose_legal_entity_type:
    agent: false
    code_node_type: stub
    description: Determine appropriate legal structure
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass SelectJurisdictionOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ select_jurisdiction node outputs.\"\"\"\n    chosen_jurisdiction: str = (\n\
      \        Field(..., description=\"The name of the selected fund domicile\")\n\
      \    )\n    advantages: List[str] = (\n        Field(..., description=\"A list\
      \ of two key advantages of the chosen jurisdiction\")\n    )\n    disadvantages:\
      \ List[str] = (\n        Field(..., description=\"A list of two key disadvantages\
      \ of the chosen jurisdiction\")\n    )\n    justification: str = (\n       \
      \ Field(..., description=\"Brief explanation linking the jurisdiction to the\
      \ fund\\u2019s objectives and strategy\")\n    )\n\n\nclass ChooseLegalEntityTypeOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_legal_entity_type node outputs.\"\"\"\n\
      \    legal_entity_type: str = (\n        Field(..., description=\"The chosen\
      \ legal entity type (e.g., LP, LLC, SICAV)\")\n    )\n    operational_advantages:\
      \ List[str] = (\n        Field(..., description=\"List of three operational\
      \ advantages of the chosen legal entity type\")\n    )\n    compliance_consideration:\
      \ str = (\n        Field(..., description=\"One compliance consideration specific\
      \ to the chosen legal entity type\")\n    )\n\n\ndef choose_legal_entity_type(select_jurisdiction_input:\
      \ SelectJurisdictionOutput, **kwargs) -> ChooseLegalEntityTypeOutput:\n    \"\
      \"\"\n    Choose a legal entity type based on the selected jurisdiction and\
      \ provide\n    operational advantages and compliance considerations.\n\n   \
      \ Parameters\n    ----------\n    jurisdiction : str\n        The selected jurisdiction\
      \ (e.g., Cayman Islands, Delaware,\n        Luxembourg)\n\n    Returns\n   \
      \ -------\n    dict\n        A dictionary containing the chosen legal entity\
      \ type, operational\n        advantages, and compliance consideration.\n\n \
      \   Raises\n    ------\n    ValueError\n        If the selected jurisdiction\
      \ is not supported.\n\n    Examples\n    --------\n    >>> choose_legal_entity_type('Cayman\
      \ Islands')\n    >>> # Output: {'legal_entity_type': 'LP', 'operational_advantages':\
      \ ['Tax\n    efficiency', 'Flexibility in ownership structure', 'Limited liability\n\
      \    protection'], 'compliance_consideration': 'Registration with the Cayman\n\
      \    Islands Monetary Authority'}\n    {'legal_entity_type': 'LP', 'operational_advantages':\
      \ ['Tax efficiency',\n    'Flexibility in ownership structure', 'Limited liability\
      \ protection'],\n    'compliance_consideration': 'Registration with the Cayman\
      \ Islands Monetary\n    Authority'}\n\n    \"\"\"\n    return ChooseLegalEntityTypeOutput(\n\
      \        legal_entity_type=\"\",\n        operational_advantages=[],\n     \
      \   compliance_consideration=\"\",\n    )"
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The chosen legal entity type (e.g., LP, LLC, SICAV)
      key: legal_entity_type
      type: str
    - description: List of three operational advantages of the chosen legal entity
        type
      key: operational_advantages
      type: List[str]
    - description: One compliance consideration specific to the chosen legal entity
        type
      key: compliance_consideration
      type: str
    prd:
      conceptual_info: This node determines the most suitable legal entity type for
        a hedge fund based on the selected jurisdiction.
      docstring:
        examples:
        - lines:
          - choose_legal_entity_type('Cayman Islands')
          - '# Output: {''legal_entity_type'': ''LP'', ''operational_advantages'':
            [''Tax efficiency'', ''Flexibility in ownership structure'', ''Limited
            liability protection''], ''compliance_consideration'': ''Registration
            with the Cayman Islands Monetary Authority''}'
          output: '{''legal_entity_type'': ''LP'', ''operational_advantages'': [''Tax
            efficiency'', ''Flexibility in ownership structure'', ''Limited liability
            protection''], ''compliance_consideration'': ''Registration with the Cayman
            Islands Monetary Authority''}'
        parameters:
        - description: The selected jurisdiction (e.g., Cayman Islands, Delaware,
            Luxembourg)
          name: jurisdiction
          type: str
        raises:
        - description: If the selected jurisdiction is not supported.
          type: ValueError
        returns:
          description: A dictionary containing the chosen legal entity type, operational
            advantages, and compliance consideration.
          type: dict
        summary: Choose a legal entity type based on the selected jurisdiction and
          provide operational advantages and compliance considerations.
    prompt: Specify the most suitable legal entity type (e.g., LP, LLC, SICAV) for
      the selected jurisdiction. Provide three operational advantages and one compliance
      consideration specific to this structure.
    shims: []
  clarify_fund_objectives:
    agent: false
    code_node_type: stub
    description: Define core business goals of the hedge fund
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ClarifyFundObjectivesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for clarify_fund_objectives node outputs.\"\"\"\n    objectives_bullets: List[str]\
      \ = (\n        Field(..., description=\"Bullet points summarizing investment\
      \ purpose, competitive advantages, target return profiles, and long-term vision\
      \ (maximum 8 bullets)\")\n    )\n\n\ndef clarify_fund_objectives(general_input:\
      \ str, **kwargs) -> ClarifyFundObjectivesOutput:\n    \"\"\"\n    Generate a\
      \ concise list of up to eight bullet points that articulate the\n    hedge fund’s\
      \ investment purpose, competitive advantages, target return\n    expectations,\
      \ and long‑term vision.\n\n    Parameters\n    ----------\n    prompt_text :\
      \ str\n        Raw textual instruction supplied by the user or orchestrator.\
      \ The\n        function consumes this prompt verbatim to produce the bullet\
      \ list.\n\n    Returns\n    -------\n    Dict[str, List[str]]\n        Dictionary\
      \ with a single key `objectives_bullets` mapping to a list\n        of strings,\
      \ each string being a bullet point.\n\n    Raises\n    ------\n    ValueError\n\
      \        If `prompt_text` is empty or not a string.\n    RuntimeError\n    \
      \    If the generated list exceeds eight bullets or contains non‑string\n  \
      \      elements.\n\n    Examples\n    --------\n    >>> output = clarify_fund_objectives(\"\
      State the primary business objectives\n    for launching the hedge fund. List\
      \ investment purpose, competitive\n    advantages, target return profiles, and\
      \ long‑term vision in concise bullet\n    points (max 8 bullets)\")\n    {'objectives_bullets':\
      \ ['Deliver alpha through long/short equity strategies\n    targeting 20% annual\
      \ gross returns.', 'Leverage proprietary quantitative\n    models for edge in\
      \ volatility forecasting.', 'Maintain a diversified\n    portfolio across U.S.\
      \ and EU markets to mitigate geopolitical risk.', 'Offer\n    transparent fee\
      \ structures to attract family offices.', 'Invest in\n    ESG‑compliant assets\
      \ to align with investor values.', 'Build a scalable\n    technology platform\
      \ to support high‑frequency data analytics.', 'Scale to\n    $500M AUM within\
      \ five years by tapping institutional capital.', 'Commit to a\n    10‑year growth\
      \ roadmap with quarterly performance reviews.']}\n\n    >>> output = clarify_fund_objectives(\"\
      Provide concise objectives for a hedge\n    fund focused on event‑driven opportunities.\"\
      )\n    {'objectives_bullets': ['Capture mispricing from corporate events with\
      \ a 15%\n    gross return target.', 'Utilize a concentrated portfolio of 10‑20\
      \ positions\n    for high conviction.', 'Maintain liquidity through short‑term\
      \ debt and cash\n    reserves.', 'Employ a risk‑parity framework to cap volatility\
      \ at 12%.',\n    'Offer fee‑structured performance incentives to align manager\
      \ and investor\n    interests.', 'Leverage a network of deal partners for early\
      \ access to\n    events.', 'Expand to $250M AUM over three years.', 'Commit\
      \ to ESG compliance\n    and regular third‑party audits.']}\n\n    \"\"\"\n\
      \    return ClarifyFundObjectivesOutput(\n        objectives_bullets=[],\n \
      \   )"
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Bullet points summarizing investment purpose, competitive advantages,
        target return profiles, and long-term vision (maximum 8 bullets)
      key: objectives_bullets
      type: List[str]
    prd:
      conceptual_info: The node gathers and formats the foundational strategic directives
        that guide all subsequent planning stages of the hedge fund.
      docstring:
        examples:
        - lines:
          - output = clarify_fund_objectives("State the primary business objectives
            for launching the hedge fund. List investment purpose, competitive advantages,
            target return profiles, and long‑term vision in concise bullet points
            (max 8 bullets)")
          output: '{''objectives_bullets'': [''Deliver alpha through long/short equity
            strategies targeting 20% annual gross returns.'', ''Leverage proprietary
            quantitative models for edge in volatility forecasting.'', ''Maintain
            a diversified portfolio across U.S. and EU markets to mitigate geopolitical
            risk.'', ''Offer transparent fee structures to attract family offices.'',
            ''Invest in ESG‑compliant assets to align with investor values.'', ''Build
            a scalable technology platform to support high‑frequency data analytics.'',
            ''Scale to $500M AUM within five years by tapping institutional capital.'',
            ''Commit to a 10‑year growth roadmap with quarterly performance reviews.'']}'
        - lines:
          - output = clarify_fund_objectives("Provide concise objectives for a hedge
            fund focused on event‑driven opportunities.")
          output: '{''objectives_bullets'': [''Capture mispricing from corporate events
            with a 15% gross return target.'', ''Utilize a concentrated portfolio
            of 10‑20 positions for high conviction.'', ''Maintain liquidity through
            short‑term debt and cash reserves.'', ''Employ a risk‑parity framework
            to cap volatility at 12%.'', ''Offer fee‑structured performance incentives
            to align manager and investor interests.'', ''Leverage a network of deal
            partners for early access to events.'', ''Expand to $250M AUM over three
            years.'', ''Commit to ESG compliance and regular third‑party audits.'']}'
        parameters:
        - description: Raw textual instruction supplied by the user or orchestrator.
            The function consumes this prompt verbatim to produce the bullet list.
          name: prompt_text
          type: str
        raises:
        - description: If `prompt_text` is empty or not a string.
          type: ValueError
        - description: If the generated list exceeds eight bullets or contains non‑string
            elements.
          type: RuntimeError
        returns:
          description: Dictionary with a single key `objectives_bullets` mapping to
            a list of strings, each string being a bullet point.
          type: Dict[str, List[str]]
        summary: Generate a concise list of up to eight bullet points that articulate
          the hedge fund’s investment purpose, competitive advantages, target return
          expectations, and long‑term vision.
    prompt: State the primary business objectives for launching the hedge fund. List
      investment purpose, competitive advantages, target return profiles, and long-term
      vision in concise bullet points (max 8 bullets)
    shims: []
  compile_pitch_deck_outline:
    agent: false
    code_node_type: stub
    description: Create investor presentation structure
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ClarifyFundObjectivesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for clarify_fund_objectives node outputs.\"\"\"\n    objectives_bullets: List[str]\
      \ = (\n        Field(..., description=\"Bullet points summarizing investment\
      \ purpose, competitive advantages, target return profiles, and long-term vision\
      \ (maximum 8 bullets)\")\n    )\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_investment_strategy node outputs.\"\"\"\
      \n    strategy_category: str = (\n        Field(..., description=\"The chosen\
      \ primary investment strategy category.\")\n    )\n    rationale: str = (\n\
      \        Field(..., description=\"A one-paragraph explanation aligning the strategy\
      \ with the fund's objectives.\")\n    )\n    risk_profile: str = (\n       \
      \ Field(..., description=\"A concise description of the expected risk profile\
      \ associated with the chosen strategy.\")\n    )\n\n\nclass DefineInvestorProfileOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_investor_profile node outputs.\"\"\"\n\
      \    typical_investor_types: List[str] = (\n        Field(..., description=\"\
      List of typical investor types (e.g., family offices, pensions)\")\n    )\n\
      \    required_minimum_investment: int = (\n        Field(..., description=\"\
      Required minimum investment in USD\")\n    )\n    liquidity_expectations: str\
      \ = (\n        Field(..., description=\"Description of liquidity expectations\"\
      )\n    )\n    risk_tolerance_levels: List[str] = (\n        Field(..., description=\"\
      List of risk tolerance levels (e.g., aggressive, conservative)\")\n    )\n \
      \   geographic_focus: str = (\n        Field(..., description=\"Description\
      \ of geographic focus\")\n    )\n\n\nclass SetPerformanceAndRiskTargetsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_performance_and_risk_targets node outputs.\"\
      \"\"\n    metric_names: List[str] = (\n        Field(..., description=\"Names\
      \ of the performance and risk metrics (e.g., Gross Return, Volatility, Sharpe\
      \ Ratio, Max Drawdown).\")\n    )\n    target_values: List[float] = (\n    \
      \    Field(..., description=\"Numerical target values corresponding to each\
      \ metric (e.g., 0.15 for 15% gross return, 0.10 for 10% volatility).\")\n  \
      \  )\n    rationale_texts: List[str] = (\n        Field(..., description=\"\
      Brief rationale for each target, explaining how it aligns with strategy and\
      \ risk appetite.\")\n    )\n\n\nclass EstimateSetupAndOperatingCostsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for estimate_setup_and_operating_costs node outputs.\"\
      \"\"\n    service_provider_name: List[str] = (\n        Field(..., description=\"\
      Names of the service providers or cost categories\")\n    )\n    monthly_cost:\
      \ List[float] = (\n        Field(..., description=\"Monthly cost in USD for\
      \ each service provider\")\n    )\n    annual_total: List[float] = (\n     \
      \   Field(..., description=\"Annual total cost in USD for each service provider\
      \ (Monthly Cost \\u00d7 12)\")\n    )\n    total_monthly_budget: float = (\n\
      \        Field(..., description=\"Sum of all monthly costs across providers\"\
      )\n    )\n    total_annual_budget: float = (\n        Field(..., description=\"\
      Sum of all annual totals across providers\")\n    )\n    line_item_count: int\
      \ = (\n        Field(..., description=\"Number of line items included in the\
      \ cost matrix (typically 10\\u201115)\")\n    )\n    budget_overview: str =\
      \ (\n        Field(..., description=\"Short textual summary of the overall budget,\
      \ highlighting major cost drivers\")\n    )\n\n\nclass DesignRiskManagementFrameworkOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for design_risk_management_framework node outputs.\"\
      \"\"\n    num_quant_controls: int = (\n        Field(..., description=\"Number\
      \ of quantifiable risk controls specified\")\n    )\n    quant_controls_desc:\
      \ List[str] = (\n        Field(..., description=\"Descriptions of each quantifiable\
      \ risk control\")\n    )\n    num_qual_practices: int = (\n        Field(...,\
      \ description=\"Number of qualitative risk practices specified\")\n    )\n \
      \   qual_practices_desc: List[str] = (\n        Field(..., description=\"Descriptions\
      \ of each qualitative risk practice\")\n    )\n\n\nclass DraftOperationsWorkflowOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for draft_operations_workflow node outputs.\"\"\"\n\
      \    stages: List[str] = (\n        Field(..., description=\"Ordered list of\
      \ operational stages from idea generation to settlement\")\n    )\n    responsible_parties:\
      \ List[str] = (\n        Field(..., description=\"Corresponding responsible\
      \ party for each stage (e.g., \\\"In-house\\\", \\\"Prime Broker\\\")\")\n \
      \   )\n    vendor_involved: List[bool] = (\n        Field(..., description=\"\
      Boolean flag per stage indicating whether a vendor is involved (true = vendor,\
      \ false = in-house)\")\n    )\n    stage_descriptions: List[str] = (\n     \
      \   Field(..., description=\"Brief description of activities performed in each\
      \ stage\")\n    )\n\n\nclass CompilePitchDeckOutlineOutput(BaseModel):\n   \
      \ \"\"\"Pydantic model for compile_pitch_deck_outline node outputs.\"\"\"\n\
      \    slide_titles: List[str] = (\n        Field(..., description=\"List of slide\
      \ titles in the presentation\")\n    )\n    core_messages: List[str] = (\n \
      \       Field(..., description=\"List of core messages for each slide\")\n \
      \   )\n    objectives_summary: str = (\n        Field(..., description=\"Summary\
      \ of the objectives slides\")\n    )\n    strategy_overview: str = (\n     \
      \   Field(..., description=\"Overview of the strategy slides\")\n    )\n   \
      \ risk_return_analysis: str = (\n        Field(..., description=\"Summary of\
      \ the risk-return analysis slide\")\n    )\n    team_description: str = (\n\
      \        Field(..., description=\"Description of the team slide\")\n    )\n\
      \    operations_compliance_summary: str = (\n        Field(..., description=\"\
      Summary of the operations/compliance slides\")\n    )\n    financials_summary:\
      \ str = (\n        Field(..., description=\"Summary of the financials slides\"\
      )\n    )\n    qa_topics: List[str] = Field(..., description=\"List of Q&A topics\"\
      )\n\n\ndef compile_pitch_deck_outline(clarify_fund_objectives_input: ClarifyFundObjectivesOutput,\
      \ choose_investment_strategy_input: ChooseInvestmentStrategyOutput, define_investor_profile_input:\
      \ DefineInvestorProfileOutput, set_performance_and_risk_targets_input: SetPerformanceAndRiskTargetsOutput,\
      \ estimate_setup_and_operating_costs_input: EstimateSetupAndOperatingCostsOutput,\
      \ design_risk_management_framework_input: DesignRiskManagementFrameworkOutput,\
      \ draft_operations_workflow_input: DraftOperationsWorkflowOutput, **kwargs)\
      \ -> CompilePitchDeckOutlineOutput:\n    \"\"\"\n    Compile a comprehensive\
      \ outline for a 15-slide investor pitch deck,\n    integrating insights from\
      \ fund objectives, investment strategy, risk\n    management, and operational\
      \ compliance.\n\n    Parameters\n    ----------\n    objectives : List[str]\n\
      \        List of bullet points summarizing investment purpose, competitive\n\
      \        advantages, target return profiles, and long-term vision.\n    strategy\
      \ : str\n        Chosen primary investment strategy category.\n    investor_profile\
      \ : Dict[str, str]\n        Dictionary containing typical investor types, required\
      \ minimum\n        investments, liquidity expectations, risk tolerance levels,\
      \ and\n        geographic focus.\n    performance_targets : List[float]\n  \
      \      Numerical target values for performance metrics such as gross\n     \
      \   return, volatility, Sharpe ratio, and maximum drawdown tolerance.\n    operating_costs\
      \ : List[float]\n        List of monthly costs in USD for each service provider,\
