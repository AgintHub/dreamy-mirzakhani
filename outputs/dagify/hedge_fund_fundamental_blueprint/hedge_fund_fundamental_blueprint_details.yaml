            type: ValueError
          - description: When the input objectives bullets are not a string.
            type: TypeError
          returns:
            description: Output message indicating the validation result.
            type: str
          summary: Validates the input objectives bullets to ensure they meet the
            required criteria.
      prompt: validate_objectives_bullets
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Parses a string of investment objectives into a structured dictionary.
      implementation: "def parse_investment_objectives(objectives_bullets: str) ->\
        \ str:\n    \"\"\"\n    Parses a string of investment objectives into a structured\
        \ dictionary.\n\n    Parameters\n    ----------\n    objectives_bullets :\
        \ str\n        A string of bullet points summarizing investment objectives.\n\
        \n    Returns\n    -------\n    dict\n        A dictionary representing the\
        \ parsed investment objectives.\n\n    Raises\n    ------\n    ValueError\n\
        \        When the input string is not a valid list of bullet points.\n   \
        \ TypeError\n        When the input is not a string.\n\n    Examples\n   \
        \ --------\n    >>> parse_investment_objectives(objectives_bullets='* Objective\
        \ 1\\n*\n    Objective 2')\n    {'objective_1': 'description', 'objective_2':\
        \ 'description'}\n\n    >>> parse_investment_objectives(objectives_bullets='')\n\
        \    {}\n\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub\
        \ node that needs to be implemented\")"
      name: parse_investment_objectives
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: objectives_bullets
        type: str
      prd:
        conceptual_info: The parse_investment_objectives shim function takes a string
          of bullet points representing investment objectives and returns a structured
          dictionary representing these objectives.
        docstring:
          examples:
          - lines:
            - parse_investment_objectives(objectives_bullets='* Objective 1\n* Objective
              2')
            output: '{''objective_1'': ''description'', ''objective_2'': ''description''}'
          - lines:
            - parse_investment_objectives(objectives_bullets='')
            output: '{}'
          parameters:
          - description: A string of bullet points summarizing investment objectives.
            name: objectives_bullets
            type: str
          raises:
          - description: When the input string is not a valid list of bullet points.
            type: ValueError
          - description: When the input is not a string.
            type: TypeError
          returns:
            description: A dictionary representing the parsed investment objectives.
            type: dict
          summary: Parses a string of investment objectives into a structured dictionary.
      prompt: Parse investment objectives from a string of bullet points into a structured
        dictionary.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Determines the primary investment strategy category based on the
        parsed fund objectives.
      implementation: "def determine_strategy_category(parsed_objectives: str) ->\
        \ str:\n    \"\"\"\n    Determines the primary investment strategy category\
        \ based on the provided\n    parsed fund objectives.\n\n    Parameters\n \
        \   ----------\n    parsed_objectives : str\n        A string representation\
        \ of the parsed fund objectives, which should\n        contain relevant information\
        \ about the fund's goals and\n        requirements.\n\n    Returns\n    -------\n\
        \    str\n        The determined primary investment strategy category, which\
        \ should be\n        a clear and concise string describing the chosen strategy.\n\
        \n    Raises\n    ------\n    ValueError\n        When the input parsed objectives\
        \ are invalid or incomplete.\n    TypeError\n        When the input type is\
        \ incorrect.\n\n    Examples\n    --------\n    >>> determine_strategy_category(parsed_objectives='{\"\
        objective\": \"growth\"}')\n    \"growth\"\n\n    >>> determine_strategy_category(parsed_objectives='{\"\
        objective\": \"income\"}')\n    \"income\"\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: determine_strategy_category
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: parsed_objectives
        type: str
      prd:
        conceptual_info: This shim function plays a crucial role in determining the
          primary investment strategy category based on the parsed fund objectives,
          which is then used to inform the overall investment strategy.
        docstring:
          examples:
          - lines:
            - 'determine_strategy_category(parsed_objectives=''{"objective": "growth"}'')'
            output: '"growth"'
          - lines:
            - 'determine_strategy_category(parsed_objectives=''{"objective": "income"}'')'
            output: '"income"'
          parameters:
          - description: A string representation of the parsed fund objectives, which
              should contain relevant information about the fund's goals and requirements.
            name: parsed_objectives
            type: str
          raises:
          - description: When the input parsed objectives are invalid or incomplete.
            type: ValueError
          - description: When the input type is incorrect.
            type: TypeError
          returns:
            description: The determined primary investment strategy category, which
              should be a clear and concise string describing the chosen strategy.
            type: str
          summary: Determines the primary investment strategy category based on the
            provided parsed fund objectives.
      prompt: Determine the primary investment strategy category based on the provided
        parsed fund objectives.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim generates a rationale explaining the alignment of a chosen
        investment strategy with the fund's objectives.
      implementation: "def generate_strategy_rationale(strategy_category: str, objectives:\
        \ str) -> str:\n    \"\"\"\n    This function generates a rationale for a\
        \ chosen investment strategy based\n    on the fund's objectives, providing\
        \ a clear explanation for the alignment\n    between the strategy and the\
        \ objectives.\n\n    Parameters\n    ----------\n    strategy_category : str\n\
        \        The primary category of the investment strategy (e.g., growth,\n\
        \        value, dividend).\n    objectives : str\n        The objectives of\
        \ the fund, which could include return targets, risk\n        tolerance, and\
        \ investment horizon.\n\n    Returns\n    -------\n    str\n        A well-structured\
        \ paragraph explaining how the chosen strategy\n        aligns with the fund's\
        \ objectives, including its potential to meet\n        return targets, manage\
        \ risk, and fulfill the investment horizon.\n\n    Raises\n    ------\n  \
        \  ValueError\n        If the input strategy category or objectives are not\
        \ valid or are\n        missing critical information.\n    TypeError\n   \
        \     If the input parameters are not of the correct type (e.g.,\n       \
        \ strategy_category or objectives are not strings).\n\n    Examples\n    --------\n\
        \    >>> rationale = generate_strategy_rationale(strategy_category='growth',\n\
        \    objectives='high returns with moderate risk')\n    >>> print(rationale)\n\
        \    'The growth strategy is chosen to achieve high returns with moderate\
        \ risk,\n    focusing on investments with potential for long-term capital\
        \ appreciation.'\n\n    >>> rationale = generate_strategy_rationale(strategy_category='dividend',\n\
        \    objectives='steady income with low risk')\n    >>> print(rationale)\n\
        \    'The dividend strategy is selected to provide a steady income stream\
        \ with\n    low risk, investing in established companies with a history of\
        \ consistent\n    dividend payments.'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: generate_strategy_rationale
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: strategy_category
        type: str
      - description: Input parameter of type str
        key: objectives
        type: str
      prd:
        conceptual_info: This shim plays a crucial role in explaining the reasoning
