      prompt: Assess the risk profile for the given strategy category and objectives.
      shims: []
  choose_legal_entity_type:
    agent: false
    code_node_type: stub
    description: Determine appropriate legal structure
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass SelectJurisdictionOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ select_jurisdiction node outputs.\"\"\"\n    chosen_jurisdiction: str = (\n\
      \        Field(..., description=\"The name of the selected fund domicile\")\n\
      \    )\n    advantages: List[str] = (\n        Field(..., description = (\n\
      \            \"A list of two key advantages of the chosen jurisdiction\")\n\
      \        )\n    )\n    disadvantages: List[str] = (\n        Field(..., description\
      \ = (\n            \"A list of two key disadvantages of the chosen jurisdiction\"\
      )\n        )\n    )\n    justification: str = (\n        Field(..., description\
      \ = (\n            \"Brief explanation linking the jurisdiction to the fund\\\
      u2019s objectives and strategy\")\n        )\n    )\n\n\nclass ChooseLegalEntityTypeOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_legal_entity_type node outputs.\"\"\"\n\
      \    legal_entity_type: str = (\n        Field(..., description = (\n      \
      \      \"The chosen legal entity type (e.g., LP, LLC, SICAV)\")\n        )\n\
      \    )\n    operational_advantages: List[str] = (\n        Field(..., description\
      \ = (\n            \"List of three operational advantages of the chosen legal\
      \ entity type\")\n        )\n    )\n    compliance_consideration: str = (\n\
      \        Field(..., description = (\n            \"One compliance consideration\
      \ specific to the chosen legal entity type\")\n        )\n    )\n\n\ndef choose_legal_entity_type(select_jurisdiction_input:\
      \ SelectJurisdictionOutput, **kwargs) -> ChooseLegalEntityTypeOutput:\n    \"\
      \"\"\n    Choose a legal entity type based on the selected jurisdiction and\
      \ provide\n    operational advantages and compliance considerations.\n\n   \
      \ Parameters\n    ----------\n    jurisdiction : str\n        The selected jurisdiction\
      \ (e.g., Cayman Islands, Delaware,\n        Luxembourg)\n\n    Returns\n   \
      \ -------\n    dict\n        A dictionary containing the chosen legal entity\
      \ type, operational\n        advantages, and compliance consideration.\n\n \
