  list_service_providers:
    agent: false
    code_node_type: shim
    description: Compile third-party vendor requirements
    implementation: "from ._list_service_providers.validate_entity_type import validate_entity_type\n\
      from ._list_service_providers.get_provider_mapping_for_entity import get_provider_mapping_for_entity\n\
      from ._list_service_providers.extract_ordered_provider_names import extract_ordered_provider_names\n\
      from ._list_service_providers.extract_provider_functions import extract_provider_functions\n\
      from ._list_service_providers.validate_provider_completeness import validate_provider_completeness\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ ChooseLegalEntityTypeOutput(BaseModel):\n    \"\"\"Pydantic model for choose_legal_entity_type\
      \ node outputs.\"\"\"\n    legal_entity_type: str = (\n        Field(..., description\
      \ = (\n            \"The chosen legal entity type (e.g., LP, LLC, SICAV)\")\n\
      \        )\n    )\n    operational_advantages: List[str] = (\n        Field(...,\
      \ description = (\n            \"List of three operational advantages of the\
      \ chosen legal entity type\")\n        )\n    )\n    compliance_consideration:\
      \ str = (\n        Field(..., description = (\n            \"One compliance\
      \ consideration specific to the chosen legal entity type\")\n        )\n   \
      \ )\n\n\nclass ListServiceProvidersOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for list_service_providers node outputs.\"\"\"\n    provider_names: List[str]\
      \ = (\n        Field(..., description = (\n            \"List of mandatory external\
      \ service provider names in the order: prime broker, custodian, fund administrator,\
      \ legal counsel, compliance consultant.\")\n        )\n    )\n    provider_functions:\
      \ List[str] = (\n        Field(..., description = (\n            \"Core function\
      \ description for each provider, matching the order of provider_names.\")\n\
      \        )\n    )\n\n\ndef list_service_providers(choose_legal_entity_type_input:\
      \ ChooseLegalEntityTypeOutput, **kwargs) -> ListServiceProvidersOutput:\n  \
      \  \"\"\"\n    Generate an ordered list of mandatory external service providers\
      \ and their\n    core functions.\n\n    Parameters\n    ----------\n    legal_entity_type\
      \ : str\n        The chosen legal entity type (e.g., LP, LLC, SICAV) obtained\
      \ from\n        the `choose_legal_entity_type` node.\n\n    Returns\n    -------\n\
      \    dict\n        A dictionary with two keys: `provider_names` (List[str])\
      \ and\n        `provider_functions` (List[str]). Both lists are aligned so that\n\
      \        index *i* in `provider_names` corresponds to index *i* in\n       \
      \ `provider_functions`.\n\n    Raises\n    ------\n    ValueError\n        Raised\
      \ if `legal_entity_type` is empty or not one of the supported\n        entity\
      \ types.\n    KeyError\n        Raised if the internal mapping for the given\
      \ entity type does not\n        contain entries for all required providers.\n\
      \n    Examples\n    --------\n    >>> output = list_service_providers('LP')\n\
      \    >>> print(output['provider_names'])\n    >>> print(output['provider_functions'])\n\
      \    [\"Prime Broker\", \"Custodian\", \"Fund Administrator\", \"Legal Counsel\"\
      ,\n    \"Compliance Consultant\"]\\n[\"Facilitates trade execution and margin\n\
      \    management.\", \"Safeguards assets and provides custody services.\", \"\
      Handles\n    NAV calculation, investor reporting, and fund accounting.\", \"\
      Provides legal\n    structuring and regulatory compliance advice.\", \"Assesses\
      \ and implements AML\n    and other compliance policies.\"]\n\n    >>> output\
      \ = list_service_providers('SICAV')\n    >>> print(output['provider_functions'][2])\n\
      \    \"Handles NAV calculation, investor reporting, and fund accounting.\"\n\
      \n    \"\"\"\n    legal_entity_type: str = choose_legal_entity_type_input.legal_entity_type\n\
      \    validate_entity_type(entity_type=legal_entity_type)\n    provider_mapping:\
      \ dict = get_provider_mapping_for_entity(entity_type=legal_entity_type)\n  \
      \  ordered_providers: List[str] = extract_ordered_provider_names(mapping=provider_mapping)\n\
      \    provider_functions: List[str] = extract_provider_functions(mapping=provider_mapping,\
      \ providers=ordered_providers)\n    validate_provider_completeness(providers=ordered_providers,\
      \ functions=provider_functions)\n    return ListServiceProvidersOutput(\n  \
      \      provider_names=ordered_providers,\n        provider_functions=provider_functions,\n\
      \    )"
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: 'List of mandatory external service provider names in the order:
        prime broker, custodian, fund administrator, legal counsel, compliance consultant.'
      key: provider_names
      type: List[str]
    - description: Core function description for each provider, matching the order
        of provider_names.
      key: provider_functions
      type: List[str]
    prd:
      conceptual_info: The node generates a concise, ordered checklist of essential
