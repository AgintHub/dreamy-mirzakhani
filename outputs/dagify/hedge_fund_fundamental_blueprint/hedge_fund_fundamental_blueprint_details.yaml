          - '    "Confirm settlements with custodians and counterparties."]'
          - result = define_technology_stack(workflow_stages, stage_descriptions)
          - print(result)
          output: "{\n  \"workflow_stages\": [\"Idea Generation\", \"Signal Generation\"\
            , \"Order Entry\", \"Execution Management\", \"Position Monitoring\",\
            \ \"Reconciliation\", \"Settlement\"],\n  \"technology_solutions\": [\"\
            Data Analytics Platform\", \"Quant Model Engine\", \"Order Management\
            \ System\", \"FIX Gateway\", \"Risk Engine\", \"Reconciliation Tool\"\
            , \"Settlement Service\"],\n  \"vendor_in_house_flags\": [true, true,\
