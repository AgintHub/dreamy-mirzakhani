            name: strategy_category
            type: str
          - description: The investment objectives to consider when assessing the
              risk profile.
            name: objectives
            type: str
          raises:
          - description: When the strategy category or objectives are invalid or empty.
            type: ValueError
          - description: When the strategy category or objectives are of incorrect
