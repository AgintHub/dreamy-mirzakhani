    code_node_type: stub
    description: Specify system infrastructure requirements
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DraftOperationsWorkflowOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for draft_operations_workflow node outputs.\"\"\"\n    stages: List[str] =\
      \ (\n        Field(..., description = (\n            \"Ordered list of operational\
      \ stages from idea generation to settlement\")\n        )\n    )\n    responsible_parties:\
      \ List[str] = (\n        Field(..., description = (\n            \"Corresponding\
      \ responsible party for each stage (e.g., \"In-house\", \"Prime Broker\")\"\
      )\n        )\n    )\n    vendor_involved: List[bool] = (\n        Field(...,\
      \ description = (\n            \"Boolean flag per stage indicating whether a\
      \ vendor is involved (true = vendor, false = in-house)\")\n        )\n    )\n\
      \    stage_descriptions: List[str] = (\n        Field(..., description = (\n\
      \            \"Brief description of activities performed in each stage\")\n\
      \        )\n    )\n\n\nclass DefineTechnologyStackOutput(BaseModel):\n    \"\
      \"\"Pydantic model for define_technology_stack node outputs.\"\"\"\n    workflow_stages:\
      \ List[str] = (\n        Field(..., description = (\n            \"Ordered list\
      \ of workflow stages (e.g., Idea Generation, Signal Generation, Order Entry,\
      \ Execution Management, Position Monitoring, Reconciliation, Settlement).\"\
      )\n        )\n    )\n    technology_solutions: List[str] = (\n        Field(...,\
      \ description = (\n            \"Corresponding technology solution for each\
      \ stage (e.g., Data Analytics Platform, Portfolio Management System, OMS, FIX\
      \ Gateway, Risk Engine, Reconciliation Tool).\")\n        )\n    )\n    vendor_in_house_flags:\
      \ List[bool] = (\n        Field(..., description = (\n            \"Boolean\
      \ flag for each stage indicating whether the solution is implemented in-house\
      \ (true) or outsourced to a vendor (false).\")\n        )\n    )\n\n\ndef define_technology_stack(draft_operations_workflow_input:\
      \ DraftOperationsWorkflowOutput, **kwargs) -> DefineTechnologyStackOutput:\n\
      \    \"\"\"\n    Generate a technology stack mapping for the hedge fund’s operational\n\
      \    workflow.\n\n    Parameters\n    ----------\n    workflow_stages : List[str]\n\
      \        Ordered list of workflow stages as produced by\n        `draft_operations_workflow`.\n\
      \    stage_descriptions : List[str]\n        Brief description of activities\
      \ performed in each stage (used for\n        contextual mapping).\n\n    Returns\n\
      \    -------\n    Dict[str, List[Any]]\n        A dictionary containing three\
      \ keys: - `workflow_stages` (List[str])\n        - `technology_solutions` (List[str])\
      \ - `vendor_in_house_flags`\n        (List[bool])\n\n    Raises\n    ------\n\
      \    ValueError\n        If the length of `workflow_stages` and `stage_descriptions`\
      \ do not\n        match.\n    KeyError\n        If a known workflow stage is\
      \ not present in the internal mapping.\n\n    Examples\n    --------\n    >>>\
      \ workflow_stages = [\"Idea Generation\", \"Signal Generation\", \"Order\n \
      \   Entry\", \"Execution Management\", \"Position Monitoring\", \"Reconciliation\"\
      ,\n    \"Settlement\"],\n    >>> stage_descriptions = [\n    ...     \"Generate\
      \ investment ideas via research and data analysis.\",\n    ...     \"Generate\
      \ buy/sell signals from quantitative models.\",\n    ...     \"Create order\
      \ records in the OMS.\",\n    ...     \"Route orders to market via FIX gateway.\"\
      ,\n    ...     \"Track open positions and P&L.\",\n    ...     \"Automated P&L\
      \ and trade reconciliation.\",\n    ...     \"Confirm settlements with custodians\
      \ and counterparties.\"]\n    >>> result = define_technology_stack(workflow_stages,\
      \ stage_descriptions)\n    >>> print(result)\n    {\n      \"workflow_stages\"\
      : [\"Idea Generation\", \"Signal Generation\", \"Order Entry\",\n    \"Execution\
      \ Management\", \"Position Monitoring\", \"Reconciliation\",\n    \"Settlement\"\
      ],\n      \"technology_solutions\": [\"Data Analytics Platform\", \"Quant Model\
      \ Engine\",\n    \"Order Management System\", \"FIX Gateway\", \"Risk Engine\"\
      , \"Reconciliation\n    Tool\", \"Settlement Service\"],\n      \"vendor_in_house_flags\"\
      : [true, true, false, false, true, false, false]\n    }\n\n    >>> # Using a\
      \ shortened workflow workflow_stages = [\"Signal Generation\",\n    \"Order\
      \ Entry\", \"Execution Management\"],\n    >>> stage_descriptions = [\n    ...\
      \     \"Generate buy/sell signals.\",\n    ...     \"Create orders.\",\n   \
      \ ...     \"Route to market.\"]\n    >>> print(define_technology_stack(workflow_stages,\
      \ stage_descriptions))\n    {\n      \"workflow_stages\": [\"Signal Generation\"\
      , \"Order Entry\", \"Execution\n    Management\"],\n      \"technology_solutions\"\
      : [\"Quant Model Engine\", \"Order Management System\",\n    \"FIX Gateway\"\
      ],\n      \"vendor_in_house_flags\": [true, false, false]\n    }\n\n    \"\"\
      \"\n    return DefineTechnologyStackOutput(\n        workflow_stages=[],\n \
      \       technology_solutions=[],\n        vendor_in_house_flags=[],\n    )"
    name: define_technology_stack
    nodes_depended_on:
