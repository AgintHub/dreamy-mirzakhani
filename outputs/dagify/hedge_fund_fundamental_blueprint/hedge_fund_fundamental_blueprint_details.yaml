dag_type: shim
description: Generated workflow from UI.
name: hedge_fund_fundamental_blueprint
nodes:
  choose_investment_strategy:
    agent: false
    code_node_type: shim
    description: Select primary investment approach
    implementation: "from ._choose_investment_strategy.validate_objectives_bullets\
      \ import validate_objectives_bullets\nfrom ._choose_investment_strategy.parse_investment_objectives\
      \ import parse_investment_objectives\nfrom ._choose_investment_strategy.determine_strategy_category\
      \ import determine_strategy_category\nfrom ._choose_investment_strategy.generate_strategy_rationale\
      \ import generate_strategy_rationale\nfrom ._choose_investment_strategy.assess_risk_profile\
      \ import assess_risk_profile\n\nfrom pydantic import BaseModel, Field\nfrom\
      \ typing import List\n\n\nclass ClarifyFundObjectivesOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for clarify_fund_objectives node outputs.\"\"\"\n  \
      \  objectives_bullets: List[str] = (\n        Field(..., description = (\n \
      \           \"Bullet points summarizing investment purpose, competitive advantages,\
      \ target return profiles, and long-term vision (maximum 8 bullets)\")\n    \
      \    )\n    )\n\n\nclass ChooseInvestmentStrategyOutput(BaseModel):\n    \"\"\
      \"Pydantic model for choose_investment_strategy node outputs.\"\"\"\n    strategy_category:\
      \ str = (\n        Field(..., description = (\n            \"The chosen primary\
      \ investment strategy category.\")\n        )\n    )\n    rationale: str = (\n\
      \        Field(..., description = (\n            \"A one-paragraph explanation\
      \ aligning the strategy with the fund's objectives.\")\n        )\n    )\n \
      \   risk_profile: str = (\n        Field(..., description = (\n            \"\
      A concise description of the expected risk profile associated with the chosen\
      \ strategy.\")\n        )\n    )\n\n\ndef choose_investment_strategy(clarify_fund_objectives_input:\
      \ ClarifyFundObjectivesOutput, **kwargs) -> ChooseInvestmentStrategyOutput:\n\
      \    \"\"\"\n    Selects the primary investment strategy category and generates\
      \ a rationale\n    and risk profile based on the fund's objectives.\n\n    Parameters\n\
      \    ----------\n    objectives_bullets : List[str]\n        Bullet points summarizing\
      \ the fund’s investment purpose, competitive\n        advantages, target return\
      \ profiles, and long-term vision (maximum 8\n        bullets). These are the\
      \ outputs of the parent node\n        `clarify_fund_objectives`.\n\n    Returns\n\
      \    -------\n    Dict[str, str]\n        A dictionary with keys `strategy_category`,\
      \ `rationale`, and\n        `risk_profile`, each mapping to a string describing\
      \ the chosen\n        strategy, its alignment with objectives, and the anticipated\
      \ risk\n        characteristics.\n\n    Raises\n    ------\n    ValueError\n\
      \        Raised if `objectives_bullets` is empty or does not contain any\n \
      \       actionable points.\n    RuntimeError\n        Raised if no suitable\
      \ strategy category can be inferred from the\n        provided objectives.\n\
      \n    Examples\n    --------\n    >>> strategy = choose_investment_strategy(objectives_bullets=[\n\
      \    ...     \"Generate 15% annual gross return through diversified equity\n\
      \    strategies.\",\n    ...     \"Maintain low correlation with global macro\
      \ factors.\",\n    ...     \"Leverage proprietary quantitative models.\",\n\
      \    ...     \"Target a volatility of 8-10%.\",\n    ...     \"Seek alpha in\
      \ both bull and bear markets.\",\n    ...     \"Operate within a liquid asset\
      \ universe.\",\n    ...     \"Aim for a Sharpe ratio above 1.5.\",\n    ...\
      \     \"Focus on long-term capital preservation.\"] )\n    >>> print(strategy['strategy_category'])\n\
      \    >>> print(strategy['rationale'])\n    >>> print(strategy['risk_profile'])\n\
      \    \"Event‑Driven Equity\"\\n\"The fund will focus on exploiting corporate\
      \ event\n    catalysts such as M&A, restructurings, and spin‑offs, leveraging\
      \ its\n    quantitative edge to generate asymmetric returns in both bullish\
      \ and bearish\n    market regimes. This aligns with the objective of producing\
      \ 15% gross annual\n    returns while maintaining low correlation to macro trends.\\\
      n\"The strategy\n    offers medium to high volatility with potential for sharp\
      \ downside during\n    illiquid event periods, but mitigated by strict position\
      \ limits and\n    liquidity buffers. Expected volatility: 8‑10% with drawdown\
      \ controls at\n    25%.\"\n\n    >>> strategy = choose_investment_strategy(objectives_bullets=[\n\
      \    ...     \"Provide long‑term growth for institutional pension funds.\",\n\
      \    ...     \"Capitalize on global macro opportunities.\",\n    ...     \"\
      Maintain a conservative risk appetite.\"] )\n    >>> print(strategy['strategy_category'])\n\
      \    \"Global Macro\"\n\n    \"\"\"\n    objectives_bullets = clarify_fund_objectives_input.objectives_bullets\n\
      \    \n    validate_objectives_bullets(objectives_bullets=objectives_bullets)\n\
      \    \n    parsed_objectives: dict = parse_investment_objectives(objectives_bullets=objectives_bullets)\n\
      \    \n    strategy_category: str = determine_strategy_category(parsed_objectives=parsed_objectives)\n\
      \    \n    rationale: str = generate_strategy_rationale(strategy_category=strategy_category,\
      \ objectives=parsed_objectives)\n    \n    risk_profile: str = assess_risk_profile(strategy_category=strategy_category,\
      \ objectives=parsed_objectives)\n    \n    return ChooseInvestmentStrategyOutput(\n\
      \        strategy_category=strategy_category,\n        rationale=rationale,\n\
      \        risk_profile=risk_profile\n    )"
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen primary investment strategy category.
      key: strategy_category
      type: str
    - description: A one-paragraph explanation aligning the strategy with the fund's
        objectives.
      key: rationale
      type: str
    - description: A concise description of the expected risk profile associated with
        the chosen strategy.
      key: risk_profile
      type: str
    prd:
      conceptual_info: This node determines the flagship investment strategy for the
        hedge fund, ensuring alignment with the fund’s stated objectives, competitive
        positioning, and target return profile.
      docstring:
        examples:
        - lines:
          - strategy = choose_investment_strategy(objectives_bullets=[
          - '    "Generate 15% annual gross return through diversified equity strategies.",'
          - '    "Maintain low correlation with global macro factors.",'
          - '    "Leverage proprietary quantitative models.",'
          - '    "Target a volatility of 8-10%.",'
          - '    "Seek alpha in both bull and bear markets.",'
          - '    "Operate within a liquid asset universe.",'
          - '    "Aim for a Sharpe ratio above 1.5.",'
          - '    "Focus on long-term capital preservation."] )'
          - print(strategy['strategy_category'])
          - print(strategy['rationale'])
          - print(strategy['risk_profile'])
          output: '"Event‑Driven Equity"\n"The fund will focus on exploiting corporate
            event catalysts such as M&A, restructurings, and spin‑offs, leveraging
            its quantitative edge to generate asymmetric returns in both bullish and
            bearish market regimes. This aligns with the objective of producing 15%
            gross annual returns while maintaining low correlation to macro trends.\n"The
            strategy offers medium to high volatility with potential for sharp downside
            during illiquid event periods, but mitigated by strict position limits
            and liquidity buffers. Expected volatility: 8‑10% with drawdown controls
            at 25%."'
        - lines:
          - strategy = choose_investment_strategy(objectives_bullets=[
          - '    "Provide long‑term growth for institutional pension funds.",'
          - '    "Capitalize on global macro opportunities.",'
          - '    "Maintain a conservative risk appetite."] )'
          - print(strategy['strategy_category'])
          output: '"Global Macro"'
        parameters:
        - description: Bullet points summarizing the fund’s investment purpose, competitive
            advantages, target return profiles, and long-term vision (maximum 8 bullets).
            These are the outputs of the parent node `clarify_fund_objectives`.
          name: objectives_bullets
          type: List[str]
        raises:
        - description: Raised if `objectives_bullets` is empty or does not contain
            any actionable points.
          type: ValueError
        - description: Raised if no suitable strategy category can be inferred from
            the provided objectives.
          type: RuntimeError
        returns:
          description: A dictionary with keys `strategy_category`, `rationale`, and
            `risk_profile`, each mapping to a string describing the chosen strategy,
            its alignment with objectives, and the anticipated risk characteristics.
          type: Dict[str, str]
        summary: Selects the primary investment strategy category and generates a
          rationale and risk profile based on the fund's objectives.
    prompt: Identify one primary investment strategy category (e.g., long/short equity,
      event-driven, global macro) and provide a one-paragraph rationale aligning with
      the fund's objectives. Include expected risk profile.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates the input objectives bullets to ensure they meet the
        required criteria.
      implementation: "def validate_objectives_bullets(objectives_bullets: str) ->\
        \ str:\n    \"\"\"\n    Validates the input objectives bullets to ensure they\
        \ meet the required\n    criteria.\n\n    Parameters\n    ----------\n   \
        \ objectives_bullets : str\n        Bullet points summarizing investment purpose,\
        \ competitive\n        advantages, target return profiles, and long-term vision\
        \ (maximum 8\n        bullets).\n\n    Returns\n    -------\n    str\n   \
        \     Output message indicating the validation result.\n\n    Raises\n   \
        \ ------\n    ValueError\n        When the input objectives bullets are incomplete,\
        \ poorly formatted,\n        or exceed the maximum allowed number of bullets.\n\
        \    TypeError\n        When the input objectives bullets are not a string.\n\
        \n    Examples\n    --------\n    >>> validate_objectives_bullets(objectives_bullets='This\
        \ is a valid bullet\n    point.')\n    'Validation successful.'\n\n    >>>\
        \ validate_objectives_bullets(objectives_bullets='This is an invalid\n   \
        \ bullet point with too much information. This is another invalid bullet\n\
        \    point.')\n    'Validation failed: exceeded maximum allowed number of\
        \ bullets or invalid\n    format.'\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: validate_objectives_bullets
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: objectives_bullets
        type: str
      prd:
        conceptual_info: The validate_objectives_bullets shim is responsible for verifying
          that the input objectives bullets meet the required criteria, including
          checking for completeness, format, and content.
        docstring:
          examples:
          - lines:
            - validate_objectives_bullets(objectives_bullets='This is a valid bullet
              point.')
            output: '''Validation successful.'''
          - lines:
            - validate_objectives_bullets(objectives_bullets='This is an invalid bullet
              point with too much information. This is another invalid bullet point.')
            output: '''Validation failed: exceeded maximum allowed number of bullets
              or invalid format.'''
          parameters:
          - description: Bullet points summarizing investment purpose, competitive
              advantages, target return profiles, and long-term vision (maximum 8
              bullets).
            name: objectives_bullets
            type: str
          raises:
          - description: When the input objectives bullets are incomplete, poorly
