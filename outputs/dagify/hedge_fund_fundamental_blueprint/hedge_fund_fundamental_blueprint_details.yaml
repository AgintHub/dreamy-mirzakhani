      \    workflow_stages: List[str] = (\n        Field(..., description=\"Ordered\
      \ list of workflow stages (e.g., Idea Generation, Signal Generation, Order Entry,\
      \ Execution Management, Position Monitoring, Reconciliation, Settlement).\"\
      )\n    )\n    technology_solutions: List[str] = (\n        Field(..., description=\"\
      Corresponding technology solution for each stage (e.g., Data Analytics Platform,\
