      \ tech_stack=define_technology_stack_input, governance=outliner_governance_structure_input)\n\
      \    \n    provider_costs: List[float] = estimate_provider_costs(provider_names=list_service_providers_input.provider_names,\
      \ provider_functions=list_service_providers_input.provider_functions)\n    \n\
      \    technology_costs: List[float] = estimate_technology_costs(workflow_stages=define_technology_stack_input.workflow_stages,\
      \ technology_solutions=define_technology_stack_input.technology_solutions, vendor_flags=define_technology_stack_input.vendor_in_house_flags)\n\
      \    \n    governance_costs: List[float] = estimate_governance_costs(role_names=outliner_governance_structure_input.role_names,\
      \ responsibilities=[outliner_governance_structure_input.role_responsibility_1,\
