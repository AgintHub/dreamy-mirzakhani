    - description: Implementation dates for each AML policy item (YYYY-MM-DD format)
      key: aml_dates
      type: List[str]
    prd:
      conceptual_info: The node synthesizes regulatory requirements identified earlier
        and investor profile constraints into a structured compliance program. It
        outputs three parallel lists of checklist items and their corresponding launch
        dates, ready for inclusion in a spreadsheet or project tracking tool.
      docstring:
        examples:
        - lines:
          - '# Example 1: Basic compliance program generation'
          - reg_req = [
          - '  {''requirement'': ''SEC Form ADV'', ''agency_citation'': ''SEC'', ''implementation_notes'':
            [''File annually'', ''Update bi‑annually'']},'
          - '  {''requirement'': ''FINRA Membership'', ''agency_citation'': ''FINRA'',
            ''implementation_notes'': [''Apply within 30 days'']}'
          - ']'
          - inv_prof = {
          - '  ''typical_investor_types'': [''Family Office'', ''Pension Fund''],'
          - '  ''required_minimum_investment'': 5000000,'
          - '  ''liquidity_expectations'': ''Monthly'','
          - '  ''risk_tolerance_levels'': [''Aggressive''],'
