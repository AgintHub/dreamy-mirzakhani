            Data Analytics Platform\", \"Quant Model Engine\", \"Order Management\
            \ System\", \"FIX Gateway\", \"Risk Engine\", \"Reconciliation Tool\"\
            , \"Settlement Service\"],\n  \"vendor_in_house_flags\": [true, true,\
