      \ description = (\n            \"Short textual summary of the overall budget,\
      \ highlighting major cost drivers\")\n        )\n    )\n\n\ndef estimate_setup_and_operating_costs(list_service_providers_input:\
      \ ListServiceProvidersOutput, define_technology_stack_input: DefineTechnologyStackOutput,\
      \ outliner_governance_structure_input: OutlinerGovernanceStructureOutput, **kwargs)\
      \ -> EstimateSetupAndOperatingCostsOutput:\n    \"\"\"\n    Generate a cost\
      \ matrix that aggregates monthly and annual expenditures for\n    all service\
      \ providers, technology implementations, and governance roles.\n\n    Parameters\n\
      \    ----------\n    provider_names : List[str]\n        List of mandatory external\
      \ service provider names in the order:\n        prime broker, custodian, fund\
      \ administrator, legal counsel,\n        compliance consultant.\n    provider_functions\
