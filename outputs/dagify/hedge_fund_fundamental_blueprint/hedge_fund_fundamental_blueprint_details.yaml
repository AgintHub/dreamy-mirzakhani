  design_compliance_program:
    agent: false
    code_node_type: stub
    description: Creates a regulatory control framework by mapping required compliance
      items across three key domains—investor accreditation, subscription verification,
      and anti-money laundering—alongside their planned implementation dates.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyRegulatoryRequirementsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for identify_regulatory_requirements node outputs.\"\"\"\n    requirement:\
      \ str = (\n        Field(..., description=\"The specific regulatory filing or\
      \ registration required.\")\n    )\n    agency_citation: str = (\n        Field(...,\
      \ description=\"The regulatory agency and citation or form number associated\
      \ with the requirement.\")\n    )\n    implementation_notes: List[str] = (\n\
      \        Field(..., description=\"One or two brief notes describing how to implement\
      \ or comply with the requirement.\")\n    )\n\n\nclass DefineInvestorProfileOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_investor_profile node outputs.\"\"\"\n\
      \    typical_investor_types: List[str] = (\n        Field(..., description=\"\
      List of typical investor types (e.g., family offices, pensions)\")\n    )\n\
      \    required_minimum_investment: int = (\n        Field(..., description=\"\
      Required minimum investment in USD\")\n    )\n    liquidity_expectations: str\
      \ = (\n        Field(..., description=\"Description of liquidity expectations\"\
      )\n    )\n    risk_tolerance_levels: List[str] = (\n        Field(..., description=\"\
      List of risk tolerance levels (e.g., aggressive, conservative)\")\n    )\n \
      \   geographic_focus: str = (\n        Field(..., description=\"Description\
      \ of geographic focus\")\n    )\n\n\nclass DesignComplianceProgramOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for design_compliance_program node outputs.\"\"\"\n\
      \    accreditation_items: List[str] = (\n        Field(..., description=\"List\
      \ of investor accreditation standard items required for compliance\")\n    )\n\
      \    accreditation_dates: List[str] = (\n        Field(..., description=\"Implementation\
      \ dates for each accreditation item (YYYY-MM-DD format)\")\n    )\n    subscription_items:\
      \ List[str] = (\n        Field(..., description=\"List of subscription verification\
      \ procedures to be followed\")\n    )\n    subscription_dates: List[str] = (\n\
      \        Field(..., description=\"Implementation dates for each subscription\
      \ procedure (YYYY-MM-DD format)\")\n    )\n    aml_items: List[str] = (\n  \
      \      Field(..., description=\"List of anti-money laundering policy items to\
      \ implement\")\n    )\n    aml_dates: List[str] = (\n        Field(..., description=\"\
      Implementation dates for each AML policy item (YYYY-MM-DD format)\")\n    )\n\
      \n\ndef design_compliance_program(identify_regulatory_requirements_input: IdentifyRegulatoryRequirementsOutput,\
      \ define_investor_profile_input: DefineInvestorProfileOutput, **kwargs) -> DesignComplianceProgramOutput:\n\
      \    \"\"\"\n    Generate compliance checklists for investor accreditation,\
      \ subscription\n    verification, and AML policies, each paired with an implementation\
      \ date.\n\n    Parameters\n    ----------\n    regulatory_requirements : List[Dict[str,\
      \ Any]]\n        Output from identify_regulatory_requirements. Each dict contains\n\
      \        keys 'requirement', 'agency_citation', and 'implementation_notes'.\n\
      \        These provide the regulatory basis for accreditation, subscription,\n\
      \        and AML items.\n    investor_profile : Dict[str, Any]\n        Output\
      \ from define_investor_profile. Contains fields such as\n        'typical_investor_types',\
      \ 'required_minimum_investment',\n        'liquidity_expectations', 'risk_tolerance_levels',\
      \ and\n        'geographic_focus'. These inform the specificity of accreditation\n\
      \        and subscription items.\n\n    Returns\n    -------\n    Dict[str,\
      \ List[str]]\n        A dictionary with six keys—accreditation_items, accreditation_dates,\n\
      \        subscription_items, subscription_dates, aml_items, aml_dates—each\n\
      \        mapping to a list of strings.\n\n    Raises\n    ------\n    ValueError\n\
      \        If either input list is empty or missing required keys.\n    TypeError\n\
      \        If inputs are not of the expected types.\n\n    Examples\n    --------\n\
      \    >>> # Example 1: Basic compliance program generation\n    >>> reg_req =\
      \ [\n    ...   {'requirement': 'SEC Form ADV', 'agency_citation': 'SEC',\n \
      \   'implementation_notes': ['File annually', 'Update bi‑annually']},\n    ...\
      \   {'requirement': 'FINRA Membership', 'agency_citation': 'FINRA',\n    'implementation_notes':\
      \ ['Apply within 30 days']}\n    >>> ]\n    >>> inv_prof = {\n    ...   'typical_investor_types':\
      \ ['Family Office', 'Pension Fund'],\n    ...   'required_minimum_investment':\
      \ 5000000,\n    ...   'liquidity_expectations': 'Monthly',\n    ...   'risk_tolerance_levels':\
      \ ['Aggressive'],\n    ...   'geographic_focus': 'US'\"\n                \"\
      }\n    >>> result = design_compliance_program(reg_req, inv_prof)\n    >>> print(result['accreditation_items'])\n\
      \    ['SEC Form ADV', 'FINRA Membership']\n\n    >>> # Example 2: Validation\
      \ error when inputs missing\n    >>> try:\n    ...   design_compliance_program([],\
      \ inv_prof)\n    >>> except ValueError as e:\n    ...   print(str(e))\n    Input\
      \ regulatory_requirements list is empty.\n\n    \"\"\"\n    return DesignComplianceProgramOutput(\n\
      \        accreditation_items=[],\n        accreditation_dates=[],\n        subscription_items=[],\n\
      \        subscription_dates=[],\n        aml_items=[],\n        aml_dates=[],\n\
      \    )"
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - define_investor_profile
    nodes_dependent_on: []
    output_structure:
    - description: List of investor accreditation standard items required for compliance
      key: accreditation_items
      type: List[str]
    - description: Implementation dates for each accreditation item (YYYY-MM-DD format)
      key: accreditation_dates
      type: List[str]
    - description: List of subscription verification procedures to be followed
      key: subscription_items
      type: List[str]
    - description: Implementation dates for each subscription procedure (YYYY-MM-DD
        format)
      key: subscription_dates
      type: List[str]
    - description: List of anti-money laundering policy items to implement
      key: aml_items
      type: List[str]
    - description: Implementation dates for each AML policy item (YYYY-MM-DD format)
      key: aml_dates
      type: List[str]
    prd:
      conceptual_info: The node synthesizes regulatory requirements identified earlier
        and investor profile constraints into a structured compliance program. It
        outputs three parallel lists of checklist items and their corresponding launch
        dates, ready for inclusion in a spreadsheet or project tracking tool.
      docstring:
        examples:
        - lines:
          - '# Example 1: Basic compliance program generation'
          - reg_req = [
          - '  {''requirement'': ''SEC Form ADV'', ''agency_citation'': ''SEC'', ''implementation_notes'':
            [''File annually'', ''Update bi‑annually'']},'
          - '  {''requirement'': ''FINRA Membership'', ''agency_citation'': ''FINRA'',
            ''implementation_notes'': [''Apply within 30 days'']}'
          - ']'
          - inv_prof = {
          - '  ''typical_investor_types'': [''Family Office'', ''Pension Fund''],'
          - '  ''required_minimum_investment'': 5000000,'
          - '  ''liquidity_expectations'': ''Monthly'','
          - '  ''risk_tolerance_levels'': [''Aggressive''],'
          - "  'geographic_focus': 'US'\"\n                \"}"
          - result = design_compliance_program(reg_req, inv_prof)
          - print(result['accreditation_items'])
          output: '[''SEC Form ADV'', ''FINRA Membership'']'
        - lines:
          - '# Example 2: Validation error when inputs missing'
          - 'try:'
          - '  design_compliance_program([], inv_prof)'
          - 'except ValueError as e:'
          - '  print(str(e))'
          output: Input regulatory_requirements list is empty.
        parameters:
        - description: Output from identify_regulatory_requirements. Each dict contains
            keys 'requirement', 'agency_citation', and 'implementation_notes'. These
            provide the regulatory basis for accreditation, subscription, and AML
            items.
          name: regulatory_requirements
          type: List[Dict[str, Any]]
        - description: Output from define_investor_profile. Contains fields such as
            'typical_investor_types', 'required_minimum_investment', 'liquidity_expectations',
            'risk_tolerance_levels', and 'geographic_focus'. These inform the specificity
            of accreditation and subscription items.
          name: investor_profile
          type: Dict[str, Any]
        raises:
        - description: If either input list is empty or missing required keys.
          type: ValueError
        - description: If inputs are not of the expected types.
          type: TypeError
        returns:
          description: A dictionary with six keys—accreditation_items, accreditation_dates,
            subscription_items, subscription_dates, aml_items, aml_dates—each mapping
            to a list of strings.
          type: Dict[str, List[str]]
        summary: Generate compliance checklists for investor accreditation, subscription
          verification, and AML policies, each paired with an implementation date.
    prompt: 'Generate compliance checklists mapping three categories: investor accreditation
      standards, subscription verification procedures, anti-money laundering policies.
      Format as 3-tab spreadsheet with implementation dates.'
    shims: []
  design_risk_management_framework:
    agent: false
    code_node_type: stub
    description: Create risk mitigation architecture
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass SetPerformanceAndRiskTargetsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for set_performance_and_risk_targets node outputs.\"\"\"\n    metric_names:\
      \ List[str] = (\n        Field(..., description=\"Names of the performance and\
      \ risk metrics (e.g., Gross Return, Volatility, Sharpe Ratio, Max Drawdown).\"\
      )\n    )\n    target_values: List[float] = (\n        Field(..., description=\"\
      Numerical target values corresponding to each metric (e.g., 0.15 for 15% gross\
      \ return, 0.10 for 10% volatility).\")\n    )\n    rationale_texts: List[str]\
      \ = (\n        Field(..., description=\"Brief rationale for each target, explaining\
      \ how it aligns with strategy and risk appetite.\")\n    )\n\n\nclass DefineAssetUniverseOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_asset_universe node outputs.\"\"\"\n  \
      \  instrument_names: List[str] = (\n        Field(..., description=\"Names of\
      \ the 10 selected tradable instruments\")\n    )\n    instrument_rationales:\
      \ List[str] = (\n        Field(..., description=\"Brief rationale for each of\
      \ the 10 selected instruments\")\n    )\n    asset_class_count: int = (\n  \
      \      Field(..., description=\"Total number of distinct asset classes represented\
      \ among the 10 instruments\")\n    )\n\n\nclass DesignRiskManagementFrameworkOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for design_risk_management_framework node outputs.\"\
      \"\"\n    num_quant_controls: int = (\n        Field(..., description=\"Number\
      \ of quantifiable risk controls specified\")\n    )\n    quant_controls_desc:\
      \ List[str] = (\n        Field(..., description=\"Descriptions of each quantifiable\
      \ risk control\")\n    )\n    num_qual_practices: int = (\n        Field(...,\
      \ description=\"Number of qualitative risk practices specified\")\n    )\n \
      \   qual_practices_desc: List[str] = (\n        Field(..., description=\"Descriptions\
      \ of each qualitative risk practice\")\n    )\n\n\ndef design_risk_management_framework(set_performance_and_risk_targets_input:\
      \ SetPerformanceAndRiskTargetsOutput, define_asset_universe_input: DefineAssetUniverseOutput,\
      \ **kwargs) -> DesignRiskManagementFrameworkOutput:\n    \"\"\"\n    Generate\
      \ a risk mitigation framework that aligns with performance targets\n    and\
      \ the chosen asset universe.\n\n    Parameters\n    ----------\n    metric_names\
      \ : List[str]\n        Names of performance and risk metrics from\n        set_performance_and_risk_targets.\n\
      \    target_values : List[float]\n        Numeric target values corresponding\
      \ to each metric.\n    rationale_texts : List[str]\n        Brief rationale\
      \ for each target.\n    instrument_names : List[str]\n        List of the 10\
      \ selected tradable instruments from\n        define_asset_universe.\n    instrument_rationales\
      \ : List[str]\n        Rationales for each instrument.\n    asset_class_count\
      \ : int\n        Number of distinct asset classes represented among the 10\n\
      \        instruments.\n\n    Returns\n    -------\n    dict\n        Dictionary\
      \ matching the node's output structure:\n        {num_quant_controls, quant_controls_desc,\
      \ num_qual_practices,\n        qual_practices_desc}.\n\n    Raises\n    ------\n\
      \    ValueError\n        If any required input list is empty or misaligned in\
      \ length.\n    TypeError\n        If input types do not match the expected PrimitiveTypes.\n\
      \n    Examples\n    --------\n    >>> design_risk_management_framework(\n\n\
      \    ...     metric_names=['Gross Return', 'Volatility', 'Sharpe Ratio', 'Max\n\
      \    Drawdown'],\n    ...     target_values=[0.15, 0.10, 2.0, 0.20],\n\n   \
      \ ...     rationale_texts=['Targeting 15% return', 'Control volatility to\n\
      \    10%', 'Sharpe > 2', 'Drawdown < 20%'],\n    ...     instrument_names=['SPX\
      \ Futures', 'Emerging Debt', 'Gold Futures',\n    'USD Bonds', 'EU Equity ETF',\
      \ 'Oil Futures', 'US Treasury', 'China Shares',\n    'Eurodollar Futures', 'US\
      \ Equity ETF'],\n    ...     instrument_rationales=['Liquidity', 'Diversification',\
      \ 'Inflation\n    hedge', 'Safe haven', 'European exposure', 'Energy cycle',\
      \ 'Credit quality',\n    'Growth potential', 'Interest rate sensitivity', 'Broad\
      \ market exposure'],\n    ...     asset_class_count=4\n\n    >>> )\n    {\n\
      \      \"num_quant_controls\": 5,\n      \"quant_controls_desc\": [\n      \
      \  \"Position limit: max 10% of portfolio per instrument\",\n        \"Daily\
      \ VaR: 2% of NAV at 99% confidence\",\n        \"Liquidity threshold: min 20%\
      \ of position must be marketable within 2\n    hours\",\n        \"Concentration\
      \ limit: no single asset class > 25% of total NAV\",\n        \"Leverage cap:\
      \ maximum 3x equity exposure\"\n      ],\n      \"num_qual_practices\": 3,\n\
      \      \"qual_practices_desc\": [\n        \"Daily risk dashboard emailed to\
      \ Portfolio Manager and Head of Risk\",\n        \"Weekly risk review meeting\
      \ with investment team and compliance\",\n        \"Monthly audit of risk controls\
      \ against performance targets\"\n      ]\n    }\n\n    >>> design_risk_management_framework(\n\
      \n    ...     metric_names=['Gross Return', 'Volatility'],\n\n    ...     target_values=[0.12,\
      \ 0.08],\n\n    ...     rationale_texts=['12% return', '8% vol'],\n\n    ...\
      \     instrument_names=['AAPL', 'SPX Futures', 'US Treasury', 'Gold'],\n\n \
      \   ...     instrument_rationales=['Growth', 'Index', 'Safe haven', 'Inflation\n\
      \    hedge'],\n    ...     asset_class_count=3\n\n    >>> )\n    {\n      \"\
      num_quant_controls\": 4,\n      \"quant_controls_desc\": [\n        \"Max position\
      \ per security: 5% of NAV\",\n        \"Daily VaR: 1.5% of NAV\",\n        \"\
      Liquidity: 15% of position must be liquid within 1 hour\",\n        \"Leverage:\
      \ capped at 2x equity\"\n      ],\n      \"num_qual_practices\": 3,\n      \"\
      qual_practices_desc\": [\n        \"Daily risk metric report\",\n        \"\
      Bi‑weekly risk review\",\n        \"Quarterly independent risk audit\"\n   \
      \   ]\n    }\n\n    \"\"\"\n    return DesignRiskManagementFrameworkOutput(\n\
      \        num_quant_controls=0,\n        quant_controls_desc=[],\n        num_qual_practices=0,\n\
      \        qual_practices_desc=[],\n    )"
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    - define_asset_universe
    nodes_dependent_on: []
    output_structure:
    - description: Number of quantifiable risk controls specified
      key: num_quant_controls
      type: int
    - description: Descriptions of each quantifiable risk control
      key: quant_controls_desc
      type: List[str]
    - description: Number of qualitative risk practices specified
      key: num_qual_practices
      type: int
    - description: Descriptions of each qualitative risk practice
      key: qual_practices_desc
      type: List[str]
    prd:
      conceptual_info: This node translates performance targets and asset universe
        constraints into a concrete set of risk controls. It enumerates both numerical
        limits (e.g., position caps, VaR thresholds) and process-oriented safeguards
        (e.g., daily monitoring, weekly reporting). The output is structured for downstream
        use in pitch decks and operational workflows.
      docstring:
        examples:
        - lines:
          - 'design_risk_management_framework(

            '
          - '    metric_names=[''Gross Return'', ''Volatility'', ''Sharpe Ratio'',
            ''Max Drawdown''],

            '
          - '    target_values=[0.15, 0.10, 2.0, 0.20],

            '
          - '    rationale_texts=[''Targeting 15% return'', ''Control volatility to
            10%'', ''Sharpe > 2'', ''Drawdown < 20%''],

            '
          - '    instrument_names=[''SPX Futures'', ''Emerging Debt'', ''Gold Futures'',
            ''USD Bonds'', ''EU Equity ETF'', ''Oil Futures'', ''US Treasury'', ''China
            Shares'', ''Eurodollar Futures'', ''US Equity ETF''],

            '
          - '    instrument_rationales=[''Liquidity'', ''Diversification'', ''Inflation
            hedge'', ''Safe haven'', ''European exposure'', ''Energy cycle'', ''Credit
            quality'', ''Growth potential'', ''Interest rate sensitivity'', ''Broad
            market exposure''],

            '
          - '    asset_class_count=4

            '
          - )
          output: "{\n  \"num_quant_controls\": 5,\n  \"quant_controls_desc\": [\n\
            \    \"Position limit: max 10% of portfolio per instrument\",\n    \"\
            Daily VaR: 2% of NAV at 99% confidence\",\n    \"Liquidity threshold:\
            \ min 20% of position must be marketable within 2 hours\",\n    \"Concentration\
            \ limit: no single asset class > 25% of total NAV\",\n    \"Leverage cap:\
            \ maximum 3x equity exposure\"\n  ],\n  \"num_qual_practices\": 3,\n \
            \ \"qual_practices_desc\": [\n    \"Daily risk dashboard emailed to Portfolio\
            \ Manager and Head of Risk\",\n    \"Weekly risk review meeting with investment\
            \ team and compliance\",\n    \"Monthly audit of risk controls against\
            \ performance targets\"\n  ]\n}"
        - lines:
          - 'design_risk_management_framework(

            '
          - '    metric_names=[''Gross Return'', ''Volatility''],

            '
          - '    target_values=[0.12, 0.08],

            '
          - '    rationale_texts=[''12% return'', ''8% vol''],

            '
          - '    instrument_names=[''AAPL'', ''SPX Futures'', ''US Treasury'', ''Gold''],

            '
          - '    instrument_rationales=[''Growth'', ''Index'', ''Safe haven'', ''Inflation
            hedge''],

            '
          - '    asset_class_count=3

            '
          - )
          output: "{\n  \"num_quant_controls\": 4,\n  \"quant_controls_desc\": [\n\
            \    \"Max position per security: 5% of NAV\",\n    \"Daily VaR: 1.5%\
            \ of NAV\",\n    \"Liquidity: 15% of position must be liquid within 1\
            \ hour\",\n    \"Leverage: capped at 2x equity\"\n  ],\n  \"num_qual_practices\"\
            : 3,\n  \"qual_practices_desc\": [\n    \"Daily risk metric report\",\n\
            \    \"Bi‑weekly risk review\",\n    \"Quarterly independent risk audit\"\
            \n  ]\n}"
        parameters:
        - description: Names of performance and risk metrics from set_performance_and_risk_targets.
          name: metric_names
          type: List[str]
        - description: Numeric target values corresponding to each metric.
          name: target_values
          type: List[float]
        - description: Brief rationale for each target.
          name: rationale_texts
          type: List[str]
        - description: List of the 10 selected tradable instruments from define_asset_universe.
          name: instrument_names
          type: List[str]
        - description: Rationales for each instrument.
          name: instrument_rationales
          type: List[str]
        - description: Number of distinct asset classes represented among the 10 instruments.
          name: asset_class_count
          type: int
        raises:
        - description: If any required input list is empty or misaligned in length.
