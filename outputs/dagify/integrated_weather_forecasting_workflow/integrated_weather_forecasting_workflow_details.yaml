dag_type: plain_text
description: End-to-end weather forecasting system covering data collection, model
  training, deployment, real-time integration, and performance monitoring
name: integrated_weather_forecasting_workflow
nodes:
  integrated_weather_forecasting:
    agent: false
    description: Execute complete weather forecasting pipeline including requirements
      definition, historical data collection and preprocessing, model selection and
      training, deployment, real-time data integration, alert configuration, and ongoing
      model monitoring
    name: integrated_weather_forecasting
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Run full weather forecasting workflow:

      1. Define geographic region, forecast horizon (1-3 day, 1-week), target variables
      (temperature, precipitation, wind speed), and evaluation metrics

      2. Collect historical weather data from government databases, weather stations,
      and satellite archives with at least 10-year coverage

      3. Clean missing values, apply normalization/scaling, create lagged features
      and encode categorical variables

      4. Select appropriate forecasting models (SARIMA, LSTM, Gradient Boosted Trees)
      based on data characteristics

      5. Train selected models with parameter configuration: SARIMA use auto_arima,
      LSTM: sequence length 24, dropout 0.2, XGBoost 500 trees, max depth 5

      6. Evaluate with MAE, MSE, RMSE, MAPE and compare forecast vs actual plots

      7. Deploy trained model as REST API with health check endpoints and real-time
      inference capability

      8. Implement real-time data pipeline for sensors/APIs to model-ready format

      9. Configure alert system for thresholds (e.g., >35°C, >10 mm rainfall) via
      email/SMS

      10. Set up performance monitoring with automatic retraining when error exceeds
      thresholds'
