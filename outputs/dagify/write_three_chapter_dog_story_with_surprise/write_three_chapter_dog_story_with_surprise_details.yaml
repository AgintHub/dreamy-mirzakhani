nodes:
  add_grand_finale:
    agent: false
    code_node_type: shim
    description: Elevates Chapter 3’s conclusion by introducing an intricate, M. Night
      Shyamalan-style grand finale—a masterfully constructed, emotionally resonant,
      and intellectually gripping twist that reframes the narrative arc in a surprising,
      yet thematically cohesive, new light, while incorporating a subtle visual motif
      to enhance thematic resonance and character psychology.
    implementation: "from ._add_grand_finale.analyze_narrative_structure import analyze_narrative_structure\n\
      from ._add_grand_finale.identify_twist_opportunities import identify_twist_opportunities\n\
      from ._add_grand_finale.craft_shyamalan_style_twist import craft_shyamalan_style_twist\n\
      from ._add_grand_finale.enhance_emotional_depth import enhance_emotional_depth\n\
      from ._add_grand_finale.integrate_thematic_symbolism import integrate_thematic_symbolism\n\
      from ._add_grand_finale.polish_narrative_coherence import polish_narrative_coherence\n\
      \nfrom pydantic import BaseModel, Field\n\n\nclass WriteChapter3Output(BaseModel):\n\
      \    \"\"\"Pydantic model for write_chapter_3 node outputs.\"\"\"\n    chapter_title:\
      \ str = Field(..., description=\"The title of Chapter 3.\")\n    chapter_content:\
      \ str = (\n        Field(..., description=\"The prose content of Chapter 3.\"\
      )\n    )\n    chapter_summary: str = (\n        Field(..., description=\"A summary\
      \ of what happens in Chapter 3.\")\n    )\n\n\nclass AddGrandFinaleOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for add_grand_finale node outputs.\"\"\"\n    final_chapter_text:\
      \ str = (\n        Field(..., description = (\n            \"The polished, finalized\
      \ Chapter 3 text incorporating the M. Night Shyamalan-style twist, emotional\
      \ depth, and thematic symbolism.\")\n        )\n    )\n\n\ndef add_grand_finale(write_chapter_3_input:\
      \ WriteChapter3Output, **kwargs) -> AddGrandFinaleOutput:\n    \"\"\"\n    Adds\
      \ a grand finale twist to Chapter 3, maintaining narrative coherence\n    while\
      \ surprising the reader.\n\n    Returns\n    -------\n    str\n        The revised\
      \ final chapter with the grand finale twist and emotional\n        resonance\
      \ fully integrated.\n\n    Examples\n    --------\n    >>> create_grand_finale_twist('write_chapter_3')\n\
      \    The grand finale twist is crafted, enriching the narrative and deepening\n\
      \    character connections.\n\n    >>> create_grand_finale_twist('write_chapter_3')\n\
      \    The emotional resonance of the twist enhances character psychology and\n\
      \    thematic symbolism.\n\n    \"\"\"\n    analyzed_narrative: dict = analyze_narrative_structure(content=write_chapter_3_input.chapter_content,\
      \ summary=write_chapter_3_input.chapter_summary)\n    twist_elements: dict =\
      \ identify_twist_opportunities(narrative_data=analyzed_narrative, chapter_content=write_chapter_3_input.chapter_content)\n\
      \    crafted_twist: str = craft_shyamalan_style_twist(twist_opportunities=twist_elements,\
      \ existing_content=write_chapter_3_input.chapter_content)\n    enhanced_emotions:\
      \ str = enhance_emotional_depth(content=crafted_twist, character_connections=analyzed_narrative)\n\
      \    thematic_integration: str = integrate_thematic_symbolism(content=enhanced_emotions,\
      \ narrative_themes=analyzed_narrative)\n    polished_finale: str = polish_narrative_coherence(content=thematic_integration,\
      \ original_summary=write_chapter_3_input.chapter_summary)\n    return AddGrandFinaleOutput(\n\
      \        final_chapter_text=polished_finale,\n    )"
    name: add_grand_finale
    nodes_depended_on:
    - write_chapter_3
    nodes_dependent_on: []
