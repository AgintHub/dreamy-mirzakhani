      \ ._write_chapter_1.weave_chapter_prose import weave_chapter_prose\nfrom ._write_chapter_1.validate_chapter_output\
      \ import validate_chapter_output\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass GenerateStoryOutlineOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for generate_story_outline node outputs.\"\"\"\n \
