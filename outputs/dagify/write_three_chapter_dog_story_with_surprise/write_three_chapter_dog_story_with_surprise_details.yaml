      \   Field(..., description = (\n            \"True if the output is a well-formed,\
      \ non-empty chapter; otherwise False\")\n        )\n    )\n\n\ndef write_chapter_1(generate_story_outline_input:\
      \ GenerateStoryOutlineOutput, generate_character_profiles_input: GenerateCharacterProfilesOutput,\
