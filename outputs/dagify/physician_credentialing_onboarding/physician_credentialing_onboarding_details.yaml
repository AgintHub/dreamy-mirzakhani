dag_type: plain_text
description: Generated workflow from UI.
name: physician_credentialing_onboarding
nodes:
  assign_clinical_privileges:
    agent: false
    description: Updates the EMR with committee‑approved clinical privileges for the
      physician and generates a HubSpot Service Ticket to document the assignment
      and track any required follow‑up actions.
    name: assign_clinical_privileges
    nodes_depended_on:
    - schedule_privileging_committee_review
    nodes_dependent_on: []
    prompt: "1. Retrieve the committee-approved list of clinical privileges (e.g.,\
      \ inpatient admission, surgery, critical care, specialty procedures) from the\
      \ prior node. 2. Update the EMR profile to grant these privileges to the physician,\
      \ ensuring compliance with institutional policies and audit trails. 3. Create\
      \ a new HubSpot Service Ticket titled \"Clinical Privileges Assignment – [Physician\
      \ Name]\" with the following fields:\n   - *Physician*: [Physician Name]\n \
      \  - *Privileges Assigned*: comma‑separated list from step 1\n   - *Effective\
      \ Date*: today’s date\n   - *Source*: Privileging Committee\n   - *Status*:\
      \ Open\n   - *Description*: Include a brief narrative of the assignment and\
      \ any pending follow‑ups.\n   4. Return a JSON object containing the `privileges_assigned`\
      \ array and the HubSpot ticket ID under `ticket_id`."
  check_pecos:
    agent: false
    description: Verifies a physician’s enrollment in the Provider Enrollment, Chain,
      and Ownership System (PECOS) for Medicare participation, records the enrollment
      status, enrollment date, and Medicare eligibility, and automatically logs the
      outcome in a HubSpot ticket for compliance tracking.
    name: check_pecos
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: 'Create a new HubSpot ticket titled **"PECOS Enrollment Verification –
      {physician_name}"** and populate its custom fields with the physician’s PECOS
      enrollment status, enrollment date, and Medicare eligibility. Use the JSON data
      received from the previous node (containing keys: name, NPI, medical_license_number,
      etc.) to fill in the ticket. After creating the ticket, add a note summarizing
      the enrollment findings and attach any relevant PECOS documents or screenshots.
      Ensure the ticket is assigned to the appropriate compliance team and set the
      priority based on eligibility status.'
  collect_physician_basic_info:
    agent: false
    description: Collects and validates all essential personal and professional information
      for a newly onboarded physician, ensuring compliance with data protection regulations
      and readiness for subsequent workflow stages.
    name: collect_physician_basic_info
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "Create a comprehensive, GDPR‑compliant intake form that captures the\
      \ following physician details:\n1. **Personal identifiers**: Full legal name,\
      \ preferred name, and title.\n2. **Contact information**: Primary and secondary\
      \ email addresses, landline and mobile phone numbers with country codes.\n3.\
      \ **Regulatory identifiers**: National Provider Identifier (NPI), state medical\
      \ license number, DEA registration number, and any relevant specialty certifications.\n\
      4. **Professional background**: Structured education history (institution, degree,\
      \ graduation year) and employment history (current and prior positions, institution\
      \ names, dates of employment, and roles).\n5. **Risk management**: Malpractice\
      \ insurance provider and policy number.\n\nOnce collected, validate each field\
      \ against external verification APIs (e.g., NPI Registry, state licensing boards)\
      \ and output the data as a JSON object with the following schema:\n```json\n\
      {\n  \"name\": \"string\",\n  \"title\": \"string\",\n  \"preferred_name\":\
      \ \"string\",\n  \"email_primary\": \"string\",\n  \"email_secondary\": \"string\"\
      ,\n  \"phone_primary\": \"string\",\n  \"phone_secondary\": \"string\",\n  \"\
      npi\": \"string\",\n  \"medical_license_number\": \"string\",\n  \"dea_number\"\
      : \"string\",\n  \"education_history\": [\n    {\"institution\": \"string\"\
      , \"degree\": \"string\", \"graduation_year\": \"int\"}\n  ],\n  \"employment_history\"\
      : [\n    {\"institution\": \"string\", \"role\": \"string\", \"start_date\"\
      : \"YYYY-MM\", \"end_date\": \"YYYY-MM\"}\n  ],\n  \"malpractice_insurance_provider\"\
      : \"string\",\n  \"malpractice_policy_number\": \"string\"\n}\n```\nEnsure the\
      \ JSON adheres to the schema, includes only collected and verified data, and\
      \ is ready for ingestion by downstream workflow nodes."
  compile_credentialing_report:
    agent: false
    description: Aggregates the results of all credentialing verification steps into
      a comprehensive report and generates a HubSpot ticket to record the outcome
      for the Credentialing Team. The ticket includes the full report, an overall
      recommendation, and relevant metadata for audit and workflow purposes.
    name: compile_credentialing_report
    nodes_depended_on:
    - verify_medical_license
    - verify_board_certification
    - verify_dea_registration
    - verify_malpractice_insurance
    - verify_education_and_training
    - obtain_professional_references
    - conduct_background_check
    - verify_hospital_privileges_history
    - check_pecos
    nodes_dependent_on: []
    prompt: "1. Merge the JSON outputs from all verification steps into a single,\
      \ structured credentialing report. 2. For each category (medical license, board\
      \ certification, DEA registration, malpractice insurance, education/training,\
      \ professional references, background check, hospital privileges, PECOS status),\
      \ include:\n   * a \"status\" field (\"pass\"/\"fail\"),\n   * a concise \"\
      summary\" field, and\n   * any relevant details.\n3. Compute an overall recommendation\
      \ field set to \"approve\" if all categories pass, otherwise \"hold\".\n4. Create\
      \ a HubSpot ticket with the following properties:\n   * Subject: \"Credentialing\
      \ Review – {physician_name} ({physician_id})\"\n   * Description: embed the\
      \ JSON report as a formatted attachment or body.\n   * Custom fields: physician_id,\
      \ overall_recommendation, created_at.\n   * Assign to the Credentialing Team\
      \ queue.\n5. Return a JSON object containing the ticket_id, report JSON, and\
      \ overall_recommendation."
  complete_compliance_training:
    agent: false
    description: Facilitates the enrollment, completion tracking, and certification
      of all mandatory compliance and safety training modules for a newly credentialed
      physician. The node registers each module, monitors completion, automatically
      generates a HubSpot service ticket for audit and record-keeping, and returns
      a structured summary of completion statuses. This ensures traceability, compliance
      reporting, and seamless integration with the organization’s ticketing and credentialing
      workflows.
    name: complete_compliance_training
    nodes_depended_on:
    - schedule_orientation
    nodes_dependent_on: []
    prompt: 'Enroll the physician in the online compliance and safety training modules.
      For each module:

      1. Register the physician and initiate the module.

      2. Monitor progress and automatically mark the module as complete upon successful
      submission of the assessment.

      3. Generate a HubSpot service ticket titled "Compliance Training Completion
      – {physician_name}" with the following properties: training_module_id, completion_status,
      completion_timestamp, and a link to the certificate.

      4. Return a JSON array with objects containing `training_module_id` and `completion_status`
      for all modules. Ensure the ticket creation API call succeeds before proceeding.'
  conduct_background_check:
    agent: false
    description: Performs a comprehensive national criminal background and sanctions
      check for a physician, then logs the outcome as a HubSpot ticket for auditability
      and follow‑up.
    name: conduct_background_check
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: "## HubSpot Ticket Creation for Physician Background Check\n\n1. **Extract\
      \ Input Data** – Use the JSON payload from `collect_physician_basic_info` (fields:\
      \ `name`, `email`, `phone`, `NPI`, `medical_license_number`, `DEA_number`).\n\
      2. **Run Checks** – Perform a national criminal background and sanctions search\
      \ using the physician’s full name, DOB, NPI, and license number. Return results\
      \ in a structured JSON object with the following keys:\n   - `criminal_records`:\
      \ `yes` or `no`\n   - `sanctions`: `yes` or `no`\n   - `details`: array of any\
      \ records found (empty if none)\n3. **Create HubSpot Ticket** – Using the HubSpot\
      \ REST API, create a new ticket with the following fields:\n   - `subject`:\
      \ \"Background Check for {name}\"\n   - `description`: \"Criminal Records: {criminal_records}.\
      \ Sanctions: {sanctions}. Details: {details}\" (JSON‑stringified)\n   - `hs_priority`:\
      \ `3` (Normal)\n   - `hs_tags`: `background_check, physician`\n   - `hs_ticket_status`:\
      \ `open`\n4. **Return Confirmation** – Output a JSON object containing:\n  \
      \ - `ticket_id` (HubSpot ticket ID)\n   - `background_check_results` (the JSON\
      \ from step 2)\n   - `timestamp` (ISO 8601)\n\n**Output Format**:\n```json\n\
      {\n  \"ticket_id\": \"<string>\",\n  \"background_check_results\": {\n    \"\
      criminal_records\": \"yes|no\",\n    \"sanctions\": \"yes|no\",\n    \"details\"\
      : [\"<record1>\", \"<record2>\"]\n  },\n  \"timestamp\": \"<ISO 8601>\"\n}\n\
      ```\nEnsure the ticket creation step is idempotent; if a ticket already exists\
      \ for the given physician (matching NPI), update it instead of creating a duplicate."
  create_provider_profile_in_emr:
    agent: false
    description: Creates a comprehensive provider profile in the electronic medical
      record (EMR) system by ingesting the physician’s credentialing report and signed
      employment contract. The node populates all required EMR fields (name, NPI,
      specialties, medical license, DEA registration, and hospital privileges), assigns
      a unique provider ID, and returns the creation status. Additionally, it initiates
      an audit trail by creating a HubSpot support ticket that logs the provider’s
      activation details, ensuring traceability and compliance with institutional
      onboarding protocols.
    name: create_provider_profile_in_emr
    nodes_depended_on:
    - compile_credentialing_report
    - obtain_signed_employment_contract
    nodes_dependent_on: []
    prompt: 'Using the aggregated credentialing report JSON and the signed employment
      contract, populate the EMR provider fields (name, NPI, specialties, license,
      DEA number, privileges, and any additional required identifiers). After successful
      creation, automatically generate a HubSpot support ticket capturing the provider
      ID, creation timestamp, and status. Return a JSON payload containing:


      - `provider_id`: the unique identifier assigned by the EMR.

      - `creation_status`: "success" or a detailed error message.

      - `ticket_id`: the HubSpot ticket identifier.

      - `ticket_url`: a direct link to the ticket.


      Ensure that the ticket includes context such as physician name, contract date,
      and credentialing summary for audit purposes.'
  finalize_credentialing:
    agent: false
    description: Finalizes the physician’s credentialing process by marking them as
      'Active' in the credentialing database, recording the activation date, and creating
      a corresponding HubSpot service ticket to notify the credentialing team and
      document the completion. This node consolidates all prior approvals, assigns
      clinical privileges, grants system access, and confirms HIPAA acknowledgment
      before publishing the final status.
    name: finalize_credentialing
    nodes_depended_on:
    - schedule_privileging_committee_review
    - assign_clinical_privileges
    - grant_system_access
    - verify_hippa_acknowledgment
    nodes_dependent_on: []
    prompt: "1. Update the credentialing database status for the physician to 'Active'.\
      \ 2. Record the activation timestamp (ISO 8601 UTC). 3. Create a HubSpot service\
      \ ticket with the following details:\n   - Ticket Name: \"Credentialing Completion\
      \ – {physician_name}\"\n   - Description: \"The physician has passed all credentialing\
      \ steps and is now fully authorized for clinical duties. Activation date: {activation_date}.\"\
      \n   - Priority: Medium\n   - Owner: Credentialing Team Lead\n   - Custom Properties:\n\
      \     - Physician ID\n     - Activation Date\n     - Final Status (Active)\n\
      4. Return a JSON object containing `final_status` (should be \"Active\") and\
      \ `activation_date`.\nAll identifiers must match the values stored in the credentialing\
      \ database. Ensure the HubSpot API call succeeds before returning the JSON payload."
  grant_system_access:
    agent: false
    description: Provision secure, role‑specific user accounts for a newly hired physician
      across all required clinical systems. The node generates system‑unique usernames
      and compliant temporary passwords, assigns the correct role‑based permissions,
      creates the accounts in each system’s directory, logs the action via a HubSpot
      support ticket for audit and tracking, and outputs a structured JSON list of
      credentials for downstream onboarding processes.
    name: grant_system_access
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    prompt: "For each clinical system that the new physician must access:\n1. Generate\
      \ a unique, system‑specific username following the hospital’s naming convention.\n\
      2. Create a secure, temporary password that complies with the system’s password\
      \ policy.\n3. Assign the appropriate role‑based permissions based on the physician’s\
      \ specialties and privileges.\n4. Persist the account details in the system’s\
      \ user directory.\n5. Create a HubSpot support ticket documenting the account\
      \ creation, including system_name, username, temporary_password, and the assigned\
      \ role.\n6. Return a JSON array where each element contains system_name, username,\
      \ and temporary_password.\n\nExample output:\n```json\n[{\n  \"system_name\"\
      : \"EHR\",\n  \"username\": \"dr.john_smith_ehr\",\n  \"temporary_password\"\
      : \"TempPass!23\"\n}, {\n  \"system_name\": \"LabInfo\",\n  \"username\": \"\
      dr.john_smith_lab\",\n  \"temporary_password\": \"LabTemp!45\"\n}]\n```\nEnsure\
      \ that the HubSpot tickets are created with a priority of \"High\" and include\
      \ a reference to the newly created provider_id from the parent node."
  notify_hr_payroll:
    agent: false
    description: Creates a HubSpot ticket to notify the HR and payroll departments
      that the physician has been activated and is eligible for compensation, capturing
      all relevant details and routing the ticket to the appropriate team.
    name: notify_hr_payroll
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    prompt: 'Create a HubSpot support ticket in the "HR & Payroll Notifications" pipeline.
      Include:

      1. Physician full name, ID, and activation date.

      2. Status: "Active – Compensation Eligible".

      3. Links to the physician’s credentialing record and payroll profile.

      4. A concise summary of the activation.

      5. Assign the ticket to the appropriate payroll analyst and tag it with the
      physician’s specialty.

      Ensure the ticket is logged with a timestamp and that a confirmation email is
      sent to the HR and payroll teams.'
  obtain_professional_references:
    agent: false
    description: Collects at least three professional references from a physician’s
      recent supervisors. The node sends templated email requests, creates a HubSpot
      ticket for each request, records received references with a 1‑5 rating and comments,
      updates ticket status, and outputs a consolidated JSON summary of all references.
    name: obtain_professional_references
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: "## Step 1: Reference Request Email Template\nCreate a professional email\
      \ template to request reference letters from a physician’s recent supervisors.\
      \ The template should:\n1. Address the supervisor politely by name.\n2. Briefly\
      \ describe the purpose of the reference.\n3. Specify the required information:\
      \ supervisor’s full name, title/position, organization, contact details, and\
      \ a rating scale from 1 (lowest) to 5 (highest).\n4. Include a deadline for\
      \ response and a courteous closing.\n\n**Example:**\n```\nSubject: Request for\
      \ Professional Reference – Dr. {physician_name}\n\nDear {supervisor_name},\n\
      \nI hope this message finds you well. I am reaching out to kindly request a\
      \ brief professional reference for Dr. {physician_name} as part of our credentialing\
      \ process.\n\nPlease provide the following details:\n- Your full name and title\n\
      - Your organization and your role\n- A rating of Dr. {physician_name}'s performance\
      \ (1‑5)\n- Any additional comments or observations you wish to share\n\nI would\
      \ appreciate receiving your response by {deadline_date}.\n\nThank you very much\
      \ for your time and support.\n\nBest regards,\n{your_name}\n{your_position}\n\
      {your_contact}\n```\n\n## Step 2: HubSpot Ticket Creation\nFor each reference\
      \ request sent, create a HubSpot ticket with the following properties:\n- **Ticket\
      \ Name:** Reference Request – {physician_name} – {supervisor_name}\n- **Status:**\
      \ New\n- **Priority:** Normal\n- **Owner:** {your_user_id}\n- **Description:**\
      \ Include the email template text and the deadline.\n- **Custom Fields:** `physician_name`,\
      \ `supervisor_name`, `reference_deadline`, `reference_status` (Pending/Received)\n\
      \n## Step 3: Reference Response Collection\nAfter receiving a reference, summarize\
      \ it in JSON with these fields:\n- `reference_name`\n- `relationship`\n- `rating`\
      \ (1‑5)\n- `comments`\n\nAlso update the corresponding HubSpot ticket: set `reference_status`\
      \ to **Received** and append the JSON summary to the ticket notes.\n\n## Step\
      \ 4: Final Summary Output\nReturn a JSON array containing the three collected\
      \ reference objects. Ensure each object adheres to the structure:\n```json\n\
      {\n  \"reference_name\": \"...\",\n  \"relationship\": \"...\",\n  \"rating\"\
      : 4,\n  \"comments\": \"...\"\n}\n```\n"
  obtain_signed_employment_contract:
    agent: false
    description: Securely sends the employment contract to the physician, collects
      the electronically signed copy, and logs the transaction in HubSpot by creating
      a ticket that captures contract details and signature metadata. This node ensures
      compliance, auditability, and integration with the CRM system for downstream
      processes.
    name: obtain_signed_employment_contract
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: "Create a personalized email to the physician using the data from `collect_physician_basic_info`.\
      \ Attach the latest PDF employment contract, request an electronic signature\
      \ via a secure link, and upon receipt of the signed document, record the following\
      \ in a HubSpot ticket:\n1. **Contract ID** – extracted from the PDF metadata.\n\
      2. **Signed Date** – timestamp returned by the signature platform.\n3. **Physician\
      \ Email** – from the collected data.\n4. **Contract Status** – set to \"Signed\"\
      .\nThe ticket should be titled \"Employment Contract Signed – {physician_name}\"\
      \ and include all details in the ticket body. Return a JSON object with keys:\
      \ `contract_id`, `signed_date`, and `hubspot_ticket_id`.\n\nExample response\
      \ format:\n```json\n{\n  \"contract_id\": \"C-2026-0001\",\n  \"signed_date\"\
      : \"2026-03-25T14:32:07Z\",\n  \"hubspot_ticket_id\": 123456789\n}\n```\n"
  schedule_orientation:
    agent: false
    description: Schedules the mandatory orientation session for a newly credentialed
      physician, selects an optimal time slot, notifies the physician via calendar
      invite, and creates a corresponding HubSpot ticket for tracking and audit purposes.
    name: schedule_orientation
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    prompt: '1. Retrieve the provider ID from the preceding node. 2. Query the institution’s
      scheduling API to obtain all available orientation slots within the next 14
      days. 3. Select the earliest slot that aligns with the provider’s specialty
      and time zone constraints. 4. Create a HubSpot ticket titled "Orientation Scheduling
      – {provider_name}" with the following properties: *Ticket ID* (auto‑generated),
      *Provider ID*, *Orientation Date*, *Location*, *Status* set to "Scheduled".
      5. Generate a calendar invite (iCalendar format) that includes the orientation
      date, time, and location, and email it to the physician’s verified contact address.
      6. Return a JSON payload containing `orientation_date`, `location`, and the
      newly created `ticket_id`.'
  schedule_privileging_committee_review:
    agent: false
    description: Orchestrates the scheduling of a physician for the next available
      privileging committee meeting, meticulously recording meeting specifics, and
      disseminating pertinent documentation to stakeholders.
    name: schedule_privileging_committee_review
    nodes_depended_on:
    - compile_credentialing_report
    nodes_dependent_on: []
    prompt: Create a calendar entry for the privileging committee meeting, specifying
      the date, time, physician name, and attaching the comprehensive credentialing
      report. Ensure seamless integration with existing scheduling systems and automate
      reminders to committee members.
  update_credentialing_database:
    agent: false
    description: Persist the physician’s final credentialing outcome—status, activation
      date, and comprehensive verification results—into the central repository. Simultaneously
      generate a HubSpot ticket to log the update for audit and compliance tracking.
      The node returns a JSON payload with the database record identifier, the exact
      timestamp of insertion, and the HubSpot ticket identifier, ensuring traceability
      across systems.
    name: update_credentialing_database
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    prompt: Insert the compiled credentialing report and final status into the credentialing
      database. Then, create a HubSpot ticket documenting the update, including the
      physician’s identifier, the activation status, and the timestamp. Return JSON
      confirming record_id, timestamp, and ticket_id.
  verify_board_certification:
    agent: false
    description: Queries the national board certification database using the physician’s
      identifiers, validates each certification’s current status, and automatically
      generates HubSpot support tickets for any certifications that are not active.
      Returns a structured JSON array of all certifications along with a flag indicating
      ticket creation.
    name: verify_board_certification
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: "1️⃣ **Query Certification Database**\n   • Using the physician’s NPI,\
      \ medical_license_number, and specialty from the parent node, query the national\
      \ board certification API.\n   • Retrieve the most recent certification record\
      \ for each board the physician is listed on.\n   • For each record, capture:\n\
      \     - `certification_body` (e.g., ABIM, ABP)\n     - `specialty`\n     - `certification_status`\
      \ (Active, Expired, Pending, Revoked)\n     - `expiration_date` (ISO‑8601)\n\
      \n2️⃣ **Validate Status**\n   • If any `certification_status` is not *Active*,\
      \ flag the record and prepare a brief remediation note.\n\n3️⃣ **Create HubSpot\
      \ Ticket**\n   • For every certification that is expired, pending, or revoked,\
      \ generate a HubSpot ticket with:\n     - **Subject**: \"Board Certification\
      \ Review – [Physician Name]\"\n     - **Description**: Include the `certification_body`,\
      \ `specialty`, current `certification_status`, `expiration_date`, and the remediation\
      \ note.\n     - **Custom Fields**: `NPI`, `Medical License Number`, `Specialty`,\
      \ `Board Status`.\n   • Use HubSpot’s REST API (POST /crm/v3/objects/tickets)\
      \ and ensure authentication via an OAuth access token.\n\n4️⃣ **Return Structured\
      \ Output**\n   • Output a JSON array where each element corresponds to a board\
      \ certification record with the keys: `certification_body`, `specialty`, `certification_status`,\
      \ `expiration_date`.\n   • Include a boolean field `ticket_created` indicating\
      \ whether a HubSpot ticket was generated for that record.\n\n**Example Output**\n\
      ```json\n[{\n  \"certification_body\": \"ABIM\",\n  \"specialty\": \"Internal\
      \ Medicine\",\n  \"certification_status\": \"Active\",\n  \"expiration_date\"\
      : \"2026-08-15\",\n  \"ticket_created\": false\n}, {\n  \"certification_body\"\
      : \"ABP\",\n  \"specialty\": \"Cardiology\",\n  \"certification_status\": \"\
      Expired\",\n  \"expiration_date\": \"2023-12-01\",\n  \"ticket_created\": true\n\
      }]\n```\n"
  verify_dea_registration:
    agent: false
    description: Verifies that a physician’s DEA registration is currently active
      and that the registered name matches the physician’s legal name, while simultaneously
      generating a HubSpot ticket to log the verification for audit and compliance
      purposes.
    name: verify_dea_registration
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: 'Using the DEA_number provided by the previous node, query the DEA database
      to confirm that the registration is active and retrieve its expiration_date.
      Compare the registered name in the DEA record with the physician''s name from
      the collected basic information. Return a JSON object containing:


      - dea_status: one of "active", "inactive", or "expired"

      - expiration_date: ISO‑8601 formatted date

      - name_match: boolean indicating whether the names match


      In addition, create a HubSpot ticket documenting this verification. The ticket
      should:


      - Subject: "DEA Verification for {name}"

      - Body: Include the physician’s name, DEA_number, dea_status, expiration_date,
      and name_match value.


      Do not output any other text beyond the required JSON and ticket creation action.'
  verify_education_and_training:
    agent: false
    description: Authenticates a physician’s medical school, residency, and fellowship
      credentials by systematically cross‑referencing each education entry against
      its accrediting body, recording verification outcomes, and logging the process
      via HubSpot tickets to ensure auditability and traceability.
    name: verify_education_and_training
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: "Create a HubSpot ticket for each education entry that requires verification.\
      \ For every record in `education_history`:\n1. Identify the accrediting body\
      \ (e.g., Liaison Committee on Medical Education, ACGME, ABFM, etc.) based on\
      \ the institution and program type.\n2. Cross‑reference the record against the\
      \ accrediting body’s public API or registry to confirm accreditation status,\
      \ program dates, and graduation credentials.\n3. If the verification is successful,\
      \ append a status field `verified: true` and store the accrediting body’s confirmation\
      \ ID.\n4. If the verification fails or data is missing, append `verified: false`\
      \ and include a detailed error message.\n5. Generate a JSON object for each\
      \ entry containing:\n   - `institution`, `degree`, `program_type`, `start_date`,\
      \ `end_date`, `accrediting_body`, `verification_status`, `confirmation_id` (if\
      \ any), and `error_message` (if any).\n6. Submit a HubSpot ticket with the JSON\
      \ payload as a custom field, labeling the ticket with the physician’s NPI and\
      \ a priority based on verification status.\n7. Return an array of the created\
      \ ticket IDs along with the enriched education records."
  verify_hippa_acknowledgment:
    agent: false
    description: Records the physician’s acknowledgment of HIPAA policies by capturing
      the electronic signature, timestamping the acknowledgment, and storing the signer’s
      identity. After capturing this data, the node automatically generates a HubSpot
      ticket to audit the compliance event, ensuring traceability and facilitating
      future reporting or audit requirements.
    name: verify_hippa_acknowledgment
    nodes_depended_on:
    - complete_compliance_training
    nodes_dependent_on: []
    prompt: Capture the physician’s electronic signature on the HIPAA acknowledgment
      form, record the acknowledgment date and signer’s name, then create a new HubSpot
      support ticket to log this compliance event. The ticket should include the physician’s
      ID, acknowledgment_date, signed_by, and a link to the signed document. Return
      a JSON payload containing the acknowledgment_date and signed_by, and the newly
      created HubSpot ticket ID.
  verify_hospital_privileges_history:
    agent: false
    description: Creates a comprehensive HubSpot ticket documenting the physician’s
      hospital privileging history. The ticket captures a JSON summary of revoked,
      suspended, or limited privileges, along with narrative insights, and attaches
      the original privilege report for audit purposes. This ensures that the privileging
      data is tracked centrally, facilitates compliance review, and supports downstream
      workflow steps that may require privilege verification.
    name: verify_hospital_privileges_history
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: 'Generate a HubSpot ticket that records the physician’s hospital privileging
      history. Include:

      1. Physician name, NPI, and contact details.

      2. A concise JSON summary of all privilege records, marking any revoked, suspended,
      or limited entries with their dates and reasons.

      3. A short narrative note highlighting key findings.

      4. Attach the raw privilege report as a PDF.

      The ticket must be created in the "Hospital Privileges" pipeline with the status
      set to "Under Review" and tagged with the physician’s NPI.'
  verify_malpractice_insurance:
    agent: false
    description: Creates a HubSpot ticket that confirms a physician’s malpractice
      insurance coverage, ensuring no lapses or gaps exist. The node pulls provider
      details from the physician’s record, verifies continuous coverage, and records
      the findings in a structured ticket for audit and compliance tracking.
    name: verify_malpractice_insurance
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: "Create a HubSpot ticket to verify the physician’s malpractice insurance\
      \ status:\n1. Retrieve the provider name, policy number, coverage limit, effective\
      \ date, and expiration date from the provider listed in the physician’s profile.\n\
      2. Check for any coverage gaps between the effective date and the current date,\
      \ or between the current date and the expiration date.\n3. If a gap exists,\
      \ flag it and include the details in the ticket.\n4. Populate the ticket with\
      \ the following fields in JSON format:\n   - carrier_name\n   - policy_number\n\
      \   - coverage_limit\n   - effective_date\n   - expiration_date\n   - gaps:\
      \ array of objects with start_date, end_date, and description.\n5. Attach the\
      \ physician’s basic info (name, NPI, medical_license_number, DEA_number) to\
      \ the ticket for context.\n6. Close the ticket with a status of \"Completed\"\
      \ if no gaps are found, or \"Pending Review\" if gaps exist.\nProvide the ticket\
      \ ID and a concise summary of the verification outcome."
  verify_medical_license:
    agent: false
    description: Verifies a physician's medical license status, validity, and compliance
      with state requirements, while logging each attempt and generating a HubSpot
      ticket for audit and follow‑up.
    name: verify_medical_license
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    prompt: "## License Verification\n1. Extract the `medical_license_number` from\
      \ the JSON payload produced by `collect_physician_basic_info`.\n2. Query the\
      \ state‑or‑national licensing database (or the provider’s REST API) to retrieve\
      \ the license record for the given number.\n3. Validate the following fields:\n\
      \   - **License Status** (Active, Suspended, Revoked, Expired)\n   - **Issuing\
      \ State/Province** matches the physician’s current practice location\n   - **Expiration\
      \ Date** is in the future\n   - **Board Certification** (if applicable) is current\n\
      4. If the license is **not** active, or any field fails validation, flag the\
      \ record as *invalid*.\n5. Capture a timestamped audit trail of the lookup result,\
      \ including API response codes and any error messages.\n6. **Create a HubSpot\
      \ ticket** for every verification attempt:\n   - Subject: `Medical License Verification\
      \ – {medical_license_number}`\n   - Description: Include the physician’s name,\
      \ NPI, license status, validation outcome, and any notes from the API response.\n\
      \   - Properties: `hs_ticket_type: Verification`, `medical_license_number`,\
      \ `verification_status` (Success/Failure), `expiry_date`, `validation_notes`.\n\
      7. Return a JSON object containing:\n   ```json\n   {\n     \"medical_license_number\"\
      : \"string\",\n     \"verification_status\": \"Success|Failure\",\n     \"license_status\"\
      : \"Active|Suspended|Revoked|Expired\",\n     \"issuer\": \"state/province\"\
      ,\n     \"expiration_date\": \"YYYY-MM-DD\",\n     \"board_certified\": true|false,\n\
      \     \"validation_notes\": \"string\",\n     \"hubspot_ticket_id\": \"string\"\
      \n   }\n   ```\nEnsure the output JSON keys exactly match those used by downstream\
      \ nodes.\n"
