dag_type: plain_text
description: Generated workflow from UI.
name: physician_credentialing_onboarding
nodes:
  assign_clinical_privileges:
    agent: false
    description: Assign specific clinical privileges to the physician in the EMR based
      on committee recommendation
    name: assign_clinical_privileges
    nodes_depended_on:
    - schedule_privileging_committee_review
    nodes_dependent_on: []
    output_structure:
    - description: List of clinical privileges assigned to the physician
      key: privileges_assigned
      type: List[str]
    - description: Whether the EMR profile was successfully updated
      key: emr_update_status
      type: bool
    prompt: List the approved clinical privileges (e.g., inpatient admission, surgery)
      and update the EMR profile. Return JSON with privileges_assigned array.
  check_pecos:
    agent: false
    description: Checks the physician's PECOS enrollment status, enrollment date,
      and Medicare eligibility.
    name: check_pecos
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the physician is enrolled in PECOS.
      key: pecos_enrolled
      type: bool
    - description: Date of PECOS enrollment in ISO format (YYYY-MM-DD).
      key: enrollment_date
      type: str
    - description: Indicates whether the physician is eligible for Medicare participation.
      key: medicare_eligible
      type: bool
    - description: Error message if PECOS check fails or enrollment data is incomplete.
      key: pecos_error_message
      type: str
    prompt: Verify the physician's enrollment in the Provider Enrollment, Chain, and
      Ownership System (PECOS) for Medicare participation.
  collect_physician_basic_info:
    agent: false
    description: Gather all required personal and professional information from the
      physician (name, contact, NPI, license number, DEA number, education, work history).
    name: collect_physician_basic_info
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Create a checklist of required basic information for a new physician
      and format the collected data as a JSON object with keys: name, email, phone,
      NPI, medical_license_number, DEA_number, education_history, employment_history,
      malpractice_insurance_provider.'
  compile_credentialing_report:
    agent: false
    description: Aggregate all verification results into a single credentialing report.
    name: compile_credentialing_report
    nodes_depended_on:
    - verify_medical_license
    - verify_board_certification
    - verify_dea_registration
    - verify_malpractice_insurance
    - verify_education_and_training
    - obtain_professional_references
    - conduct_background_check
    - verify_hospital_privileges_history
    - check_pecos
    nodes_dependent_on: []
    output_structure:
    - description: Whether the medical license verification passed
      key: medical_license_pass
      type: bool
    - description: Whether all board certifications are current and valid
      key: board_certification_pass
      type: bool
    - description: Whether the DEA registration is active and matches the physician
      key: dea_registration_pass
      type: bool
    - description: Whether malpractice coverage is adequate with no gaps
      key: malpractice_insurance_pass
      type: bool
    - description: Whether education and training credentials are verified
      key: education_and_training_pass
      type: bool
    - description: Whether at least three professional references are positive
      key: professional_references_pass
      type: bool
    - description: Whether background check returned no criminal records or sanctions
      key: background_check_pass
      type: bool
    - description: Whether hospital privileges history has no revocations or limitations
      key: hospital_privileges_pass
      type: bool
    - description: Whether the physician is enrolled in PECOS for Medicare
      key: pecos_enrollment_pass
      type: bool
    - description: Overall pass status based on all categories
      key: overall_pass
      type: bool
    - description: Overall recommendation for the physician (approve or hold)
      key: overall_recommendation
      type: str
    prompt: Combine the JSON outputs from all verification steps into one comprehensive
      credentialing report. Include a pass/fail flag for each category and an overall
      recommendation (approve/hold).
  complete_compliance_training:
    agent: false
    description: Enables the physician to complete required compliance and safety
      training modules and records completion status for each module.
    name: complete_compliance_training
    nodes_depended_on:
    - schedule_orientation
    nodes_dependent_on: []
    output_structure:
    - description: List of identifiers for each compliance training module assigned
        to the physician.
      key: training_module_ids
      type: List[str]
    - description: Parallel list indicating completion (true) or pending (false) for
        each module in training_module_ids.
      key: completion_status
      type: List[bool]
    - description: True if all assigned modules are completed; otherwise false.
      key: overall_completion
      type: bool
    prompt: Enroll the physician in the online compliance training modules, track
      completion, and return JSON with training_module_ids and completion_status.
  conduct_background_check:
    agent: false
    description: Run a national criminal background and sanctions check on the physician.
    name: conduct_background_check
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the physician has any criminal records (true
        if yes, false if no).
      key: criminal_records
      type: bool
    - description: Indicates whether the physician is subject to any sanctions (true
        if yes, false if no).
      key: sanctions
      type: bool
    - description: A list of textual details about any criminal records or sanctions
        found.
      key: details_if_any
      type: List[str]
    prompt: 'Perform a simulated background check using the physician''s full name
      and DOB, and return JSON: criminal_records (yes/no), sanctions (yes/no), details_if_any.'
  create_provider_profile_in_emr:
    agent: false
    description: Enter the physician's credentials into the electronic medical record
      system and create a provider profile.
    name: create_provider_profile_in_emr
    nodes_depended_on:
    - compile_credentialing_report
    - obtain_signed_employment_contract
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier assigned by the EMR for the new provider profile.
      key: provider_id
      type: str
    - description: Result of the profile creation operation (e.g., 'success', 'failure').
      key: status
      type: str
    prompt: Using the credentialing report and contract, populate the EMR provider
      fields (name, NPI, specialties, license, DEA, privileges). Return JSON with
      provider_id and status.
  finalize_credentialing:
    agent: false
    description: Mark the physician as fully credentialed and ready for clinical duties.
    name: finalize_credentialing
    nodes_depended_on:
    - schedule_privileging_committee_review
    - assign_clinical_privileges
    - grant_system_access
    - verify_hippa_acknowledgment
    nodes_dependent_on: []
    output_structure:
    - description: The status of the credentialing process, e.g., 'Active'.
      key: final_status
      type: str
    - description: The date when the physician was activated, formatted as YYYY-MM-DD.
      key: activation_date
      type: str
    prompt: Update the credentialing database status to 'Active', log the date of
      activation, and output JSON with final_status and activation_date.
  grant_system_access:
    agent: false
    description: Provision user accounts for EHR, order entry, and other clinical
      systems.
    name: grant_system_access
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Name of the clinical system (e.g., EHR, Order Entry, Lab System)
      key: system_name
      type: str
    - description: Username assigned to the physician for the system
      key: username
      type: str
    - description: Initial temporary password for the physician to use at first login
      key: temporary_password
      type: str
    prompt: Create login credentials for the physician in each required system, set
      appropriate role-based permissions, and output JSON with system_name, username,
      temporary_password.
  notify_hr_payroll:
    agent: false
    description: Sends a notification to the HR and payroll departments indicating
      that the physician has been activated and is eligible for compensation.
    name: notify_hr_payroll
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the notification was successfully sent to HR
        and payroll.
      key: notification_status
      type: bool
    - description: Timestamp of when the notification was sent.
      key: notification_date
      type: str
    - description: Indicates whether HR has acknowledged receipt of the notification.
      key: hr_acknowledgement
      type: bool
    - description: Indicates whether payroll has acknowledged receipt of the notification.
      key: payroll_acknowledgement
      type: bool
    prompt: Inform HR and payroll that the physician is active and eligible for compensation.
  obtain_professional_references:
    agent: false
    description: Collect and record at least three professional references from the
      physician's recent supervisors. The node should output a summary of each reference
      including the reference's name, relationship to the physician, a rating on a
      scale of 1 to 5, and any comments.
    name: obtain_professional_references
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of reference names in the order received
      key: reference_names
      type: List[str]
    - description: List of relationships corresponding to each reference
      key: relationships
      type: List[str]
    - description: List of integer ratings (1‑5) for each reference
      key: ratings
      type: List[int]
    - description: List of comments provided by each reference
      key: comments
      type: List[str]
    prompt: 'Generate a template email to request reference letters, then summarize
      the received responses as JSON: reference_name, relationship, rating (1‑5),
      comments.'
  obtain_signed_employment_contract:
    agent: false
    description: Send the employment contract to the physician and capture the signed
      copy.
    name: obtain_signed_employment_contract
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier assigned to the employment contract.
      key: contract_id
      type: str
    - description: Date (ISO 8601 format) when the physician electronically signed
        the contract.
      key: signed_date
      type: str
    prompt: Generate an email with a PDF employment contract attached, request electronic
      signature, and return a JSON receipt with contract_id and signed_date once completed.
  schedule_orientation:
    agent: false
    description: Book the physician for the mandatory orientation session.
    name: schedule_orientation
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: The scheduled date and time for the orientation session.
      key: orientation_date
      type: str
    - description: The physical or virtual location where the orientation will take
        place.
      key: location
      type: str
    prompt: Select an available orientation slot, send calendar invitation to the
      physician, and return JSON with orientation_date and location.
  schedule_privileging_committee_review:
    agent: false
    description: Schedule the physician for the next privileging committee meeting
      and record the meeting details.
    name: schedule_privileging_committee_review
    nodes_depended_on:
    - compile_credentialing_report
    nodes_dependent_on: []
    output_structure:
    - description: Date of the privileging committee meeting in YYYY-MM-DD format
      key: meeting_date
      type: str
    - description: Start time of the meeting in HH:MM format (24-hour)
      key: meeting_time
      type: str
    - description: Full name of the physician being reviewed
      key: physician_name
      type: str
    - description: Identifier of the compiled credentialing report attached to the
        calendar event
      key: credentialing_report_id
      type: str
    prompt: Create a calendar entry for the privileging committee with date, time,
      physician name, and attach the credentialing report.
  update_credentialing_database:
    agent: false
    description: Record all verification results and final status in the central credentialing
      repository, returning a confirmation of the database entry.
    name: update_credentialing_database
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier assigned to the record in the credentialing database
      key: record_id
      type: int
    - description: ISO 8601 formatted timestamp indicating when the record was created
      key: timestamp
      type: str
    prompt: Insert the compiled credentialing report and final status into the credentialing
      database. Return JSON confirming record_id and timestamp.
  verify_board_certification:
    agent: false
    description: Validate the physician's board certification(s) and current status.
    name: verify_board_certification
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the certifying board (e.g., American Board of Internal
        Medicine).
      key: certification_body
      type: str
    - description: Medical specialty for which the certification was obtained.
      key: specialty
      type: str
    - description: Current status of the certification (e.g., active, inactive, expired).
      key: certification_status
      type: str
    - description: Date the certification expires in YYYY-MM-DD format.
      key: expiration_date
      type: str
    prompt: Check the physician's board certification(s) against the certifying board
      database and output JSON with certification_body, specialty, certification_status,
      and expiration_date.
  verify_dea_registration:
    agent: false
    description: Confirm the DEA registration is active and matches the physician's
      name.
    name: verify_dea_registration
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The current status of the DEA registration (e.g., 'active', 'inactive',
        'expired').
      key: dea_status
      type: str
    - description: The expiration date of the DEA registration in ISO format (YYYY-MM-DD).
      key: expiration_date
      type: str
    - description: Indicates whether the name on the DEA registration matches the
        physician's name.
      key: name_match
      type: bool
    prompt: 'Validate the DEA_number provided, returning JSON: dea_status, expiration_date,
      name_match (true/false).'
  verify_education_and_training:
    agent: false
    description: Authenticate the physician's medical school, residency, and fellowship
      credentials by verifying each education entry against the relevant accrediting
      body.
    name: verify_education_and_training
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Total number of education entries processed
      key: education_entry_count
      type: int
    - description: Names of institutions for each education entry
      key: institution_names
      type: List[str]
    - description: Accrediting body for each institution
      key: accrediting_bodies
      type: List[str]
    - description: Medical specialty or training field for each entry
      key: specialty_or_field
      type: List[str]
    - description: Year of completion or graduation for each entry
      key: completion_years
      type: List[int]
    - description: Whether each institution is accredited by the listed accrediting
        body
      key: is_accredited
      type: List[bool]
    - description: Overall validity flag for the entire education history
      key: overall_valid
      type: bool
    prompt: Cross-reference each entry in education_history with the appropriate accrediting
      body and output JSON for each entry.
  verify_hippa_acknowledgment:
    agent: false
    description: Record the physician's acknowledgment of HIPAA policies, including
      the date of acknowledgment and the name of the person who signed.
    name: verify_hippa_acknowledgment
    nodes_depended_on:
    - complete_compliance_training
    nodes_dependent_on: []
    output_structure:
    - description: The date the HIPAA acknowledgment was signed, formatted as YYYY-MM-DD.
      key: acknowledgment_date
      type: str
    - description: The full name of the physician who signed the HIPAA acknowledgment.
      key: signed_by
      type: str
    prompt: Capture the electronic signature on the HIPAA acknowledgment form and
      return JSON with acknowledgment_date and signed_by.
  verify_hospital_privileges_history:
    agent: false
    description: Review the physician's prior hospital privileging history for any
      revocations or limitations and output the summarized information.
    name: verify_hospital_privileges_history
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of hospital privilege names held by the physician
      key: privilege_name
      type: List[str]
    - description: Boolean list indicating whether each corresponding privilege has
        been revoked (true if revoked)
      key: revoked_status
      type: List[bool]
    - description: Boolean list indicating whether each corresponding privilege has
        been suspended (true if suspended)
      key: suspended_status
      type: List[bool]
    - description: Boolean list indicating whether each corresponding privilege has
        been limited (true if limited)
      key: limited_status
      type: List[bool]
    - description: Additional notes or details for each privilege, if any
      key: notes
      type: List[str]
    prompt: Summarize the physician's past hospital privileges, indicating any revoked,
      suspended, or limited privileges, in JSON format.
  verify_malpractice_insurance:
    agent: false
    description: Ensure the physician carries adequate malpractice coverage with no
      lapses.
    name: verify_malpractice_insurance
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the malpractice insurance carrier
      key: carrier_name
      type: str
    - description: Unique policy identifier issued by the carrier
      key: policy_number
      type: str
    - description: Maximum monetary coverage limit per claim
      key: coverage_limit
      type: float
    - description: Date the policy becomes effective (YYYY-MM-DD)
      key: effective_date
      type: str
    - description: Date the policy expires or is up for renewal (YYYY-MM-DD)
      key: expiration_date
      type: str
    - description: True if there are coverage gaps or lapses, otherwise False
      key: any_gaps
      type: bool
    prompt: 'Contact the malpractice insurance provider listed and return JSON: carrier_name,
      policy_number, coverage_limit, effective_date, expiration_date, any_gaps.'
  verify_medical_license:
    agent: false
    description: Confirm the physician's medical license status and validity.
    name: verify_medical_license
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The medical license number provided by the physician.
      key: license_number
      type: str
    - description: The state that issued the medical license.
      key: state
      type: str
    - description: The current status of the license (e.g., active, suspended, revoked).
      key: status
      type: str
    - description: The date when the license expires, formatted as YYYY-MM-DD.
      key: expiration_date
      type: str
    prompt: Verify medical license using license number from basic information.
