dag_type: plain_text
description: Creates a 12‑chapter autobiographical novel, each chapter split into
  three parts written concurrently. Generates theme, title, outlines, part outlines,
  paragraphs and assembles the final manuscript.
name: autobiographical_novel_creation_concurrent
nodes:
  assemble_novel:
    agent: false
    description: Combine all paragraphs into the final manuscript, inserting blank
      lines between parts and double blank lines between chapters, and prepend the
      title.
    name: assemble_novel
    nodes_depended_on:
    - paragraph_1_1
    - paragraph_1_2
    - paragraph_1_3
    - paragraph_2_1
    - paragraph_2_2
    - paragraph_2_3
    - paragraph_3_1
    - paragraph_3_2
    - paragraph_3_3
    - paragraph_4_1
    - paragraph_4_2
    - paragraph_4_3
    - paragraph_5_1
    - paragraph_5_2
    - paragraph_5_3
    - paragraph_6_1
    - paragraph_6_2
    - paragraph_6_3
    - paragraph_7_1
    - paragraph_7_2
    - paragraph_7_3
    - paragraph_8_1
    - paragraph_8_2
    - paragraph_8_3
    - paragraph_9_1
    - paragraph_9_2
    - paragraph_9_3
    - paragraph_10_1
    - paragraph_10_2
    - paragraph_10_3
    - paragraph_11_1
    - paragraph_11_2
    - paragraph_11_3
    - paragraph_12_1
    - paragraph_12_2
    - paragraph_12_3
    nodes_dependent_on: []
    prompt: Combine all 36 paragraphs in chapter order, insert a blank line between
      parts and a double blank line between chapters. Prepend the title generated
      earlier. Output the complete manuscript.
  create_novel_title:
    agent: false
    description: Generate a compelling title that reflects the defined theme.
    name: create_novel_title
    nodes_depended_on:
    - define_novel_theme
    nodes_dependent_on: []
    prompt: Generate a compelling title for the autobiographical novel that reflects
      the defined theme.
  define_novel_theme:
    agent: false
    description: Establish the overarching theme and emotional arc of the autobiographical
      novel.
    name: define_novel_theme
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Identify the central theme and emotional arc of the autobiographical novel
      in 2–3 sentences.
  draft_overall_outline:
    agent: false
    description: Provide a high‑level outline listing the 12 chapters with one‑sentence
      summaries.
    name: draft_overall_outline
    nodes_depended_on:
    - create_novel_title
    nodes_dependent_on: []
    prompt: List the 12 chapters of the novel. For each chapter give a one‑sentence
      summary of its focus.
  outline_chapter_1:
    agent: false
    description: Detailed outline for Chapter 1 (three main parts).
    name: outline_chapter_1
    nodes_depended_on:
    - draft_overall_outline
    nodes_dependent_on: []
    prompt: Write a detailed outline for Chapter 1 (≈150 words). Include three main
      parts and a brief description of each part.
