dag_type: plain_text
description: A step-by-step workflow for implementing the Quicksort algorithm, including
  pivot selection, partitioning logic, recursion, edge cases, and code integration
name: implement_quicksort_algorithm
nodes:
  define_quicksort_function_signature:
    agent: false
    description: Create the base function declaration with parameters and return type
    name: define_quicksort_function_signature
    nodes_depended_on: []
    nodes_dependent_on:
    - select_pivot_strategy
    - handle_base_cases
    prompt: Write the function signature for quicksort that accepts an array and returns
      a sorted array. Use clear parameter names and proper syntax for your target
      language.
  document_edge_case_handling:
    agent: false
    description: Create comments about duplicate values and memory
    name: document_edge_case_handling
    nodes_depended_on:
    - integrate_components
    nodes_dependent_on: []
    prompt: Add code comments explaining how the implementation handles duplicate
      values and space complexity considerations.
  handle_base_cases:
    agent: false
    description: Add conditions for empty arrays/single-element arrays
    name: handle_base_cases
    nodes_depended_on:
    - define_quicksort_function_signature
    nodes_dependent_on:
    - integrate_components
    prompt: Create conditional logic that immediately returns the array if it contains
      zero or one elements. Use proper array length checks for your language.
  implement_partitioning:
    agent: false
    description: Write code to move elements relative to the pivot
    name: implement_partitioning
    nodes_depended_on:
    - select_pivot_strategy
    nodes_dependent_on:
    - implement_recursive_sort
    prompt: Implement the array partitioning logic using the selected pivot strategy.
      Show how elements less than the pivot move to one side and greater elements
      to the other.
  implement_recursive_sort:
    agent: false
    description: Create recursive calls for left and right subarrays
    name: implement_recursive_sort
    nodes_depended_on:
    - implement_partitioning
    nodes_dependent_on:
    - integrate_components
    prompt: Write the recursive sorting calls that operate on the left and right subarrays
      generated by partitioning. Ensure proper base case handling.
  integrate_components:
    agent: false
    description: Combine all elements into working implementation
    name: integrate_components
    nodes_depended_on:
    - implement_recursive_sort
    - handle_base_cases
    nodes_dependent_on:
    - write_test_cases
    prompt: Assemble the base case handling, pivot selection partitioning logic, and
      recursive calls into a complete, syntactically correct Quicksort implementation.
  select_pivot_strategy:
    agent: false
    description: Choose between first-element, last-element, middle-element, or random
      pivot selection
    name: select_pivot_strategy
    nodes_depended_on:
    - define_quicksort_function_signature
    nodes_dependent_on:
    - implement_partitioning
    prompt: Decide on the pivot selection strategy for Quicksort (e.g., 'middle element'
      or 'random element') and document your choice with implementation-ready pseudocode.
  write_test_cases:
    agent: false
    description: Develop test scenarios for different input types
    name: write_test_cases
    nodes_depended_on:
    - integrate_components
    nodes_dependent_on: []
    prompt: 'Create test cases for Quicksort covering: empty array, single-element,
      sorted, reverse-sorted, and random arrays. Include expected outcomes.'
