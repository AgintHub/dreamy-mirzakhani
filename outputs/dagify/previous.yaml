dag_type: spec
description: Generated workflow from UI.
name: build_hedge_fund_detailed
nodes:
  choose_investment_strategy:
    agent: false
    description: Select hedge fund strategy aligned with objectives
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The primary hedge fund strategy category chosen (e.g., Long/Short
        Equity, Global Macro, Event‑Driven, Quantitative).
      key: strategy_category
      type: str
    - description: A one‑sentence rationale explaining why this strategy best serves
        the fund objectives.
      key: strategy_rationale
      type: str
    prd:
      conceptual_info: This node translates the fund’s high‑level objectives into
        a concrete investment strategy choice, ensuring alignment between stated goals
        and the selected hedge fund approach.
      docstring:
        examples:
        - lines:
          - 'choose_investment_strategy(

            '
          - '    objectives=["Generate alpha with low correlation to markets", "Maintain
            flexibility to trade multiple asset classes"],

            '
          - "    investment_purpose=\"Create diversified alpha sources for institutional\
            \ clients\", \n"
          - "    competitive_edge=\"Access to proprietary data analytics\", \n"
          - '    long_term_vision="Become a leading multi‑strategy fund in the next
            decade"

            '
          - )
          output: "{\n  \"strategy_category\": \"Multi‑Strategy (Long/Short Equity\
            \ + Macro) \",\n  \"strategy_rationale\": \"Combines equity alpha generation\
            \ with macro exposure to meet diversification and flexibility goals.\"\
            \n}"
        - lines:
          - 'choose_investment_strategy(

            '
          - '    objectives=["Achieve 15% annual gross return", "Limit volatility
            to 20%"],

            '
          - "    investment_purpose=\"Deliver high risk‑adjusted returns to high‑net‑worth\
            \ investors\", \n"
          - "    competitive_edge=\"In‑house algorithmic models\", \n"
          - '    long_term_vision="Establish a scalable, technology‑driven hedge fund"

            '
          - )
          output: "{\n  \"strategy_category\": \"Quantitative (Statistical Arbitrage)\
            \ \",\n  \"strategy_rationale\": \"Algorithmic models enable consistent\
            \ high returns while controlling volatility.\"\n}"
        parameters:
        - description: Bullet list of the fund’s primary business objectives (investment
            purpose, competitive edge, long‑term vision).
          name: objectives
          type: List[str]
        - description: Explicit description of the investment purpose extracted from
            the objectives.
          name: investment_purpose
          type: str
        - description: Competitive advantage statement derived from the objectives.
          name: competitive_edge
          type: str
        - description: Long‑term vision statement derived from the objectives.
          name: long_term_vision
          type: str
        raises:
        - description: Raised if any of the input objective components are missing
            or empty.
          type: ValueError
        - description: Raised if no single strategy can be determined to satisfy all
            objectives.
          type: RuntimeError
        returns:
          description: Dictionary containing the selected strategy category and a
            one‑sentence rationale.
          type: Dict[str, str]
        summary: Chooses a primary hedge fund strategy category that best aligns with
          the fund's objectives and returns a concise rationale.
    prompt: Select one primary hedge fund strategy category that best serves the fund
      objectives (e.g., long/short equity, global macro). Provide a one-sentence rationale.
  choose_legal_entity_type:
    agent: false
    description: Define fund legal structure
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The chosen legal entity type (e.g., LP, LLC, SICAV)
      key: legal_entity_type
      type: str
    - description: A one-sentence explanation for the chosen legal entity type
      key: explanation
      type: str
    prd:
      conceptual_info: This node determines the most suitable legal entity for the
        hedge fund based on the previously selected jurisdiction, providing a concise
        justification.
      docstring:
        examples:
        - lines:
          - choose_legal_entity_type('Cayman')
          output: '{''legal_entity_type'': ''LP'', ''explanation'': ''A Cayman Limited
            Partnership offers tax neutrality and flexibility for limited partners.''}'
        - lines:
          - choose_legal_entity_type('Luxembourg')
          output: '{''legal_entity_type'': ''SICAV'', ''explanation'': ''A Luxembourg
            SICAV provides an efficient structure for investment funds with a broad
            EU investor base.''}'
        parameters:
        - description: The fund domicile chosen in the preceding node (e.g., "Cayman",
            "Delaware", "Luxembourg").
          name: selected_jurisdiction
          type: str
        raises:
        - description: If `selected_jurisdiction` is not one of the supported jurisdictions.
          type: ValueError
        returns:
          description: A dictionary with keys `legal_entity_type` (str) and `explanation`
            (str) describing the chosen entity.
          type: dict
        summary: Selects an appropriate legal entity type for the fund and returns
          a one‑sentence explanation.
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Give a one-sentence explanation.
  clarify_fund_objectives:
    agent: false
    description: State the primary business objectives for launching the hedge fund
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Concise bullet list of primary business objectives for launching
        the hedge fund
      key: objectives
      type: List[str]
    - description: Description of the investment purpose
      key: investment_purpose
      type: str
    - description: Description of the competitive edge
      key: competitive_edge
      type: str
    - description: Description of the long‑term vision
      key: long_term_vision
      type: str
    prd:
      conceptual_info: The node generates a succinct set of business objectives that
        guide the subsequent fund design process. These objectives serve as a reference
        for strategy selection, target investor profiling, and jurisdiction choice,
        ensuring all downstream decisions align with the fund’s core mission.
      docstring:
        examples:
        - lines:
          - 'def clarify_fund_objectives(input_text):'
          - '    # implementation hidden'
          - '    return {'
          - '        ''objectives'': [''Maximize risk‑adjusted returns'', ''Deliver
            consistent alpha'', ''Build a resilient infrastructure''],'
          - '        ''investment_purpose'': ''Generate excess returns beyond traditional
            indices'','
          - '        ''competitive_edge'': ''Leverage proprietary analytics and a
            deep market network'','
          - '        ''long_term_vision'': ''Become a leading global multi‑strategy
            fund with a 10‑year track record of outperforming benchmarks''}'
          output: '{''objectives'': [''Maximize risk‑adjusted returns'', ''Deliver
            consistent alpha'', ''Build a resilient infrastructure''], ''investment_purpose'':
            ''Generate excess returns beyond traditional indices'', ''competitive_edge'':
            ''Leverage proprietary analytics and a deep market network'', ''long_term_vision'':
            ''Become a leading global multi‑strategy fund with a 10‑year track record
            of outperforming benchmarks''}'
        - lines:
          - result = clarify_fund_objectives('')
          - print(result['objectives'])
          output: 'ValueError: Input prompt must be a non‑empty string.'
        parameters:
        - description: Prompt text instructing the objective generation. In practice
            this is the fixed prompt provided by the node.
          name: input_text
          type: str
        raises:
        - description: If the input prompt is empty or not a string.
          type: ValueError
        returns:
          description: 'A dictionary containing four keys: ''objectives'' (list of
            bullet strings), ''investment_purpose'' (string), ''competitive_edge''
            (string), and ''long_term_vision'' (string).'
          type: dict
        summary: Generate a concise list of business objectives for a hedge fund launch.
    prompt: State the primary business objectives for launching the hedge fund. Produce
      a concise bullet list covering investment purpose, competitive edge, and long-term
      vision (max 8 bullets). Focus only on objectives, do not include strategy details.
  compile_pitch_deck_outline:
    agent: false
    description: Build fundraising presentation framework
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    - define_technology_stack
    - create_hiring_plan
    - estimate_setup_and_operating_costs
    - outline_governance_structure
    - design_compliance_program
    nodes_dependent_on: []
    output_structure:
    - description: Title of the first slide, introducing the hedge fund
      key: slide_1_title
      type: str
    - description: Brief description of the hedge fund's investment objectives
      key: investment_objectives
      type: str
    - description: Description of the chosen investment strategy
      key: investment_strategy
      type: str
    - description: List of key team members, including their roles and brief descriptions
      key: team_members
      type: List[str]
    - description: Description of the hedge fund's competitive edge
      key: competitive_edge
      type: str
    - description: List of core risk controls, including position limits, VaR limits,
        and stop-loss rules
      key: risk_controls
      type: List[str]
    - description: Description of the proposed fee structure, including management
        and performance fees
      key: fee_structure
      type: str
    - description: List of required software and infrastructure for each operation
        step
      key: technology_stack
      type: List[str]
    - description: List of essential full-time positions for launch, including one-line
        responsibilities
      key: hiring_plan
      type: List[str]
    - description: List of estimated annual costs for each provider, plus overhead
      key: operating_costs
      type: List[float]
    - description: Description of the internal governance framework, including roles
        and responsibilities
      key: governance_structure
      type: str
    - description: Description of the regulatory compliance framework, including a
        compliance checklist
      key: compliance_program
      type: str
    prd:
      conceptual_info: The node aggregates the outputs from several strategy, risk,
        and operational nodes to construct a coherent 10‑slide investor pitch deck
        outline. Each slide focuses on a key narrative element—objective, strategy,
        team, edge, risk, fees, technology, hiring, costs, governance, and compliance—providing
        concise, investor‑friendly summaries.
      docstring:
        examples:
        - lines:
          - result = compile_pitch_deck_outline(
          - '    clarify_fund_objectives_output={''objectives'': [''High alpha''],
            ''investment_purpose'': ''Alpha generation'', ''competitive_edge'': ''Quant
            model'', ''long_term_vision'': ''Global expansion''},'
          - '    define_investor_profile_output={''typical_ticket_size'': 5000000,
            ''risk_tolerance'': ''high'', ''liquidity_preference'': ''annual'', ''geographic_focus'':
            ''North America''},'
          - '    choose_investment_strategy_output={''strategy_category'': ''Quantitative'',
            ''strategy_rationale'': ''Data‑driven alpha''},'
          - '    set_performance_and_risk_targets_output={''gross_return'': 0.20,
            ''volatility'': 0.30, ''sharpe_ratio'': 1.5, ''max_drawdown'': 0.25},'
          - '    draft_fee_structure_output={''management_fee_percentage'': 0.02,
            ''performance_fee_percentage'': 0.20, ''hurdle_rate_percentage'': 0.05,
            ''summary_sentences'': [''2% mgmt fee'', ''20% perf fee above 5% hurdle'']},'
          - '    design_risk_management_framework_output={''control_name'': [''Position
            Limit'', ''VaR Limit''], ''target_metric'': [''Daily'', ''Annual''], ''limit_value'':
            [1.0, 0.02]},'
          - '    define_technology_stack_output={''ops_steps'': [''Data Collection'',
            ''Model Development'', ''Execution''], ''tech_components'': [''Python'',
            ''TensorFlow'', ''FIX'']},'
          - '    create_hiring_plan_output={''essential_positions'': [''Quant'', ''Trader''],
            ''position_responsibilities'': [''Build models'', ''Execute trades''],
            ''total_headcount'': 2},'
          - '    estimate_setup_and_operating_costs_output={''cost_item'': [''Prime
            Broker'', ''Admin''], ''estimated_usd'': [500000, 200000]},'
          - '    outline_governance_structure_output={''role1_name'': ''GP'', ''role1_duty'':
            ''Lead investment'', ''role2_name'': ''Manager'', ''role2_duty'': ''Day‑to‑day
            operations'', ''role3_name'': ''Board'', ''role3_duty'': ''Oversight'',
            ''role4_name'': ''Compliance Officer'', ''role4_duty'': ''Regulatory adherence'',
            ''role5_name'': ''Risk Officer'', ''role5_duty'': ''Risk monitoring''},'
          - "    design_compliance_program_output={'requirement_list': ['KYC', 'AML'],\
            \ 'policy_reference_list': ['Policy 1', 'Policy 2']}\"\n             \
            \   \")"
          output: "{\n  \"slide_1_title\": \"Introduction to QuantumAlpha Fund\",\n\
            \  \"investment_objectives\": \"Generate 20% annual gross return while\
            \ maintaining volatility below 30%.\",\n  \"investment_strategy\": \"\
            Quantitative multi‑factor strategy based on machine learning models.\"\
            ,\n  \"team_members\": [\"John Doe – Chief Quantitative Analyst\", \"\
            Jane Smith – Lead Trader\"],\n  \"competitive_edge\": \"Proprietary data‑driven\
            \ models and real‑time execution platform.\",\n  \"risk_controls\": [\"\
            Position Limit: 100% of capital\", \"Annual VaR Limit: 2%\"],\n  \"fee_structure\"\
            : \"2% management fee and 20% performance fee above a 5% hurdle.\",\n\
            \  \"technology_stack\": [\"Python for data science\", \"TensorFlow for\
            \ model training\", \"FIX protocol for execution\"],\n  \"hiring_plan\"\
            : [\"Quant – Build models\", \"Trader – Execute trades\"],\n  \"operating_costs\"\
            : [500000.0, 200000.0],\n  \"governance_structure\": \"GP leads investment,\
            \ Manager handles daily ops, Board provides oversight, Compliance Officer\
            \ ensures regulatory compliance, Risk Officer monitors risk limits.\"\
            ,\n  \"compliance_program\": \"KYC and AML policies mapped to internal\
            \ procedures.\"\n}"
        parameters:
        - description: Dictionary containing 'objectives', 'investment_purpose', 'competitive_edge',
            'long_term_vision' from clarify_fund_objectives.
          name: clarify_fund_objectives_output
          type: dict
        - description: Dictionary with target investor characteristics.
          name: define_investor_profile_output
          type: dict
        - description: Strategy category and rationale.
          name: choose_investment_strategy_output
          type: dict
        - description: Target financial and risk metrics.
          name: set_performance_and_risk_targets_output
          type: dict
        - description: Fee percentages, hurdle and summary sentences.
          name: draft_fee_structure_output
          type: dict
        - description: List of risk control names, target metrics and limits.
          name: design_risk_management_framework_output
          type: dict
        - description: Ops steps and corresponding tech components.
          name: define_technology_stack_output
          type: dict
        - description: Essential positions and responsibilities.
          name: create_hiring_plan_output
          type: dict
        - description: Cost items and estimated USD.
          name: estimate_setup_and_operating_costs_output
          type: dict
        - description: Governance roles and duties.
          name: outline_governance_structure_output
          type: dict
        - description: Compliance requirements and policy references.
          name: design_compliance_program_output
          type: dict
        raises:
        - description: If any required upstream output is missing or contains invalid
            types.
          type: ValueError
        - description: If downstream data does not conform to expected primitive types.
          type: TypeError
        returns:
          description: A dictionary matching the defined output_structure keys, each
            containing a string or list as specified.
          type: dict
        summary: Generate a 10‑slide investor pitch deck outline from upstream fund
          planning outputs.
    prompt: Create a 10-slide outline for an investor pitch deck incorporating objectives,
      strategy, team, edge, risk controls, and fees.
  create_hiring_plan:
    agent: false
    description: Define staffing requirements
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of essential full-time positions for launch
      key: essential_positions
      type: List[str]
    - description: List of one-line responsibilities for each position
      key: position_responsibilities
      type: List[str]
    - description: Total number of full-time positions required for launch
      key: total_headcount
      type: int
    prd:
      conceptual_info: This node translates the operational workflow into a concrete
        hiring plan by identifying the most critical full‑time roles needed at launch
        and summarizing each role’s core responsibility.
      docstring:
        examples:
        - lines:
          - steps = ["Idea Generation", "Order Entry", "Execution", "Confirmation",
            "Settlement", "Reconciliation"],
          - parties = ["Research Analyst", "Trader", "Execution Trader", "Operations",
            "Operations", "Operations"],
          - plan = create_hiring_plan(steps, parties)
          - print(plan['essential_positions'])
          - print(plan['position_responsibilities'])
          - print(plan['total_headcount'])
          output: "[\n  \"Research Analyst\",\n  \"Trader\",\n  \"Execution Trader\"\
            ,\n  \"Operations Lead\",\n  \"Settlement Specialist\",\n  \"Reconciliation\
            \ Analyst\"\n]\n[\"Generate and screen investment ideas.\",\n \"Enter\
            \ orders into the system.\",\n \"Execute trades on behalf of the fund.\"\
            ,\n \"Oversee trade confirmation and post‑trade operations.\",\n \"Coordinate\
            \ settlement with custodial and clearing partners.\",\n \"Validate daily\
            \ P&L and reconcile accounts.\"]\n6"
        - lines:
          - steps = ["Idea Generation", "Order Entry", "Execution"],
          - parties = ["Research", "Trader", "Execution"],
          - plan = create_hiring_plan(steps, parties),
          - print(plan['total_headcount'])
          output: '3'
        parameters:
        - description: Ordered list of each operational step in the daily trade lifecycle.
          name: trade_lifecycle_steps
          type: List[str]
        - description: Ordered list of the party responsible for each corresponding
            step in trade_lifecycle_steps.
          name: responsible_parties
          type: List[str]
        raises:
        - description: Raised if the input lists are empty or of mismatched length.
          type: ValueError
        returns:
          description: 'A dictionary containing three keys:

            - `essential_positions`: List[str] of position titles.

            - `position_responsibilities`: List[str] of one‑line responsibilities
            aligned with workflow gaps.

            - `total_headcount`: int total number of positions.'
          type: Dict[str, Any]
        summary: Generate an essential staffing list for a hedge fund launch based
          on the daily trade lifecycle.
    prompt: List essential full-time positions for launch (max 8) with one-line responsibilities.
      Align roles with workflow gaps.
  define_asset_universe:
    agent: false
    description: Enumerate tradable assets/instruments for the selected hedge fund
      strategy.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: A list of the asset classes that the hedge fund strategy will trade
        (e.g., equities, futures, fixed income, commodities, currencies). The list
        should contain no more than eight items.
      key: asset_classes
      type: List[str]
    - description: A list of specific instruments within each asset class that the
        strategy will trade (e.g., S&P 500 ETF, crude oil futures, US Treasury bonds).
        The list should also contain no more than eight items and should map directly
        to the asset_classes list.
      key: instrument_types
      type: List[str]
    prd:
      conceptual_info: This node captures the market scope of the hedge fund by translating
        the chosen strategy into concrete asset classes and instruments, ensuring
        alignment with operational and risk frameworks downstream.
      docstring:
        examples:
        - lines:
          - asset_classes, instrument_types = define_asset_universe("Long/Short Equity")
          output: (['Equities', 'Options', 'Fixed Income', 'Commodities'], ['S&P 500
            ETF', 'Equity Options', 'US Treasury Bonds', 'Gold Futures'])
        - lines:
          - asset_classes, instrument_types = define_asset_universe("Global Macro")
          output: (['Currencies', 'Futures', 'Equities', 'Fixed Income'], ['EUR/USD',
            'Euro Stoxx 50 Futures', 'NASDAQ Composite', 'Euro Government Bonds'])
        parameters:
        - description: The primary hedge fund strategy selected by `choose_investment_strategy`
            (e.g., "Long/Short Equity", "Global Macro").
          name: strategy_category
          type: str
        raises:
        - description: If `strategy_category` is not one of the supported strategy
            types.
          type: ValueError
        - description: If the derived lists exceed the maximum allowed length or are
            mismatched.
          type: RuntimeError
        returns:
          description: 'A tuple containing two lists: (asset_classes, instrument_types).
            Both lists contain at most eight string elements and are aligned by index.'
          type: Tuple[List[str], List[str]]
        summary: Generate a mapping of asset classes to specific instruments for a
          hedge fund strategy.
    prompt: List the specific asset classes and instruments the chosen strategy will
      trade (e.g., US equities, futures). Keep list ≤8 items.
  define_investor_profile:
    agent: false
    description: Specify target investor characteristics
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: Typical investment amount in USD that each target investor is expected
        to commit
      key: typical_ticket_size
      type: int
    - description: Qualitative assessment of risk tolerance (e.g., high, medium, low)
      key: risk_tolerance
      type: str
    - description: Preferred liquidity terms for the investment (e.g., quarterly,
        annual, lock‑up period)
      key: liquidity_preference
      type: str
    - description: Primary geographic regions or markets where target investors are
        located
      key: geographic_focus
      type: str
    prd:
      conceptual_info: The node translates the fund's business objectives into a concrete
        investor persona, outlining the financial size, risk appetite, liquidity needs,
        and geographic origin that align with the strategy.
      docstring:
        examples:
        - lines:
          - profile = define_investor_profile(
          - '    investment_purpose=''Generate alpha in emerging markets'','
          - '    competitive_edge=''Unique macro insights and rapid execution'','
          - "    long_term_vision='Be the leading global macro fund by 2035'\"\n \
            \               \")"
          output: "{\n  'typical_ticket_size': 2000000,\n  'risk_tolerance': 'high',\n\
            \  'liquidity_preference': 'annual',\n  'geographic_focus': 'North America\
            \ & Europe'\n}"
        - lines:
          - profile = define_investor_profile(
          - '    investment_purpose=''Diversify portfolio with low correlation assets'','
          - '    competitive_edge=''Access to niche commodity markets'','
          - "    long_term_vision='Build a 5% IRR hedge fund portfolio by 2040'\"\n\
            \                \")"
          output: "{\n  'typical_ticket_size': 1000000,\n  'risk_tolerance': 'medium',\n\
            \  'liquidity_preference': 'quarterly',\n  'geographic_focus': 'Global,\
            \ with a focus on Asia-Pacific'"
        parameters:
        - description: The investment purpose defined in clarify_fund_objectives.
          name: investment_purpose
          type: str
        - description: The competitive edge description from clarify_fund_objectives.
          name: competitive_edge
          type: str
        - description: The long-term vision statement from clarify_fund_objectives.
          name: long_term_vision
          type: str
        raises:
        - description: If any of the objective strings are empty or missing.
          type: ValueError
        - description: If the input types do not match the expected string types.
          type: TypeError
        returns:
          description: Dictionary containing typical_ticket_size (int), risk_tolerance
            (str), liquidity_preference (str), and geographic_focus (str).
          type: dict
        summary: Derives a target investor profile from clarified fund objectives.
    prompt: 'Based on the stated fund objectives, specify the ideal target investor
      profile. List key characteristics: typical ticket size, risk tolerance, liquidity
      preference, and geographic focus.'
  define_technology_stack:
    agent: false
    description: Identify system requirements
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of operational steps
      key: ops_steps
      type: List[str]
    - description: List of corresponding technology components for each operational
        step
      key: tech_components
      type: List[str]
    prd:
      conceptual_info: This node maps the daily trade lifecycle to the necessary software
        and infrastructure, ensuring each operational step has a clear technology
        owner.
      docstring:
        examples:
        - lines:
          - trade_lifecycle_steps = [
          - '    ''Idea Generation'','
          - '    ''Order Entry'','
          - '    ''Execution'','
          - '    ''Confirmation'','
          - '    ''Settlement'','
          - '    ''Reconciliation'']'
          - ops_steps, tech_components = define_technology_stack(trade_lifecycle_steps)
          - print(ops_steps)
          - print(tech_components)
          output: "[\n    'Idea Generation',\n    'Order Entry',\n    'Execution',\n\
            \    'Confirmation',\n    'Settlement',\n    'Reconciliation'\n]\n[\n\
            \    'Ideation Platform (e.g., Slack, IdeaBoard)',\n    'Order Management\
            \ System (OMS)',\n    'Execution Platform (e.g., FIX gateway, Algo engine)',\n\
            \    'Confirmation System (e.g., Trade Capture)',\n    'Clearing & Custody\
            \ System',\n    'Reconciliation Suite (e.g., Calypso, BlackLine)'\n]"
        - lines:
          - trade_lifecycle_steps = ['Order Entry', 'Execution', 'Settlement']
          - ops_steps, tech_components = define_technology_stack(trade_lifecycle_steps)
          - print(tech_components[-1])
          output: '''Clearing & Custody System'''
        parameters:
        - description: Ordered list of daily trade lifecycle steps as produced by
            draft_operations_workflow.
          name: trade_lifecycle_steps
          type: List[str]
        raises:
        - description: If trade_lifecycle_steps is empty or contains non-string items.
          type: ValueError
        returns:
          description: 'A dictionary containing two keys: ''ops_steps'' and ''tech_components'',
            each a list of strings aligned by index.'
          type: Dict[str, List[str]]
        summary: Map each trade lifecycle step to its required technology component(s).
    prompt: 'Identify required software and infrastructure for each operation step.
      Present as 2-column table: Ops Step | Tech Component.'
  design_compliance_program:
    agent: false
    description: Create regulatory compliance framework
    name: design_compliance_program
    nodes_depended_on:
    - design_risk_management_framework
    - identify_regulatory_requirements
    nodes_dependent_on: []
    output_structure:
    - description: List of regulatory compliance requirements identified for the fund.
      key: requirement_list
      type: List[str]
    - description: Corresponding internal policy references that satisfy each requirement,
        aligned by list index with requirement_list.
      key: policy_reference_list
      type: List[str]
    prd:
      conceptual_info: The node assembles a compliance matrix that maps every regulatory
        requirement to a specific internal policy. It consumes the outputs from the
        risk‑management framework (to understand controls) and the regulatory‑requirements
        list (to know what must be met). The resulting matrices are used by the pitch
        deck and final summary.
      docstring:
        examples:
        - lines:
          - 'requirement_list, policy_reference_list = design_compliance_program(

            '
          - '    control_name=["Position Limit", "VaR Limit"],

            '
          - '    target_metric=["Daily Position Size", "Annual VaR"],

            '
          - '    limit_value=[1.0, 0.02],

            '
          - '    requirements=["Securities Act Registration", "AML Registration"],

            '
          - '    governing_bodies=["SEC", "FINCEN"]

            '
          - )
          output: "{'requirement_list': ['Securities Act Registration', 'AML Registration'],\n\
            \ 'policy_reference_list': ['Policy_P100', 'Policy_P200']}"
        - lines:
          - '# Minimal example with one requirement

            '
          - 'design_compliance_program(

            '
          - '    control_name=[''Stop‑Loss Rule''],

            '
          - '    target_metric=[''Max Daily Loss''],

            '
          - '    limit_value=[0.05],

            '
          - '    requirements=[''Regulation K''],

            '
          - '    governing_bodies=[''SEC'']

            '
          - )
          output: "{'requirement_list': ['Regulation K'],\n 'policy_reference_list':\
            \ ['Policy_P300']}"
        parameters:
        - description: Names of the risk control measures from the risk‑management
            framework.
          name: control_name
          type: List[str]
        - description: Performance or risk metric each control is designed to limit.
          name: target_metric
          type: List[str]
        - description: Numeric threshold for each control.
          name: limit_value
          type: List[float]
        - description: Primary regulatory filings or registrations required for the
            chosen legal entity.
          name: requirements
          type: List[str]
        - description: Governing bodies responsible for each regulatory requirement.
          name: governing_bodies
          type: List[str]
        raises:
        - description: If any input list is empty or if the lengths of the regulatory
            lists do not match.
          type: ValueError
        returns:
          description: 'A tuple containing two lists: the first list is the ordered
            regulatory requirements, the second list is the corresponding internal
            policy references that satisfy each requirement.'
          type: Tuple[List[str], List[str]]
        summary: Generate a compliance checklist that maps each regulatory requirement
          to its internal policy reference.
    prompt: 'Generate a compliance checklist mapping each requirement to internal
      policy. Table with columns: Requirement | Policy Reference.'
  design_risk_management_framework:
    agent: false
    description: Outline core risk controls
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    output_structure:
    - description: Names of the risk control measures (e.g., Position Limit, VaR Limit,
        Stop‑Loss Rule)
      key: control_name
      type: List[str]
    - description: The performance or risk metric that each control is designed to
        limit (e.g., Daily Position Size, Annual VaR, Max Daily Loss)
      key: target_metric
      type: List[str]
    - description: The numeric threshold for each control (e.g., 1.0 for 100% position
        limit, 0.02 for 2% VaR, 0.05 for 5% stop‑loss)
      key: limit_value
      type: List[float]
    prd:
      conceptual_info: Generates a structured list of primary risk controls that tie
        directly to the fund’s quantitative performance and risk targets. Each control
        is mapped to a target metric and a numeric limit, forming the backbone of
        the fund’s risk‑management framework.
      docstring:
        examples:
        - lines:
          - controls = design_risk_management_framework(0.12, 0.20, 1.4, 0.25)
          - print(controls['control_name'])
          output: '[''Position Limit'', ''VaR Limit'', ''Stop‑Loss Rule'']'
        - lines:
          - controls = design_risk_management_framework(0.15, 0.22, 1.6, 0.28)
          - print(controls['limit_value'])
          output: '[1.0, 0.02, 0.05]'
        parameters:
        - description: Target annual gross return percentage (e.g., 0.15 for 15%).
          name: gross_return
          type: float
        - description: Target annual volatility percentage (e.g., 0.25 for 25%).
          name: volatility
          type: float
        - description: Target annual Sharpe ratio (e.g., 1.5).
          name: sharpe_ratio
          type: float
        - description: Target maximum annual drawdown percentage (e.g., 0.30 for 30%).
          name: max_drawdown
          type: float
        raises:
        - description: If any target parameter is missing, None, or not a numeric
            type.
          type: ValueError
        returns:
          description: 'A dictionary containing three keys:

            - ''control_name'': List[str] of risk control names.

            - ''target_metric'': List[str] of metrics each control limits.

            - ''limit_value'': List[float] of numeric thresholds.'
          type: dict
        summary: Creates core risk controls aligned with annual performance and risk
          targets.
    prompt: 'List core risk controls aligned with target metrics: position limits,
      VaR limits, stop-loss rules. Provide 4-6 bullet points.'
  develop_timeline_and_milestones:
    agent: false
    description: Create launch schedule
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on: []
    output_structure:
    - description: List of month indices from 1 to 12 representing the timeline
      key: month_numbers
      type: List[int]
    - description: One-line description of the key milestone for each month
      key: milestone_descriptions
      type: List[str]
    - description: Months in which major regulatory filings are scheduled
      key: regulatory_filing_months
      type: List[int]
    - description: Months in which each mandatory service provider is expected to
        be onboarded
      key: service_provider_onboarding_months
      type: List[int]
    - description: Months in which capital raising activities are planned
      key: capital_raise_months
      type: List[int]
    - description: Month number when the fund is expected to be fully operational
      key: overall_completion_month
      type: int
    prd:
      conceptual_info: This node generates a month‑by‑month launch schedule for the
        hedge fund, integrating regulatory, operational, and fundraising milestones
        derived from prior design outputs.
      docstring:
        examples:
        - lines:
          - technology_stack = ["Trading platform", "Order management system", "Risk
            analytics suite"],
          - hiring_plan = ["Head of Trading", "Senior Risk Analyst", "Operations Manager"],
          - 'pitch_deck_outline = {"slide_1_title": "Alpha Fund", "investment_strategy":
            "Long/Short Equity", "team_members": ["John Doe, CIO", "Jane Smith, COO"]},'
          - timeline = develop_timeline_and_milestones(technology_stack, hiring_plan,
            pitch_deck_outline)
          - print(timeline["milestone_descriptions"][0])
          output: '"Month 1: Finalize legal entity & file initial registration"'
        - lines:
          - print(timeline["overall_completion_month"])
          output: '"12"'
        parameters:
        - description: List of technology components required for each operational
            step, produced by `define_technology_stack`.
          name: technology_stack
          type: List[str]
        - description: List of essential full‑time positions with one‑line responsibilities
            from `create_hiring_plan`.
          name: hiring_plan
          type: List[str]
        - description: Dictionary containing slide titles, strategy, team, and other
            elements from `compile_pitch_deck_outline`; used to infer stakeholder
            needs.
          name: pitch_deck_outline
          type: Dict[str, Any]
        raises:
        - description: If any of the input lists are empty or missing required elements.
          type: ValueError
        - description: If mandatory keys are absent from the `pitch_deck_outline`
            dictionary.
          type: KeyError
        returns:
          description: A dictionary containing the six timeline fields described in
            `output_structure`.
          type: Dict[str, Any]
        summary: Generate a 12‑month launch timeline with key milestones for regulatory
          filings, service‑provider onboarding, and capital raising.
    prompt: Prepare a launch timeline with monthly milestones over 12 months. Include
      regulatory filing, service provider onboarding, and capital raise.
  draft_fee_structure:
    agent: false
    description: Define compensation model
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    output_structure:
    - description: Annual management fee as a percentage of assets under management
      key: management_fee_percentage
      type: float
    - description: Annual performance fee as a percentage of realized gains above
        the hurdle
      key: performance_fee_percentage
      type: float
    - description: Minimum return threshold (as a percentage) that must be exceeded
        before performance fee is applied. Use 0 if no hurdle
      key: hurdle_rate_percentage
      type: float
    - description: Up to three concise sentences summarizing the fee structure
      key: summary_sentences
      type: str
    prd:
      conceptual_info: Creates a concise fee proposal that balances investor appeal
        with incentive alignment, integrating performance targets set by the risk‑management
        node.
      docstring:
        examples:
        - lines:
          - fee_structure = draft_fee_structure(gross_return=0.15, volatility=0.25,
            sharpe_ratio=1.5, max_drawdown=0.30)
          output: '{''management_fee_percentage'': 0.025, ''performance_fee_percentage'':
            0.20, ''hurdle_rate_percentage'': 0.08, ''summary_sentences'': [''The
            fund charges a 2.5% annual management fee.'', ''Performance fees of 20%
            apply to gains above an 8% hurdle.'', ''This structure aligns manager
            incentives with investor returns.'']}'
        - lines:
          - fee_structure = draft_fee_structure(gross_return=0.10, volatility=0.20,
            sharpe_ratio=1.2, max_drawdown=0.25)
          output: '{''management_fee_percentage'': 0.02, ''performance_fee_percentage'':
            0.15, ''hurdle_rate_percentage'': 0.05, ''summary_sentences'': [''The
            fund charges a 2% annual management fee.'', ''Performance fees of 15%
            are charged on gains exceeding a 5% hurdle.'', ''This fee schedule balances
            competitive pricing with strong incentive alignment.'']}'
        parameters:
        - description: Target annual gross return (e.g., 0.15 for 15%) obtained from
            set_performance_and_risk_targets.
          name: gross_return
          type: float
        - description: Target annual volatility percentage from set_performance_and_risk_targets.
          name: volatility
          type: float
        - description: Target annual Sharpe ratio from set_performance_and_risk_targets.
          name: sharpe_ratio
          type: float
        - description: Target maximum annual drawdown percentage from set_performance_and_risk_targets.
          name: max_drawdown
          type: float
        raises:
        - description: If any input target is None or not a number.
          type: ValueError
        - description: If performance_fee_percentage would exceed 50% or be negative.
          type: AssertionError
        returns:
          description: A dictionary containing management_fee_percentage, performance_fee_percentage,
            hurdle_rate_percentage, and summary_sentences.
          type: dict
        summary: Generate a structured fee schedule for a hedge fund based on performance
          and risk targets.
    prompt: Propose management and performance fee percentages. Include incentive
      hurdle if relevant. Summarize in ≤3 sentences.
  draft_operations_workflow:
    agent: false
    description: Generate an ordered list of daily trade lifecycle steps and the party
