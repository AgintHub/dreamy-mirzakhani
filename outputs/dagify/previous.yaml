  produce_final_fund_plan_summary:
    agent: false
    description: Aggregates outputs from the compliance, pitch deck, and timeline
      nodes to create a single executive summary that encapsulates the fund’s strategy,
      legal structure, governance, risk framework, operations, fee model, and launch
      schedule.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    output_structure:
    - description: Short title of the executive summary
      key: summary_title
      type: str
    - description: One-sentence description of the chosen investment strategy
      key: strategy_highlight
      type: str
    - description: Name of the selected legal entity type (e.g., LP, LLC, SICAV)
      key: legal_structure
      type: str
    - description: Brief description of the governance chart (roles and duties)
      key: governance_overview
      type: str
    - description: Key risk controls and target metrics summarized
      key: risk_framework_summary
      type: str
    - description: High-level view of daily operational workflow and key service providers
      key: operations_snapshot
      type: str
    - description: Management and performance fee percentages, including any hurdle
        rates
      key: fee_structure_summary
      type: str
    - description: List of major monthly milestones over the 12‑month launch period
      key: timeline_key_milestones
      type: List[str]
    - description: Number of compliance requirements mapped to internal policies
      key: compliance_checklist_count
      type: int
    - description: Summary of annual cost estimate for key provider categories
      key: budget_estimate_overview
      type: str
    prd:
      conceptual_info: The node stitches together compliance, presentation, and scheduling
        data into a concise 400‑word executive summary that can be used by stakeholders
        to quickly understand the fund’s launch plan.
      docstring:
        examples:
        - lines:
          - compliance_output = {
          - '    ''requirement_list'': [''KYC'', ''AML'', ''Securities Act Compliance''],'
          - '    ''policy_reference_list'': [''Policy_KYC'', ''Policy_AML'', ''Policy_Securities'']'
          - '}'
          - pitch_deck_output = {
          - '    ''investment_strategy'': ''Global Macro – focus on macroeconomic
            trends and commodity exposures.'','
          - '    ''legal_structure'': ''Limited Partnership'','
          - '    ''governance_structure'': ''GP oversees investment decisions; LP
            holds capital; Board provides oversight; Audit Committee ensures compliance;
            Compensation Committee sets fees.'','
          - '    ''risk_controls'': [''Position Limits: 10% of AUM'', ''Daily VaR:
            2%'', ''Stop‑Loss: 5%''],'
          - '    ''fee_structure'': ''1% Management Fee; 20% Performance Fee above
            8% hurdle; 8% hurdle rate.'','
          - '    ''operations'': ''Trade lifecycle: idea generation → order entry
            → execution → confirmation → settlement → reconciliation; Prime Broker:
            XYZ, Administrator: ABC.'''
          - '}'
          - timeline_output = {
          - '    ''month_numbers'': list(range(1,13)),'
          - '    ''milestone_descriptions'': ['
          - '        ''Month 1: Finalize legal documentation'','
          - '        ''Month 2: Onboard Prime Broker'','
          - '        ''Month 3: Launch marketing campaign'','
          - '        ''Month 4: First capital raise round'','
          - '        ''Month 5: Begin trading operations'','
          - '        ''Month 6: Regulatory filing complete'','
          - '        ''Month 7: First performance review'','
          - '        ''Month 8: Expand investment universe'','
          - '        ''Month 9: Second capital raise'','
          - '        ''Month 10: Full operational launch'','
          - '        ''Month 11: Audit commencement'','
          - '        ''Month 12: Investor reporting finalized'''
          - '    ],'
          - '    ''regulatory_filing_months'': [6],'
          - '    ''service_provider_onboarding_months'': [2],'
          - '    ''capital_raise_months'': [4, 9],'
          - '    ''overall_completion_month'': 12'
          - '}'
          - summary = produce_final_fund_plan_summary(compliance_output, pitch_deck_output,
            timeline_output)
          - print(summary['summary_title'])
          output: '''Executive Summary: Global Macro Hedge Fund Launch'''
        - lines:
          - print(summary['compliance_checklist_count'])
          output: '3'
        parameters:
        - description: Output from the design_compliance_program node, containing
            'requirement_list' and 'policy_reference_list'.
          name: compliance_output
          type: dict
        - description: Output from the compile_pitch_deck_outline node, containing
            fields such as 'investment_strategy', 'legal_structure', and 'governance_structure'.
          name: pitch_deck_output
          type: dict
        - description: Output from the develop_timeline_and_milestones node, containing
            monthly milestones and key dates.
          name: timeline_output
          type: dict
        raises:
        - description: If any required input field is missing or of incorrect type.
          type: ValueError
        - description: If expected keys are not present in the input dictionaries.
          type: KeyError
        returns:
          description: Dictionary matching the output_structure of the node, including
            summary_title, strategy_highlight, etc.
          type: dict
        summary: Generates a concise executive summary of the hedge fund launch plan
          by synthesizing compliance, pitch deck, and timeline outputs.
    prompt: Synthesize prior outputs into a concise executive summary (≤400 words)
      covering strategy, structure, risk, ops, fees, timeline.
  select_jurisdiction:
    agent: false
    description: Choose optimal fund domicile
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The name of the chosen fund domicile jurisdiction
      key: selected_jurisdiction
      type: str
    - description: Two concise pros supporting the choice of jurisdiction
      key: pros
      type: str
    - description: Two concise cons associated with the chosen jurisdiction
      key: cons
      type: str
    prd:
      conceptual_info: This node evaluates the fund’s strategic objectives to recommend
        a domicile jurisdiction that best aligns with legal, tax, and operational
        considerations. It returns the selected jurisdiction name along with a balanced
        pros‑and‑cons list to inform downstream decisions such as legal entity selection.
      docstring:
        examples:
        - lines:
          - 'select_jurisdiction(

            '
          - '    objectives=[

            '
          - "        \"Generate alpha via multi‑strategy equity\", \n"
          - "        \"Leverage low regulatory friction\", \n"
          - '        "Maintain investor confidentiality"

            '
          - '    ],'
          - '    investment_purpose="Long‑term capital appreciation via diversified
            equity strategies",'
          - '    competitive_edge="Low tax burden and flexible legal framework",'
          - '    long_term_vision="Become a leading independent multi‑strategy fund
            in the Americas"

            '
          - )
          output: "{\n  \"selected_jurisdiction\": \"Cayman Islands\",\n  \"pros\"\
            : [\"Low corporate tax and no capital gains tax\", \"Strong confidentiality\
            \ protections and established fund industry\"],\n  \"cons\": [\"Perception\
            \ of regulatory laxity may deter certain investors\", \"Limited local\
            \ banking infrastructure requires offshore arrangements\"]\n}"
        - lines:
          - 'select_jurisdiction(

            '
          - '    objectives=["Global macro trading with high leverage"],

            '
          - '    investment_purpose="Capture macro opportunities worldwide",'
          - '    competitive_edge="Ability to deploy large leverage efficiently",'
          - '    long_term_vision="Scale to $10B AUM within 5 years"

            '
          - )
          output: "{\n  \"selected_jurisdiction\": \"Delaware, USA\",\n  \"pros\"\
            : [\"Well‑established legal framework for LLCs\", \"Access to U.S. capital\
            \ markets and regulatory clarity\"],\n  \"cons\": [\"Higher U.S. tax obligations\
            \ for foreign investors\", \"More stringent reporting and disclosure requirements\"\
            ]\n}"
        parameters:
        - description: Concise bullet list of the fund’s primary business objectives,
            including investment purpose, competitive edge, and long‑term vision.
          name: objectives
          type: List[str]
        - description: Description of the investment purpose derived from the objectives.
          name: investment_purpose
          type: str
        - description: Description of the competitive edge identified from the objectives.
          name: competitive_edge
          type: str
        - description: Description of the long‑term vision derived from the objectives.
          name: long_term_vision
          type: str
        raises:
        - description: Raised if any of the objective inputs are missing or empty.
          type: ValueError
        returns:
          description: Dictionary with keys 'selected_jurisdiction' (str), 'pros'
            (List[str]), and 'cons' (List[str]).
          type: Dict[str, Any]
        summary: Selects the most suitable fund domicile based on the fund’s objectives,
          returning the jurisdiction name and a concise pros/cons list.
    prompt: Choose the optimal fund domicile (e.g., Cayman, Delaware, Luxembourg)
      considering objectives. Provide 2 pros and 2 cons for the selected jurisdiction
      only.
  set_performance_and_risk_targets:
    agent: false
    description: Quantify financial and risk goals
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Target annual gross return percentage (e.g., 0.15 for 15%)
      key: gross_return
      type: float
    - description: Target annual volatility percentage (e.g., 0.25 for 25%)
      key: volatility
      type: float
    - description: Target annual Sharpe ratio (e.g., 1.5)
      key: sharpe_ratio
      type: float
    - description: Target maximum annual drawdown percentage (e.g., 0.30 for 30%)
      key: max_drawdown
      type: float
    prd:
      conceptual_info: Sets quantitative performance and risk benchmarks that guide
        strategy design, risk controls, and fee structuring.
      docstring:
        examples:
        - lines:
          - targets = set_performance_and_risk_targets('Long/Short Equity', 'A blend
            of alpha generation and risk mitigation through directional bets.')
          output: '{''gross_return'': 0.18, ''volatility'': 0.22, ''sharpe_ratio'':
            1.64, ''max_drawdown'': 0.28}'
        - lines:
          - targets = set_performance_and_risk_targets('Global Macro', 'Leveraging
            macroeconomic trends across multiple markets.')
          output: '{''gross_return'': 0.15, ''volatility'': 0.30, ''sharpe_ratio'':
            1.25, ''max_drawdown'': 0.35}'
        parameters:
        - description: Primary hedge fund strategy category selected by the `choose_investment_strategy`
            node.
          name: strategy_category
          type: str
        - description: One‑sentence justification for the chosen strategy, provided
            by the parent node.
          name: strategy_rationale
          type: str
        raises:
        - description: If any input is missing or empty.
          type: ValueError
        - description: If inputs are not of type `str`.
          type: TypeError
        returns:
          description: 'Dictionary containing the four numeric target fields: `gross_return`,
            `volatility`, `sharpe_ratio`, and `max_drawdown`.'
          type: dict
        summary: Generate annual financial and risk targets for a hedge fund based
          on the chosen investment strategy.
    prompt: Define numerical annual targets for gross return, volatility, Sharpe ratio,
      and maximum drawdown. Present as a 4-row table.
