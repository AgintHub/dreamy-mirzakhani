            information if applicable.
          type: dict
        summary: Establish a secure OAuth 2.0 authenticated connection to the pico
          datacenter, obtaining and managing access tokens to enable authorized, encrypted
          access.
    prompt: Establish a secure OAuth 2.0 authenticated connection to the pico datacenter
