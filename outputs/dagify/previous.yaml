dag_type: typed
description: Generated workflow from UI.
name: physician_credentialing_onboarding
nodes:
  assign_clinical_privileges:
    agent: false
    description: Assign specific clinical privileges to the physician in the EMR based
      on committee recommendation
    name: assign_clinical_privileges
    nodes_depended_on:
    - schedule_privileging_committee_review
    nodes_dependent_on: []
    output_structure:
    - description: List of clinical privileges assigned
      key: clinical_privileges
      type: List[str]
    - description: Status of updated EMR profile
      key: updated_emr_profile_status
      type: bool
    prompt: List the approved clinical privileges (e.g., inpatient admission, surgery)
      and update the EMR profile. Return JSON with privileges_assigned array.
  check_pecos:
    agent: false
    description: Verify the physician's enrollment in the Provider Enrollment, Chain,
      and Ownership System (PECOS) for Medicare participation.
    name: check_pecos
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Physician's NPI number
      key: npi
      type: str
    - description: Status of the physician's PECOS enrollment (e.g. active, inactive)
      key: pecos_enrollment_status
      type: str
    - description: Date of the physician's PECOS enrollment
      key: enrollment_date
      type: str
    - description: Whether the physician has opted out of PECOS
      key: opt_out_status
      type: bool
    prompt: Verify the physician's enrollment in the Provider Enrollment, Chain, and
      Ownership System (PECOS) for Medicare participation.
  collect_physician_basic_info:
    agent: false
    description: Gather all required personal and professional information from the
      physician (name, contact, NPI, license number, DEA number, education, work history).
    name: collect_physician_basic_info
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Physician's full name
      key: name
      type: str
    - description: Physician's email address
      key: email
      type: str
    - description: Physician's phone number
      key: phone
      type: str
    - description: Physician's National Provider Identifier
      key: NPI
      type: str
    - description: Physician's medical license number
      key: medical_license_number
      type: str
    - description: Physician's DEA registration number
      key: DEA_number
      type: str
    - description: List of physician's education history
      key: education_history
      type: List[str]
    - description: List of physician's employment history
      key: employment_history
      type: List[str]
    - description: Physician's malpractice insurance provider
      key: malpractice_insurance_provider
      type: str
    prompt: 'Create a checklist of required basic information for a new physician
      and format the collected data as a JSON object with keys: name, email, phone,
      NPI, medical_license_number, DEA_number, education_history, employment_history,
      malpractice_insurance_provider.'
  compile_credentialing_report:
    agent: false
    description: Aggregate all verification results into a single credentialing report.
    name: compile_credentialing_report
    nodes_depended_on:
    - verify_medical_license
    - verify_board_certification
    - verify_dea_registration
    - verify_malpractice_insurance
    - verify_education_and_training
    - obtain_professional_references
    - conduct_background_check
    - verify_hospital_privileges_history
    - check_pecos
    nodes_dependent_on: []
    output_structure:
    - description: Comprehensive credentialing report
      key: credentials_report
      type: str
    - description: List of pass/fail flags for each verification step
      key: pass_fail_flags
      type: List[str]
    - description: Overall recommendation (approve/hold)
      key: recommendation
      type: str
    prompt: Combine the JSON outputs from all verification steps into one comprehensive
      credentialing report. Include a pass/fail flag for each category and an overall
      recommendation (approve/hold).
  complete_compliance_training:
    agent: false
    description: Ensure the physician completes required compliance and safety trainings.
    name: complete_compliance_training
    nodes_depended_on:
    - schedule_orientation
    nodes_dependent_on: []
    output_structure:
    - description: List of training module IDs
      key: training_module_ids
      type: List[str]
    - description: Completion status of compliance training
      key: completion_status
      type: str
    prompt: Enroll the physician in the online compliance training modules, track
      completion, and return JSON with training_module_ids and completion_status.
  conduct_background_check:
    agent: false
    description: Run a national criminal background and sanctions check on the physician.
    name: conduct_background_check
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Whether the physician has a criminal record
      key: criminal_records
      type: bool
    - description: Whether the physician has sanctions
      key: sanctions
      type: bool
    - description: Details of any issues found during the background check
      key: details_if_any
      type: str
    prompt: 'Perform a simulated background check using the physician''s full name
      and DOB, and return JSON: criminal_records (yes/no), sanctions (yes/no), details_if_any.'
  create_provider_profile_in_emr:
    agent: false
    description: Enter the physician's credentials into the electronic medical record
      system and create a provider profile.
    name: create_provider_profile_in_emr
    nodes_depended_on:
    - compile_credentialing_report
    - obtain_signed_employment_contract
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the created provider profile
      key: provider_id
      type: str
    - description: Status of the provider profile creation
      key: status
      type: str
    prompt: Using the credentialing report and contract, populate the EMR provider
      fields (name, NPI, specialties, license, DEA, privileges). Return JSON with
      provider_id and status.
  finalize_credentialing:
    agent: false
    description: Mark the physician as fully credentialed and ready for clinical duties.
    name: finalize_credentialing
    nodes_depended_on:
    - schedule_privileging_committee_review
    - assign_clinical_privileges
    - grant_system_access
    - verify_hippa_acknowledgment
    nodes_dependent_on: []
    output_structure:
    - description: Status of the physician's credentialing
      key: final_status
      type: str
    - description: Date of the physician's activation
      key: activation_date
      type: str
    prompt: Update the credentialing database status to 'Active', log the date of
      activation, and output JSON with final_status and activation_date.
  grant_system_access:
    agent: false
    description: Provision user accounts for EHR, order entry, and other clinical
      systems.
    name: grant_system_access
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Name of the clinical system.
      key: system_name
      type: str
    - description: Username for the physician in the clinical system.
      key: username
      type: str
    - description: Temporary password for the physician in the clinical system.
      key: temporary_password
      type: str
    prompt: Create login credentials for the physician in each required system, set
      appropriate role-based permissions, and output JSON with system_name, username,
      temporary_password.
  notify_hr_payroll:
    agent: false
    description: Inform HR and payroll that the physician is active and eligible for
      compensation.
    name: notify_hr_payroll
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Status of the HR and payroll notification.
      key: notification_status
      type: str
    - description: Current status of the physician.
      key: physician_status
      type: str
    prompt: Inform HR and payroll that the physician is active and eligible for compensation.
  obtain_professional_references:
    agent: false
    description: Collect and record at least three professional references from the
      physician's recent supervisors.
    name: obtain_professional_references
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the first professional reference.
      key: reference_name_1
      type: str
    - description: Relationship of the first professional reference with the physician.
      key: reference_relationship_1
      type: str
    - description: Rating (1-5) of the first professional reference.
      key: reference_rating_1
      type: int
    - description: Comments about the first professional reference.
      key: reference_comments_1
      type: str
    - description: Name of the second professional reference.
      key: reference_name_2
      type: str
    - description: Relationship of the second professional reference with the physician.
      key: reference_relationship_2
      type: str
    - description: Rating (1-5) of the second professional reference.
      key: reference_rating_2
      type: int
    - description: Comments about the second professional reference.
      key: reference_comments_2
      type: str
    - description: Name of the third professional reference.
      key: reference_name_3
      type: str
    - description: Relationship of the third professional reference with the physician.
      key: reference_relationship_3
      type: str
    - description: Rating (1-5) of the third professional reference.
      key: reference_rating_3
      type: int
    - description: Comments about the third professional reference.
      key: reference_comments_3
      type: str
    prompt: 'Generate a template email to request reference letters, then summarize
      the received responses as JSON: reference_name, relationship, rating (1‑5),
      comments.'
  obtain_signed_employment_contract:
    agent: false
    description: Send the employment contract to the physician and capture the signed
      copy.
    name: obtain_signed_employment_contract
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Unique ID of the signed employment contract
      key: contract_id
      type: str
    - description: Date the employment contract was electronically signed
      key: signed_date
      type: str
    prompt: Generate an email with a PDF employment contract attached, request electronic
      signature, and return a JSON receipt with contract_id and signed_date once completed.
  schedule_orientation:
    agent: false
    description: Book the physician for the mandatory orientation session.
    name: schedule_orientation
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Date for physician orientation
      key: orientation_date
      type: str
    - description: Location of the orientation session
      key: orientation_location
      type: str
    prompt: Select an available orientation slot, send calendar invitation to the
      physician, and return JSON with orientation_date and location.
  schedule_privileging_committee_review:
    agent: false
    description: Place the physician on the agenda of the next privileging committee
      meeting.
    name: schedule_privileging_committee_review
    nodes_depended_on:
    - compile_credentialing_report
    nodes_dependent_on: []
    output_structure:
    - description: Date of the privileging committee meeting
      key: committee_date
      type: str
    - description: Time of the privileging committee meeting
      key: committee_time
      type: str
    - description: Name of the physician being placed on the committee agenda
      key: physician_name
      type: str
    - description: ID of the credentialing report attached to the committee agenda
      key: credentialing_report_id
      type: str
    prompt: Create a calendar entry for the privileging committee with date, time,
      physician name, and attach the credentialing report.
  update_credentialing_database:
    agent: false
    description: Record all verification results and final status in the central credentialing
      repository.
    name: update_credentialing_database
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the credentialing report record
      key: record_id
      type: int
    - description: Date and time the credentialing report was updated
      key: timestamp
      type: str
    prompt: Insert the compiled credentialing report and final status into the credentialing
      database. Return JSON confirming record_id and timestamp.
  verify_board_certification:
    agent: false
    description: Validate the physician's board certification(s) and current status.
    name: verify_board_certification
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Certifying board or organization
      key: certification_body
      type: str
    - description: Specialty or area of certification
      key: specialty
      type: str
    - description: Current status of certification (active, inactive, etc.)
      key: certification_status
      type: str
    prompt: Check the physician's board certification(s) against the certifying board
      database and output JSON with certification_body, specialty, certification_status,
      and expiration_date.
  verify_dea_registration:
    agent: false
    description: Confirm the DEA registration is active and matches the physician's
      name.
    name: verify_dea_registration
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Current status of the DEA registration.
      key: dea_status
      type: str
    - description: Date when the DEA registration expires.
      key: expiration_date
      type: str
    - description: Whether the DEA registration matches the physician's name.
      key: name_match
      type: bool
    prompt: 'Validate the DEA_number provided, returning JSON: dea_status, expiration_date,
      name_match (true/false).'
  verify_education_and_training:
    agent: false
    description: Authenticate the physician's medical school, residency, and fellowship
      credentials.
    name: verify_education_and_training
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of physician's medical school
      key: medical_school
      type: List[str]
    - description: List of physician's residency
      key: residency
      type: List[str]
    - description: List of physician's fellowship
      key: fellowship
      type: List[str]
    - description: List of credibility status of education history
      key: credibility_status
      type: List[str]
    prompt: Cross-reference each entry in education_history with the appropriate accrediting
      body and output JSON for each entry.
  verify_hippa_acknowledgment:
    agent: false
    description: Record the physician's acknowledgment of HIPAA policies.
    name: verify_hippa_acknowledgment
    nodes_depended_on:
    - complete_compliance_training
    nodes_dependent_on: []
    output_structure:
    - description: Date of acknowledged HIPAA policies
      key: acknowledgment_date
      type: str
    - description: Name of the physician who acknowledged HIPAA policies
      key: signed_by
      type: str
    prompt: Capture the electronic signature on the HIPAA acknowledgment form and
      return JSON with acknowledgment_date and signed_by.
  verify_hospital_privileges_history:
    agent: false
    description: Review the physician's prior hospital privileging history for any
      revocations or limitations.
    name: verify_hospital_privileges_history
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of revoked, suspended, or limited privileges found
      key: revocations_or_limitations
      type: List[str]
    prompt: Summarize the physician's past hospital privileges, indicating any revoked,
      suspended, or limited privileges, in JSON format.
  verify_malpractice_insurance:
    agent: false
    description: Ensure the physician carries adequate malpractice coverage with no
      lapses.
    name: verify_malpractice_insurance
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the malpractice insurance carrier
      key: carrier_name
      type: str
    - description: Policy number for the malpractice insurance
      key: policy_number
      type: str
    - description: Limit of coverage for the malpractice insurance
      key: coverage_limit
      type: str
    - description: Date when the malpractice insurance becomes effective
      key: effective_date
      type: str
    - description: Date when the malpractice insurance expires
      key: expiration_date
      type: str
    - description: Whether there are any gaps in the malpractice insurance coverage
      key: any_gaps
      type: bool
    prompt: 'Contact the malpractice insurance provider listed and return JSON: carrier_name,
      policy_number, coverage_limit, effective_date, expiration_date, any_gaps.'
  verify_medical_license:
    agent: false
    description: Confirm the physician's medical license status and validity
    name: verify_medical_license
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The status of the medical license
      key: license_status
      type: str
    - description: The expiration date of the medical license
      key: license_expiration_date
      type: str
    prompt: Verify medical license using license number from basic information.
