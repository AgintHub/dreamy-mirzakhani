dag_type: plain_text
description: A highly concurrent workflow that creates a multistrategy hedge fund
  trading all asset classes in global markets, provisions a dedicated trading system
  for each asset class, and implements firm‑wide risk and compliance management.
name: multistrategy_hedge_fund_build
nodes:
  assemble_operations_workflow:
    agent: false
    description: Defines the holistic trade lifecycle across all asset classes.
    name: assemble_operations_workflow
    nodes_depended_on:
    - instantiate_trading_systems
    - enumerate_service_providers
    nodes_dependent_on: []
    prompt: 'Map the end‑to‑end daily operational flow: idea → algo → order → execution
      → clearing → settlement → reconciliation → reporting. For each step, assign
      the responsible internal role or external provider.'
  build_firmwide_risk_engine:
    agent: false
    description: Constructs the technology component that enforces firm‑wide risk
      controls across all systems.
    name: build_firmwide_risk_engine
    nodes_depended_on:
    - draft_firmwide_risk_policy
    - instantiate_trading_systems
    nodes_dependent_on: []
    prompt: Design a centralized risk engine that aggregates real‑time exposures from
      all asset‑class trading systems, computes portfolio VaR, stress‑test results,
      and enforces the firm‑wide limits. List required inputs, core calculations,
      and output alerts.
  choose_fund_legal_structure:
    agent: false
    description: Decides the legal entity type for the fund.
    name: choose_fund_legal_structure
    nodes_depended_on:
    - define_fund_mission
    nodes_dependent_on: []
    prompt: Select a legal vehicle (LP, LLC, SICAV, etc.) appropriate for a multistrategy,
      global hedge fund and give a one‑sentence justification.
  create_fund_governance_chart:
    agent: false
    description: Establishes the internal governance structure.
    name: create_fund_governance_chart
    nodes_depended_on:
    - choose_fund_legal_structure
    - select_fund_jurisdiction
    nodes_dependent_on: []
    prompt: Produce a simple governance chart listing the General Partner, Investment
      Committee, Risk Committee, Compliance Officer, and Chief Technology Officer
      with one‑line duties each.
  define_fund_mission:
    agent: false
    description: Establishes the overarching purpose and guiding principles of the
      fund.
    name: define_fund_mission
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: State the core mission of the hedge fund in three concise bullet points,
      covering investment ambition, market scope, and risk philosophy.
  design_trading_system_template:
    agent: false
    description: Specifies the reusable blueprint for each asset‑class trading system.
    name: design_trading_system_template
    nodes_depended_on:
    - list_target_asset_classes
    nodes_dependent_on: []
    prompt: 'Define a generic architecture for a trading system (data ingestion, signal
      generation, order management, execution, post‑trade) that can be instantiated
      for any asset class. Present as a 2‑column table: Component | Description.'
  draft_capital_raising_plan:
    agent: false
    description: Plans the fundraising strategy.
    name: draft_capital_raising_plan
    nodes_depended_on:
    - define_fund_mission
    - list_target_asset_classes
    - select_fund_jurisdiction
    nodes_dependent_on: []
    prompt: Outline a three‑phase capital raise (seed, strategic, open‑ended) with
      target amounts, ideal investor types, and key milestones.
  draft_firmwide_compliance_policy:
    agent: false
    description: Establishes a global compliance framework.
    name: draft_firmwide_compliance_policy
    nodes_depended_on:
    - choose_fund_legal_structure
    - select_fund_jurisdiction
    nodes_dependent_on: []
    prompt: Produce a compliance checklist mapping key regulatory obligations (e.g.,
      SEC, FCA, MAS) to internal controls. List each obligation and the corresponding
      control.
  draft_firmwide_risk_policy:
    agent: false
    description: Creates the top‑level risk governance document.
    name: draft_firmwide_risk_policy
    nodes_depended_on:
    - define_fund_mission
    nodes_dependent_on: []
    prompt: Write a concise firm‑wide risk policy covering VaR limits, stress‑test
      frequency, liquidity buffers, and position concentration rules. Use bullet points
      only.
  enumerate_service_providers:
    agent: false
    description: Defines external service provider categories needed for operations.
    name: enumerate_service_providers
    nodes_depended_on:
    - choose_fund_legal_structure
    nodes_dependent_on: []
    prompt: Create a checklist of mandatory third‑party providers (prime broker, custodian,
      fund administrator, auditor, legal counsel, compliance consultant, technology
      vendor). Output only provider type names.
  instantiate_trading_systems:
    agent: false
    description: Creates a dedicated trading system for each asset class.
    name: instantiate_trading_systems
    nodes_depended_on:
    - design_trading_system_template
    - list_target_asset_classes
    - specify_global_markets
    nodes_dependent_on: []
    prompt: 'For each asset class code from the asset list, generate a concrete trading
      system specification by filling the generic template. Include market‑specific
      data sources and execution venues. Output a table: Asset Class | System Spec
      (brief).'
  integrate_compliance_monitoring:
    agent: false
    description: Implements firm‑wide compliance checks integrated with each trading
      system.
    name: integrate_compliance_monitoring
    nodes_depended_on:
    - draft_firmwide_compliance_policy
    - instantiate_trading_systems
    nodes_dependent_on: []
    prompt: Create a compliance monitoring module that consumes trade and position
      data from each asset‑class system and checks against the compliance checklist.
      Provide a list of automated checks and escalation procedures.
  list_target_asset_classes:
    agent: false
    description: Creates the master list of tradable asset classes.
    name: list_target_asset_classes
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List every asset class the fund will trade (e.g., equities, fixed income,
      FX, commodities, derivatives, crypto) and assign a short code for each.
  produce_final_fund_blueprint:
    agent: false
    description: Generates the complete launch document for the multistrategy hedge
      fund.
    name: produce_final_fund_blueprint
    nodes_depended_on:
    - choose_fund_legal_structure
    - select_fund_jurisdiction
    - enumerate_service_providers
    - draft_firmwide_risk_policy
    - draft_firmwide_compliance_policy
    - instantiate_trading_systems
    - build_firmwide_risk_engine
    - integrate_compliance_monitoring
    - assemble_operations_workflow
    - create_fund_governance_chart
    - draft_capital_raising_plan
    nodes_dependent_on: []
    prompt: Synthesize all prior outputs into a concise executive blueprint (≤500
      words) covering strategy, legal structure, asset coverage, technology stack,
      risk/compliance architecture, operations, governance, and capital plan. Use
      headings and bullet points where appropriate.
  select_fund_jurisdiction:
    agent: false
    description: Chooses the jurisdiction for registration.
    name: select_fund_jurisdiction
    nodes_depended_on:
    - define_fund_mission
    nodes_dependent_on: []
    prompt: Pick the optimal domicile (Cayman, Delaware, Luxembourg, etc.) for the
      fund and list two regulatory pros and two cons.
  specify_global_markets:
    agent: false
    description: Maps asset classes to the global markets they will be traded in.
    name: specify_global_markets
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Identify all geographic markets (e.g., US, EU, APAC, LATAM) the fund will
      have access to, associating each market with the relevant asset classes from
      the previous step.
