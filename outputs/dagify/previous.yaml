dag_type: plain_text
description: Executes three independent events concurrently, then combines them pairwise
  and finally all together.
name: event_combination_workflow
nodes:
  event_a:
    agent: false
    description: Execute event A.
    name: event_a
    nodes_depended_on: []
    nodes_dependent_on:
    - event_ab
    - event_ac
    prompt: Execute event A. Provide the result of A.
  event_ab:
    agent: false
    description: Combine events A and B.
    name: event_ab
    nodes_depended_on:
    - event_a
    - event_b
    nodes_dependent_on:
    - event_abc
    prompt: Combine the results of event A and event B to produce event AB.
  event_abc:
    agent: false
    description: Combine events AB, AC, and BC.
    name: event_abc
    nodes_depended_on:
    - event_ab
    - event_ac
    - event_bc
    nodes_dependent_on: []
    prompt: Combine the results of event AB, event AC, and event BC to produce event
      ABC.
  event_ac:
    agent: false
    description: Combine events A and C.
    name: event_ac
    nodes_depended_on:
    - event_a
    - event_c
    nodes_dependent_on:
    - event_abc
    prompt: Combine the results of event A and event C to produce event AC.
  event_b:
    agent: false
    description: Execute event B.
    name: event_b
    nodes_depended_on: []
    nodes_dependent_on:
    - event_ab
    - event_bc
    prompt: Execute event B. Provide the result of B.
  event_bc:
    agent: false
    description: Combine events B and C.
    name: event_bc
    nodes_depended_on:
    - event_b
    - event_c
    nodes_dependent_on:
    - event_abc
    prompt: Combine the results of event B and event C to produce event BC.
  event_c:
    agent: false
    description: Execute event C.
    name: event_c
    nodes_depended_on: []
    nodes_dependent_on:
    - event_ac
    - event_bc
    prompt: Execute event C. Provide the result of C.
