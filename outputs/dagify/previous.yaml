dag_type: plain_text
description: A minimal workflow that creates a simple test case, executes it, validates
  the outcome, and summarizes the result.
name: basic_test_workflow
nodes:
  create_test_case:
    agent: false
    description: Generate a concrete test case description and expected output.
    name: create_test_case
    nodes_depended_on: []
    nodes_dependent_on:
    - run_test_case
    prompt: Produce a brief test case for a generic function. Include a short input
      description and the exact expected output.
  run_test_case:
    agent: false
    description: Execute the test case using the provided input.
    name: run_test_case
    nodes_depended_on:
    - create_test_case
    nodes_dependent_on:
    - validate_test_result
    prompt: Based on the input from the previous step, simulate running the function
      and output the actual result.
  summarize_test_outcome:
    agent: false
    description: Provide a concise summary of the test execution and its result.
    name: summarize_test_outcome
    nodes_depended_on:
    - validate_test_result
    nodes_dependent_on: []
    prompt: Summarize the entire test workflow, including the test case, execution
      details, and final pass/fail status, in no more than three sentences.
  validate_test_result:
    agent: false
    description: Compare the actual result with the expected output and indicate pass/fail.
    name: validate_test_result
    nodes_depended_on:
    - run_test_case
    nodes_dependent_on:
    - summarize_test_outcome
    prompt: Compare the actual result from the prior step with the expected output
      and state whether the test passed or failed.
