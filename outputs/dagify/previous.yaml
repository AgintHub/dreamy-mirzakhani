  optimize_parameters:
    agent: false
    description: Refine model inputs
    name: optimize_parameters
    nodes_depended_on:
    - calculate_performance_metrics
    - define_strategy_parameters
    nodes_dependent_on: []
    output_structure:
    - description: List of optimized values for each core parameter
      key: optimized_parameter_values
      type: List[float]
    - description: Sharpe ratio achieved by the optimized parameter set
      key: sharpe_ratio_achieved
      type: float
    - description: Flag indicating whether the genetic algorithm met its convergence
        criteria
      key: convergence_reached
      type: bool
    - description: Number of generations the genetic algorithm executed before stopping
      key: generations_run
      type: int
    - description: Number of candidate solutions in each generation
      key: population_size
      type: int
    - description: List of parameter names corresponding to the optimized values
      key: parameter_names
      type: List[str]
    prd:
      conceptual_info: This node applies a genetic algorithm to search the strategy
        parameter space defined by define_strategy_parameters, evaluating each candidate
        using performance metrics from calculate_performance_metrics to maximize the
        Sharpe ratio.
      docstring:
        examples:
        - lines:
          - result = optimize_parameters(
          - '    parameter_names=[''macd_fast'', ''macd_slow'', ''vol_decay'', ''factor_weight'',
            ''stop_loss''],'
          - '    parameter_min_values=[5, 12, 0.01, 0.1, 0.01],'
          - '    parameter_max_values=[20, 50, 0.5, 1.0, 0.1],'
          - '    population_size=50,'
          - '    convergence_threshold=0.01,'
          - '    max_generations=100'
          - )
          output: '{''optimized_parameter_values'': [12.3, 28.5, 0.123, 0.78, 0.045],
            ''sharpe_ratio_achieved'': 2.45, ''convergence_reached'': True, ''generations_run'':
            35, ''population_size'': 50, ''parameter_names'': [''macd_fast'', ''macd_slow'',
            ''vol_decay'', ''factor_weight'', ''stop_loss'']}'
        - lines:
          - result_small = optimize_parameters(
          - '    parameter_names=[''param1'', ''param2'', ''param3''],'
          - '    parameter_min_values=[1, 0.5, 0.1],'
          - '    parameter_max_values=[10, 5, 1],'
          - '    population_size=20,'
          - '    convergence_threshold=0.02,'
          - '    max_generations=50'
          - )
          output: '{''optimized_parameter_values'': [5.2, 2.7, 0.45], ''sharpe_ratio_achieved'':
            1.78, ''convergence_reached'': False, ''generations_run'': 50, ''population_size'':
            20, ''parameter_names'': [''param1'', ''param2'', ''param3'']}'
        parameters:
        - description: Names of the strategy's core parameters to be optimized.
          name: parameter_names
          type: List[str]
        - description: Minimum bounds for each parameter in the search space.
          name: parameter_min_values
          type: List[float]
        - description: Maximum bounds for each parameter in the search space.
          name: parameter_max_values
          type: List[float]
        - description: Number of candidate solutions in each generation of the genetic
            algorithm.
          name: population_size
          type: int
        - description: Relative improvement threshold on the Sharpe ratio between
            successive generations to declare convergence.
          name: convergence_threshold
          type: float
        - description: Maximum number of generations to run if convergence is not
            reached earlier.
          name: max_generations
          type: int
        raises:
        - description: If the lengths of parameter lists do not match or if any min
            bound is greater than its corresponding max bound.
          type: ValueError
        - description: If the genetic algorithm fails to converge within the specified
            max_generations.
          type: RuntimeError
        - description: If evaluation of a candidate parameter set fails due to invalid
            configuration or runtime errors.
          type: Exception
        returns:
          description: A dictionary containing the optimized parameter values, achieved
            Sharpe ratio, convergence status, generations run, population size used,
            and parameter names.
          type: Dict[str, Any]
        summary: Optimizes strategy parameters via a genetic algorithm to maximize
          Sharpe ratio, using performance metrics as evaluation and respecting specified
          convergence and population settings.
    prompt: Use genetic algorithm to find parameter set maximizing Sharpe ratio. Specify
      convergence criteria and population size.
