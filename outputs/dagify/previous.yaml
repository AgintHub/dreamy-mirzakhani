dag_type: plain_text
description: A highly concurrent workflow for testing purpose 2
name: test_2_workflow
nodes:
  step_1:
    agent: false
    description: Initialize test environment
    name: step_1
    nodes_depended_on: []
    nodes_dependent_on:
    - step_2
    - step_3
    prompt: Set up test environment with necessary dependencies
  step_2:
    agent: false
    description: Prepare test data
    name: step_2
    nodes_depended_on:
    - step_1
    nodes_dependent_on:
    - step_4
    prompt: Generate test data for the workflow
  step_3:
    agent: false
    description: Configure test parameters
    name: step_3
    nodes_depended_on:
    - step_1
    nodes_dependent_on:
    - step_5
    prompt: Define test parameters for the workflow
  step_4:
    agent: false
    description: Run test scenario 1
    name: step_4
    nodes_depended_on:
    - step_2
    nodes_dependent_on:
    - step_6
    prompt: Execute test scenario 1 with prepared data
  step_5:
    agent: false
    description: Run test scenario 2
    name: step_5
    nodes_depended_on:
    - step_3
    nodes_dependent_on:
    - step_6
    prompt: Execute test scenario 2 with configured parameters
  step_6:
    agent: false
    description: Analyze test results
    name: step_6
    nodes_depended_on:
    - step_4
    - step_5
    nodes_dependent_on: []
    prompt: Compare and analyze results from test scenarios 1 and 2
