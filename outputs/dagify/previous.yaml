          - '    ''client_secret'': ''secret'','
          - '    ''token_url'': ''https://auth.pico.example.com/token'','
          - '    ''scopes'': [''read'', ''write'']'
          - '}'
          - result = establish_pico_connection(oauth_creds)
          - print(result['connection_status'], result['is_connected'])
          output: '''connected True'''
        - lines:
