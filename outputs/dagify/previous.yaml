dag_type: typed
description: Generated workflow from UI.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Identifies the high-level investment strategy.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen high-level investment strategy
      key: chosen_investment_strategy
      type: str
    - description: A one-sentence justification for the chosen investment strategy
      key: justification
      type: str
    prompt: Select one primary hedge-fund strategy category (e.g., long/short equity,
      global macro, systematic statistical arbitrage) that best serves the objectives.
      Provide a one-sentence justification.
  choose_legal_entity_type:
    agent: false
    description: Selects the legal entity form for the fund.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The selected legal vehicle structure for the fund's chosen jurisdiction.
      key: selected_entity_type
      type: str
    - description: A brief one-sentence explanation for the selected legal vehicle
        structure.
      key: entity_type_rationale
      type: str
    prompt: Specify the legal vehicle structure appropriate for the chosen jurisdiction
      (e.g., LP, LLC, SICAV). Provide a brief one-sentence explanation.
  clarify_fund_objectives:
    agent: false
    description: Produces a bullet-list of the fund’s primary business objectives.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Investment purpose
      key: investment_purpose
      type: str
    - description: Target return profile
      key: target_return_profile
      type: str
    - description: Competitive advantage
      key: competitive_advantage
      type: str
    - description: Long-term vision
      key: long_term_vision
      type: str
    - description: Other fund objectives
      key: other_objectives
      type: List[str]
    prompt: List the core objectives of the hedge fund in up to eight concise bullet
      points. Cover investment purpose, target return profile, competitive advantage,
      and long-term vision. Do not include any strategy or structural details.
  compile_pitch_deck_outline:
    agent: false
    description: Provides the structure for fundraising presentation materials.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: Objectives slide title
      key: objectives
      type: str
    - description: Strategy slide title
      key: strategy
      type: str
    - description: Team slide title
      key: team
      type: str
    - description: Edge slide title
      key: edge
      type: str
    - description: Risk controls slide title
      key: risk_controls
      type: str
    - description: Fees slide title
      key: fees
      type: str
    - description: Target returns slide title
      key: target_returns
      type: str
    - description: Market opportunity slide title
      key: market_opportunity
      type: str
    - description: Service providers slide title
      key: service_providers
      type: str
    - description: Timeline slide title
      key: timeline
      type: str
    prompt: Create a 10-slide outline (titles only) for an investor pitch deck covering
      objectives, strategy, team, edge, risk controls, fees, target returns, market
      opportunity, service providers, and timeline.
  create_hiring_plan:
    agent: false
    description: Determines initial staffing requirements.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: The list of essential full-time roles needed at launch, including
        their one-line responsibilities.
      key: roles_needed
      type: List[str]
    - description: The count of roles needed.
      key: count_roles
      type: int
    prompt: Identify up to eight essential full-time roles needed at launch (e.g.,
      Portfolio Manager, Quant Analyst, Risk Manager, Compliance Officer, Operations
      Manager, IT Engineer, CFO, Investor Relations). Include a one-line responsibility
      for each.
  define_asset_universe:
    agent: false
    description: Enumerates the tradable assets and instruments.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: A list of specific asset classes or instruments that the strategy
        will trade, with a maximum of ten entries.
      key: asset_classes_instruments
      type: List[str]
    prompt: List up to ten specific asset classes or instruments the strategy will
      trade (e.g., US large‑cap equities, Euro‑dollar futures, credit default swaps).
      Keep the list concise.
  define_investor_profile:
    agent: false
    description: Articulates the target investor segment.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The type of investor (e.g., family offices, pension funds, high-net-worth
        individuals)
      key: investor_type
      type: str
    - description: The typical ticket size for the investor
      key: ticket_size
      type: int
    - description: The investor's risk tolerance
      key: risk_tolerance
      type: float
    - description: The investor's liquidity preference
      key: liquidity_preference
      type: str
    - description: The investor's geographic focus
      key: geographic_focus
      type: str
    prompt: Describe the ideal investor type for the fund (e.g., family offices, pension
      funds, high-net-worth individuals). Include typical ticket size, risk tolerance,
      liquidity preference, and geographic focus.
  define_technology_stack:
    agent: false
    description: Specifies the software and infrastructure needed to support operations.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of operation steps
      key: ops_steps
      type: List[str]
    - description: List of technology components
      key: tech_components
      type: List[str]
    - description: The final technology stack
      key: tech_stack
      type: str
    prompt: 'List the technology components required for each operation step identified
      in the workflow (e.g., OMS, EMS, risk engine, data warehouse). Present as a
      two-column table: Ops Step | Tech Component.'
  design_compliance_program:
    agent: false
    description: Generates the compliance framework aligned with regulations and risk
      controls.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: List of regulatory obligations for the fund.
      key: compliance_requirements
      type: List[str]
    - description: List of filing names and governing authorities for regulatory requirements.
      key: regulatory_requirements
      type: List[str]
    - description: List of internal policies and procedures to comply with regulatory
        requirements.
      key: internal_policies_procedures
      type: List[str]
    prompt: 'Create a compliance checklist linking each regulatory requirement to
      an internal policy or procedure. Present as a two-column table: Requirement
      | Policy/Procedure.'
  design_risk_management_framework:
    agent: false
    description: Creates the quantitative and qualitative risk control architecture.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    output_structure:
    - description: First risk control (e.g., position limits)
      key: risk_control_1
      type: str
    - description: Second risk control (e.g., VaR caps)
      key: risk_control_2
      type: str
    - description: Third risk control (e.g., stop-loss levels)
      key: risk_control_3
      type: str
    - description: Fourth risk control (e.g., liquidity thresholds)
      key: risk_control_4
      type: str
    - description: Fifth risk control (optional)
      key: risk_control_5
      type: str
    - description: Sixth risk control (optional)
      key: risk_control_6
      type: str
    prompt: Provide 5-6 core risk controls aligned with the performance and risk targets
      (e.g., position limits, VaR caps, stop-loss levels, liquidity thresholds). Use
      bullet points.
  develop_timeline_and_milestones:
    agent: false
    description: Creates a phased schedule leading to fund launch.
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on: []
    output_structure:
    - description: List of month numbers from 1 to 12 representing each month in the
        timeline.
      key: timeline_months
      type: List[int]
    - description: Corresponding list of milestone descriptions for each month.
      key: milestones
      type: List[str]
    prompt: 'Construct a 12-month launch timeline with monthly milestones (e.g., legal
      formation, regulatory filings, service provider contracts, tech deployment,
      capital raise, first trade). Present as a table: Month | Milestone.'
  draft_fee_structure:
    agent: false
    description: Sets the fund's fee schedule.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    output_structure:
    - description: Management fees percentage or structure
      key: management_fees
      type: str
    - description: Performance fees percentage or structure
      key: performance_fees
      type: str
    - description: Hurdle rate or other performance targets
      key: hurdle_rate
      type: str
    - description: List of fee schedules or payment structures
      key: fee_schedules
      type: List[str]
    prompt: Propose management and performance fee percentages that balance cost recovery
      with market competitiveness. Include any hurdle rate if appropriate. Summarize
      in up to three sentences.
  draft_operations_workflow:
    agent: false
    description: Maps core trade and post-trade operational steps.
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: List of daily trade lifecycle steps
      key: tradelifecycle_steps
      type: List[str]
    - description: List of primary responsible parties for each trade lifecycle step
      key: responsible_parties
      type: List[str]
    prompt: 'Sketch the end-to-end daily trade lifecycle: idea generation → order
      creation → execution → confirmation → settlement → reconciliation. For each
      step, indicate the primary responsible party (internal team or specific service
      provider).'
  estimate_setup_and_operating_costs:
    agent: false
    description: Produces a high-level cost model for launch and ongoing operations.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on: []
    output_structure:
    - description: Estimated annual costs in USD for each service provider category
        listed in 'list_service_providers'. The order corresponds to the list of provider
        categories.
      key: service_provider_costs
      type: List[float]
    - description: Estimated annual costs in USD for internal overhead categories
        such as office, technology, staffing, etc., corresponding to internal cost
        components.
      key: internal_overhead_costs
      type: List[float]
    prompt: 'Provide an approximate annual cost (USD) for each listed service provider
      category and for internal overhead (office, tech, staffing). Show as a two-column
      table: Cost Item | Estimated USD.'
  identify_regulatory_requirements:
    agent: false
    description: Outlines key regulatory obligations.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: A list of principal regulatory filings or registrations required
        for the selected entity and jurisdiction, such as 'SEC Form ADV' or 'FCA Registration'.
      key: regulatory_requirements
      type: List[str]
    - description: A list of governing authorities overseeing the filings, such as
        'SEC' or 'FCA'.
      key: regulatory_authorities
      type: List[str]
    prompt: List the principal regulatory filings or registrations required for the
      selected entity and jurisdiction (e.g., SEC Form ADV, FCA Registration). Include
      only the filing names and the governing authority.
  list_service_providers:
    agent: false
    description: Identifies required external service providers.
    name: list_service_providers
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: List of provider categories (e.g., prime broker, fund administrator,
        auditor, legal counsel, compliance consultant, custodian)
      key: provider_categories
      type: List[str]
    - description: Number of service providers in each category
      key: num_providers
      type: int
    prompt: 'Create a checklist of mandatory third-party service providers: prime
      broker, fund administrator, auditor, legal counsel, compliance consultant, and
      custodian. List only provider categories.'
  produce_final_fund_plan_summary:
    agent: false
    description: Generates a comprehensive final plan document.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    output_structure:
    - description: The comprehensive final plan document.
      key: final_plan_document
      type: str
    - description: A list of bullet points summarizing the key points in the final
        plan document.
      key: executive_summary_bullet_points
      type: List[str]
    - description: A section detailing the fund's structure.
      key: fund_structure_details
      type: str
    - description: A section detailing the fund's risk management controls.
      key: risk_management_controls
      type: str
    - description: A section detailing the fund's operational steps.
      key: operational_steps
      type: str
    - description: A section detailing the fund's fee schedule.
      key: fee_schedule
      type: str
    - description: A section detailing the fund's cost model.
      key: cost_model
      type: str
    - description: A section detailing the fund's compliance framework.
      key: compliance_framework
      type: str
    - description: A section detailing the fund's hiring plan.
      key: hiring_plan
      type: str
    - description: A section detailing the fund's technology stack.
      key: technology_stack
      type: str
    - description: A section detailing the fund's launch timeline.
      key: launch_timeline
      type: str
    - description: A section detailing the fund's fundraising materials.
      key: fundraising_materials
      type: str
    prompt: Synthesize all prior outputs into a concise executive summary (≤400 words)
      covering strategy, structure, risk, operations, fees, cost model, compliance,
      hiring, technology, timeline, and fundraising materials. Use bullet points or
      short paragraphs.
  select_jurisdiction:
    agent: false
    description: Determines the legal domicile and rationale.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen jurisdiction for the fund.
      key: chosen_jurisdiction
      type: str
    - description: Two advantages of the chosen jurisdiction.
      key: advantages
      type: List[str]
    - description: Two disadvantages of the chosen jurisdiction.
      key: disadvantages
      type: List[str]
    - description: Rationale for the chosen jurisdiction.
      key: rationale
      type: str
    prompt: Choose a domicile for the fund (e.g., Cayman, Delaware, Luxembourg) that
      best aligns with the stated objectives. Provide two advantages and two disadvantages
      of the chosen jurisdiction.
  set_performance_and_risk_targets:
    agent: false
    description: Specifies numerical performance and risk goals.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Target annual gross return for the chosen strategy
      key: annual_gross_return
      type: float
    - description: Target annual volatility for the chosen strategy
      key: annual_volatility
      type: float
    - description: Target Sharpe ratio for the chosen strategy
      key: Sharpe_ratio
      type: float
    - description: Target maximum drawdown for the chosen strategy
      key: maximum_drawdown
      type: float
    - description: List of performance targets for the chosen strategy
      key: performance_targets
      type: List[float]
    - description: List of risk targets for the chosen strategy
      key: risk_targets
      type: List[float]
    prompt: Define quantitative targets for annual gross return, annual volatility,
      Sharpe ratio, and maximum drawdown that are realistic for the chosen strategy.
      Present them in a simple table.
