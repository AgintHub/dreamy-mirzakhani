dag_type: plain_text
description: Comprehensive workflow for building a hedge fund covering strategy, structure,
  operations, compliance, and launch planning with maximum parallelism
name: construct_hedge_fund_foundation
nodes:
  choose_investment_strategy:
    agent: false
    description: Select the primary investment strategy and approach
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - define_asset_universe
    - set_performance_and_risk_targets
    - design_risk_management_framework
    prompt: Select one primary hedge fund strategy (long/short equity, global macro,
      event driven, etc.). Provide a 1-sentence rationale aligning with the defined
      fund objectives.
  choose_legal_entity_type:
    agent: false
    description: Define the legal structure for the fund
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on:
    - list_service_providers
    - design_compliance_program
    - outline_governance_structure
    prompt: Choose the legal entity structure (LLC, LP, SICAV, etc.). Provide a 1-sentence
      justification for this structure related to the selected jurisdiction's requirements.
  clarify_fund_objectives:
    agent: false
    description: Define the hedge fund's core business objectives and long-term vision
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - choose_investment_strategy
    - select_jurisdiction
    - define_investor_profile
    prompt: 'List the primary business objectives for the hedge fund in 7 concise
      bullet points. Focus on: investment purpose, competitive differentiation, target
      returns, long-term vision, risk profile, liquidity requirements, and capital
      growth goals.'
  compile_pitch_deck_outline:
    agent: false
    description: Create presentation framework
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - define_investor_profile
    - set_performance_and_risk_targets
    - design_risk_management_framework
    nodes_dependent_on:
    - produce_final_fund_plan_summary
    prompt: 'Generate 12 pitch deck titles balancing strategy, risk control, team,
      and returns: Overview, Strategy, Edge, Track Record, etc.'
  create_hiring_plan:
    agent: false
    description: Draft staffing requirements
    name: create_hiring_plan
    nodes_depended_on: []
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: 'List 8 core roles with 1-line responsibilities: CIO role, portfolio manager,
      operations director, etc. Align with operations workflow requirements.'
  define_asset_universe:
    agent: false
    description: Specify tradable assets and instruments
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - draft_operations_workflow
    - design_risk_management_framework
    prompt: List specific asset classes and financial instruments (e.g., US corporate
      bonds, NASDAQ futures). Include 8-12 precise instruments.
  define_investor_profile:
    agent: false
    description: Identify the target investor demographic
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - draft_fee_structure
    - compile_pitch_deck_outline
    - estimate_setup_and_operating_costs
    prompt: 'Define the ideal investor profile as 5 key attributes: asset size threshold,
      liquidity preference, risk tolerance level, geographic focus, and investment
      horizon.'
  define_technology_stack:
    agent: false
    description: Specify required systems and platforms
    name: define_technology_stack
    nodes_depended_on: []
    nodes_dependent_on:
    - develop_timeline_and_milestones
    - compile_pitch_deck_outline
    prompt: 'Create a 2-column table mapping each workflow step to specific technologies:
      Operations Step | Required System (e.g., Reconciliation → T1 Reconciliation
      System).'
  design_compliance_program:
    agent: false
    description: Create internal control policies
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on:
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    prompt: 'Map 5 regulatory requirements to specific internal policies. Format as:
      Requirement (e.g., PMLD5) | Control Measure.'
  design_risk_management_framework:
    agent: false
    description: Create control mechanisms
    name: design_risk_management_framework
    nodes_depended_on:
    - define_asset_universe
    - set_performance_and_risk_targets
    nodes_dependent_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    prompt: 'List 5 risk controls: daily liquidity reserves, position limits per security,
      VaR thresholds, stop-loss rules, and stress tests. Format as bullet points with
      specific numeric thresholds.'
  develop_timeline_and_milestones:
    agent: false
    description: Create launch schedule
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - design_compliance_program
    - define_technology_stack
    - create_hiring_plan
    - draft_fee_structure
    nodes_dependent_on:
    - produce_final_fund_plan_summary
    prompt: 'Build a 12-month implementation timeline with 3-phase breakdown: pre-launch,
      launch, post-launch. Include specific milestones: EIN application, first investor
      meeting, first live trade.'
  draft_fee_structure:
    agent: false
    description: Set fee arrangements
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on:
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    prompt: Document management fee, performance fee, and hurdle rate. Include 2 optional
      variations with rationale for competitive positioning.
  estimate_setup_and_operating_costs:
    agent: false
    description: Prepare cost estimates
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on:
    - develop_timeline_and_milestones
    - draft_fee_structure
    prompt: 'Provide USD estimates for each provider plus annual overhead. Format
      as 2 columns: Service Provider | Estimated USD Annual Cost.'
  identify_regulatory_requirements:
    agent: false
    description: List required regulatory filings
    name: identify_regulatory_requirements
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on:
    - design_compliance_program
    - list_service_providers
    prompt: List required regulatory filings (e.g., Form SEC 13F, FEIE application)
      for the selected jurisdiction. Include 3 mandatory filings with governing authority
      names only.
  list_service_providers:
    agent: false
    description: Compile necessary third-party service providers
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - draft_operations_workflow
    - estimate_setup_and_operating_costs
    - design_compliance_program
    prompt: 'Create a checklist of external providers: custodian, prime broker, fund
      administrator, legal counsel, and compliance consultant. No descriptions, just
      provider types.'
  outline_governance_structure:
    agent: false
    description: Define internal decision-making framework
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - compile_pitch_deck_outline
    - design_compliance_program
    prompt: 'Create a governance blueprint with 5 key roles: GP, CIO, independent
      directors, etc. Each with 1-line primary duties.'
  produce_final_fund_plan_summary:
    agent: false
    description: Generate executive summary document
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    - design_compliance_program
    nodes_dependent_on: []
    prompt: Synthesize all results into 500-word summary covering governance, strategy,
      operational model, risk framework, costs, and launch plan. Use bullet points
      or short paragraphs.
  select_jurisdiction:
    agent: false
    description: Choose the optimal fund domicile and regulatory environment
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - choose_legal_entity_type
    - identify_regulatory_requirements
    prompt: Select the most appropriate jurisdiction (e.g., Cayman Islands, Delaware,
      Luxembourg). Provide 2 advantages and 2 disadvantages specific to this jurisdiction
      aligned with fund objectives.
  set_performance_and_risk_targets:
    agent: false
    description: Quantify financial and risk objectives
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - design_risk_management_framework
    - draft_fee_structure
    prompt: 'Create a 4x3 table of annual targets: Gross Return (%), Volatility (%),
      Sharpe Ratio, Max Drawdown (%) aligned with the investment strategy.'
