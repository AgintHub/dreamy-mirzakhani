dag_type: plain_text
description: A comprehensive, step-by-step workflow for building a hedge fund from
  initial concept to finalized launch plan covering objectives, strategy, legal, investor
  targeting, operations, compliance, and fundraising materials.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Select the primary hedge fund investment strategy category.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - define_asset_universe
    - set_performance_and_risk_targets
    prompt: Choose one hedge fund investment strategy category (e.g., long/short equity,
      global macro, event-driven) that aligns with the fund objectives. Include a
      one-sentence rationale for the choice.
  choose_legal_entity_type:
    agent: false
    description: Determine the legal entity structure for the hedge fund.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on:
    - identify_regulatory_requirements
    - list_service_providers
    - outline_governance_structure
    prompt: Specify the legal entity type for the fund vehicle (e.g., Limited Partnership,
      LLC, SICAV) suitable for the chosen jurisdiction. Provide a brief explanation
      for suitability.
  clarify_fund_objectives:
    agent: false
    description: Define the core business objectives and vision of the hedge fund.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - select_jurisdiction
    - define_investor_profile
    - choose_investment_strategy
    prompt: List the primary objectives for launching the hedge fund, including investment
      purpose, target returns, competitive edge, and vision in concise bullet points
      (max 8). Do not address strategy specifics here.
  compile_pitch_deck_outline:
    agent: false
    description: Create a 10-slide investor pitch deck framework covering all core
      topics.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    - design_compliance_program
    - outline_governance_structure
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: Develop a 10-slide outline (slide titles only) for the hedge fund’s investor
      presentation including objectives, strategy, team, risk controls, fees, compliance,
      and governance.
  create_hiring_plan:
    agent: false
    description: List initial personnel requirements for fund launch.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: Enumerate key full-time positions needed for launch (max 8), with one-line
      summaries of each role's responsibilities linked to operational needs.
  define_asset_universe:
    agent: false
    description: List the asset classes and instruments the fund will trade.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - draft_operations_workflow
    prompt: Provide a list of specific asset classes and instruments the selected
      strategy will trade (limit to 10), e.g., US equities, convertible bonds, futures
      contracts.
  define_investor_profile:
    agent: false
    description: Identify and describe the target investor segment for the fund.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: Based on fund objectives, describe the ideal investors including typical
      ticket size, risk tolerance, liquidity preferences, geographic location, and
      investor type (e.g., family offices, pensions).
  define_technology_stack:
    agent: false
    description: Specify required technology tools and infrastructure for operations.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: 'Identify software and infrastructure components needed for each operations
      workflow step (e.g., OMS, EMS, risk management system). Present in a two-column
      table: Operations Step | Technology Component.'
  design_compliance_program:
    agent: false
    description: Develop compliance policies aligned with regulations and risk framework.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: 'Create a compliance checklist mapping each regulatory requirement to
      a specific internal policy or procedure. Present as a table with columns: Regulatory
      Requirement | Policy Reference.'
  design_risk_management_framework:
    agent: false
    description: Create a set of risk controls and limits aligned with targets.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on:
    - draft_operations_workflow
    - design_compliance_program
    prompt: List 4 to 6 key risk control measures including position limits, VaR,
      stop-loss rules, and liquidity criteria consistent with the fund’s risk targets.
  develop_timeline_and_milestones:
    agent: false
    description: Construct a 12-month phased timeline leading to fund launch.
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on:
    - produce_final_fund_plan_summary
    prompt: Create a monthly milestone timeline covering regulatory filings, service
      provider onboarding, capital raising, technology deployment, hiring, and fund
      go-live.
  draft_fee_structure:
    agent: false
    description: Set fund management and performance fees.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: Recommend management and performance fee percentages that balance competitiveness
      and cost recovery. Include any incentive hurdles. Provide rationale in up to
      three sentences.
  draft_operations_workflow:
    agent: false
    description: Map the hedge fund’s core trading and operational processes.
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on:
    - create_hiring_plan
    - define_technology_stack
    - develop_timeline_and_milestones
    prompt: Outline the daily trading lifecycle steps from idea generation through
      order execution, confirmation, settlement, and reconciliation. Assign responsibility
      (internal or service provider) to each step.
  estimate_setup_and_operating_costs:
    agent: false
    description: Provide a cost estimate for fund setup and ongoing operations.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on:
    - draft_fee_structure
    prompt: 'Estimate annual USD costs for each service provider and essential overhead
      (office, technology). Present as two columns: Cost Item | Estimated Cost (USD).'
  identify_regulatory_requirements:
    agent: false
    description: Catalog required regulatory filings and registrations.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - design_compliance_program
    prompt: List all necessary regulatory registrations or filings (e.g., SEC Form
      ADV, FCA registration) required for the chosen legal entity and jurisdiction.
      Include the regulatory bodies’ names.
  list_service_providers:
    agent: false
    description: Enumerate essential third-party service providers for fund operations.
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - estimate_setup_and_operating_costs
    - draft_operations_workflow
    prompt: Provide a checklist of mandatory external service providers such as prime
      broker, fund administrator, auditor, legal counsel, compliance consultant, and
      custodian without descriptions.
  outline_governance_structure:
    agent: false
    description: Define the hedge fund’s internal governance roles and responsibilities.
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: Draft a governance chart listing up to 5 roles (e.g., General Partner,
      Investment Manager, Board Members) with one-line descriptions of their duties.
  produce_final_fund_plan_summary:
    agent: false
    description: Generate an executive summary synthesizing all prior planning outputs.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - compile_pitch_deck_outline
    - design_compliance_program
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    prompt: Compose a concise (≤400 words) executive summary of the hedge fund plan
      including strategy, legal structure, risk management, operations, fees, and
      launch timeline. Use bullets or short paragraphs.
  select_jurisdiction:
    agent: false
    description: Choose the optimal fund domicile considering regulatory, tax, and
      business factors.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - choose_legal_entity_type
    - list_service_providers
    - identify_regulatory_requirements
    - outline_governance_structure
    prompt: Select the domicile for the hedge fund (e.g., Cayman Islands, Delaware,
      Luxembourg) that best aligns with the fund’s objectives. Provide two pros and
      two cons for the choice.
  set_performance_and_risk_targets:
    agent: false
    description: Establish quantitative return and risk objectives for the fund.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - design_risk_management_framework
    - draft_fee_structure
    prompt: Define annual numerical targets for gross return, volatility (standard
      deviation), Sharpe ratio, and maximum drawdown consistent with the investment
      strategy. Present as a four-row table.
