    output_structure:
    - description: Ordered list of each operational step in the daily trade lifecycle.
      key: trade_lifecycle_steps
      type: List[str]
    - description: Ordered list of the party responsible for each corresponding step
        in trade_lifecycle_steps.
      key: responsible_parties
      type: List[str]
    prd:
      conceptual_info: This node captures the day‑to‑day flow of a trade, mapping
        each activity to the entity or role that executes it. It provides a concise,
        step‑by‑step blueprint that feeds downstream staffing (create_hiring_plan)
        and technology requirements (define_technology_stack).
      docstring:
        examples:
        - lines:
          - steps, parties = draft_operations_workflow(
          - '    asset_classes=[''Equities'', ''Futures''],'
          - '    instrument_types=[''S&P 500 ETF'', ''Crude Oil Futures''],'
          - '    prime_broker=''PrimeCo'','
          - '    fund_administrator=''AdminInc'','
          - '    auditor=''AuditCo'','
          - '    legal_counsel=''LegalCo'','
          - '    compliance_consultant=''ComplianceCo'','
          - '    custodian=''CustodyCo'' )'
          output: "(\n    ['Idea Generation', 'Order Entry', 'Execution', 'Confirmation',\
            \ 'Settlement', 'Reconciliation'],\n    ['In‑house Trading Desk', 'Compliance\
            \ Team', 'PrimeCo', 'PrimeCo', 'AdminInc', 'AdminInc']\n)"
        - lines:
          - steps, parties = draft_operations_workflow(
          - '    asset_classes=[''Equities''],'
          - '    instrument_types=[''SPY''],'
          - '    prime_broker=''PrimeCo'','
          - '    fund_administrator=''AdminInc'','
          - '    auditor=''AuditCo'','
          - '    legal_counsel=''LegalCo'','
          - '    compliance_consultant=''ComplianceCo'','
          - '    custodian=''CustodyCo'' )'
          output: "(\n    ['Idea Generation', 'Order Entry', 'Execution', 'Confirmation',\
            \ 'Settlement', 'Reconciliation'],\n    ['In‑house Trading Desk', 'Compliance\
            \ Team', 'PrimeCo', 'PrimeCo', 'AdminInc', 'AdminInc']\n)"
        parameters:
        - description: List of asset classes the fund trades (from define_asset_universe).
            Used to infer any asset‑specific steps or responsibilities.
          name: asset_classes
          type: List[str]
        - description: List of specific instruments traded (from define_asset_universe).
            Helps determine instrument‑specific responsibilities.
          name: instrument_types
          type: List[str]
        - description: Name of the selected prime broker (from list_service_providers).
            Often handles execution and confirmation.
          name: prime_broker
          type: str
        - description: Name of the fund administrator (from list_service_providers).
            Typically responsible for settlement and reconciliation.
          name: fund_administrator
          type: str
        - description: Name of the external auditor (from list_service_providers).
            May validate reconciliation.
          name: auditor
          type: str
        - description: Name of the legal counsel firm (from list_service_providers).
            Handles regulatory compliance of trade lifecycle.
          name: legal_counsel
          type: str
        - description: Name of the compliance consulting firm (from list_service_providers).
            Oversees policy adherence during each step.
          name: compliance_consultant
          type: str
        - description: Name of the custodial service provider (from list_service_providers).
            Holds settled positions.
          name: custodian
          type: str
        raises:
        - description: Raised if any required provider name is missing or empty.
          type: ValueError
        - description: Raised if input lists are not of type List[str] or provider
            arguments are not str.
          type: TypeError
        returns:
          description: A tuple containing an ordered list of trade lifecycle steps
            and a matching list of responsible parties.
          type: Tuple[List[str], List[str]]
        summary: Creates an ordered list of daily trade lifecycle steps and the responsible
          party for each step.
    prompt: 'Sketch the daily trade lifecycle: idea generation → order entry → execution
      → confirmation → settlement → reconciliation. List each step with responsible
      party.'
