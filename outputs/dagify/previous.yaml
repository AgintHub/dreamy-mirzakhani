dag_type: plain_text
description: A workflow for testing various scenarios
name: test_workflow
nodes:
  check_test_data:
    agent: false
    description: Verify that the generated test data is valid
    name: check_test_data
    nodes_depended_on:
    - get_test_data
    nodes_dependent_on:
    - get_test_data
    prompt: Verify that the generated test data is valid
  generate_test_report:
    agent: false
    description: Generate a test report summarizing the results of all tests
    name: generate_test_report
    nodes_depended_on:
    - test_performance
    nodes_dependent_on: []
    prompt: Generate a test report
  get_test_data:
    agent: false
    description: Generate test data for this workflow
    name: get_test_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate test data for this workflow
  test_api:
    agent: false
    description: Perform various API tests (e.g., request-response, authentication,
      rate limiting)
    name: test_api
    nodes_depended_on:
    - test_database
    nodes_dependent_on: []
    prompt: Perform various API tests
  test_database:
    agent: false
    description: Perform various database tests (e.g., CRUD operations, queries, indexing)
    name: test_database
    nodes_depended_on:
    - check_test_data
    nodes_dependent_on: []
    prompt: Perform various database tests
  test_performance:
    agent: false
    description: Perform various performance tests (e.g., load testing, stress testing)
    name: test_performance
    nodes_depended_on:
    - test_security
    nodes_dependent_on: []
    prompt: Perform various performance tests
  test_security:
    agent: false
    description: Perform various security tests (e.g., penetration testing, vulnerability
      scanning)
    name: test_security
    nodes_depended_on:
    - test_api
    nodes_dependent_on: []
    prompt: Perform various security tests
