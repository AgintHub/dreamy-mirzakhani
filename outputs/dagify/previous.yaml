dag_type: plain_text
description: A workflow that adds all remaining courtroom staff to the existing judge,
  prosecutor, and defendant components, establishing appropriate dependencies for
  a realistic simulation.
name: courtroom_staff_extension
nodes:
  bailiff:
    agent: false
    description: Create the bailiff component to support court proceedings.
    name: bailiff
    nodes_depended_on: []
    nodes_dependent_on:
    - judge
    prompt: Define and implement the bailiff role, ensuring court order, security,
      and assistance to the judge. Design interfaces, integrate into the simulator,
      validate, test, and document the component.
  clerk:
    agent: false
    description: Create the clerk component with full administrative capabilities.
    name: clerk
    nodes_depended_on: []
    nodes_dependent_on:
    - prosecutor
    - defense_attorney
    - defendant
    prompt: Define and implement the clerk role, including record‑keeping, document
      handling, and administrative support for the courtroom. Design interfaces, integrate
      into the simulator, validate, test, and document the component.
  court_reporter:
    agent: false
    description: Implement the court reporter component.
    name: court_reporter
    nodes_depended_on:
    - judge
    - prosecutor
    - defense_attorney
    - defendant
    - witness
    - juror
    nodes_dependent_on: []
    prompt: Define the court reporter role, design real‑time recording of proceedings,
      develop interfaces, integrate with the simulator, validate recording fidelity,
      test thoroughly, and produce comprehensive documentation.
  defendant:
    agent: false
    description: Implement the defendant component.
    name: defendant
    nodes_depended_on:
    - clerk
    nodes_dependent_on:
    - judge
    - court_reporter
    prompt: Define the defendant role, design representation and interaction logic,
      develop interfaces, integrate with the simulator, validate outputs, test thoroughly,
      and produce comprehensive documentation.
  defense_attorney:
    agent: false
    description: Implement the defense attorney component.
    name: defense_attorney
    nodes_depended_on:
    - clerk
    nodes_dependent_on:
    - judge
    - witness
    - court_reporter
    prompt: Define the defense attorney role, design defense strategy and argumentation
      logic, develop interfaces, integrate with the simulator, validate outputs, test
      thoroughly, and produce comprehensive documentation.
  judge:
    agent: false
    description: Implement the judge component.
    name: judge
    nodes_depended_on:
    - prosecutor
    - defense_attorney
    - defendant
    - bailiff
    nodes_dependent_on:
    - juror
    - court_reporter
    prompt: Define the judge role, design decision‑making logic, develop interfaces,
      integrate with the simulator, validate decisions, test thoroughly, and produce
      comprehensive documentation.
  juror:
    agent: false
    description: Implement the juror component.
    name: juror
    nodes_depended_on:
    - judge
    nodes_dependent_on:
    - court_reporter
    prompt: Define the juror role, model deliberation and verdict process, develop
      interfaces, integrate with the simulator, validate outputs, test thoroughly,
      and produce comprehensive documentation.
  prosecutor:
    agent: false
    description: Implement the prosecutor component.
    name: prosecutor
    nodes_depended_on:
    - clerk
    nodes_dependent_on:
    - judge
    - witness
    - court_reporter
    prompt: Define the prosecutor role, design evidence gathering and argumentation
      logic, develop interfaces, integrate with the simulator, validate outputs, test
      thoroughly, and produce comprehensive documentation.
  witness:
    agent: false
    description: Implement the witness component.
    name: witness
    nodes_depended_on:
    - prosecutor
    - defense_attorney
    nodes_dependent_on:
    - court_reporter
    prompt: Define the witness role, model testimony delivery, develop interfaces,
      integrate with the simulator, validate testimony handling, test thoroughly,
      and produce comprehensive documentation.
