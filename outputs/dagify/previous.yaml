    nodes_dependent_on: []
    output_structure:
    - description: The chosen jurisdiction for the fund.
      key: chosen_jurisdiction
      type: str
    - description: Two advantages of the chosen jurisdiction.
      key: advantages
      type: List[str]
    - description: Two disadvantages of the chosen jurisdiction.
      key: disadvantages
      type: List[str]
    - description: Rationale for the chosen jurisdiction.
      key: rationale
      type: str
    prd:
      conceptual_info: Determines the legal domicile and rationale of the fund based
        on its objectives.
      docstring:
        examples:
        - lines:
          - 'fund_objectives = {''investment_purpose'': ''Risk management'', ''target_return_profile'':
            ''20% pa'', ''competitive_advantage'': ''Strong team'', ''long_term_vision'':
            ''Expand globally''}'
          - selected_jurisdiction = select_jurisdiction(fund_objectives)
          output: '{''chosen_jurisdiction'': ''Cayman'', ''advantages'': [''Tax friendly'',
            ''Flexible regulations''], ''disadvantages'': [''No access to investor
            capital''], ''rationale'': ''Cayman offers more tax benefits while allowing
            flexible regulations.''}'
