dag_type: plain_text
description: Workflow that starts, runs two independent tasks in parallel, then combines
  their results in a final step.
name: simple_parallel_fanout_with_finalize
nodes:
  finalize_step:
    agent: false
    description: Combine the outputs of the two parallel tasks into a final result.
    name: finalize_step
    nodes_depended_on:
    - parallel_step_one
    - parallel_step_two
    nodes_dependent_on: []
    prompt: Take the results from parallel_step_one and parallel_step_two and output
      a combined summary sentence.
  parallel_step_one:
    agent: false
    description: Perform the first independent task after receiving the start signal.
    name: parallel_step_one
    nodes_depended_on:
    - start_step
    nodes_dependent_on: []
    prompt: When the input is "START", output the result of task one as a short sentence.
  parallel_step_two:
    agent: false
    description: Perform the second independent task after receiving the start signal.
    name: parallel_step_two
    nodes_depended_on:
    - start_step
    nodes_dependent_on: []
    prompt: When the input is "START", output the result of task two as a short sentence.
  start_step:
    agent: false
    description: Generate the initial signal that triggers the parallel work.
    name: start_step
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Output a single token "START" to indicate the beginning of the workflow.
