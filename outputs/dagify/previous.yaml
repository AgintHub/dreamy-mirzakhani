dag_type: plain_text
description: A workflow that sets up a test environment, creates test cases, executes
  them concurrently, and generates a final report.
name: run_test_suite
nodes:
  collect_test_results:
    agent: false
    description: Compile raw test execution data into a unified format.
    name: collect_test_results
    nodes_depended_on:
    - execute_tests_parallel
    nodes_dependent_on:
    - create_summary_report
    prompt: Aggregate the results from all test executions into a structured JSON
      object containing test name, status, duration, and error details if any.
  create_summary_report:
    agent: false
    description: Produce the final test report for stakeholders.
    name: create_summary_report
    nodes_depended_on:
    - collect_test_results
    nodes_dependent_on: []
    prompt: Generate a human‑readable report (Markdown) summarizing the total number
      of tests, passed, failed, and skipped. Include a table with each test and its
      outcome.
  define_test_cases:
    agent: false
    description: Specify test coverage and expected behavior.
    name: define_test_cases
    nodes_depended_on: []
    nodes_dependent_on:
    - generate_test_scripts
    prompt: List all test case identifiers and the functionality they cover. Provide
      a short description for each case.
  execute_tests_parallel:
    agent: false
    description: Execute the test suite in parallel to reduce runtime.
    name: execute_tests_parallel
    nodes_depended_on:
    - generate_test_scripts
    nodes_dependent_on:
    - collect_test_results
    prompt: Run all generated test scripts concurrently using the test runner's parallel
      execution option. Capture standard output, exit codes, and any error logs.
  generate_test_scripts:
    agent: false
    description: Create executable test scripts from the test case list.
    name: generate_test_scripts
    nodes_depended_on:
    - define_test_cases
    nodes_dependent_on: []
    prompt: For each test case, produce a script in the chosen test framework (e.g.,
      Jest, PyTest) that exercises the target functionality and asserts expected outcomes.
  initialize_test_environment:
    agent: false
    description: Establish isolated services needed for the tests.
    name: initialize_test_environment
    nodes_depended_on: []
    nodes_dependent_on:
    - prepare_test_data
    - setup_test_dependencies
    prompt: Create a temporary test environment by launching required services (e.g.,
      database, message broker) in Docker containers. Ensure all containers are reachable
      on localhost and expose necessary ports.
  prepare_test_data:
    agent: false
    description: Load deterministic test data into the database.
    name: prepare_test_data
    nodes_depended_on:
    - initialize_test_environment
    nodes_dependent_on: []
    prompt: Generate seed data for the database, including users, products, and orders,
      and load it into the test database. Output a summary of records inserted.
  setup_test_dependencies:
    agent: false
    description: Install runtime dependencies for test execution.
    name: setup_test_dependencies
    nodes_depended_on:
    - initialize_test_environment
    nodes_dependent_on: []
    prompt: Install any required runtime dependencies (e.g., npm packages, Python
      libraries) inside the test environment. Verify installation by running a version
      check.
