dag_type: plain_text
description: A workflow for analyzing a stock using fundamental data
name: analyze_stock
nodes:
  analyze_industry_trends:
    agent: false
    description: Examine the growth prospects, macroeconomic factors, and sectoral
      drivers
    name: analyze_industry_trends
    nodes_depended_on:
    - fetch_financial_statements
    nodes_dependent_on: []
    prompt: Analyze the industry trends and outlook
  calculate_key_ratios:
    agent: false
    description: Compute the debt-to-equity, current ratio, and interest coverage
      ratio
    name: calculate_key_ratios
    nodes_depended_on:
    - gather_fundamental_data
    nodes_dependent_on: []
    prompt: Calculate key financial ratios of the company
  create_report:
    agent: false
    description: Compile a concise document highlighting key insights and analysis
    name: create_report
    nodes_depended_on:
    - generate_recommendations
    nodes_dependent_on: []
    prompt: Create a report summarizing the findings and recommendations
  evaluate_competition:
    agent: false
    description: Assess the financial and operational strengths and weaknesses of
      competitors
    name: evaluate_competition
    nodes_depended_on:
    - fetch_financial_statements
    nodes_dependent_on: []
    prompt: Evaluate the competition of the company
  fetch_financial_statements:
    agent: false
    description: Obtain the income statement, balance sheet, and cash flow statement
    name: fetch_financial_statements
    nodes_depended_on:
    - gather_fundamental_data
    nodes_dependent_on: []
    prompt: Fetch the historical financial statements of the company
  gather_fundamental_data:
    agent: false
    description: Fetch the earnings, revenue, gross margins, operating margins, and
      net income of the company
    name: gather_fundamental_data
    nodes_depended_on:
    - retrieve_stock_symbol
    nodes_dependent_on: []
    prompt: Retrieve the fundamental data of the company
  generate_recommendations:
    agent: false
    description: Offer buy, sell, or hold advice with supporting rationale
    name: generate_recommendations
    nodes_depended_on:
    - calculate_key_ratios
    - evaluate_competition
    - analyze_industry_trends
    nodes_dependent_on: []
    prompt: Generate recommendations for the investor based on the analysis
  retrieve_stock_symbol:
    agent: false
    description: Retrieve the stock symbol of the company
    name: retrieve_stock_symbol
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Provide the stock symbol of the company to be analyzed
