  set_backtest_parameters:
    agent: false
    code_node_type: stub
    description: Configure strategy evaluation framework
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass PreprocessDataOutput(BaseModel):\n    \"\"\"Pydantic model for preprocess_data\
      \ node outputs.\"\"\"\n    array_shape: List[int] = (\n        Field(..., description=\"\
      Dimensions of the 4D numpy array (e.g., [n_assets, n_features, n_time_steps,\
      \ n_channels])\")\n    )\n    num_assets: int = (\n        Field(..., description=\"\
      Number of distinct assets included in the dataset\")\n    )\n    num_time_steps:\
      \ int = (\n        Field(..., description=\"Total number of time steps after\
      \ alignment\")\n    )\n    price_normalized: bool = (\n        Field(..., description=\"\
      Indicates whether price values have been normalized\")\n    )\n    volatility_calculated:\
      \ bool = (\n        Field(..., description=\"Indicates whether volatility metrics\
      \ have been computed\")\n    )\n    data_integrity: bool = (\n        Field(...,\
      \ description=\"True if the dataset passes all integrity checks (no missing\
      \ values, consistent timestamps)\")\n    )\n\n\nclass SetBacktestParametersOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_backtest_parameters node outputs.\"\"\"\n\
      \    in_sample_start: str = (\n        Field(..., description=\"Start date of\
      \ the in-sample period (YYYY-MM-DD)\")\n    )\n    in_sample_end: str = (\n\
      \        Field(..., description=\"End date of the in-sample period (YYYY-MM-DD)\"\
      )\n    )\n    out_sample_start: str = (\n        Field(..., description=\"Start\
      \ date of the out-of-sample period (YYYY-MM-DD)\")\n    )\n    out_sample_end:\
      \ str = (\n        Field(..., description=\"End date of the out-of-sample period\
      \ (YYYY-MM-DD)\")\n    )\n    montecarlo_min: int = (\n        Field(..., description=\"\
      Minimum number of Monte Carlo simulations to run\")\n    )\n    montecarlo_max:\
      \ int = (\n        Field(..., description=\"Maximum number of Monte Carlo simulations\
      \ to run\")\n    )\n    walkforward_window_days: List[int] = (\n        Field(...,\
      \ description=\"List of window sizes (in days) for walk-forward analysis\")\n\
      \    )\n\n\ndef set_backtest_parameters(preprocess_data_input: PreprocessDataOutput,\
      \ **kwargs) -> SetBacktestParametersOutput:\n    \"\"\"\n    Configure the backtesting\
      \ framework for a quantitative strategy.\n\n    Parameters\n    ----------\n\
      \    in_sample_start : str\n        Start date of the in-sample period in 'YYYY-MM-DD'\
      \ format.\n    in_sample_end : str\n        End date of the in-sample period\
      \ in 'YYYY-MM-DD' format.\n    out_sample_start : str\n        Start date of\
      \ the out-of-sample period in 'YYYY-MM-DD' format.\n    out_sample_end : str\n\
      \        End date of the out-of-sample period in 'YYYY-MM-DD' format.\n    montecarlo_min\
      \ : int\n        Minimum number of Monte Carlo simulations to run.\n    montecarlo_max\
      \ : int\n        Maximum number of Monte Carlo simulations to run.\n    walkforward_window_days\
      \ : List[int]\n        Sequence of window sizes (in days) for walk‑forward analysis.\
      \ Each\n        element defines the length of a training window before a test\
      \ window\n        is applied.\n\n    Returns\n    -------\n    Dict[str, Any]\n\
      \        Dictionary containing the seven configuration fields specified in\n\
      \        `output_structure`.\n\n    Raises\n    ------\n    ValueError\n   \
      \     If any date string is not in ISO format or if `in_sample_end`\n      \
      \  precedes `in_sample_start`.\n    ValueError\n        If `montecarlo_min`\
      \ is greater than `montecarlo_max` or if any\n        window size in `walkforward_window_days`\
      \ is non‑positive.\n\n    Examples\n    --------\n    >>> config = set_backtest_parameters(\n\
      \    ...     in_sample_start='2020-01-01',\n    ...     in_sample_end='2021-12-31',\n\
      \    ...     out_sample_start='2022-01-01',\n    ...     out_sample_end='2022-12-31',\n\
      \    ...     montecarlo_min=1000,\n    ...     montecarlo_max=5000,\n    ...\
      \     walkforward_window_days=[90, 180, 360])\n    {'in_sample_start': '2020-01-01',\
      \ 'in_sample_end': '2021-12-31',\n    'out_sample_start': '2022-01-01', 'out_sample_end':\
      \ '2022-12-31',\n    'montecarlo_min': 1000, 'montecarlo_max': 5000, 'walkforward_window_days':\n\
      \    [90, 180, 360]}\n\n    >>> # Invalid example: in_sample_end before start\n\
      \    >>> set_backtest_parameters(\n    ...     in_sample_start='2021-01-01',\n\
      \    ...     in_sample_end='2020-12-31',\n    ...     out_sample_start='2021-01-01',\n\
      \    ...     out_sample_end='2021-12-31',\n    ...     montecarlo_min=500,\n\
      \    ...     montecarlo_max=2000,\n    ...     walkforward_window_days=[30,\
      \ 60])\n    ValueError: in_sample_end must be after in_sample_start\n\n    \"\
      \"\"\n    return SetBacktestParametersOutput(\n        in_sample_start=\"\"\
      ,\n        in_sample_end=\"\",\n        out_sample_start=\"\",\n        out_sample_end=\"\
      \",\n        montecarlo_min=0,\n        montecarlo_max=0,\n        walkforward_window_days=[],\n\
      \    )"
    name: set_backtest_parameters
    nodes_depended_on:
    - preprocess_data
    nodes_dependent_on: []
    output_structure:
    - description: Start date of the in-sample period (YYYY-MM-DD)
