dag_type: plain_text
description: Workflow that splits each of the two parallel tasks into two sequential
  phases while preserving the initial start split and combining final outputs.
name: simple_parallel_fanout_with_start_split_sequential_phases
nodes:
  finalize_step:
    agent: false
    description: Combine the outputs of the two parallel task sequences into a final
      summary.
    name: finalize_step
    nodes_depended_on:
    - parallel_one_phase_two
    - parallel_two_phase_two
    nodes_dependent_on: []
    prompt: Take the results from parallel_one_phase_two and parallel_two_phase_two
      and output a combined summary sentence.
  parallel_one_phase_one:
    agent: false
    description: First phase of the first parallel task; runs after all start parts
      are emitted.
    name: parallel_one_phase_one
    nodes_depended_on:
    - start_part_one
    - start_part_two
    - start_part_three
    nodes_dependent_on: []
    prompt: When inputs include "START" from all three start parts, output the result
      of task one as a short sentence (phase 1).
  parallel_one_phase_two:
    agent: false
    description: Second phase of the first parallel task; runs after phase one completes.
    name: parallel_one_phase_two
    nodes_depended_on:
    - parallel_one_phase_one
    nodes_dependent_on: []
    prompt: Take the output of phase one and refine it into a final short sentence
      for task one (phase 2).
  parallel_two_phase_one:
    agent: false
    description: First phase of the second parallel task; runs after all start parts
      are emitted.
    name: parallel_two_phase_one
    nodes_depended_on:
    - start_part_one
    - start_part_two
    - start_part_three
    nodes_dependent_on: []
    prompt: When inputs include "START" from all three start parts, output the result
      of task two as a short sentence (phase 1).
  parallel_two_phase_two:
    agent: false
    description: Second phase of the second parallel task; runs after phase one completes.
    name: parallel_two_phase_two
    nodes_depended_on:
    - parallel_two_phase_one
    nodes_dependent_on: []
    prompt: Take the output of phase one and refine it into a final short sentence
      for task two (phase 2).
  start_part_one:
    agent: false
    description: Emit the first part of the start token.
    name: start_part_one
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Output the token "START" as the first part of the start signal.
  start_part_three:
    agent: false
    description: Emit the third part of the start token.
    name: start_part_three
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Output the token "START" as the third part of the start signal.
  start_part_two:
    agent: false
    description: Emit the second part of the start token.
    name: start_part_two
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Output the token "START" as the second part of the start signal.
