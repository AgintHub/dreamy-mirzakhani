      conceptual_info: The `develop_entry_rules` node generates a set of quantitative
        conditions that trigger the opening of a trade.  It takes the selected strategy
        framework and the pre‑processed market data as inputs, then outputs a concise
        list of pseudo‑code expressions, their numeric parameters, human‑readable
        descriptions, and a validity flag that indicates whether the rules satisfy
        all internal consistency checks (e.g., no circular dependencies, all required
        indicators computed).
      docstring:
        examples:
        - lines:
          - entry_rules = develop_entry_rules(
          - '    strategy_methodology=''rule-based'','
          - '    preprocessed_data_meta={''indicators'': [''EMA20'', ''EMA50'', ''ATR'',
            ''StdDev2'']})'
          output: "{\n  'entry_conditions': [\n    'EMA20 > EMA50',\n    'Close >\
            \ EMA20 + 2 * ATR',\n    'StdDev2 > 1.5'\n  ],\n  'parameter_values':\
            \ [20.0, 50.0, 2.0, 1.5],\n  'condition_descriptions': [\n    'Short‑term\
            \ EMA crossing above long‑term EMA',\n    'Price breaks above two‑ATR\
            \ volatility breakout',\n    'Standard deviation exceeds 1.5 standard\
            \ deviations'\n  ],\n  'is_valid': True\n}"
        - lines:
          - entry_rules = develop_entry_rules(
          - '    strategy_methodology=''machine-learning'','
          - '    preprocessed_data_meta={''indicators'': [''EMA20'']})'
          output: 'ValueError: Unsupported strategy_methodology ''machine-learning''
            for entry rule generation.'
        parameters:
        - description: Chosen strategy framework from `choose_strategy_approach`;
            one of 'rule-based', 'machine-learning', or 'hybrid'.  Only 'rule-based'
            and 'hybrid' are supported for explicit pseudo‑code generation.
          name: strategy_methodology
          type: str
        - description: Metadata dictionary returned by `preprocess_data` indicating
            available indicators, asset count, and time steps.  The function uses
            this to validate that required inputs (e.g., EMA, ATR) exist.
          name: preprocessed_data_meta
          type: dict
        raises:
        - description: If `strategy_methodology` is not supported or required indicators
            are missing from `preprocessed_data_meta`.
          type: ValueError
        - description: If input types do not match the expected signatures.
          type: TypeError
        returns:
          description: 'Dictionary with keys:

            - `entry_conditions`: List[str]

            - `parameter_values`: List[float]

            - `condition_descriptions`: List[str]

            - `is_valid`: bool'
          type: dict
        summary: Generate a list of entry conditions, parameters, descriptions, and
          a validity flag for a rule‑based trading strategy.
    prompt: Design 3-5 quantitative entry conditions (e.g. 50-period EMA crossover,
