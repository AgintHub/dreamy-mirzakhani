    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - write_chapter_6
    - write_chapter_7
    - write_chapter_8
    - write_chapter_9
    - write_chapter_10
    - write_chapter_11
    - write_chapter_12
    nodes_dependent_on:
    - edit_and_refine_draft
    prompt: Assemble the introduction and chapters into a single document, ensuring
      a logical flow.
  create_figures_for_chapter_1:
    agent: false
    description: Generate Chapter 1 figures.
    name: create_figures_for_chapter_1
    nodes_depended_on:
    - write_chapter_1
    nodes_dependent_on:
    - edit_and_refine_draft
    prompt: Create relevant figures and diagrams to illustrate key concepts in the
      first chapter.
