dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: List of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: List of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: List of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: List of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: Identifies interface-level issues in integration tests.
      docstring:
        examples:
        - lines:
          - integration_test_results = [...]
          output: interface_failure_details = analyze_integration_test_results(integration_test_results)
        - lines:
          - integration_test_results = [...]
          output: 'interface_failure_details = {''interface_failures'': ..., ''component_pairs'':
            ..., ''data_exchange_issues'': ..., ''contract_violations'': ...}'
        parameters:
        - description: Integration test results with component pairs, data exchange
            details, and contract violations.
          name: integration_test_results
          type: List[dict]
        raises:
        - description: Raised if integration test results are invalid or missing.
          type: ValueError
        returns:
          description: A dictionary containing interface failure descriptions, component
            pairs, data exchange issues, and contract violations.
          type: dict
        summary: Analyzes integration test results to report interface failures.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks.
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies.
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions.
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value.
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered.
      key: regression_summary
      type: str
    prd:
      conceptual_info: The node identifies regression risks from regression test results.
      docstring:
        examples:
        - lines:
          - 'regression_results = {''feature_name'': ''Feature1'', ''before_after_state_comparison'':
            ''Before: passed, After: failed'', ''impact_severity_estimation'': 5}'
          - analyze_regression_test_results(regression_results)
          - '{''feature_name'': ''Feature1'', ''before_after_state_comparison'': ''Before:
            passed, After: failed'', ''impact_severity_estimation'': 5, ''regression_summary'':
            ''Feature1 regression issue: before passed, after failed''}'
          output: '''{''feature_name'': ''Feature1'', ''before_after_state_comparison'':
            ''Before: passed, After: failed'', ''impact_severity_estimation'': 5,
            ''regression_summary'': ''Feature1 regression issue: before passed, after
            failed''}'''
        parameters:
        - description: Dictionary of regression test results containing feature_name,
            before_after_state_comparison, and impact_severity_estimation keys.
          name: regression_results
          type: dict
        raises:
        - description: If required keys are missing in the regression_results dictionary.
          type: KeyError
        returns:
          description: Dictionary containing feature_name, before_after_state_comparison,
            impact_severity_estimation, and regression_summary keys.
          type: dict
        summary: This node analyzes regression test results to identify potential
          risks.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Identify unit-level anomalies
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: The name of the test case that failed
      key: test_case_name
      type: str
    - description: The actual output of the test case that failed
      key: actual_output
      type: str
    - description: A suggested root cause of the failure from an implementation perspective
      key: suggested_root_cause
      type: str
    - description: The type of test that failed
      key: test_type
      type: str
    - description: A list of test cases that passed
      key: passed_tests
      type: str
    - description: A list of test cases that failed
      key: failed_tests
      type: str
    prd:
      conceptual_info: Analyzing unit test results to identify anomalies and provide
        a suggested root cause.
      docstring:
        examples:
        - lines:
          - '{'
          - '    ''test_case_name'': [''test1'', ''test2''],'
          - '    ''actual_output'': [''output1'', ''output2''],'
          - '    ''suggested_root_cause'': [''cause1'', ''cause2''],'
          - '    ''test_type'': [''type1'', ''type2''],'
          - '    ''passed_tests'': [''passed_test1'', ''passed_test2''],'
          - '    ''failed_tests'': [''failed_test1'', ''failed_test2'']'
          - '}'
          - analyze_unit_test_results(run_unit_tests_output)
          output: "{\n    'test_case_name': ['test1', 'test2'],\n    'actual_output':\
            \ ['output1', 'output2'],\n    'suggested_root_cause': ['cause1', 'cause2'],\n\
            \    'test_type': ['type1', 'type2'],\n    'passed_tests': ['passed_test1',\
            \ 'passed_test2'],\n    'failed_tests': ['failed_test1', 'failed_test2']\n\
            }"
        parameters:
        - description: Output of the run_unit_tests node
          name: run_unit_tests_output
          type: dict
        raises:
        - description: If the run_unit_tests_output is invalid or empty
          type: ValueError
        returns:
          description: A dictionary containing test case names, actual outputs, suggested
            root causes, test types, passed tests, and failed tests
          type: dict
        summary: Analyze unit test results to identify anomalies and provide a suggested
          root cause.
    prompt: 'List all test failures with: 1) Test case name, 2) Actual output, 3)
      Suggested root cause from implementation perspective.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: This node creates regression test cases for unchanged features
        validation, focusing on high-risk features with precondition setup and expected
        state preservation.
      docstring:
        examples:
        - lines:
          - test_objectives = ['user_friendly_ui', 'performance_optimization', 'mobile_device_compatibility']
          - core_functionality_requirements = ['login_system', 'password_recovery',
            'two_factor_authenticatio']
          - edge_case_requirements = ['invalid_credentials', 'slow_network_connection',
            'old_browser_support']
          - performance_requirements = ['responsiveness', 'page_load_speed', 'query_time']
          - environmental_requirements = ['latest_browser_versions', 'device_emulators',
            'virtualization']
          - design_regression_test_cases(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements, environmental_requirements)
          output: '{high_risk_features: [login_system, password_recovery, two_factor_authentication],
            precondition_setup: [Invalid credentials: enter incorrect username and
            password., Slow network connection: simulate 10KB/s download speed., Old
            browser support: use Internet Explorer 7.], expected_state_preservation:
            [The system should prevent login attempts with invalid credentials., The
            system should adapt to slow network connections without freezing., The
            system should provide a consistent experience across all supported browsers.]}'
        - lines:
          - test_objectives = ['enhance_usability', 'increase_conversion_rate', 'streamline_process']
          - core_functionality_requirements = ['shopping_cart', 'check_out_process',
            'product_reviews']
          - edge_case_requirements = ['new_user_experience', 'existing_user_login',
            ' guest_checkout']
          - performance_requirements = ['click_through_speed', 'product_info_load_time',
            'order_summary_rendering_time']
          - environmental_requirements = ['responsive_design', 'touchscreen_support',
            'voice_assistance']
          - design_regression_test_cases(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements, environmental_requirements)
          output: '{high_risk_features: [shopping_cart, check_out_process, product_reviews],
            precondition_setup: [New user experience: start with a blank slate., Existing
            user login: simulate login using username and password., Guest checkout:
            don''t store any customer information.], expected_state_preservation:
            [The system should handle incomplete purchases without displaying errors.,
            The system should maintain a seamless check-out process across various
            devices., The system should adhere to web accessibility standards for
            visually impaired users.]}'
        parameters:
        - description: List of high-level test objectives for the software under test.
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements.
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements.
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements.
          name: performance_requirements
          type: List[str]
        - description: List of environmental requirements for testing.
          name: environmental_requirements
          type: List[str]
        raises:
        - description: If the input parameters are invalid or inconsistent.
          type: ValueError
        returns:
          description: A dictionary containing high-risk features, precondition setup,
            and expected state preservation for each regression test scenario.
          type: Dict[str, List[str]]
        summary: Design regression test cases for unchanged features validation.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the test case
      key: test_id
      type: str
    - description: List of input parameters required for the test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for the test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: Design unit test cases by creating templates for each test
        case based on the input parameters and expected output.
      docstring:
        examples:
        - lines:
          - test_id = 'test01'
          - input_parameters = ['param1', 'param2']
          - expected_output = ['output1', 'output2']
          output: '{''test_id'': ''test01'', ''input_parameters'': [''param1'', ''param2''],
            ''expected_output'': [''output1'', ''output2'']}'
        - lines:
          - test_id = 'test02'
          - input_parameters = ['param3', 'param4']
          - expected_output = ['output3', 'output4']
          output: '{''test_id'': ''test02'', ''input_parameters'': [''param3'', ''param4''],
            ''expected_output'': [''output3'', ''output4'']}'
        parameters:
        - description: Output of the plan_test_scope node containing test objectives,
            core functionality requirements, edge case requirements, and performance
            requirements.
          name: plan_test_scope
          type: object
        raises:
        - description: If the input parameters are invalid or missing.
          type: ValueError
        returns:
          description: A dictionary containing unit test case templates with test
            ID, input parameters, and expected output.
          type: dict
        summary: Generate unit test case templates based on input parameters and expected
          output.
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: Generate a comprehensive test report based on the results from
        defect analysis and other factors.
      docstring:
        examples:
        - lines:
          - defect_results = report_defects(analyze_unit_test_results, analyze_integration_test_results,
            analyze_regression_test_results)
          - test_summary = generate_test_report(defect_results)
          output: '{''total_tests_executed'': 100, ''pass_count'': 95, ''defect_density'':
            0.05, ''risk_assessment_rating'': 8}'
        - lines:
          - 'test_summary = generate_test_report({''total_tests_executed'': 50, ''pass_count'':
            45, ''defect_density'': 0.03, ''risk_assessment_rating'': 6})'
          output: '{''total_tests_executed'': 50, ''pass_count'': 45, ''defect_density'':
            0.03, ''risk_assessment_rating'': 6}'
        parameters:
        - description: Results from defect analysis
          name: defect_results
          type: report_defects
        raises:
        - description: If input data is missing or invalid
          type: ValueError
        returns:
          description: 'Test summary with metrics: total tests executed, pass/fail
            counts, defect density, and risk assessment rating (1-10)'
          type: dict
        summary: Compile test results summary
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: This node is responsible for defining the test objectives and
        coverage requirements of the software under test.
      docstring:
        examples:
        - lines:
          - 'def plan_test_scope():'
          - '    test_objectives = [''Test core functionality'', ''Test edge cases'',
            ''Test performance'']'
          - '    core_functionality_requirements = [''Req 1'', ''Req 2'', ''Req 3'']'
          - '    edge_case_requirements = [''Edge Case 1'', ''Edge Case 2'', ''Edge
            Case 3'']'
          - '    performance_requirements = [''Perf Req 1'', ''Perf Req 2'', ''Perf
            Req 3'']'
          - '    return {''test_objectives'': test_objectives, ''core_functionality_requirements'':
            \

            core_functionality_requirements, ''edge_case_requirements'': edge_case_requirements,
            \

            ''performance_requirements'': performance_requirements}'
          output: '{''test_objectives'': [''Test core functionality'', ''Test edge
            cases'', ''Test performance''], ''core_functionality_requirements'': [''Req
            1'', ''Req 2'', ''Req 3''], ''edge_case_requirements'': [''Edge Case 1'',
            ''Edge Case 2'', ''Edge Case 3''], ''performance_requirements'': [''Perf
            Req 1'', ''Perf Req 2'', ''Perf Req 3'']}'
        - lines:
          - 'def plan_test_scope():'
          - '    test_objectives = [''Test core functionality'', ''Test edge cases'',
            ''Test performance'', ''Test security'']'
          - '    core_functionality_requirements = [''Req 1'', ''Req 2'', ''Req 3'',
            ''Req 4'']'
          - '    edge_case_requirements = [''Edge Case 1'', ''Edge Case 2'', ''Edge
            Case 3'', ''Edge Case 4'']'
          - '    performance_requirements = [''Perf Req 1'', ''Perf Req 2'', ''Perf
            Req 3'', ''Perf Req 4'']'
          - '    return {''test_objectives'': test_objectives, ''core_functionality_requirements'':
            \

            core_functionality_requirements, ''edge_case_requirements'': edge_case_requirements,
            \

            ''performance_requirements'': performance_requirements}'
          output: '{''test_objectives'': [''Test core functionality'', ''Test edge
            cases'', ''Test performance'', ''Test security''], ''core_functionality_requirements'':
            [''Req 1'', ''Req 2'', ''Req 3'', ''Req 4''], ''edge_case_requirements'':
            [''Edge Case 1'', ''Edge Case 2'', ''Edge Case 3'', ''Edge Case 4''],
            ''performance_requirements'': [''Perf Req 1'', ''Perf Req 2'', ''Perf
            Req 3'', ''Perf Req 4'']}'
        parameters: []
        raises: []
        returns:
          description: A dictionary containing the test objectives, core functionality
            requirements, edge case requirements, and performance requirements
          type: dict
        summary: Define test objectives and coverage requirements
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario
      key: test_scenario_ids
      type: List[str]
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: Execute unchanged feature validation by running regression scenarios
      and recording baseline vs actual results, state drift indicators, and performance
      metrics
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of baseline vs actual results
      key: baseline_vs_actual_results
      type: List[str]
    - description: List of state drift indicators
      key: state_drift_indicators
      type: List[str]
    - description: List of performance metrics
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: The run_regression_tests node executes unchanged feature validation
        by running regression scenarios and recording baseline vs actual results,
        state drift indicators, and performance metrics.
      docstring:
        examples:
        - lines:
          - design_regression_test_cases = [
          - '{''high_risk_features'': ''Feature A'', ''precondition_setup'': ''Setup
            A'', ''expected_state_preservation'': ''Expected State A''}'
          - ']'
          output: '{''baseline_vs_actual_results'': [''Baseline vs Actual Result A''],
            ''state_drift_indicators'': [''State Drift Indicator A''], ''performance_metrics'':
            [''Performance Metric A'']}'
        - lines:
          - setup_test_environment = [
          - '{''hardware_specs'': ''Hardware Spec 1'', ''software_specs'': ''Software
            Spec 1'', ''test_data_sets'': ''Test Data Set 1'', ''mock_services'':
            ''Mock Service 1''}'
          - ']'
          output: '{''baseline_vs_actual_results'': [''Baseline vs Actual Result B''],
            ''state_drift_indicators'': [''State Drift Indicator B''], ''performance_metrics'':
            [''Performance Metric B'']}'
        parameters:
        - description: A list of regression test scenarios targeting high-risk features
            with precondition setup and expected state preservation.
          name: design_regression_test_cases
          type: List[str]
        - description: A list of environment requirements, including hardware, software
            specs, test data sets, and mock services needed for testing.
          name: setup_test_environment
          type: List[str]
        raises: []
        returns:
          description: A dictionary containing the list of baseline vs actual results,
            state drift indicators, and performance metrics.
          type: Dict[str, Any]
        summary: Execute regression scenarios and record results.
    prompt: Execute regression scenarios and record results
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: List[bool]
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: List[str]
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: List[str]
    prd:
      conceptual_info: Execute module-level test cases and record pass/fail status,
        actual vs expected output, and timestamps.
      docstring:
        examples:
        - lines:
          - 'design_unit_test_cases = {''test_id'': ''test1'', ''input_parameters'':
            [''param1'', ''param2''], ''expected_output'': [''output1'', ''output2'']}'
          - 'setup_test_environment = {''hardware_specs'': [''spec1'', ''spec2''],
            ''software_specs'': [''spec3'', ''spec4''], ''test_data_sets'': [''set1'',
            ''set2''], ''mock_services'': [''service1'', ''service2'']}'
          - result = run_unit_tests(design_unit_test_cases, setup_test_environment)
          output: '{''test_execution_status'': [True, False], ''actual_output_vs_expected_output'':
            [''match'', ''mismatch''], ''test_case_timestamps'': [''2022-01-01 12:00:00'',
            ''2022-01-01 12:01:00'']}'
        - lines:
          - 'design_unit_test_cases = {''test_id'': ''test3'', ''input_parameters'':
            [''param3'', ''param4''], ''expected_output'': [''output3'', ''output4'']}'
          - 'setup_test_environment = {''hardware_specs'': [''spec5'', ''spec6''],
            ''software_specs'': [''spec7'', ''spec8''], ''test_data_sets'': [''set3'',
            ''set4''], ''mock_services'': [''service3'', ''service4'']}'
          - result = run_unit_tests(design_unit_test_cases, setup_test_environment)
          output: '{''test_execution_status'': [True, True], ''actual_output_vs_expected_output'':
            [''match'', ''match''], ''test_case_timestamps'': [''2022-01-01 12:02:00'',
            ''2022-01-01 12:03:00'']}'
        parameters:
        - description: Test case templates with test ID, input parameters, and expected
            output.
          name: design_unit_test_cases
          type: dict
        - description: Environment requirements with hardware/software specs, test
            data sets, and mock services.
          name: setup_test_environment
          type: dict
        raises:
        - description: Raised when test execution fails or test case templates are
            invalid.
          type: Exception
        returns:
          description: A dictionary containing test execution status, actual output
            vs expected output, and timestamps.
          type: dict
        summary: Run unit tests and record test execution status, actual output vs
          expected output, and timestamps.
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing
      key: software_specs
