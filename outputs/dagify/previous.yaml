dag_type: plain_text
description: A workflow for testing a task
name: test_workflow
nodes:
  task_decomposition:
    agent: false
    description: Decompose the task into more manageable sub-tasks.
    name: task_decomposition
    nodes_depended_on:
    - task_description_extraction
    nodes_dependent_on: []
    prompt: Break down the task into smaller, more manageable sub-tasks. Prioritize
      these sub-tasks based on importance and complexity.
  task_description_extraction:
    agent: false
    description: Extract the core task description.
    name: task_description_extraction
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Extract the main objective of the task. Remove any extraneous information
      and focus on the core task description.
  task_planning:
    agent: false
    description: Create a plan of action for each sub-task.
    name: task_planning
    nodes_depended_on:
    - task_decomposition
    nodes_dependent_on: []
    prompt: Create a detailed plan of action for each sub-task. Determine the necessary
      resources and allocate time for each task.
  test_workflow_execution:
    agent: false
    description: Test the workflow.
    name: test_workflow_execution
    nodes_depended_on:
    - task_planning
    nodes_dependent_on: []
    prompt: Execute each step of the test workflow. Verify that each step was completed
      successfully and document any findings or issues.
