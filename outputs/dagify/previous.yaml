dag_type: plain_text
description: A step‑by‑step plan to create a hedge fund, covering strategy, legal
  setup, compliance, operations, financing, and launch.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Choose the high‑level investment strategy.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - define_asset_universe
    - set_performance_and_risk_targets
    - draft_pitch_deck_outline
    prompt: Select one primary hedge fund strategy category that best serves the fund
      objectives (e.g., long/short equity, global macro). Provide a one‑sentence rationale.
  choose_legal_entity_type:
    agent: false
    description: Select the legal structure for the fund.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on:
    - identify_regulatory_requirements
    - list_service_providers
    - outline_governance_structure
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Give a one‑sentence explanation.
  clarify_fund_objectives:
    agent: false
    description: Generate a bullet‑point list of the hedge fund’s core objectives.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - choose_investment_strategy
    - select_jurisdiction
    - define_investor_profile
    - compile_pitch_deck_outline
    - outline_governance_structure
    prompt: State the primary business objectives for launching the hedge fund. Provide
      a concise bullet list covering investment purpose, competitive edge, and long‑term
      vision (max 8 bullets).
  define_asset_universe:
    agent: false
    description: Specify tradable assets.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - draft_operations_workflow
    prompt: List the specific asset classes and instruments the chosen strategy will
      trade (e.g., US large‑cap equities, S&P futures). Keep list ≤10 items.
  define_investor_profile:
    agent: false
    description: Describe the target investor segment.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: 'Based on the stated fund objectives, specify the ideal target investor
      profile (e.g., family offices, pensions). List key characteristics: typical
      ticket size, risk tolerance, liquidity preference, geographic focus.'
  design_risk_management_framework:
    agent: false
    description: Outline quantitative and qualitative risk controls.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on:
    - draft_operations_workflow
    - design_compliance_program
    prompt: 'List core risk controls aligned with the target metrics: position limits,
      VaR limits, stop‑loss rules, liquidity thresholds. Provide 4–6 bullet points.'
  estimate_setup_and_operating_costs:
    agent: false
    description: Rough cost model for fund setup and operations.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on:
    - draft_fee_structure
    prompt: 'Provide a simple annual cost estimate (in USD) for each listed service
      provider plus overhead (office, tech). Present as two columns: Cost Item | Estimated
      USD.'
  identify_regulatory_requirements:
    agent: false
    description: Outline key regulatory filings.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - design_compliance_program
    - list_service_providers
    prompt: List the primary registrations or filings required for the selected entity
      and jurisdiction (e.g., SEC Form ADV). Provide citation to governing body names
      only.
  list_service_providers:
    agent: false
    description: Enumerate required third‑party service providers.
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - estimate_setup_and_operating_costs
    - draft_operations_workflow
    - design_compliance_program
    prompt: 'Generate a checklist of mandatory external service providers: prime broker,
      fund administrator, auditor, legal counsel, compliance consultant, custodian.
      No descriptive text—just provider types.'
  select_jurisdiction:
    agent: false
    description: Pick the fund domicile.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - choose_legal_entity_type
    - identify_regulatory_requirements
    - list_service_providers
    - outline_governance_structure
    prompt: Choose the optimal fund domicile (e.g., Cayman, Delaware, Luxembourg)
      considering objectives. Provide 2 pros and 2 cons for the selected jurisdiction
      only.
  set_performance_and_risk_targets:
    agent: false
    description: Quantify return and risk goals.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - draft_fee_structure
    - design_risk_management_framework
    - compile_pitch_deck_outline
    prompt: Define numerical annual targets for gross return, volatility (standard
      deviation), Sharpe ratio, and maximum drawdown consistent with the chosen strategy.
      Present as a 4‑row table.
