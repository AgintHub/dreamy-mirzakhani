dag_type: plain_text
description: Creates a detailed, step-by-step foundational plan for building a hedge
  fund, from defining objectives through compiling the final launch blueprint.
name: build_hedge_fund
nodes:
  choose_fund_objectives:
    agent: false
    description: Clarify the hedge fund's core objectives.
    name: choose_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List primary business objectives for launching the hedge fund. Produce
      a concise bullet list covering investment purpose, competitive edge, and long-term
      vision (max 8 bullets). Focus only on objectives, do not include strategy details.
  choose_jurisdiction:
    agent: false
    description: Pick fund domicile and note rationale.
    name: choose_jurisdiction
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Choose the optimal fund domicile (e.g., Cayman, Delaware, Luxembourg)
      considering objectives. Provide 2 pros and 2 cons for the selected jurisdiction
      only.
  clarify_fund_investment_strategy:
    agent: false
    description: Identify the high-level investment strategy category.
    name: clarify_fund_investment_strategy
    nodes_depended_on:
    - choose_fund_objectives
    nodes_dependent_on: []
    prompt: Select one primary hedge fund strategy category that best serves the fund
      objectives (e.g., long/short equity, global macro). Provide a one-sentence rationale.
  compile_investment_committee_description:
    agent: false
    description: Describe the hedge fund investment committee.
    name: compile_investment_committee_description
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Describe how the hedge fund investment committee will be structured and
      operate. Keep the description concise (≤ 100 words).
  design_risk_management_framework:
    agent: false
    description: Outline quantitative and qualitative risk controls.
    name: design_risk_management_framework
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Outline quantitative and qualitative risk controls. Describe the methods
      by which they will be implemented and monitored.
  develop_hedge_fund_brand_identity:
    agent: false
    description: Design and describe the hedge fund's brand identity.
    name: develop_hedge_fund_brand_identity
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Design and describe the hedge fund's brand identity with mission statement,
      values, and guiding principles.
  outline_governance_structure:
    agent: false
    description: Define internal governance roles and duties.
    name: outline_governance_structure
    nodes_depended_on:
    - select_legal_entity_type
    nodes_dependent_on: []
    prompt: 'Draft a simple governance chart: roles of GP, investment manager, board
      (if any). Limit to 5 roles with one-line duties each.'
  produce_final_fund_plan_summary:
    agent: false
    description: Compile the final fund plan summary.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: 'Summarize the hedge fund build-out in this concise document: Provide
      an executive summary, mission statement, brand identity and other pertinent
      items.'
  select_legal_entity_type:
    agent: false
    description: Identify legal structure for the fund vehicle.
    name: select_legal_entity_type
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Give a one-sentence explanation.
  select_service_providers:
    agent: false
    description: Enumerate required third-party service provider categories.
    name: select_service_providers
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the minimum third-party service provider categories required for
      fund management. Examples include but are not limited to prime broker, custodian,
      administrator, auditor and compliance consultant.
