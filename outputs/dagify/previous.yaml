nodes:
  analyze_backtest_results:
    agent: false
    code_node_type: stub
    description: Evaluate in‑sample backtest performance against predefined benchmarks,
      distill key drivers and infractions, and recommend actionable parameter tweaks.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ExecuteInSampleBacktestOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for execute_in_sample_backtest node outputs.\"\"\"\n    equity_curve_dates:\
      \ List[str] = (\n        Field(..., description=\"Sequential dates of the equity\
      \ curve in YYYY-MM-DD format\")\n    )\n    equity_curve_values: List[float]\
      \ = (\n        Field(..., description=\"Equity value for each date in the equity\
      \ curve\")\n    )\n    drawdown_series: List[float] = (\n        Field(...,\
      \ description=\"Cumulative drawdown percentage at each date in the equity curve\"\
      )\n    )\n    trade_ids: List[str] = (\n        Field(..., description=\"Unique\
      \ identifiers for each executed trade\")\n    )\n    trade_pnl: List[float]\
      \ = (\n        Field(..., description=\"Profit or loss for each trade\")\n \
      \   )\n    sharpe_ratio: float = (\n        Field(..., description=\"Annualized\
      \ Sharpe ratio of the backtest\")\n    )\n    max_drawdown: float = (\n    \
      \    Field(..., description=\"Maximum drawdown percentage observed during the\
      \ backtest\")\n    )\n    total_return: float = (\n        Field(..., description=\"\
      Total return percentage over the backtest period\")\n    )\n\n\nclass SetPerformanceBenchmarksOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_performance_benchmarks node outputs.\"\"\"\
      \n    cagr_target: float = (\n        Field(..., description=\"Target compound\
      \ annual growth rate in decimal form (e.g., 0.15 for 15%)\")\n    )\n    annual_volatility_constraint:\
      \ float = (\n        Field(..., description=\"Maximum acceptable annual volatility\
      \ in decimal form (e.g., 0.20 for 20%)\")\n    )\n    drawdown_limit: float\
      \ = (\n        Field(..., description=\"Maximum allowable drawdown expressed\
      \ as a decimal (e.g., 0.25 for 25%)\")\n    )\n    sharpe_ratio_goal: float\
      \ = (\n        Field(..., description=\"Target Sharpe ratio to be achieved by\
      \ the strategy\")\n    )\n\n\nclass AnalyzeBacktestResultsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_backtest_results node outputs.\"\"\"\n\
      \    performance_driver_1: str = (\n        Field(..., description=\"Name or\
      \ description of the largest performance driver\")\n    )\n    performance_driver_2:\
      \ str = (\n        Field(..., description=\"Name or description of the second\
      \ largest performance driver\")\n    )\n    performance_driver_3: str = (\n\
      \        Field(..., description=\"Name or description of the third largest performance\
      \ driver\")\n    )\n    constraint_violation_1: str = (\n        Field(...,\
      \ description=\"Description of the first major constraint violation\")\n   \
      \ )\n    constraint_violation_2: str = (\n        Field(..., description=\"\
      Description of the second major constraint violation\")\n    )\n    constraint_violation_3:\
      \ str = (\n        Field(..., description=\"Description of the third major constraint\
      \ violation\")\n    )\n    parameter_adjustment_1: str = (\n        Field(...,\
      \ description=\"First suggested parameter adjustment\")\n    )\n    parameter_adjustment_2:\
      \ str = (\n        Field(..., description=\"Second suggested parameter adjustment\"\
      )\n    )\n    parameter_adjustment_3: str = (\n        Field(..., description=\"\
      Third suggested parameter adjustment\")\n    )\n\n\ndef analyze_backtest_results(execute_in_sample_backtest_input:\
      \ ExecuteInSampleBacktestOutput, set_performance_benchmarks_input: SetPerformanceBenchmarksOutput,\
      \ **kwargs) -> AnalyzeBacktestResultsOutput:\n    \"\"\"\n    Analyze in‑sample\
      \ backtest results against performance benchmarks and return\n    top drivers,\
      \ constraint violations, and parameter adjustment\n    recommendations.\n\n\
      \    Parameters\n    ----------\n    equity_curve_dates : List[str]\n      \
      \  Sequential dates of the equity curve in YYYY‑MM‑DD format.\n    equity_curve_values\
      \ : List[float]\n        Equity value for each date in the equity curve.\n \
      \   drawdown_series : List[float]\n        Cumulative drawdown percentage at\
      \ each date.\n    trade_ids : List[str]\n        Unique identifiers for each\
      \ executed trade.\n    trade_pnl : List[float]\n        Profit or loss for each\
      \ trade.\n    sharpe_ratio : float\n        Annualized Sharpe ratio of the backtest.\n\
      \    max_drawdown : float\n        Maximum drawdown percentage observed during\
      \ the backtest.\n    total_return : float\n        Total return percentage over\
      \ the backtest period.\n    cagr_target : float\n        Target CAGR in decimal\
      \ form (e.g., 0.15 for 15%).\n    annual_volatility_constraint : float\n   \
      \     Maximum acceptable annual volatility in decimal form.\n    drawdown_limit\
      \ : float\n        Maximum allowable drawdown expressed as a decimal.\n    sharpe_ratio_goal\
      \ : float\n        Target Sharpe ratio to be achieved by the strategy.\n\n \
      \   Returns\n    -------\n    Dict[str, str]\n        Dictionary containing\
      \ the nine output fields specified in the node's\n        output structure.\n\
      \n    Raises\n    ------\n    ValueError\n        Raised if any required input\
      \ list is empty or contains mismatched\n        lengths.\n    RuntimeError\n\
      \        Raised if benchmark comparison fails due to inconsistent data types.\n\
      \n    Examples\n    --------\n    >>> result = analyze_backtest_results(\n \
      \   ...     equity_curve_dates=['2020-01-01', '2020-01-02', '2020-01-03'],\n\
      \    ...     equity_curve_values=[100000, 102000, 101500],\n    ...     drawdown_series=[0.0,\
      \ 0.0, -0.0025],\n    ...     trade_ids=['T1', 'T2'],\n    ...     trade_pnl=[2000,\
      \ -500],\n    ...     sharpe_ratio=1.5,\n    ...     max_drawdown=0.025,\n \
      \   ...     total_return=0.015,\n    ...     cagr_target=0.12,\n    ...    \
      \ annual_volatility_constraint=0.18,\n    ...     drawdown_limit=0.20,\n   \
      \ ...     sharpe_ratio_goal=1.4)\n    >>> print(result['performance_driver_1'])\n\
      \    \"Positive correlation with S&P 500\"\n\n    >>> result = analyze_backtest_results(\n\
      \    ...     equity_curve_dates=['2020-01-01', '2020-01-02'],\n    ...     equity_curve_values=[100000,\
      \ 99000],\n    ...     drawdown_series=[0.0, -0.01],\n    ...     trade_ids=['T1'],\n\
      \    ...     trade_pnl=[-1000],\n    ...     sharpe_ratio=0.8,\n    ...    \
      \ max_drawdown=0.01,\n    ...     total_return=-0.01,\n    ...     cagr_target=0.10,\n\
      \    ...     annual_volatility_constraint=0.15,\n    ...     drawdown_limit=0.10,\n\
      \    ...     sharpe_ratio_goal=1.0)\n    >>> print(result['constraint_violation_1'])\n\
      \    \"Sharpe ratio below target\"\n\n    \"\"\"\n    return AnalyzeBacktestResultsOutput(\n\
      \        performance_driver_1=\"\",\n        performance_driver_2=\"\",\n  \
      \      performance_driver_3=\"\",\n        constraint_violation_1=\"\",\n  \
      \      constraint_violation_2=\"\",\n        constraint_violation_3=\"\",\n\
      \        parameter_adjustment_1=\"\",\n        parameter_adjustment_2=\"\",\n\
      \        parameter_adjustment_3=\"\",\n    )"
    name: analyze_backtest_results
    nodes_depended_on:
    - execute_in_sample_backtest
    - set_performance_benchmarks
    nodes_dependent_on: []
    output_structure:
    - description: Name or description of the largest performance driver
      key: performance_driver_1
      type: str
    - description: Name or description of the second largest performance driver
      key: performance_driver_2
      type: str
    - description: Name or description of the third largest performance driver
      key: performance_driver_3
      type: str
    - description: Description of the first major constraint violation
      key: constraint_violation_1
      type: str
    - description: Description of the second major constraint violation
      key: constraint_violation_2
      type: str
    - description: Description of the third major constraint violation
      key: constraint_violation_3
      type: str
    - description: First suggested parameter adjustment
      key: parameter_adjustment_1
      type: str
    - description: Second suggested parameter adjustment
      key: parameter_adjustment_2
      type: str
    - description: Third suggested parameter adjustment
      key: parameter_adjustment_3
      type: str
    prd:
      conceptual_info: The node aggregates quantitative backtest outcomes and benchmark
        definitions to surface actionable insights. It transforms raw equity curves,
        trade‑level PnL, and risk metrics into concise, human‑readable summaries that
        highlight performance levers and compliance breaches.
      docstring:
        examples:
        - lines:
          - result = analyze_backtest_results(
          - '    equity_curve_dates=[''2020-01-01'', ''2020-01-02'', ''2020-01-03''],'
          - '    equity_curve_values=[100000, 102000, 101500],'
          - '    drawdown_series=[0.0, 0.0, -0.0025],'
          - '    trade_ids=[''T1'', ''T2''],'
          - '    trade_pnl=[2000, -500],'
          - '    sharpe_ratio=1.5,'
          - '    max_drawdown=0.025,'
          - '    total_return=0.015,'
          - '    cagr_target=0.12,'
          - '    annual_volatility_constraint=0.18,'
          - '    drawdown_limit=0.20,'
          - '    sharpe_ratio_goal=1.4)'
          - print(result['performance_driver_1'])
          output: '"Positive correlation with S&P 500"'
        - lines:
          - result = analyze_backtest_results(
          - '    equity_curve_dates=[''2020-01-01'', ''2020-01-02''],'
          - '    equity_curve_values=[100000, 99000],'
          - '    drawdown_series=[0.0, -0.01],'
          - '    trade_ids=[''T1''],'
          - '    trade_pnl=[-1000],'
          - '    sharpe_ratio=0.8,'
          - '    max_drawdown=0.01,'
          - '    total_return=-0.01,'
          - '    cagr_target=0.10,'
          - '    annual_volatility_constraint=0.15,'
          - '    drawdown_limit=0.10,'
          - '    sharpe_ratio_goal=1.0)'
          - print(result['constraint_violation_1'])
          output: '"Sharpe ratio below target"'
        parameters:
        - description: Sequential dates of the equity curve in YYYY‑MM‑DD format.
          name: equity_curve_dates
          type: List[str]
        - description: Equity value for each date in the equity curve.
          name: equity_curve_values
          type: List[float]
        - description: Cumulative drawdown percentage at each date.
          name: drawdown_series
          type: List[float]
        - description: Unique identifiers for each executed trade.
          name: trade_ids
          type: List[str]
        - description: Profit or loss for each trade.
          name: trade_pnl
          type: List[float]
        - description: Annualized Sharpe ratio of the backtest.
          name: sharpe_ratio
          type: float
        - description: Maximum drawdown percentage observed during the backtest.
          name: max_drawdown
          type: float
        - description: Total return percentage over the backtest period.
          name: total_return
          type: float
        - description: Target CAGR in decimal form (e.g., 0.15 for 15%).
          name: cagr_target
          type: float
        - description: Maximum acceptable annual volatility in decimal form.
          name: annual_volatility_constraint
          type: float
        - description: Maximum allowable drawdown expressed as a decimal.
          name: drawdown_limit
          type: float
        - description: Target Sharpe ratio to be achieved by the strategy.
          name: sharpe_ratio_goal
          type: float
        raises:
        - description: Raised if any required input list is empty or contains mismatched
            lengths.
          type: ValueError
        - description: Raised if benchmark comparison fails due to inconsistent data
            types.
          type: RuntimeError
        returns:
          description: Dictionary containing the nine output fields specified in the
            node's output structure.
          type: Dict[str, str]
        summary: Analyze in‑sample backtest results against performance benchmarks
          and return top drivers, constraint violations, and parameter adjustment
          recommendations.
    prompt: Compare backtest results to performance metrics. Identify 3 biggest performance
      drivers and 3 major constraint violations. Suggest parameter adjustments in
      bullet list.
    shims: []
  build_risk_rules:
    agent: false
    code_node_type: stub
    description: Create portfolio-level risk controls
    implementation: "from pydantic import BaseModel, Field\n\n\nclass SetPerformanceBenchmarksOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_performance_benchmarks node outputs.\"\"\"\
      \n    cagr_target: float = (\n        Field(..., description=\"Target compound\
      \ annual growth rate in decimal form (e.g., 0.15 for 15%)\")\n    )\n    annual_volatility_constraint:\
      \ float = (\n        Field(..., description=\"Maximum acceptable annual volatility\
      \ in decimal form (e.g., 0.20 for 20%)\")\n    )\n    drawdown_limit: float\
      \ = (\n        Field(..., description=\"Maximum allowable drawdown expressed\
      \ as a decimal (e.g., 0.25 for 25%)\")\n    )\n    sharpe_ratio_goal: float\
      \ = (\n        Field(..., description=\"Target Sharpe ratio to be achieved by\
      \ the strategy\")\n    )\n\n\nclass BuildRiskRulesOutput(BaseModel):\n    \"\
      \"\"Pydantic model for build_risk_rules node outputs.\"\"\"\n    portfolio_volatility_limit:\
      \ float = (\n        Field(..., description=\"The maximum allowed portfolio\
      \ volatility\")\n    )\n    sector_concentration_limit: float = (\n        Field(...,\
      \ description=\"The maximum allowed sector concentration\")\n    )\n    drawdown_trigger_limit:\
      \ float = (\n        Field(..., description=\"The maximum allowed drawdown trigger\"\
      )\n    )\n    position_correlation_limit: float = (\n        Field(..., description=\"\
      The maximum allowed position correlation\")\n    )\n    risk_limit_rules: str\
      \ = (\n        Field(..., description=\"List of risk limit rules with their\
      \ thresholds\")\n    )\n\n\ndef build_risk_rules(set_performance_benchmarks_input:\
      \ SetPerformanceBenchmarksOutput, **kwargs) -> BuildRiskRulesOutput:\n    \"\
      \"\"\n    Builds portfolio-level risk controls based on given risk limit rules\
      \ and\n    thresholds.\n\n    Parameters\n    ----------\n    performance_benchmarks\
      \ : dict\n        Performance benchmarks output from 'set_performance_benchmarks'\
      \ node\n    risk_limit_rules_input : dict\n        Input dictionary containing\
      \ risk limit rules and their thresholds\n\n    Returns\n    -------\n    dict\n\
      \        A dictionary containing the portfolio volatility limit, sector\n  \
      \      concentration limit, drawdown trigger limit, position correlation\n \
      \       limit, and a list of risk limit rules with their thresholds\n\n    Raises\n\
      \    ------\n    ValueError\n        If the input dictionary is empty or missing\
      \ required keys\n    TypeError\n        If the input dictionary values are not\
      \ of the correct type\n\n    Examples\n    --------\n    >>> performance_benchmarks\
      \ = {'cagr_target': 0.15,\n    'annual_volatility_constraint': 0.20, 'drawdown_limit':\
      \ 0.25,\n    'sharpe_ratio_goal': 1.5}\n    >>> risk_limit_rules_input = {'portfolio_volatility':\
      \ 0.10,\n    'sector_concentration': 0.30, 'drawdown_trigger': 0.20,\n    'position_correlation':\
      \ 0.50}\n    >>> risk_limits = build_risk_rules(performance_benchmarks,\n  \
      \  risk_limit_rules_input)\n    {'portfolio_volatility_limit': 0.10, 'sector_concentration_limit':\
      \ 0.30,\n    'drawdown_trigger_limit': 0.20, 'position_correlation_limit': 0.50,\n\
      \    'risk_limit_rules': ['portfolio_volatility: 0.10', 'sector_concentration:\n\
      \    0.30', 'drawdown_trigger: 0.20', 'position_correlation: 0.50']}\n\n   \
      \ \"\"\"\n    return BuildRiskRulesOutput(\n        portfolio_volatility_limit=0.0,\n\
      \        sector_concentration_limit=0.0,\n        drawdown_trigger_limit=0.0,\n\
      \        position_correlation_limit=0.0,\n        risk_limit_rules=\"\",\n \
      \   )"
    name: build_risk_rules
    nodes_depended_on:
    - set_performance_benchmarks
    nodes_dependent_on: []
    output_structure:
    - description: The maximum allowed portfolio volatility
      key: portfolio_volatility_limit
      type: float
    - description: The maximum allowed sector concentration
      key: sector_concentration_limit
      type: float
    - description: The maximum allowed drawdown trigger
      key: drawdown_trigger_limit
      type: float
    - description: The maximum allowed position correlation
      key: position_correlation_limit
      type: float
    - description: List of risk limit rules with their thresholds
      key: risk_limit_rules
      type: str
    prd:
      conceptual_info: This node creates a set of risk limit rules to control portfolio-level
        risks.
      docstring:
        examples:
        - lines:
          - 'performance_benchmarks = {''cagr_target'': 0.15, ''annual_volatility_constraint'':
            0.20, ''drawdown_limit'': 0.25, ''sharpe_ratio_goal'': 1.5}'
          - 'risk_limit_rules_input = {''portfolio_volatility'': 0.10, ''sector_concentration'':
            0.30, ''drawdown_trigger'': 0.20, ''position_correlation'': 0.50}'
          - risk_limits = build_risk_rules(performance_benchmarks, risk_limit_rules_input)
          output: '{''portfolio_volatility_limit'': 0.10, ''sector_concentration_limit'':
            0.30, ''drawdown_trigger_limit'': 0.20, ''position_correlation_limit'':
            0.50, ''risk_limit_rules'': [''portfolio_volatility: 0.10'', ''sector_concentration:
            0.30'', ''drawdown_trigger: 0.20'', ''position_correlation: 0.50'']}'
        parameters:
        - description: Performance benchmarks output from 'set_performance_benchmarks'
            node
          name: performance_benchmarks
          type: dict
        - description: Input dictionary containing risk limit rules and their thresholds
          name: risk_limit_rules_input
          type: dict
        raises:
        - description: If the input dictionary is empty or missing required keys
          type: ValueError
        - description: If the input dictionary values are not of the correct type
          type: TypeError
        returns:
          description: A dictionary containing the portfolio volatility limit, sector
            concentration limit, drawdown trigger limit, position correlation limit,
            and a list of risk limit rules with their thresholds
          type: dict
        summary: Builds portfolio-level risk controls based on given risk limit rules
          and thresholds.
    prompt: 'Specify 4 risk limit rules with thresholds: portfolio volatility, sector
      concentration, drawdown trigger, position correlation. Format as key-value pairs
      with numerical limits.'
    shims: []
  calculate_position_sizing:
    agent: false
    code_node_type: stub
    description: Determine capital allocation logic
    implementation: "from pydantic import BaseModel, Field\n\n\nclass SetPerformanceBenchmarksOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_performance_benchmarks node outputs.\"\"\"\
      \n    cagr_target: float = (\n        Field(..., description=\"Target compound\
      \ annual growth rate in decimal form (e.g., 0.15 for 15%)\")\n    )\n    annual_volatility_constraint:\
      \ float = (\n        Field(..., description=\"Maximum acceptable annual volatility\
      \ in decimal form (e.g., 0.20 for 20%)\")\n    )\n    drawdown_limit: float\
      \ = (\n        Field(..., description=\"Maximum allowable drawdown expressed\
      \ as a decimal (e.g., 0.25 for 25%)\")\n    )\n    sharpe_ratio_goal: float\
      \ = (\n        Field(..., description=\"Target Sharpe ratio to be achieved by\
      \ the strategy\")\n    )\n\n\nclass CalculatePositionSizingOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for calculate_position_sizing node outputs.\"\"\"\n\
      \    risk_per_trade: float = Field(..., description=\"Risk percentage per trade\"\
      )\n    volatility_scaling_multiple: float = (\n        Field(..., description=\"\
      Volatility scaling multiple\")\n    )\n    maximum_position_size: float = (\n\
      \        Field(..., description=\"Maximum position size\")\n    )\n    account_equity_reference:\
      \ float = (\n        Field(..., description=\"Account equity reference value\"\
      )\n    )\n    position_sizing_algorithm: str = (\n        Field(..., description=\"\
      Position sizing algorithm description\")\n    )\n\n\ndef calculate_position_sizing(set_performance_benchmarks_input:\
      \ SetPerformanceBenchmarksOutput, **kwargs) -> CalculatePositionSizingOutput:\n\
      \    \"\"\"\n    This function calculates the position sizing parameters based\
      \ on the\n    provided risk per trade, volatility scaling multiple, and maximum\
      \ position\n    size, while considering the account equity.\n\n    Parameters\n\
      \    ----------\n    cagr_target : float\n        Target compound annual growth\
      \ rate\n    annual_volatility_constraint : float\n        Maximum acceptable\
      \ annual volatility\n    drawdown_limit : float\n        Maximum allowable drawdown\n\
      \    sharpe_ratio_goal : float\n        Target Sharpe ratio\n\n    Returns\n\
      \    -------\n    dict\n        A dictionary containing the calculated position\
      \ sizing parameters:\n        risk per trade, volatility scaling multiple, maximum\
      \ position size,\n        account equity reference, and position sizing algorithm\
      \ description.\n\n    Raises\n    ------\n    ValueError\n        If any of\
      \ the input parameters are invalid or inconsistent.\n\n    Examples\n    --------\n\
      \    >>> calculate_position_sizing(cagr_target=0.15,\n    annual_volatility_constraint=0.20,\
      \ drawdown_limit=0.25,\n    sharpe_ratio_goal=1.5)\n    {'risk_per_trade': 0.02,\
      \ 'volatility_scaling_multiple': 1.5,\n    'maximum_position_size': 10000.0,\
      \ 'account_equity_reference': 100000.0,\n    'position_sizing_algorithm': 'Risk-based\
      \ position sizing'}\n\n    \"\"\"\n    return CalculatePositionSizingOutput(\n\
      \        risk_per_trade=0.0,\n        volatility_scaling_multiple=0.0,\n   \
      \     maximum_position_size=0.0,\n        account_equity_reference=0.0,\n  \
      \      position_sizing_algorithm=\"\",\n    )"
    name: calculate_position_sizing
    nodes_depended_on:
    - set_performance_benchmarks
    nodes_dependent_on: []
    output_structure:
    - description: Risk percentage per trade
      key: risk_per_trade
      type: float
    - description: Volatility scaling multiple
      key: volatility_scaling_multiple
      type: float
    - description: Maximum position size
      key: maximum_position_size
      type: float
    - description: Account equity reference value
      key: account_equity_reference
      type: float
    - description: Position sizing algorithm description
      key: position_sizing_algorithm
      type: str
    prd:
      conceptual_info: 'This node determines the capital allocation logic for a quant
        strategy by designing a position sizing algorithm with three rules: risk per
        trade, volatility scaling, and maximum position size. It also references the
        account equity in its calculations.'
      docstring:
        examples:
        - lines:
          - calculate_position_sizing(cagr_target=0.15, annual_volatility_constraint=0.20,
            drawdown_limit=0.25, sharpe_ratio_goal=1.5)
          output: '{''risk_per_trade'': 0.02, ''volatility_scaling_multiple'': 1.5,
            ''maximum_position_size'': 10000.0, ''account_equity_reference'': 100000.0,
            ''position_sizing_algorithm'': ''Risk-based position sizing''}'
        parameters:
        - description: Target compound annual growth rate
          name: cagr_target
          type: float
        - description: Maximum acceptable annual volatility
          name: annual_volatility_constraint
          type: float
        - description: Maximum allowable drawdown
          name: drawdown_limit
          type: float
        - description: Target Sharpe ratio
          name: sharpe_ratio_goal
          type: float
        raises:
        - description: If any of the input parameters are invalid or inconsistent.
          type: ValueError
        returns:
          description: 'A dictionary containing the calculated position sizing parameters:
            risk per trade, volatility scaling multiple, maximum position size, account
            equity reference, and position sizing algorithm description.'
          type: dict
        summary: This function calculates the position sizing parameters based on
          the provided risk per trade, volatility scaling multiple, and maximum position
          size, while considering the account equity.
    prompt: 'Design position sizing algorithm with 3 rules: risk per trade (%), volatility
      scaling (multiple), maximum position size. Include account equity references
      in equations.'
    shims: []
  choose_strategy_approach:
    agent: false
    code_node_type: stub
    description: Select trading methodology framework
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefineStrategyObjectiveOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for define_strategy_objective node outputs.\"\"\"\n    strategy_sentence:\
      \ str = (\n        Field(..., description=\"A concise one\\u2011sentence statement\
      \ of the strategy's objective\")\n    )\n    cagr_target: float = (\n      \
      \  Field(..., description=\"Target Compound Annual Growth Rate (CAGR) expressed\
      \ as a decimal\")\n    )\n    annual_vol_target: float = (\n        Field(...,\
      \ description=\"Maximum acceptable annual volatility expressed as a decimal\"\
      )\n    )\n    max_drawdown: float = (\n        Field(..., description=\"Maximum\
      \ drawdown limit expressed as a decimal\")\n    )\n    sharpe_goal: float =\
      \ (\n        Field(..., description=\"Target Sharpe ratio to be achieved\")\n\
      \    )\n\n\nclass ChooseStrategyApproachOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for choose_strategy_approach node outputs.\"\"\"\n    methodology: str\
      \ = (\n        Field(..., description=\"Chosen methodology type: 'rule-based',\
      \ 'machine-learning', or 'hybrid'\")\n    )\n    justifications: List[str] =\
      \ (\n        Field(..., description=\"Short bullet points explaining why the\
      \ chosen methodology is suitable for the strategy objective\")\n    )\n    technical_reasons:\
      \ List[str] = (\n        Field(..., description=\"Specific technical reasons\
