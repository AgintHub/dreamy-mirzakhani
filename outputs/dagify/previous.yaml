    - description: Total number of executed trades during the backtest
      key: number_of_trades
      type: int
    - description: Maximum drawdown value observed during backtesting
      key: max_drawdown
      type: float
    - description: Indicates if backtest completed successfully without errors
      key: backtest_success_flag
      type: bool
    prd:
      conceptual_info: Executes a walk-forward backtest of a quantitative strategy
        over the historical period 2018‑2022, incorporating transaction costs and
        slippage, to produce daily and cumulative performance metrics for later evaluation.
      docstring:
        examples:
        - lines:
          - 'price_data = {''prices'': [100, 102, 101, 103, 104]}'
          - 'fundamental_data = {''eps'': [3.2, 3.4, 3.5, 3.6, 3.7]}'
          - 'signal_algo = lambda dates: [1, 0, -1, 1, 0]'
          - results = execute_backtesting(price_data, fundamental_data, signal_algo)
          output: "{\n  'backtest_dates': ['2018-01-02', '2018-01-03', '2018-01-04',\
            \ '2018-01-05', '2018-01-06'],\n  'strategy_positions': [0.5, 0.0, -0.5,\
            \ 0.5, 0.0],\n  'daily_returns': [0.01, 0.0, -0.015, 0.02, 0.0],\n  'transaction_costs':\
            \ [0.001, 0.001, 0.001, 0.001, 0.001],\n  'slippage_costs': [0.0005, 0.0005,\
            \ 0.0005, 0.0005, 0.0005],\n  'cumulative_returns': [0.009, 0.009, -0.006,\
            \ 0.014, 0.014],\n  'trade_signals': [1, 0, -1, 1, 0],\n  'number_of_trades':\
            \ 4,\n  'max_drawdown': 0.02,\n  'backtest_success_flag': True\n}"
        parameters:
        - description: Cleaned historical price series for all instruments (e.g.,
            a DataFrame or nested list).
          name: price_data
          type: object
        - description: Cleaned fundamental metrics aligned with price data (e.g.,
            earnings, revenue).
          name: fundamental_data
          type: object
        - description: Callable or object that implements the signal generation logic
            produced by `implement_signal_processing`.
          name: signal_algo
          type: object
        raises:
        - description: Raised when required input data is missing or improperly formatted.
          type: ValueError
        - description: Raised if the backtesting simulation fails (e.g., due to inconsistent
            dates or missing market data).
          type: RuntimeError
        returns:
          description: Dictionary mapping output keys (backtest_dates, strategy_positions,
            etc.) to their computed values.
          type: dict
        summary: Simulate strategy execution over 2018‑2022 using walk‑forward analysis,
          generating position sizes, applying transaction costs and slippage, and
          producing daily and cumulative returns along with key performance indicators.
    prompt: Simulate strategy execution from 2018 to 2022 using walk-forward analysis.
      Include transaction costs and slippage model.
  execute_out_of_sample:
    agent: false
    description: Validate generalization capability of the strategy by executing it
      on an unseen 6-month data set, calculating out-of-sample performance metrics,
      and comparing them against the training period metrics.
    name: execute_out_of_sample
    nodes_depended_on:
    - verify_backtest_integrity
    nodes_dependent_on: []
    output_structure:
    - description: Total cumulative return achieved over the 6-month out-of-sample
        period.
      key: out_of_sample_cumulative_return
      type: float
    - description: Compound annual growth rate calculated from the out-of-sample returns.
      key: out_of_sample_cagr
      type: float
    - description: Sharpe ratio of the out-of-sample strategy using risk-free rate
        of 0.
      key: out_of_sample_sharpe_ratio
      type: float
    - description: Maximum observed drawdown during the out-of-sample period.
      key: out_of_sample_max_drawdown
      type: float
    - description: Proportion of profitable trades in the out-of-sample period (0-1).
      key: out_of_sample_win_rate
      type: float
    - description: Ulcer index computed from the out-of-sample drawdown series.
      key: out_of_sample_ulcer_index
      type: float
    - description: Calmar ratio of the out-of-sample period.
      key: out_of_sample_calmar_ratio
      type: float
    - description: Start date of the out-of-sample period in YYYY-MM-DD format.
      key: out_of_sample_period_start
      type: str
    - description: End date of the out-of-sample period in YYYY-MM-DD format.
      key: out_of_sample_period_end
      type: str
    - description: Percentage difference between out-of-sample CAGR and training CAGR.
      key: cagr_difference_pct
      type: float
    - description: Percentage difference between out-of-sample Sharpe ratio and training
        Sharpe ratio.
      key: sharpe_ratio_difference_pct
      type: float
    - description: Percentage difference between out-of-sample max drawdown and training
        max drawdown.
      key: max_drawdown_difference_pct
      type: float
    - description: Percentage difference between out-of-sample win rate and training
        win rate.
      key: win_rate_difference_pct
      type: float
    - description: Percentage difference between out-of-sample ulcer index and training
        ulcer index.
      key: ulcer_index_difference_pct
      type: float
    - description: Percentage difference between out-of-sample Calmar ratio and training
        Calmar ratio.
      key: calmar_ratio_difference_pct
      type: float
    - description: Flag indicating whether any performance metric diverges beyond
        acceptable threshold.
      key: performance_divergence_flag
      type: bool
    prd:
      conceptual_info: This node evaluates the strategy's generalization ability by
        applying it to a 6-month period that was not seen during training. It generates
        a full set of performance metrics for that period and then calculates the
        percentage differences between each metric and its counterpart from the training
        data, flagging any significant divergence.
      docstring:
        examples:
        - lines:
          - '# Dummy training metrics'
          - train_cagr = 0.15
          - train_sharpe = 1.5
          - train_max_drawdown = 0.20
          - train_win_rate = 0.55
          - train_ulcer = 10.0
          - train_calmar = 0.75
          - '# Run the node'
          - result = run_out_of_sample(train_cagr, train_sharpe, train_max_drawdown,
            train_win_rate, train_ulcer, train_calmar, {})
          - print(result['out_of_sample_cagr'], result['cagr_difference_pct'])
          output: 0.142 -6.666666666666664
        - lines:
          - '# Second example with a larger divergence'
          - train_cagr = 0.10
          - train_sharpe = 1.2
          - train_max_drawdown = 0.15
          - train_win_rate = 0.60
          - train_ulcer = 8.0
          - train_calmar = 0.60
          - '# Simulated out-of-sample metrics: worse performance'
          - result = run_out_of_sample(train_cagr, train_sharpe, train_max_drawdown,
            train_win_rate, train_ulcer, train_calmar, {})
          - print(result['performance_divergence_flag'])
          output: 'True'
        parameters:
        - description: CAGR of the training period (used for comparison).
          name: training_cagr
          type: float
        - description: Sharpe ratio of the training period (used for comparison).
          name: training_sharpe
          type: float
        - description: Maximum drawdown of the training period (used for comparison).
          name: training_max_drawdown
          type: float
        - description: Win rate (0-1) of the training period (used for comparison).
          name: training_win_rate
          type: float
        - description: Ulcer index of the training period (used for comparison).
          name: training_ulcer_index
          type: float
        - description: Calmar ratio of the training period (used for comparison).
          name: training_calmar_ratio
          type: float
        - description: Dictionary containing strategy parameters and risk‑management
            rules to be applied during the out-of-sample run.
          name: strategy_config
          type: dict
        raises:
        - description: If any of the required training metric inputs are None or not
            numeric.
          type: ValueError
        - description: If the out-of-sample run fails due to missing data or internal
            errors.
          type: RuntimeError
        returns:
          description: Dictionary containing the out-of-sample performance metrics,
            the start/end dates, the percentage differences to training metrics, and
            a divergence flag.
          type: dict
        summary: Run the full strategy on a 6-month out-of-sample period and compare
          key performance metrics to the training period.
    prompt: Run full strategy on 6-month unseen data set. Document performance divergence
      from training period.
