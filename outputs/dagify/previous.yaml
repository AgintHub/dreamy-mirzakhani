      \ to be achieved\")\n    )\n\n\ndef define_strategy_objective(general_input:\
      \ str, **kwargs) -> DefineStrategyObjectiveOutput:\n    \"\"\"\n    Create a\
      \ one‑sentence objective and associated quantitative benchmarks for a\n    quantitative\
      \ trading strategy.\n\n    Parameters\n    ----------\n    objective_description\
      \ : str\n        Free‑text description of the intended trading goal (e.g., \"\
      Capture\n        momentum in small‑cap stocks with <3% daily volatility\").\n\
      \    cagr_target : float\n        Desired Compound Annual Growth Rate expressed\
      \ as a decimal (e.g.,\n        0.15 for 15%).\n    annual_vol_target : float\n\
      \        Maximum acceptable annual volatility expressed as a decimal (e.g.,\n\
      \        0.20 for 20%).\n    max_drawdown : float\n        Maximum acceptable\
      \ drawdown expressed as a decimal (e.g., 0.25 for\n        25%).\n    sharpe_goal\
      \ : float\n        Target Sharpe ratio to be achieved by the strategy.\n\n \
      \   Returns\n    -------\n    dict\n        Dictionary containing the objective\
      \ sentence and all benchmark\n        values.\n\n    Raises\n    ------\n  \
      \  ValueError\n        Raised if any numeric benchmark is not within a realistic\
      \ range\n        (e.g., CAGR < 0 or > 1).\n    TypeError\n        Raised if\
      \ input types do not match the expected types.\n\n    Examples\n    --------\n\
      \    >>> output = define_strategy_objective(\n\n    ...     objective_description='Capture\
      \ momentum in small‑cap stocks with\n    <3%% daily volatility',\n    ...  \
      \   cagr_target=0.15,\n\n    ...     annual_vol_target=0.20,\n\n    ...    \
      \ max_drawdown=0.25,\n\n    ...     sharpe_goal=1.5\n\n    >>> )\n    {\n  \
      \    'strategy_sentence': 'Capture momentum in small‑cap stocks with <3% daily\n\
      \    volatility',\n      'cagr_target': 0.15,\n      'annual_vol_target': 0.20,\n\
      \      'max_drawdown': 0.25,\n      'sharpe_goal': 1.5\n    }\n\n    >>> # Invalid\
      \ CAGR triggers ValueError\n\n    >>> try:\n\n    ...     define_strategy_objective(\n\
      \n    ...         objective_description='Long‑term growth strategy',\n\n   \
      \ ...         cagr_target=-0.05,\n\n    ...         annual_vol_target=0.15,\n\
      \n    ...         max_drawdown=0.2,\n\n    ...         sharpe_goal=1.2\n\n \
      \   ...     )\n\n    >>> except ValueError as e:\n\n    ...     print(e)\n \
      \   \"CAGR target must be between 0 and 1. Received: -0.05\"\n\n    \"\"\"\n\
      \    return DefineStrategyObjectiveOutput(\n        strategy_sentence=\"\",\n\
      \        cagr_target=0.0,\n        annual_vol_target=0.0,\n        max_drawdown=0.0,\n\
      \        sharpe_goal=0.0,\n    )"
