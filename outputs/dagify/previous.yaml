dag_type: plain_text
description: Creates test data, executes a test, and summarizes the outcome.
name: basic_test_workflow
nodes:
  collect_test_results:
    agent: false
    description: Creates a human‑readable summary of the test results.
    name: collect_test_results
    nodes_depended_on:
    - execute_test
    nodes_dependent_on: []
    prompt: Summarize the test execution outcome. Present the total number of records
      tested, the count of passed and failed records, and any error messages. Output
      a concise report in plain text.
  execute_test:
    agent: false
    description: Runs the test against the generated data and records pass/fail counts.
    name: execute_test
    nodes_depended_on:
    - generate_test_data
    nodes_dependent_on:
    - collect_test_results
    prompt: Run the test using the data from `generate_test_data`. The test should
      verify that all records have a `status` of 'valid'. Record the number of passing
      and failing records. Return the results in JSON with keys `passed`, `failed`,
      and `details`.
  generate_test_data:
    agent: false
    description: Produces sample input data for the test.
    name: generate_test_data
    nodes_depended_on: []
    nodes_dependent_on:
    - execute_test
    prompt: Generate a small set of sample input data for the test. Include at least
      three records with fields `id`, `value`, and `status`. Provide the data in JSON
      format.
