dag_type: plain_text
description: Creates a minimal testing workflow that generates sample input, processes
  it, validates the output, and reports success or failure.
name: execute_simple_test
nodes:
  evaluate_result:
    agent: false
    description: Validates the output against the expected value and determines pass/fail
      status.
    name: evaluate_result
    nodes_depended_on:
    - run_test
    nodes_dependent_on:
    - report_test_outcome
    prompt: Check if the `result` field from the test output equals 15. If it does,
      set `status` to "pass"; otherwise set `status` to "fail" and include `expected`
      and `actual` values in the response.
  prepare_test_input:
    agent: false
    description: Generates the input data that will be used by the test operation.
    name: prepare_test_input
    nodes_depended_on: []
    nodes_dependent_on:
    - run_test
    prompt: Create a JSON object that represents the input for the test. Include the
      fields `value` with integer 5 and `multiplier` with integer 3.
  report_test_outcome:
    agent: false
    description: Produces the final test report.
    name: report_test_outcome
    nodes_depended_on:
    - evaluate_result
    nodes_dependent_on: []
    prompt: Return a JSON object with the field `status` and, if failed, also include
      `expected` and `actual` fields. The output should be human‑readable and suitable
      for logging.
  run_test:
    agent: false
    description: Performs the operation under test and produces the output.
    name: run_test
    nodes_depended_on:
    - prepare_test_input
    nodes_dependent_on:
    - evaluate_result
    prompt: Take the JSON input produced in the previous step, multiply `value` by
      `multiplier`, and return a JSON object with a single field `result` containing
      the product.
