dag_type: plain_text
description: A workflow to gather market data, calculate implied volatility vs NAV
  valuation for an equity portfolio, construct an overnight dynamic hedge using stocks,
  ETFs, and futures, and prepare execution orders for the opening auction.
name: overnight_dynamic_hedge_execution
nodes:
  aggregate_hedge_instructions:
    agent: false
    description: Consolidate individual stock, ETF, and futures hedge requirements.
    name: aggregate_hedge_instructions
    nodes_depended_on:
    - determine_hedge_ratio_stocks
    - determine_hedge_ratio_etfs
    - determine_hedge_ratio_futures
    nodes_dependent_on: []
    prompt: Compile the hedge orders for stocks, ETFs, and futures into a single consolidated
      list. Ensure the total direction aligns with the implied vs NAV valuation gap.
  calculate_portfolio_delta:
    agent: false
    description: Calculate the total delta exposure of the equity portfolio.
    name: calculate_portfolio_delta
    nodes_depended_on:
    - fetch_eod_stock_data
    nodes_dependent_on: []
    prompt: Calculate the aggregate delta exposure for the equity portfolio based
      on current positions and closing prices.
  compare_implied_vs_nav:
    agent: false
    description: Determine the variance between implied market valuation and NAV.
    name: compare_implied_vs_nav
    nodes_depended_on:
    - derive_implied_market_valuation
    - fetch_nav_valuation
    nodes_dependent_on: []
    prompt: Compare the calculated implied market valuation against the reported NAV.
      Calculate the absolute and percentage gap.
  derive_implied_market_valuation:
    agent: false
    description: Calculate the market-implied valuation of the portfolio based on
      closing prices.
    name: derive_implied_market_valuation
    nodes_depended_on:
    - fetch_eod_stock_data
    nodes_dependent_on: []
    prompt: Using the end-of-day stock data, calculate the total market value of the
      equity portfolio holdings.
  determine_hedge_ratio_etfs:
    agent: false
    description: Calculate the required notional and unit count for ETF hedges.
    name: determine_hedge_ratio_etfs
    nodes_depended_on:
    - compare_implied_vs_nav
    - fetch_eod_etf_data
    nodes_dependent_on: []
    prompt: Based on the valuation gap and ETF market data, calculate the number of
      ETF shares required to hedge the residual beta exposure of the portfolio.
  determine_hedge_ratio_futures:
    agent: false
    description: Calculate the required contract count for futures hedges.
    name: determine_hedge_ratio_futures
    nodes_depended_on:
    - fetch_eod_futures_data
    - compare_implied_vs_nav
    nodes_dependent_on: []
    prompt: Based on the valuation gap and futures market data, calculate the number
      of futures contracts required to hedge the systematic market risk.
  determine_hedge_ratio_stocks:
    agent: false
    description: Calculate the required notional and unit count for stock hedges.
    name: determine_hedge_ratio_stocks
    nodes_depended_on:
    - compare_implied_vs_nav
    - calculate_portfolio_delta
    nodes_dependent_on: []
    prompt: Based on the valuation gap and portfolio delta, calculate the specific
      number of shares of individual stocks to sell or buy to neutralize the overnight
      gap variance.
  fetch_eod_etf_data:
    agent: false
    description: Retrieve end-of-day pricing and volume data for relevant ETF proxies.
    name: fetch_eod_etf_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Retrieve the end-of-day market data for the ETFs designated as hedging
      instruments. Include closing price, total volume, and implied volatility if
      available.
  fetch_eod_futures_data:
    agent: false
    description: Retrieve end-of-day pricing and volume data for index futures used
      for hedging.
    name: fetch_eod_futures_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Retrieve the end-of-day market data for the relevant index futures contracts.
      Include settlement price, open interest, and implied volatility from the options
      chain.
  fetch_eod_stock_data:
    agent: false
    description: Retrieve end-of-day pricing and volume data for the current equity
      portfolio holdings.
    name: fetch_eod_stock_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Retrieve the end-of-day market data for all stocks currently held in the
      portfolio. Include closing price, total volume, and bid/ask spread.
  fetch_nav_valuation:
    agent: false
    description: Retrieve the current Net Asset Value (NAV) of the portfolio.
    name: fetch_nav_valuation
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Retrieve the calculated Net Asset Value (NAV) of the equity portfolio
      as of the close of business.
  format_opening_auction_orders:
    agent: false
    description: Format the hedge trades for execution at the morning opening auction.
    name: format_opening_auction_orders
    nodes_depended_on:
    - aggregate_hedge_instructions
    nodes_dependent_on: []
    prompt: Convert the hedge instructions into specific order types suitable for
      the opening auction (e.g., Market-On-Open or Limit-On-Open). Include ticker,
      side (buy/sell), quantity, and order type.
  transmit_execution_file:
    agent: false
    description: Generate and send the final execution file to the trading system
      or broker.
    name: transmit_execution_file
    nodes_depended_on:
    - format_opening_auction_orders
    - validate_risk_limits
    nodes_dependent_on: []
    prompt: Create the final execution file containing the approved order instructions
      for the opening auction and prepare it for transmission to the Order Management
      System.
  validate_risk_limits:
    agent: false
    description: Ensure the proposed hedge trades adhere to risk management constraints.
    name: validate_risk_limits
    nodes_depended_on:
    - aggregate_hedge_instructions
    nodes_dependent_on: []
    prompt: Check the proposed hedge orders against pre-defined risk limits (max notional,
      max leverage per instrument). Flag any violations for review.
