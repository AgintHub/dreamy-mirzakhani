dag_type: plain_text
description: A workflow for building a quantitative trading system, from defining
  objectives through compiling the final trading strategy and risk management framework.
name: build_quantitative_trading_system
nodes:
  backtest_trading_system:
    agent: false
    description: Backtest the implemented trading system using historical data.
    name: backtest_trading_system
    nodes_depended_on:
    - implement_trading_system
    nodes_dependent_on: []
    prompt: Backtest the implemented trading system using historical data and evaluate
      its performance.
  choose_investment_strategy:
    agent: false
    description: Identify the high-level investment strategy category.
    name: choose_investment_strategy
    nodes_depended_on:
    - define_investment_objectives
    nodes_dependent_on: []
    prompt: Select one primary quantitative trading strategy category that best serves
      the investment objectives (e.g., statistical arbitrage, momentum, mean reversion).
      Provide a one-sentence rationale.
  collect_historical_data:
    agent: false
    description: Gather historical price and trading data for selected assets.
    name: collect_historical_data
    nodes_depended_on:
    - select_asset_universe
    nodes_dependent_on: []
    prompt: Collect 5 years of historical daily price and trading volume data for
      the selected assets. Ensure data includes open, high, low, close prices, and
      trading volume.
  define_investment_objectives:
    agent: false
    description: Produce a bullet list of the quantitative trading system's core objectives.
    name: define_investment_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: State the primary business objectives for the quantitative trading system.
      Produce a concise bullet list covering investment purpose, risk tolerance, and
      long-term vision (max 8 bullets). Focus only on objectives, do not include strategy
      details.
  define_risk_management_framework:
    agent: false
    description: Outline quantitative and qualitative risk controls.
    name: define_risk_management_framework
    nodes_depended_on:
    - evaluate_model
    nodes_dependent_on: []
    prompt: 'List core risk controls aligned with the target metrics: position limits,
      VaR limits, stop-loss rules, liquidity thresholds. Provide 4–6 bullet points.'
  evaluate_model:
    agent: false
    description: Evaluate the performance of the trained model using the testing data.
    name: evaluate_model
    nodes_depended_on:
    - train_model
    nodes_dependent_on: []
    prompt: Evaluate the performance of the trained model using the testing data and
      metrics such as accuracy, precision, recall, and Sharpe ratio.
  feature_engineering:
    agent: false
    description: Create relevant features from the preprocessed data.
    name: feature_engineering
    nodes_depended_on:
    - preprocess_data
    nodes_dependent_on: []
    prompt: Create relevant features from the preprocessed data, such as moving averages,
      RSI, Bollinger Bands.
  implement_trading_system:
    agent: false
    description: Implement the quantitative trading system using the trained model
      and risk management framework.
    name: implement_trading_system
    nodes_depended_on:
    - define_risk_management_framework
    nodes_dependent_on: []
    prompt: Implement the quantitative trading system using the trained model and
      risk management framework.
  preprocess_data:
    agent: false
    description: Clean and preprocess the collected historical data.
    name: preprocess_data
    nodes_depended_on:
    - collect_historical_data
    nodes_dependent_on: []
    prompt: Clean and preprocess the historical data by handling missing values, outliers,
      and normalizing the data.
  select_asset_universe:
    agent: false
    description: Enumerate tradable assets and instruments.
    name: select_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    prompt: List the specific asset classes and instruments the chosen strategy will
      trade (e.g., US large-cap equities, S&P futures). Keep list ≤10 items.
  split_data:
    agent: false
    description: Split the preprocessed data into training and testing sets.
    name: split_data
    nodes_depended_on:
    - feature_engineering
    nodes_dependent_on: []
    prompt: Split the preprocessed data into training (80%) and testing sets (20%).
  train_model:
    agent: false
    description: Train a quantitative trading model using the training data.
    name: train_model
    nodes_depended_on:
    - split_data
    nodes_dependent_on: []
    prompt: Train a quantitative trading model using the training data and selected
      features.
