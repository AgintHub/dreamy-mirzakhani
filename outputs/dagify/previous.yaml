      type: float
    - description: CAGR of the training period
      key: training_cagr
      type: float
    - description: Sharpe ratio of the training period
      key: training_sharpe
      type: float
    - description: Maximum drawdown of the training period
      key: training_max_drawdown
      type: float
    - description: Win rate of the training period
      key: training_win_rate
      type: float
    - description: Ulcer index of the training period
      key: training_ulcer_index
      type: float
    - description: Calmar ratio of the training period
      key: training_calmar_ratio
      type: float
    - description: Difference between out-of-sample and training CAGR
      key: cagr_difference
      type: float
    - description: Difference between out-of-sample and training Sharpe ratio
      key: sharpe_difference
      type: float
    - description: Difference between out-of-sample and training maximum drawdown
      key: max_drawdown_difference
      type: float
    - description: Difference between out-of-sample and training win rate
      key: win_rate_difference
      type: float
    - description: Difference between out-of-sample and training ulcer index
      key: ulcer_index_difference
      type: float
    - description: Difference between out-of-sample and training Calmar ratio
      key: calmar_ratio_difference
      type: float
    - description: Quantified sensitivity of performance to ±20% parameter perturbations
      key: parameter_sensitivity_index
      type: float
    - description: Flag indicating if parameter sensitivity exceeds threshold
      key: parameter_sensitivity_detected
      type: bool
    - description: Number of trades executed in out-of-sample period
      key: out_of_sample_trade_count
      type: int
    - description: Number of trades executed in training period
      key: training_trade_count
      type: int
    - description: Whether the backtest integrity check passed
      key: backtest_integrity_passed
      type: bool
    prd:
      conceptual_info: The verify_backtest_integrity node performs a rigorous integrity
        check on a quantitative strategy by running an out‑of‑sample backtest on the
        latest market data, comparing the resulting performance metrics to those from
        the training period, evaluating the effect of ±20% parameter perturbations
        to quantify sensitivity, and determining whether the strategy passes predefined
        robustness thresholds.
      docstring:
        examples:
        - lines:
          - '# Example 1: Simple deterministic training data and risk framework'
          - training_backtest = {
          - '    ''number_of_trades'': 100,'
          - '    ''cumulative_returns'': [0.1, 0.2, 0.15, 0.25],'
          - '    ''max_drawdown'': 0.05,'
          - '    ''daily_returns'': [0.01, 0.02, -0.015, 0.025],'
          - '    ''training_cagr'': 0.12,'
          - '    ''training_sharpe'': 1.5,'
          - '    ''training_win_rate'': 0.55'
          - '}'
          - risk_framework = {
          - '    ''max_exposure_per_instrument'': 0.02,'
          - '    ''drawdown_threshold'': 0.1,'
          - '    ''daily_pnl_limit'': 1000'
          - '}'
          - result = verify_backtest_integrity(training_backtest, risk_framework)
          - '# Expected output (illustrative):'
          - print(result['backtest_integrity_passed'])
          - 'True'
          output: 'True'
        - lines:
          - '# Example 2: Failure case when training data missing a key'
          - 'bad_training_backtest = { ''number_of_trades'': 50 }'
          - 'risk_framework = { ''max_exposure_per_instrument'': 0.02 }'
          - 'try:'
          - '    verify_backtest_integrity(bad_training_backtest, risk_framework)'
          - 'except ValueError as e:'
          - '    print(str(e))'
          - '# Expected output:'
          - 'KeyError: ''training_cagr'''
          output: 'KeyError: ''training_cagr'''
        parameters:
        - description: Dictionary containing the outputs from execute_backtesting
            (backtest_dates, strategy_positions, daily_returns, etc.) representing
            the training period results.
          name: training_backtest
          type: dict
        - description: Dictionary containing the outputs from create_risk_framework
            (position_sizing_rule, max_exposure_per_instrument, etc.) to ensure risk
            rules are enforced during the out‑of‑sample run.
          name: risk_framework
          type: dict
        raises:
        - description: If any required key is missing from the training_backtest or
            risk_framework inputs.
          type: ValueError
        - description: If the out‑of‑sample backtest fails to complete due to data
            or execution errors.
          type: RuntimeError
        returns:
          description: A dictionary matching the node's output structure, containing
            the random seed, performance metrics for training and out‑of‑sample periods,
            differences, parameter sensitivity index, trade counts, and the integrity
            flag.
          type: dict
        summary: Run out‑of‑sample backtesting on 2023‑2024 data, compare metrics
          with training period, compute parameter sensitivity, and return a comprehensive
          integrity report.
    prompt: Execute out-of-sample test on 2023-2024 data with new random seed. Compare
      performance to training period and identify parameter sensitivity.
