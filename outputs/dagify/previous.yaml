      type: int
    - description: CAGR of out-of-sample period
      key: out_of_sample_cagr
      type: float
    - description: Sharpe ratio of out-of-sample period
      key: out_of_sample_sharpe
      type: float
    - description: Maximum drawdown of out-of-sample period
      key: out_of_sample_max_drawdown
      type: float
    - description: Win rate of out-of-sample period
