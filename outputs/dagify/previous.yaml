dag_type: plain_text
description: A highly concurrent, elementally decomposed workflow that builds a complete
  quicksort algorithm using only pure functional programming constructs. Each step
  creates a single stateless function, and the final step assembles them into the
  full quicksort implementation.
name: functional_quicksort_implementation
nodes:
  assemble_quicksort_module:
    agent: false
    description: Combine all previously defined functions into a single, exportable
      functional quicksort module.
    name: assemble_quicksort_module
    nodes_depended_on:
    - define_concat_function
    - define_recursive_quicksort_function
    nodes_dependent_on:
    - generate_quicksort_test_cases
    prompt: Create a module `FunctionalQuickSort` that exports the `quickSort` function.
      Ensure that `quickSort` internally uses `baseCase`, `compare`, `partition`,
      and `concatLists` as defined earlier. Provide the module code in a language-agnostic
      functional pseudo‑code format.
  define_base_case_function:
    agent: false
    description: Create a pure function that returns the input list unchanged when
      its length is 0 or 1 (the quicksort base case).
    name: define_base_case_function
    nodes_depended_on: []
    nodes_dependent_on:
    - define_compare_function
    prompt: Write a stateless function `baseCase(lst)` that returns `lst` if `len(lst)
      <= 1`, otherwise returns `null`. Use only functional syntax (no mutable state).
  define_compare_function:
    agent: false
    description: Create a pure comparator function that determines ordering between
      two elements.
    name: define_compare_function
    nodes_depended_on:
    - define_base_case_function
    nodes_dependent_on:
    - define_partition_function
    prompt: Write a stateless function `compare(a, b)` that returns `true` if `a`
      should come before `b` in sorted order, otherwise `false`. Assume a generic
      comparable type and avoid side‑effects.
  define_concat_function:
    agent: false
    description: Create a pure function that concatenates three lists (less, pivot
      list, greater) in order.
    name: define_concat_function
    nodes_depended_on:
    - define_recursive_quicksort_function
    nodes_dependent_on:
    - assemble_quicksort_module
    prompt: Write a stateless function `concatLists(less, pivot, greater)` that returns
      a new list equal to `less` followed by `pivot` (as a single‑element list) followed
      by `greater`. Use only functional list operations.
  define_partition_function:
    agent: false
    description: Create a pure partition function that splits a list into two sub‑lists
      (less and greater) based on a pivot using the comparator.
    name: define_partition_function
    nodes_depended_on:
    - define_compare_function
    nodes_dependent_on:
    - define_recursive_quicksort_function
    prompt: Write a stateless function `partition(pivot, lst, compare)` that returns
      a tuple `(less, greater)` where `less` contains all elements for which `compare(elem,
      pivot)` is true, and `greater` contains the rest. Use only functional constructs
      (map, filter, recursion).
  define_recursive_quicksort_function:
    agent: false
    description: Create the core recursive quicksort function that calls itself on
      the `less` and `greater` sub‑lists returned by the partition function.
    name: define_recursive_quicksort_function
    nodes_depended_on:
    - define_partition_function
    - define_base_case_function
    nodes_dependent_on:
    - define_concat_function
    prompt: 'Write a stateless recursive function `quickSort(lst, compare)` that:

      1. Calls `baseCase(lst)`; if it returns a list, return that list.

      2. Otherwise selects the first element as `pivot`.

      3. Calls `partition(pivot, lstTail, compare)` to get `(less, greater)` (where
      `lstTail` is `lst` without the first element).

      4. Recursively sorts `less` and `greater` by calling `quickSort` on each.

      5. Returns the concatenation of sorted `less`, `[pivot]`, and sorted `greater`.

      Do not use any mutable variables; rely on function composition.'
  generate_quicksort_test_cases:
    agent: false
    description: Produce a set of pure test cases to verify the functional quicksort
      implementation works for various input shapes.
    name: generate_quicksort_test_cases
    nodes_depended_on:
    - assemble_quicksort_module
    nodes_dependent_on: []
    prompt: 'Write three independent, pure test expressions that call `FunctionalQuickSort.quickSort`
      with:

      1. An empty list.

      2. A list of distinct integers.

      3. A list containing duplicate values.

      For each test, include the expected sorted result. Do not use any mutable state;
      express tests as expressions returning a boolean indicating pass/fail.'
