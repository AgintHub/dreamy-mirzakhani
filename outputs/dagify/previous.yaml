  execute_backtesting:
    agent: false
    description: Apply algorithm to historical data
    name: execute_backtesting
    nodes_depended_on:
    - implement_signal_processing
    - clean_price_data
    - clean_fundamental_data
    nodes_dependent_on: []
    output_structure:
    - description: List of chronological dates covering the backtesting period
      key: backtest_dates
      type: List[str]
    - description: Strategy position sizes or weights per instrument over time
      key: strategy_positions
      type: List[float]
    - description: Calculated daily returns of the strategy net of costs
      key: daily_returns
      type: List[float]
    - description: Transaction costs incurred each day during backtest
      key: transaction_costs
      type: List[float]
    - description: Slippage costs applied to simulated trades during backtest
      key: slippage_costs
      type: List[float]
    - description: Cumulative returns over the backtesting period
      key: cumulative_returns
      type: List[float]
    - description: Discrete trade signals generated by the strategy per day (e.g.
        -1 for short, 0 for neutral, 1 for long)
