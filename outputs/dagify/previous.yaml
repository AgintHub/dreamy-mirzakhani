      type: str
    - description: last traded price (float)
      key: price
      type: float
    - description: total traded volume (integer)
      key: volume
      type: int
    - description: object containing `latency_ms`, `datacenter`, and `source_url`
      key: metadata
      type: str
    prompt: "Parse the fetched NYSE stock data into a clean, query-friendly schema:\\\
      \n1. **Protocol details** – Assume the data arrives over HTTPS via the NYSE’s\
      \ public API using JSON-lines format with `application/json` content-type.\\\
      \n2. **Latency handling** – The raw payload may contain up to 200 ms of network\
      \ latency; implement a timeout of 5 s and retry logic with exponential back-off\
      \ (max 3 attempts).\\\n3. **Datacenter mapping** – NYSE data is replicated across\
      \ two primary datacenters: **New York (US‑East‑1)** and **London (EU‑West‑2)**.\
      \ Select the nearest datacenter based on the client’s IP location and record\
      \ the chosen region in the output metadata.\\\n4. **Output structure** – Emit\
      \ a JSON object with the following keys:\\\n   * `timestamp` – ISO‑8601 UTC\
      \ of record ingestion.\\\n   * `exchange` – \"NYSE\".\\\n   * `symbol` – ticker\
      \ symbol.\\\n   * `price` – last traded price (float).\\\n   * `volume` – total\
      \ traded volume (integer).\\\n   * `metadata` – object containing `latency_ms`,\
      \ `datacenter`, and `source_url`\\\n5. **Validation** – Verify that all numeric\
      \ fields are non-negative and that `timestamp` is within ±30 seconds of the\
      \ current system time. Flag and discard any malformed records.\\\n6. **Return**\
      \ – A list of validated, structured records ready for downstream analytics or\
      \ storage.\\\n      "
