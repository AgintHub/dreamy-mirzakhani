      key: source_datacenter
      type: str
    - description: Fetch latency in milliseconds.
      key: fetch_latency_ms
      type: int
    - description: Parse duration in milliseconds.
      key: parse_duration_ms
      type: int
    prompt: 'Parse the raw NASDAQ JSON payload returned by the API into a normalized,
      query-ready table. The input will include a timestamped, multi-asset bundle
      from a specific datacenter (US-East or US-West). For each record, extract the
      fields: symbol, date, open, high, low, close, volume, adjusted_close, and market_cap.
      Convert all numeric fields to IEEE 754 doubles, ensure dates are ISO-8601 UTC,
      and flag any missing or NaN values with a sentinel NULL. Output a JSON array
      where each element is a flat object keyed by these columns, and include metadata:
      source_datacenter, fetch_latency_ms, and parse_duration_ms. The parsing must
      honor the latency constraints specified by the datafeed: 100 ms per 1 kB chunk,
      with an upper bound of 5 s per full payload. If the payload exceeds 10 MB, split
      it into paginated segments and process each sequentially, aggregating the results
      into the final array.'
  parse_nyse_stock_data:
    agent: false
    description: Transforms raw NYSE stock data retrieved over HTTPS into a normalized,
      time-stamped JSON structure, incorporating latency metrics, datacenter provenance,
      and rigorous validation to ensure downstream consistency.
    name: parse_nyse_stock_data
    nodes_depended_on:
    - fetch_nyse_stock_data
