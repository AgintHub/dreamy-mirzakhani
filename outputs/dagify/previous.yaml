dag_type: spec
description: Generated workflow from UI.
name: build_quant_trading_strategy
nodes:
  calculate_performance_metrics:
    agent: false
    description: Quantify strategy effectiveness
    name: calculate_performance_metrics
    nodes_depended_on:
    - execute_backtesting
    nodes_dependent_on: []
    output_structure:
    - description: Compound Annual Growth Rate (CAGR) of the strategy
      key: cagr
      type: float
    - description: Sharpe ratio of the strategy (risk-adjusted return measure)
      key: sharpe_ratio
      type: float
    - description: Maximum drawdown (peak-to-trough decline during the period)
      key: max_drawdown
      type: float
    - description: Proportion of profitable trades (value between 0 and 1)
      key: win_rate
      type: float
    - description: Ulcer index (measure of downside risk and drawdown severity)
      key: ulcer_index
      type: float
    - description: Calmar ratio (annualized return divided by max drawdown)
      key: calmar_ratio
      type: float
    - description: Benchmark CAGR for comparison
      key: cagr_benchmark
      type: float
    - description: Benchmark Sharpe ratio for comparison
      key: sharpe_benchmark
      type: float
    - description: Benchmark maximum drawdown for comparison
      key: drawdown_benchmark
      type: float
    - description: Benchmark Ulcer index for comparison
      key: ulcer_benchmark
      type: float
    - description: Benchmark Calmar ratio for comparison
      key: calmar_benchmark
      type: float
    - description: Whether strategy CAGR exceeds benchmark CAGR
      key: cagr_outperforms_benchmark
      type: bool
    - description: Whether strategy Sharpe ratio exceeds benchmark Sharpe ratio
      key: sharpe_better_benchmark
      type: bool
    - description: Whether strategy max drawdown is lower than benchmark drawdown
      key: drawdown_better_benchmark
      type: bool
    - description: Whether strategy Ulcer index is lower than benchmark Ulcer index
      key: ulcer_better_benchmark
      type: bool
    - description: Whether strategy Calmar ratio exceeds benchmark Calmar ratio
      key: calmar_better_benchmark
      type: bool
    prd:
      conceptual_info: Analyzes strategy performance using metrics like CAGR, Sharpe
        ratio, and max drawdown. Compares results against defined benchmarks to assess
        relative effectiveness.
      docstring:
        examples:
        - lines:
          - calculate_performance_metrics(strat_returns=[0.02, -0.01, 0.03], strat_cumulative=[1.02,
            1.01, 1.04], strat_max DD=0.05, trades=150, bench_returns=[0.01, 0.005,
            0.02], bench_cumulative=[1.01, 1.015, 1.04], bench_max DD=0.08)
          output: '{''cagr'': 1.183, ''sharpe_ratio'': 0.76, ... ''cagr_benchmark'':
            1.03, ''cagr_outperforms_benchmark'': True}'
        - lines:
          - calculate_performance_metrics(strat_returns=[], trades=0)
          output: 'ValueError: Daily returns list cannot be empty'
        parameters:
        - description: Daily returns of the strategy (from execute_backtesting)
          name: strategy_daily_returns
          type: List[float]
        - description: Cumulative returns of the strategy (from execute_backtesting)
          name: strategy_cumulative_returns
          type: List[float]
        - description: Maximum drawdown value from backtest results
          name: strategy_max_drawdown
          type: float
        - description: Total executed trades from backtest results
          name: strategy_number_of_trades
          type: int
        - description: Daily returns of the benchmark (typically major index)
          name: benchmark_daily_returns
          type: List[float]
        - description: Cumulative returns of the benchmark
          name: benchmark_cumulative_returns
          type: List[float]
        - description: Maximum drawdown of the benchmark
          name: benchmark_max_drawdown
          type: float
        raises:
        - description: If input lists are empty or input types are invalid
          type: ValueError
        - description: If benchmark or strategy has zero trades when calculating win
            rate
          type: ZeroDivisionError
        returns:
          description: Dictionary containing performance metrics and benchmark comparisons
          type: Dict[str, Union[float, bool]]
        summary: Quantify strategy effectiveness through performance metrics and benchmark
          comparisons
    prompt: Compute full performance report (CAGR, Sharpe ratio, max drawdown, win
      rate) and risk-adjusted metrics (Ulcer index, Calmar ratio). Include benchmark
      comparisons.
  choose_strategy_type:
    agent: false
    description: Select quant strategy category framework
    name: choose_strategy_type
    nodes_depended_on:
    - define_strategy_objectives
    nodes_dependent_on: []
    output_structure:
    - description: Selected primary strategy category (market neutral, statistical
        arbitrage, momentum, mean reversion, trend following)
      key: strategy_type
      type: str
    - description: One-sentence explanation linking strategy choice to defined objectives
      key: rationale
      type: str
    prd:
      conceptual_info: This node selects a primary quantitative trading strategy category
        based on predefined investment objectives. It maps the target risk-return
        profile, asset classes, and trading frequency to the most appropriate strategy
        framework, ensuring alignment with downstream risk management, parameter definition,
        and algorithmic logic components.
      docstring:
        examples:
        - lines:
          - "choose_strategy_type(annual_return_target_percentage=15.0,\" + \n   \
            \                    \"maximum_risk_tolerance_percentage=8.0,\" + \n \
            \                      \"target_asset_classes=['equities'], \" +\n   \
            \                    \"trading_frequency_per_month=180, \" +\n       \
            \                \"additional_investment_goals=['market beta neutrality'])"
          output: ('market neutral', 'Diversified equity risk exposure aligns with
            beta neutrality goals')
        - lines:
          - "choose_strategy_type(annual_return_target_percentage=25.0,\" +\n    \
            \                   \"maximum_risk_tolerance_percentage=15.0,\" +\n  \
            \                     \"target_asset_classes=['commodities'], \" +\n \
            \                      \"trading_frequency_per_month=450, \" +\n     \
            \                  \"additional_investment_goals=['leveraged exposure'])"
          output: ('trend following', 'High-return volatility profiles suit leveraged
            trend exploitation')
        parameters:
        - description: Target annual return requirement in percent (e.g., 12.5 for
            12.5%)
          name: annual_return_target_percentage
          type: float
        - description: Maximum acceptable drawdown or volatility threshold in percent
            (e.g., 10.0)
          name: maximum_risk_tolerance_percentage
          type: float
        - description: List of asset classes to be traded (e.g., ['equities', 'fixed
            income'])
          name: target_asset_classes
          type: List[str]
        - description: Expected number of trades/signals per calendar month (e.g.,
            200)
          name: trading_frequency_per_month
          type: int
        - description: Supplemental constraints or objectives (e.g., ['liquidity preservation'])
          name: additional_investment_goals
          type: List[str]
        raises:
        - description: If no valid strategy type aligns with the provided objectives,
            or if required parameters are missing
          type: ValueError
        returns:
          description: Strategy type categorization and rationale. Returns (strategy_type,
            rationale) where strategy_type ∈ ['market neutral', 'statistical arbitrage',
            'momentum', 'mean reversion', 'trend following']
          type: tuple[str, str]
        summary: Maps strategy objectives to framework category. Evaluates target
          return, risk tolerance, and asset classes to select a quant strategy type
          with a risk-aligned rationale.
    prompt: Select one primary strategy type (market neutral, statistical arbitrage,
      momentum, mean reversion, trend following). Provide one-sentence rationale linking
      to objectives.
  clean_fundamental_data:
    agent: false
    description: Standardize fundamental metrics
    name: clean_fundamental_data
    nodes_depended_on:
    - retrieve_fundamental_data
    nodes_dependent_on: []
    output_structure:
    - description: Whether fundamental data standardization was completed successfully
      key: success
      type: bool
    - description: List of standardized financial metrics (e.g. 'earnings', 'revenues',
        'EPS')
      key: standardized_metrics
      type: List[str]
    - description: List of source platforms (Bloomberg/Yahoo Finance)
      key: data_sources
      type: List[str]
    - description: List of standardized reporting periods (e.g. 'Q1-2018', 'Q2-2018')
      key: adjusted_reporting_periods
      type: List[str]
    - description: Number of companies in the cleansed dataset
      key: company_count
      type: int
    prd:
      conceptual_info: This node harmonizes financial data from Bloomberg and Yahoo
        Finance by converting dissimilar metrics (earnings, revenues, EPS) into standardized
        units and aligns reporting periods (Q1-2018 → Q1-2023). It ensures consistent
        time intervals for 50 companies while maintaining audit trails of source data.
      docstring:
        examples:
        - lines:
          - clean_fundamental_data(raw_data_path='/data/fundamentals.parquet', file_format='Parquet',
            company_tickers=['AAPL', 'MSFT'], source_platforms=['Bloomberg'])
          output: '{''success'': True, ''standardized_metrics'': [''earnings'', ''revenues'',
            ''EPS''], ''data_sources'': [''Bloomberg''], ''adjusted_reporting_periods'':
            [''Q1-2022'', ''Q2-2022''], ''company_count'': 2}'
        - lines:
          - clean_fundamental_data(raw_data_path='/data/missing_data.csv', file_format='CSV',
            company_tickers=['GOOGL'], source_platforms=['Yahoo Finance'])
          output: '{''success'': False, ''error'': ''ValueError: Revenues missing
            for 25% of GOOGL records''}'
        parameters:
        - description: Path/URI to raw data file generated by retrieve_fundamental_data
          name: raw_data_path
          type: str
        - description: Format of source file (CSV/Parquet/etc)
          name: file_format
          type: str
        - description: List of tickers with successfully retrieved data
          name: company_tickers
          type: List[str]
        - description: List of source platforms (Bloomberg/Yahoo Finance) used
          name: source_platforms
          type: List[str]
        raises:
        - description: If source data file cannot be located at specified path
          type: FileNotFoundError
        - description: If required metrics (earnings, revenues) are missing from source
            data
          type: ValueError
        - description: If unit conversion between currencies or units fails
          type: ConversionError
        returns:
          description: Dictionary containing standardized metrics, source platforms,
            periodic alignment status, and company count with success flag
          type: Dict[str, Any]
        summary: Standardize raw fundamental financial metrics from multiple sources
          into consistent units and reporting periods
    prompt: Reconcile differing reporting standards across 50 companies. Transform
      earnings, revenues, EPS into consistent units and reporting periods. Return
      cleaned dataset with adjusted prices and continuous time intervals.
  clean_price_data:
    agent: false
    description: Standardize pricing dataset.
    name: clean_price_data
    nodes_depended_on:
    - retrieve_historical_price_data
    nodes_dependent_on: []
    output_structure:
    - description: List of 50 instrument symbols/IDs processed.
      key: instruments
      type: List[str]
    - description: List of continuous time intervals in ISO format after cleaning.
      key: timestamp_intervals
      type: List[str]
    - description: Count of missing values resolved for each instrument.
      key: missing_values_handled
      type: List[int]
    - description: Count of duplicate entries removed for each instrument.
      key: duplicates_removed
      type: List[int]
    - description: Count of price discontinuities corrected for each instrument.
      key: price_jumps_adjusted
      type: List[int]
    - description: Boolean indicator if all time intervals are now uniformly continuous.
      key: is_time_continuous
      type: bool
    prd:
      conceptual_info: This node cleans and standardizes raw price data retrieved
        from multiple exchanges, ensuring that missing values, duplicate records,
        and abrupt price jumps are resolved, resulting in a continuous, ready‑to‑use
        time series for each of the 50 target instruments.
      docstring:
        examples:
        - lines:
          - cleaned = clean_price_data('data/raw_prices.parquet')
          - print(cleaned['instruments'][:5])
          output: '[''AAPL'', ''GOOG'', ''MSFT'', ''AMZN'', ''FB'']'
        - lines:
          - 'try:'
          - '    clean_price_data(''nonexistent.csv'')'
          - 'except FileNotFoundError as e:'
          - '    print(e)'
          output: 'FileNotFoundError: No such file or directory: ''nonexistent.csv'''
        parameters:
        - description: File path to the raw pricing data (CSV, Parquet, or other supported
            format) retrieved by the `retrieve_historical_price_data` node.
          name: data_file_path
          type: str
        raises:
        - description: If `data_file_path` does not point to an existing file.
          type: FileNotFoundError
        - description: If the input file cannot be parsed into the expected tabular
            format.
          type: ValueError
        - description: If an unexpected error occurs during the cleaning process (e.g.,
            inconsistent data shapes).
          type: RuntimeError
        returns:
          description: 'A dictionary containing the cleaned pricing information:

            - `instruments`: List of 50 instrument symbols/IDs processed.

            - `timestamp_intervals`: Continuous time intervals in ISO format.

            - `missing_values_handled`: List of counts of missing values resolved
            per instrument.

            - `duplicates_removed`: List of counts of duplicate entries removed per
            instrument.

            - `price_jumps_adjusted`: List of counts of price jumps corrected per
            instrument.

            - `is_time_continuous`: Boolean indicating whether the time series is
            uniformly continuous.'
          type: dict
        summary: clean_price_data cleans raw pricing data by handling missing entries,
          duplicates, and price jumps, returning a standardized dataset with continuous
          time intervals.
    prompt: Identify and resolve missing values, duplicates, and jumps in 50 instrument
      price time series. Return cleaned dataset with adjusted prices and continuous
      time intervals.
  create_risk_framework:
    agent: false
    description: Define capital protection rules
    name: create_risk_framework
    nodes_depended_on:
    - optimize_parameters
    - choose_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: Textual description of the algorithm for determining position size
        per trade
      key: position_sizing_rule
      type: str
    - description: Maximum capital exposure allowed per instrument, expressed as a
        proportion (e.g., 0.02 for 2%)
      key: max_exposure_per_instrument
      type: float
    - description: Portfolio drawdown percentage at which trading halts are triggered
        (e.g., 0.15 for 15%)
      key: drawdown_threshold
      type: float
    - description: Maximum daily profit or loss in monetary terms that the strategy
        can reach before it stops trading
      key: daily_pnl_limit
      type: float
    - description: Description of a fifth risk control such as volatility‑based sizing
        or stop‑loss rule
      key: additional_control_rule
      type: str
    prd:
      conceptual_info: Creates a comprehensive risk framework that protects capital
        by defining how large each position can be, the exposure limits per instrument,
        the drawdown threshold that will trigger a trading halt, the daily profit/loss
        ceiling, and a final rule such as volatility‑based sizing or a stop‑loss mechanism.
        The framework adapts to the chosen strategy type and the optimized parameter
        set to ensure the strategy operates within acceptable risk limits.
      docstring:
        examples:
        - lines:
          - framework = create_risk_framework(strategy_type='market neutral', optimized_parameters=[0.3,
            0.2, 0.5], parameter_names=['beta', 'volatility', 'alpha'])
          - print(framework)
          output: '{''position_sizing_rule'': ''Equal weight long and short with 1%
            equity per trade'', ''max_exposure_per_instrument'': 0.02, ''drawdown_threshold'':
            0.15, ''daily_pnl_limit'': 5000.0, ''additional_control_rule'': ''Volatility-based
            sizing: size ∝ 1/(σ * √lookback)''}'
        - lines:
          - framework = create_risk_framework(strategy_type='trend following', optimized_parameters=[0.25,
            0.35, 0.4], parameter_names=['alpha', 'beta', 'gamma'])
          - print(framework)
          output: '{''position_sizing_rule'': ''Kelly criterion based on win/loss
            ratio'', ''max_exposure_per_instrument'': 0.05, ''drawdown_threshold'':
            0.20, ''daily_pnl_limit'': 10000.0, ''additional_control_rule'': ''Trailing
            stop of 1.5× ATR''}'
        parameters:
        - description: Primary strategy category (e.g., 'market neutral', 'trend following',
            etc.).
          name: strategy_type
          type: str
        - description: List of optimized values for each core strategy parameter returned
            by the genetic algorithm.
          name: optimized_parameters
          type: List[float]
        - description: Names of the core strategy parameters corresponding to the
            optimized_parameters list.
          name: parameter_names
          type: List[str]
        raises:
        - description: Raised if strategy_type is not one of the supported categories.
          type: ValueError
        - description: Raised if lengths of optimized_parameters and parameter_names
            do not match.
          type: ValueError
        returns:
          description: 'Dictionary containing the risk framework fields: position_sizing_rule,
            max_exposure_per_instrument, drawdown_threshold, daily_pnl_limit, and
            additional_control_rule.'
          type: dict
        summary: Creates a risk framework specifying position sizing, exposure limits,
          drawdown halts, daily P&L thresholds, and an additional control rule based
          on the chosen strategy type and optimized parameters.
    prompt: Design 5 risk management controls including position sizing, maximum exposure
      per instrument, drawdown-based trading halts, and daily P&L limits.
  define_strategy_objectives:
    agent: false
    description: Specify the primary goals of the trading strategy
    name: define_strategy_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Target annual return expressed as a percentage
      key: annual_return_target_percentage
      type: float
    - description: Maximum acceptable risk or drawdown expressed as a percentage
      key: maximum_risk_tolerance_percentage
      type: float
    - description: List of asset classes included in the strategy (e.g. equities,
        bonds, commodities)
      key: target_asset_classes
      type: str
    - description: Expected number of trades or signals generated per month
      key: trading_frequency_per_month
      type: int
    - description: Any other specific investment goals or constraints
      key: additional_investment_goals
      type: str
    prd:
      conceptual_info: The define_strategy_objectives node captures the high‑level
        investment objectives that guide the design, optimization, and risk management
        of the quantitative trading strategy. It translates a user‑written textual
        description of return targets, risk limits, asset‑class focus, and trading
        cadence into a structured dictionary that downstream nodes can consume.
      docstring:
        examples:
        - lines:
          - 'print(define_strategy_objectives(''Annual return target: 20%; Max drawdown:
            15%; Asset classes: equities, bonds; Trading frequency: 12; Additional
            goals: ESG compliance.''))'
          output: '{''annual_return_target_percentage'': 20.0, ''maximum_risk_tolerance_percentage'':
            15.0, ''target_asset_classes'': [''equities'', ''bonds''], ''trading_frequency_per_month'':
            12, ''additional_investment_goals'': [''ESG compliance'']}'
        - lines:
          - 'print(define_strategy_objectives(''Annual return target: 15%; Max risk
            tolerance: 10%; Asset classes: equities; Trading frequency: 8; Additional
            investment goals: low volatility.''))'
          output: '{''annual_return_target_percentage'': 15.0, ''maximum_risk_tolerance_percentage'':
            10.0, ''target_asset_classes'': [''equities''], ''trading_frequency_per_month'':
            8, ''additional_investment_goals'': [''low volatility'']}'
        parameters:
        - description: A string containing the user’s investment objective specification.
            The prompt should mention the annual return target, maximum risk tolerance,
            asset classes, trading frequency, and optionally any extra goals.
          name: prompt
          type: str
        raises:
        - description: If any of the required fields (return target, risk tolerance,
            asset classes, or trading frequency) cannot be found or parsed from the
            prompt.
          type: ValueError
        - description: If the prompt argument is not a string.
          type: TypeError
        returns:
          description: 'A dictionary with keys:


            - annual_return_target_percentage (float)

            - maximum_risk_tolerance_percentage (float)

            - target_asset_classes (list of str)

            - trading_frequency_per_month (int)

            - additional_investment_goals (list of str)


            Each key maps to the corresponding value extracted from the prompt.'
          type: dict
        summary: Parse a textual description of investment objectives and return a
          structured dictionary containing target return, risk tolerance, asset classes,
          trading frequency, and any additional constraints.
    prompt: Define 3-5 specific investment goals (e.g. annual return target, risk
      constraints, asset classes, trading frequency). Focus only on objectives, not
      implementation details.
  define_strategy_parameters:
    agent: false
    description: Establish model rules in mathematical terms
    name: define_strategy_parameters
    nodes_depended_on:
    - choose_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: Names of the 5 core strategy parameters
      key: parameter_names
      type: List[str]
    - description: Mathematical expressions defining each parameter
      key: parameter_expressions
      type: List[str]
    - description: Minimum exploration bounds for each parameter
      key: parameter_min_values
      type: List[float]
    - description: Maximum exploration bounds for each parameter
      key: parameter_max_values
      type: List[float]
    prd:
      conceptual_info: Defines the quantitative hyper‑parameters that govern signal
        generation and risk management for a selected strategy type. The node produces
        a set of parameter names, their mathematical definitions, and feasible search
        ranges for subsequent optimisation.
      docstring:
        examples:
        - lines:
          - params = define_strategy_parameters('momentum')
          - print(params)
          output: '{''parameter_names'': [''fast_period'', ''slow_period'', ''volatility_window'',
            ''factor_weight'', ''signal_threshold''], ''parameter_expressions'': [''EMA(price,
            fast_period)'', ''EMA(price, slow_period)'', ''sqrt(Var(price, volatility_window))'',
            ''weight * factor'', ''threshold''], ''parameter_min_values'': [5.0, 20.0,
            10.0, 0.1, 0.01], ''parameter_max_values'': [20.0, 50.0, 60.0, 1.0, 0.1]}'
        - lines:
          - params = define_strategy_parameters('mean reversion')
          - print(params['parameter_min_values'])
          - print(params['parameter_max_values'])
          output: '[5.0, 10.0, 15.0, 0.2, 0.05]

            [30.0, 60.0, 45.0, 1.0, 0.15]'
        parameters:
        - description: Primary strategy category returned by `choose_strategy_type`.
            Expected values are 'market neutral', 'statistical arbitrage', 'momentum',
            'mean reversion', or 'trend following'.
          name: strategy_type
          type: str
        raises:
        - description: If `strategy_type` is not one of the recognised strategy categories.
          type: ValueError
        returns:
          description: A dictionary with keys 'parameter_names', 'parameter_expressions',
            'parameter_min_values', and 'parameter_max_values', each mapping to a
            list of strings or floats. The lists are aligned by index so that the
            i‑th element of each list corresponds to the same parameter.
          type: dict
        summary: Generate core strategy parameters from a strategy type. The function
          receives the chosen strategy category and returns four parallel lists containing
          parameter names, their mathematical expressions, and min/max bounds for
          hyper‑parameter tuning.
    prompt: Define 5 core parameters and their mathematical expressions (e.g. MACD
      periods, volatility decay model, factor weights). Specify parameter ranges for
      exploration.
  develop_algorithmic_logic:
    agent: false
    description: Create signal generation equations
    name: develop_algorithmic_logic
    nodes_depended_on:
    - choose_strategy_type
    - define_strategy_parameters
    nodes_dependent_on: []
    output_structure:
    - description: Number of signal generation equations formulated
      key: equation_count
      type: int
    - description: List of mathematical equations generating 0-1 signals; each equation
        is expressed in standard mathematical notation
      key: equations
      type: List[str]
    - description: Weighting factors used within each equation (one per equation)
      key: weight_factors
      type: List[float]
    - description: Lookback window in days for each equation (one per equation)
      key: lookback_windows
      type: List[int]
    - description: Normalization method applied in each equation (e.g., z-score, min-max,
        log) (one per equation)
      key: normalization_methods
      type: List[str]
    - description: 'Range of the output signal: 0-1'
      key: output_signal_range
      type: str
    prd:
      conceptual_info: The develop_algorithmic_logic node synthesizes a set of weighted,
        normalized mathematical expressions that transform raw market and factor inputs
        into binary signals (0 or 1). These equations are tailored to the chosen strategy
        type and its core parameter definitions, ensuring that the resulting signals
        are aligned with the strategy’s objectives and risk profile.
      docstring:
        examples:
        - lines:
          - output = develop_algorithmic_logic(
          - '    strategy_type=''momentum'','
          - '    parameter_names=[''short_window'', ''long_window'', ''vol_window''],'
          - '    parameter_expressions=[''5'', ''20'', ''10''],'
          - '    parameter_min_values=[2.0, 10.0, 5.0],'
          - '    parameter_max_values=[10.0, 40.0, 20.0])'
          output: '{''equation_count'': 3, ''equations'': [''sig1 = ((price_t - price_{t-5})
            / price_{t-5}) * w1'', ''sig2 = ((price_t - price_{t-20}) / price_{t-20})
            * w2'', ''sig3 = vol_t * w3''], ''weight_factors'': [0.5, 0.3, 0.2], ''lookback_windows'':
            [5, 20, 10], ''normalization_methods'': [''z-score'', ''min-max'', ''log''],
            ''output_signal_range'': ''0-1''}'
        - lines:
          - output = develop_algorithmic_logic(
          - '    strategy_type=''mean_reversion'','
          - '    parameter_names=[''lookback'', ''threshold'', ''vol_scale'', ''alpha''],'
          - '    parameter_expressions=[''10'', ''1.5'', ''0.5'', ''0.8''],'
          - '    parameter_min_values=[5.0, 0.5, 0.1, 0.5],'
          - '    parameter_max_values=[20.0, 3.0, 1.0, 1.0])'
          output: '{''equation_count'': 4, ''equations'': [''sig1 = ((price_t - SMA_t10)
            / vol_t10) * w1'', ''sig2 = (vol_t / vol_t10) * w2'', ''sig3 = exp(-alpha
            * ((price_t - SMA_t10)**2)) * w3'', ''sig4 = (1 if price_t < SMA_t10 -
            threshold * vol_t10 else 0) * w4''], ''weight_factors'': [0.4, 0.3, 0.2,
            0.1], ''lookback_windows'': [10, 10, 10, 10], ''normalization_methods'':
            [''z-score'', ''min-max'', ''log'', ''threshold''], ''output_signal_range'':
            ''0-1''}'
        parameters:
        - description: Primary strategy category selected by the choose_strategy_type
            node.
          name: strategy_type
          type: str
        - description: List of the 5 core parameter names defined by define_strategy_parameters.
          name: parameter_names
          type: List[str]
        - description: Mathematical expressions for each core parameter.
          name: parameter_expressions
          type: List[str]
        - description: Minimum exploration bounds for each core parameter.
          name: parameter_min_values
          type: List[float]
        - description: Maximum exploration bounds for each core parameter.
          name: parameter_max_values
          type: List[float]
        raises:
        - description: If the lengths of parameter lists do not match or if strategy_type
            is unsupported.
          type: ValueError
        - description: If any input parameter is of an incorrect type.
          type: TypeError
        returns:
          description: 'Dictionary containing signal generation equations and associated
            metadata:

            - equation_count (int): Number of equations.

            - equations (List[str]): Equations in standard notation.

            - weight_factors (List[float]): Weight for each equation.

            - lookback_windows (List[int]): Lookback days for each equation.

            - normalization_methods (List[str]): Normalization method used per equation.

            - output_signal_range (str): Expected signal range, always ''0-1''.'
          type: dict
        summary: Generates a collection of signal equations based on the selected
          strategy type and its core parameters, returning equations, weights, lookback
          windows, and normalization methods.
    prompt: Formulate 3-5 mathematical equations to transform inputs into 0-1 signals.
      Include weighting factors, lookback windows, and normalization.
  document_live_trading_plan:
