dag_type: plain_text
description: A workflow defining elemental steps to perform a generic 'test' by clarifying
  the test type, gathering inputs, running the test execution, and reporting results.
name: execute_test_procedure
nodes:
  analyze_test_results:
    agent: false
    description: Evaluate the test outputs against expected outcomes to determine
      pass/fail status.
    name: analyze_test_results
    nodes_depended_on:
    - collect_test_results
    nodes_dependent_on:
    - generate_test_report
    prompt: Analyze the collected test results by comparing them to expected results
      or criteria. Conclude whether the test passes or fails with a brief explanation.
  collect_test_results:
    agent: false
    description: Gather all outputs, logs, and data produced by the test execution.
    name: collect_test_results
    nodes_depended_on:
    - execute_test
    nodes_dependent_on:
    - analyze_test_results
    prompt: Collect and organize all result data produced from the test run, including
      logs, output files, and performance metrics.
  define_test_objective:
    agent: false
    description: Clarify and specify the exact objective and purpose of the test to
      be conducted.
    name: define_test_objective
    nodes_depended_on: []
    nodes_dependent_on:
    - identify_test_type
    - gather_test_requirements
    prompt: Define clearly what the test is intended to validate or verify. State
      the objective in one concise sentence focusing strictly on the test's purpose.
  execute_test:
    agent: false
    description: Run the actual test using the prepared environment and gathered inputs.
    name: execute_test
    nodes_depended_on:
    - prepare_test_environment
    - gather_test_inputs
    nodes_dependent_on:
    - collect_test_results
    prompt: Perform the test execution as per the test type, using the provided inputs
      and environment. Document any immediate observations strictly from the execution.
  gather_test_inputs:
    agent: false
    description: Collect or generate all input data or parameters needed for the test
      execution.
    name: gather_test_inputs
    nodes_depended_on:
    - identify_test_type
    nodes_dependent_on:
    - execute_test
    prompt: Collect or create all required inputs for the test consistent with the
      test type. List each input and its expected format or value range.
  gather_test_requirements:
    agent: false
    description: List out all prerequisites, conditions, and resources needed for
      the test.
    name: gather_test_requirements
    nodes_depended_on:
    - define_test_objective
    nodes_dependent_on:
    - prepare_test_environment
    prompt: Enumerate all requirements necessary to perform the test including data,
      environment specifications, tools, and configurations. Provide a bullet list.
  generate_test_report:
    agent: false
    description: Create a clear and concise report summarizing test objectives, procedure,
      outcomes, and conclusions.
    name: generate_test_report
    nodes_depended_on:
    - analyze_test_results
    nodes_dependent_on: []
    prompt: Produce a final report capturing the test objective, environment, inputs,
      results, pass/fail status, and any recommendations or remarks. Use clear, concise
      language.
  identify_test_type:
    agent: false
    description: Determine the specific category or type of test to be performed based
      on the objective.
    name: identify_test_type
    nodes_depended_on:
    - define_test_objective
    nodes_dependent_on:
    - gather_test_inputs
    prompt: Identify the type of test appropriate for the defined objective (e.g.,
      functional, performance, usability). Provide a one-sentence justification.
  prepare_test_environment:
    agent: false
    description: Set up and configure the environment and tools required to run the
      test.
    name: prepare_test_environment
    nodes_depended_on:
    - gather_test_requirements
    nodes_dependent_on:
    - execute_test
    prompt: Configure the test environment according to the specified requirements.
      This includes hardware, software, network, and any necessary setup steps.
