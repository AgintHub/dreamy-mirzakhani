        returns:
          description: A dictionary containing the dropcopy source's unique identifier
            (source_id), its human-readable name (source_name), the URI or path to
            the source (source_uri), and a boolean flag (is_accessible) indicating
            whether the source was verified as accessible and ready for extraction.
          type: dict
        summary: Identifies the authoritative dropcopy source within the pico datacenter
          leveraging validated OAuth authentication to ensure secure, authorized,
          and compliant access.
    prompt: Using secure OAuth authentication, identify the specific, authoritative
