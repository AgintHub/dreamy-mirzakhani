      type: str
    - description: True if connection was successfully established, False otherwise.
      key: is_connected
      type: bool
    - description: Unique identifier for the established connection session.
      key: connection_id
      type: str
    - description: Error message if the connection attempt failed; empty string otherwise.
      key: error_message
      type: str
    prd:
      conceptual_info: This node is responsible for initiating a secure connection
        to the Pico datacenter by performing an OAuth 2.0 authentication flow. It
        ensures secure delegated access by obtaining and managing valid access tokens,
        and establishing an encrypted connection in compliance with modern identity
        and access management standards.
      docstring:
