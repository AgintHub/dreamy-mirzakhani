  test_overfitting:
    agent: false
    description: Detect excessive parameter fitting
    name: test_overfitting
    nodes_depended_on:
    - execute_out_of_sample
    nodes_dependent_on: []
    output_structure:
    - description: Names of performance metrics evaluated
      key: metric_names
      type: str
    - description: Performance metric values from the original optimized set
      key: baseline_values
      type: float
    - description: Mean performance metric values across all perturbed parameter sets
      key: perturbed_mean_values
      type: float
    - description: Standard deviation of performance metric values across perturbed
        parameter sets
      key: perturbed_std_values
      type: float
    - description: Minimum performance metric values observed across perturbed parameter
        sets
      key: perturbed_min_values
      type: float
    - description: Maximum performance metric values observed across perturbed parameter
        sets
      key: perturbed_max_values
      type: float
    - description: Magnitude of parameter perturbations applied (±20%)
      key: perturbation_percentage
      type: float
    - description: Number of perturbed parameter samples generated
      key: sample_count
      type: int
    - description: Flag indicating whether performance deviation suggests overfitting
      key: overfitting_detected
      type: bool
    prd:
      conceptual_info: Evaluates the robustness of the optimized strategy to parameter
        perturbations by performing out‑of‑sample evaluations on randomly perturbed
        parameter sets, summarizing the performance distribution relative to the baseline
        optimized set.
      docstring:
        examples:
        - lines:
          - result = test_overfitting(metric_names=['cagr', 'sharpe'], baseline_values=[0.15,
            1.5], optimized_params=[0.1, 0.2], sample_count=3, perturbation_percentage=0.2)
          - print(result)
          output: '{''metric_names'': [''cagr'', ''sharpe''], ''baseline_values'':
            [0.15, 1.5], ''perturbed_mean_values'': [0.14, 1.48], ''perturbed_std_values'':
            [0.01, 0.05], ''perturbed_min_values'': [0.13, 1.42], ''perturbed_max_values'':
            [0.16, 1.55], ''perturbation_percentage'': 0.2, ''sample_count'': 3, ''overfitting_detected'':
            False}'
        - lines:
          - result = test_overfitting(metric_names=['cagr'], baseline_values=[0.12],
            optimized_params=[0.05], sample_count=5, perturbation_percentage=0.2)
          - print(result)
          output: '{''metric_names'': [''cagr''], ''baseline_values'': [0.12], ''perturbed_mean_values'':
            [0.119], ''perturbed_std_values'': [0.003], ''perturbed_min_values'':
            [0.115], ''perturbed_max_values'': [0.123], ''perturbation_percentage'':
            0.2, ''sample_count'': 5, ''overfitting_detected'': False}'
        parameters:
        - description: Names of the performance metrics to compare.
          name: metric_names
          type: List[str]
        - description: Baseline metric values obtained from the original optimized
            parameter set.
          name: baseline_values
          type: List[float]
        - description: The optimized parameter values used to generate the baseline.
          name: optimized_params
          type: List[float]
        - description: Number of random perturbed parameter sets to generate (default
            5).
          name: sample_count
          type: int
        - description: Magnitude of ± perturbation applied to each parameter (default
            0.2 for 20%).
          name: perturbation_percentage
          type: float
        raises:
        - description: Raised if metric_names and baseline_values lists are of unequal
            length.
          type: ValueError
        - description: Raised if any perturbed evaluation fails.
          type: RuntimeError
        returns:
          description: Dictionary containing performance metric statistics and overfitting
            detection flag.
          type: Dict[str, Any]
        summary: Detects overfitting by perturbing strategy parameters and evaluating
          out-of-sample performance metrics.
    prompt: Conduct stability test with parameter perturbations of ±20% and 5x random
      samples. Chart performance distribution vs. original optimized set.
  verify_backtest_integrity:
