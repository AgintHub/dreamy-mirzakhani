dag_type: plain_text
description: Workflow that splits the start signal into three parallel start steps
  before executing two independent tasks and then finalizing the result.
name: simple_parallel_fanout_with_start_split
nodes:
  finalize_step:
    agent: false
    description: Combine the outputs of the two parallel tasks into a final result.
    name: finalize_step
    nodes_depended_on:
    - parallel_step_one
    - parallel_step_two
    nodes_dependent_on: []
    prompt: Take the results from parallel_step_one and parallel_step_two and output
      a combined summary sentence.
  parallel_step_one:
    agent: false
    description: Perform the first independent task after receiving the split start
      signals.
    name: parallel_step_one
    nodes_depended_on:
    - start_part_one
    - start_part_two
    - start_part_three
    nodes_dependent_on: []
    prompt: When the inputs include "START" from all three start parts, output the
      result of task one as a short sentence.
  parallel_step_two:
    agent: false
    description: Perform the second independent task after receiving the split start
      signals.
    name: parallel_step_two
    nodes_depended_on:
    - start_part_one
    - start_part_two
    - start_part_three
    nodes_dependent_on: []
    prompt: When the inputs include "START" from all three start parts, output the
      result of task two as a short sentence.
  start_part_one:
    agent: false
    description: Emit the initial start token as the first part of the split start
      signal.
    name: start_part_one
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Output the token "START" as the first part of the start signal.
  start_part_three:
    agent: false
    description: Emit the initial start token as the third part of the split start
      signal.
    name: start_part_three
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Output the token "START" as the third part of the start signal.
  start_part_two:
    agent: false
    description: Emit the initial start token as the second part of the split start
      signal.
    name: start_part_two
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Output the token "START" as the second part of the start signal.
