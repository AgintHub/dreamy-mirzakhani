      type: str
    - description: End date of the in-sample period (YYYY-MM-DD)
      key: in_sample_end
      type: str
    - description: Start date of the out-of-sample period (YYYY-MM-DD)
      key: out_sample_start
      type: str
    - description: End date of the out-of-sample period (YYYY-MM-DD)
      key: out_sample_end
      type: str
    - description: Minimum number of Monte Carlo simulations to run
      key: montecarlo_min
      type: int
    - description: Maximum number of Monte Carlo simulations to run
      key: montecarlo_max
      type: int
    - description: List of window sizes (in days) for walk-forward analysis
      key: walkforward_window_days
      type: List[int]
    prd:
      conceptual_info: This node establishes the temporal and stochastic bounds for
        backtesting a quantitative strategy. It defines the in‑sample and out‑of‑sample
        windows, the range of Monte Carlo simulation counts, and the schedule for
        walk‑forward validation. The configuration produced here is consumed by downstream
        nodes that execute the backtests, optimize parameters, and validate out‑of‑sample
        performance.
      docstring:
        examples:
        - lines:
          - config = set_backtest_parameters(
          - '    in_sample_start=''2020-01-01'','
          - '    in_sample_end=''2021-12-31'','
          - '    out_sample_start=''2022-01-01'','
          - '    out_sample_end=''2022-12-31'','
          - '    montecarlo_min=1000,'
          - '    montecarlo_max=5000,'
          - '    walkforward_window_days=[90, 180, 360])'
          output: '{''in_sample_start'': ''2020-01-01'', ''in_sample_end'': ''2021-12-31'',
            ''out_sample_start'': ''2022-01-01'', ''out_sample_end'': ''2022-12-31'',
            ''montecarlo_min'': 1000, ''montecarlo_max'': 5000, ''walkforward_window_days'':
            [90, 180, 360]}'
        - lines:
          - '# Invalid example: in_sample_end before start'
          - set_backtest_parameters(
          - '    in_sample_start=''2021-01-01'','
          - '    in_sample_end=''2020-12-31'','
          - '    out_sample_start=''2021-01-01'','
          - '    out_sample_end=''2021-12-31'','
          - '    montecarlo_min=500,'
          - '    montecarlo_max=2000,'
          - '    walkforward_window_days=[30, 60])'
          output: 'ValueError: in_sample_end must be after in_sample_start'
        parameters:
        - description: Start date of the in-sample period in 'YYYY-MM-DD' format.
          name: in_sample_start
          type: str
        - description: End date of the in-sample period in 'YYYY-MM-DD' format.
          name: in_sample_end
          type: str
        - description: Start date of the out-of-sample period in 'YYYY-MM-DD' format.
          name: out_sample_start
          type: str
        - description: End date of the out-of-sample period in 'YYYY-MM-DD' format.
          name: out_sample_end
          type: str
        - description: Minimum number of Monte Carlo simulations to run.
          name: montecarlo_min
          type: int
        - description: Maximum number of Monte Carlo simulations to run.
          name: montecarlo_max
          type: int
        - description: Sequence of window sizes (in days) for walk‑forward analysis.
            Each element defines the length of a training window before a test window
            is applied.
          name: walkforward_window_days
          type: List[int]
        raises:
        - description: If any date string is not in ISO format or if `in_sample_end`
            precedes `in_sample_start`.
          type: ValueError
        - description: If `montecarlo_min` is greater than `montecarlo_max` or if
            any window size in `walkforward_window_days` is non‑positive.
          type: ValueError
        returns:
          description: Dictionary containing the seven configuration fields specified
            in `output_structure`.
          type: Dict[str, Any]
        summary: Configure the backtesting framework for a quantitative strategy.
    prompt: 'Define three test configurations: in-sample (date range), out-of-sample
      (date range), Monte Carlo (parameter range). Include walk-forward analysis schedule.'
    shims: []
  set_performance_benchmarks:
    agent: false
    code_node_type: stub
    description: Define quantifiable success metrics
    implementation: "from pydantic import BaseModel, Field\n\n\nclass DefineStrategyObjectiveOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_strategy_objective node outputs.\"\"\"\n\
      \    strategy_sentence: str = (\n        Field(..., description=\"A concise\
      \ one\\u2011sentence statement of the strategy's objective\")\n    )\n    cagr_target:\
      \ float = (\n        Field(..., description=\"Target Compound Annual Growth\
      \ Rate (CAGR) expressed as a decimal\")\n    )\n    annual_vol_target: float\
      \ = (\n        Field(..., description=\"Maximum acceptable annual volatility\
      \ expressed as a decimal\")\n    )\n    max_drawdown: float = (\n        Field(...,\
      \ description=\"Maximum drawdown limit expressed as a decimal\")\n    )\n  \
      \  sharpe_goal: float = (\n        Field(..., description=\"Target Sharpe ratio\
      \ to be achieved\")\n    )\n\n\nclass SetPerformanceBenchmarksOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_performance_benchmarks node outputs.\"\"\"\
      \n    cagr_target: float = (\n        Field(..., description=\"Target compound\
      \ annual growth rate in decimal form (e.g., 0.15 for 15%)\")\n    )\n    annual_volatility_constraint:\
      \ float = (\n        Field(..., description=\"Maximum acceptable annual volatility\
      \ in decimal form (e.g., 0.20 for 20%)\")\n    )\n    drawdown_limit: float\
      \ = (\n        Field(..., description=\"Maximum allowable drawdown expressed\
      \ as a decimal (e.g., 0.25 for 25%)\")\n    )\n    sharpe_ratio_goal: float\
      \ = (\n        Field(..., description=\"Target Sharpe ratio to be achieved by\
      \ the strategy\")\n    )\n\n\ndef set_performance_benchmarks(define_strategy_objective_input:\
      \ DefineStrategyObjectiveOutput, **kwargs) -> SetPerformanceBenchmarksOutput:\n\
      \    \"\"\"\n    Parse performance benchmark parameters from user input and\
      \ return a\n    dictionary of numerical metrics.\n\n    Parameters\n    ----------\n\
      \    input_text : str\n        Raw prompt response containing numeric values\
      \ for CAGR, volatility,\n        drawdown, and Sharpe ratio. Example: \"0.12,\
      \ 0.18, 0.25, 1.5\".\n\n    Returns\n    -------\n    Dict[str, float]\n   \
      \     Dictionary with keys 'cagr_target', 'annual_volatility_constraint',\n\
      \        'drawdown_limit', and 'sharpe_ratio_goal', each mapped to a float\n\
      \        value.\n\n    Raises\n    ------\n    ValueError\n        If the input\
      \ cannot be parsed into exactly four numeric values or if\n        any value\
      \ is out of a reasonable range (e.g., negative CAGR).\n    TypeError\n     \
      \   If the input is not a string.\n\n    Examples\n    --------\n    >>> benchmarks\
      \ = set_performance_benchmarks('0.15, 0.20, 0.25, 1.8')\n    {'cagr_target':\
      \ 0.15, 'annual_volatility_constraint': 0.20,\n    'drawdown_limit': 0.25, 'sharpe_ratio_goal':\
      \ 1.8}\n\n    >>> benchmarks = set_performance_benchmarks('12%, 20%, 25%, 1.8')\n\
      \    {'cagr_target': 0.12, 'annual_volatility_constraint': 0.20,\n    'drawdown_limit':\
      \ 0.25, 'sharpe_ratio_goal': 1.8}\n\n    \"\"\"\n    return SetPerformanceBenchmarksOutput(\n\
      \        cagr_target=0.0,\n        annual_volatility_constraint=0.0,\n     \
      \   drawdown_limit=0.0,\n        sharpe_ratio_goal=0.0,\n    )"
    name: set_performance_benchmarks
    nodes_depended_on:
    - define_strategy_objective
    nodes_dependent_on: []
    output_structure:
