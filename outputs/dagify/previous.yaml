dag_type: plain_text
description: Identify underlying songs from an audio snippet and redirect to musicians'
  pages
name: audiosamplesongidentifier
nodes:
  extractaudiofeatures:
    agent: false
    description: Extract relevant audio features from the input snippet
    name: extractaudiofeatures
    nodes_depended_on: []
    nodes_dependent_on:
    - identifypotentialsongs
    prompt: Extract audio features such as melody, rhythm, and spectral characteristics
      from the input audio snippet.
  formatredirectlinks:
    agent: false
    description: Format the retrieved musician information into redirect links
    name: formatredirectlinks
    nodes_depended_on:
    - retrievemusicianinfo
    nodes_dependent_on: []
    prompt: Format the retrieved musician information into clickable links or redirect
      URLs that the user can access.
  identifypotentialsongs:
    agent: false
    description: Compare extracted features against a database to identify potential
      matching songs
    name: identifypotentialsongs
    nodes_depended_on:
    - extractaudiofeatures
    nodes_dependent_on:
    - verifysongmatches
    prompt: Use the extracted audio features to query a database of song features
      and identify potential matching songs.
  retrievemusicianinfo:
    agent: false
    description: Retrieve information about the musicians associated with the verified
      song matches
    name: retrievemusicianinfo
    nodes_depended_on:
    - verifysongmatches
    nodes_dependent_on:
    - formatredirectlinks
    prompt: Query a database or API to retrieve information about the musicians associated
      with the verified song matches, including their profile pages or relevant links.
  verifysongmatches:
    agent: false
    description: Verify the identified potential song matches using a more detailed
      comparison
    name: verifysongmatches
    nodes_depended_on:
    - identifypotentialsongs
    nodes_dependent_on:
    - retrievemusicianinfo
    prompt: Perform a more detailed comparison between the input audio snippet and
      the identified potential song matches to verify the matches.
