dag_type: plain_text
description: Analyze audio file to identify sampled content, then search for original
  songs, and display the results to the user.
name: detect_sampled_songs
nodes:
  detect_sampled_content:
    agent: false
    description: Execute a machine learning model to detect potential samples and
      return their corresponding timestamps.
    name: detect_sampled_content
    nodes_depended_on:
    - prepare_audio_file
    nodes_dependent_on:
    - search_for_sampled_songs
    prompt: Use machine learning techniques to identify segments of the audio that
      might be sampled from other songs. Return the sampling timestamps.
  display_results:
    agent: false
    description: Render the information collected in a user-friendly interface, showcasing
      the sampled songs and related music items.
    name: display_results
    nodes_depended_on:
    - find_related_music
    nodes_dependent_on: []
    prompt: Visualize the results of the analysis, including sampled songs, musicians'
      pages, and related music. Provide a concise and easy-to-read summary.
  fetch_musician_pages:
    agent: false
    description: Call the API of a music service to fetch the pages for the identified
      musicians.
    name: fetch_musician_pages
    nodes_depended_on:
    - search_for_sampled_songs
    nodes_dependent_on:
    - find_related_music
    prompt: Retrieve relevant information about the musicians that created the sampled
      songs, such as musician IDs and other identifying data.
  find_related_music:
    agent: false
    description: Retrieve related music items from a music service API, such as albums
      or artists by the same musician.
    name: find_related_music
    nodes_depended_on:
    - fetch_musician_pages
    nodes_dependent_on:
    - display_results
    prompt: Search for other music related to the musicians, such as similar artists,
      albums, or tracks.
  prepare_audio_file:
    agent: false
    description: Process the uploaded audio file for analysis.
    name: prepare_audio_file
    nodes_depended_on:
    - upload_audio_file
    nodes_dependent_on:
    - detect_sampled_content
    prompt: Prepare the uploaded audio file by loading necessary libraries and importing
      sound analysis tools.
  search_for_sampled_songs:
    agent: false
    description: Lookup the songs that the samples correspond to in a reliable music
      database.
    name: search_for_sampled_songs
    nodes_depended_on:
    - detect_sampled_content
    nodes_dependent_on:
    - fetch_musician_pages
    prompt: Query a music database using the identified samples and corresponding
      timestamps to find the original songs.
  upload_audio_file:
    agent: false
    description: Upload an audio file or provide a direct link for analysis.
    name: upload_audio_file
    nodes_depended_on: []
    nodes_dependent_on:
    - prepare_audio_file
    prompt: Upload a piece of audio from a song to analyze for sampled content. Provide
      a clear link or upload the file directly.
