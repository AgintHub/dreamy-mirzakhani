dag_type: plain_text
description: A minimal workflow that verifies the literal string 'test' by checking
  its type, comparing its value, and producing a pass/fail result.
name: simple_test_workflow
nodes:
  check_type:
    agent: false
    description: Confirm the input is a string.
    name: check_type
    nodes_depended_on:
    - provide_input
    nodes_dependent_on:
    - generate_output
    prompt: Verify that the input is of type string. If it is not, produce an error
      message.
  compare_value:
    agent: false
    description: Compare the input string to the expected value.
    name: compare_value
    nodes_depended_on:
    - provide_input
    nodes_dependent_on:
    - generate_output
    prompt: Compare the input string to the literal 'test'. Return true if they match,
      false otherwise.
  generate_output:
    agent: false
    description: Produce the final pass/fail result.
    name: generate_output
    nodes_depended_on:
    - check_type
    - compare_value
    nodes_dependent_on: []
    prompt: If the comparison result is true, output 'PASS'; otherwise output 'FAIL'.
  provide_input:
    agent: false
    description: Provide the test input string.
    name: provide_input
    nodes_depended_on: []
    nodes_dependent_on:
    - check_type
    - compare_value
    prompt: Return the string 'test' as the input for this workflow.
