dag_type: plain_text
description: A DAG that implements quicksort using pure functional programming, where
  each function (partition, recursive sort, concatenate, base‑case check) is represented
  as an independent, stateless node.
name: functional_quicksort_workflow
nodes:
  check_base_case:
    agent: false
    description: Determine if the list is empty or has a single element (the base
      case of quicksort).
    name: check_base_case
    nodes_depended_on:
    - input_list
    nodes_dependent_on:
    - return_base_case
    - select_pivot
    prompt: Given the input list, output true if its length is 0 or 1, otherwise false.
  concatenate_results:
    agent: false
    description: Combine sorted_less, pivot, and sorted_greater into the final sorted
      list.
    name: concatenate_results
    nodes_depended_on:
    - sorted_less
    - sorted_greater
    - select_pivot
    nodes_dependent_on:
    - final_output
    prompt: Return a new list formed by concatenating the sorted_less list, then the
      pivot element, then the sorted_greater list.
  final_output:
    agent: false
    description: Produce the final sorted list as the output of the workflow.
    name: final_output
    nodes_depended_on:
    - concatenate_results
    - return_base_case
    nodes_dependent_on: []
    prompt: If the base case path was taken, output the list from 'return_base_case';
      otherwise, output the list from 'concatenate_results'.
  input_list:
    agent: false
    description: Receive the list of values to be sorted.
    name: input_list
    nodes_depended_on: []
    nodes_dependent_on:
    - check_base_case
    prompt: Provide the list of elements (e.g., [3, 1, 4, 1, 5, 9]) that should be
      sorted using quicksort.
  partition_greater:
    agent: false
    description: Create a sub‑list of all elements greater than or equal to the pivot.
    name: partition_greater
    nodes_depended_on:
    - select_pivot
    - input_list
    nodes_dependent_on:
    - sort_greater
    prompt: From the input list (excluding the pivot), filter and return all elements
      that are greater than or equal to the pivot.
  partition_less:
    agent: false
    description: Create a sub‑list of all elements less than the pivot.
    name: partition_less
    nodes_depended_on:
    - select_pivot
    - input_list
    nodes_dependent_on:
    - sort_less
    prompt: From the input list (excluding the pivot), filter and return all elements
      that are strictly less than the pivot.
  return_base_case:
    agent: false
    description: If the base case is true, return the list unchanged.
    name: return_base_case
    nodes_depended_on:
    - check_base_case
    - input_list
    nodes_dependent_on: []
    prompt: If the previous step indicated a base case, echo back the original list
      as the sorted result.
  select_pivot:
    agent: false
    description: Choose the first element of the list as the pivot for partitioning.
    name: select_pivot
    nodes_depended_on:
    - check_base_case
    - input_list
    nodes_dependent_on:
    - partition_less
    - partition_greater
    prompt: Extract the first element of the input list and output it as the pivot
      value.
  sort_greater:
    agent: false
    description: Recursively apply quicksort to the 'greater' sub‑list.
    name: sort_greater
    nodes_depended_on:
    - partition_greater
    nodes_dependent_on:
    - sorted_greater
    prompt: Apply the same quicksort workflow to the list produced by 'partition_greater'
      and output the sorted sub‑list.
  sort_less:
    agent: false
    description: Recursively apply quicksort to the 'less' sub‑list.
    name: sort_less
    nodes_depended_on:
    - partition_less
    nodes_dependent_on:
    - sorted_less
    prompt: Apply the same quicksort workflow to the list produced by 'partition_less'
      and output the sorted sub‑list.
  sorted_greater:
    agent: false
    description: Capture the result of sorting the 'greater' sub‑list.
    name: sorted_greater
    nodes_depended_on:
    - sort_greater
    nodes_dependent_on:
    - concatenate_results
    prompt: Pass through the sorted output received from 'sort_greater'.
  sorted_less:
    agent: false
    description: Capture the result of sorting the 'less' sub‑list.
    name: sorted_less
    nodes_depended_on:
    - sort_less
    nodes_dependent_on:
    - concatenate_results
    prompt: Pass through the sorted output received from 'sort_less'.
