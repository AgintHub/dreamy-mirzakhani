          - '    ''client_id'': ''invalid'','
          - '    ''client_secret'': ''wrong'','
          - '    ''token_url'': ''https://auth.pico.example.com/token'','
          - '    ''scopes'': [''read'']'
          - '}'
          - result = establish_pico_connection(oauth_creds)
          - print(result['connection_status'], result['error_message'])
          output: '''failed Invalid client credentials provided.'''
        parameters:
        - description: A dictionary containing the necessary OAuth 2.0 credentials
            and configuration, such as client ID, client secret, token endpoint URL,
            and scopes.
          name: oauth_credentials
          type: dict
        raises:
        - description: If unable to establish a network connection to the Pico datacenter.
          type: ConnectionError
        - description: If OAuth credentials are invalid or authentication fails.
          type: AuthenticationError
        - description: If the connection or authentication attempt times out.
          type: TimeoutError
        returns:
          description: A dictionary summarizing the connection status including access
