    - description: Target annual volatility for the chosen strategy
      key: annual_volatility
      type: float
    - description: Target Sharpe ratio for the chosen strategy
      key: Sharpe_ratio
      type: float
    - description: Target maximum drawdown for the chosen strategy
      key: maximum_drawdown
      type: float
    - description: List of performance targets for the chosen strategy
      key: performance_targets
      type: float
    - description: List of risk targets for the chosen strategy
      key: risk_targets
      type: float
    prd:
      conceptual_info: This node sets performance and risk targets for the chosen
        investment strategy.
      docstring:
        examples:
        - lines:
          - performance_targets = set_performance_and_risk_targets('long_short_equity')
          - print(performance_targets)
          output: '{annual_gross_return: 10, annual_volatility: 5, Sharpe_ratio: 2,
            maximum_drawdown: 2, performance_targets: [10, 5, 2, 2, 1], risk_targets:
            [5, 5, 1, 1, 1]}'
        - lines:
          - risk_targets = set_performance_and_risk_targets('global_macro')
          - print(risk_targets)
          output: '{annual_gross_return: 8, annual_volatility: 10, Sharpe_ratio: 3,
            maximum_drawdown: 3, performance_targets: [8, 10, 3, 3, 1], risk_targets:
            [10, 5, 1, 1, 1]}'
