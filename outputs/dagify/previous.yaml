            -> (final_plan_doc, bullet_points, fund_structure, risk_controls, operational_steps,
            fee_schedule, cost_model, compliance_framework, hiring_plan, tech_stack,
            launch_timeline, fundraising_materials)
          - print(final_plan_doc)
          output: Comprehensive final plan document...
        - lines:
          - prior_outputs = {...}
          - produce_final_fund_plan_summary(final_plan_doc='', prior_outputs=prior_outputs)
            -> (final_plan_doc, bullet_points, fund_structure, risk_controls, operational_steps,
            fee_schedule, cost_model, compliance_framework, hiring_plan, tech_stack,
            launch_timeline, fundraising_materials)
          output: Aggregated key information...
        parameters: []
        raises: []
        returns:
          description: A tuple containing the comprehensive final plan document, a
            list of bullet points summarizing key points, and additional sections
            for fund details, risk management, operations, fees, cost model, compliance,
            hiring, technology, timeline, and fundraising materials.
          type: tuple
        summary: Produces a final plan document by aggregating key information from
          prior steps.
    prompt: Synthesize all prior outputs into a concise executive summary (∼400 words)
      covering strategy, structure, risk, operations, fees, cost model, compliance,
      hiring, technology, timeline, and fundraising materials. Use bullet points or
      short paragraphs.
  select_jurisdiction:
    agent: false
    description: Determines the legal domicile and rationale.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen jurisdiction for the fund.
      key: chosen_jurisdiction
      type: str
    - description: Two advantages of the chosen jurisdiction.
      key: advantages
      type: List[str]
    - description: Two disadvantages of the chosen jurisdiction.
      key: disadvantages
      type: List[str]
    - description: Rationale for the chosen jurisdiction.
      key: rationale
      type: str
    prd:
      conceptual_info: Selects the optimal jurisdiction for the fund based on the
        clarified objectives.
      docstring:
        examples:
        - lines:
          - 'clarified_objectives = {''investment_purpose'': ''short-term trading''}'
          - chosen_jurisdiction = select_jurisdiction(clarified_objectives)
          - print(chosen_jurisdiction)
          output: Cayman
        - lines:
          - 'clarified_objectives = {''target_return_profile'': ''high-yield''}'
          - chosen_jurisdiction = select_jurisdiction(clarified_objectives)
          - print(chosen_jurisdiction)
          output: Delaware
        parameters:
        - description: Dict containing the clarified fund objectives.
          name: clarified_objectives
          type: dict
        raises:
        - description: If the clarified objectives are invalid or incomplete.
          type: ValueError
        returns:
          description: A dictionary containing the chosen jurisdiction, its advantages,
            disadvantages, and rationale.
          type: dict
        summary: Selects the optimal jurisdiction for the fund based on the clarified
          objectives.
    prompt: Choose a domicile for the fund (e.g., Cayman, Delaware, Luxembourg) that
      best aligns with the stated objectives. Provide two advantages and two disadvantages
      of the chosen jurisdiction.
