dag_type: plain_text
description: Extract and organize dataflows from agents, subagents, prompts, contexts,
  memory, modes, permissions, tools, plugins, skills, hooks, MCP, LSP, slash commands,
  workflows, and IDE integrations.
name: extract_dataflows
nodes:
  define_dataflow_boundaries:
    agent: false
    description: Establish clear boundaries for data flows between agents and tools.
    name: define_dataflow_boundaries
    nodes_depended_on:
    - describe_prompts_contexts_memory_modes
    - list_permissions_mcp_lsp_hooks
    nodes_dependent_on: []
    prompt: Define and enforce strict boundaries on data flows between agents and
      integrations, emphasizing data integrity, security, and reliability.
  describe_prompts_contexts_memory_modes:
    agent: false
    description: Define the structures of prompts, contexts, and memory as they relate
      to agents.
    name: describe_prompts_contexts_memory_modes
    nodes_depended_on:
    - model_subagents
    nodes_dependent_on: []
    prompt: Formulate the design components of prompts, the format of contextual data,
      and memory usage within agents, ensuring cohesion and scalability.
  establish_mindmaps:
    agent: false
    description: Develop comprehensive mind maps for complexity visualization.
    name: establish_mindmaps
    nodes_depended_on:
    - map_workflow_structures
    - evaluate_skills_hierarchies
    nodes_dependent_on: []
    prompt: Design coherent mind maps to organize and visualize complex relationships,
      skill hierarchies, and workflow structures, facilitating mental modeling and
      clarity.
  evaluate_skills_hierarchies:
    agent: false
    description: Determine skills, skills hierarchies, and expertise requirements
      for agents.
    name: evaluate_skills_hierarchies
    nodes_depended_on:
    - model_subagents
    - describe_prompts_contexts_memory_modes
    nodes_dependent_on: []
    prompt: Explain how agents accumulate skills, develop hierarchies, and define
      expertise requirements for optimal performance and adaptability.
  extract_tools_plugins_skills:
    agent: false
    description: Enumerate available tools, plugins, and skills used by agents.
    name: extract_tools_plugins_skills
    nodes_depended_on:
    - list_agents
    nodes_dependent_on: []
    prompt: Systematically categorize and list all available tools, plugins, and skills
      utilized by agents, emphasizing diversity and compatibility.
  integrate_ideside_plugins:
    agent: false
    description: Integrate tools and plugins on the IDE side for seamless interaction.
    name: integrate_ideside_plugins
    nodes_depended_on:
    - extract_tools_plugins_skills
    - map_workflow_structures
    nodes_dependent_on: []
    prompt: Systematically integrate tools and plugins within the IDE, ensuring smooth
      interaction and collaboration with agents, enhancing productivity.
  list_agents:
    agent: false
    description: List all known agent types and their relationships.
    name: list_agents
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Describe all known types of agents, their structures, relationships, and
      interactions.
  list_permissions_mcp_lsp_hooks:
    agent: false
    description: Inventory existing permissions, MCP, LSP, and hooks within the system.
    name: list_permissions_mcp_lsp_hooks
    nodes_depended_on:
    - extract_tools_plugins_skills
    nodes_dependent_on: []
    prompt: List all current system permissions, MCP integrations, LSP interfaces,
      and hook mechanisms to identify dependencies and ensure accessibility.
  map_workflow_structures:
    agent: false
    description: Outline the workflow structures, mapping agents and integrations.
    name: map_workflow_structures
    nodes_depended_on:
    - list_agents
    - model_subagents
    - extract_tools_plugins_skills
    nodes_dependent_on: []
    prompt: Organize workflows, identifying relationships between agents, subagents,
      tools, plugins, and integrations, promoting harmony and compatibility.
  model_subagents:
    agent: false
    description: Define the subagent model and its components.
    name: model_subagents
    nodes_depended_on:
    - list_agents
    nodes_dependent_on: []
    prompt: Develop a fundamental model of subagents, encompassing their creation,
      interaction with parents, and lifecycle management.
  organize_into_architectures:
    agent: false
    description: Synthesize dataflows, skills, and workflows into overarching architectures.
    name: organize_into_architectures
    nodes_depended_on:
    - establish_mindmaps
    - define_dataflow_boundaries
    nodes_dependent_on: []
    prompt: Combine information about dataflows, skills, and workflows into logical
      system architectures, prioritizing alignment, compatibility, and modularity.
