      key: latency_annotation
      type: float
    - description: The datacenter where the stock data was stored.
      key: datacenter_tag
      type: str
    - description: Whether the stock data schema is valid.
      key: schema_validated
      type: bool
    prd:
      conceptual_info: Normalize and validate the unified stock dataset produced by
        store_combined_stock_data, applying protocol alignment, missing-value handling,
        and latency annotation, and tagging the origin datacenter to create a clean,
        traceable Parquet archive for analytics and model training.
      docstring:
        examples:
        - lines:
          - 'normalize_combined_stock_data({''consolidated_dataset_uri'': ''s3://data-lake/combined_stock_v1.parquet''})'
          output: (latency_annotation=12.5, datacenter_tag='us-east-1', schema_validated=True)
        - lines:
          - 'normalize_combined_stock_data({''consolidated_dataset_uri'': ''gs://bucket/combined_v2.parquet''})'
          output: (latency_annotation=48.7, datacenter_tag='eu-west-2', schema_validated=True)
