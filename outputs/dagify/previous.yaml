dag_type: plain_text
description: A concurrent workflow that executes logic, math, and creativity tests
  in parallel to verify system functionality, then aggregates the results.
name: system_self_test
nodes:
  aggregate_test_results:
    agent: false
    description: Compile the outputs of the logic, math, and creativity tests into
      a single report.
    name: aggregate_test_results
    nodes_depended_on:
    - perform_logic_test
    - perform_math_test
    - perform_creativity_test
    nodes_dependent_on: []
    prompt: Compile the results from the logic, math, and creativity tests into a
      single 'System Test Report'. Label each section clearly (Logic, Math, Creativity)
      and paste the output of each test beneath the labels.
  perform_creativity_test:
    agent: false
    description: Execute a simple text generation test.
    name: perform_creativity_test
    nodes_depended_on: []
    nodes_dependent_on:
    - aggregate_test_results
    prompt: Write a haiku about a robot finding a flower.
  perform_logic_test:
    agent: false
    description: Execute a simple logical reasoning test.
    name: perform_logic_test
    nodes_depended_on: []
    nodes_dependent_on:
    - aggregate_test_results
    prompt: 'Solve the following logic puzzle: If all Bloops are Razzies and all Razzies
      are Lazzies, then are all Bloops definitely Lazzies? Answer Yes or No and provide
      a one-sentence explanation.'
  perform_math_test:
    agent: false
    description: Execute a simple arithmetic calculation test.
    name: perform_math_test
    nodes_depended_on: []
    nodes_dependent_on:
    - aggregate_test_results
    prompt: Calculate the result of 248 multiplied by 17, then add 32. Provide only
      the final integer answer.
