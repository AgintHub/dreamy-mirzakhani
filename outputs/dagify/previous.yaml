      Maximum drawdown percentages corresponding to each of the top 3 parameter sets\"\
      )\n    )\n    top3_return: List[float] = (\n        Field(..., description=\"\
      Total return percentages corresponding to each of the top 3 parameter sets\"\
      )\n    )\n\n\ndef optimize_parameters(analyze_backtest_results_input: AnalyzeBacktestResultsOutput,\
      \ **kwargs) -> OptimizeParametersOutput:\n    \"\"\"\n    Execute Bayesian optimization\
      \ over 5‑dimensional entry/exit rule parameters\n    and return the top 3 configurations\
      \ with performance metrics.\n\n    Parameters\n    ----------\n    analysis_results\
      \ : Dict[str, Any]\n        Dictionary containing back‑test performance metrics\
      \ from\n        analyze_backtest_results, typically including 'sharpe_ratio',\n\
      \        'max_drawdown', and 'total_return'.\n    risk_limits : Dict[str, float]\n\
      \        Risk control thresholds such as maximum allowed drawdown and\n    \
      \    volatility constraints. Keys correspond to metric names used in the\n \
      \       optimization objective.\n    parameter_space : Dict[str, Tuple[float,\
      \ float]]\n        Search domain for each of the five parameters. Each key maps\
      \ to a\n        tuple (min, max) defining the continuous bounds.\n    n_iter\
      \ : int\n        Number of Bayesian optimization iterations to perform.\n\n\
      \    Returns\n    -------\n    Tuple[List[str], List[float], List[float], List[float]]\n\
      \        A tuple containing (top3_parameters, top3_sharpe, top3_drawdown,\n\
      \        top3_return). Each list has length three.\n\n    Raises\n    ------\n\
      \    ValueError\n        If any required key is missing from analysis_results\
      \ or\n        parameter_space.\n    RuntimeError\n        If the Bayesian optimizer\
      \ fails to converge or encounters numerical\n        instability.\n\n    Examples\n\
      \    --------\n    >>> analysis_results = {\n    ...     'sharpe_ratio': 1.2,\n\
      \    ...     'max_drawdown': 0.15,\n    ...     'total_return': 0.35\n    >>>\
      \ }\n    >>> risk_limits = {'max_drawdown': 0.2, 'volatility': 0.25}\n    >>>\
      \ parameter_space = {\n    ...     'entry_threshold': (0.1, 0.5),\n    ... \
      \    'exit_threshold': (0.05, 0.3),\n    ...     'stop_loss': (0.01, 0.05),\n\
      \    ...     'take_profit': (0.02, 0.1),\n    ...     'lookback': (10, 60)\n\
      \    >>> }\n    >>> top3_params, top3_sharpe, top3_dd, top3_ret = optimize_parameters(\n\
      \    ...     analysis_results, risk_limits, parameter_space, n_iter=50)\n  \
      \  >>> print(top3_params)\n    >>> print(top3_sharpe)\n    ['entry_threshold=0.34,\
