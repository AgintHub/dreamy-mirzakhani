    implementation: "from pydantic import BaseModel, Field\n\n\nclass IdentifySampledSongsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_sampled_songs node outputs.\"\"\"\n \
      \   track_id: str = (\n        Field(..., description=\"Unique identifier for\
      \ the candidate track in the database.\")\n    )\n    confidence: float = (\n\
      \        Field(..., description=\"Confidence score (0.0 to 1.0) indicating the\
      \ likelihood that the candidate matches the sampled snippet.\")\n    )\n   \
      \ start_time: float = (\n        Field(..., description=\"Start timestamp (in\
      \ seconds) of the matched segment within the sampled snippet.\")\n    )\n  \
      \  end_time: float = (\n        Field(..., description=\"End timestamp (in seconds)\
      \ of the matched segment within the sampled snippet.\")\n    )\n    artist_name:\
      \ str = (\n        Field(..., description=\"Name of the artist of the candidate\
      \ track.\")\n    )\n    track_title: str = Field(..., description=\"Title of\
      \ the candidate track.\")\n    release_date: str = (\n        Field(..., description=\"\
      Release date of the candidate track (ISO 8601 format).\")\n    )\n\n\nclass\
      \ ExtractSongMetadataOutput(BaseModel):\n    \"\"\"Pydantic model for extract_song_metadata\
      \ node outputs.\"\"\"\n    song_title: str = Field(..., description=\"Title\
      \ of the sampled song\")\n    artist_names: str = (\n        Field(..., description=\"\
      List of artist names associated with the sampled song\")\n    )\n    album_info:\
      \ str = (\n        Field(..., description=\"Album information for the sampled\
      \ song\")\n    )\n    release_date: str = (\n        Field(..., description=\"\
      Release date of the sampled song\")\n    )\n    genre_classifications: str =\
      \ (\n        Field(..., description=\"List of genre classifications for the\
      \ sampled song\")\n    )\n    tempo: float = (\n        Field(..., description=\"\
      Tempo of the sampled song in beats per minute (BPM)\")\n    )\n    key: str\
      \ = Field(..., description=\"Key of the sampled song\")\n    loudness: float\
      \ = (\n        Field(..., description=\"Loudness of the sampled song in decibels\
      \ (dB)\")\n    )\n\n\ndef extract_song_metadata(identify_sampled_songs_input:\
      \ IdentifySampledSongsOutput, **kwargs) -> ExtractSongMetadataOutput:\n    \"\
      \"\"\n    Extracts detailed metadata for each sampled song candidate.\n\n  \
      \  Parameters\n    ----------\n    candidate_tracks : List[dict]\n        List\
      \ of candidate track objects returned by identify_sampled_songs.\n        Each\
      \ object must contain at least 'track_id', 'confidence',\n        'start_time',\
      \ 'end_time', and 'metadata' (which includes\n        'artist_name', 'track_title',\
      \ 'release_date').\n\n    Returns\n    -------\n    List[dict]\n        A list\
      \ of metadata dictionaries, each containing the fields:\n        song_title\
      \ (str), artist_names (List[str]), album_info (str),\n        release_date (str),\
      \ genre_classifications (List[str]), tempo\n        (float), key (str), loudness\
      \ (float).\n\n    Raises\n    ------\n    ValueError\n        If candidate_tracks\
      \ is empty or missing required fields.\n    RuntimeError\n        If external\
      \ API calls (Discogs, MusicBrainz, Spotify) fail or return\n        inconsistent\
      \ data.\n\n    Examples\n    --------\n    >>> candidate_tracks = [{\n    ...\
      \   'track_id': '12345',\n    ...   'confidence': 0.92,\n    ...   'start_time':\
      \ 12.3,\n    ...   'end_time': 45.6,\n    ...   'metadata': {\n    ...     'artist_name':\
      \ 'The Sample Artists',\n    ...     'track_title': 'Sample Tune',\n    ...\
      \     'release_date': '2020-07-15'\n    ...   }\n    >>> }\n    [{\\n  'song_title':\
      \ 'Sample Tune',\\n  'artist_names': ['The Sample\n    Artists'],\\n  'album_info':\
      \ 'Unknown Album',\\n  'release_date':\n    '2020-07-15',\\n  'genre_classifications':\
      \ ['Electronic', 'House'],\\n\n    'tempo': 128.0,\\n  'key': 'C minor',\\n\
      \  'loudness': -5.2\\n}]\n\n    >>> candidate_tracks = [{\n    ...   'track_id':\
      \ '67890',\n    ...   'confidence': 0.85,\n    ...   'start_time': 0.0,\n  \
      \  ...   'end_time': 30.0,\n    ...   'metadata': {\n    ...     'artist_name':\
      \ 'Another Artist',\n    ...     'track_title': 'Another Sample',\n    ... \
      \    'release_date': '2018-03-22'\n    ...   }\n    >>> }\n    [{\\n  'song_title':\
      \ 'Another Sample',\\n  'artist_names': ['Another\n    Artist'],\\n  'album_info':\
      \ 'Unknown Album',\\n  'release_date':\n    '2018-03-22',\\n  'genre_classifications':\
      \ ['Pop'],\\n  'tempo': 110.0,\\n\n    'key': 'G major',\\n  'loudness': -7.8\\\
      n}]\n\n    \"\"\"\n    return ExtractSongMetadataOutput(\n        song_title=\"\
      \",\n        artist_names=\"\",\n        album_info=\"\",\n        release_date=\"\
      \",\n        genre_classifications=\"\",\n        tempo=0.0,\n        key=\"\
      \",\n        loudness=0.0,\n    )"
    name: extract_song_metadata
    nodes_depended_on:
    - identify_sampled_songs
    nodes_dependent_on: []
    output_structure:
    - description: Title of the sampled song
      key: song_title
      type: str
    - description: List of artist names associated with the sampled song
      key: artist_names
      type: str
    - description: Album information for the sampled song
      key: album_info
      type: str
    - description: Release date of the sampled song
      key: release_date
      type: str
    - description: List of genre classifications for the sampled song
      key: genre_classifications
      type: str
    - description: Tempo of the sampled song in beats per minute (BPM)
      key: tempo
      type: float
    - description: Key of the sampled song
      key: key
      type: str
    - description: Loudness of the sampled song in decibels (dB)
      key: loudness
      type: float
    prd:
      conceptual_info: The extract_song_metadata node enriches the candidate tracks
        identified by identify_sampled_songs with detailed, structured metadata. It
        combines audio feature extraction, external music‑database lookups, and data
        validation to produce a consistent set of attributes (title, artists, album,
        release date, genre, tempo, key, loudness) for each sampled song, enabling
        downstream processes such as playlist creation, musician deduplication, and
