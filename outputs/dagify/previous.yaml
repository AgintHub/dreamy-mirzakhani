      \    ...     scopes=['read:data', 'write:data'])\n    {\n\n    \"\"\"\n    return\
      \ AuthenticatePicoCredentialsOutput(\n        access_token=\"\",\n        token_type=\"\
      \",\n        expires_in=0,\n        scopes=[],\n        is_valid=False,\n  \
