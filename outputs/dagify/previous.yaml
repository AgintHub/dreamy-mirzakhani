dag_type: plain_text
description: A workflow for writing a comprehensive textbook on quantum mechanics,
  covering outline creation, chapter writing, figure generation, and final assembly.
name: write_textbook_on_quantum_mechanics
nodes:
  compile_chapters:
    agent: false
    description: Compile the written chapters into a cohesive draft
    name: compile_chapters
    nodes_depended_on:
    - write_chapter_introduction
    - write_chapter_1
    - write_chapter_2
    nodes_dependent_on: []
    prompt: Assemble the introduction and chapters into a single document, ensuring
      a logical flow.
  create_figures_for_chapter_1:
    agent: false
    description: Generate figures for the first chapter
    name: create_figures_for_chapter_1
    nodes_depended_on:
    - write_chapter_1
    nodes_dependent_on: []
    prompt: Create relevant figures and diagrams to illustrate key concepts in the
      first chapter.
  create_figures_for_chapter_2:
    agent: false
    description: Generate figures for the second chapter
    name: create_figures_for_chapter_2
    nodes_depended_on:
    - write_chapter_2
    nodes_dependent_on: []
    prompt: Create relevant figures and diagrams to illustrate key concepts in the
      second chapter.
  define_target_audience:
    agent: false
    description: Identify the intended audience for the textbook
    name: define_target_audience
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Determine the target audience for the quantum mechanics textbook (e.g.,
      undergraduate students, graduate students, professionals).
  develop_textbook_outline:
    agent: false
    description: Create a detailed outline for the textbook
    name: develop_textbook_outline
    nodes_depended_on:
    - define_target_audience
    nodes_dependent_on: []
    prompt: Develop a comprehensive outline for the quantum mechanics textbook, including
      chapter titles and key concepts.
  edit_and_refine_draft:
    agent: false
    description: Edit and refine the compiled draft
    name: edit_and_refine_draft
    nodes_depended_on:
    - compile_chapters
    - create_figures_for_chapter_1
    - create_figures_for_chapter_2
    nodes_dependent_on: []
    prompt: Review the draft for clarity, accuracy, and consistency, making necessary
      revisions.
  finalize_textbook:
    agent: false
    description: Finalize the textbook for publication
    name: finalize_textbook
    nodes_depended_on:
    - edit_and_refine_draft
    nodes_dependent_on: []
    prompt: Prepare the final version of the textbook, including any last-minute corrections
      or additions.
  write_chapter_1:
    agent: false
    description: Write the first chapter of the textbook
    name: write_chapter_1
    nodes_depended_on:
    - develop_textbook_outline
    nodes_dependent_on: []
    prompt: Write the first chapter of the quantum mechanics textbook, focusing on
      the fundamental principles.
  write_chapter_2:
    agent: false
    description: Write the second chapter of the textbook
    name: write_chapter_2
    nodes_depended_on:
    - develop_textbook_outline
    nodes_dependent_on: []
    prompt: Write the second chapter of the quantum mechanics textbook, building on
      the principles established in the first chapter.
  write_chapter_introduction:
    agent: false
    description: Write the introduction to the textbook
    name: write_chapter_introduction
    nodes_depended_on:
    - develop_textbook_outline
    nodes_dependent_on: []
    prompt: Write a clear and engaging introduction to the quantum mechanics textbook,
      setting the stage for the rest of the content.
