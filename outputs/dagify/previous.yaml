    nodes_dependent_on: []
    output_structure:
    - description: List of provider categories (e.g., prime broker, fund administrator,
        auditor, legal counsel, compliance consultant, custodian)
      key: provider_categories
      type: str
    - description: Number of service providers in each category
      key: num_providers
      type: int
    prd:
      conceptual_info: This node identifies the required external service providers.
      docstring:
        examples:
        - lines:
          - provider_categories, num_providers = list_service_providers(select_jurisdiction_response)
          - print('Service provider categories:', provider_categories)
          output: 'Service provider categories: [''prime broker'', ''fund administrator'',
            ''auditor'', ''legal counsel'', ''compliance consultant'', ''custodian'']'
        - lines:
          - provider_categories, num_providers = list_service_providers(select_jurisdiction_response)
          - print('Number of service providers in each category:', num_providers)
          output: 'Number of service providers in each category: 2'
        parameters: []
        raises: []
        returns:
          description: 'provider_categories: List of service provider categories,
            num_providers: Number of service providers in each category'
          type: tuple
        summary: Creates a checklist of mandatory third-party service providers.
    prompt: 'Create a checklist of mandatory third-party service providers: prime
      broker, fund administrator, auditor, legal counsel, compliance consultant, and
      custodian. List only provider categories.'
  produce_final_fund_plan_summary:
