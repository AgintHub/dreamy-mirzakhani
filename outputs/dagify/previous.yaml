dag_type: plain_text
description: A workflow that defines test requirements, writes and sets up the test,
  executes it, collects results, analyzes them, and generates a final report.
name: test_process
nodes:
  analyze_results:
    agent: false
    description: Determine test success or failure and note any anomalies.
    name: analyze_results
    nodes_depended_on:
    - collect_results
    nodes_dependent_on:
    - generate_report
    prompt: Compare the actual outputs with the expected results defined in the test
      criteria. Summarize any failures, deviations, or performance issues.
  collect_results:
    agent: false
    description: Aggregate all data produced by the test execution.
    name: collect_results
    nodes_depended_on:
    - execute_test
    nodes_dependent_on:
    - analyze_results
    prompt: Collect the execution output, logs, and performance metrics into a structured
      format for analysis.
  define_test_criteria:
    agent: false
    description: Identify the functional and non‑functional requirements that the
      test must cover.
    name: define_test_criteria
    nodes_depended_on: []
    nodes_dependent_on:
    - write_test_case
    - setup_test_environment
    prompt: 'Specify the test criteria: what functionality is being verified, the
      expected outputs, and any boundary conditions or performance thresholds. Provide
      a concise list of criteria.'
  execute_test:
    agent: false
    description: Run the test and gather raw output data.
    name: execute_test
    nodes_depended_on:
    - write_test_case
    - setup_test_environment
    nodes_dependent_on:
    - collect_results
    prompt: Run the test case in the prepared environment and record the actual output.
      Capture any error logs or warnings produced during execution.
  generate_report:
    agent: false
    description: Create a final test report for stakeholders.
    name: generate_report
    nodes_depended_on:
    - analyze_results
    nodes_dependent_on: []
    prompt: Produce a concise report that lists the test criteria, the outcome (pass/fail),
      any defects identified, and recommendations for remediation if needed.
  setup_test_environment:
    agent: false
    description: Configure the environment so the test can run.
    name: setup_test_environment
    nodes_depended_on:
    - define_test_criteria
    nodes_dependent_on:
    - execute_test
    prompt: Prepare the test environment required for execution. List all necessary
      configurations, dependencies, and any mock data needed.
  write_test_case:
    agent: false
    description: Draft the test case that will be executed.
    name: write_test_case
    nodes_depended_on:
    - define_test_criteria
    nodes_dependent_on:
    - execute_test
    prompt: Create a test case based on the defined criteria. Include input data,
      expected output, and a brief description of the test purpose.
