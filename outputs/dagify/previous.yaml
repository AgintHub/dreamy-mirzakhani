dag_type: plain_text
description: A workflow for processing audio to detect sampled songs, extract musician
  information, and redirect users to relevant artist pages.
name: music_sampling_app
nodes:
  audio_file_analysis:
    agent: false
    description: Extract raw spectral features and waveforms for analysis
    name: audio_file_analysis
    nodes_depended_on:
    - receive_audio_input
    nodes_dependent_on:
    - identify_songs_in_audio
    prompt: Perform Fourier transforms and generate spectrogram of the audio file
      to extract acoustic fingerprints. Save spectral coherence map and temporal envelope
      features.
  compile_complete_musician_list:
    agent: false
    description: Aggregate unique musicians from all songs
    name: compile_complete_musician_list
    nodes_depended_on:
    - fetch_artist_musicians
    nodes_dependent_on:
    - generate_musician_redirects
    prompt: Combine musician records from all source songs into single list. Deduplicate
      identical names with unique identifiers like MusicBrainz IDs.
  fetch_artist_musicians:
    agent: false
    description: Retrieve complete musician participation data
    name: fetch_artist_musicians
    nodes_depended_on:
    - normalize_song_metadata
    nodes_dependent_on:
    - compile_complete_musician_list
    prompt: For each standardized song, query music catalog APIs to get exhaustive
      list of participating musicians, including session players. Map instruments
      to individual contributors.
  generate_final_user_response:
    agent: false
    description: Format results into user-readable response format
    name: generate_final_user_response
    nodes_depended_on:
    - generate_musician_redirects
    - generate_music_discovery_summary
    nodes_dependent_on: []
    prompt: 'Compile final UI response showing: list of matched songs, their metadata,
      complete musician list, and clickable artist links. Add visual hierarchy by
      confidence score.'
  generate_music_discovery_summary:
    agent: false
    description: Create structured summary of all detected music elements
    name: generate_music_discovery_summary
    nodes_depended_on:
    - normalize_song_metadata
    nodes_dependent_on:
    - generate_final_user_response
    prompt: 'Format song metadata with musician cross-reference into machine-readable
      table showing: song title | artist | musicians | sample confidence.'
  generate_musician_redirects:
    agent: false
    description: Create links to verified artist resources
    name: generate_musician_redirects
    nodes_depended_on:
    - compile_complete_musician_list
    nodes_dependent_on:
    - generate_final_user_response
    prompt: For each musician, construct canonical URLs to official websites, Wikipedia,
      and streaming services. Include social media links and verified Discogs band
      pages.
  identify_songs_in_audio:
    agent: false
    description: Detect commercial songs used as samples in the audio snippet
    name: identify_songs_in_audio
    nodes_depended_on:
    - audio_file_analysis
    nodes_dependent_on:
    - normalize_song_metadata
    prompt: Compare audio fingerprints against commercial music databases to identify
      sampled songs. Return list of song titles, artists, and confidence scores ≥85%.
  normalize_song_metadata:
    agent: false
    description: Standardize identifiers for discovered songs
    name: normalize_song_metadata
    nodes_depended_on:
    - identify_songs_in_audio
    nodes_dependent_on:
    - fetch_artist_musicians
    - generate_music_discovery_summary
    prompt: Create normalized metadata format for each detected song containing title,
      ISRC, artist name, and release year. Group identical song entries.
  receive_audio_input:
    agent: false
    description: Capture and validate the uploaded audio snippet from the user
    name: receive_audio_input
    nodes_depended_on: []
    nodes_dependent_on:
    - audio_file_analysis
    prompt: Receive a user-submitted audio file and validate that it meets minimum
      requirements (format, duration, bit rate). Confirm audio is mono/stereo and
      ≥5 seconds.
