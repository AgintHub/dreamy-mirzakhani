      \        Field(..., description=\"Chosen methodology type: 'rule-based', 'machine-learning',\
      \ or 'hybrid'\")\n    )\n    justifications: List[str] = (\n        Field(...,\
      \ description=\"Short bullet points explaining why the chosen methodology is\
      \ suitable for the strategy objective\")\n    )\n    technical_reasons: List[str]\
      \ = (\n        Field(..., description=\"Specific technical reasons (e.g., data\
      \ availability, model interpretability, computational cost) supporting the methodology\
      \ choice\")\n    )\n\n\nclass PreprocessDataOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for preprocess_data node outputs.\"\"\"\n    array_shape: List[int]\
      \ = (\n        Field(..., description=\"Dimensions of the 4D numpy array (e.g.,\
      \ [n_assets, n_features, n_time_steps, n_channels])\")\n    )\n    num_assets:\
      \ int = (\n        Field(..., description=\"Number of distinct assets included\
      \ in the dataset\")\n    )\n    num_time_steps: int = (\n        Field(...,\
      \ description=\"Total number of time steps after alignment\")\n    )\n    price_normalized:\
      \ bool = (\n        Field(..., description=\"Indicates whether price values\
      \ have been normalized\")\n    )\n    volatility_calculated: bool = (\n    \
      \    Field(..., description=\"Indicates whether volatility metrics have been\
      \ computed\")\n    )\n    data_integrity: bool = (\n        Field(..., description=\"\
      True if the dataset passes all integrity checks (no missing values, consistent\
      \ timestamps)\")\n    )\n\n\nclass DevelopEntryRulesOutput(BaseModel):\n   \
      \ \"\"\"Pydantic model for develop_entry_rules node outputs.\"\"\"\n    entry_conditions:\
      \ List[str] = (\n        Field(..., description=\"List of quantitative entry\
      \ conditions as pseudo\\u2011code equations\")\n    )\n    parameter_values:\
      \ List[float] = (\n        Field(..., description=\"List of specific parameter\
      \ values for the entry conditions\")\n    )\n    condition_descriptions: List[str]\
      \ = (\n        Field(..., description=\"Brief description for each entry condition\"\
      )\n    )\n    is_valid: bool = (\n        Field(..., description=\"Whether the\
      \ entry conditions are valid and can be used for initiating positions\")\n \
      \   )\n\n\ndef develop_entry_rules(choose_strategy_approach_input: ChooseStrategyApproachOutput,\
      \ preprocess_data_input: PreprocessDataOutput, **kwargs) -> DevelopEntryRulesOutput:\n\
      \    \"\"\"\n    Generate a list of entry conditions, parameters, descriptions,\
      \ and a\n    validity flag for a rule‑based trading strategy.\n\n    Parameters\n\
      \    ----------\n    strategy_methodology : str\n        Chosen strategy framework\
      \ from `choose_strategy_approach`; one of\n        'rule-based', 'machine-learning',\
      \ or 'hybrid'.  Only 'rule-based'\n        and 'hybrid' are supported for explicit\
      \ pseudo‑code generation.\n    preprocessed_data_meta : dict\n        Metadata\
      \ dictionary returned by `preprocess_data` indicating\n        available indicators,\
      \ asset count, and time steps.  The function\n        uses this to validate\
      \ that required inputs (e.g., EMA, ATR) exist.\n\n    Returns\n    -------\n\
      \    dict\n        Dictionary with keys: - `entry_conditions`: List[str] -\n\
      \        `parameter_values`: List[float] - `condition_descriptions`:\n     \
      \   List[str] - `is_valid`: bool\n\n    Raises\n    ------\n    ValueError\n\
      \        If `strategy_methodology` is not supported or required indicators\n\
      \        are missing from `preprocessed_data_meta`.\n    TypeError\n       \
      \ If input types do not match the expected signatures.\n\n    Examples\n   \
      \ --------\n    >>> entry_rules = develop_entry_rules(\n    ...     strategy_methodology='rule-based',\n\
      \    ...     preprocessed_data_meta={'indicators': ['EMA20', 'EMA50', 'ATR',\n\
      \    'StdDev2']})\n    {\n      'entry_conditions': [\n        'EMA20 > EMA50',\n\
      \        'Close > EMA20 + 2 * ATR',\n        'StdDev2 > 1.5'\n      ],\n   \
      \   'parameter_values': [20.0, 50.0, 2.0, 1.5],\n      'condition_descriptions':\
      \ [\n        'Short‑term EMA crossing above long‑term EMA',\n        'Price\
      \ breaks above two‑ATR volatility breakout',\n        'Standard deviation exceeds\
      \ 1.5 standard deviations'\n      ],\n      'is_valid': True\n    }\n\n    >>>\
      \ entry_rules = develop_entry_rules(\n    ...     strategy_methodology='machine-learning',\n\
      \    ...     preprocessed_data_meta={'indicators': ['EMA20']})\n    ValueError:\
      \ Unsupported strategy_methodology 'machine-learning' for entry\n    rule generation.\n\
      \n    \"\"\"\n    return DevelopEntryRulesOutput(\n        entry_conditions=[],\n\
      \        parameter_values=[],\n        condition_descriptions=[],\n        is_valid=False,\n\
      \    )"
    name: develop_entry_rules
