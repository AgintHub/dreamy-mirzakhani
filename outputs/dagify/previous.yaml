dag_type: plain_text
description: A highly concurrent workflow to automatically generate a novel using
  code-driven task decomposition and parallel processing of structural, narrative,
  and editorial elements.
name: automated_novel_generation
nodes:
  compile_final_draft:
    agent: false
    description: Assemble and finalize complete manuscript
    name: compile_final_draft
    nodes_depended_on:
    - create_novel_cover
    - create_novel_index
    - proofread_chapter_1
    - proofread_chapter_2
    - proofread_chapter_3
    - proofread_chapter_4
    - proofread_chapter_5
    - proofread_novel_epilogue
    nodes_dependent_on: []
    prompt: Compile and finalize the manuscript by arranging the epilogue, index,
      and proofread chapters in the correct sequence with front/back matter.
  create_novel_cover:
    agent: false
    description: Design novel cover
    name: create_novel_cover
    nodes_depended_on:
    - generate_novel_title_and_genre
    nodes_dependent_on:
    - compile_final_draft
    prompt: Design a front cover with title, author name (use 'Auto-Generated Novel'),
      and visual elements reflecting genre and story themes in ASCII format.
  create_novel_index:
    agent: false
    description: Generate reference index
    name: create_novel_index
    nodes_depended_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    nodes_dependent_on:
    - compile_final_draft
    prompt: Create an alphabetical index of key terms, character names, locations,
      and unique concepts from the complete text, listing chapter appearances.
  create_novel_outline:
    agent: false
    description: Develop a detailed 5-chapter narrative scaffold
    name: create_novel_outline
    nodes_depended_on:
    - develop_genre_specific_rules
    - define_world_building_elements
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - create_novel_index
    prompt: Generate a detailed outline with key plot events, conflicts, and climaxes
      for each of 5 chapters that follow genre conventions while maintaining narrative
      coherence.
  define_world_building_elements:
    agent: false
    description: Establish setting parameters and fundamentals
    name: define_world_building_elements
    nodes_depended_on:
    - develop_genre_specific_rules
    nodes_dependent_on:
    - generate_character_bios
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    prompt: Create 5 foundational world-building elements (geographical, technological,
      socio-political, magical/natural laws, and timeperiod) aligned with the genre
      rules.
  develop_genre_specific_rules:
    agent: false
    description: Establish genre-specific narrative conventions
    name: develop_genre_specific_rules
    nodes_depended_on:
    - generate_novel_title_and_genre
    nodes_dependent_on:
    - create_novel_outline
    - define_world_building_elements
    prompt: Define 3-5 narrative rules unique to the specified genre that will govern
      plot structure, character archetypes, and acceptable tropes.
  generate_character_bios:
    agent: false
    description: Create character profiles for primary characters
    name: generate_character_bios
    nodes_depended_on:
    - define_world_building_elements
    - create_novel_outline
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    prompt: Generate 3-5 character bios with full backstories, personality traits,
      and role-specific motivations compatible with the defined world parameters.
  generate_novel_title_and_genre:
    agent: false
    description: Generate a title and genre for the novel
    name: generate_novel_title_and_genre
    nodes_depended_on: []
    nodes_dependent_on:
    - develop_genre_specific_rules
    - create_novel_cover
    prompt: Generate a compelling novel title and specify a literary genre that defines
      the story's tone and conventions.
  proofread_chapter_1:
    agent: false
    description: Proofread first chapter
    name: proofread_chapter_1
    nodes_depended_on:
    - write_chapter_1
    nodes_dependent_on:
    - compile_final_draft
    prompt: Proofread, revise, and edit the first chapter text for coherence, grammar,
      and alignment with established narrative elements.
  proofread_chapter_2:
    agent: false
    description: Proofread second chapter
    name: proofread_chapter_2
    nodes_depended_on:
    - write_chapter_2
    nodes_dependent_on:
    - compile_final_draft
    prompt: Perform deep edit of the second chapter focusing on narrative flow, character
      consistency, and genre rule adherence.
  proofread_chapter_3:
    agent: false
    description: Proofread third chapter
    name: proofread_chapter_3
    nodes_depended_on:
    - write_chapter_3
    nodes_dependent_on:
    - compile_final_draft
    prompt: Edit chapter three for logical progression, tonal consistency with previous
      chapters, and world-building accuracy.
  proofread_chapter_4:
    agent: false
    description: Proofread fourth chapter
    name: proofread_chapter_4
    nodes_depended_on:
    - write_chapter_4
    nodes_dependent_on:
    - compile_final_draft
    prompt: Revise chapter four ensuring plot momentum matches prior chapters and
      character developments follow established patterns.
  proofread_chapter_5:
    agent: false
    description: Proofread fifth chapter
    name: proofread_chapter_5
    nodes_depended_on:
    - write_chapter_5
    nodes_dependent_on:
    - compile_final_draft
    prompt: Final edit of the concluding chapter, verifying resolution of all character
      arcs and plot threads as established.
  proofread_novel_epilogue:
    agent: false
    description: Proofread epilogue content
    name: proofread_novel_epilogue
    nodes_depended_on:
    - write_novel_epilogue
    nodes_dependent_on:
    - compile_final_draft
    prompt: Review and refine the epilogue to ensure it provides satisfying closure
      while maintaining narrative voice.
  write_chapter_1:
    agent: false
    description: Generate first chapter text
    name: write_chapter_1
    nodes_depended_on:
    - generate_character_bios
    - define_world_building_elements
    - create_novel_outline
    nodes_dependent_on:
    - proofread_chapter_1
    - write_chapter_2
    prompt: Write the first chapter using the outline plot points, introducing core
      characters and setting through engaging narrative techniques.
  write_chapter_2:
    agent: false
    description: Generate second chapter text
    name: write_chapter_2
    nodes_depended_on:
    - generate_character_bios
    - define_world_building_elements
    - create_novel_outline
    - write_chapter_1
    nodes_dependent_on:
    - proofread_chapter_2
    - write_chapter_3
    prompt: Expand the narrative with the second chapter following the outline structure,
      maintaining continuity and developing character dynamics.
  write_chapter_3:
    agent: false
    description: Generate third chapter text
    name: write_chapter_3
    nodes_depended_on:
    - generate_character_bios
    - define_world_building_elements
    - create_novel_outline
    - write_chapter_2
    nodes_dependent_on:
    - proofread_chapter_3
    - write_chapter_4
    prompt: Write the third chapter following the narrative outline, introducing key
      conflicts or turning points as planned.
  write_chapter_4:
    agent: false
    description: Generate fourth chapter text
    name: write_chapter_4
    nodes_depended_on:
    - generate_character_bios
    - define_world_building_elements
    - create_novel_outline
    - write_chapter_3
    nodes_dependent_on:
    - proofread_chapter_4
    - write_chapter_5
    prompt: Compose the fourth chapter advancing the narrative per outline, escalating
      tension toward resolution.
  write_chapter_5:
    agent: false
    description: Generate fifth chapter text
    name: write_chapter_5
    nodes_depended_on:
    - generate_character_bios
    - define_world_building_elements
    - create_novel_outline
    - write_chapter_4
    nodes_dependent_on:
    - proofread_chapter_5
    - write_novel_epilogue
    prompt: Conclude the narrative with the final chapter resolving major conflicts
      and completing character arcs as directed by the outline.
  write_novel_epilogue:
    agent: false
    description: Generate epilogue content
    name: write_novel_epilogue
    nodes_depended_on:
    - write_chapter_5
    nodes_dependent_on:
    - proofread_novel_epilogue
    prompt: Create a 500-word epilogue that provides narrative closure, character
      reflections, or setting aftermath following the story's conclusion.
