dag_type: plain_text
description: A workflow demonstrating one processing node feeding into two parallel
  processing nodes, with explicit start and stop steps for each node.
name: parallel_processing_with_dependency
nodes:
  compile_result_report:
    agent: false
    description: Aggregate outcomes from both parallel processes
    name: compile_result_report
    nodes_depended_on:
    - finalize_parallel_a
    - finalize_parallel_b
    nodes_dependent_on: []
    prompt: Create a two-sentence summary combining the results of processes A and
      B. Focus only on synthesizing the provided details into a unified presentation.
  finalize_parallel_a:
    agent: false
    description: Terminate and clean up parallel process A
    name: finalize_parallel_a
    nodes_depended_on:
    - prepare_parallel_a
    nodes_dependent_on: []
    prompt: 'Remove temporary resources and confirm completion of process A. Output
      only: ''Parallel A complete'''
  finalize_parallel_b:
    agent: false
    description: Terminate and clean up parallel process B
    name: finalize_parallel_b
    nodes_depended_on:
    - prepare_parallel_b
    nodes_dependent_on: []
    prompt: 'Remove temporary resources and confirm completion of process B. Output
      only: ''Parallel B complete'''
  initialize_processed_data:
    agent: false
    description: Generate the initial data required for the dependent parallel processes
    name: initialize_processed_data
    nodes_depended_on: []
    nodes_dependent_on:
    - prepare_parallel_a
    - prepare_parallel_b
    prompt: Generate and store the foundational data or signal required to launch
      the parallel processes. Describe the output in one sentence.
  prepare_parallel_a:
    agent: false
    description: Trigger initiation of parallel process A
    name: prepare_parallel_a
    nodes_depended_on:
    - initialize_processed_data
    nodes_dependent_on:
    - process_parallel_a
    - finalize_parallel_a
    prompt: 'Establish the initialization parameters and environment specific to parallel
      process A. Output only the confirmation: ''Parallel A ready'''
  prepare_parallel_b:
    agent: false
    description: Trigger initiation of parallel process B
    name: prepare_parallel_b
    nodes_depended_on:
    - initialize_processed_data
    nodes_dependent_on:
    - process_parallel_b
    - finalize_parallel_b
    prompt: 'Establish the initialization parameters and environment specific to parallel
      process B. Output only the confirmation: ''Parallel B ready'''
  process_parallel_a:
    agent: false
    description: Execute the core transformation logic for parallel process A
    name: process_parallel_a
    nodes_depended_on:
    - prepare_parallel_a
    nodes_dependent_on: []
    prompt: Run the parallel process A operations using the previously prepared environment
      and input data. Summarize results in one sentence.
  process_parallel_b:
    agent: false
    description: Execute the core transformation logic for parallel process B
    name: process_parallel_b
    nodes_depended_on:
    - prepare_parallel_b
    nodes_dependent_on: []
    prompt: Run the parallel process B operations using the previously prepared environment
      and input data. Summarize results in one sentence.
