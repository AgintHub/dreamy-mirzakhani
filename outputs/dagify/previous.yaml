  validate_out_of_sample:
    agent: false
    code_node_type: stub
    description: Test the top‑ranked parameter combination on fresh market data outside
      the training window, quantify its performance relative to the in‑sample period,
      and apply statistical tests to flag potential over‑fitting.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass OptimizeParametersOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ optimize_parameters node outputs.\"\"\"\n    top3_parameters: List[str] =\
      \ (\n        Field(..., description=\"String representations of the top 3 parameter\
      \ combinations, formatted as key=value pairs separated by commas\")\n    )\n\
      \    top3_sharpe: List[float] = (\n        Field(..., description=\"Sharpe ratio\
      \ values corresponding to each of the top 3 parameter sets\")\n    )\n    top3_drawdown:\
      \ List[float] = (\n        Field(..., description=\"Maximum drawdown percentages\
      \ corresponding to each of the top 3 parameter sets\")\n    )\n    top3_return:\
      \ List[float] = (\n        Field(..., description=\"Total return percentages\
      \ corresponding to each of the top 3 parameter sets\")\n    )\n\n\nclass SetBacktestParametersOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_backtest_parameters node outputs.\"\"\"\n\
      \    in_sample_start: str = (\n        Field(..., description=\"Start date of\
      \ the in-sample period (YYYY-MM-DD)\")\n    )\n    in_sample_end: str = (\n\
      \        Field(..., description=\"End date of the in-sample period (YYYY-MM-DD)\"\
      )\n    )\n    out_sample_start: str = (\n        Field(..., description=\"Start\
      \ date of the out-of-sample period (YYYY-MM-DD)\")\n    )\n    out_sample_end:\
      \ str = (\n        Field(..., description=\"End date of the out-of-sample period\
      \ (YYYY-MM-DD)\")\n    )\n    montecarlo_min: int = (\n        Field(..., description=\"\
      Minimum number of Monte Carlo simulations to run\")\n    )\n    montecarlo_max:\
      \ int = (\n        Field(..., description=\"Maximum number of Monte Carlo simulations\
      \ to run\")\n    )\n    walkforward_window_days: List[int] = (\n        Field(...,\
      \ description=\"List of window sizes (in days) for walk-forward analysis\")\n\
      \    )\n\n\nclass ValidateOutOfSampleOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for validate_out_of_sample node outputs.\"\"\"\n    selected_param_set:\
      \ str = (\n        Field(..., description=\"Identifier of the parameter set\
      \ used for the out-of-sample test\")\n    )\n    in_sample_sharpe: float = (\n\
      \        Field(..., description=\"Sharpe ratio calculated on the in-sample period\"\
      )\n    )\n    out_of_sample_sharpe: float = (\n        Field(..., description=\"\
      Sharpe ratio calculated on the out-of-sample period\")\n    )\n    in_sample_max_drawdown:\
      \ float = (\n        Field(..., description=\"Maximum drawdown percentage on\
      \ the in-sample period\")\n    )\n    out_of_sample_max_drawdown: float = (\n\
      \        Field(..., description=\"Maximum drawdown percentage on the out-of-sample\
      \ period\")\n    )\n    overfitting_tests_passed: bool = (\n        Field(...,\
      \ description=\"Boolean results for each of the three statistical overfitting\
      \ tests (true if passed)\")\n    )\n    overfitting_test_names: str = (\n  \
      \      Field(..., description=\"Names of the statistical tests performed (e.g.,\
      \ t-test, Diebold-Mariano, etc.)\")\n    )\n\n\ndef validate_out_of_sample(optimize_parameters_input:\
      \ OptimizeParametersOutput, set_backtest_parameters_input: SetBacktestParametersOutput,\
      \ **kwargs) -> ValidateOutOfSampleOutput:\n    \"\"\"\n    Validate a strategy\
      \ on out‑of‑sample data and detect over‑fitting.\n\n    Parameters\n    ----------\n\
      \    top3_parameters : list[str]\n        List of the top three parameter‑set\
      \ strings produced by\n        ``optimize_parameters``.\n    top3_sharpe : list[float]\n\
      \        Sharpe ratios corresponding to each of the top three parameter sets.\n\
      \    in_sample_equity : dict\n        Dictionary containing in‑sample equity\
      \ curve data with keys\n        ``dates`` and ``values``.\n    out_sample_start\
      \ : str\n        ISO format start date of the out‑sample window (YYYY‑MM‑DD).\n\
