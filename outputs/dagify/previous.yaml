dag_type: plain_text
description: Constructs an adaptive group lasso model from variable grouping definitions,
  weight formulation, penalty construction, optimization, cross-validation, and performance
  evaluation.
name: adaptive_group_lasso_workflow
nodes:
  compile_performance_report:
    agent: false
    description: Generate comprehensive model evaluation documentation
    name: compile_performance_report
    nodes_depended_on:
    - validate_model
    - train_final_model
    nodes_dependent_on: []
    prompt: 'Create a 3-section report summarizing: 1) Model specifications, 2) Regularization
      path visualization, 3) Performance benchmarks against group lasso baseline.
      Include ROC curves, residual plots, and variable importance rankings.'
  compute_adaptive_weights:
    agent: false
    description: Derive group-specific penalty weights from initial coefficient estimates
    name: compute_adaptive_weights
    nodes_depended_on:
    - define_variable_groups
    - compute_initial_coefficients
    nodes_dependent_on:
    - construct_adaptive_penalty
    prompt: Using the formula 1/|β^|, compute adaptive group weights from the initial
      coefficients. Apply the inverse absolute value transformation to each group's
      leading coefficients. Include penalty decay parameter λ₀ if applicable.
  compute_initial_coefficients:
    agent: false
    description: Estimate unpenalized coefficients for adaptive weight calculation
    name: compute_initial_coefficients
    nodes_depended_on:
    - define_variable_groups
    nodes_dependent_on:
    - compute_adaptive_weights
    prompt: Using ordinary least squares or logistic regression, compute initial coefficients
      for all variables grouped in 'define_variable_groups'. Report the full coefficient
      vector.
  construct_adaptive_penalty:
    agent: false
    description: Formulate weighted group-specific regularization terms
    name: construct_adaptive_penalty
    nodes_depended_on:
    - compute_adaptive_weights
    - define_variable_groups
    nodes_dependent_on:
    - formulate_objective_function
    prompt: Create a penalty function combining L2 norms of each group's coefficients
      scaled by their respective adaptive weights. Express the formula using proper
      LaTeX notation. Specify λ₀ if it wasn't incorporated earlier.
  define_variable_groups:
    agent: false
    description: Categorize predictive variables into coherent groups for shared penalization
    name: define_variable_groups
    nodes_depended_on: []
    nodes_dependent_on:
    - compute_adaptive_weights
    prompt: Based on domain knowledge or algorithmic clustering, group correlated
      variables into distinct sets for joint regularization. List each group with
      its constituent variables and a one-sentence rationale for the grouping.
  formulate_objective_function:
    agent: false
    description: Combine loss function and adaptive penalty into total cost
    name: formulate_objective_function
    nodes_depended_on:
    - construct_adaptive_penalty
    nodes_dependent_on:
    - solve_optimization_problem
    - generate_lambda_grid
    prompt: Using the model's loss function (linear/likelihood) and adaptive penalty
      from the previous step, form the complete optimization objective. Express the
      formula with λ and λ₀ as parameters.
  generate_lambda_grid:
    agent: false
    description: Create sequence of regularization parameters for tuning
    name: generate_lambda_grid
    nodes_depended_on:
    - formulate_objective_function
    nodes_dependent_on:
    - validate_model
    prompt: Generate a logarithmic grid of 50 λ values spanning from minimal to maximal
      explanatory power in the model. Ensure the sequence covers the full regularization
      spectrum in decreasing magnitudes.
  select_optimal_lambda:
    agent: false
    description: Identify regularization parameter with best generalization
    name: select_optimal_lambda
    nodes_depended_on:
    - validate_model
    nodes_dependent_on:
    - train_final_model
    prompt: Apply one-standard-error rule or minimize mean validation loss to choose
      optimal λ. Explain the selection criteria in 2-3 sentences with numerical comparison
      of top candidates.
  solve_optimization_problem:
    agent: false
    description: Find coefficient values minimizing the adaptive objective
    name: solve_optimization_problem
    nodes_depended_on:
    - formulate_objective_function
    - define_variable_groups
    nodes_dependent_on:
    - validate_model
    prompt: Use coordinate descent or proximal gradient descent to optimize the objective
      function. Return coefficient estimates for each λ in the grid along with standardized
      residuals for each fold in cross-validation.
  train_final_model:
    agent: false
    description: Produce coefficient estimates using selected regularization
    name: train_final_model
    nodes_depended_on:
    - select_optimal_lambda
    - solve_optimization_problem
    nodes_dependent_on:
    - compile_performance_report
    prompt: Retrain model using complete training data and the optimal λ selected
      in the previous step. Report final coefficient values with p-values and estimated
      standard errors for each group.
  validate_model:
    agent: false
    description: Assess model performance across regularization parameters
    name: validate_model
    nodes_depended_on:
    - solve_optimization_problem
    - generate_lambda_grid
    nodes_dependent_on:
    - select_optimal_lambda
    - compile_performance_report
    prompt: Using k-fold cross-validation, compute mean squared error (or appropriate
      metric) for each λ in the grid. Include bias-variance tradeoff metrics and out-of-sample
      prediction accuracy measures.
