dag_type: plain_text
description: A workflow implementing quicksort as a purely functional program where
  each node represents a distinct function in the sorting process. The workflow processes
  unsorted input lists and returns sorted output lists using atomic, concurrent operations.
name: pure_functional_quicksort
nodes:
  concatenate_result:
    agent: false
    description: Combine the sorted left partition, pivot partition, and sorted right
      partition
    name: concatenate_result
    nodes_depended_on:
    - sort_left
    - partition_list
    - sort_right
    nodes_dependent_on: []
    prompt: 'Concatenate the following three components: 1) the sorted left partition
      from the quicksort operation, 2) the pivot partition from the original partitioned
      data, and 3) the sorted right partition from the quicksort operation. Return
      the final sorted list.'
  input_list:
    agent: false
    description: The original unsorted input list to be sorted
    name: input_list
    nodes_depended_on: []
    nodes_dependent_on:
    - select_pivot
    - partition_list
    prompt: Provide the raw unsorted input list to be processed.
  partition_list:
    agent: false
    description: Divide the input list into three partitions based on pivot value
    name: partition_list
    nodes_depended_on:
    - input_list
    - select_pivot
    nodes_dependent_on:
    - sort_left
    - sort_right
    - concatenate_result
    prompt: 'Partition the input list into three sublists: elements less than the
      pivot, elements equal to the pivot, and elements greater than the pivot. Return
      all three partitions in order.'
  select_pivot:
    agent: false
    description: Select a pivot element from the input list
    name: select_pivot
    nodes_depended_on:
    - input_list
    nodes_dependent_on:
    - partition_list
    prompt: Select a single pivot element from the input list. Return only the chosen
      pivot element.
  sort_left:
    agent: false
    description: Recursively apply quicksort to the left partition (less than pivot)
    name: sort_left
    nodes_depended_on:
    - partition_list
    nodes_dependent_on:
    - concatenate_result
    prompt: Apply the quicksort algorithm to the left partition (elements less than
      pivot) from the previous step. Return the sorted left partition.
  sort_right:
    agent: false
    description: Recursively apply quicksort to the right partition (greater than
      pivot)
    name: sort_right
    nodes_depended_on:
    - partition_list
    nodes_dependent_on:
    - concatenate_result
    prompt: Apply the quicksort algorithm to the right partition (elements greater
      than pivot) from the previous step. Return the sorted right partition.
