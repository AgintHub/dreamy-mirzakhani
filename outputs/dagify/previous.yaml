  set_performance_and_risk_targets:
    agent: false
    description: Establish quantitative performance metrics for the hedge fund.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Names of the performance and risk metrics (e.g., Gross Return,
        Volatility, Sharpe Ratio, Max Drawdown).
      key: metric_names
      type: List[str]
    - description: Numerical target values corresponding to each metric (e.g., 0.15
        for 15% gross return, 0.10 for 10% volatility).
      key: target_values
      type: List[float]
    - description: Brief rationale for each target, explaining how it aligns with
        strategy and risk appetite.
      key: rationale_texts
      type: List[str]
    prd:
      conceptual_info: This node translates the chosen investment strategy into concrete,
        quantitative performance and risk objectives that guide portfolio construction
        and risk management.
      docstring:
        examples:
        - lines:
          - strategy_category = 'Long/Short Equity'
          - strategy_rationale = 'Targeting alpha from long positions while hedging
            with short bets.'
          - risk_profile = 'Moderate volatility, high return potential'
          - targets = set_performance_and_risk_targets(strategy_category, strategy_rationale,
            risk_profile)
          - print(targets['metric_names'])
          - print(targets['target_values'])
          - print(targets['rationale_texts'])
          output: '"[''Gross Return'', ''Volatility'', ''Sharpe Ratio'', ''Max Drawdown'']"

            "[0.15, 0.10, 1.5, 0.20]"

            "[''A 15% return aligns with long/short alpha goals.'', ''10% volatility
            matches moderate risk appetite.'', ''Sharpe of 1.5 indicates efficient
            risk‑adjusted returns.'', ''20% drawdown tolerance protects capital during
            market stress.'']'
        - lines:
          - strategy_category = 'Event-Driven'
          - strategy_rationale = 'Profit from merger arbitrage and distressed events.'
          - risk_profile = 'High volatility, low correlation to markets'
          - targets = set_performance_and_risk_targets(strategy_category, strategy_rationale,
            risk_profile)
          - print(targets['target_values'])
          output: '[0.18, 0.15, 1.2, 0.25]'
        parameters:
        - description: Primary investment strategy category selected by the parent
            node (e.g., 'Long/Short Equity', 'Event-Driven', 'Global Macro').
          name: strategy_category
          type: str
        - description: Textual justification for the strategy, used to inform target
            setting.
          name: strategy_rationale
          type: str
        - description: Brief description of the expected risk profile (e.g., 'Moderate
            volatility, high return potential').
          name: risk_profile
          type: str
        raises:
        - description: Raised if any of the input parameters are empty or not a string.
          type: ValueError
        - description: Raised if the strategy_category is not recognized in the internal
            mapping of target templates.
          type: KeyError
        returns:
          description: 'A dictionary with three keys: ''metric_names'' (List[str]),
            ''target_values'' (List[float]), and ''rationale_texts'' (List[str]).'
          type: dict
        summary: Compute annual performance and risk targets based on the selected
          investment strategy.
    prompt: 'Define numerical annual targets for gross returns, volatility (standard
      deviation), Sharpe ratio, and maximum drawdown tolerance. Present as structured
      table with three columns: Metric | Target | Rationale.'
