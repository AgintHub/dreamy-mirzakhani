      accuracy by implementing data validation and normalization techniques.
    shims: []
  identify_sampled_songs:
    agent: false
    code_node_type: stub
    description: Detects and identifies the original songs sampled within a recorded
      audio snippet by combining traditional audio fingerprinting techniques (Chromaprint,
      pHash) with deep‑learning embeddings (VGGish/PANNs) and efficient approximate
      nearest‑neighbor similarity search (FAISS/Annoy). The node outputs a ranked
      list of candidate tracks, confidence scores, and relevant metadata, enabling
      downstream verification and attribution.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass PreprocessAudioDataOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ preprocess_audio_data node outputs.\"\"\"\n    processed_audio_base64: str\
      \ = (\n        Field(..., description=\"Base64-encoded binary payload of the\
      \ processed audio ready for downstream consumption.\")\n    )\n    duration_seconds:\
      \ float = (\n        Field(..., description=\"Total duration of the processed\
      \ audio in seconds.\")\n    )\n    sample_rate_hz: int = (\n        Field(...,\
      \ description=\"Sampling rate of the processed audio in Hertz.\")\n    )\n \
      \   codec: str = (\n        Field(..., description=\"Audio codec used for encoding\
      \ the processed audio (e.g., Opus, PCM).\")\n    )\n    vad_confidence: float\
      \ = (\n        Field(..., description=\"Confidence score (0.0\\u20131.0) of\
      \ Voice Activity Detection applied during preprocessing.\")\n    )\n    noise_reduction_method:\
      \ str = (\n        Field(..., description=\"Method used for noise reduction\
      \ (e.g., spectral_subtraction, wiener_filter, deep_learning).\")\n    )\n  \
      \  normalization_method: str = (\n        Field(..., description=\"Method used\
      \ for audio normalization (e.g., peak_normalization, loudness_normalization).\"\
      )\n    )\n    feature_vectors: List[float] = (\n        Field(..., description=\"\
      Flattened list of extracted audio feature vectors (e.g., MFCCs, chroma, spectral\
      \ contrast).\")\n    )\n    processing_success: bool = (\n        Field(...,\
      \ description=\"Indicates whether the preprocessing pipeline completed successfully\
      \ without critical errors.\")\n    )\n\n\nclass IdentifySampledSongsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_sampled_songs node outputs.\"\"\"\n \
      \   track_id: str = (\n        Field(..., description=\"Unique identifier for\
      \ the candidate track in the database.\")\n    )\n    confidence: float = (\n\
      \        Field(..., description=\"Confidence score (0.0 to 1.0) indicating the\
      \ likelihood that the candidate matches the sampled snippet.\")\n    )\n   \
      \ start_time: float = (\n        Field(..., description=\"Start timestamp (in\
      \ seconds) of the matched segment within the sampled snippet.\")\n    )\n  \
      \  end_time: float = (\n        Field(..., description=\"End timestamp (in seconds)\
      \ of the matched segment within the sampled snippet.\")\n    )\n    artist_name:\
      \ str = (\n        Field(..., description=\"Name of the artist of the candidate\
      \ track.\")\n    )\n    track_title: str = Field(..., description=\"Title of\
      \ the candidate track.\")\n    release_date: str = (\n        Field(..., description=\"\
