  create_playlist:
    agent: false
    code_node_type: stub
    description: Curates a playlist featuring a diverse selection of songs from the
      identified musicians, leveraging their sampled songs' metadata to inform the
      playlist's thematic and sonic coherence.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ListMusiciansOutput(BaseModel):\n    \"\"\"Pydantic model for list_musicians\
      \ node outputs.\"\"\"\n    musician_ids: List[str] = (\n        Field(..., description=\"\
      List of unique identifiers for the musicians\")\n    )\n    musician_names:\
      \ List[str] = (\n        Field(..., description=\"List of names of the musicians\"\
      )\n    )\n    musician_aliases: List[str] = (\n        Field(..., description=\"\
      List of lists containing aliases for each musician\")\n    )\n    is_deduplicated:\
      \ bool = (\n        Field(..., description=\"Whether the list of musicians has\
      \ been deduplicated\")\n    )\n\n\nclass CreatePlaylistOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for create_playlist node outputs.\"\"\"\n    playlist_id:\
      \ str = (\n        Field(..., description=\"Unique identifier for the generated\
      \ playlist\")\n    )\n    track_ids: List[str] = (\n        Field(..., description=\"\
      List of track identifiers included in the playlist\")\n    )\n    playlist_name:\
      \ str = (\n        Field(..., description=\"Name of the generated playlist\"\
      )\n    )\n    playlist_description: str = (\n        Field(..., description=\"\
      Description of the playlist, including its theme and coherence\")\n    )\n \
      \   artist_diversity_score: float = (\n        Field(..., description=\"Score\
      \ representing the diversity of artists in the playlist\")\n    )\n    genre_representation:\
      \ List[str] = (\n        Field(..., description=\"List of genres represented\
      \ in the playlist\")\n    )\n\n\ndef create_playlist(list_musicians_input: ListMusiciansOutput,\
      \ **kwargs) -> CreatePlaylistOutput:\n    \"\"\"\n    Creates a playlist by\
      \ analyzing sampled songs' metadata, applying NLP and\n    collaborative filtering,\
      \ and ranking tracks based on a graph-based model.\n\n    Parameters\n    ----------\n\
      \    musician_ids : List[str]\n        List of unique identifiers for the musicians,\
      \ derived from the\n        `list_musicians` node.\n    musician_names : List[str]\n\
      \        List of names of the musicians, used to inform the playlist's\n   \
      \     thematic coherence.\n    musician_aliases : List[List[str]]\n        List\
      \ of lists containing aliases for each musician, aiding in\n        disambiguation\
      \ and comprehensive coverage.\n\n    Returns\n    -------\n    Dict[str, Union[str,\
      \ List[str], float]]\n        A dictionary containing the generated playlist's\
      \ details, including\n        its ID, track IDs, name, description, artist diversity\
      \ score, and\n        genre representation.\n\n    Raises\n    ------\n    ValueError\n\
      \        If the input lists (`musician_ids`, `musician_names`,\n        `musician_aliases`)\
      \ are inconsistent or empty.\n    RuntimeError\n        If the graph-based ranking\
      \ algorithm fails to converge or if there's\n        an issue with the MIR framework.\n\
      \n    Examples\n    --------\n    >>> create_playlist(musician_ids=['M1', 'M2'],\
      \ musician_names=['Artist1',\n    'Artist2'], musician_aliases=[['A1'], ['A2']])\n\
      \    {'playlist_id': 'P1', 'track_ids': ['T1', 'T2'], 'playlist_name': 'Diverse\n\
      \    Playlist', 'playlist_description': 'A mix of genres',\n    'artist_diversity_score':\
      \ 0.8, 'genre_representation': ['Rock', 'Pop']}\n\n    \"\"\"\n    return CreatePlaylistOutput(\n\
      \        playlist_id=\"\",\n        track_ids=[],\n        playlist_name=\"\"\
      ,\n        playlist_description=\"\",\n        artist_diversity_score=0.0,\n\
      \        genre_representation=[],\n    )"
    name: create_playlist
    nodes_depended_on:
    - list_musicians
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the generated playlist
      key: playlist_id
      type: str
    - description: List of track identifiers included in the playlist
      key: track_ids
      type: List[str]
    - description: Name of the generated playlist
      key: playlist_name
      type: str
    - description: Description of the playlist, including its theme and coherence
