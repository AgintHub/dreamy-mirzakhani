dag_type: plain_text
description: A minimal workflow that demonstrates elemental atomic steps for the given
  task 'test', treating it as a generic placeholder test procedure.
name: test_workflow
nodes:
  analyze_test_results:
    agent: false
    description: Review and interpret the outcomes from the test execution to determine
      success or failure.
    name: analyze_test_results
    nodes_depended_on:
    - execute_test
    nodes_dependent_on:
    - document_test_summary
    prompt: Analyze the data and results obtained from the test execution. Determine
      whether the test met the objectives and explain why, based solely on the test
      results.
  define_test_objective:
    agent: false
    description: Specify the purpose and goal of the test to be conducted.
    name: define_test_objective
    nodes_depended_on: []
    nodes_dependent_on:
    - select_test_method
    - prepare_test_inputs
    prompt: State clearly the objective and intended outcome of the test. Describe
      what you aim to verify or validate.
  document_test_summary:
    agent: false
    description: Create a concise summary report of the test procedure, results, and
      conclusions.
    name: document_test_summary
    nodes_depended_on:
    - analyze_test_results
    nodes_dependent_on: []
    prompt: Draft a summary that includes the test objective, method used, inputs,
      execution details, results, and final conclusions about the test success or
      failure.
  execute_test:
    agent: false
    description: Perform the test using the selected method and prepared inputs.
    name: execute_test
    nodes_depended_on:
    - select_test_method
    - prepare_test_inputs
    nodes_dependent_on:
    - analyze_test_results
    prompt: Simulate or describe the execution of the test using the given method
      and inputs. Record the direct outcomes observed during this process.
  prepare_test_inputs:
    agent: false
    description: Generate or gather the necessary inputs or resources required to
      perform the test.
    name: prepare_test_inputs
    nodes_depended_on:
    - define_test_objective
    nodes_dependent_on:
    - execute_test
    prompt: Based on the test objective, list or create all input data, parameters,
      or resources needed to perform the test. Provide these inputs explicitly.
  select_test_method:
    agent: false
    description: Choose an appropriate method or type of test based on the defined
      objective.
    name: select_test_method
    nodes_depended_on:
    - define_test_objective
    nodes_dependent_on:
    - execute_test
    prompt: Based solely on the provided test objective, select the method or technique
      best suited for testing (e.g., unit test, functional test, performance test).
      Clearly name the method and justify why it's appropriate.
