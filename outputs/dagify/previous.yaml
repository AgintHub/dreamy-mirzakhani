  merge_stored_dropcopy:
    agent: false
    code_node_type: stub
    description: Integrate and consolidate the three individually stored, processed
      segments of the dropcopy into a unified, comprehensive repository entry. This
      merged dataset serves as a definitive source for subsequent verification and
      analysis, ensuring data integrity and coherence across the combined parts.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass StoreDropcopyPart1Output(BaseModel):\n    \"\"\"Pydantic model for\
      \ store_dropcopy_part1 node outputs.\"\"\"\n    file_path: str = (\n       \
      \ Field(..., description=\"The file system or repository path where the processed\
      \ dropcopy segment was stored.\")\n    )\n    is_successful: bool = (\n    \
      \    Field(..., description=\"Indicates whether the storage operation succeeded.\"\
      )\n    )\n    records_stored: int = (\n        Field(..., description=\"The\
      \ number of records or entries stored from the processed dropcopy segment.\"\
      )\n    )\n    storage_timestamp: str = (\n        Field(..., description=\"\
      Timestamp (ISO 8601 format) indicating when the storage operation was completed.\"\
      )\n    )\n    error_message: str = (\n        Field(..., description=\"Error\
      \ message if the storage operation failed; empty string if successful.\")\n\
      \    )\n\n\nclass StoreDropcopyPart2Output(BaseModel):\n    \"\"\"Pydantic model\
      \ for store_dropcopy_part2 node outputs.\"\"\"\n    stored_file_path: str =\
      \ (\n        Field(..., description=\"Repository path or URL where the processed\
      \ second segment was stored.\")\n    )\n    record_count: int = (\n        Field(...,\
      \ description=\"Number of trade records stored.\")\n    )\n    storage_hash:\
      \ str = (\n        Field(..., description=\"SHA-256 hash of the stored file\
      \ for integrity verification.\")\n    )\n    storage_success: bool = (\n   \
      \     Field(..., description=\"True if storage succeeded, False otherwise.\"\
      )\n    )\n    stored_timestamp: str = (\n        Field(..., description=\"ISO\
      \ 8601 timestamp of when the file was stored.\")\n    )\n    trade_ids: List[str]\
      \ = (\n        Field(..., description=\"List of trade IDs included in the stored\
      \ segment.\")\n    )\n\n\nclass StoreDropcopyPart3Output(BaseModel):\n    \"\
      \"\"Pydantic model for store_dropcopy_part3 node outputs.\"\"\"\n    stored_file_path:\
      \ str = (\n        Field(..., description=\"The repository path where the processed\
      \ dropcopy part 3 was stored.\")\n    )\n    record_count: int = (\n       \
      \ Field(..., description=\"The number of records stored from the processed dropcopy\
      \ part 3.\")\n    )\n    checksum: str = (\n        Field(..., description=\"\
      The SHA-256 checksum of the stored file to verify data integrity.\")\n    )\n\
      \    stored_at: str = (\n        Field(..., description=\"The ISO 8601 timestamp\
      \ when the file was stored.\")\n    )\n    is_success: bool = (\n        Field(...,\
      \ description=\"Whether the storage operation succeeded without errors.\")\n\
      \    )\n\n\nclass MergeStoredDropcopyOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for merge_stored_dropcopy node outputs.\"\"\"\n    merged_dataset_id:\
      \ str = (\n        Field(..., description=\"Unique identifier or repository\
      \ path of the merged dropcopy dataset.\")\n    )\n    record_count: int = (\n\
      \        Field(..., description=\"Total number of records aggregated into the\
      \ merged dataset.\")\n    )\n    total_size_bytes: int = (\n        Field(...,\
      \ description=\"Total size of the merged dataset in bytes.\")\n    )\n    merge_timestamp:\
      \ str = (\n        Field(..., description=\"ISO 8601 timestamp when the merge\
      \ operation was completed.\")\n    )\n    merge_success: bool = (\n        Field(...,\
      \ description=\"Indicates whether the merge operation completed successfully.\"\
      )\n    )\n    part1_id: str = (\n        Field(..., description=\"Identifier\
      \ of the stored first segment of the dropcopy.\")\n    )\n    part2_id: str\
      \ = (\n        Field(..., description=\"Identifier of the stored second segment\
      \ of the dropcopy.\")\n    )\n    part3_id: str = (\n        Field(..., description=\"\
      Identifier of the stored third segment of the dropcopy.\")\n    )\n    checksum:\
      \ str = (\n        Field(..., description=\"Cryptographic hash (e.g., SHA-256)\
      \ of the merged dataset for integrity verification.\")\n    )\n\n\ndef merge_stored_dropcopy(store_dropcopy_part1_input:\
      \ StoreDropcopyPart1Output, store_dropcopy_part2_input: StoreDropcopyPart2Output,\
      \ store_dropcopy_part3_input: StoreDropcopyPart3Output, **kwargs) -> MergeStoredDropcopyOutput:\n\
      \    \"\"\"\n    Merge three stored segments of a dropcopy into a consolidated\
      \ dataset within\n    the repository ensuring data consistency, integrity, and\
      \ traceability.\n\n    Parameters\n    ----------\n    part1_info : dict\n \
      \       Metadata and storage details of the first dropcopy segment,\n      \
      \  including its unique identifier and record count.\n    part2_info : dict\n\
      \        Metadata and storage details of the second dropcopy segment,\n    \
      \    including its unique identifier and record count.\n    part3_info : dict\n\
      \        Metadata and storage details of the third dropcopy segment,\n     \
      \   including its unique identifier and record count.\n    oauth_token : str\n\
      \        OAuth access token used to securely authenticate merging operations\n\
      \        in the repository.\n\n    Returns\n    -------\n    dict\n        A\
      \ dictionary containing merged dataset identifier, total record\n        count,\
      \ size in bytes, timestamp of merge completion, success flag,\n        identifiers\
      \ of each original segment, and a cryptographic checksum\n        of the merged\
      \ dataset.\n\n    Raises\n    ------\n    ValueError\n        Raised if any\
      \ of the dropcopy segments' metadata is missing or\n        malformed.\n   \
