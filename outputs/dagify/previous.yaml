dag_type: plain_text
description: Creates a 12‑chapter autobiographical novel. Each chapter is split into
  3 parts, and each part is written as a single paragraph. The workflow maximizes
  concurrency by generating all chapter outlines, part outlines, and paragraphs in
  parallel where possible, and then assembles the complete manuscript.
name: autobiographical_novel_creation
nodes:
  assemble_novel:
    agent: false
    description: Assembles the full novel from all paragraph nodes.
    name: assemble_novel
    nodes_depended_on:
    - paragraph_1_1
    - paragraph_1_2
    - paragraph_1_3
    nodes_dependent_on: []
    prompt: Combine all 36 paragraphs in chapter order, insert a blank line between
      parts and a double blank line between chapters. Prepend the title generated
      earlier. Output the complete manuscript.
  create_novel_title:
    agent: false
    description: Produces the novel's title.
    name: create_novel_title
    nodes_depended_on:
    - define_novel_theme
    nodes_dependent_on:
    - draft_overall_outline
    prompt: Generate a compelling title for the autobiographical novel that reflects
      the defined theme.
  define_novel_theme:
    agent: false
    description: Establishes the overarching theme that will guide all chapters.
    name: define_novel_theme
    nodes_depended_on: []
    nodes_dependent_on:
    - create_novel_title
    prompt: Identify the central theme and emotional arc of the autobiographical novel
      in 2–3 sentences.
  draft_overall_outline:
    agent: false
    description: Creates a top‑level list of the 12 chapters.
    name: draft_overall_outline
    nodes_depended_on:
    - create_novel_title
    nodes_dependent_on:
    - outline_chapter_1
    - outline_chapter_2
    - outline_chapter_3
    - outline_chapter_4
    - outline_chapter_5
    - outline_chapter_6
    - outline_chapter_7
    - outline_chapter_8
    - outline_chapter_9
    - outline_chapter_10
    - outline_chapter_11
    - outline_chapter_12
    prompt: Provide a high‑level outline listing the 12 chapters of the novel. For
      each chapter give a one‑sentence summary of its focus.
  outline_chapter_1:
    agent: false
    description: Generates the outline for Chapter 1.
    name: outline_chapter_1
    nodes_depended_on:
    - draft_overall_outline
    nodes_dependent_on:
    - part_1_1_outline
    - part_1_2_outline
    - part_1_3_outline
    prompt: Write a detailed outline for Chapter 1 (≈150 words). Include three main
      parts and a brief description of each part.
  outline_chapter_10:
