      docstring:
        examples:
        - lines:
          - candidate_tracks = [{
          - '  ''track_id'': ''12345'','
          - '  ''confidence'': 0.92,'
          - '  ''start_time'': 12.3,'
          - '  ''end_time'': 45.6,'
          - '  ''metadata'': {'
          - '    ''artist_name'': ''The Sample Artists'','
          - '    ''track_title'': ''Sample Tune'','
          - '    ''release_date'': ''2020-07-15'''
          - '  }'
          - '}'
          output: '[{\n  ''song_title'': ''Sample Tune'',\n  ''artist_names'': [''The
            Sample Artists''],\n  ''album_info'': ''Unknown Album'',\n  ''release_date'':
            ''2020-07-15'',\n  ''genre_classifications'': [''Electronic'', ''House''],\n  ''tempo'':
            128.0,\n  ''key'': ''C minor'',\n  ''loudness'': -5.2\n}]'
        - lines:
          - candidate_tracks = [{
          - '  ''track_id'': ''67890'','
          - '  ''confidence'': 0.85,'
          - '  ''start_time'': 0.0,'
          - '  ''end_time'': 30.0,'
          - '  ''metadata'': {'
          - '    ''artist_name'': ''Another Artist'','
          - '    ''track_title'': ''Another Sample'','
          - '    ''release_date'': ''2018-03-22'''
          - '  }'
          - '}'
          output: '[{\n  ''song_title'': ''Another Sample'',\n  ''artist_names'':
            [''Another Artist''],\n  ''album_info'': ''Unknown Album'',\n  ''release_date'':
            ''2018-03-22'',\n  ''genre_classifications'': [''Pop''],\n  ''tempo'':
            110.0,\n  ''key'': ''G major'',\n  ''loudness'': -7.8\n}]'
        parameters:
        - description: List of candidate track objects returned by identify_sampled_songs.
            Each object must contain at least 'track_id', 'confidence', 'start_time',
            'end_time', and 'metadata' (which includes 'artist_name', 'track_title',
            'release_date').
          name: candidate_tracks
          type: List[dict]
        raises:
        - description: If candidate_tracks is empty or missing required fields.
          type: ValueError
        - description: If external API calls (Discogs, MusicBrainz, Spotify) fail
            or return inconsistent data.
          type: RuntimeError
        returns:
          description: 'A list of metadata dictionaries, each containing the fields:
            song_title (str), artist_names (List[str]), album_info (str), release_date
            (str), genre_classifications (List[str]), tempo (float), key (str), loudness
            (float).'
          type: List[dict]
        summary: Extracts detailed metadata for each sampled song candidate.
    prompt: Utilize a hybrid approach combining audio fingerprinting, Natural Language
      Processing (NLP), and metadata scraping to extract detailed metadata for the
      identified sampled songs. Specifically, retrieve song title, artist names, album
      information, release dates, genre classifications, and relevant audio features
      such as tempo, key, and loudness. Employ APIs from music information databases
