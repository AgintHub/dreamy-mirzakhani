dag_type: plain_text
description: A high-concurrency workflow for detecting the underlying songs that an
  audio sample is from, linking to the musicians' pages.
name: audio_sample_detection_workflow
nodes:
  detect_songs:
    agent: false
    description: Match the audio features to known songs.
    name: detect_songs
    nodes_depended_on:
    - extract_raw_audio_data
    nodes_dependent_on:
    - index_musicians
    prompt: Use machine learning models to detect songs that match the extracted audio
      features.
  extract_raw_audio_data:
    agent: false
    description: Extract relevant audio features to detect the song.
    name: extract_raw_audio_data
    nodes_depended_on: []
    nodes_dependent_on:
    - preprocess_audio
    prompt: Extract raw audio features such as spectrogram, mel-spectrogram, and MFCCs
      from the input audio file.
  index_musicians:
    agent: false
    description: Build a database of known songs and artists.
    name: index_musicians
    nodes_depended_on: []
    nodes_dependent_on:
    - detect_songs
    prompt: Create a database of known musicians and their songs, indexed by song
      ID and corresponding artists.
  ? 'link_to_musicians'',

    ______"nodes_depended_on":_["detect_songs'
  : agent: false
    description: Link the detected songs to their respective artists.
    name: 'link_to_musicians'',

      ______"nodes_depended_on":_["detect_songs'
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Based on the detected songs, return artist IDs and corresponding links
      to their pages.
  preprocess_audio:
    agent: false
    description: Apply necessary audio processing techniques.
    name: preprocess_audio
    nodes_depended_on: []
    nodes_dependent_on:
    - extract_raw_audio_data
    prompt: Apply audio signal processing techniques such as normalization, filtering,
      and resampling to normalize the input audio file.
