dag_type: plain_text
description: App to analyze audio snippets, identify sampled songs within, and redirect
  users to each sampled musician's page.
name: audio_sampled_song_identifier_app
nodes:
  build_sample_match_result_view:
    agent: false
    description: Generate a results view summarizing detected samples with redirection
      links to musicians' pages.
    name: build_sample_match_result_view
    nodes_depended_on:
    - retrieve_musician_profile_links
    nodes_dependent_on: []
    prompt: Create a structured results interface listing each sampled song, its original
      artist, and a clearly labeled redirect link to each musician's profile page.
      Present the matches with confidence scores and segment time ranges, if available.
  detect_segment_boundaries:
    agent: false
    description: Identify and segment the audio snippet into distinct sections that
      may contain different sampled material.
    name: detect_segment_boundaries
    nodes_depended_on:
    - preprocess_audio_snippet
    nodes_dependent_on: []
    prompt: Analyze the preprocessed audio for changes in timbre, rhythm, or melody
      to estimate segment boundaries where different samples may start or end. Output
      time indices for each detected segment within the snippet.
  extract_segment_features:
    agent: false
    description: For each detected segment, extract detailed audio features for sample
      identification.
    name: extract_segment_features
    nodes_depended_on:
    - detect_segment_boundaries
    - preprocess_audio_snippet
    nodes_dependent_on: []
    prompt: For every segment time range identified, extract distinctive audio features
      (e.g., fingerprints, spectrograms, MFCCs, pitch contours) from the cleaned audio.
      Produce a list of per-segment feature sets.
  filter_and_rank_sample_matches:
    agent: false
    description: Evaluate all candidate song matches for each segment by confidence
      and relevance, producing a final list of likely sampled songs.
    name: filter_and_rank_sample_matches
    nodes_depended_on:
    - query_music_sample_database
    nodes_dependent_on: []
    prompt: Review the list of candidate matches for every segment. Filter out matches
      below a confidence threshold (e.g., 75%). Deduplicate overlapping results. Rank
      all matches by descending confidence score and keep top result(s) for each unique
      sample.
  preprocess_audio_snippet:
    agent: false
    description: Prepare the uploaded audio for analysis by normalizing, denoising,
      and extracting features.
    name: preprocess_audio_snippet
    nodes_depended_on:
    - receive_audio_snippet_input
    nodes_dependent_on: []
    prompt: 'Take the input audio snippet and perform preprocessing steps: normalize
      audio levels, remove noise, convert to a standard format (e.g., 44.1kHz mono),
      and extract relevant audio features (such as MFCC, chroma, tempo, onset, etc.).
      Output both the cleaned audio and its features.'
  query_music_sample_database:
    agent: false
    description: For each segment, search an external music database to identify potential
      sampled songs based on extracted features.
    name: query_music_sample_database
    nodes_depended_on:
    - extract_segment_features
    nodes_dependent_on: []
    prompt: For each segment's feature set, query a comprehensive music sample database
      using audio fingerprinting and pattern matching techniques to find best-matched
      existing songs or song sections. Return matched song objects (title, artist,
      confidence score, sampled section).
  receive_audio_snippet_input:
    agent: false
    description: Obtain an audio snippet from the user for analysis.
    name: receive_audio_snippet_input
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Prompt the user to either upload or record an audio snippet (max 30 seconds)
      for song analysis. Accept the audio file input and confirm receipt.
  redirect_user_to_musician_page:
    agent: false
    description: Enable redirection functionality from the results view to each identified
      musician's profile page.
    name: redirect_user_to_musician_page
    nodes_depended_on:
    - build_sample_match_result_view
    nodes_dependent_on: []
    prompt: For every result rendered, implement a button or link that, when clicked,
      redirects the user to the corresponding musician's profile page as supplied
      in the previous output. Ensure links are clearly associated with each sampled
      song and artist.
  retrieve_musician_profile_links:
    agent: false
    description: For each identified underlying song, obtain the corresponding musician's
      official or authoritative profile page link.
    name: retrieve_musician_profile_links
    nodes_depended_on:
    - filter_and_rank_sample_matches
    nodes_dependent_on: []
    prompt: 'For every unique sampled song and artist found, retrieve a direct profile
      link to the artist''s official page, streaming service profile, or authoritative
      music reference source (such as Spotify, Apple Music, or MusicBrainz). Output
      a mapping: sampled song → artist → profile link.'
