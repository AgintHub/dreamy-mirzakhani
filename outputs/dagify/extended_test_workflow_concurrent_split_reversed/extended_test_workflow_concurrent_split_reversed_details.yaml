dag_type: plain_text
description: Generated workflow from UI with reversed data flow and ordering.
name: extended_test_workflow_concurrent_split_reversed
nodes:
  allocate_infrastructure:
    agent: false
    description: Provision infrastructure needed for the test.
    name: allocate_infrastructure
    nodes_depended_on:
    - develop_test_plan
    nodes_dependent_on:
    - identify_test_scope
    - determine_test_criteria
    prompt: Allocate the necessary infrastructure (servers, networks, environments)
      based on scope and criteria.
  allocate_personnel:
    agent: false
    description: Assign appropriate personnel for the test.
    name: allocate_personnel
    nodes_depended_on:
    - develop_test_plan
    nodes_dependent_on:
    - identify_test_scope
    - determine_test_criteria
    prompt: Allocate the needed test personnel based on scope and criteria.
  allocate_tools:
    agent: false
    description: Select and provision testing tools.
    name: allocate_tools
    nodes_depended_on:
    - develop_test_plan
    nodes_dependent_on:
    - identify_test_scope
    - determine_test_criteria
    prompt: Allocate the required testing tools and software according to scope and
      criteria.
  analyze_test_results:
    agent: false
    description: Derive insights from the validated test data.
    name: analyze_test_results
    nodes_depended_on:
    - summarize_key_findings
    nodes_dependent_on:
    - validate_test_results
    prompt: Analyze the verified test data to identify patterns, anomalies, and implications
      related to the test objectives.
  define_test_objective:
    agent: false
    description: Define the primary goal of the test.
    name: define_test_objective
    nodes_depended_on:
    - identify_test_scope
    nodes_dependent_on:
    - prioritize_test_objectives
    prompt: Define the primary goal of the test. What is the main objective that this
      test is trying to achieve?
  determine_test_criteria:
    agent: false
    description: Derive specific evaluation criteria from success metrics.
    name: determine_test_criteria
    nodes_depended_on:
    - allocate_infrastructure
    - allocate_personnel
    - allocate_tools
    nodes_dependent_on:
    - formulate_success_metrics
    prompt: Based on the formulated success metrics, define the precise evaluation
      standards for the test.
  develop_test_plan:
    agent: false
    description: Create a detailed test execution plan.
    name: develop_test_plan
    nodes_depended_on:
    - review_test_plan
    nodes_dependent_on:
    - allocate_infrastructure
    - allocate_personnel
    - allocate_tools
    prompt: Design a detailed plan outlining test procedures, sequence, and execution
      methods aligned with the scope and criteria.
  document_test_outcome:
    agent: false
    description: Record final test findings and recommendations.
    name: document_test_outcome
    nodes_depended_on:
    - share_test_report
    nodes_dependent_on:
    - summarize_key_findings
    prompt: Formalize test results into a structured report containing key findings,
      conclusions, and recommendations.
  execute_test:
    agent: false
    description: Carry out the test according to the approved plan.
    name: execute_test
    nodes_depended_on:
    - gather_raw_test_data
    nodes_dependent_on:
    - review_test_plan
    prompt: Carry out the test procedures outlined in the approved plan. Collect all
      required data according to the defined criteria.
  formulate_success_metrics:
    agent: false
    description: Create concrete success metrics from prioritized objectives.
    name: formulate_success_metrics
    nodes_depended_on:
    - prioritize_test_objectives
    nodes_dependent_on: []
    prompt: Based on the prioritized test objectives, define the concrete metrics
      and standards that will measure test success.
  gather_raw_test_data:
    agent: false
    description: Collect raw data generated during test execution.
    name: gather_raw_test_data
    nodes_depended_on:
    - structure_raw_test_data
    nodes_dependent_on:
    - execute_test
    prompt: Gather all raw data produced by the test execution.
  identify_test_scope:
    agent: false
    description: Determine which system components will be included in the test.
    name: identify_test_scope
    nodes_depended_on:
    - allocate_infrastructure
    - allocate_personnel
    - allocate_tools
    nodes_dependent_on:
    - define_test_objective
    prompt: Based on the test objective, specify the components, systems, or processes
      that will be included in the test.
  prioritize_test_objectives:
    agent: false
    description: Rank parts of the test objective by importance.
    name: prioritize_test_objectives
    nodes_depended_on:
    - define_test_objective
    nodes_dependent_on:
    - formulate_success_metrics
    prompt: Review the defined test objective and prioritize the components of the
      objective. Which elements are most critical to the test's success?
  review_test_plan:
    agent: false
    description: Validate and finalize the test plan.
    name: review_test_plan
    nodes_depended_on:
    - execute_test
    nodes_dependent_on:
    - develop_test_plan
    prompt: Review the developed test plan for completeness, feasibility, and alignment
      with objectives. Are all requirements addressed?
  share_test_report:
    agent: false
    description: Distribute the test report to stakeholders.
    name: share_test_report
    nodes_depended_on: []
    nodes_dependent_on:
    - document_test_outcome
    prompt: Prepare and distribute the test outcome report to relevant stakeholders
      using appropriate communication channels.
  structure_raw_test_data:
    agent: false
    description: Organize raw data into a standardized format.
    name: structure_raw_test_data
    nodes_depended_on:
    - validate_test_results
    nodes_dependent_on:
    - gather_raw_test_data
    prompt: Structure the collected raw test data into standardized formats for validation
      and analysis.
  summarize_key_findings:
    agent: false
    description: Extract core conclusions from the analysis.
    name: summarize_key_findings
    nodes_depended_on:
    - document_test_outcome
    nodes_dependent_on:
    - analyze_test_results
    prompt: Condense analysis results into a clear summary of test outcomes, highlighting
      critical findings and their significance.
  validate_test_results:
    agent: false
    description: Verify correctness and completeness of the structured data.
    name: validate_test_results
    nodes_depended_on:
    - analyze_test_results
    nodes_dependent_on:
    - structure_raw_test_data
    prompt: Perform data quality checks on the collected results to ensure accuracy,
      completeness, and consistency with test criteria.
