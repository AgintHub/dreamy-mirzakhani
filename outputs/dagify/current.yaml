dag_type: typed
description: Generated workflow from UI.
name: fetch_and_combine_stock_data_with_lse_details_refined
nodes:
  construct_lse_api_request:
    agent: false
    description: Builds a robust, protocol-optimized HTTP/2 request to the LSE API,
      embedding all necessary query parameters, headers, authentication, latency considerations,
      and datacenter routing logic to fetch historical or real-time quote data for
      the identified stock symbols.
    name: construct_lse_api_request
    nodes_depended_on:
    - identify_lse_stocks
    nodes_dependent_on: []
    output_structure:
    - description: The HTTPS URL of the LSE API request
      key: lse_api_url
      type: str
    - description: A list of query parameters to be used in the LSE API request
      key: query_parameters
      type: List[str]
    - description: A list of headers to be used in the LSE API request
      key: headers
      type: List[str]
    - description: The authentication credentials used in the LSE API request
      key: authentication
      type: str
    - description: The latency considerations used in the LSE API request
      key: latency_considerations
      type: str
    - description: The datacenter routing logic used in the LSE API request
      key: datacenter_routing_logic
      type: str
    prompt: 'Construct a fully-qualified HTTPS request to the London Stock Exchange
      (LSE) API for the stock symbols provided by the previous step. Include the following
      components:'
  construct_nasdaq_api_request:
    agent: false
    description: Builds a secure, protocol-compliant HTTP(S) request to the NASDAQ
      public API for real-time stock data, embedding authentication, field selection,
      and latency considerations.
    name: construct_nasdaq_api_request
    nodes_depended_on:
    - identify_nasdaq_stocks
    nodes_dependent_on: []
    output_structure:
    - description: Base URL for the NASDAQ data service
      key: base_url
      type: str
    - description: List of query parameters for the request
      key: query_params
      type: List[str]
    - description: TLS settings for the request, including the cipher suite and HSTS
        enforcement
      key: tls_settings
      type: str
    - description: Expected latency for the request, in milliseconds
      key: latency_expectations
      type: str
    - description: Retry policy for the request, including the number of attempts
        and delay
      key: retry_policy
      type: str
    - description: List of data centers for the request, including primary, secondary,
        and tertiary
      key: data_centers
      type: List[str]
    - description: Full request string for the NASDAQ API
      key: request_string
      type: str
    - description: Full URL for the NASDAQ API request
      key: full_url
      type: str
    - description: Expected latency for the request, in milliseconds
      key: expected_latency
      type: float
    prompt: Using the list of stock symbols from the previous node, compose a fully-qualified
      HTTPS GET request to the NASDAQ data service.
  construct_nyse_api_request:
    agent: false
    description: Constructs the API request for fetching NYSE stock data, incorporating
      identified stock symbols, API endpoint specifics, protocol level technical details,
      latency considerations, and available data centers to ensure efficient and reliable
      data retrieval.
    name: construct_nyse_api_request
    nodes_depended_on:
    - identify_nyse_stocks
    nodes_dependent_on: []
    output_structure:
    - description: The constructed NYSE API request string.
      key: nyse_api_request_string
      type: str
    - description: The API endpoint URL for the NYSE stock data.
      key: api_endpoint
      type: str
    - description: The User-Agent header value for the API request.
      key: user_agent_header
      type: str
    - description: The API key authentication token for the NYSE API.
      key: api_key_authentication
      type: str
    - description: The TLS settings, including the protocol version and cipher suite,
        for the API request.
      key: tls_settings
      type: str
    - description: The list of available data centers for the NYSE API, including
        New York (NY4), Chicago (CH1), and London (LD4).
      key: data_centers
      type: List[str]
    - description: The expected latency for the NYSE API request, in milliseconds.
      key: latency_expectation
      type: int
    - description: The retry policy for the NYSE API request, including the number
        of retries and the backoff strategy.
      key: retry_policy
      type: str
    - description: The comprehensive set of error handling mechanisms, including failure
        analysis and mitigation strategies.
      key: error_handling_mechanisms
      type: str
    prompt: Construct a RESTful API request for fetching NYSE stock data via HTTPS
      protocol, using the identified stock symbols, with an expected latency of 50-100
      ms, and available data centers in New York (NY4), Chicago (CH1), and London
      (LD4). The API endpoint should support JSON data format, implement rate limiting
      with a burst capacity of 100 requests per second, and provide failover mechanisms
      to handle temporary service disruptions. The request should include query parameters
      for stock symbols, date range, and data frequency, such as 1-minute or daily
      bars, and may utilize optional parameters for filtering and sorting. Specify
      the User-Agent header, API key authentication, and TLS 1.2 encryption with SHA-256
      certificate hashing to ensure secure data transmission. Provide a comprehensive
      set of error handling mechanisms, including retry logic with exponential backoff,
      to mitigate potential connection issues and API rate limiting errors.
  construct_toronto_stock_exchange_api_request:
    agent: false
    description: Constructs a technically sophisticated API request for retrieving
      data from the Toronto Stock Exchange, incorporating essential parameters such
      as API endpoints, data feed specifications, latency requirements, and API key
      authentication, to facilitate efficient and secure data acquisition for the
      specified stock symbols.
    name: construct_toronto_stock_exchange_api_request
    nodes_depended_on:
    - identify_toronto_stock_exchange_stocks
    nodes_dependent_on: []
    prompt: Construct a secure, RESTful API request to the Toronto Stock Exchange
      (TSE) for fetching real-time and historical stock data, utilizing the HTTPS
      protocol with TLS 1.2 encryption and specifying the API endpoint as https://www.tmx.com/rs/api/
      with a latency of less than 50ms, supporting data feeds from data centers located
      in Toronto, New York, and London. Ensure the request includes the stock symbols
      identified in the previous step, utilizes gzip compression for efficient data
      transfer, and adheres to the TSE's API usage guidelines with a maximum of 100
      requests per second. Specify the API request headers, including 'Accept' as
      'application/json', 'Content-Type' as 'application/json', and 'Authorization'
      with a valid API key. The request body should be formatted in JSON, containing
      the stock symbols and any additional required parameters, such as time intervals
      and data formats.
  fetch_lse_stock_data:
    agent: false
    description: Initiates a secured, HTTPS-based data fetch operation from the London
      Stock Exchange (LSE) via a meticulously constructed API request, incorporating
      detailed parameters for stock symbols, data frequency, and time range, while
      ensuring robust error handling and exception management to guarantee data integrity
      and consistency, across multiple datacenters in London, New York, and Singapore
      with latency averaging 50ms, 100ms, and 120ms respectively.
    name: fetch_lse_stock_data
    nodes_depended_on:
    - construct_lse_api_request
    nodes_dependent_on: []
    output_structure:
    - description: The raw JSON data received from the LSE API.
      key: raw_data
      type: str
    - description: Whether any errors occurred during the data fetch operation.
      key: error
      type: bool
    - description: The average latency experienced during the data fetch operation.
      key: latency
      type: float
    - description: The datacenter used to fetch the data (one of London, New York,
        or Singapore).
      key: datacenter
      type: str
    prompt: 'Fetch the stock data from the LSE using the previously constructed API
      request, handling errors and exceptions through retry mechanisms with exponential
      backoff, logging anomalous responses, and implementing circuit breakers to prevent
      cascading failures. Ensure compliance with LSE''s API usage policies and rate
      limits. Utilize available data feeds from primary datacenters in London (latency:
      50ms), New York (latency: 100ms), and Singapore (latency: 120ms), and gracefully
      switch between them based on real-time latency and availability metrics. Leverage
      HTTP/2 for multiplexed, concurrent data transfers and TLS 1.3 for enhanced security
      and encryption.'
  fetch_nasdaq_stock_data:
    agent: false
    description: Retrieves the stock data from the NASDAQ exchange through a technically
      sophisticated API request, incorporating multiple protocol layers, latency considerations,
      and datacenter redundancy to ensure high availability and reliability of the
      retrieved data, supporting real-time and historical data feeds with varying
      latency and throughput characteristics.
    name: fetch_nasdaq_stock_data
    nodes_depended_on:
    - construct_nasdaq_api_request
    nodes_dependent_on: []
    output_structure:
    - description: List of stock data in JSON format fetched from the NASDAQ API
      key: nasdaq_stock_data
      type: List[str]
    - description: API endpoint URI of the NASDAQ API
      key: nasdaq_api_endpoint
      type: str
    - description: Query parameters used to specify stock symbols and date ranges
      key: nasdaq_query_params
      type: str
    - description: HTTP headers used for authentication and rate limiting
      key: nasdaq_http_headers
      type: str
    - description: Latency of the data feed in milliseconds
      key: nasdaq_latency
      type: float
    - description: Metadata on data feed availability, including server response times
        and error messages
      key: nasdaq_data_feed_availability
      type: str
    prompt: Fetch the stock data from the NASDAQ using the constructed API request
      over HTTPS, with a timeout of 5 seconds and retry mechanism for handling 500-level
      server errors, incorporating technical details such as API endpoint URIs, query
      parameters for specifying stock symbols and date ranges, HTTP headers for authentication
      and rate limiting, and support for multiple data feeds from NASDAQ's primary
      datacenters in Carteret, New Jersey, and secondary datacenters in Chicago, Illinois,
      and London, United Kingdom, with a latency of 10-50 milliseconds for real-time
      data and 100-500 milliseconds for historical data, providing additional metadata
      on data feed availability, server response times, and any error messages encountered
      during the request.
  fetch_nyse_stock_data:
    agent: false
    description: Executes the authenticated HTTP request to the NYSE data feed, retrieves
      the latest market snapshot for the specified symbols, measures network latency,
      records the data center source, and returns a clean, structured dataset ready
      for analytical processing.
    name: fetch_nyse_stock_data
    nodes_depended_on:
    - construct_nyse_api_request
    nodes_dependent_on: []
    output_structure:
    - description: Clean, structured NYSE dataset
      key: NYSE_Data
      type: str
    - description: Network latency in milliseconds
      key: Network_Latency
      type: float
    - description: Data center source (e.g., New York, London)
      key: Data_Center_Source
      type: str
    prompt: 'Using the API request constructed by `construct_nyse_api_request`, send
      an HTTPS GET to the NYSE data feed endpoint with the appropriate `Authorization`
      bearer token and `Accept: application/json`.'
  fetch_toronto_stock_exchange_stock_data:
    agent: false
    description: Retrieves real-time stock price and volume data for the identified
      Toronto Stock Exchange securities. The node performs a secure HTTPS request
      to the TSE API, handling authentication, failover between primary and secondary
      data centers, and ensuring low-latency delivery. It validates the response schema,
      logs errors, and emits a clean JSON payload for downstream analytics.
    name: fetch_toronto_stock_exchange_stock_data
    nodes_depended_on:
    - construct_toronto_stock_exchange_api_request
    nodes_dependent_on: []
    output_structure:
    - description: ISO-8601 UTC of record ingestion
      key: timestamp
      type: str
    - description: NYSE
      key: exchange
      type: str
    - description: Ticker symbol
      key: symbol
      type: str
    - description: Last traded price
      key: price
      type: float
    - description: Total traded volume
      key: volume
      type: int
    - description: Object containing latency_ms, datacenter, and source_url
      key: metadata
      type: str
    prompt: 'Using the fully constructed API request, perform a HTTPS GET to the Toronto
      Stock Exchange data service at `https://api.tse.ca/v1/quotes` with the specified
      query parameters and authentication headers. Ensure the request includes a `User-Agent:
      DataPipeline/1.0` and a `Cache-Control: no-cache`. Execute the call against
      the primary data center located in Toronto (Canada Central) with an expected
      round-trip latency of 80–120 ms; if a failover is required, automatically redirect
      to the secondary data center in London (EU West) with a 120–160 ms latency.
      Capture the JSON response, validate the schema against the TSE public spec,
      and return the payload as a parsed JSON object. Log any HTTP status codes outside
      the 2xx range and retry up to two times with exponential backoff (initial delay
      200 ms, multiplier 2).'
  identify_lse_stocks:
    agent: false
    description: Generates a comprehensive, protocol‑aware catalogue of London Stock
      Exchange (LSE) equities to be queried. The output includes precise data‑feed
      details—protocol, latency expectations, and geographically proximate data‑centre
      information—to enable downstream nodes to select the optimal ingestion pathway
      and satisfy strict performance SLAs.
    name: identify_lse_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The primary market code (e.g., "LON") and ticker.
      key: symbol
      type: str
    - description: The market code (e.g., 1, 2...)
      key: market
      type: int
    - description: The preferred data feed protocol (e.g., FIX, REST, WebSocket).
      key: protocol
      type: str
    - description: Expected latency window (ms) for real‑time quotes and end‑of‑day
        snapshots.
      key: latency_ms
      type: int
    - description: The nearest data centre location (e.g., "London‑West", "London‑East").
      key: datacenter
      type: str
    - description: 'Optional: the subscription tier required (e.g., Tier 1, Tier 2,
        Tier 3).'
      key: tier
      type: int
    prompt: 'Retrieve the list of LSE stock symbols to be fetched. For each symbol,
      specify:

      1. The primary market code (e.g., "LON") and ticker.

      2. The preferred data feed protocol (e.g., FIX, REST, WebSocket).

      3. Expected latency window (ms) for real‑time quotes and end‑of‑day snapshots.

      4. The nearest data centre location (e.g., "London‑West", "London‑East").

      5. Optional: the subscription tier required (e.g., Tier 1, Tier 2, Tier 3).'
  identify_nasdaq_stocks:
    agent: false
    description: Selects a curated set of NASDAQ-listed equities for data retrieval,
      specifying for each the optimal data feed protocol, expected latency, and preferred
      datacenter location. This node equips downstream analytics with precise, low-latency
      access to both historical and real-time market data while respecting feed-specific
      authentication and rate-limit policies.
    name: identify_nasdaq_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Comma-separated list of NASDAQ stock symbols
      key: nasdaq_stock_symbols
      type: List[str]
    - description: Optimal data feed protocol for each symbol
      key: protocol
      type: str
    - description: Expected round-trip latency in milliseconds for each symbol
      key: expected_latency
      type: List[float]
    - description: Nearest available data center or region for each symbol
      key: datacenter
      type: str
    - description: Protocol-specific authentication or rate-limit constraints for
        each symbol
      key: constraints
      type: str
    prompt: 'Generate a comma-separated list of the NASDAQ stock symbols that should
      be retrieved. For each symbol, include: - The primary data feed protocol to
      use (e.g., Bloomberg API v4, Refinitiv Eikon REST, IEX Cloud, Nasdaq TotalView
      2.0) - The expected round-trip latency (in milliseconds) for historical price
      data and for real-time tick updates - The nearest available data center or region
      (e.g., US-East-Coast, EU-London, APAC-Tokyo) that offers the lowest latency
      for each feed - Any protocol-specific authentication or rate-limit constraints
      that must be respected Return the information in a structured JSON array where
      each element has the keys: "symbol", "feed", "latency_ms", "datacenter", and
      "constraints". Ensure the list is concise (no more than 20 symbols) and prioritizes
      high-volume, high-liquidity stocks suitable for intraday analytics.'
  identify_nyse_stocks:
    agent: false
    description: '

      Retrieves the comprehensive, real-time list of NYSE equities by querying the
      NYSE public data feed via HTTPS/2 with TLS 1.3, handling pagination, authentication,
      and rate-limit retries.

      '
    name: identify_nyse_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of NYSE equities
      key: NYSE_equities
      type: List[str]
    - description: Total number of NYSE equities
      key: equity_count
      type: int
    - description: Whether the data fetch operation was successful
      key: fetch_success
      type: bool
    prompt: '

      Query the NYSE market data API to enumerate all active equities for the current
      trading day.

      '
  identify_toronto_stock_exchange_stocks:
    agent: false
    description: Compiles a comprehensive, protocol-aware catalog of active Toronto
      Stock Exchange equities for automated data ingestion. The node specifies each
      ticker's sector, market-cap classification, optimal data-feed protocol with
      associated latency expectations, and the primary data-center location to enable
      latency-optimized routing and high-availability strategies.
    name: identify_toronto_stock_exchange_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a curated list of Toronto Stock Exchange (TSE) equities for
      downstream data acquisition, including:


      1. **Ticker Symbol** – 4-letter code.

      2. **Company Name** – Full legal name.

      3. **Sector & Industry** – Standard Global Industry Classification.

      4. **Market Cap Tier** – Large, Mid, or Small cap.

      5. **Preferred Data Feed Protocol** – WebSocket, REST, or FIX, with associated
      **expected latency** (e.g., WebSocket ~20 ms, REST ~200 ms, FIX ~5 ms).

      6. **Primary Data Center** – e.g., Toronto (ON-1), New York (NY-2), Frankfurt
      (DE-3) – to inform routing and redundancy.

      Description: Compiles a comprehensive, protocol-aware catalog of active Toronto
      Stock Exchange equities for automated data ingestion. The node specifies each
      ticker''s sector, market-cap classification, optimal data-feed protocol with
      associated latency expectations, and the primary data-center location to enable
      latency-optimized routing and high-availability strategies.

      Agent: False'
  normalize_combined_stock_data:
    agent: false
    description: Performs protocol-level alignment, missing-value handling, consistency
      validation, latency annotation, and datacenter tagging on the consolidated multi-exchange
      stock dataset to produce a clean, uniformly formatted, and traceable Parquet
      archive ready for downstream analytics and model training.
    name: normalize_combined_stock_data
    nodes_depended_on:
    - store_combined_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: The average latency of the combined stock data.
      key: latency_annotation
      type: float
    - description: The datacenter where the stock data was stored.
      key: datacenter_tag
      type: str
    - description: Whether the stock data schema is valid.
      key: schema_validated
      type: bool
    prompt: Normalize the unified stock dataset obtained from `store_combined_stock_data`.
      The dataset consolidates tick-level feeds from LSE, NASDAQ, NYSE, and Toronto
      Stock Exchange. Perform the following steps:...
  parse_lse_stock_data:
    agent: false
    description: Transforms raw LSE stock data fetched via HTTPS into a sanitized,
      schema-validated Pandas DataFrame, enriching the output with protocol, latency,
      and datacenter provenance for downstream analytics and SLA monitoring.
    name: parse_lse_stock_data
    nodes_depended_on:
    - fetch_lse_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: The raw API response from the LSE
      key: lse_api_response
      type: str
    - description: The rows of the parsed Pandas DataFrame as a list of strings
      key: dataframe_rows
      type: List[str]
    - description: The protocol used for fetching the LSE stock data
      key: protocol_used
      type: str
    - description: The latency in milliseconds for fetching the LSE stock data
      key: fetch_latency_ms
      type: float
    - description: The datacenter origin of the LSE stock data
      key: datacenter_origin
      type: str
    prompt: Parse the raw CSV/JSON payload returned by the LSE API into a clean, normalized
      Pandas DataFrame.
  parse_nasdaq_stock_data:
    agent: false
    description: Converts raw NASDAQ API responses into a clean, structured dataset.
      Handles protocol-level details such as datacenter origin, fetch latency, and
      parse timing, while ensuring data integrity and compliance with the feed’s latency
      SLAs.
    name: parse_nasdaq_stock_data
    nodes_depended_on:
    - fetch_nasdaq_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: Stock symbol.
      key: symbol
      type: str
    - description: ISO-8601 UTC date.
      key: date
      type: str
    - description: Opening price.
      key: open
      type: float
    - description: Highest price during the interval.
      key: high
      type: float
    - description: Lowest price during the interval.
      key: low
      type: float
    - description: Closing price.
      key: close
      type: float
    - description: Traded volume.
      key: volume
      type: int
    - description: Adjusted close for splits/dividends.
      key: adjusted_close
      type: float
    - description: Market capitalization.
      key: market_cap
      type: float
    - description: Datacenter origin.
      key: source_datacenter
      type: str
    - description: Fetch latency in milliseconds.
      key: fetch_latency_ms
      type: int
    - description: Parse duration in milliseconds.
      key: parse_duration_ms
      type: int
    prompt: 'Parse the raw NASDAQ JSON payload returned by the API into a normalized,
      query-ready table. The input will include a timestamped, multi-asset bundle
      from a specific datacenter (US-East or US-West). For each record, extract the
      fields: symbol, date, open, high, low, close, volume, adjusted_close, and market_cap.
      Convert all numeric fields to IEEE 754 doubles, ensure dates are ISO-8601 UTC,
      and flag any missing or NaN values with a sentinel NULL. Output a JSON array
      where each element is a flat object keyed by these columns, and include metadata:
      source_datacenter, fetch_latency_ms, and parse_duration_ms. The parsing must
      honor the latency constraints specified by the datafeed: 100 ms per 1 kB chunk,
      with an upper bound of 5 s per full payload. If the payload exceeds 10 MB, split
      it into paginated segments and process each sequentially, aggregating the results
      into the final array.'
  parse_nyse_stock_data:
    agent: false
    description: Transforms raw NYSE stock data retrieved over HTTPS into a normalized,
      time-stamped JSON structure, incorporating latency metrics, datacenter provenance,
      and rigorous validation to ensure downstream consistency.
    name: parse_nyse_stock_data
    nodes_depended_on:
    - fetch_nyse_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: ISO‑8601 UTC of record ingestion
      key: timestamp
      type: str
    - description: NYSE
      key: exchange
      type: str
    - description: ticker symbol
      key: symbol
      type: str
    - description: last traded price (float)
      key: price
      type: float
    - description: total traded volume (integer)
      key: volume
      type: int
    - description: object containing `latency_ms`, `datacenter`, and `source_url`
      key: metadata
      type: str
    prompt: "Parse the fetched NYSE stock data into a clean, query-friendly schema:\\\
      \n1. **Protocol details** – Assume the data arrives over HTTPS via the NYSE’s\
      \ public API using JSON-lines format with `application/json` content-type.\\\
      \n2. **Latency handling** – The raw payload may contain up to 200 ms of network\
      \ latency; implement a timeout of 5 s and retry logic with exponential back-off\
      \ (max 3 attempts).\\\n3. **Datacenter mapping** – NYSE data is replicated across\
      \ two primary datacenters: **New York (US‑East‑1)** and **London (EU‑West‑2)**.\
      \ Select the nearest datacenter based on the client’s IP location and record\
      \ the chosen region in the output metadata.\\\n4. **Output structure** – Emit\
      \ a JSON object with the following keys:\\\n   * `timestamp` – ISO‑8601 UTC\
      \ of record ingestion.\\\n   * `exchange` – \"NYSE\".\\\n   * `symbol` – ticker\
      \ symbol.\\\n   * `price` – last traded price (float).\\\n   * `volume` – total\
      \ traded volume (integer).\\\n   * `metadata` – object containing `latency_ms`,\
      \ `datacenter`, and `source_url`\\\n5. **Validation** – Verify that all numeric\
      \ fields are non-negative and that `timestamp` is within ±30 seconds of the\
      \ current system time. Flag and discard any malformed records.\\\n6. **Return**\
      \ – A list of validated, structured records ready for downstream analytics or\
      \ storage.\\\n      "
  parse_toronto_stock_exchange_stock_data:
    agent: false
    description: Transforms the raw JSON stock feed from the Toronto Stock Exchange
      into a rigorously validated, high-precision time-series DataFrame, enriching
      it with latency and datacenter provenance metadata for auditability and downstream
      analytics.
    name: parse_toronto_stock_exchange_stock_data
    nodes_depended_on:
    - fetch_toronto_stock_exchange_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: Ticker symbol.
      key: ticker
      type: str
    - description: Exact trade timestamp (ISO 8601 UTC)
      key: timestamp
      type: str
    - description: Opening price.
      key: open
      type: float
    - description: Highest price during the interval.
      key: high
      type: float
    - description: Lowest price during the interval.
      key: low
      type: float
    - description: Closing price.
      key: close
      type: float
    - description: Traded volume.
      key: volume
      type: int
    - description: Adjusted close for splits/dividends.
      key: adjusted_close
      type: float
    prompt: 'Parse the raw JSON payload returned from the Toronto Stock Exchange API
      into a canonical, time-series DataFrame with the following schema:'
  repartition_combined_stock_data:
    agent: false
    description: Reorganizes the normalized stock dataset into an efficient, distributed
      partition layout that matches the chosen storage engine’s key strategy.
    name: repartition_combined_stock_data
    nodes_depended_on:
    - normalize_combined_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: Name of the chosen storage layout
      key: storage_layout_name
      type: str
    - description: Number of optimized partitions
      key: optimized_partitions_count
      type: int
    - description: Total data size in GB
      key: total_data_size_gb
      type: float
    - description: Percentage of latency optimized
      key: latency_optimized_percentage
      type: float
    - description: List of metrics for data distribution
      key: data_distribution_metrics
      type: List[bool]
