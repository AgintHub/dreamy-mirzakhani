dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: List of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: List of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: List of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: List of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered
      key: regression_summary
      type: str
    prd:
      conceptual_info: Identify regression risks by analyzing the results of regression
        tests.
      docstring:
        examples:
        - lines:
          - 'analyze_regression_test_results(run_regression_results={''baseline_vs_actual_results'':
            [''success'', ''failure''], ''state_drift_indicators'': [''indicator1'',
            ''indicator2''], ''performance_metrics'': [''metric1'', ''metric2'']})'
          output: '{''feature_name'': [''feature1'', ''feature2''], ''before_after_state_comparison'':
            [''before vs after'', ''before vs after''], ''impact_severity_estimation'':
            [3, 5], ''regression_summary'': ''summary of regressions''}'
        - lines:
          - 'analyze_regression_test_results(run_regression_results={''baseline_vs_actual_results'':
            [], ''state_drift_indicators'': [], ''performance_metrics'': []})'
          output: '{''feature_name'': [], ''before_after_state_comparison'': [], ''impact_severity_estimation'':
            [], ''regression_summary'': ''''}'
        parameters:
        - description: Output of the run_regression_tests node, containing baseline
            vs actual results, state drift indicators, and performance metrics.
          name: run_regression_results
          type: dict
        raises:
        - description: If the run_regression_results input is empty or contains invalid
            data.
          type: ValueError
        returns:
          description: A dictionary containing the features with regression anomalies,
            along with their before/after state comparison and impact severity estimation.
          type: dict
        summary: Analyze regression test results to identify regression risks.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Identify unit-level anomalies
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: The name of the test case that failed
      key: test_case_name
      type: List[str]
    - description: The actual output of the test case that failed
      key: actual_output
      type: List[str]
    - description: A suggested root cause of the failure from an implementation perspective
      key: suggested_root_cause
      type: List[str]
    - description: The type of test that failed
      key: test_type
      type: List[str]
    - description: A list of test cases that passed
      key: passed_tests
      type: List[str]
    - description: A list of test cases that failed
      key: failed_tests
      type: List[str]
    prd:
      conceptual_info: This node analyzes unit test results and identifies any anomalies.
      docstring:
        examples:
        - lines:
          - 'def analyze_unit_test_results(test_execution_status, actual_output_vs_expected_output,
            test_case_timestamps):'
          - '    failed_test_cases = []'
          - '    for i in range(len(test_execution_status)):'
          - '        if test_execution_status[i] == False: '
          - '            failed_test_cases.append({''test_case_name'': ''test_name'',
            ''actual_output'': ''actual_output'', ''suggested_root_cause'': ''suggested_root_cause'',
            ''test_type'': ''test_type'', ''passed_tests'': ''passed_tests'', ''failed_tests'':
            ''failed_tests''})'
          - '    return {''test_case_name'': [test[0] for test in failed_test_cases],'
          - '           ''actual_output'': [test[1] for test in failed_test_cases],'
          - '           ''suggested_root_cause'': [test[2] for test in failed_test_cases],'
          - '           ''test_type'': [test[3] for test in failed_test_cases],'
          - '           ''passed_tests'': [test[4] for test in failed_test_cases],'
          - '           ''failed_tests'': [test[5] for test in failed_test_cases]}'
          output: '{"test_case_name": [''failed_test_name''], \"actual_output\": [''failed_actual_output''],
            \"suggested_root_cause\": [''failed_suggested_root_cause''], \"test_type\":
            [''failed_test_type''], \"passed_tests\": [''passed_test''], \"failed_tests\":
            [''failed_test'']}'
        parameters:
        - description: The pass/fail status of each test case, obtained from the parent
            node 'run_unit_tests'.
          name: test_execution_status
          type: bool
        - description: The difference between the actual and expected output of each
            test case, also obtained from the parent node 'run_unit_tests'.
          name: actual_output_vs_expected_output
          type: str
        - description: Timestamps for each test execution, another output field from
            the parent node 'run_unit_tests'.
          name: test_case_timestamps
          type: str
        raises:
        - description: If the input data types do not match the expected types.
          type: TypeError
        returns:
          description: 'A dictionary containing the following keys: test_case_name,
            actual_output, suggested_root_cause, test_type, passed_tests, and failed_tests.'
          type: Dict[str, Union[List[str], List[str], List[str], List[str], List[str],
            List[str]]
        summary: Analyze unit test results to identify anomalies.
    prompt: 'List all test failures with: 1) Test case name, 2) Actual output, 3)
      Suggested root cause from implementation perspective.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: This node generates integration test cases based on the test
        objectives and coverage requirements defined in the plan_test_scope node.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Test Objective 1', 'Test Objective 2']
          - core_functionality_requirements = ['Core Functionality 1', 'Core Functionality
            2']
          - edge_case_requirements = ['Edge Case 1', 'Edge Case 2']
          - performance_requirements = ['Performance Requirement 1', 'Performance
            Requirement 2']
          - integration_test_scenarios = generate_integration_test_cases(test_objectives,
            core_functionality_requirements, edge_case_requirements, performance_requirements)
          output: '[''Test Scenario 1'', ''Test Scenario 2'', ''Test Scenario 3'',
            ''Test Scenario 4'', ''Test Scenario 5'', ''Test Scenario 6'']'
        parameters:
        - description: List of high-level test objectives from the plan_test_scope
            node
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements from the plan_test_scope
            node
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements from the plan_test_scope node
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements from the plan_test_scope node
          name: performance_requirements
          type: List[str]
        raises:
        - description: If the input parameters are invalid
          type: ValueError
        returns:
          description: List of integration test scenarios
          type: List[str]
        summary: Generate integration test cases based on test objectives and coverage
          requirements.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: This node generates test cases for unchanged features validation
        by targeting high-risk features.
      docstring:
        examples:
        - lines:
          - 'plan_test_scope = {''test_objectives'': [...], ''core_functionality_requirements'':
            [...], ''edge_case_requirements'': [...], ''performance_requirements'':
            [...]}'
          output: '{''high_risk_features'': [...], ''precondition_setup'': [...],
            ''expected_state_preservation'': [...]}'
        - lines:
          - 'plan_test_scope = {''test_objectives'': [...], ''core_functionality_requirements'':
            [...], ''edge_case_requirements'': [...], ''performance_requirements'':
            [...], ''high-risk_features'': [''feature1'', ''feature2'']}'
          output: '{''high_risk_features'': [''feature1'', ''feature2''], ''precondition_setup'':
            [...], ''expected_state_preservation'': [...]}'
        parameters:
        - description: Test objectives and coverage requirements from plan_test_scope
            node.
          name: plan_test_scope
          type: dict
        raises:
        - description: If plan_test_scope is not a dictionary.
          type: TypeError
        returns:
          description: Regression test scenarios with high-risk features, precondition
            setup, and expected state preservation.
          type: dict
        summary: Generates regression test scenarios with precondition setup and expected
          state preservation.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the test case
      key: test_id
      type: str
    - description: List of input parameters required for the test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for the test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: This node creates unit test cases for module-level validation,
        focusing on core functional components.
      docstring:
        examples:
        - lines:
          - test_id = 'test_case_1'
          - input_parameters = ['input_param_1', 'input_param_2']
          - expected_output = ['expected_output_1', 'expected_output_2']
          output: '{''test_id'': ''test_case_1'', ''input_parameters'': [''input_param_1'',
            ''input-param_2''], ''expected_output'': [''expected_output_1'', ''expected-output_2'']}'
        - lines:
          - test_id = 'test_case_2'
          - input_parameters = ['input_param_3', 'input_param_4']
          - expected_output = ['expected_output_3', 'expected_output_4']
          output: '{''test_id'': ''test_case_2'', ''input_parameters'': [''input_param_3'',
            ''input_param_4''], ''expected_output'': [''expected_output_3'', ''expected_output_4'']}'
        parameters:
        - description: High-level test objectives from the plan_test_scope node
          name: test_objectives
          type: List[str]
        - description: Core functionality requirements from the plan_test_scope node
          name: core_functionality_requirements
          type: List[str]
        - description: Edge case requirements from the plan_test_scope node
          name: edge_case_requirements
          type: List[str]
        - description: Performance requirements from the plan_test_scope node
          name: performance_requirements
          type: List[str]
        raises: []
        returns:
          description: A dictionary with test_id, input_parameters, and expected_output
            as key-value pairs.
          type: dict[str, (List[str], List[str], List[str])]
        summary: Generate unit test case templates with test ID, input parameters,
          and expected output.
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Number of tests that failed
      key: fail_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: This node compiles the test results summary by aggregating
        various metrics from the test results.
      docstring:
        examples:
        - lines:
          - 'defect_report = {''pass_count'': 10, ''fail_count'': 5}; generate_test_report(defect_report)'
          output: '{"total_tests_executed": 15, "pass_count": 10, "fail_count": 5,
            "defect_density": 0.3333333333333333, "risk_assessment_rating": 5}'
        parameters:
        - description: Defect report from the report_defects node
          name: report_defects
          type: dict
        raises: []
        returns:
          description: '{total_tests_executed: Total number of tests executed, pass_count:
            Number of tests that passed, fail_count: Number of tests that failed,
            defect_density: Defect density metric, risk_assessment_rating: Risk assessment
            rating (1-10)}'
          type: dict
        summary: Compile test results summary by aggregating metrics.
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: This node defines high-level test objectives and coverage requirements
        for the software under test.
      docstring:
        examples:
        - lines:
          - input_test_objectives = ['Test Objective 1', 'Test Objective 2', 'Test
            Objective 3']
          - input_core_functionality_requirements = ['Core Functionality Requirement
            1', 'Core Functionality Requirement 2']
          - input_edge_case_requirements = ['Edge Case Requirement 1', 'Edge Case
            Requirement 2']
          - input_performance_requirements = ['Performance Requirement 1', 'Performance
            Requirement 2']
          - plan_test_scope(input_test_objectives, input_core_functionality_requirements,
            input_edge_case_requirements, input_performance_requirements)
          output: '{''test_objectives'': [''Test Objective 1'', ''Test Objective 2'',
            ''Test Objective 3''], ''core_functionality_requirements'': [''Core Functionality
            Requirement 1'', ''Core Functionality Requirement 2''], ''edge_case_requirements'':
            [''Edge Case Requirement 1'', ''Edge Case Requirement 2''], ''performance_requirements'':
            [''Performance Requirement 1'', ''Performance Requirement 2'']}'
        parameters:
        - description: List of high-level test objectives
          name: input_test_objectives
          type: List[str]
        - description: List of core functionality requirements
          name: input_core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements
          name: input_edge_case_requirements
          type: List[str]
        - description: List of performance requirements
          name: input_performance_requirements
          type: List[str]
        raises:
        - description: If input requirements are not provided as a list of strings
          type: TypeError
        returns:
          description: A dictionary containing high-level test objectives and coverage
            requirements
          type: '-> {test_objectives: List[str], core_functionality_requirements:
            List[str], edge_case_requirements: List[str], performance_requirements:
            List[str]}

            '
        summary: Defines test objectives and coverage requirements for the software
          under test.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Aggregate testing anomalies and create a defect summary table.
      docstring:
        examples:
        - lines:
          - 'test_results_unit = {''test_case_name'': [''Test1'', ''Test2''], ''actual_output'':
            [''pass'', ''fail''], ''suggested_root_cause'': [''root cause 1'', ''root
            cause 2'']}'
          - 'test_results_integration = {''interface_failures'': [''interface failure
            1'', ''interface failure 2''], ''component_pairs'': [''component pair
            1'', ''component pair 2''], ''data_exchange_issues'': [''data exchange
            issue 1'', ''data exchange issue 2''], ''contract_violations'': [''contract
            violation 1'', ''contract violation 2'']}'
          - 'test_results_regression = {''feature_name'': [''feature 1'', ''feature
            2''], ''before_after_state_comparison'': [''before/after state comparison
            1'', ''before/after state comparison 2''], ''impact_severity_estimation'':
            [1, 2], ''regression_summary'': [''regression summary 1'', ''regression
            summary 2'']}'
          - report_defects(**test_results_unit, **test_results_integration, **test_results_regression)
          output: '[(''unit'', ''null'', ''Test1: pass, root cause 1'', ''low'', ''null''),
            (''unit'', ''null'', ''Test2: fail, root cause 2'', ''medium'', ''null''),
            (''integration'', ''component pair 1'', ''interface failure 1'', ''high'',
            ''steps to reproduce 1''), (''integration'', ''component pair 2'', ''interface
            failure 2'', ''high'', ''steps to reproduce 2''), (''regression'', ''feature
            1'', ''before/after state comparison 1'', ''low'', ''steps to reproduce
            1''), (''regression'', ''feature 2'', ''before/after state comparison
            2'', ''medium'', ''steps to reproduce 2'')]'
        parameters:
        - description: Results from various test types (unit, integration, regression)
          name: test_results
          type: dict
        raises:
        - description: If the input test results are invalid or missing.
          type: ValueError
        returns:
          description: A tuple containing the test type, component information, description,
            severity, and reproduction steps of the defect.
          type: tuple
        summary: Aggregate testing anomalies from various test types and create a
          defect summary table.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: Execute integration test scenarios and document communication
        logs and interface validation outcomes.
      docstring:
        examples:
        - lines:
          - "integration_test_scenarios = [\n                  'test_scenario_1',\n\
            \                  'test_scenario_2'\n                ]"
          - test_environment = setup_test_environment(hardware_specs=['spec1', 'spec2'])
          - run_integration_tests(integration_test_scenarios, test_environment)
          output: "{\n                'communication_logs': ['log1', 'log2'],\n  \
            \              'interface_validation_results': ['result1', 'result2'],\n\
            \                'test_scenario_ids': ['test_1', 'test_2']\n         \
            \     }"
        parameters:
        - description: List of integration test scenarios to execute
          name: integration_test_scenarios
          type: List[int]
        - description: Setup test environment with required hardware/software specs
          name: test_environment
          type: dict
        raises:
        - description: If test execution fails due to some reason
          type: TestError
        returns:
          description: Dict containing communication logs, interface validation results,
            test scenario IDs
          type: dict
        summary: Runs integration tests and documents the results.
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: Execute unchanged feature validation
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of baseline vs actual results
      key: baseline_vs_actual_results
      type: List[str]
    - description: List of state drift indicators
      key: state_drift_indicators
      type: List[str]
    - description: List of performance metrics
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: Execute regression tests for unchanged features, recording
        baseline vs actual results, state drift indicators, and performance metrics.
      docstring:
        examples:
        - lines:
          - "output = run_regression_tests(design_regression_test_cases={'high_risk_features':\
            \ ['feature1', 'feature2'], 'precondition_setup': ['setup1', 'setup2'],\
            \ 'expected_state_preservation': ['preservation1', 'preservation2']},\
            \ \"\n                \"setup_test_environment={'hardware_specs': ['spec1',\
            \ 'spec2'], 'software_specs': ['spec3', 'spec4'], 'test_data_sets': ['set1',\
            \ 'set2'], 'mock_services': ['service1', 'service2'], 'environment_status':\
            \ True})"
          output: "({[(feature1, act1), (feature2, act2)], [(indicator1, drift1)],\
            \ [(metric1, perf1)]}, \"\n                        \"([(indicator2, drift2)],\
            \ state2), ([metric2, perf2]))"
        - lines:
          - "output = run_regression_tests(design_regression_test_cases={'high_risk_features':\
            \ ['feature3', 'feature4'], 'precondition_setup': ['setup3', 'setup4'],\
            \ 'expected_state_preservation': ['preservation3', 'preservation4']},\
            \ \"\n                \"setup_test_environment={'hardware_specs': ['spec5',\
            \ 'spec6'], 'software_specs': ['spec7', 'spec8'], 'test_data_sets': ['set3',\
            \ 'set4'], 'mock_services': ['service3', 'service4'], 'environment_status':\
            \ True})"
          output: "({[(feature3, act3), (feature4, act4)], [(indicator3, drift3)],\
            \ [(metric3, perf3)]}, \"\n                        \"([(indicator4, drift4)],\
            \ state4), ([metric4, perf4]))"
        parameters:
        - description: Test cases designed for regression testing, including high-risk
            features, precondition setup, and expected state preservation.
          name: design_regression_test_cases
          type: object
        - description: Environment setup details, including hardware specs, software
            specs, test data sets, mock services, and environment status.
          name: setup_test_environment
          type: object
        raises:
        - description: If an unexpected error occurs during regression testing.
          type: RuntimeError
        returns:
          description: Return (baseline_vs_actual_results, state_drift_indicators,
            performance_metrics) as (list of str, list of str, list of str)
          type: tuple
        summary: Run regression tests, documenting baseline vs actual results, state
          drift indicators, and performance metrics.
    prompt: 'Execute regression scenarios and record: 1) Baseline vs actual results,
      2) State drift indicators, 3) Performance metrics.'
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: bool
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: str
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: str
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up
      key: environment_status
      type: bool
    prd:
      conceptual_info: This node prepares the testing infrastructure and dependencies
        required for testing.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Test case 1', 'Test case 2', 'Test case 3']
          - core_functionality_requirements = ['Functionality 1', 'Functionality 2',
            'Functionality 3']
          - edge_case_requirements = ['Edge case 1', 'Edge case 2', 'Edge case 3']
          - performance_requirements = ['Performance Requirement 1', 'Performance
            Requirement 2', 'Performance Requirement 3']
          - setup_test_environment(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements)
          - print(setup_test_environment(output))
          output: '{''hardware_specs'': [''Hardware Requirement 1'', ''Hardware Requirement
            2''], ''software_specs'': [''Software Requirement 1'', ''Software Requirement
            2''], ''test_data_sets'': [''Test Data Set 1'', ''Test Data Set 2''],
            ''mock_services'': [''Mock Service 1'', ''Mock Service 2''], ''environment_status'':
            True}'
        parameters:
        - description: List of high-level test objectives provided by the plan_test_scope
            node
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements provided by the plan_test_scope
            node
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements provided by the plan_test_scope
            node
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements provided by the plan_test_scope
            node
          name: performance_requirements
          type: List[str]
        raises: []
        returns:
          description: A dictionary containing the hardware, software, test data,
            and mock service requirements, as well as the status of the test environment
            setup
          type: dict
        summary: Prepare the testing infrastructure and dependencies required for
          testing.
    prompt: 'List 3-5 environment requirements: hardware/software specs, test data
      sets, mock services needed for testing.'
  sign_off_test_cycle:
    agent: false
    description: Final quality validation status
    name: sign_off_test_cycle
    nodes_depended_on:
    - generate_test_report
    nodes_dependent_on: []
    output_structure:
    - description: Validation status of the test cycle
      key: validation_status
      type: str
    - description: Residual risk acceptance statement from the product owner
      key: residual_risk_acceptance_statement
      type: str
    - description: Validation status of the test cycle as signed off by the QA lead
      key: qa_lead_validation_status
      type: str
    - description: List of completion metrics for the test cycle, such as pass/fail
        counts, defect density, and risk assessment rating
      key: test_cycle_completion_metrics
      type: List[str]
    prd:
      conceptual_info: This node signifies the conclusion of testing for a test cycle,
        taking into account results from test execution and input from QA lead and
        product owner.
      docstring:
        examples:
        - lines:
          - 'generate_test_report_output = {''total_tests_executed'': 10, ''pass_count'':
            8, ''fail_count'': 2, ''defect_density'': 0.2, ''risk_assessment_rating'':
            8}'
          - qa_lead_validation_status = 'Approved'
          - residual_risk_acceptance_statement = 'Acceptance of remaining risk is
            acknowledged'
          output: '{validation_status: Approved, residual_risk_acceptance_statement:
            Acceptance of remaining risk is acknowledged, qa_lead_validation_status:
            Approved, test_cycle_completion_metrics: [8/10 tests passed, Defect density:
            0.2, Risk assessment rating: 8]}'
        - lines:
          - 'generate_test_report_output = {''total_tests_executed'': 10, ''pass_count'':
            7, ''fail_count'': 3, ''defect_density'': 0.3, ''risk_assessment_rating'':
            6}'
          - qa_lead_validation_status = 'Rejected'
          - residual_risk_acceptance_statement = 'Not accepting remaining risk'
          output: '{validation_status: Rejected, residual_risk_acceptance_statement:
            Not accepting remaining risk, qa_lead_validation_status: Rejected, test_cycle_completion_metrics:
            [7/10 tests passed, Defect density: 0.3, Risk assessment rating: 6]}'
        parameters:
        - description: Validation status as signed off by QA lead (e.g., 'Approved',
            'Rejected')
          name: qa_lead_validation_status
          type: str
        - description: Stated acceptance of residual risk by product owner
          name: residual_risk_acceptance_statement
          type: str
        - description: Output from generate_test_report node containing test cycle
            results
          name: generate_test_report_output
          type: dict
        raises:
        - description: If QA lead validation status and product owner acceptance statement
            are contradictory or missing
          type: ValueError
        returns:
          description: Validation status and residual risk acceptance statement with
            test cycle completion metrics
          type: dict
        summary: Final quality validation status based on QA lead sign-off and product
          owner acceptance of residual risk.
    prompt: 'Confirm test cycle completion with: 1) Approved sign-off by QA lead,
      2) Residual risk acceptance statement from product owner.'
