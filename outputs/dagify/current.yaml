dag_type: spec
description: Generated workflow from UI.
name: quicksort_functional_dag
nodes:
  combine_results:
    agent: false
    description: Combine the sorted left partition, the equal pivot partition, and
      the sorted right partition into a single, fully sorted list.
    name: combine_results
    nodes_depended_on:
    - sort_left
    - sort_right
    - partition_list
    nodes_dependent_on: []
    output_structure:
    - description: Final sorted list produced by concatenating the sorted less sublist,
        the equal pivot elements, and the sorted greater sublist.
      key: sorted_list
      type: int
    prd:
      conceptual_info: 'This node assembles the results of the recursive quicksort
        steps. It takes three pieces: the sorted elements less than the pivot, the
        elements equal to the pivot (the pivot value replicated as needed), and the
        sorted elements greater than the pivot. By concatenating these three lists,
        it yields the final sorted sequence for the current recursive call.'
      docstring:
        examples:
        - lines:
          - combine_results([1, 2], [3, 3], [4, 5, 6])
          output: '[1, 2, 3, 3, 4, 5, 6]'
        - lines:
          - combine_results([], [], [7, 8, 9])
          output: '[7, 8, 9]'
        parameters:
        - description: The sorted sublist of elements that are less than the pivot.
          name: sorted_less
          type: List[int]
        - description: The list of elements from the input that are exactly equal
            to the pivot value.
          name: equal
          type: List[int]
        - description: The sorted sublist of elements that are greater than the pivot.
          name: sorted_greater_sublist
          type: List[int]
        raises:
        - description: If any input is not a list of integers.
          type: TypeError
        - description: If inputs contain non-integer elements.
          type: ValueError
        returns:
          description: The final concatenated list representing the sorted sequence
            for this partition.
          type: List[int]
        summary: Merge three parts (sorted less, equal pivot, sorted greater) into
          the final sorted list.
    prompt: Concatenate the sorted 'less' sublist, the 'equal' list of pivot elements,
      and the sorted 'greater' sublist to form the final sorted list. Input parameters
      are the sorted_less sublist (elements < pivot), equal (elements == pivot), and
      sorted_greater_sublist (elements > pivot). Output a JSON array representing
      the final sorted list.
  partition_list:
    agent: false
    description: Partition the list into elements less than, equal to, and greater
      than the pivot.
    name: partition_list
    nodes_depended_on:
    - select_pivot
    nodes_dependent_on: []
    output_structure:
    - description: List of elements from the input that are less than the pivot value.
      key: less
      type: int
    - description: List of elements from the input that are exactly equal to the pivot
        value.
      key: equal
      type: int
    - description: List of elements from the input that are greater than the pivot
        value.
      key: greater
      type: int
    prd:
      conceptual_info: Divides an unsorted integer list into three distinct sub‑lists
        based on a pivot value supplied by the parent node. This is the core partition
        step of the quick‑sort algorithm.
      docstring:
        examples:
        - lines:
          - partition_list([9, 3, 5, 2, 8, 5, 1], 5)
          output: '{''less'': [3, 2, 1], ''equal'': [5, 5], ''greater'': [9, 8]}'
        - lines:
          - partition_list([4, 4, 4], 4)
          output: '{''less'': [], ''equal'': [4, 4, 4], ''greater'': []}'
        parameters:
        - description: The unsorted list of integers to be partitioned.
          name: input_list
          type: List[int]
        - description: The pivot value around which the list is partitioned. Obtained
            from the `select_pivot` node.
          name: pivot
          type: int
        raises:
        - description: If `input_list` is not a list of integers or if `pivot` is
            not an integer.
          type: TypeError
        - description: If `input_list` is empty.
          type: ValueError
        returns:
          description: A dictionary with keys 'less', 'equal', and 'greater' mapping
            to the respective sub‑lists of integers.
          type: Dict[str, List[int]]
        summary: 'Partition a list of integers into three groups relative to a pivot
          value: less than, equal to, and greater than the pivot.'
    prompt: 'Given the input list and the selected pivot, separate elements into three
      lists: elements less than the pivot, equal to the pivot, and greater than the
      pivot. Return as a JSON object with keys ''less'', ''equal'', and ''greater''.'
  select_pivot:
    agent: false
    description: Select a pivot element from the unsorted list.
    name: select_pivot
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Single-element list containing the pivot value selected from the
        input list.
      key: pivot
      type: int
    prd:
      conceptual_info: The node extracts a single pivot value from an input list of
        integers, typically the first element, and returns it wrapped in a one‑element
        list. This pivot is later used to partition the list for the quicksort algorithm.
      docstring:
        examples:
        - lines:
          - select_pivot([7, 3, 9, 1])
          output: '[7]'
        - lines:
          - select_pivot([42])
          output: '[42]'
        parameters:
        - description: The list of integers from which the pivot will be selected.
            Must contain at least one element.
          name: unsorted_list
          type: list[int]
        raises:
        - description: If ``unsorted_list`` is empty, because a pivot cannot be selected
            from an empty collection.
          type: ValueError
        - description: If ``unsorted_list`` is not a list of integers.
          type: TypeError
        returns:
          description: A list of length 1 whose sole element is the selected pivot
            value.
          type: list[int]
        summary: 'Select the pivot element for quicksort.


          The function receives an unsorted list of integers and returns a one‑element
          list containing the chosen pivot value. By convention the first element
          of the input list is used as the pivot, but the implementation may be changed
          without affecting downstream nodes as long as the return type remains a
          single‑element integer list.'
    prompt: Select a pivot element (e.g., first element) from the input list. Return
      the pivot value as a single-element JSON array.
  sort_left:
    agent: false
    description: Recursively apply quicksort to the left (less than pivot) partition.
    name: sort_left
    nodes_depended_on:
    - partition_list
    nodes_dependent_on: []
    output_structure:
    - description: The sorted sublist of elements that are less than the pivot.
      key: sorted_less
      type: List[int]
    prd:
      conceptual_info: The `sort_left` node receives the `less` partition from `partition_list`,
        recursively sorts it using the same quicksort workflow, and outputs the sorted
        left sublist. It is a core recursive step that ensures all elements smaller
        than the current pivot end up in order before final concatenation.
      docstring:
        examples:
        - lines:
          - sorted_less = sort_left([3, 1, 4, 2])
          output: '[1, 2, 3, 4]'
        - lines:
          - sorted_less = sort_left([])
          output: '[]'
        parameters:
        - description: List of integers that are smaller than the current pivot, obtained
            from the `partition_list` node.
          name: less
          type: List[int]
        raises:
        - description: If `less` is not a list of integers.
          type: TypeError
        - description: If the recursion depth exceeds Python's limit, indicating a
            possible non‑terminating input.
          type: RecursionError
        returns:
          description: A new list containing the elements of `less` sorted in ascending
            order.
          type: List[int]
        summary: Recursively sorts the 'less' partition of a list using the quicksort
          algorithm.
    prompt: Apply the quicksort process to the 'less' sublist. Return the sorted sublist
      as a JSON array.
  sort_right:
    agent: false
    description: Recursively apply quicksort to the right (greater than pivot) partition.
    name: sort_right
    nodes_depended_on:
    - partition_list
    nodes_dependent_on: []
    output_structure:
    - description: Sorted list of elements that are greater than the pivot.
      key: sorted_greater_sublist
      type: List[int]
    prd:
      conceptual_info: This node receives the 'greater' partition from `partition_list`
        and recursively sorts it using the quicksort algorithm, returning the sorted
        sub‑list.
      docstring:
        examples:
        - lines:
          - sorted_right = sort_right([9, 7, 5, 8])
          output: '[5, 7, 8, 9]'
        - lines:
          - sort_right([])
          output: '[]'
        parameters:
        - description: List of integers that are greater than the current pivot, produced
            by the `partition_list` node.
          name: greater_sublist
          type: List[int]
        raises:
        - description: If `greater_sublist` is not a list of integers.
          type: TypeError
        - description: If the recursion depth exceeds Python's limit due to malformed
            input.
          type: RecursionError
        returns:
          description: The input sub‑list sorted in ascending order.
          type: List[int]
        summary: Recursively quicksort the sub‑list of elements greater than the pivot.
    prompt: Apply the quicksort process to the 'greater' sublist. Return the sorted
      sublist as a JSON array.
