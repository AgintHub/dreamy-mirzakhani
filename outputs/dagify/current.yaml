dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: A list of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: A list of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: A list of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: A list of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: Analyze integration test results to identify interface-level
        issues.
      docstring:
        examples:
        - lines:
          - analyze_integration_test_results(test_results)
          output: '{}'
        - lines:
          - test_results = ['Pair A, Data exchange issue 1', 'Pair B, Contract violation
            2']
          output: "{interface_failures: [Pair A, Data exchange issue 1, Pair B, Contract\
            \ violation 2], \"\n                         \"component_pairs: [Pair\
            \ A, Pair B], \"\n                         \"data_exchange_issues: [Data\
            \ exchange issue 1], \"\n                         \"contract_violations:\
            \ [Contract violation 2]}"
        parameters:
        - description: The results of integration tests.
          name: test_results
          type: List[str]
        raises:
        - description: If invalid test results are provided.
          type: ValueError
        returns:
          description: A dictionary with interface failure descriptions, component
            pairs involved, data exchange issues, and contract violations.
          type: Dict[str, List[str]]
        summary: Analyze the results of integration tests to identify interface-level
          issues.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks by analyzing results from regression testing.
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered
      key: regression_summary
      type: str
    prd:
      conceptual_info: This node analyzes the results from regression testing to identify
        regression risks and generate a summary of the regressions.
      docstring:
        examples:
        - lines:
          - result = run_regression_tests()
          output: '{ ''feature_name'': [''Feature 1'', ''Feature 2''], ''before_after_state_comparison'':
            [''Before/After State 1'', ''Before/After State 2''], ''impact_severity_estimation'':
            [1, 2], ''regression_summary'': ''Regression Summary'' }'
        parameters:
        - description: Output from the run_regression_tests node, containing baseline
            vs actual results, state drift indicators, and performance metrics.
          name: run_regression_tests
          type: object
        raises:
        - description: If the input from the run_regression_tests node is not of the
            expected type.
          type: TypeError
        returns: null
        summary: Analyze regression test results to identify regression risks and
          generate a summary of the regressions.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Aggregate testing anomalies from unit test results and create a defect
      summary table.
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g., high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Aggregate testing anomalies from unit test results and create
        a defect summary table.
      docstring:
        examples: []
        parameters: []
        raises:
        - description: If the inputs are not of the correct type.
          type: ValueError
        returns:
          description: 'A dictionary containing the aggregated defect summary with
            columns: Test Type, Component, Description, Severity, and Reproduction
            Steps.'
          type: dict
        summary: Aggregate testing anomalies from unit test results and create a defect
          summary table.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases.
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases.
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases.
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios.
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: This node is responsible for creating integration test scenarios
        based on the test objectives and coverage requirements defined in the plan_test_scope
        node.
      docstring:
        examples:
        - lines:
          - component_pairs = ['A-B', 'C-D']
          - data_flow_paths = ['Flow-1', 'Flow-2']
          - dependency_validations = ['Dependency-1', 'Dependency-2']
          - integration_test_scenarios = design_integration_test_cases(component_pairs,
            data_flow_paths, dependency_validations)
          - print(integration_test_scenarios)
          output: '[[''A-B''], [''Flow-1''], [''Dependency-1''], ''Scenario-1''],
            [[''C-D''], [''Flow-2''], [''Dependency-2''], ''Scenario-2'']]'
        parameters: []
        raises: []
        returns:
          description: Integration test scenarios.
          type: List[str]
        summary: Generate integration test scenarios.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: Create regression test scenarios to validate unchanged features
      docstring:
        examples:
        - lines:
          - 'def design_regression_test_cases(plan_test_scope):'
          - '    high_risk_features = plan_test_scope[''test_objectives'']'
          - '    precondition_setup = [''Setup instructions for scenario 1'', ''Setup
            instructions for scenario 2'']'
          - '    expected_state_preservation = [''Description of expected state preservation
            for scenario 1'', ''Description of expected state preservation for scenario
            2'']'
          - '    return {''high_risk_features'': high_risk_features, ''precondition_setup'':
            precondition_setup, ''expected_state_preservation'': expected_state_preservation}'
          output: '{''high_risk_features'': [''Feature 1'', ''Feature 2''], ''precondition_setup'':
            [''Setup instructions for scenario 1'', ''Setup instructions for scenario
            2''], ''expected_state_preservation'': [''Description of expected state
            preservation for scenario 1'', ''Description of expected state preservation
            for scenario 2'']}'
        parameters:
        - description: Test objectives and coverage requirements
          name: plan_test_scope
          type: object
        raises:
        - description: If high-risk features are not identified
          type: Exception
        returns:
          description: Regression test scenarios with precondition setup and expected
            state preservation
          type: object
        summary: Design regression test cases to test high-risk features
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for each test case
      key: test_id
      type: List[str]
    - description: List of input parameters required for each test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for each test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: Design unit test cases for module-level validation
      docstring:
        examples:
        - lines:
          - test_scope = plan_test_scope()
          - test_case_templates = design_unit_test_cases(test_scope)
          output: '[([''test_case_1''], [''input_parameter_1''], [''expected_output_1'']),
            ([...''expected_output_7'']),]'
        parameters:
        - description: Object containing high-level test objectives, core functionality,
            edge case and performance requirements
          name: test_scope
          type: plan_test_scope
        raises:
        - description: If the provided test scope is invalid
          type: TypeError
        returns:
          description: A tuple containing test ID, input parameters, and expected
            output for each test case
          type: Tuple[List[str], List[str], List[str]]
        summary: Design unit test cases based on the provided test scope
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed.
      key: total_tests_executed
      type: int
    - description: Number of tests that passed.
      key: pass_count
      type: int
    - description: Defect density metric.
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10).
      key: risk_assessment_rating
      type: int
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: This node defines high-level test objectives, core functionality
        requirements, edge case requirements, and performance requirements for the
        software under test.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Test core functionality', 'Test edge cases', 'Test
            performance requirements'];
          - core_functionality_requirements = ['Require accurate results', 'Ensure
            reliable system'];
          - edge_case_requirements = ['Test with invalid inputs', 'Test with missing
            data'];
          - performance_requirements = ['Meet response time requirements', 'Ensure
            scalability requirements']
          output: "{'test_objectives': ['Test core functionality', 'Test edge cases',\
            \ 'Test performance requirements'], \" +\n              \"'core_functionality_requirements':\
            \ ['Require accurate results', 'Ensure reliable system'], \" +\n     \
            \         \"'edge_case_requirements': ['Test with invalid inputs', 'Test\
            \ with missing data'], \" +\n              \"'performance_requirements':\
            \ ['Meet response time requirements', 'Ensure scalability requirements']}"
        parameters:
        - description: List of high-level test objectives
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements
          name: performance_requirements
          type: List[str]
        raises: []
        returns:
          description: Dict of test objectives, core functionality requirements, edge
            case requirements, and performance requirements
          type: Dict[str, List[str]]
        summary: Plan high-level test objectives, core functionality requirements,
          edge case requirements, and performance requirements for the software under
          test.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario.
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step.
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario.
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: Execute integration tests and document communication logs and
        interface validation outcomes.
      docstring:
        examples:
        - lines:
          - integration_test_results = run_integration_tests(design_integration_test_cases(),
            setup_test_environment())
          output: '{communication_logs: [Log message 1, Log message 2], interface_validation_results:
            [Validation result 1, Validation result 2], test_scenario_ids: [Test scenario
            ID 1, Test scenario ID 2]}'
        - lines:
          - integration_test_results = run_integration_tests(design_integration_test_cases(),
            setup_test_environment())
          output: '{communication_logs: [Log message 3, Log message 4], interface_validation_results:
            [Validation result 3, Validation result 4], test_scenario_ids: [Test scenario
            ID 3, Test scenario ID 4]}'
        parameters: []
        raises:
        - description: If the test scenarios have invalid IDs or if the setup of the
            test environment or the integration test cases fails.
          type: Exception
        returns:
          description: A dictionary containing communication logs, interface validation
            results, and test scenario IDs.
          type: Dict[str, Union[List[str], List[str], List[str]]]
        summary: Execute integration tests and document communication logs and interface
          validation outcomes.
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: This node orchestrates the execution of regression test scenarios
      for unchanged features, collecting baseline vs actual results, state drift indicators,
      and performance metrics.
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of results comparing baseline metrics versus current actual
        results for each regression scenario.
      key: baseline_vs_actual_results
      type: List[str]
    - description: Indicators signaling any detected state drift during regression
        tests, such as deviations or anomalies.
      key: state_drift_indicators
      type: List[str]
    - description: Various performance metrics recorded during regression testing,
        such as response times and throughput.
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: Execute regression test scenarios, collect baseline vs actual
        results, state drift indicators, and performance metrics.
      docstring:
        examples:
        - lines:
          - regression_test_cases = design_regression_test_cases()
          output: Dict containing baseline vs actual results, state drift indicators,
            and performance metrics.
        - lines:
          - test_environment = setup_test_environment()
          output: Dictionary with hardware and software specifications for the test
            environment.
        parameters:
        - description: List of regression test scenarios to be executed.
          name: regression_test_cases
          type: List[str]
        - description: Dictionary of test environment settings, including hardware
            and software specifications.
          name: test_environment
          type: Dict[str, str]
        raises:
        - description: If the regression test cases or test environment settings are
            invalid.
          type: ValueError
        returns:
          description: 'Dictionary with the collected results: baseline vs actual
            results, state drift indicators, and performance metrics.'
          type: Dict[str, List[str]]
        summary: Executing regression test scenarios for unchanged features and collecting
          various metrics.
    prompt: Execute regression scenarios and record results
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: List[bool]
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: List[str]
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: List[str]
    prd:
      conceptual_info: Execute unit test cases and record test execution status, actual
        output vs expected output, and timestamps.
      docstring:
        examples:
        - lines:
          - design_unit_test_cases = design_unit_test_cases.run()
          - setup_test_environment = setup_test_environment.run()
          - result = run_unit_tests/design_unit_test_cases/setup_test_environment)
          output: '{''test_execution_status'': [True, False], ''actual_output_vs_expected_output'':
            [''Pass'', ''Fail''], ''test_case_timestamps'': [''2022-01-01 12:00:00'',
            ''2022-01-01 12:05:00'']}'
        - lines:
          - design_unit_test_cases = design_unit_test_cases.run()
          - setup_test_environment = setup_test_environment.run()
          - result = run_unit_tests(design_unit_test_cases, setup_test_environment)
          output: '{''test_execution_status'': [True, False, False], ''actual_output_vs_expected_output'':
            [''Pass'', ''Fail'', ''Pass''], ''test_case_timestamps'': [''2022-01-01
            12:00:00'', ''2022-01-01 12:05:00'', ''2022-01-01 12:10:00'']}'
        parameters:
        - description: Test cases for module-level validation, including test ID,
            input parameters, and expected output.
          name: design_unit_test_cases
          type: List[test_case]
        - description: Test environment setup, including hardware, software, and mock
            services specifications.
          name: setup_test_environment
          type: environment_status
        raises:
        - description: If test execution fails or environment setup is not completed.
          type: Exception
        returns:
          description: Dictionary with test execution status, actual output vs expected
            output, and timestamps as lists.
          type: Dict[str, List[bool]]
        summary: Execute unit test cases and record test execution metrics.
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing.
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing.
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing.
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing.
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up.
      key: environment_status
      type: bool
    prompt: 'List 3-5 environment requirements: hardware/software specs, test data
      sets, mock services needed for testing.'
  sign_off_test_cycle:
    agent: false
    description: Compile test results summary
    name: sign_off_test_cycle
    nodes_depended_on:
    - generate_test_report
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Number of tests that failed
      key: fail_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
