dag_type: plain_text
description: A detailed weather forecasting workflow that specifies the exact forecasting
  model, training, evaluation, deployment, and operational steps.
name: weather_forecasting_system
nodes:
  collect_historical_weather_data:
    agent: false
    description: Gather historical weather observations and auxiliary data from authoritative
      sources.
    name: collect_historical_weather_data
    nodes_depended_on:
    - define_forecasting_requirements
    nodes_dependent_on:
    - preprocess_historical_data
    prompt: Collect historical weather data for the specified region and variables
      from government databases, weather stations, and satellite archives, ensuring
      coverage over the required time span.
  configure_alerts_and_notifications:
    agent: false
    description: Generate alerts when forecasted conditions exceed user‑defined thresholds.
    name: configure_alerts_and_notifications
    nodes_depended_on:
    - deploy_forecasting_model
    nodes_dependent_on: []
    prompt: Create a rule engine that watches forecast outputs and, when specified
      thresholds (e.g., temperature > 35°C, precipitation > 10 mm) are met, send notifications
      via email or SMS.
  define_forecasting_requirements:
    agent: false
    description: Define the weather forecasting system requirements including region,
      forecast horizon, target variables, and model evaluation criteria.
    name: define_forecasting_requirements
    nodes_depended_on: []
    nodes_dependent_on:
    - collect_historical_weather_data
    - select_forecasting_model
    prompt: Specify the geographic region, forecast horizon (e.g., 1‑3 day, 1‑week),
      target variables (temperature, precipitation, wind speed), and evaluation metrics
      for the weather forecasting system.
  deploy_forecasting_model:
    agent: false
    description: Package the trained model and deploy it into a production environment
      for real‑time inference.
    name: deploy_forecasting_model
    nodes_depended_on:
    - evaluate_forecasting_model
    nodes_dependent_on:
    - integrate_real_time_data
    - monitor_and_update_model
    - configure_alerts_and_notifications
    prompt: Deploy the trained model as a REST API. Include serialization (e.g., joblib,
      ONNX), load time, inference latency, and health check endpoints. Ensure the
      model can receive real‑time data, generate forecasts, and output JSON results.
  evaluate_forecasting_model:
    agent: false
    description: Assess the trained model’s predictive accuracy using multiple metrics
      and visual diagnostics.
    name: evaluate_forecasting_model
    nodes_depended_on:
    - train_forecasting_model
    nodes_dependent_on:
    - deploy_forecasting_model
    prompt: Evaluate the model on a held‑out validation set. Compute MAE, MSE, RMSE,
      and MAPE for each target variable. Generate forecast‑vs‑actual plots and calculate
      bias. Summarize performance in a concise report.
  integrate_real_time_data:
    agent: false
    description: Ingest and preprocess real‑time weather observations to feed into
      the deployed model.
    name: integrate_real_time_data
    nodes_depended_on:
    - deploy_forecasting_model
    nodes_dependent_on: []
    prompt: Set up an ingestion pipeline that pulls real‑time data from sensors or
      APIs, cleans it, and transforms it into the same format expected by the model
      for inference.
  monitor_and_update_model:
    agent: false
    description: Continuously track model performance and retrain when accuracy degrades.
    name: monitor_and_update_model
    nodes_depended_on:
    - deploy_forecasting_model
    nodes_dependent_on: []
    prompt: Implement monitoring to compare forecasted versus observed values over
      time. When error metrics exceed thresholds, trigger a retraining pipeline that
      retrains the model with the latest data.
  preprocess_historical_data:
    agent: false
    description: Clean, impute missing values, and transform the collected data to
      a format suitable for modeling.
    name: preprocess_historical_data
    nodes_depended_on:
    - collect_historical_weather_data
    nodes_dependent_on:
    - select_forecasting_model
    - train_forecasting_model
    prompt: 'Preprocess the historical data: handle missing values, apply scaling
      or normalization as needed, create lagged features, and encode categorical variables.'
  select_forecasting_model:
    agent: false
    description: Choose a specific forecasting model type and determine initial hyperparameters
      based on data characteristics.
    name: select_forecasting_model
    nodes_depended_on:
    - define_forecasting_requirements
    - preprocess_historical_data
    nodes_dependent_on:
    - train_forecasting_model
    prompt: Select a concrete forecasting model for the task (e.g., SARIMA, Prophet,
      LSTM, Gradient Boosted Trees). Specify model family, key hyperparameters, and
      rationale based on seasonality, trend, and data granularity. Use cross‑validation
      to identify promising parameter ranges.
  train_forecasting_model:
    agent: false
    description: Train the selected forecasting model on the preprocessed historical
      data and tune hyperparameters to optimize performance.
    name: train_forecasting_model
    nodes_depended_on:
    - select_forecasting_model
    - preprocess_historical_data
    nodes_dependent_on:
    - evaluate_forecasting_model
    prompt: Train the chosen model using the preprocessed dataset. For SARIMA, use
      auto_arima to find p,d,q; for LSTM, set sequence length 24, dropout 0.2, 200
      epochs, batch size 32, and early stopping. For Gradient Boosted Trees, use XGBoost
      with 500 trees, max depth 5. Report training loss and validation metrics.
