dag_type: plain_text
description: Generated workflow from UI.
name: physician_credentialing_onboarding
nodes:
  assign_clinical_privileges:
    agent: false
    description: Assign specific clinical privileges to the physician in the EMR based
      on committee recommendation.
    name: assign_clinical_privileges
    nodes_depended_on:
    - schedule_privileging_committee_review
    nodes_dependent_on: []
    output_structure:
    - description: List of specific clinical privileges approved and assigned to the
        physician
      key: privileges_assigned
      type: List[str]
    prompt: List the approved clinical privileges (e.g., inpatient admission, surgery)
      and update the EMR profile. Return JSON with privileges_assigned array.
  check_pecos:
    agent: false
    description: Checks the physician's PECOS enrollment status, enrollment date,
      and Medicare eligibility.
    name: check_pecos
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the physician is enrolled in PECOS.
      key: is_enrolled
      type: bool
    - description: Date of PECOS enrollment in YYYY-MM-DD format.
      key: enrollment_date
      type: str
    - description: Indicates whether the physician is eligible for Medicare based
        on PECOS data.
      key: medicare_eligible
      type: bool
    - description: The Medicare enrollment number assigned to the physician.
      key: medicare_number
      type: str
    prompt: Verify the physician's enrollment in the Provider Enrollment, Chain, and
      Ownership System (PECOS) for Medicare participation.
  collect_physician_basic_info:
    agent: false
    description: Gather all required personal and professional information from the
      physician (name, contact, NPI, license number, DEA number, education, work history).
    name: collect_physician_basic_info
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Create a checklist of required basic information for a new physician
      and format the collected data as a JSON object with keys: name, email, phone,
      NPI, medical_license_number, DEA_number, education_history, employment_history,
      malpractice_insurance_provider.'
  compile_credentialing_report:
    agent: false
    description: Aggregate all verification results into a single credentialing report.
    name: compile_credentialing_report
    nodes_depended_on:
    - verify_medical_license
    - verify_board_certification
    - verify_dea_registration
    - verify_malpractice_insurance
    - verify_education_and_training
    - obtain_professional_references
    - conduct_background_check
    - verify_hospital_privileges_history
    - check_pecos
    nodes_dependent_on: []
    output_structure:
    - description: Indicates if the medical license verification passed
      key: medical_license_pass
      type: bool
    - description: Indicates if the board certification verification passed
      key: board_certification_pass
      type: bool
    - description: Indicates if the DEA registration verification passed
      key: dea_registration_pass
      type: bool
    - description: Indicates if the malpractice insurance verification passed
      key: malpractice_insurance_pass
      type: bool
    - description: Indicates if all education and training verifications passed
      key: education_and_training_pass
      type: bool
    - description: Indicates if professional references meet acceptable criteria
      key: professional_references_pass
      type: bool
    - description: Indicates if the background check passed without issues
      key: background_check_pass
      type: bool
    - description: Indicates if the hospital privileges history is clear of revocations
        or limitations
      key: hospital_privileges_history_pass
      type: bool
    - description: Indicates if the PECOS enrollment status is acceptable
      key: pecos_enrollment_pass
      type: bool
    - description: Overall credentialing recommendation, e.g. 'approve' or 'hold'
      key: overall_recommendation
      type: str
    prompt: Combine the JSON outputs from all verification steps into one comprehensive
      credentialing report. Include a pass/fail flag for each category and an overall
      recommendation (approve/hold).
  complete_compliance_training:
    agent: false
    description: Enables the physician to complete required compliance and safety
      training modules and records completion status for each module.
    name: complete_compliance_training
    nodes_depended_on:
    - schedule_orientation
    nodes_dependent_on: []
    output_structure:
    - description: List of IDs for compliance training modules assigned to the physician.
      key: training_module_ids
      type: List[str]
    - description: Corresponding list indicating completion status for each module
        (true
      key: completion_status
      type: List[bool]
    prompt: Enroll the physician in the online compliance training modules, track
      completion, and return JSON with training_module_ids and completion_status.
  conduct_background_check:
    agent: false
    description: Run a national criminal background and sanctions check on the physician.
    name: conduct_background_check
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether any criminal records were found (true for yes,
        false for no).
      key: criminal_records
      type: bool
    - description: Indicates whether the physician is subject to any sanctions (true
        for yes, false for no).
      key: sanctions
      type: bool
    - description: Additional details regarding any criminal records or sanctions
        found.
      key: details_if_any
      type: str
    prompt: 'Perform a simulated background check using the physician''s full name
      and DOB, and return JSON: criminal_records (yes/no), sanctions (yes/no), details_if_any.'
  create_provider_profile_in_emr:
    agent: false
    description: Creates a provider profile in the electronic medical record system
      using the physician's credentialing report and signed employment contract, and
      returns the newly assigned provider ID and creation status.
    name: create_provider_profile_in_emr
    nodes_depended_on:
    - compile_credentialing_report
    - obtain_signed_employment_contract
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier assigned to the provider in the EMR system.
      key: provider_id
      type: str
    - description: Status of the provider profile creation, e.g., 'success', 'failure'.
      key: status
      type: str
    prompt: Using the credentialing report and signed employment contract, populate
      the EMR provider fields (name, NPI, specialties, license, DEA, privileges).
      Return JSON with provider_id and status.
  finalize_credentialing:
    agent: false
    description: Mark the physician as fully credentialed and ready for clinical duties.
    name: finalize_credentialing
    nodes_depended_on:
    - schedule_privileging_committee_review
    - assign_clinical_privileges
    - grant_system_access
    - verify_hippa_acknowledgment
    nodes_dependent_on: []
    output_structure:
    - description: Final status of the credentialing process (e.g., 'Active').
      key: final_status
      type: str
    - description: Date the physician was activated, formatted as YYYY-MM-DD.
      key: activation_date
      type: str
    prompt: Update the credentialing database status to 'Active', log the date of
      activation, and output JSON with final_status and activation_date.
  grant_system_access:
    agent: false
    description: Provision user accounts for the physician across multiple clinical
      systems, generating usernames and temporary passwords for each system.
    name: grant_system_access
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: List of system names for which credentials were provisioned.
      key: system_names
      type: List[str]
    - description: Corresponding list of usernames created for each system.
      key: usernames
      type: List[str]
    - description: Corresponding list of temporary passwords for each system.
      key: temporary_passwords
      type: List[str]
    prompt: Create login credentials for the physician in each required system, set
      appropriate role-based permissions, and output JSON with system_name, username,
      temporary_password.
  notify_hr_payroll:
    agent: false
    description: Sends a notification to the HR and payroll departments indicating
      that the physician has been activated and is eligible for compensation.
    name: notify_hr_payroll
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Status of the notification (e.g., 'sent', 'failed')
      key: notification_status
      type: str
    - description: Departments notified, e.g., ['HR', 'Payroll']
      key: recipient_departments
      type: List[str]
    - description: ISO 8601 timestamp when the notification was sent
      key: timestamp
      type: str
    prompt: Inform HR and payroll that the physician is active and eligible for compensation.
  obtain_professional_references:
    agent: false
    description: Collect and record at least three professional references from the
      physician's recent supervisors. Outputs a summary of each reference including
      the reference's name, relationship to the physician, a rating on a scale of
      1 to 5, and any comments.
    name: obtain_professional_references
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of reference names.
      key: reference_name
      type: List[str]
    - description: List of relationships of each reference to the physician.
      key: reference_relationship
      type: List[str]
    - description: List of ratings (1-5) for each reference.
      key: reference_rating
      type: List[int]
    - description: List of comments for each reference.
      key: reference_comments
      type: List[str]
    - description: Number of references collected.
      key: reference_count
      type: int
    prompt: 'Generate a template email to request reference letters, then summarize
      the received responses as JSON: reference_name, relationship, rating (1‑5),
      comments.'
  obtain_signed_employment_contract:
    agent: false
    description: Send the employment contract to the physician and capture the signed
      copy.
    name: obtain_signed_employment_contract
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier of the signed employment contract
      key: contract_id
      type: str
    - description: Date the contract was signed in ISO 8601 format
      key: signed_date
      type: str
    prompt: Generate an email with a PDF employment contract attached, request electronic
      signature, and return a JSON receipt with contract_id and signed_date once completed.
  schedule_orientation:
    agent: false
    description: Schedules the mandatory orientation session for the newly credentialed
      physician, selecting a suitable time slot and providing location details.
    name: schedule_orientation
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Date of the scheduled orientation session (YYYY-MM-DD or ISO format).
      key: orientation_date
      type: str
    - description: Physical or virtual location of the orientation session.
      key: location
      type: str
    prompt: Select an available orientation slot, send calendar invitation to the
      physician, and return JSON with orientation_date and location.
  schedule_privileging_committee_review:
    agent: false
    description: Schedules the physician for the next privileging committee meeting
      and records the meeting details.
    name: schedule_privileging_committee_review
    nodes_depended_on:
    - compile_credentialing_report
    nodes_dependent_on: []
    prompt: Create a calendar entry for the privileging committee with date, time,
      physician name, and attach the credentialing report.
  update_credentialing_database:
    agent: false
    description: Record all verification results and final status in the central credentialing
      repository, returning a confirmation of the database entry.
    name: update_credentialing_database
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier assigned to the database entry for the credentialing
        report.
      key: record_id
      type: int
    - description: ISO 8601 formatted timestamp of when the record was created in
        the database.
      key: timestamp
      type: str
    prompt: Insert the compiled credentialing report and final status into the credentialing
      database. Return JSON confirming record_id and timestamp.
  verify_board_certification:
    agent: false
    description: Validates the physician's board certification(s) and current status
      by querying the certifying board database.
    name: verify_board_certification
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of certifying boards the physician is certified by.
      key: certification_body
      type: List[str]
    - description: List of specialties for which the physician holds board certifications.
      key: specialty
      type: List[str]
    - description: List of current statuses of each board certification (e.g., active,
        inactive, pending).
      key: certification_status
      type: List[str]
    - description: List of expiration dates for each board certification.
      key: expiration_date
      type: List[str]
    prompt: Check the physician's board certification(s) against the certifying board
      database and output JSON with certification_body, specialty, certification_status,
      and expiration_date.
  verify_dea_registration:
    agent: false
    description: Confirm the DEA registration is active and matches the physician's
      name.
    name: verify_dea_registration
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Status of the DEA registration, e.g., Active, Inactive, Expired.
      key: dea_status
      type: str
    - description: Expiration date of the DEA registration in YYYY-MM-DD format.
      key: expiration_date
      type: str
    - description: Whether the name on the DEA registration matches the physician's
        name.
      key: name_match
      type: bool
    prompt: 'Validate the DEA_number provided, returning JSON: dea_status, expiration_date,
      name_match (true/false).'
  verify_education_and_training:
    agent: false
    description: Authenticate the physician's medical school, residency, and fellowship
      credentials by verifying each education entry against the relevant accrediting
      body.
    name: verify_education_and_training
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: List of unique identifiers or labels for each education entry verified.
      key: education_entry_id
      type: List[str]
    - description: List of education institutions corresponding to each verified education
        entry.
      key: education_institution_name
      type: List[str]
    - description: List of degree or training types (e.g., Medical School, Residency,
        Fellowship) for each education entry.
      key: education_degree_type
      type: List[str]
    - description: List of accrediting bodies used to verify each education entry.
      key: accrediting_body
      type: List[str]
    - description: List indicating whether each education entry was successfully verified
        against the accrediting body.
      key: verification_status
      type: List[bool]
    - description: Additional comments or notes regarding the verification result
        for each education entry.
      key: verification_comments
      type: List[str]
    prompt: Cross-reference each entry in education_history with the appropriate accrediting
      body and output JSON for each entry.
  verify_hippa_acknowledgment:
    agent: false
    description: Records the physician's acknowledgment of HIPAA policies, including
      the date of acknowledgment and the name of the person who signed.
    name: verify_hippa_acknowledgment
    nodes_depended_on:
    - complete_compliance_training
    nodes_dependent_on: []
    output_structure:
    - description: Date when the physician acknowledged HIPAA policies, in ISO 8601
        format.
      key: acknowledgment_date
      type: str
    - description: Name of the physician who signed the acknowledgment.
      key: signed_by
      type: str
    prompt: Capture the electronic signature on the HIPAA acknowledgment form and
      return JSON with acknowledgment_date and signed_by.
  verify_hospital_privileges_history:
    agent: false
    description: Review the physician's prior hospital privileging history for any
      revocations, suspensions, or limitations and produce a concise summary.
    name: verify_hospital_privileges_history
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Indicates if the physician has any revoked privileges
      key: has_revoked_privileges
      type: bool
    - description: List describing each revoked privilege
      key: revoked_privileges_details
      type: List[str]
    - description: Indicates if the physician has any suspended privileges
      key: has_suspended_privileges
      type: bool
    - description: List describing each suspended privilege
      key: suspended_privileges_details
      type: List[str]
    - description: Indicates if the physician has any limited privileges
      key: has_limited_privileges
      type: bool
    - description: List describing each limited privilege
      key: limited_privileges_details
      type: List[str]
    - description: Concise summary notes on the hospital privileges history
      key: summary_notes
      type: str
    prompt: Summarize the physician's past hospital privileges, indicating any revoked,
      suspended, or limited privileges, in JSON format.
  verify_malpractice_insurance:
    agent: false
    description: Ensure the physician carries adequate malpractice coverage with no
      lapses by verifying provider details and coverage status.
    name: verify_malpractice_insurance
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the insurance carrier
      key: carrier_name
      type: str
    prompt: 'Contact the malpractice insurance provider listed and return JSON: carrier_name,
      policy_number, coverage_limit, effective_date, expiration_date, any_gaps.'
  verify_medical_license:
    agent: false
    description: Confirm the physician's medical license status and validity.
    name: verify_medical_license
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The physician's medical license number.
      key: license_number
      type: str
    - description: Current status of the license (e.g., Active, Expired, Suspended).
      key: license_status
      type: str
    - description: Type of medical license (e.g., MD, DO, NP).
      key: license_type
      type: str
    - description: State issuing the license.
      key: license_state
      type: str
    - description: Expiration date of the license in YYYY-MM-DD format.
      key: expiration_date
      type: str
    - description: Whether the license is currently valid.
      key: license_valid
      type: bool
    prompt: Verify medical license using license number from basic information.
