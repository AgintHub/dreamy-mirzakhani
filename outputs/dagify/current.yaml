dag_type: typed
description: Generated workflow from UI.
name: physician_credentialing_onboarding
nodes:
  assign_clinical_privileges:
    agent: false
    description: Assign specific clinical privileges to the physician in the EMR based
      on committee recommendation.
    name: assign_clinical_privileges
    nodes_depended_on:
    - schedule_privileging_committee_review
    nodes_dependent_on: []
    output_structure:
    - description: List of clinical privileges granted to the physician (e.g., inpatient
        admission, surgery, outpatient care).
      key: privileges_assigned
      type: List[str]
    prompt: List the approved clinical privileges (e.g., inpatient admission, surgery)
      and update the EMR profile. Return JSON with privileges_assigned array.
  check_pecos:
    agent: false
    description: Checks the physician's PECOS enrollment status, enrollment date,
      and Medicare eligibility.
    name: check_pecos
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the physician is enrolled in PECOS.
      key: pecos_enrolled
      type: bool
    - description: Date of PECOS enrollment in YYYY-MM-DD format.
      key: enrollment_date
      type: str
    - description: Indicates whether the physician is eligible for Medicare participation.
      key: medicare_eligible
      type: bool
    - description: Overall PECOS enrollment status (e.g., Active, Pending, Denied).
      key: pecos_status
      type: str
    prompt: Verify the physician's enrollment in the Provider Enrollment, Chain, and
      Ownership System (PECOS) for Medicare participation.
  collect_physician_basic_info:
    agent: false
    description: Gather all required personal and professional information from the
      physician (name, contact, NPI, license number, DEA number, education, work history).
    name: collect_physician_basic_info
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Full legal name of the physician
      key: name
      type: str
    - description: Primary email address
      key: email
      type: str
    - description: Primary contact phone number
      key: phone
      type: str
    - description: National Provider Identifier
      key: NPI
      type: str
    - description: State medical license number
      key: medical_license_number
      type: str
    - description: DEA registration number
      key: DEA_number
      type: str
    - description: List of education entries in the format "Institution, Degree, Graduation
        Year"
      key: education_history
      type: List[str]
    - description: List of employment entries in the format "Hospital/Clinic, Role,
        Start Date, End Date"
      key: employment_history
      type: List[str]
    - description: Name of the malpractice insurance provider
      key: malpractice_insurance_provider
      type: str
    prompt: 'Create a checklist of required basic information for a new physician
      and format the collected data as a JSON object with keys: name, email, phone,
      NPI, medical_license_number, DEA_number, education_history, employment_history,
      malpractice_insurance_provider.'
  compile_credentialing_report:
    agent: false
    description: Aggregate all verification results into a single credentialing report.
    name: compile_credentialing_report
    nodes_depended_on:
    - verify_medical_license
    - verify_board_certification
    - verify_dea_registration
    - verify_malpractice_insurance
    - verify_education_and_training
    - obtain_professional_references
    - conduct_background_check
    - verify_hospital_privileges_history
    - check_pecos
    nodes_dependent_on: []
    output_structure:
    - description: Whether the physician's medical license is valid
      key: medical_license_status
      type: bool
    - description: List of board certification status for each specialty
      key: board_certification_status
      type: List[bool]
    - description: Whether the physician's DEA registration is active
      key: dea_registration_status
      type: bool
    - description: Whether the physician has adequate malpractice insurance
      key: malpractice_insurance_status
      type: bool
    - description: List of verification status for each education entry
      key: education_and_training_status
      type: List[bool]
    - description: List of professional references
      key: professional_references
      type: List[str]
    - description: Whether the background check was successful
      key: background_check_status
      type: bool
    - description: List of hospital privileges history
      key: hospital_privileges_history
      type: List[str]
    - description: Whether the physician is enrolled in PECOS
      key: pecos_enrollment_status
      type: bool
    - description: Overall recommendation (approve/hold)
      key: overall_recommendation
      type: str
    prompt: Combine the JSON outputs from all verification steps into one comprehensive
      credentialing report. Include a pass/fail flag for each category and an overall
      recommendation (approve/hold).
  complete_compliance_training:
    agent: false
    description: Enables the physician to complete required compliance and safety
      training modules and records completion status for each module.
    name: complete_compliance_training
    nodes_depended_on:
    - schedule_orientation
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers of the compliance training modules the physician has
        been enrolled in.
      key: training_module_ids
      type: List[str]
    - description: Corresponding boolean values indicating whether each training module
        has been completed.
      key: completion_status
      type: List[bool]
    prompt: Enroll the physician in the online compliance training modules, track
      completion, and return JSON with training_module_ids and completion_status.
  conduct_background_check:
    agent: false
    description: Run a national criminal background and sanctions check on the physician.
    name: conduct_background_check
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: True if any criminal records exist, otherwise false
      key: criminal_records
      type: bool
    - description: True if any sanctions exist, otherwise false
      key: sanctions
      type: bool
    - description: Additional details or notes about the background check findings
      key: details_if_any
      type: str
    prompt: 'Perform a simulated background check using the physician''s full name
      and DOB, and return JSON: criminal_records (yes/no), sanctions (yes/no), details_if_any.'
  create_provider_profile_in_emr:
    agent: false
    description: Enter the physician's credentials into the electronic medical record
      system and create a provider profile.
    name: create_provider_profile_in_emr
    nodes_depended_on:
    - compile_credentialing_report
    - obtain_signed_employment_contract
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier assigned to the provider profile in the EMR system.
      key: provider_id
      type: str
    - description: Creation status of the provider profile (e.g., 'success', 'failed').
      key: status
      type: str
    prompt: Using the credentialing report and contract, populate the EMR provider
      fields (name, NPI, specialties, license, DEA, privileges). Return JSON with
      provider_id and status.
  finalize_credentialing:
    agent: false
    description: Mark the physician as fully credentialed and ready for clinical duties.
    name: finalize_credentialing
    nodes_depended_on:
    - schedule_privileging_committee_review
    - assign_clinical_privileges
    - grant_system_access
    - verify_hippa_acknowledgment
    nodes_dependent_on: []
    output_structure:
    - description: Status of the credentialing process, e.g., 'Active'
      key: final_status
      type: str
    - description: Date when the physician was activated, formatted as YYYY-MM-DD
      key: activation_date
      type: str
    prompt: Update the credentialing database status to 'Active', log the date of
      activation, and output JSON with final_status and activation_date.
  grant_system_access:
    agent: false
    description: Provision user accounts for EHR, order entry, and other clinical
      systems.
    name: grant_system_access
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: Names of the clinical systems for which access is granted.
      key: system_name
      type: List[str]
    - description: Generated usernames for the physician in each system.
      key: username
      type: List[str]
    - description: Temporary passwords assigned to each system account.
      key: temporary_password
      type: List[str]
    prompt: Create login credentials for the physician in each required system, set
      appropriate role-based permissions, and output JSON with system_name, username,
      temporary_password.
  notify_hr_payroll:
    agent: false
    description: Sends a notification to the HR and payroll departments indicating
      that the physician has been activated and is eligible for compensation.
    name: notify_hr_payroll
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: The activation status of the physician, e.g., 'Active'
      key: final_status
      type: str
    - description: The date the physician was activated, formatted as YYYY-MM-DD
      key: activation_date
      type: str
    - description: Indicates whether the notification to HR and payroll was successfully
        sent
      key: notification_sent
      type: bool
    prompt: Inform HR and payroll that the physician is active and eligible for compensation.
  obtain_professional_references:
    agent: false
    description: Collect and record at least three professional references from the
      physician's recent supervisors. The node should output a summary of each reference
      including the reference's name, relationship to the physician, a rating on a
      scale of 1 to 5, and any comments.
    name: obtain_professional_references
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the professional reference
      key: reference_name
      type: str
    - description: Relationship of the reference to the physician
      key: relationship
      type: str
    - description: Rating given by the reference on a scale of 1 to 5
      key: rating
      type: int
    - description: Any additional comments provided by the reference
      key: comments
      type: str
    prompt: 'Generate a template email to request reference letters, then summarize
      the received responses as JSON: reference_name, relationship, rating (1‑5),
      comments.'
  obtain_signed_employment_contract:
    agent: false
    description: Send the employment contract to the physician and capture the signed
      copy.
    name: obtain_signed_employment_contract
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the employment contract.
      key: contract_id
      type: str
    - description: Date when the contract was signed, formatted as YYYY-MM-DD.
      key: signed_date
      type: str
    prompt: Generate an email with a PDF employment contract attached, request electronic
      signature, and return a JSON receipt with contract_id and signed_date once completed.
  schedule_orientation:
    agent: false
    description: Book the physician for the mandatory orientation session, scheduling
      a suitable time slot and providing the location details.
    name: schedule_orientation
    nodes_depended_on:
    - create_provider_profile_in_emr
    nodes_dependent_on: []
    output_structure:
    - description: The date and time of the scheduled orientation session (ISO 8601
        format).
      key: orientation_date
      type: str
    - description: The physical or virtual location where the orientation will take
        place.
      key: location
      type: str
    prompt: Select an available orientation slot, send calendar invitation to the
      physician, and return JSON with orientation_date and location.
  schedule_privileging_committee_review:
    agent: false
    description: Schedule the physician for the next privileging committee meeting
      and record the meeting details.
    name: schedule_privileging_committee_review
    nodes_depended_on:
    - compile_credentialing_report
    nodes_dependent_on: []
    output_structure:
    - description: The calendar date of the meeting in YYYY-MM-DD format
      key: meeting_date
      type: str
    - description: The start time of the meeting in HH:MM (24-hour) format
      key: meeting_time
      type: str
    - description: Full name of the physician scheduled for the meeting
      key: physician_name
      type: str
    - description: Identifier for the attached credentialing report document
      key: credentialing_report_id
      type: str
    - description: Unique identifier for the created calendar event
      key: calendar_event_id
      type: str
    prompt: Create a calendar entry for the privileging committee with date, time,
      physician name, and attach the credentialing report.
  update_credentialing_database:
    agent: false
    description: Record all verification results and final status in the central credentialing
      repository, returning a confirmation of the database entry.
    name: update_credentialing_database
    nodes_depended_on:
    - finalize_credentialing
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the new database record
      key: record_id
      type: int
    - description: ISO 8601 formatted date and time of the database insertion
      key: timestamp
      type: str
    prompt: Insert the compiled credentialing report and final status into the credentialing
      database. Return JSON confirming record_id and timestamp.
  verify_board_certification:
    agent: false
    description: Validate the physician's board certification(s) and current status
      by querying the certifying board database.
    name: verify_board_certification
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the certifying board (e.g., American Board of Internal
        Medicine).
      key: certification_body
      type: str
    - description: Medical specialty for which the certification was obtained.
      key: specialty
      type: str
    - description: Current status of the certification (e.g., active, inactive, revoked).
      key: certification_status
      type: str
    - description: Date when the certification expires or last renewed, in ISO 8601
        format.
      key: expiration_date
      type: str
    prompt: Check the physician's board certification(s) against the certifying board
      database and output JSON with certification_body, specialty, certification_status,
      and expiration_date.
  verify_dea_registration:
    agent: false
    description: Confirm the DEA registration is active and matches the physician's
      name.
    name: verify_dea_registration
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Current status of the DEA registration (e.g., 'Active', 'Expired',
        'Suspended').
      key: dea_status
      type: str
    - description: Expiration date of the DEA registration in YYYY-MM-DD format.
      key: expiration_date
      type: str
    - description: Indicates whether the name on the DEA registration matches the
        physician's name (true if matches, false otherwise).
      key: name_match
      type: bool
    prompt: 'Validate the DEA_number provided, returning JSON: dea_status, expiration_date,
      name_match (true/false).'
  verify_education_and_training:
    agent: false
    description: Authenticate the physician's medical school, residency, and fellowship
      credentials by verifying each education entry against the relevant accrediting
      body.
    name: verify_education_and_training
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Total number of education entries verified
      key: education_count
      type: int
    - description: Names of the educational institutions
      key: school_names
      type: List[str]
    - description: Degree titles earned at each institution
      key: degree_titles
      type: List[str]
    - description: Year each education program started
      key: start_years
      type: List[int]
    - description: Year each education program ended
      key: end_years
      type: List[int]
    - description: Accrediting bodies that validate each education entry
      key: accrediting_bodies
      type: List[str]
    - description: Verification status for each entry (e.g., 'verified', 'pending',
        'failed')
      key: status
      type: List[str]
    prompt: Cross-reference each entry in education_history with the appropriate accrediting
      body and output JSON for each entry.
  verify_hippa_acknowledgment:
    agent: false
    description: Record the physician's acknowledgment of HIPAA policies, including
      the date of acknowledgment and the name of the person who signed.
    name: verify_hippa_acknowledgment
    nodes_depended_on:
    - complete_compliance_training
    nodes_dependent_on: []
    output_structure:
    - description: Date when the HIPAA acknowledgment was signed (format YYYY-MM-DD).
      key: acknowledgment_date
      type: str
    - description: Name of the individual who signed the HIPAA acknowledgment.
      key: signed_by
      type: str
    prompt: Capture the electronic signature on the HIPAA acknowledgment form and
      return JSON with acknowledgment_date and signed_by.
  verify_hospital_privileges_history:
    agent: false
    description: Review the physician's prior hospital privileging history for any
      revocations, suspensions, or limitations and produce a concise summary.
    name: verify_hospital_privileges_history
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The name of the hospital or program where the privilege was granted.
      key: privilege_name
      type: str
    - description: 'Current status of the privilege: ''active'', ''revoked'', ''suspended'',
        or ''limited''.'
      key: status
      type: str
    - description: Brief explanation of why the privilege is revoked, suspended, or
        limited, if applicable.
      key: reason
      type: str
    - description: Date when the status change occurred, formatted as YYYY-MM-DD.
      key: date_of_change
      type: str
    - description: Any additional notes regarding the privilege history.
      key: comments
      type: str
    prompt: Summarize the physician's past hospital privileges, indicating any revoked,
      suspended, or limited privileges, in JSON format.
  verify_malpractice_insurance:
    agent: false
    description: Ensure the physician carries adequate malpractice coverage with no
      lapses.
    name: verify_malpractice_insurance
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: Name of the malpractice insurance carrier
      key: carrier_name
      type: str
    - description: Policy number of the malpractice insurance
      key: policy_number
      type: str
    - description: Coverage limit amount in dollars
      key: coverage_limit
      type: float
    - description: Effective date of the insurance policy
      key: effective_date
      type: str
    - description: Expiration date of the insurance policy
      key: expiration_date
      type: str
    - description: True if there are any coverage gaps, otherwise False
      key: any_gaps
      type: bool
    prompt: 'Contact the malpractice insurance provider listed and return JSON: carrier_name,
      policy_number, coverage_limit, effective_date, expiration_date, any_gaps.'
  verify_medical_license:
    agent: false
    description: Confirm the physician's medical license status and validity.
    name: verify_medical_license
    nodes_depended_on:
    - collect_physician_basic_info
    nodes_dependent_on: []
    output_structure:
    - description: The physician's medical license number.
      key: medical_license_number
      type: str
    - description: Current status of the license (e.g., Active, Suspended, Expired).
      key: license_status
      type: str
    - description: Expiration date of the medical license in YYYY-MM-DD format.
      key: expiration_date
      type: str
    - description: State or jurisdiction where the license is issued.
      key: license_state
      type: str
    - description: Full name of the physician as listed on the license.
      key: provider_name
      type: str
    - description: True if the license is currently active, otherwise False.
      key: is_active
      type: bool
    prompt: Verify medical license using license number from basic information.
