dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: A list of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: A list of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: A list of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: A list of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks.
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies.
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions.
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value.
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered.
      key: regression_summary
      type: str
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Aggregate testing anomalies.
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Aggregates and categorizes testing anomalies to facilitate
        further analysis and decision-making.
      docstring:
        examples:
        - lines:
          - unit_test_results = run_unit_tests(design_unit_test_cases())['test_execution_status'];
            result = analyze_unit_test_results(unit_test_results); print(result)
          output: '{''test_type'': ''unit'', ''component_info'': ''test_component'',
            ''description'': ''test_description'', ''severity'': ''high'', ''reproduction_steps'':
            ''test_reproduction_steps''}'
        - lines:
          - unit_test_results = run_unit_tests(design_unit_test_cases())['test_execution_status'];
            result = analyze_unit_test_results(unit_test_results); print(result)
          output: '{''test_type'': ''unit'', ''component_info'': ''test_component'',
            ''description'': ''test_description'', ''severity'': ''low'', ''reproduction_steps'':
            ''test_reproduction_steps''}'
        parameters:
        - description: Resulting structure from the execution of unit tests (test_execution_status,
            actual_output_vs_expected_output, test_case_timestamps)
          name: unit_test_results
          type: struct
        raises: []
        returns:
          description: A structured dictionary representing the aggregated testing
            anomalies (test_type, component_info, description, severity, reproduction_steps)
          type: struct
        summary: Aggregate testing anomalies by analyzing unit test results.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: This node creates test cases for component interactions based
        on test objectives and coverage requirements defined in the test scope.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Test user authentication', 'Test user authorization']
          - core_functionality_requirements = ['User registration', 'User login']
          - edge_case_requirements = ['Invalid username', 'Invalid password']
          - performance_requirements = ['Response time < 1 sec', 'Throughput > 100
            req/s']
          - design_integration_test_cases(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements)
          output: '{component_pairs: [''User Auth'', ''User Auth Service''], data_flow_paths:
            [''User registration -> User login -> User authorization''], dependency_validations:
            [''User registration requires valid username'', ''User login requires
            valid password''], integration_test_scenarios: [''Test user registration'',
            ''Test user login'', ''Test user authorization'']}'
        - lines:
          - test_objectives = ['Test system performance', 'Test system scalability']
          - core_functionality_requirements = ['System response time < 1 sec', 'System
            throughput > 100 req/s']
          - edge_case_requirements = ['Invalid request', 'System crash']
          - performance_requirements = ['Response time < 1 sec', 'Throughput > 100
            req/s']
          - design_integration_test_cases(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements)
          output: '{component_pairs: [''System Performance'', ''System Scalability''],
            data_flow_paths: [''System request -> System response''], dependency_validations:
            [''System performance requires valid request'', ''System scalability requires
            valid parameters''], integration_test_scenarios: [''Test system performance'',
            ''Test system scalability'']}'
        parameters:
        - description: List of high-level test objectives
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements
          name: performance_requirements
          type: List[str]
        raises:
        - description: If the test objectives or requirements are not properly defined.
          type: ValueError
        returns:
          description: (component_pairs, data_flow_paths, dependency_validations,
            integration_test_scenarios)
          type: tuple
        summary: Generate integration test scenarios based on component pairs, data
          flow paths, and dependency validations.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: This node generates test cases for unchanged features validation
        using high-risk features identified by the plan_test_scope node.
      docstring:
        examples:
        - lines:
          - 'def design_regression_test_cases(plan_test_scope):'
          - '    high_risk_features = plan_test_scope[''test_objectives''][:3]'
          - '    precondition_setup = [''Setup precondition 1'', ''Setup precondition
            2'', ''Setup precondition 3'']'
          - '    expected_state_preservation = [''Expected state 1'', ''Expected state
            2'', ''Expected state 3'']'
          - '    return {''high_risk_features'': high_risk_features, ''precondition_setup'':
            precondition_setup, ''expected_state_preservation'': expected_state_preservation}'
          output: '{''high_risk_features'': [''Test objective 1'', ''Test objective
            2'', ''Test objective 3''], ''precondition_setup'': [''Setup precondition
            1'', ''Setup precondition 2'', ''Setup precondition 3''], ''expected_state_preservation'':
            [''Expected state 1'', ''Expected state 2'', ''Expected state 3'']}'
        parameters:
        - description: Dictionary containing high-level test objectives, core functionality,
            edge cases, and performance requirements.
          name: plan_test_scope
          type: Dictionary
        raises:
        - description: If the input plan_test_scope is not a dictionary.
          type: TypeError
        returns:
          description: Returns a dictionary containing high-risk features targeted,
            precondition setup and expected state preservation for each regression
            test scenario.
          type: Dictionary
        summary: Generate test cases for unchanged features validation using high-risk
          features identified by the plan_test_scope node.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for each test case
      key: test_id
      type: List[str]
    - description: List of input parameters required for each test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for each test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: This node generates unit test case templates based on the plan
        test scope.
      docstring:
        examples:
        - lines:
          - test_cases = design_unit_test_cases(plan_test_scope)
          output: "{\n  'test_id': ['test1', 'test2'],\n  'input_parameters': ['param1',\
            \ 'param2'],\n  'expected_output': ['output1', 'output2']\n}"
        - lines:
          - test_cases = design_unit_test_cases(plan_test_scope)
          - print(test_cases['test_id'])
          output: '[''test1'', ''test2'']'
        parameters: []
        raises: []
        returns:
          description: A dictionary containing the test cases, including test IDs,
            input parameters, and expected output.
          type: dict
        summary: Generate unit test case templates.
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prd:
      conceptual_info: This node generates a test summary report based on test execution
        results.
      docstring:
        examples:
        - lines:
          - 'test_results = {''total_tests_executed'': 100, ''pass_count'': 90, ''defect_density'':
            0.1, ''risk_assessment_rating'': 5}'
          - generate_test_report(test_results)
          output: '{''total_tests_executed'': 100, ''pass_count'': 90, ''defect_density'':
            0.1, ''risk_assessment_rating'': 5}'
        - lines:
          - 'test_results = {''total_tests_executed'': 200, ''pass_count'': 180, ''defect_density'':
            0.05, ''risk_assessment_rating'': 8}'
          - generate_test_report(test_results)
          output: '{''total_tests_executed'': 200, ''pass_count'': 180, ''defect_density'':
            0.05, ''risk_assessment_rating'': 8}'
        parameters: []
        raises: []
        returns:
          description: Test summary report with total tests executed, pass/fail counts,
            defect density, and risk assessment rating.
          type: dict
        summary: Compile test results summary
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: Defines high-level test objectives and coverage requirements
        for the software under test.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Test objective 1', 'Test objective 2']
          - core_functionality_requirements = ['Core functionality requirement 1',
            'Core functionality requirement 2']
          - edge_case_requirements = ['Edge case requirement 1', 'Edge case requirement
            2']
          - performance_requirements = ['Performance requirement 1', 'Performance
            requirement 2']
          - return (test_objectives, core_functionality_requirements, edge_case_requirements,
            performance_requirements)
          output: '[(''Test objective 1'', ''Test objective 2''), (''Core functionality
            requirement 1'', ''Core functionality requirement 2''), (''Edge case requirement
            1'', ''Edge case requirement 2''), (''Performance requirement 1'', ''Performance
            requirement 2'')]'
        parameters:
        - description: List of high-level test objectives for the software under test
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements for the software under
            test
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements for the software under test
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements for the software under test
          name: performance_requirements
          type: List[str]
        raises:
        - description: Raised if the prompt execution fails
          type: Exception
        returns:
          description: Returns a tuple containing the test objectives, core functionality
            requirements, edge case requirements, and performance requirements
          type: Tuple[List[str], List[str], List[str], List[str]]
        summary: Executes the prompt to define test objectives and coverage requirements.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: This node aggregates testing anomalies from different types
        of tests and reports them in a summarized table.
      docstring:
        examples:
        - lines:
          - 'unit_test_anomaly = {''test_type'': ''unit'', ''component_info'': ''comp1'',
            ''description'': ''desc1'', ''severity'': ''high'', ''reproduction_steps'':
            ''steps1''}'
          - 'integration_test_anomaly = {''test_type'': ''integration'', ''component_info'':
            ''comp2'', ''description'': ''desc2'', ''severity'': ''medium'', ''reproduction_steps'':
            ''steps2''}'
          - 'regression_test_anomaly = {''test_type'': ''regression'', ''component_info'':
            ''comp3'', ''description'': ''desc3'', ''severity'': ''low'', ''reproduction_steps'':
            ''steps3''}'
          - report_defects(anomaly_data_unit=unit_test_anomaly, anomaly_data_integration=integration_test_anomaly,
            anomaly_data_regression=regression_test_anomaly)
          output: '{''test_type'': ''unit'', ''component_info'': ''comp1'', ''description'':
            ''desc1'', ''severity'': ''high'', ''reproduction_steps'': ''steps1''}'
        - lines:
          - 'report_defects(anomaly_data_unit={''test_type'': ''unit'', ''component_info'':
            ''comp1'', ''description'': ''desc1'', ''severity'': ''high'', ''reproduction_steps'':
            ''steps1''},'
          - '                      anomaly_data_integration={''test_type'': ''integration'',
            ''component_info'': ''comp2'', ''description'': ''desc2'', ''severity'':
            ''medium'', ''reproduction_steps'': ''steps2''})'
          output: '{''test_type'': ''unit'', ''component_info'': ''comp1'', ''description'':
            ''desc1'', ''severity'': ''high'', ''reproduction_steps'': ''steps1''}'
        parameters:
        - description: Dictionary containing unit test anomalies, containing 'test_type',
            'component_info', 'description', 'severity', 'reproduction_steps'
          name: anomaly_data_unit
          type: dict
        - description: Dictionary containing integration test anomalies, containing
            'test_type', 'component_info', 'description', 'severity', 'reproduction_steps'
          name: anomaly_data_integration
          type: dict
        - description: Dictionary containing regression test anomalies, containing
            'test_type', 'component_info', 'description', 'severity', 'reproduction_steps'
          name: anomaly_data_regression
          type: dict
        raises:
        - description: Missing required key-value pair in anomaly_data_unit, anomaly_data_integration
            or anomaly_data_regression
          type: ValueError
        returns:
          description: 'Defect summary table with columns: Test Type | Component |
            Description | Severity | Reproduction Steps.'
          type: dict
        summary: Aggregate testing anomalies and return a defect summary table.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario.
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step.
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario.
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: Execute component interaction tests and document communication
        logs and interface validation outcomes.
      docstring:
        examples:
        - lines:
          - design_integration_test_cases = design_integration_test_cases_fn()
          - setup_test_environment = setup_test_environment_fn()
          - result = run_integration_tests(design_integration_test_cases, setup_test_environment)
          output: '{''communication_logs'': [''log1'', ''log2''], ''interface_validation_results'':
            [''result1'', ''result2''], ''test_scenario_ids'': [''scenario1'', ''scenario2'']}'
        - lines:
          - design_integration_test_cases = design_integration_test_cases_fn()
          - setup_test_environment = setup_test_environment_fn()
          - result = run_integration_tests(design_integration_test_cases, setup_test_environment)
          output: '{''communication_logs'': [''log3'', ''log4''], ''interface_validation_results'':
            [''result3'', ''result4''], ''test_scenario_ids'': [''scenario3'', ''scenario4'']}'
        parameters: []
        raises:
        - description: If the 'design_integration_test_cases' or 'setup_test_environment'
            nodes fail or produce invalid output.
          type: ValueError
        returns:
          description: 'A dictionary with three keys: ''communication_logs'', ''interface_validation_results'',
            and ''test_scenario_ids'', each corresponding to a list of strings.'
          type: Dict[str, List[str]]
        summary: Execute integration test scenarios and document communication logs
          and interface validation outcomes.
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: This node orchestrates the execution of regression test scenarios
      for unchanged features, collecting baseline vs actual results, state drift indicators,
      and performance metrics.
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of results comparing baseline metrics versus current actual
        results for each regression scenario.
      key: baseline_vs_actual_results
      type: List[str]
    - description: Indicators signaling any detected state drift during regression
        tests, such as deviations or anomalies.
      key: state_drift_indicators
      type: List[str]
    - description: Various performance metrics recorded during regression testing,
        such as response times and throughput.
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: Briefly, this node executes regression test scenarios and records
        the results.
      docstring:
        examples:
        - lines:
          - '# Execute regression test scenarios and record results'
          - baseline_vs_actual_results, state_drift_indicators, performance_metrics
            = run_regression_tests(
          - '    baseline_vs_actual_results, state_drift_indicators, performance_metrics='
          output: baseline_vs_actual_results=['regression_test_result_1', 'regression_test_result_2'],
            state_drift_indicators=['state_drift_indicator_1', 'state_drift_indicator_2'],
            performance_metrics=['response_time_1', 'response_time_2']
        parameters: []
        raises:
        - description: If design_regression_test_cases or setup_test_environment failed.
          type: ValueError
        returns:
          description: Output fields with their types and descriptions.
          type: dict[str, PrimitiveType]
        summary: Execute regression test scenarios and record results.
    prompt: Execute regression scenarios and record results
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: List[bool]
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: List[str]
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: List[str]
    prd:
      conceptual_info: Execute unit test cases and record their pass/fail status,
        actual output vs expected output, and timestamps.
      docstring:
        examples:
        - lines:
          - test_cases = design_unit_test_cases()
          - environment = setup_test_environment()
          - results = run_unit_tests(test_cases, environment)
          output: results = ([True, False], ['actual vs expected output'], ['timestamp1',
            'timestamp2'])
        parameters:
        - description: Output of design_unit_test_cases node.
          name: design_unit_test_cases
          type: design_unit_test_cases
        - description: Output of setup_test_environment node.
          name: setup_test_environment
          type: setup_test_environment
        raises:
        - description: If test execution fails.
          type: Exception
        returns:
          description: Test execution status, actual output vs expected output, and
            test case timestamps.
          type: Tuple[List[bool], List[str], List[str]]
        summary: Execute unit test cases and record their pass/fail status, actual
          output vs expected output, and timestamps.
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing.
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing.
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing.
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing.
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up.
      key: environment_status
      type: bool
    prd:
      conceptual_info: This node prepares the testing environment by listing the required
        hardware specifications, software specifications, test data sets, mock services,
        and setting up the environment status.
      docstring:
        examples:
        - lines:
          - hardware_specs = ['Intel i5 processor', '8GB RAM']
          - software_specs = ['Python 3.9', 'pip 21.2.4']
          - test_data_sets = ['Test data set 1', 'Test data set 2']
          - mock_services = ['Mock service 1', 'Mock service 2']
          - environment_status = True
          output: Environment setup successful.
        - lines:
          - hardware_specs = ['Invalid hardware']
          - software_specs = ['Invalid software']
          - test_data_sets = ['Test data set 1', 'Test data set 2']
          - mock_services = ['Mock service 1', 'Mock service 2']
          - environment_status = False
          output: Environment setup failed due to invalid hardware or software specifications.
        parameters:
        - description: High-level test objectives and coverage requirements from the
            plan_test_scope node.
          name: plan_test_scope
          type: dict
        raises:
        - description: If the hardware or software specifications are invalid.
          type: ValueError
        returns:
          description: '{hardware_specs: List of hardware specifications required
