dag_type: spec
description: Generated workflow from UI.
name: enhanced_audio_snippet_analysis_concurrent
nodes:
  extract_spectral_features:
    agent: false
    description: Calculate spectral domain features
    name: extract_spectral_features
    nodes_depended_on:
    - load_audio_snippet
    nodes_dependent_on: []
    output_structure:
    - description: Frequency band center of gravity
      key: spectral_centroid
      type: float
    - description: Spread of frequency energy
      key: spectral_bandwidth
      type: float
    - description: Frequency cutoff point
      key: rolloff_frequency
      type: float
    prd:
      conceptual_info: Extracts key spectral attributes from raw audio, such as centroid,
        bandwidth, and rolloff frequency, which are critical for timbral analysis
        and downstream processing.
      docstring:
        examples:
        - lines:
          - audio_data = 'raw_bytes_placeholder'
          - sampling_rate = 44100
          - features = extract_spectral_features(audio_data, sampling_rate, 'wav',
            ['sample'])
          output: '{''spectral_centroid'': 2500.0, ''spectral_bandwidth'': 4000.0,
            ''rolloff_frequency'': 7500.0}'
        - lines:
          - audio_data = 'empty'
          - sampling_rate = 8000
          - 'try:'
          - '    extract_spectral_features(audio_data, sampling_rate, ''wav'', [])'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '''audio_data must not be empty or invalid'''
        parameters:
        - description: Raw audio samples encoded as a byte string or base64 string.
          name: audio_data
          type: str
        - description: Sampling rate in Hz of the audio data.
          name: sampling_rate
          type: int
        - description: Encoding format of the audio file (e.g., 'wav', 'mp3').
          name: file_format
          type: str
        - description: Additional signal characteristics extracted during audio loading.
          name: metadata
          type: List[str]
        raises:
        - description: If audio_data is empty or sampling_rate <= 0.
          type: ValueError
        - description: If the FFT computation fails or the audio data cannot be parsed.
          type: RuntimeError
        returns:
          description: Dictionary with keys 'spectral_centroid', 'spectral_bandwidth',
            and 'rolloff_frequency'.
          type: Dict[str, float]
        summary: Computes spectral domain features from raw audio samples using FFT.
    prompt: Compute frequency domain characteristics using FFT and spectral analysis
      techniques
  extract_temporal_features:
    agent: false
    description: Calculate temporal domain features from raw audio data, returning
      the zero‑crossing rate, signal energy, entropy, and a list of raw temporal metrics.
    name: extract_temporal_features
    nodes_depended_on:
    - load_audio_snippet
    nodes_dependent_on: []
    output_structure:
    - description: Rate of sign changes in the audio waveform per second.
      key: zero_crossing_rate
      type: float
    - description: Sum of squared sample amplitudes, representing signal power.
      key: energy
      type: float
    - description: Shannon entropy of the amplitude histogram, indicating waveform
        disorder.
      key: entropy
      type: float
    - description: 'Raw temporal metrics: [zero_crossing_rate, energy, entropy].'
      key: temporal_features
      type: List[float]
    prd:
      conceptual_info: Computes time‑domain descriptors from raw audio samples, providing
        insight into waveform complexity and power.
      docstring:
        examples:
        - lines:
          - '# Example 1: Simple 5‑sample signal'
          - 'audio_data = "\x00\x01\x00\xff\x00"  # 0, 1, 0, -1, 0 (little‑endian
            bytes)'
          - sampling_rate = 1
          - features = extract_temporal_features(audio_data, sampling_rate)
          - print(features)
          output: '{''zero_crossing_rate'': 2.0, ''energy'': 2.0, ''entropy'': 1.0,
            ''temporal_features'': [2.0, 2.0, 1.0]}'
        - lines:
          - '# Example 2: Silence – zero energy and entropy'
          - 'audio_data = "\x00\x00\x00\x00"  # four zero samples'
          - sampling_rate = 4
          - features = extract_temporal_features(audio_data, sampling_rate)
          - print(features)
          output: '{''zero_crossing_rate'': 0.0, ''energy'': 0.0, ''entropy'': 0.0,
            ''temporal_features'': [0.0, 0.0, 0.0]}'
        parameters:
        - description: Raw audio samples typically returned by `load_audio_snippet`.
            The function expects a contiguous sequence of PCM sample values encoded
            as a string or byte array.
          name: audio_data
          type: str
        - description: Sampling rate (samples per second) of the audio data, used
            to convert raw counts into time‑based rates.
          name: sampling_rate
          type: int
        - description: Optional list of metadata strings from `load_audio_snippet`.
            Ignored by the function but accepted for API consistency.
          name: metadata
          type: list[str] | None
        raises:
        - description: If `audio_data` is empty or contains no valid samples.
          type: ValueError
        - description: If inputs are of incompatible types (e.g., non‑numeric samples).
          type: TypeError
        returns:
          description: "Dictionary containing the computed temporal features:\n\n\
            ```python\n{\n    \"zero_crossing_rate\": float,\n    \"energy\": float,\n\
            \    \"entropy\": float,\n    \"temporal_features\": List[float],\n}\n\
            ```"
          type: dict
        summary: Extract key temporal metrics (zero‑crossing rate, energy, entropy)
          from raw audio samples.
    prompt: Compute time domain characteristics like zero-crossings and signal energy
  finalize_output:
    agent: false
    description: Combine all document components
    name: finalize_output
    nodes_depended_on:
    - inject_style
    - inject_script
    nodes_dependent_on: []
    output_structure:
    - description: Complete HTML document after injecting CSS and JS.
      key: final_html
      type: str
    - description: Flag indicating whether rendering was successful.
      key: render_status
      type: bool
    - description: List of error messages encountered during rendering.
      key: render_errors
      type: List[str]
    prd:
      conceptual_info: Finalize the rendered HTML document by integrating the CSS
        and JavaScript injections into the base HTML skeleton, producing a fully rendered
        page ready for display or further processing.
      docstring:
        examples:
        - lines:
          - 'def finalize_output(html_structure: str, css_injection: str, js_injection:
            str):'
          - '    pass  # implementation omitted'
          - html = "<html><head></head><body><div id='content'>Hello</div></body></html>"
          - css = "<style>body{background:#f0f0f0;}</style>"
          - js = "<script>document.addEventListener('DOMContentLoaded',()=>console.log('loaded'));</script>"
          - final_html, status, errors = finalize_output(html, css, js)
          output: '"<html><head><style>body{background:#f0f0f0;}</style><script>document.addEventListener(''DOMContentLoaded'',()=>console.log(''loaded''));</script></head><body><div
            id=''content''>Hello</div></body></html>", True, []'
        - lines:
          - '# Example of failure when CSS injection is missing'
          - css = ""
          - js = "<script>alert('hi');</script>"
          - final_html, status, errors = finalize_output(html, css, js)
          output: '"<html><head><script>alert(''hi'');</script></head><body><div id=''content''>Hello</div></body></html>",
            False, ["Missing CSS injection"]'
        parameters:
        - description: Base HTML document skeleton generated by `generate_html_content`.
          name: html_structure
          type: str
        - description: CSS style rules generated by `inject_style`.
          name: css_injection
          type: str
        - description: JavaScript interactivity code generated by `inject_script`.
          name: js_injection
          type: str
        raises:
        - description: If any required input is empty or None.
          type: ValueError
        - description: If inputs are not of the expected string type.
          type: TypeError
        - description: If internal rendering fails due to malformed HTML/CSS/JS.
          type: RuntimeError
        returns:
          description: A tuple containing the fully rendered HTML string, a boolean
            flag for success, and a list of any rendering errors.
          type: Tuple[str, bool, List[str]]
        summary: Renders a complete HTML document by injecting CSS and JavaScript
          into the base HTML skeleton and returns rendering status.
    prompt: Render complete HTML document with all enhancements
  generate_html_content:
    agent: false
    description: Create HTML output structure
    name: generate_html_content
    nodes_depended_on:
    - process_song_metadata
    - generate_musician_links
    nodes_dependent_on: []
    output_structure:
    - description: Base HTML document skeleton
      key: html_structure
      type: str
    prd:
      conceptual_info: Builds a minimal but extensible HTML5 document skeleton that
        incorporates song metadata and musician navigation links, ready for subsequent
        CSS/JS injections.
      docstring:
        examples:
        - lines:
          - html = build_html_structure(
          - '    song_titles=[''Imagine''],'
          - '    artist_names=[''John Lennon''],'
          - '    album_names=[''Imagine''],'
          - '    genre_tags=[''Rock''],'
          - '    musician_urls=[''https://en.wikipedia.org/wiki/John_Lennon''],'
          - '    official_websites=[''https://johnlennon.com'']'
          - )
          output: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
            UTF-8\">\n    <title>Imagine - John Lennon</title>\n</head>\n<body>\n\
            \    <h1>Imagine</h1>\n    <p>Artist: John Lennon</p>\n    <p>Album: Imagine</p>\n\
            \    <p>Genre: Rock</p>\n    <nav>\n        <ul>\n            <li><a href=\"\
            https://en.wikipedia.org/wiki/John_Lennon\">John Lennon Profile</a></li>\n\
            \        </ul>\n    </nav>\n    <footer>\n        <p>Official site: <a\
            \ href=\"https://johnlennon.com\">johnlennon.com</a></p>\n    </footer>\n\
            </body>\n</html>"
        - lines:
          - html = build_html_structure(
          - '    song_titles=[''Song A'', ''Song B''],'
          - '    artist_names=[''Artist X'', ''Artist Y''],'
          - '    album_names=[''Album X'', ''Album Y''],'
          - '    genre_tags=[''Pop'', ''Jazz''],'
          - '    musician_urls=[''https://artistx.com'', ''https://artisty.com''],'
          - '    official_websites=[''https://artistx.com'', ''https://artisty.com'']'
          - )
          output: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
            UTF-8\">\n    <title>Song A – Song B by Artist X – Artist Y</title>\n\
            </head>\n<body>\n    <section>\n        <h1>Song A</h1>\n        <p>Artist:\
            \ Artist X</p>\n        <p>Album: Album X</p>\n        <p>Genre: Pop</p>\n\
            \    </section>\n    <section>\n        <h1>Song B</h1>\n        <p>Artist:\
            \ Artist Y</p>\n        <p>Album: Album Y</p>\n        <p>Genre: Jazz</p>\n\
            \    </section>\n    <nav>\n        <ul>\n            <li><a href=\"https://artistx.com\"\
            >Artist X Profile</a></li>\n            <li><a href=\"https://artisty.com\"\
            >Artist Y Profile</a></li>\n        </ul>\n    </nav>\n    <footer>\n\
            \        <p>Official sites: <a href=\"https://artistx.com\">artistx.com</a>,\
            \ <a href=\"https://artisty.com\">artisty.com</a></p>\n    </footer>\n\
            </body>\n</html>"
        parameters:
        - description: Ordered list of matched song titles.
          name: song_titles
          type: List[str]
        - description: Ordered list of artist names corresponding to the songs.
          name: artist_names
          type: List[str]
        - description: Ordered list of album names where the songs appear.
          name: album_names
          type: List[str]
        - description: List of music genre tags inferred from the data.
          name: genre_tags
          type: List[str]
        - description: Artist profile links constructed from database and web sources.
          name: musician_urls
          type: List[str]
        - description: Official band or artist web presences extracted from the same
            sources.
          name: official_websites
          type: List[str]
        raises:
        - description: Raised when any input list is empty or misaligned (different
            lengths).
          type: ValueError
        returns:
          description: A complete HTML5 document string with placeholders for metadata
            and navigation links.
          type: str
        summary: Construct an HTML5 document skeleton using provided music metadata
          and artist links.
    prompt: Assemble basic HTML5 document structure
  generate_musician_links:
    agent: false
    description: Create artist navigation links by aggregating database search results
      and web‑scraped metadata.
    name: generate_musician_links
    nodes_depended_on:
    - music_database_api
    - web_scraping_results
    nodes_dependent_on: []
    output_structure:
    - description: Artist profile links constructed from database and web sources.
      key: musician_urls
      type: List[str]
    - description: Official band or artist web presences extracted from the same sources.
      key: official_websites
      type: List[str]
    prd:
      conceptual_info: The node synthesises music metadata from two upstream services—an
        external music database and a web‑scraping engine—into user‑friendly hyperlinks.
        The resulting URLs enable seamless navigation from the HTML report to external
        artist pages.
      docstring:
        examples:
        - lines:
          - musician_urls, official_websites = generate_musician_links(
          - '    song_matches=[''Song A'', ''Song B''],'
          - '    relevance_scores=[0.95, 0.88],'
          - '    additional_matches=[''https://artist.com'', ''https://band.org''],'
          - '    web_scores=[0.92, 0.85])'
          - print('musician_urls:', musician_urls)
          - print('official_websites:', official_websites)
          output: 'musician_urls: [''https://musicdb.com/song_a'', ''https://musicdb.com/song_b'']

            official_websites: [''https://artist.com'', ''https://band.org'']'
        - lines:
          - '# Handling inconsistent input lengths'
          - 'try:'
          - '    generate_musician_links(song_matches=[''Song A''],'
          - '                             relevance_scores=[0.95, 0.88],'
          - '                             additional_matches=[''https://artist.com''],'
          - '                             web_scores=[0.92])'
          - 'except ValueError as e:'
          - '    print(''Error:'', e)'
          output: 'Error: Input list lengths do not match.'
        parameters:
        - description: List of song titles returned by the music database API.
          name: song_matches
          type: List[str]
        - description: Relevance scores corresponding to each entry in song_matches.
          name: relevance_scores
          type: List[float]
        - description: List of URLs or titles obtained through web scraping.
          name: additional_matches
          type: List[str]
        - description: Relevance scores for each web‑scraped match.
          name: web_scores
          type: List[float]
        raises:
        - description: Raised when input lists are of mismatched lengths or contain
            None values.
          type: ValueError
        returns:
          description: 'Dictionary containing two lists:

            - musician_urls: List of artist profile links.

            - official_websites: List of official band or artist web presences.'
          type: dict
        summary: Builds artist profile URLs and official website links from database
          matches and web‑scraped data.
    prompt: Generate deep links to musician profiles
  inject_script:
    agent: false
    description: Add JavaScript interactivity
    name: inject_script
    nodes_depended_on:
    - generate_html_content
    nodes_dependent_on: []
    output_structure:
    - description: Interactive JavaScript code
      key: js_injection
      type: str
    prd:
      conceptual_info: Injects a self‑contained JavaScript snippet into the base HTML
        document generated by `generate_html_content`. The injection ensures that
        any dynamic interactivity—such as event listeners, timers, or simple UI updates—is
        appended just before the closing </body> tag.
      docstring:
        examples:
        - lines:
          - 'def inject_script(html_structure: str) -> str:'
          - '    if not isinstance(html_structure, str):'
          - '        raise TypeError("html_structure must be a string")'
          - '    if not html_structure.strip():'
          - '        raise ValueError("html_structure cannot be empty")'
          - '    script = """<script>'
          - '    document.addEventListener(''DOMContentLoaded'', () => {'
          - '        console.log(''Interactive script loaded'');'
          - '    });'
          - </script>"""
          - '    # Insert the script just before </body>'
          - '    insertion_point = html_structure.rfind(''</body>'')'
          - '    if insertion_point == -1:'
          - '        return html_structure + script'
          - '    return html_structure[:insertion_point] + script + html_structure[insertion_point:]'
          output: <html><head></head><body><h1>Hello</h1></body><script>\n    document.addEventListener('DOMContentLoaded',
            () => {\n        console.log('Interactive script loaded');\n    });\n</script></html>
        - lines:
          - '# Minimal example:'
          - html = '<html><body></body></html>'
          - injected = inject_script(html)
          - print(injected)
          output: <html><body></body></html><script>\n    document.addEventListener('DOMContentLoaded',
            () => {\n        console.log('Interactive script loaded');\n    });\n</script>
        parameters:
        - description: Base HTML document skeleton produced by `generate_html_content`.
          name: html_structure
          type: str
        raises:
        - description: If `html_structure` is empty or not a string.
          type: ValueError
        - description: If `html_structure` is not an instance of `str`.
          type: TypeError
        returns:
          description: HTML document string with the JavaScript code injected.
          type: str
        summary: Inject dynamic JavaScript functionality into an HTML document.
    prompt: Inject dynamic JavaScript functionality
  inject_style:
    agent: false
    description: Add CSS styling rules to an existing HTML document skeleton.
    name: inject_style
    nodes_depended_on:
    - generate_html_content
    nodes_dependent_on: []
    output_structure:
    - description: Document style rules
      key: css_injection
      type: str
    prd:
      conceptual_info: The node receives a base HTML skeleton and injects a collection
        of responsive CSS rules that style the page for mobile, tablet, and desktop
        viewports.
      docstring:
        examples:
        - lines:
          - css = inject_style('<html><head></head><body></body></html>')
          output: '"\n/* Basic responsive styles */\nbody { margin: 0; font-family:
            Arial, Helvetica, sans-serif; }\n@media (max-width: 768px) { body { padding:
            10px; } }\n"'
        - lines:
          - css = inject_style('<div class=\"content\"></div>')
          output: '"\n/* Container styles */\n.content { max-width: 1200px; margin:
            0 auto; padding: 20px; }\n@media (max-width: 600px) { .content { padding:
            10px; } }\n"'
        parameters:
        - description: Base HTML document skeleton generated by `generate_html_content`.
          name: html_structure
          type: str
        raises:
        - description: If `html_structure` is empty or contains only whitespace.
          type: ValueError
        - description: If `html_structure` is not a string.
          type: TypeError
        returns:
          description: A string containing the CSS rules to be inserted into the document.
          type: str
        summary: Inject responsive CSS styling rules into an HTML document skeleton.
    prompt: Inject responsive CSS styles into document
  load_audio_snippet:
    agent: false
    description: Load audio file with metadata extraction
    name: load_audio_snippet
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Raw audio samples as a base64-encoded string or hex representation
        depending on implementation
      key: audio_data
      type: str
    - description: Sample rate of the audio in Hz
      key: sampling_rate
      type: int
    - description: Audio encoding format (e.g., WAV, MP3, FLAC)
      key: file_format
      type: str
    - description: Summary of signal characteristics such as duration, bit depth,
        number of channels, and loudness level
      key: metadata
      type: List[str]
    prd:
      conceptual_info: The `load_audio_snippet` node reads an audio file from disk
        (or a remote source), decodes its waveform into raw samples, and extracts
        fundamental metadata—including sampling rate, format, and key signal statistics.
        The data is returned in a lightweight, serializable form for downstream analysis.
      docstring:
        examples:
        - lines:
          - result = load_audio_snippet('samples/beat.wav')
          - 'print(result[''sampling_rate''])  # 44100'
          - 'print(result[''file_format''])    # ''wav'''
          - 'print(len(result[''metadata'']))  # 4'
          output: '44100

            wav

            4'
        - lines:
          - 'try:'
          - '    load_audio_snippet(''missing.mp3'')'
          - 'except FileNotFoundError as e:'
          - '    print(str(e))'
          output: '''File not found: missing.mp3'''
        parameters:
        - description: Filesystem path or URL to the audio file to be loaded.
          name: audio_file_path
          type: str
        raises:
        - description: Raised if the specified file does not exist or cannot be accessed.
          type: FileNotFoundError
        - description: Raised if the file format is unsupported or the file is corrupted.
          type: ValueError
        - description: Raised for low‑level decoding failures (e.g., I/O errors during
            read).
          type: RuntimeError
        returns:
          description: Dictionary containing `audio_data` (raw samples), `sampling_rate`
            (Hz), `file_format` (e.g., 'wav'), and `metadata` (list of descriptive
            strings).
          type: Dict[str, Any]
        summary: Load an audio file and extract basic metadata for further analysis.
    prompt: Load audio file and extract basic metadata about sampling rate, format,
      and signal characteristics
  mfcc_extraction:
    agent: false
    description: Calculate mel-frequency cepstral coefficients
    name: mfcc_extraction
    nodes_depended_on:
    - spectrogram_creation
    nodes_dependent_on: []
    output_structure:
    - description: Temporal MFCC features
      key: mfcc_coefficients
      type: float
    - description: Rate-of-change MFCC features
      key: delta_mfcc
      type: float
    prd:
      conceptual_info: Transforms a frequency‑time representation (spectrogram) into
        mel‑frequency cepstral coefficients (MFCCs) and their first‑derivative (delta)
        features, enabling compact spectral representation for machine‑learning pipelines.
      docstring:
        examples:
        - lines:
          - mfcc_extraction([0.1, 0.2, 0.3, 0.4])
          output: '{''mfcc_coefficients'': 0.25, ''delta_mfcc'': 0.05}'
        - lines:
          - '# A longer spectrogram (flattened) example'
          - 'data = [0.1] * 1024  # 32×32 spectrogram flattened'
          - mfcc_extraction(data)
          output: '{''mfcc_coefficients'': 0.10, ''delta_mfcc'': 0.00}'
        parameters:
        - description: 1‑D list containing the spectrogram matrix flattened in row‑major
            order.
          name: spectrogram_data
          type: List[float]
        raises:
        - description: Raised if `spectrogram_data` is empty or not a list of floats.
          type: ValueError
        returns:
          description: Dictionary with keys 'mfcc_coefficients' and 'delta_mfcc' holding
            the average MFCC value and its first‑difference. The values are floating‑point
            numbers summarising the spectral envelope and its temporal change.
          type: Dict[str, float]
        summary: Compute Mel‑Frequency Cepstral Coefficients and delta features from
          a flattened spectrogram.
    prompt: Transform spectrogram into MFCC representation
  ml_feature_extraction:
    agent: false
    description: Generate deep learning features using CNN and RNN architectures
    name: ml_feature_extraction
    nodes_depended_on:
    - load_audio_snippet
    nodes_dependent_on: []
    output_structure:
    - description: Convolutional network output summarizing learned spectral patterns.
      key: cnn_features
      type: float
    - description: Recurrent network output summarizing learned temporal dynamics.
      key: rnn_features
      type: float
    prd:
      conceptual_info: Extracts high‑level deep‑learning embeddings from raw audio
        by feeding the waveform through a CNN backbone followed by an RNN, producing
        compact scalar summaries of learned spectral and temporal characteristics.
      docstring:
        examples:
        - lines:
          - 'result = ml_feature_extraction(''\x00\x01\x02'', 44100, ''wav'', [''centroid:
            2000'', ''rolloff: 3000''])'
          output: '{''cnn_features'': 0.123, ''rnn_features'': 0.456}'
        - lines:
          - 'try:'
          - '    ml_feature_extraction('''', 44100, ''wav'', [])'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"audio_data must not be empty"'
        parameters:
        - description: Raw audio bytes (e.g., WAV or MP3 payload) obtained from `load_audio_snippet`.
          name: audio_data
          type: str
        - description: Sampling rate of the audio signal in Hz.
          name: sampling_rate
          type: int
        - description: Encoding format of the audio file (e.g., "wav", "mp3").
          name: file_format
          type: str
        - description: Optional list of pre‑computed signal characteristics (e.g.,
            spectral centroid, zero‑crossing rate).
          name: metadata
          type: List[str]
        raises:
        - description: Raised when `audio_data` is empty or None.
          type: ValueError
        - description: Raised if the underlying deep‑learning inference fails (e.g.,
            GPU out‑of‑memory, model file missing).
          type: RuntimeError
        returns:
          description: 'A dictionary containing two scalar features:

            - `cnn_features`: A single float summarizing the convolutional network’s
            output.

            - `rnn_features`: A single float summarizing the recurrent network’s output.'
          type: Dict[str, float]
        summary: Generate deep learning features from raw audio using a convolutional‑plus‑recurrent
          architecture.
    prompt: Generate deep learning features using CNN and RNN architectures
  music_database_api:
    agent: false
    description: Query an external music database to find tracks that match the provided
      tonal and pitch characteristics.
    name: music_database_api
    nodes_depended_on:
    - tonal_analysis
    - pitch_analysis
    nodes_dependent_on: []
    output_structure:
    - description: Database search results – a list of song titles that best match
        the query.
      key: song_matches
      type: str
    - description: Match quality indicators – a list of relevance scores corresponding
        to each entry in song_matches.
      key: relevance_scores
      type: float
    prd:
      conceptual_info: This node performs an external lookup of tracks that best match
        the tonal key and fundamental pitch detected from an audio snippet.  It serves
        as the bridge between low‑level audio analysis and high‑level music metadata
        retrieval, feeding subsequent nodes that assemble artist links and render
        the final HTML.
      docstring:
        examples:
        - lines:
          - matches, scores = music_database_api('C major', 440.0)
          output: (['Song A', 'Song B'], [0.95, 0.88])
        - lines:
          - 'try:'
          - '    music_database_api('''', 440.0)'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"tone is required and cannot be empty."'
        parameters:
        - description: Identified musical key (e.g., 'C major', 'A minor').
          name: tone
          type: str
        - description: Estimated fundamental frequency in hertz.
          name: fundamental_frequency
          type: float
        raises:
        - description: If either `tone` or `fundamental_frequency` is missing or empty.
          type: ValueError
        - description: If the external music database API cannot be reached.
          type: ConnectionError
        returns:
          description: A tuple where the first element is a list of matched song titles
            and the second element is a list of corresponding relevance scores.
          type: Tuple[List[str], List[float]]
        summary: Query an external music database for songs matching a given musical
          key and pitch.
    prompt: Search database for matching songs based on audio attributes
  pitch_analysis:
    agent: false
    description: Detect pitch characteristics
    name: pitch_analysis
    nodes_depended_on:
    - mfcc_extraction
    nodes_dependent_on: []
    output_structure:
    - description: Primary pitch frequency
      key: fundamental_frequency
      type: float
    - description: Pitch detection reliability
      key: pitch_confidence
      type: float
    prd:
      conceptual_info: Detect pitch characteristics
      docstring:
        examples:
        - lines:
          - pitch_analysis(120.0, 0.5)
          output: (120.0, 0.92)
        - lines:
          - 'try:'
          - '    pitch_analysis(-5, 0)'
          - 'except ValueError as e:'
          - '    print(''Error:'', e)'
          output: '"Error: Invalid MFCC input: value must be positive and numeric."'
        parameters:
        - description: Temporal MFCC feature extracted from the audio spectrogram.
          name: mfcc_coefficients
          type: float
        - description: Rate‑of‑change of the MFCC feature, used as an auxiliary cue
            for pitch stability.
          name: delta_mfcc
          type: float
        raises:
        - description: Raised when either input is None, empty, or not a numeric value.
          type: ValueError
        - description: Raised if the internal pitch estimation algorithm fails to
            converge.
          type: RuntimeError
        returns:
          description: A tuple containing the estimated fundamental frequency (in
            Hz) and a confidence score (0.0‑1.0).
          type: Tuple[float, float]
        summary: Estimates the fundamental frequency of an audio frame and returns
          a confidence metric for the detection.
    prompt: Estimate fundamental frequency and harmonic structure
  process_song_metadata:
    agent: false
    description: 'Extract key metadata fields from database and web‑scraped results
      and collate them into four ordered lists: titles, artists, albums, and genre
      tags.'
    name: process_song_metadata
    nodes_depended_on:
    - music_database_api
    - web_scraping_results
    nodes_dependent_on: []
    output_structure:
    - description: Collection of matched song titles.
      key: song_titles
      type: List[str]
    - description: Collection of artist names associated with the matches.
      key: artist_names
      type: List[str]
    - description: Collection of album names where the songs appear.
      key: album_names
      type: List[str]
    - description: List of music genre tags inferred from the data.
      key: genre_tags
      type: List[str]
    prd:
      conceptual_info: The node consolidates metadata from multiple sources, normalises
        it, and outputs four aligned lists that can be rendered into an HTML page
        or used for further analytics.
      docstring:
        examples:
        - lines:
          - "song_titles, artist_names, album_names, genre_tags = process_song_metadata(\n\
            \    ['Song A', 'Song B'],\n    [0.92, 0.85],\n    ['Song A (Live)', 'Song\
            \ B (Remix)'],\n    [0.97, 0.83]\n)"
          - print(song_titles)
          - print(artist_names)
          - print(album_names)
          - print(genre_tags)
          output: '[''Song A'', ''Song B'']

            [''Artist X'', ''Artist Y'']

            [''Album X'', ''Album Y'']

            [''Pop'', ''Rock'']'
        - lines:
          - 'try:'
          - '    process_song_metadata([], [], [], [])'
          - 'except ValueError as e:'
          - '    print(e)'
          output: Input lists cannot be empty.
        parameters:
        - description: Song titles returned by the music_database_api.
          name: song_matches
          type: List[str]
        - description: Relevance scores corresponding to each entry in song_matches.
          name: relevance_scores
          type: List[float]
        - description: Additional song titles scraped from the web.
          name: additional_matches
          type: List[str]
        - description: Web‑source relevance scores corresponding to each entry in
            additional_matches.
          name: web_scores
          type: List[float]
        raises:
        - description: If any input list is empty or the lengths of the paired lists
            do not match.
          type: ValueError
        - description: If metadata extraction from the supplied titles fails (e.g.,
            no match found in either source).
          type: RuntimeError
        returns:
          description: 'A tuple containing four lists: song_titles, artist_names,
            album_names, and genre_tags, all aligned by index.'
          type: Tuple[List[str], List[str], List[str], List[str]]
        summary: Combines song metadata obtained from the music database API and web
          scraping results into four synchronized lists of titles, artists, albums,
          and genre tags.
    prompt: Format song metadata into structured fields
  spectrogram_creation:
    agent: false
    description: Generate spectrogram representation
    name: spectrogram_creation
    nodes_depended_on:
    - validate_audio_features
    nodes_dependent_on: []
    output_structure:
    - description: Time-frequency matrix flattened into a one‑dimensional list.
      key: spectrogram_data
      type: List[float]
    prd:
      conceptual_info: The spectrogram_creation node transforms validated audio features
        into a two‑dimensional frequency‑time representation (spectrogram) and flattens
        it for downstream processing (e.g., MFCC extraction).
      docstring:
        examples:
        - lines:
          - spectrogram = spectrogram_creation([1.0, 2.0], [0.5, 1.5])
          output: '[1.0, 2.0, 0.5, 1.5]'
        - lines:
          - spectrogram = spectrogram_creation([0.1, 0.2, 0.3], [0.01, 0.02, 0.03])
          output: '[0.1, 0.2, 0.3, 0.01, 0.02, 0.03]'
        parameters:
        - description: Validated spectral features (e.g., spectral centroid, bandwidth,
            rolloff). These values are assumed to be normalized and ready for STFT
            computation.
          name: normalized_spectral
          type: List[float]
        - description: Validated temporal features (e.g., zero‑crossing rate, energy,
            entropy). These provide the time‑domain context for the STFT.
          name: normalized_temporal
          type: List[float]
        raises:
        - description: If either input list is empty or contains non‑numeric values.
          type: ValueError
        - description: If the STFT calculation fails (e.g., due to incompatible input
            shapes).
          type: RuntimeError
        returns:
          description: A one‑dimensional list representing the flattened spectrogram
            matrix. Each contiguous block of values corresponds to a frequency bin
            across all time frames.
          type: List[float]
        summary: Create a flattened spectrogram matrix from validated audio features
          using Short‑Time Fourier Transform (STFT).
    prompt: Create frequency-time representations using STFT
  tonal_analysis:
    agent: false
    description: Identify tonal characteristics
    name: tonal_analysis
    nodes_depended_on:
    - mfcc_extraction
    nodes_dependent_on: []
    output_structure:
    - description: Identified musical key
      key: tone
      type: str
    - description: Tonal detection reliability
      key: tone_confidence
      type: float
    prd:
      conceptual_info: The tonal_analysis node uses a deep‑learning model trained
        on MFCC representations to infer the dominant musical key of an audio snippet.
        It outputs the key name and a confidence score reflecting the model’s certainty.
      docstring:
        examples:
        - lines:
          - tone, conf = tonal_analysis(0.58, 0.12)
          - 'print(f"Key: {tone}, Confidence: {conf:.2f}")'
          output: '"Key: C Major, Confidence: 0.93"'
        - lines:
          - tone, conf = tonal_analysis(0.42, -0.03)
          - print(tone, conf)
          output: '"F Minor 0.76"'
        parameters:
        - description: Mel‑frequency cepstral coefficient features extracted from
            the audio snippet.
          name: mfcc_coefficients
          type: float
        - description: First‑order differences of the MFCCs, capturing temporal dynamics.
          name: delta_mfcc
          type: float
        raises:
        - description: If either `mfcc_coefficients` or `delta_mfcc` is None or NaN.
          type: ValueError
        - description: If the deep‑learning inference engine fails or the model file
            is missing.
          type: RuntimeError
        returns:
          description: A tuple containing the detected key (`tone`) and a confidence
            value (`tone_confidence`).
          type: Tuple[str, float]
        summary: Detects the musical key from MFCC inputs using a pretrained deep
          learning model.
    prompt: Analyze signal for tonal patterns using deep learning
  validate_audio_features:
    agent: false
    description: Normalize and validate extracted features
    name: validate_audio_features
    nodes_depended_on:
    - extract_spectral_features
    - extract_temporal_features
    - ml_feature_extraction
    nodes_dependent_on: []
    output_structure:
    - description: Validated spectral features
      key: normalized_spectral
      type: List[float]
    - description: Validated temporal features
      key: normalized_temporal
      type: List[float]
    - description: Processing issues log
      key: validation_errors
      type: List[str]
    prd:
      conceptual_info: Normalizes and validates audio features before downstream processing,
        ensuring consistent scales and logging any discrepancies.
      docstring:
        examples:
        - lines:
          - spectral_centroid = 4000.0
          - spectral_bandwidth = 500.0
          - rolloff_frequency = 2000.0
          - zero_crossing_rate = 30.0
          - energy = 0.02
          - entropy = 1.2
          - 'norm_spectral, norm_temporal, errors = validate_audio_features(

            '
          - '    spectral_centroid,

            '
          - '    spectral_bandwidth,

            '
          - '    rolloff_frequency,

            '
          - '    zero_crossing_rate,

            '
          - '    energy,

            '
          - '    entropy

            '
          - )
          output: '"norm_spectral = [1.0, 0.0, 0.4286],\n" +

            "norm_temporal = [1.0, 0.0, 0.0399],\n" +

            "errors = []"'
        - lines:
          - '# Example that triggers a validation error'
          - 'try:'
          - '    validate_audio_features(None, 500, 2000, 30, 0.02, 1.2)'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"One or more inputs is not a valid float."'
        parameters:
        - description: Spectral centroid value extracted from the audio signal.
          name: spectral_centroid
          type: float
        - description: Spectral bandwidth value extracted from the audio signal.
          name: spectral_bandwidth
          type: float
        - description: Rolloff frequency value extracted from the audio signal.
          name: rolloff_frequency
          type: float
        - description: Zero‑crossing rate of the audio waveform.
          name: zero_crossing_rate
          type: float
        - description: Signal energy computed from squared amplitudes.
          name: energy
          type: float
        - description: Shannon entropy of the amplitude histogram.
          name: entropy
          type: float
        raises:
        - description: If any input is None or not a real number.
          type: ValueError
        returns:
          description: A tuple containing a list of normalized spectral features,
            a list of normalized temporal features, and a list of validation error
            messages.
          type: Tuple[List[float], List[float], List[str]]
        summary: Normalizes spectral and temporal audio features to a common scale,
          verifies consistency, and records validation errors.
    prompt: Check feature consistency and normalize values
  web_scraping_results:
    agent: false
    description: Scrape additional music metadata
    name: web_scraping_results
    nodes_depended_on:
    - tonal_analysis
    - pitch_analysis
    nodes_dependent_on: []
    output_structure:
    - description: Web-sourced matches
      key: additional_matches
      type: str
    - description: Web-source relevance scores
      key: web_scores
      type: float
    prd:
      conceptual_info: Collect and rank music metadata from online sources using pitch
        and tonal cues.
      docstring:
        examples:
        - lines:
          - matches, scores = web_scraping_results('C', 0.96, 440.0, 0.92)
          - print(matches)
          - print(scores)
          output: '"Song1;Song2;Song3"

            0.88'
        - lines:
          - result = web_scraping_results('G#', 0.85, 329.63, 0.80)
          - print(result['additional_matches'])
          - print(result['web_scores'])
          output: '"TrackA;TrackB"

            0.75'
        parameters:
        - description: Musical key identified by the tonal_analysis node.
          name: tone
          type: str
        - description: Confidence level of the tonal detection.
          name: tone_confidence
          type: float
        - description: Primary pitch frequency determined by pitch_analysis.
          name: fundamental_frequency
          type: float
        - description: Confidence level of the pitch detection.
          name: pitch_confidence
          type: float
        raises:
        - description: Raised if any input is None or has an unexpected type.
          type: ValueError
        - description: Raised when network requests to the web sources fail.
          type: ConnectionError
        returns:
          description: "A dictionary with keys:\n  * 'additional_matches' (str): concatenated\
            \ list of web‑sourced song or artist names.\n  * 'web_scores' (float):\
            \ overall relevance score for the web results."
          type: Dict[str, Any]
        summary: Scrape the web for music metadata that matches given tonal and pitch
          characteristics, returning a string of matches and a relevance score.
    prompt: Scrape web sources for relevant music information
