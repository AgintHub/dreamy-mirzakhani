dag_type: plain_text
description: A workflow that creates a quantitative trading strategy by gathering
  data, engineering features, selecting models, backtesting, optimizing, and defining
  execution and risk controls.
name: build_quant_trading_strategy
nodes:
  analyze_backtest_results:
    agent: false
    description: Assess the output of backtesting to evaluate strategy viability and
      identify improvements.
    name: analyze_backtest_results
    nodes_depended_on:
    - run_backtest
    nodes_dependent_on:
    - refine_strategy_or_finalize
    prompt: Analyze the backtest output metrics and visualizations to judge if the
      strategy meets target performance and risk criteria. Identify weaknesses or
      confirm readiness.
  clean_historical_market_data:
    agent: false
    description: Process and clean raw historical market data to handle missing values,
      errors, and standardize formats.
    name: clean_historical_market_data
    nodes_depended_on:
    - gather_historical_market_data
    nodes_dependent_on:
    - engineer_features_from_market_data
    prompt: Clean the collected historical market data by filling or removing missing
      values, correcting erroneous data points, normalizing formats, and ensuring
      consistent timestamps.
  construct_backtesting_environment:
    agent: false
    description: Set up a system to simulate trading the strategy on historical data
      including transaction costs and market impact.
    name: construct_backtesting_environment
    nodes_depended_on:
    - test_final_model
    nodes_dependent_on:
    - run_backtest
    prompt: Develop a backtesting framework that applies the model’s signals to historical
      asset prices, incorporating realistic execution and cost assumptions.
  define_performance_metrics:
    agent: false
    description: Specify the key metrics that will define strategy success and guide
      optimization.
    name: define_performance_metrics
    nodes_depended_on:
    - merge_features
    nodes_dependent_on:
    - split_dataset
    prompt: Identify measurable performance metrics for the trading strategy such
      as annualized return, Sharpe ratio, maximum drawdown, and turnover. Provide
      definitions and target thresholds.
  define_risk_management_rules:
    agent: false
    description: Specify risk controls and monitoring measures to limit losses and
      ensure compliance during live trading.
    name: define_risk_management_rules
    nodes_depended_on:
    - refine_strategy_or_finalize
    nodes_dependent_on: []
    prompt: Establish quantitative risk limits, stop-loss criteria, exposure constraints,
      and procedures for monitoring and responding to risk breaches during live trading.
  define_trading_universe:
    agent: false
    description: Specify the set of assets and markets to consider for the trading
      strategy.
    name: define_trading_universe
    nodes_depended_on: []
    nodes_dependent_on:
    - gather_historical_market_data
    - gather_alternative_data
    prompt: List the asset classes, markets, and instruments you want to include in
      your quantitative trading strategy (e.g., US equities, futures, FX pairs). Specify
      any time frames or exchanges if relevant.
  design_execution_plan:
    agent: false
    description: Define how the trading strategy will be executed in live markets,
      including order types and execution timing.
    name: design_execution_plan
    nodes_depended_on:
    - refine_strategy_or_finalize
    nodes_dependent_on: []
    prompt: Detail the live trading execution methods for the strategy, specifying
      order types (market, limit), execution timing, position sizing rules, and interaction
      with brokers or venues.
  engineer_features_from_alternative_data:
    agent: false
    description: Extract useful features from processed alternative data like sentiment
      scores or economic trend indicators.
    name: engineer_features_from_alternative_data
    nodes_depended_on:
    - process_alternative_data
    nodes_dependent_on:
    - merge_features
    prompt: Derive numerical or categorical features from alternative data such as
      sentiment indexes, event flags, macroeconomic trend values, or other predictive
      indicators aligned by asset and time.
  engineer_features_from_market_data:
    agent: false
    description: Create quantitative features from cleaned historical market data
      such as returns, volatility, and technical indicators.
    name: engineer_features_from_market_data
    nodes_depended_on:
    - clean_historical_market_data
    nodes_dependent_on:
    - merge_features
    prompt: Generate quantitative features from the cleaned market data, including
      price returns over various periods, moving averages, volatility measures, volume
      indicators, and other technical factors relevant to trading signals.
  gather_alternative_data:
    agent: false
    description: Obtain non-traditional data sources relevant to the trading universe,
      such as sentiment, news, or macroeconomic indicators.
    name: gather_alternative_data
    nodes_depended_on:
    - define_trading_universe
    nodes_dependent_on:
    - process_alternative_data
    prompt: Acquire alternative datasets relevant to the defined assets (e.g., news
      sentiment, economic indicators, social media signals) aligned in time and scope
      with the historical market data.
  gather_historical_market_data:
    agent: false
    description: Collect raw historical price and volume data for the defined trading
      universe.
    name: gather_historical_market_data
    nodes_depended_on:
    - define_trading_universe
    nodes_dependent_on:
    - clean_historical_market_data
    prompt: Using the defined trading universe, retrieve historical market data of
      prices, volumes, and relevant fundamental or technical data from reliable sources
      for at least 3 years. Provide data with timestamps and identifiers.
  merge_features:
    agent: false
    description: Combine features derived from market and alternative data into a
      single dataset for model input.
    name: merge_features
    nodes_depended_on:
    - engineer_features_from_market_data
    - engineer_features_from_alternative_data
    nodes_dependent_on:
    - select_model_type
    - define_performance_metrics
    prompt: Integrate all engineered features from market and alternative datasets
      into one consolidated feature matrix indexed by time and asset, ready for model
      training.
  optimize_parameters:
    agent: false
    description: Adjust model hyperparameters to improve performance based on validation
      results.
    name: optimize_parameters
    nodes_depended_on:
    - validate_model
    nodes_dependent_on:
    - test_final_model
    prompt: Use validation feedback to perform hyperparameter optimization of the
      model (e.g., grid search, random search). Document the best configuration found.
  perform_cross_validation:
    agent: false
    description: Perform k-fold or rolling-window cross-validation to assess model
      stability and variance.
    name: perform_cross_validation
    nodes_depended_on:
    - validate_model
    nodes_dependent_on:
    - test_final_model
    prompt: Execute cross-validation procedures on the training and validation datasets
      to estimate model robustness and variability of performance metrics.
  process_alternative_data:
    agent: false
    description: Clean and structure alternative data sources for integration.
    name: process_alternative_data
    nodes_depended_on:
    - gather_alternative_data
    nodes_dependent_on:
    - engineer_features_from_alternative_data
    prompt: Clean and preprocess the alternative data to remove noise and irrelevant
      records. Structure it into a format compatible with the market data timeline
      and identifiers.
  refine_strategy_or_finalize:
    agent: false
    description: Decide to iterate improvements on the strategy or finalize the trading
      model for implementation.
    name: refine_strategy_or_finalize
    nodes_depended_on:
    - analyze_backtest_results
    nodes_dependent_on:
    - design_execution_plan
    - define_risk_management_rules
    prompt: Based on backtest analysis, either specify refinements on feature engineering,
      model, or parameters and restart relevant steps, or proceed to formalize how
      the model will execute live and manage risk.
  run_backtest:
    agent: false
    description: Execute the trading strategy simulation over historical data to generate
      detailed performance results.
    name: run_backtest
    nodes_depended_on:
    - construct_backtesting_environment
    nodes_dependent_on:
    - analyze_backtest_results
    prompt: Run the backtest on historical data using the constructed environment.
      Produce detailed results including returns, drawdown, turnover, and risk metrics.
  select_model_type:
    agent: false
    description: Choose the type of quantitative model(s) to develop for the strategy
      (e.g., statistical, machine learning, factor-based).
    name: select_model_type
    nodes_depended_on:
    - merge_features
    nodes_dependent_on:
    - split_dataset
    prompt: Based on the features available, select appropriate model methodology
      types such as linear regression, random forest, neural networks, or factor models
      for the quantitative trading strategy.
  split_dataset:
    agent: false
    description: Partition the consolidated dataset into training, validation, and
      test sets for model development and evaluation.
    name: split_dataset
    nodes_depended_on:
    - select_model_type
    - define_performance_metrics
    nodes_dependent_on:
    - train_model
    prompt: Divide the feature dataset chronologically into training, validation,
      and test datasets ensuring no lookahead bias. Specify proportions or date cutoffs
      used.
  test_final_model:
    agent: false
    description: Evaluate the optimized model on the holdout test dataset for unbiased
      performance estimation.
    name: test_final_model
    nodes_depended_on:
    - optimize_parameters
    - perform_cross_validation
    nodes_dependent_on:
    - construct_backtesting_environment
    prompt: Use the test dataset to generate unbiased performance metrics for the
      final model configuration. Confirm metrics meet strategy success criteria.
  train_model:
    agent: false
    description: Fit the chosen quantitative model to the training dataset.
    name: train_model
    nodes_depended_on:
    - split_dataset
    nodes_dependent_on:
    - validate_model
    prompt: Train the selected model type on the training dataset. Optimize parameters
      internally as needed, but do not evaluate performance yet.
  validate_model:
    agent: false
    description: Evaluate the trained model on the validation dataset to estimate
      generalization performance.
    name: validate_model
    nodes_depended_on:
    - train_model
    nodes_dependent_on:
    - optimize_parameters
    - perform_cross_validation
    prompt: Assess the model’s predictive quality and trading signal efficacy using
      the validation dataset. Calculate defined performance metrics and identify areas
      needing tuning.
