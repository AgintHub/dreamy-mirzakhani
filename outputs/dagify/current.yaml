dag_type: plain_text
description: A highly granular, concurrent workflow that produces a complete foundational
  plan for launching a hedge fund, from objectives to final executive summary.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Identifies the overarching investment strategy.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Select one high‑level hedge‑fund strategy category that aligns with the
      objectives (e.g., long/short equity, global macro, market neutral). Provide
      a one‑sentence rationale.
  choose_legal_entity_type:
    agent: false
    description: Determines the legal form of the fund vehicle.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Give a brief explanation of why this structure
      fits the fund.
  clarify_fund_objectives:
    agent: false
    description: Produces a clear list of the fund’s core objectives.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: State the primary business objectives for launching the hedge fund. Produce
      a concise bullet list covering investment purpose, competitive advantage, target
      returns, and long‑term vision (max 8 bullets). Do not include strategy details.
  select_jurisdiction:
    agent: false
    description: Selects the legal domicile for the fund and justifies the choice.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Choose the optimal domicile for the fund (e.g., Cayman Islands, Delaware,
      Luxembourg) based on the stated objectives. Provide two pros and two cons for
      the selected jurisdiction.
