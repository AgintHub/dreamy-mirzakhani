dag_type: plain_text
description: A minimal yet fully connected and concurrent workflow to perform a test
  operation, ensuring all steps are atomic, stateless, and unambiguous.
name: execute_test_workflow
nodes:
  capture_test_output:
    agent: false
    description: Record the results produced by the test execution.
    name: capture_test_output
    nodes_depended_on:
    - execute_test_case
    nodes_dependent_on: []
    prompt: Collect and serialize the output from the test execution, including logs,
      return values, and side effects.
  evaluate_test_outcome:
    agent: false
    description: Determine whether the test passed or failed based on expected vs
      actual results.
    name: evaluate_test_outcome
    nodes_depended_on:
    - capture_test_output
    nodes_dependent_on: []
    prompt: Compare the captured output against the expected outcome defined in initialize_test_context.
      Return a boolean pass/fail result.
  execute_test_case:
    agent: false
    description: Run the core test logic using prepared inputs and environment.
    name: execute_test_case
    nodes_depended_on:
    - validate_test_input_format
    - prepare_test_environment
    nodes_dependent_on: []
    prompt: Perform the actual test execution using the validated input and configured
      environment. Capture raw output or behavior.
  generate_test_report:
    agent: false
    description: Produce a structured report summarizing the test execution and outcome.
    name: generate_test_report
    nodes_depended_on:
    - evaluate_test_outcome
    nodes_dependent_on: []
    prompt: Create a human-readable and machine-parseable summary of the test, including
      inputs, execution steps, output, and pass/fail status.
  initialize_test_context:
    agent: false
    description: Establish the initial context and inputs required for the test.
    name: initialize_test_context
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Define the environment, parameters, and initial state for the test. Include
      any assumptions or constraints.
  notify_test_completion:
    agent: false
    description: Signal the completion of the test to external systems or users.
    name: notify_test_completion
    nodes_depended_on:
    - generate_test_report
    nodes_dependent_on: []
    prompt: Send a notification (e.g., console log, webhook, email) indicating that
      the test has completed, including a link or reference to the full report.
  prepare_test_environment:
    agent: false
    description: Set up the runtime environment where the test will execute.
    name: prepare_test_environment
    nodes_depended_on:
    - initialize_test_context
    nodes_dependent_on: []
    prompt: Configure the test environment based on the context, including dependencies,
      mock data, and sandbox settings.
  validate_test_input_format:
    agent: false
    description: Ensure the test input is in the correct format and structure.
    name: validate_test_input_format
    nodes_depended_on:
    - initialize_test_context
    nodes_dependent_on: []
    prompt: Check that the input defined in initialize_test_context conforms to the
      expected schema or type. Report any formatting issues.
