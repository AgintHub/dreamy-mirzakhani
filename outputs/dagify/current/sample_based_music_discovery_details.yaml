  extract_audio_features:
    agent: false
    code_node_type: stub
    description: Extract relevant audio features from the loaded snippet
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass LoadAudioSnippetOutput(BaseModel):\n    \"\"\"Pydantic model for load_audio_snippet\
      \ node outputs.\"\"\"\n    audio_file_path: str = (\n        Field(..., description=\"\
      Path to the loaded audio file\")\n    )\n    audio_features: List[float] = (\n\
      \        Field(..., description=\"Extracted audio features such as spectrograms\
      \ or MFCCs\")\n    )\n    loading_status: bool = (\n        Field(..., description=\"\
      Whether the audio file was loaded successfully\")\n    )\n\n\nclass ExtractAudioFeaturesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for extract_audio_features node outputs.\"\"\"\n \
      \   spectrogram: List[float] = (\n        Field(..., description=\"Spectrogram\
      \ features of the audio snippet\")\n    )\n    mfccs: List[float] = (\n    \
      \    Field(..., description=\"Mel-frequency cepstral coefficients (MFCCs) of\
      \ the audio snippet\")\n    )\n    chroma_features: List[float] = (\n      \
      \  Field(..., description=\"Chroma features of the audio snippet\")\n    )\n\
      \    feature_extraction_status: bool = (\n        Field(..., description=\"\
      Whether the feature extraction was successful\")\n    )\n\n\ndef extract_audio_features(load_audio_snippet_input:\
      \ LoadAudioSnippetOutput, **kwargs) -> ExtractAudioFeaturesOutput:\n    \"\"\
      \"\n    Extracts spectrogram, MFCCs, and chroma features from an audio snippet.\n\
      \n    Parameters\n    ----------\n    audio_snippet : dict\n        Loaded audio\
      \ snippet with its path and features.\n\n    Returns\n    -------\n    dict\n\
      \        A dictionary containing spectrogram, MFCCs, chroma features, and\n\
      \        feature extraction status.\n\n    Raises\n    ------\n    Exception\n\
      \        If there's an error in feature extraction.\n\n    Examples\n    --------\n\
      \    >>> audio_snippet = {'audio_file_path': '/path/to/audio.wav',\n    'audio_features':\
      \ [...] }\n    >>> features = extract_audio_features(audio_snippet)\n    {'spectrogram':\
      \ [...], 'mfccs': [...], 'chroma_features': [...],\n    'feature_extraction_status':\
      \ True}\n\n    \"\"\"\n    return ExtractAudioFeaturesOutput(\n        spectrogram=[],\n\
      \        mfccs=[],\n        chroma_features=[],\n        feature_extraction_status=False,\n\
      \    )"
    name: extract_audio_features
    nodes_depended_on:
    - load_audio_snippet
    nodes_dependent_on: []
    output_structure:
    - description: Spectrogram features of the audio snippet
      key: spectrogram
      type: List[float]
    - description: Mel-frequency cepstral coefficients (MFCCs) of the audio snippet
      key: mfccs
      type: List[float]
    - description: Chroma features of the audio snippet
      key: chroma_features
      type: List[float]
    - description: Whether the feature extraction was successful
      key: feature_extraction_status
      type: bool
    prd:
      conceptual_info: This node takes an audio snippet loaded by the 'load_audio_snippet'
        node and extracts relevant audio features.
      docstring:
        examples:
        - lines:
          - 'audio_snippet = {''audio_file_path'': ''/path/to/audio.wav'', ''audio_features'':
            [...] }'
          - features = extract_audio_features(audio_snippet)
          output: '{''spectrogram'': [...], ''mfccs'': [...], ''chroma_features'':
            [...], ''feature_extraction_status'': True}'
        parameters:
        - description: Loaded audio snippet with its path and features.
          name: audio_snippet
          type: dict
        raises:
        - description: If there's an error in feature extraction.
          type: Exception
        returns:
          description: A dictionary containing spectrogram, MFCCs, chroma features,
            and feature extraction status.
          type: dict
        summary: Extracts spectrogram, MFCCs, and chroma features from an audio snippet.
    prompt: Extract features such as spectrograms, mel-frequency cepstral coefficients
      (MFCCs), or chroma features from the audio snippet.
    shims: []
  generate_song_links:
    agent: false
    code_node_type: stub
    description: Generate links to the musicians' pages
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass RetrieveSongMetadataOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ retrieve_song_metadata node outputs.\"\"\"\n    song_titles: List[str] = (\n\
      \        Field(..., description=\"List of song titles for the matching songs\"\
      )\n    )\n    artist_names: List[str] = (\n        Field(..., description=\"\
      List of artist names for the matching songs\")\n    )\n    album_info: List[str]\
      \ = (\n        Field(..., description=\"List of album information for the matching\
      \ songs\")\n    )\n    metadata_retrieval_status: bool = (\n        Field(...,\
      \ description=\"Whether the metadata retrieval was successful\")\n    )\n\n\n\
      class GenerateSongLinksOutput(BaseModel):\n    \"\"\"Pydantic model for generate_song_links\
      \ node outputs.\"\"\"\n    song_titles: List[str] = Field(..., description=\"\
      List of song titles\")\n    artist_names: List[str] = Field(..., description=\"\
      List of artist names\")\n    album_info: List[str] = Field(..., description=\"\
      List of album information\")\n    musician_page_links: List[str] = (\n     \
      \   Field(..., description=\"List of links to the musicians' pages\")\n    )\n\
      \    streaming_platform_links: List[str] = (\n        Field(..., description=\"\
      List of links to the songs on music streaming platforms\")\n    )\n\n\ndef generate_song_links(retrieve_song_metadata_input:\
      \ RetrieveSongMetadataOutput, **kwargs) -> GenerateSongLinksOutput:\n    \"\"\
      \"\n    Generate links to musicians' pages using the retrieved metadata.\n\n\
      \    Parameters\n    ----------\n    song_metadata : dict\n        Dictionary\
      \ containing song metadata (song titles, artist names,\n        album information)\n\
      \n    Returns\n    -------\n    dict\n        Dictionary containing song titles,\
      \ artist names, album information,\n        musician page links, and streaming\
      \ platform links\n\n    Raises\n    ------\n    ValueError\n        If the input\
      \ metadata is invalid or incomplete\n\n    Examples\n    --------\n    >>> song_metadata\
      \ = {\n    ...     'song_titles': ['Song 1', 'Song 2'],\n    ...     'artist_names':\
      \ ['Artist 1', 'Artist 2'],\n    ...     'album_info': ['Album 1', 'Album 2']\n\
      \    >>> }\n    >>> result = generate_song_links(song_metadata)\n    {'song_titles':\
      \ ['Song 1', 'Song 2'], 'artist_names': ['Artist 1', 'Artist\n    2'], 'album_info':\
      \ ['Album 1', 'Album 2'], 'musician_page_links':\n    ['https://example.com/artist1',\
      \ 'https://example.com/artist2'],\n    'streaming_platform_links': ['https://example.com/song1',\n\
      \    'https://example.com/song2']}\n\n    \"\"\"\n    return GenerateSongLinksOutput(\n\
      \        song_titles=[],\n        artist_names=[],\n        album_info=[],\n\
      \        musician_page_links=[],\n        streaming_platform_links=[],\n   \
      \ )"
    name: generate_song_links
    nodes_depended_on:
    - retrieve_song_metadata
    nodes_dependent_on: []
    output_structure:
    - description: List of song titles
      key: song_titles
      type: List[str]
    - description: List of artist names
      key: artist_names
      type: List[str]
    - description: List of album information
      key: album_info
      type: List[str]
    - description: List of links to the musicians' pages
      key: musician_page_links
      type: List[str]
    - description: List of links to the songs on music streaming platforms
      key: streaming_platform_links
      type: List[str]
    prd:
      conceptual_info: This node generates links to musicians' pages based on the
        retrieved metadata.
      docstring:
        examples:
        - lines:
          - song_metadata = {
          - '    ''song_titles'': [''Song 1'', ''Song 2''],'
          - '    ''artist_names'': [''Artist 1'', ''Artist 2''],'
          - '    ''album_info'': [''Album 1'', ''Album 2'']'
          - '}'
          - result = generate_song_links(song_metadata)
          output: '{''song_titles'': [''Song 1'', ''Song 2''], ''artist_names'': [''Artist
            1'', ''Artist 2''], ''album_info'': [''Album 1'', ''Album 2''], ''musician_page_links'':
            [''https://example.com/artist1'', ''https://example.com/artist2''], ''streaming_platform_links'':
            [''https://example.com/song1'', ''https://example.com/song2'']}'
        parameters:
        - description: Dictionary containing song metadata (song titles, artist names,
            album information)
          name: song_metadata
          type: dict
        raises:
        - description: If the input metadata is invalid or incomplete
          type: ValueError
        returns:
          description: Dictionary containing song titles, artist names, album information,
            musician page links, and streaming platform links
          type: dict
        summary: Generate links to musicians' pages using the retrieved metadata.
    prompt: Use the retrieved metadata to generate links to the musicians' pages on
      music streaming platforms or social media.
    shims: []
