dag_type: plain_text
description: Executing test validation by executing the test and verifying the outputs
  are as expected.
name: validate_test
nodes:
  compare_real_and_expected_outputs:
    agent: false
    description: Compare test output files and test log values with the outputs we
      expect.
    name: compare_real_and_expected_outputs
    nodes_depended_on:
    - run_test
    - define_expected_outputs
    nodes_dependent_on: []
    prompt: Given test output files and log, cross check with expected values to assert
      compliance.
  define_expected_outputs:
    agent: false
    description: Define the expected outputs of the test to verify against real outputs.
    name: define_expected_outputs
    nodes_depended_on: []
    nodes_dependent_on:
    - setup_test_environment
    prompt: Given the test's parameters and input data, write down the expected output
      for this test, like output files or specific test log values.
  define_test_execution_parameters:
    agent: false
    description: Determine execution parameters for the test in question such as test
      timeout, test parallel execution number and test retry number.
    name: define_test_execution_parameters
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Determine test execution parameters like test timeout and desired parallelism
      or the retry count for test to set up a well-defined environment for test execution.
  prepare_test_input_data:
    agent: false
    description: Load necessary input data for the test under evaluation.
    name: prepare_test_input_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Prepare test input data as required to run the test.
  run_test:
    agent: false
    description: Execute the test under scrutiny to determine actual outputs.
    name: run_test
    nodes_depended_on:
    - setup_test_environment
    nodes_dependent_on:
    - define_expected_outputs
    prompt: Run the test as implemented under test data provided and observe the generated
      output files and test logs.
  setup_test_environment:
    agent: false
    description: Setup our test environment, including our input, like test parameters
      and test run configurations, with provided data.
    name: setup_test_environment
    nodes_depended_on: []
    nodes_dependent_on:
    - define_test_execution_parameters
    - prepare_test_input_data
    prompt: Establish the test execution parameters, including hardware specification
      and test execution environment, with input provided data to set up our test
      environment.
