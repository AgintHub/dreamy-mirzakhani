dag_type: plain_text
description: A detailed, concurrent workflow to perform testing of a software component,
  covering requirement gathering, test planning, environment setup, test case creation,
  execution, result collection, analysis, reporting, and closure.
name: generic_testing_workflow
nodes:
  analyze_test_results:
    agent: false
    description: Analyze the test outcomes to identify defects and assess test coverage.
    name: analyze_test_results
    nodes_depended_on:
    - collect_test_results
    nodes_dependent_on: []
    prompt: Analyze the collected test results to identify failed test cases, root
      causes, and any gaps in test coverage. Produce a defect list and a coverage
      summary.
  close_test_cycle:
    agent: false
    description: Conclude the testing effort by documenting lessons learned and updating
      requirements.
    name: close_test_cycle
    nodes_depended_on:
    - report_test_summary
    nodes_dependent_on: []
    prompt: Document lessons learned from the testing effort, including what worked
      well and what can be improved. Update the original requirements or test artifacts
      if needed. Provide a concise closure note.
  collect_test_results:
    agent: false
    description: Gather all execution logs, screenshots, and result data into a consolidated
      artifact.
    name: collect_test_results
    nodes_depended_on:
    - execute_test_cases
    nodes_dependent_on: []
    prompt: Collect all execution logs, screenshots, and result entries from the test
      execution phase. Assemble them into a single archive or directory with a clear
      index of contents.
  define_test_objectives:
    agent: false
    description: Specify the high-level objectives of the testing effort based on
      the gathered requirements.
    name: define_test_objectives
    nodes_depended_on:
    - gather_test_requirements
    nodes_dependent_on: []
    prompt: Based on the listed requirements, define the primary objectives for the
      testing effort (e.g., verify functionality, assess performance, ensure security).
      Provide each objective as a short statement.
  design_test_plan:
    agent: false
    description: Create a test plan outlining scope, approach, resources, schedule,
      and deliverables.
    name: design_test_plan
    nodes_depended_on:
    - define_test_objectives
    - gather_test_requirements
    nodes_dependent_on: []
    prompt: 'Draft a test plan that includes: scope of testing, testing approach (manual/automated),
      required resources, schedule milestones, and expected deliverables. Present
      as a concise bullet list.'
  execute_test_cases:
    agent: false
    description: Run the reviewed test cases against the prepared environments using
      the generated data.
    name: execute_test_cases
    nodes_depended_on:
    - prepare_test_environment
    - review_test_cases
    - generate_test_data
    nodes_dependent_on: []
    prompt: 'Execute each reviewed test case in its appropriate environment with the
      provided test data. Record the actual outcome and any observed issues. Summarize
      results in a table with columns: Test Case ID, Pass/Fail, Observed Issue (if
      any).'
  gather_test_requirements:
    agent: false
    description: Collect the functional and non-functional requirements that will
      be validated through testing.
    name: gather_test_requirements
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Identify and list all functional and non-functional requirements of the
      target software component that should be verified through testing. Provide each
      requirement as a concise bullet point.
  generate_test_data:
    agent: false
    description: Create or procure the data needed to execute the test cases.
    name: generate_test_data
    nodes_depended_on:
    - write_test_cases
    nodes_dependent_on: []
    prompt: Based on the test cases, generate the necessary test data (e.g., input
      files, database records, API payloads). Provide each data set with a brief description
      of its purpose.
  identify_test_environments:
    agent: false
    description: Determine the hardware, OS, browsers, and configurations needed for
      testing.
    name: identify_test_environments
    nodes_depended_on:
    - gather_test_requirements
    nodes_dependent_on: []
    prompt: List the test environments (including operating systems, browsers, hardware
      configurations, network conditions) required to execute the test cases for the
      identified requirements.
  prepare_test_environment:
    agent: false
    description: Provision and configure the identified test environments.
    name: prepare_test_environment
    nodes_depended_on:
    - identify_test_environments
    nodes_dependent_on: []
    prompt: Provide step-by-step instructions to provision and configure each test
      environment listed, including any required software installations, network settings,
      and environment variables.
  report_test_summary:
    agent: false
    description: Generate a comprehensive test report summarizing objectives, approach,
      results, defects, and recommendations.
    name: report_test_summary
    nodes_depended_on:
    - analyze_test_results
    - design_test_plan
    nodes_dependent_on: []
    prompt: 'Create a test summary report that includes: testing objectives, test
      plan highlights, overall pass/fail statistics, detailed defect list, coverage
      overview, and recommendations for remediation. Format as a structured document
      with headings.'
  review_test_cases:
    agent: false
    description: Conduct a peer review of the test cases to ensure completeness and
      clarity.
    name: review_test_cases
    nodes_depended_on:
    - write_test_cases
    nodes_dependent_on: []
    prompt: Perform a peer review of the provided test cases. Identify any missing
      steps, ambiguities, or gaps, and suggest improvements. List findings as bullet
      points.
  write_test_cases:
    agent: false
    description: Develop detailed test cases covering each requirement.
    name: write_test_cases
    nodes_depended_on:
    - gather_test_requirements
    nodes_dependent_on: []
    prompt: 'Create test cases for each requirement. For each test case, include:
      test case ID, description, preconditions, steps, expected result, and any required
      data. Output as a table.'
