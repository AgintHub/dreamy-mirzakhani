dag_type: plain_text
description: A workflow that implements a concurrent and parallelized quicksort algorithm
name: concurrent_quicksort
nodes:
  final_sorted_list:
    agent: false
    description: The final sorted list resulting from merging the sorted sublists
    name: final_sorted_list
    nodes_depended_on:
    - merge_sorted_sublists
    nodes_dependent_on: []
    prompt: Output the final sorted list
  input_list:
    agent: false
    description: The initial input list to be sorted
    name: input_list
    nodes_depended_on: []
    nodes_dependent_on:
    - split_input_list
    prompt: Provide the input list to be sorted
  merge_sorted_sublists:
    agent: false
    description: Merge the sorted sublists into a single sorted list
    name: merge_sorted_sublists
    nodes_depended_on:
    - sort_sublists
    nodes_dependent_on:
    - final_sorted_list
    prompt: Merge the sorted sublists using a merge algorithm, maintaining the sorted
      order
  sort_sublists:
    agent: false
    description: Sort each sublist using the quicksort algorithm
    name: sort_sublists
    nodes_depended_on:
    - split_input_list
    nodes_dependent_on:
    - merge_sorted_sublists
    prompt: Apply the quicksort algorithm to sort each sublist independently
  split_input_list:
    agent: false
    description: Split the input list into smaller sublists for concurrent sorting
    name: split_input_list
    nodes_depended_on:
    - input_list
    nodes_dependent_on:
    - sort_sublists
    prompt: Split the input list into sublists of size n, where n is the number of
      available processing units
