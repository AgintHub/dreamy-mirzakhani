dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues.
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: A list of interface failure descriptions.
      key: interface_failures
      type: List[str]
    - description: A list of component pairs involved in failures.
      key: component_pairs
      type: List[str]
    - description: A list of data exchange problems identified during testing.
      key: data_exchange_issues
      type: List[str]
    - description: A list of descriptions of contract violations.
      key: contract_violations
      type: List[str]
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks by analyzing results from regression testing.
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies.
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions.
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value.
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered.
      key: regression_summary
      type: str
    prd:
      conceptual_info: Analyzing regression test results to identify potential risks
        in software development.
      docstring:
        examples:
        - lines:
          - analyze_regression_test_results(run_regression_tests_result) -> result
          output: '{feature_name: login feature, before_after_state_comparison: password
            field changed from uppercase to lowercase, impact_severity_estimation:
            5, regression_summary: login feature has a high-impact regression issue}'
        - lines:
          - analyze_regression_test_results(run_regression_tests_result) -> result
          output: '{feature_name: inventory feature, before_after_state_comparison:
            wrong product image displayed, impact_severity_estimation: 3, regression_summary:
            inventory feature has a medium-impact regression issue}'
        parameters: []
        raises: []
        returns:
          description: Dictionary containing feature name, before/after state comparison,
            and impact severity estimation for each regression anomaly.
          type: dict
        summary: Identify regression risks by analyzing results from regression testing.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Aggregate testing anomalies.
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Aggregate testing anomalies from unit test results.
      docstring:
        examples:
        - lines:
          - 'def analyze_unit_test_results(test_execution_status, actual_output_vs_expected_output,
            test_case_timestamps):'
          - '    # Combine test results into a defect summary table'
          - '    test_type = [''unit_test'', ''unit_test'', ''unit_test'']'
          - '    component_info = [''component1'', ''component2'', ''component3'']'
          - '    description = [''desc1'', ''desc2'', ''desc3'']'
          - '    severity = [''high'', ''medium'', ''low'']'
          - '    reproduction_steps = [''steps1'', ''steps2'', ''steps3'']'
          - '    return {''test_type'': test_type, ''component_info'': component_info,
            ''description'': description, ''severity'': severity, ''reproduction_steps'':
            reproduction_steps}'
          - analyze_unit_test_results.run_unit_tests()
          - 'out = {''test_type'': [''unit_test''], ''component_info'': [''component1''],
            ''description'': [''desc1''], ''severity'': [''high''], ''reproduction_steps'':
            [''steps1'']}'
          - print(out)
          output: "{\n    'test_type': ['unit_test'],\n    'component_info': ['component1'],\n\
            \    'description': ['desc1'],\n    'severity': ['high'],\n    'reproduction_steps':\
            \ ['steps1']\n}"
        - lines:
          - 'def analyze_unit_test_results(test_execution_status, actual_output_vs_expected_output,
            test_case_timestamps):'
          - '    # Combine test results into a defect summary table'
          - '    test_type = [''unit_test'', ''integration_test'', ''regression_test'']'
          - '    component_info = [''component1'', ''component2'', ''component3'']'
          - '    description = [''desc1'', ''desc2'', ''desc3'']'
          - '    severity = [''high'', ''medium'', ''low'']'
          - '    reproduction_steps = [''steps1'', ''steps2'', ''steps3'']'
          - '    return {''test_type'': test_type, ''component_info'': component_info,
            ''description'': description, ''severity'': severity, ''reproduction_steps'':
            reproduction_steps}'
          - analyze_unit_test_results.run_unit_tests()
          - 'out = {''test_type'': [''unit_test'', ''integration_test'', ''regression_test''],
            ''component_info'': [''component1'', ''component2'', ''component3''],
            ''description'': [''desc1'', ''desc2'', ''desc3''], ''severity'': [''high'',
            ''medium'', ''low''], ''reproduction_steps'': [''steps1'', ''steps2'',
            ''steps3'']}'
          - print(out)
          output: "{\n    'test_type': ['unit_test', 'integration_test', 'regression_test'],\n\
            \    'component_info': ['component1', 'component2', 'component3'],\n \
            \   'description': ['desc1', 'desc2', 'desc3'],\n    'severity': ['high',\
            \ 'medium', 'low'],\n    'reproduction_steps': ['steps1', 'steps2', 'steps3']\n\
            }"
        parameters: []
        raises: []
        returns:
          description: 'A defect summary table with columns: Test Type | Component
            | Description | Severity | Reproduction Steps.'
          type: dict
        summary: Create a defect summary table from unit test results.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: Design integration test cases based on the planned test scope.
      docstring:
        examples:
        - lines:
          - design_integration_test_cases(plan_test_scope='test_plan')
          - print(design_integration_test_cases(plan_test_scope='test_plan'))
          output: '{''component_pairs'': [''cmp1_cmp2'', ''cmp2_cmp3''], ''data_flow_paths'':
            [''path1'', ''path2''], ''dependency_validations'': [''valid1'', ''valid2''],
            ''integration_test_scenarios'': [''scenario1'', ''scenario2'']}'
        parameters: []
        raises: []
        returns:
          description: Integration test scenarios and their corresponding components,
            data flow paths, and dependency validations.
          type: Dict[str, List[str]]
        summary: Generate integration test scenarios.
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation.
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios.
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario.
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario.
      key: expected_state_preservation
      type: List[str]
    prd:
      conceptual_info: This node generates test cases for unchanged features validation.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Core functionality', 'Edge cases', 'Performance requirements']
          - core_functionality_requirements = ['Req 1', 'Req 2', 'Req 3']
          - edge_case_requirements = ['Req 1', 'Req 2', 'Req 3']
          - performance_requirements = ['Req 1', 'Req 2', 'Req 3']
          - result = design_regression_test_cases(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements)
          output: ({high-risk features, precondition setup, expected state preservation})
        - lines:
          - test_objectives = ['Core functionality', 'Edge cases', 'Performance requirements']
          - core_functionality_requirements = ['Req 1', 'Req 2', 'Req 3']
          - edge_case_requirements = ['Req 1', 'Req 2', 'Req 3']
          - performance_requirements = ['Req 1', 'Req 2', 'Req 3']
          - result = design_regression_test_cases(test_objectives, core_functionality_requirements,
            edge_case_requirements, performance_requirements)
          output: ({high-risk features, precondition setup, expected state preservation})
        parameters:
        - description: High-level test objectives for the software under test.
          name: test_objectives
          type: List[str]
        - description: Core functionality requirements for the software under test.
          name: core_functionality_requirements
          type: List[str]
        - description: Edge case requirements for the software under test.
          name: edge_case_requirements
          type: List[str]
        - description: Performance requirements for the software under test.
          name: performance_requirements
          type: List[str]
        raises:
        - description: If the test objectives, core functionality requirements, edge
            case requirements, or performance requirements are invalid or incomplete.
          type: ValueError
        returns:
          description: Returns a tuple containing a list of high-risk features, precondition
            setup instructions, and expected state preservation descriptions for each
            regression test scenario.
          type: tuple
        summary: Design regression test cases for high-risk features.
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for each test case
      key: test_id
      type: List[str]
    - description: List of input parameters required for each test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for each test case
      key: expected_output
      type: List[str]
    prd:
      conceptual_info: This node creates unit test cases by identifying the core functional
        components of a module and defining expected output values for each test case,
        enabling the evaluation of the module's functionality.
      docstring:
        examples:
        - lines:
          - design_unit_test_cases(test_objectives=['Functional requirement 1', 'Functional
            requirement 2', 'Functional requirement 3'], core_functionality_requirements=['Requirement
            1', 'Requirement 2', 'Requirement 3'], edge_case_requirements=['Edge case
            1', 'Edge case 2', 'Edge case 3'], performance_requirements=['Performance
            requirement 1', 'Performance requirement 2', 'Performance requirement
            3']])
          output: '{''test_id'': [''Test ID 1'', ''Test ID 2'', ''Test ID 3''], ''input_parameters'':
            [''Input Param 1'', ''Input Param 2'', ''Input Param 3''], ''expected_output'':
            [''Expected Output 1'', ''Expected Output 2'', ''Expected Output 3'']}'
        parameters:
        - description: A list of high-level test objectives that define the scope
            of the unit tests
          name: test_objectives
          type: List[str]
        - description: A list of core functionality requirements that specify the
            expected behavior of the module's core components
          name: core_functionality_requirements
          type: List[str]
        - description: A list of edge case requirements that specify the input conditions
            for testing the module's boundary values
          name: edge_case_requirements
          type: List[str]
        - description: A list of performance requirements that specify the expected
            performance characteristics of the module
          name: performance_requirements
          type: List[str]
        raises:
        - description: If the input parameters do not match the expectations for a
            particular test case
          type: ValueError
        returns:
          description: A dictionary containing the generated unit test case templates
            with unique identifiers, input parameters, and expected output values
          type: dict
        summary: Generate 5-8 unit test case templates for module-level validation
          by executing the prompt with given inputs.
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: This node defines high-level test objectives and coverage requirements.
        It provides an overview of what needs to be tested and how.
      docstring:
        examples:
        - lines:
          - 'input_scope = [''Core functionality: user login'', ''Edge case: invalid
            input'', ''Performance requirement: 1ms response time'']'
          - test_objectives, core_functionality_requirements, edge_case_requirements,
            performance_requirements = plan_test_scope(input_scope)
          output: '[[''Core functionality: user login'', ''Edge case: invalid input'',
            ''Performance requirement: 1ms response time''], [''Core functionality:
            user login'', ''Edge case: invalid input'', ''Performance requirement:
            1ms response time''], [''Edge case: invalid input''], [''Performance requirement:
            1ms response time'']]'
        parameters:
        - description: List of test objectives and requirements
          name: input_scope
          type: List[str]
        raises:
        - description: If input_scope is empty or does not contain valid test objectives
          type: ValueError
        returns:
          description: A tuple containing test objectives, core functionality requirements,
            edge case requirements, and performance requirements.
          type: Tuple[List[str], List[str], List[str], List[str]]
        summary: Defines high-level test objectives and coverage requirements.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: This node aggregates testing anomalies from various test types
        and provides a summary table with essential defect information.
      docstring:
        examples:
        - lines:
          - 'report_defects(unit_test_results={''test-id-1'': {''description'': ''defect
            1''}},'
          - '  integration_test_results={''test-id-2'': {''description'': ''defect
            2''}},'
          - '  regression_test_results={''test-id-3'': {''description'': ''defect
            3''}})'
          output: '{''test_type'': ''unit/integration/regression'', ''component_info'':
            '''', ''description'': ''defect 1'', ''severity'': '''', ''reproduction_steps'':
            ''Steps to reproduce test-id-1''}'
        - lines:
          - 'report_defects(unit_test_results={''test-id-1'': {''description'': ''defect
            1''}},'
          - '  integration_test_results={''test-id-2'': {''description'': ''defect
            2''}},'
          - '  regression_test_results={''test-id-3'': {''description'': ''defect
            3''}})'
          output: '{''test_type'': ''unit/integration/regression'', ''component_info'':
            '''', ''description'': ''defect 2'', ''severity'': '''', ''reproduction_steps'':
            ''Steps to reproduce test-id-2''}'
        parameters:
        - description: Results from unit tests, mapping test IDs to defect descriptions.
          name: unit_test_results
          type: dict[str, dict[str, str]]
        - description: Results from integration tests, mapping test IDs to defect
            descriptions.
          name: integration_test_results
          type: dict[str, dict[str, str]]
        - description: Results from regression tests, mapping test IDs to defect descriptions.
          name: regression_test_results
          type: dict[str, dict[str, str]]
        raises:
        - description: If any of the input results dictionaries are empty.
          type: ValueError
        returns:
          description: A dictionary containing the aggregated defect information with
            keys matching the output structure.
          type: dict[str, str]
        summary: Aggregate testing anomalies from multiple sources and produce a summary
          table.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario.
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step.
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario.
      key: test_scenario_ids
      type: List[str]
    prd:
      conceptual_info: This node executes integration test scenarios and documents
        communication logs and interface validation outcomes.
      docstring:
        examples:
        - lines:
          - integration_test_cases = design_integration_test_cases(
          output: '{''communication_logs'': [\u202''log1\u202'', \u202''log2\u202''],
            ''interface_validation_results'': [\u202''interface1\u202'', \u202''interface2\u202''],
            ''test_scenario_ids'': [\u202''test_scenario1\u202'', \u202''test_scenario2\u202'']}'
        - lines:
          - test_scenario_ids = setup_test_environment(
          output: '{''test_scenario_ids'': [''test_scenario1'', ''test_scenario2'']}'
        parameters:
        - description: Integration test cases to be executed.
          name: design_integration_test_cases
          type: dict
        - description: Test environment setup.
          name: setup_test_environment
          type: dict
        raises:
        - description: If there is an error executing the integration tests.
          type: Exception
        returns:
          description: A dictionary containing communication logs, interface validation
            results, and test scenario IDs.
          type: dict
        summary: Execute integration test scenarios and document communication logs
          and interface validation outcomes.
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: This node orchestrates the execution of regression test scenarios
      for unchanged features, collecting baseline vs actual results, state drift indicators,
      and performance metrics.
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of results comparing baseline metrics versus current actual
        results for each regression scenario.
      key: baseline_vs_actual_results
      type: List[str]
    - description: Indicators signaling any detected state drift during regression
        tests, such as deviations or anomalies.
      key: state_drift_indicators
      type: List[str]
    - description: Various performance metrics recorded during regression testing,
        such as response times and throughput.
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: This node executes regression test scenarios, collects baseline
        vs actual results, state drift indicators, and performance metrics.
      docstring:
        examples:
        - lines:
          - design_regression_test_cases = design_regression_test_cases(node_id="run_regression_tests")
          - setup_test_environment = setup_test_environment(node_id="run_regression_tests")
          - results = run_regression_tests(design_regression_test_cases, setup_test_environment)
          output: Results dictionary with baseline vs actual results, state drift
            indicators, and performance metrics.
        parameters:
        - description: Regression test scenarios targeting high-risk features.
          name: design_regression_test_cases
          type: design_regression_test_cases
        - description: Test environment setup with hardware/software specs, test data
            sets, and mock services.
          name: setup_test_environment
          type: setup_test_environment
        raises:
        - description: If regression test scenarios or test environment setup fails.
          type: RuntimeError
        returns:
          description: Results from regression tests, including baseline vs actual
            results, state drift indicators, and performance metrics.
          type: '{baseline_vs_actual_results: List[str], state_drift_indicators: List[str],
            performance_metrics: List[str]}'
        summary: Runs regression tests and captures results, drift indicators, and
          performance metrics.
    prompt: Execute regression scenarios and record results
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: List[bool]
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: List[str]
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: List[str]
    prd:
      conceptual_info: This node executes unit test cases and records their pass/fail
        status, actual vs expected output, and timestamps.
      docstring:
        examples:
        - lines:
          - test_cases = design_unit_test_cases.generate_test_cases()
          - test_environment = setup_test_environment.setup_test_environment()
          - test_results = run_unit_tests.run_unit_tests(test_cases, test_environment)
          output: (True, ['pass'], ['2023-03-01 14:00:00'])
        - lines:
          - test_cases2 = design_unit_test_cases.generate_test_cases()
          - test_environment2 = setup_test_environment.setup_test_environment()
          - test_results2 = run_unit_tests.run_unit_tests(test_cases2, test_environment2)
          output: (False, ['fail'], ['2023-03-01 14:05:00'])
        parameters:
        - description: Test cases generated for module-level validation.
          name: design_unit_test_cases
          type: str
        - description: Test environment set up with required infrastructure.
          name: setup_test_environment
          type: str
        raises: []
        returns:
          description: Pass/fail status of each test case, actual vs expected output,
            and timestamps for each test execution.
          type: Tuple[List[bool], List[str], List[str]]
        summary: Execute unit test cases and record test results.
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing.
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing.
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing.
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing.
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up.
      key: environment_status
      type: bool
    prd:
      conceptual_info: This node prepares the testing infrastructure and dependencies
        required for testing.
      docstring:
        examples:
        - lines:
          - 'def setup_test_environment(plan_test_scope):'
          - '    hardware_specs = plan_test_scope[''hardware_specs'']'
          - '    software_specs = plan_test_scope[''software_specs'']'
          - '    test_data_sets = plan_test_scope[''test_data_sets'']'
