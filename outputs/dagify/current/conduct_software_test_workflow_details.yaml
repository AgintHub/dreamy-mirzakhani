dag_type: typed
description: Generated workflow from UI.
name: conduct_software_test_workflow
nodes:
  analyze_integration_test_results:
    agent: false
    description: Identify interface-level issues
    name: analyze_integration_test_results
    nodes_depended_on:
    - run_integration_tests
    nodes_dependent_on: []
    output_structure:
    - description: List of interface failure descriptions
      key: interface_failures
      type: List[str]
    - description: List of component pairs involved in failures
      key: component_pairs
      type: List[str]
    - description: List of data exchange problems identified during testing
      key: data_exchange_issues
      type: List[str]
    - description: List of descriptions of contract violations
      key: contract_violations
      type: List[str]
    prd:
      conceptual_info: This node analyzes integration test results to identify interface-level
        issues.
      docstring:
        examples:
        - lines:
          - test_result = run_integration_tests()
          - interface_failures, component_pairs, data_exchange_issues, contract_violations
            = analyze_integration_test_results(test_result)
          output: '{''interface_failures'': [''Failure 1'', ''Failure 2''], ''component_pairs'':
            [''Component A, Component B''], ''data_exchange_issues'': [''Issue 1'',
            ''Issue 2''], ''contract_violations'': [''Violation 1'', ''Violation 2'']}'
        parameters: []
        raises:
        - description: If the input is not a valid test result
          type: ValueError
        returns:
          description: A dictionary containing interface failures, component pairs,
            data exchange issues, and contract violations.
          type: Dict[str, List[str]]
        summary: Analyze integration test results to identify interface-level issues.
    prompt: 'List interface failures with: 1) Component pair, 2) Data exchange issues,
      3) Contract violation details (if applicable).'
  analyze_regression_test_results:
    agent: false
    description: Identify regression risks
    name: analyze_regression_test_results
    nodes_depended_on:
    - run_regression_tests
    nodes_dependent_on: []
    output_structure:
    - description: Name of the feature with regression anomalies
      key: feature_name
      type: str
    - description: Description of the before/after state comparison of the regressions
      key: before_after_state_comparison
      type: str
    - description: Estimated impact severity of the regression as an integer value
      key: impact_severity_estimation
      type: int
    - description: Summary of the regression issues encountered
      key: regression_summary
      type: str
    prd:
      conceptual_info: Analyzing regression test results to identify potential risks.
      docstring:
        examples:
        - lines:
          - results = run_regression_tests()
          - anomalies = analyze_regression_test_results(results)
          output: '{''feature_name'': ''Feature1'', ''before_after_state_comparison'':
            ''State change detected'', ''impact_severity_estimation'': 5, ''regression_summary'':
            ''Regression issues encountered''}'
        parameters: []
        raises: []
        returns:
          description: 'A dictionary containing regression anomalies with key-value
            pairs: feature name, before/after state comparison, impact severity estimation,
            and regression summary.'
          type: dict
        summary: Extract regression anomalies from test results and provide a summary.
    prompt: 'List all regression anomalies with: 1) Feature name, 2) Before/after
      state comparison, 3) Impact severity estimation.'
  analyze_unit_test_results:
    agent: false
    description: Identify unit-level anomalies
    name: analyze_unit_test_results
    nodes_depended_on:
    - run_unit_tests
    nodes_dependent_on: []
    output_structure:
    - description: The name of the test case that failed
      key: test_case_name
      type: str
    - description: The actual output of the test case that failed
      key: actual_output
      type: str
    - description: A suggested root cause of the failure from an implementation perspective
      key: suggested_root_cause
      type: str
    - description: The type of test that failed
      key: test_type
      type: str
    - description: A list of test cases that passed
      key: passed_tests
      type: List[str]
    - description: A list of test cases that failed
      key: failed_tests
      type: List[str]
    prompt: 'List all test failues with: 1) Test case name, 2) Actual output, 3) Suggested
      root cause from implementation perspective.'
  design_integration_test_cases:
    agent: false
    description: Create test cases for component interactions
    name: design_integration_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of component pairs for integration test cases
      key: component_pairs
      type: List[str]
    - description: List of data flow paths for integration test cases
      key: data_flow_paths
      type: List[str]
    - description: List of dependency validations for integration test cases
      key: dependency_validations
      type: List[str]
    - description: List of integration test scenarios
      key: integration_test_scenarios
      type: List[str]
    prd:
      conceptual_info: This node is responsible for designing integration test cases
        by creating component pairs, data flow paths, and dependency validations.
      docstring:
        examples:
        - lines:
          - node.run('plan_test_scope')
          - output = node.design_integration_test_cases(output)
          output: '{''component_pairs'': [''pair1'', ''pair2''], ''data_flow_paths'':
            [''path1'', ''path2''], ''dependency_validations'': [''validation1'',
            ''validation2''], ''integration_test_scenarios'': [''scenario1'', ''scenario2'']}'
        - lines:
          - node.run('plan_test_scope')
          - output = node.design_integration_test_cases(output)
          output: '{''component_pairs'': [''pair3'', ''pair4''], ''data_flow_paths'':
            [''path3'', ''path4''], ''dependency_validations'': [''validation3'',
            ''validation4''], ''integration_test_scenarios'': [''scenario3'', ''scenario4'']}'
        parameters: []
        raises: []
        returns:
          description: Returns a dictionary containing component pairs, data flow
            paths, dependency validations, and integration test scenarios
          type: dict
        summary: Create integration test cases for component interactions
    prompt: 'Generate 4-6 integration test scenarios with: 1) Component pairs, 2)
      Data flow paths, 3) Dependency validations.'
  design_regression_test_cases:
    agent: false
    description: Create test cases for unchanged features validation
    name: design_regression_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of high-risk features targeted by regression test scenarios
      key: high_risk_features
      type: List[str]
    - description: Setup instructions for each regression test scenario
      key: precondition_setup
      type: List[str]
    - description: Description of expected state preservation for each regression
        test scenario
      key: expected_state_preservation
      type: List[str]
    prompt: Generate 3-5 regression test scenarios targeting high-risk features with
      1) Precondition setup, 2) Expected state preservation.
  design_unit_test_cases:
    agent: false
    description: Create test cases for module-level validation
    name: design_unit_test_cases
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the test case
      key: test_id
      type: str
    - description: List of input parameters required for the test case
      key: input_parameters
      type: List[str]
    - description: Expected output values for the test case
      key: expected_output
      type: List[str]
    prompt: 'Generate 5-8 unit test case templates with: 1) Test ID, 2) Input parameters,
      3) Expected output, focusing on core functional components.'
  generate_test_report:
    agent: false
    description: Compile test results summary
    name: generate_test_report
    nodes_depended_on:
    - report_defects
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests_executed
      type: int
    - description: Number of tests that passed
      key: pass_count
      type: int
    - description: Number of tests that failed
      key: fail_count
      type: int
    - description: Defect density metric
      key: defect_density
      type: float
    - description: Risk assessment rating (1-10)
      key: risk_assessment_rating
      type: int
    prompt: 'Produce test summary with metrics: total tests executed, pass/fail counts,
      defect density, and risk assessment rating (1-10).'
  plan_test_scope:
    agent: false
    description: Define test objectives and coverage requirements
    name: plan_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of high-level test objectives
      key: test_objectives
      type: List[str]
    - description: List of core functionality requirements
      key: core_functionality_requirements
      type: List[str]
    - description: List of edge case requirements
      key: edge_case_requirements
      type: List[str]
    - description: List of performance requirements
      key: performance_requirements
      type: List[str]
    prd:
      conceptual_info: Plans test scope by identifying high-level objectives, core
        functionality requirements, edge cases, and performance requirements.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Ensure secure authentication', 'Verify data import/export
            functionality']
          - core_functionality_requirements = ['User authentication', 'Data import/export']
          - edge_case_requirements = ['Edge case 1', 'Edge case 2']
          - performance_requirements = ['High performance', 'Low latency']
          - plan_test_scope(test_objectives, core_functionality_requirements, edge_case_requirements,
            performance_requirements)
          output: '{''test_objectives'': [''Ensure secure authentication'', ''Verify
            data import/export functionality''], ''core_functionality_requirements'':
            [''User authentication'', ''Data import/export''], ''edge_case_requirements'':
            [''Edge case 1'', ''Edge case 2''], ''performance_requirements'': [''High
            performance'', ''Low latency'']}'
        parameters:
        - description: List of high-level test objectives
          name: test_objectives
          type: List[str]
        - description: List of core functionality requirements
          name: core_functionality_requirements
          type: List[str]
        - description: List of edge case requirements
          name: edge_case_requirements
          type: List[str]
        - description: List of performance requirements
          name: performance_requirements
          type: List[str]
        raises:
        - description: If the input test objectives are invalid or incomplete.
          type: ValueError
        returns:
          description: A dictionary containing the planned test scope objectives
          type: dict
        summary: Defines test objectives and coverage requirements based on the given
          prompt.
    prompt: List 3-5 high-level test objectives for the software under test. Include
      core functionality, edge cases, and performance requirements in bullet points.
  report_defects:
    agent: false
    description: Aggregate testing anomalies
    name: report_defects
    nodes_depended_on:
    - analyze_unit_test_results
    - analyze_integration_test_results
    - analyze_regression_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Type of test (unit/integration/regression)
      key: test_type
      type: str
    - description: Component information (if applicable)
      key: component_info
      type: str
    - description: Description of the defect
      key: description
      type: str
    - description: Severity level of the defect (e.g. high, medium, low)
      key: severity
      type: str
    - description: Steps to reproduce the defect
      key: reproduction_steps
      type: str
    prd:
      conceptual_info: Aggregate testing anomalies into a summary table.
      docstring:
        examples:
        - lines:
          - defects = report_defects(analyze_unit_test_results(), analyze_integration_test_results(),
            analyze_regression_test_results())
          - print(defects)
          output: '{''test_type'': ''unit'', ''component_info'': ''component1'', ''description'':
            ''test description'', ''severity'': ''high'', ''reproduction_steps'':
            ''reproduce steps''}'
        - lines:
          - defects = report_defects(analyze_unit_test_results(), analyze_integration_test_results(),
            analyze_regression_test_results())
          - print(defects)
          output: '{''test_type'': ''integration'', ''component_info'': ''component2'',
            ''description'': ''test description'', ''severity'': ''medium'', ''reproduction_steps'':
            ''reproduce steps''}'
        parameters: []
        raises: []
        returns:
          description: A tuple containing the test type, component information, description,
            severity, and reproduction steps of the defect.
          type: (str, str, str, str, str)
        summary: Create a defect summary table from the results of unit, integration,
          and regression testing.
    prompt: 'Create defect summary table with columns: Test Type | Component | Description
      | Severity | Reproduction Steps.'
  run_integration_tests:
    agent: false
    description: Execute component interaction tests
    name: run_integration_tests
    nodes_depended_on:
    - design_integration_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Logs of communication during each test scenario
      key: communication_logs
      type: List[str]
    - description: Validation outcomes for each interface per test step
      key: interface_validation_results
      type: List[str]
    - description: Identifiers for each executed test scenario
      key: test_scenario_ids
      type: List[str]
    prompt: 'Execute integration test scenarios and document: 1) Communication logs,
      2) Interface validation outcomes per test step.'
  run_regression_tests:
    agent: false
    description: Execute unchanged feature validation
    name: run_regression_tests
    nodes_depended_on:
    - design_regression_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of baseline vs actual results
      key: baseline_vs_actual_results
      type: List[str]
    - description: List of state drift indicators
      key: state_drift_indicators
      type: List[str]
    - description: List of performance metrics
      key: performance_metrics
      type: List[str]
    prd:
      conceptual_info: Execute regression scenarios and record baseline vs actual
        results, state drift indicators, and performance metrics.
      docstring:
        examples:
        - lines:
          - baseline_vs_actual_results, state_drift_indicators, performance_metrics
            = run_regression_tests()
          - print(baseline_vs_actual_results)
          - print(state_drift_indicators)
          - print(performance_metrics)
          output: '[''baseline vs actual result 1'', ''baseline vs actual result 2'',
            ''baseline vs actual result 3'']

            [''state drift indicator 1'', ''state drift indicator 2'', ''state drift
            indicator 3'']

            [''performance metric 1'', ''performance metric 2'', ''performance metric
            3'']'
        parameters: []
        raises: []
        returns:
          description: Dictionary of baseline vs actual results, state drift indicators,
            and performance metrics
          type: Dict[str, List[str]]
        summary: Execute regression scenarios and record baseline vs actual results,
          state drift indicators, and performance metrics.
    prompt: 'Execute regression scenarios and record: 1) Baseline vs actual results,
      2) State drift indicators, 3) Performance metrics.'
  run_unit_tests:
    agent: false
    description: Execute module-level test cases.
    name: run_unit_tests
    nodes_depended_on:
    - design_unit_test_cases
    - setup_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Pass/fail status of each test case
      key: test_execution_status
      type: bool
    - description: Difference between actual and expected output of each test case
      key: actual_output_vs_expected_output
      type: str
    - description: Timestamps for each test execution
      key: test_case_timestamps
      type: str
    prd:
      conceptual_info: The node executes unit test cases, logging pass/fail status,
        actual vs expected output, and timestamp for each test execution.
      docstring:
        examples:
        - lines:
          - test_cases = ['test_1', 'test_2', 'test_3']
          - 'test_environment = {''hardware'': ''GPU'', ''software'': ''CUDA''}'
          - result = run_unit_tests(unit_test_cases=test_cases, test_environment=test_environment)
          - print(result)
          output: '{''test_execution_status'': {''test_1'': True, ''test_2'': False,
            ''test_3'': True}, ''actual_output_vs_expected_output'': {''test_1'':
            ''passed'', ''test_2'': ''failed'', ''test_3'': ''passed''}, ''test_case_timestamps'':
            [''2023-12-01 10:00:00'', ''2023-12-01 10:05:00'', ''2023-12-01 10:10:00'']}'
        parameters:
        - description: Input list of unit test cases to be executed.
          name: unit_test_cases
          type: list
        - description: Input dictionary of test environment required for unit test
            execution.
          name: test_environment
          type: dict
        raises:
        - description: Raised when unit test execution fails or test environment setup
            fails.
          type: Error
        returns:
          description: The result dictionary includes test execution status, actual
            output vs expected output, and timestamp for each test case.
          type: dict
        summary: Execute and record the result of unit test cases with pass/fail status,
          actual output vs expected output, and timestamp.
    prompt: 'Execute unit test cases and record: 1) Pass/fail status, 2) Actual output
      vs expected output, 3) Timestamp per test execution.'
  setup_test_environment:
    agent: false
    description: Prepare testing infrastructure and dependencies
    name: setup_test_environment
    nodes_depended_on:
    - plan_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of hardware specifications required for testing
      key: hardware_specs
      type: List[str]
    - description: List of software specifications required for testing
      key: software_specs
      type: List[str]
    - description: List of test data sets required for testing
      key: test_data_sets
      type: List[str]
    - description: List of mock services required for testing
      key: mock_services
      type: List[str]
    - description: Whether the test environment has been successfully set up
      key: environment_status
      type: bool
    prd:
      conceptual_info: This node prepares the testing infrastructure and dependencies
        by listing the required hardware, software, test data sets, mock services,
        and determining the environment status.
      docstring:
        examples:
        - lines:
          - def setup_test_environment(plan_test_scope={})
          - hardware_specs = plan_test_scope['hardware_specs']
          - software_specs = plan_test_scope['software_specs']
          - test_data_sets = plan_test_scope['test_data_sets']
          - mock_services = plan_test_scope['mock_services']
          - environment_status = plan_test_scope['environment_status']
          output: '{} {''hardware_specs'': [''spec1'', ''spec2''], ''software_specs'':
            [''spec3'', ''spec4''], ''test_data_sets'': [''test1'', ''test2''], ''mock_services'':
            [''mock1'', ''mock2''], ''environment_status'': True}'
        parameters:
        - description: Input from the plan_test_scope node, which defines test objectives
            and coverage requirements
          name: plan_test_scope
          type: dict
        raises:
        - description: If the input plan_test_scope is not of type dict
          type: TypeError
        returns:
          description: A dictionary containing the hardware specifications, software
            specifications, test data sets, mock services, and environment status
          type: dict
        summary: Prepare testing infrastructure and dependencies
    prompt: 'List 3-5 environment requirements: hardware/software specs, test data
      sets, mock services needed for testing.'
  sign_off_test_cycle:
    agent: false
    description: Final quality validation status
    name: sign_off_test_cycle
    nodes_depended_on:
    - generate_test_report
    nodes_dependent_on: []
    output_structure:
    - description: Validation status of the test cycle
      key: validation_status
      type: str
    - description: Residual risk acceptance statement from the product owner
      key: residual_risk_acceptance_statement
      type: str
    - description: Validation status of the test cycle as signed off by the QA lead
      key: qa_lead_validation_status
      type: str
    - description: List of completion metrics for the test cycle, such as pass/fail
        counts, defect density, and risk assessment rating
      key: test_cycle_completion_metrics
      type: List[str]
    prompt: 'Confirm test cycle completion with: 1) Approved sign-off by QA lead,
      2) Residual risk acceptance statement from product owner.'
