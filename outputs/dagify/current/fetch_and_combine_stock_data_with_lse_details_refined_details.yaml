dag_type: plain_text
description: Generated workflow from UI.
name: fetch_and_combine_stock_data_with_lse_details_refined
nodes:
  construct_lse_api_request:
    agent: false
    description: Builds a robust, protocol‑optimized HTTP/2 request to the LSE API,
      embedding all necessary query parameters, headers, authentication, latency considerations,
      and datacenter routing logic to fetch historical or real‑time quote data for
      the identified stock symbols.
    name: construct_lse_api_request
    nodes_depended_on:
    - identify_lse_stocks
    nodes_dependent_on: []
    prompt: "Construct a fully-qualified HTTPS request to the London Stock Exchange\
      \ (LSE) API for the stock symbols provided by the previous step. Include the\
      \ following components:\n1. **Endpoint**: `https://api.londonstockexchange.com/v1/quotes`.\n\
      2. **Query parameters**:\n   - `symbols` – comma‑separated list of ticker symbols.\n\
      \   - `frequency` – desired data frequency (`daily`, `weekly`, `monthly`).\n\
      \   - `start_date` and `end_date` – ISO‑8601 formatted dates defining the time\
      \ window.\n3. **Headers**:\n   - `Accept: application/json`.\n   - `User-Agent:\
      \ LSEDataFetcher/1.0`.\n4. **Authentication**: Attach a Bearer token supplied\
      \ by the environment.\n5. **Protocol details**:\n   - Use HTTP/2 over TLS 1.3\
      \ for maximum throughput.\n   - Enable HSTS with `Strict-Transport-Security:\
      \ max-age=63072000; includeSubDomains`.\n6. **Latency expectations**:\n   -\
      \ Expected round‑trip latency per request: 120 ms ± 30 ms when routed through\
      \ the EU‑Central datacenter.\n7. **Datacenter routing**:\n   - Default to the\
      \ EU‑Central datacenter (`dc-eu-central.lse.com`).\n   - Provide an alternative\
      \ route to the US‑West datacenter (`dc-us-west.lse.com`) with a higher latency\
      \ of 240 ms ± 45 ms, useful if the primary is unreachable.\n8. **Retry logic**:\n\
      \   - On HTTP 5xx or network failures, retry up to 3 times with exponential\
      \ back‑off (initial 200 ms, doubling each retry).\nGenerate the final URL and\
      \ a JSON payload representing the request configuration ready for dispatch by\
      \ the next node."
  construct_nasdaq_api_request:
    agent: false
    description: Builds a secure, protocol‑compliant HTTP(S) request to the NASDAQ
      public API for real‑time stock data, embedding authentication, field selection,
      and latency considerations. The generated request includes explicit TLS settings,
      HSTS enforcement, retry logic, and datacenter targeting to guarantee low‑latency,
      highly available data retrieval.
    name: construct_nasdaq_api_request
    nodes_depended_on:
    - identify_nasdaq_stocks
    nodes_dependent_on: []
    prompt: "Using the list of stock symbols from the previous node, compose a fully-qualified\
      \ HTTPS GET request to the NASDAQ data service. Include:\n1. Base URL: `https://api.nasdaq.com/api/quotes`\n\
      2. Query parameters:\n   - `symbols` – comma‑separated symbols (e.g., `AAPL,MSFT`)\n\
      \   - `fields` – comma‑separated list of fields (e.g., `price,volume,change`)\n\
      \   - `format=json`\n3. Headers:\n   - `Accept: application/json`\n   - `User-Agent:\
      \ NASDAQDataFetcher/1.0`\n   - `X-Api-Key: <YOUR_KEY>`\n4. Protocol details:\n\
      \   - Use TLS 1.3 with cipher suite `TLS_AES_128_GCM_SHA256`.\n   - Enforce\
      \ HSTS with `max-age=31536000`.\n5. Latency expectations:\n   - Expected round‑trip\
      \ time per request: < 120 ms from primary US datacenter.\n   - Retry policy:\
      \ exponential backoff up to 3 attempts with a base delay of 200 ms.\n6. Data\
      \ center selection:\n   - Primary: `us-east-1` (Virginia)\n   - Secondary: `us-west-2`\
      \ (Oregon)\n   - Tertiary: `eu-central-1` (Frankfurt) for cross‑border compliance.\n\
      Construct the request string and provide a JSON object with the full URL, headers,\
      \ and expected latency range."
  construct_nyse_api_request:
    agent: false
    description: Constructs the API request for fetching NYSE stock data, incorporating
      identified stock symbols, API endpoint specifics, protocol level technical details,
      latency considerations, and available data centers to ensure efficient and reliable
      data retrieval.
    name: construct_nyse_api_request
    nodes_depended_on:
    - identify_nyse_stocks
    nodes_dependent_on: []
    prompt: Construct a RESTful API request for fetching NYSE stock data via HTTPS
      protocol, using the identified stock symbols, with an expected latency of 50-100
      ms, and available data centers in New York (NY4), Chicago (CH1), and London
      (LD4). The API endpoint should support JSON data format, implement rate limiting
      with a burst capacity of 100 requests per second, and provide failover mechanisms
      to handle temporary service disruptions. The request should include query parameters
      for stock symbols, date range, and data frequency, such as 1-minute or daily
      bars, and may utilize optional parameters for filtering and sorting. Specify
      the User-Agent header, API key authentication, and TLS 1.2 encryption with SHA-256
      certificate hashing to ensure secure data transmission. Provide a comprehensive
      set of error handling mechanisms, including retry logic with exponential backoff,
      to mitigate potential connection issues and API rate limiting errors.
  construct_toronto_stock_exchange_api_request:
    agent: false
    description: Constructs a technically sophisticated API request for retrieving
      data from the Toronto Stock Exchange, incorporating essential parameters such
      as API endpoints, data feed specifications, latency requirements, and API key
      authentication, to facilitate efficient and secure data acquisition for the
      specified stock symbols.
    name: construct_toronto_stock_exchange_api_request
    nodes_depended_on:
    - identify_toronto_stock_exchange_stocks
    nodes_dependent_on: []
    prompt: Construct a secure, RESTful API request to the Toronto Stock Exchange
      (TSE) for fetching real-time and historical stock data, utilizing the HTTPS
      protocol with TLS 1.2 encryption and specifying the API endpoint as https://www.tmx.com/rs/api/
      with a latency of less than 50ms, supporting data feeds from data centers located
      in Toronto, New York, and London. Ensure the request includes the stock symbols
      identified in the previous step, utilizes gzip compression for efficient data
      transfer, and adheres to the TSE's API usage guidelines with a maximum of 100
      requests per second. Specify the API request headers, including 'Accept' as
      'application/json', 'Content-Type' as 'application/json', and 'Authorization'
      with a valid API key. The request body should be formatted in JSON, containing
      the stock symbols and any additional required parameters, such as time intervals
      and data formats.
  fetch_lse_stock_data:
    agent: false
    description: Initiates a secured, HTTPS-based data fetch operation from the London
      Stock Exchange (LSE) via a meticulously constructed API request, incorporating
      detailed parameters for stock symbols, data frequency, and time range, while
      ensuring robust error handling and exception management to guarantee data integrity
      and consistency, across multiple datacenters in London, New York, and Singapore
      with latency averaging 50ms, 100ms, and 120ms respectively.
    name: fetch_lse_stock_data
    nodes_depended_on:
    - construct_lse_api_request
    nodes_dependent_on: []
    prompt: 'Fetch the stock data from the LSE using the previously constructed API
      request, handling errors and exceptions through retry mechanisms with exponential
      backoff, logging anomalous responses, and implementing circuit breakers to prevent
      cascading failures. Ensure compliance with LSE''s API usage policies andrate
      limits. Utilize available data feeds from primary datacenters in London (latency:
      50ms), New York (latency: 100ms), and Singapore (latency: 120ms), and gracefully
      switch between them based on real-time latency and availability metrics. Leverage
      HTTP/2 for multiplexed, concurrent data transfers and TLS 1.3 for enhanced security
      and encryption.'
  fetch_nasdaq_stock_data:
    agent: false
    description: Retrieves the stock data from the NASDAQ exchange through a technically
      sophisticated API request, incorporating multiple protocol layers, latency considerations,
      and datacenter redundancy to ensure high availability and reliability of the
      retrieved data, supporting real-time and historical data feeds with varying
      latency and throughput characteristics.
    name: fetch_nasdaq_stock_data
    nodes_depended_on:
    - construct_nasdaq_api_request
    nodes_dependent_on: []
    prompt: Fetch the stock data from the NASDAQ using the constructed API request
      over HTTPS, with a timeout of 5 seconds and retry mechanism for handling 500-level
      server errors, incorporating technical details such as API endpoint URIs, query
      parameters for specifying stock symbols and date ranges, HTTP headers for authentication
      and rate limiting, and support for multiple data feeds from NASDAQ's primary
      datacenters in Carteret, New Jersey, and secondary datacenters in Chicago, Illinois,
      and London, United Kingdom, with a latency of 10-50 milliseconds for real-time
      data and 100-500 milliseconds for historical data, providing additional metadata
      on data feed availability, server response times, and any error messages encountered
      during the request.
  fetch_nyse_stock_data:
    agent: false
    description: Executes the authenticated HTTP request to the NYSE data feed, retrieves
      the latest market snapshot for the specified symbols, measures network latency,
      records the data center source, and returns a clean, structured dataset ready
      for analytical processing.
    name: fetch_nyse_stock_data
    nodes_depended_on:
    - construct_nyse_api_request
    nodes_dependent_on: []
    prompt: 'Using the API request constructed by `construct_nyse_api_request`, send
      an HTTPS GET to the NYSE data feed endpoint with the appropriate `Authorization`
      bearer token and `Accept: application/json`. Retrieve the response payload,
      handling HTTP status codes 200‑206 for success and implementing exponential
      back‑off for 429 and 5xx errors. Parse the JSON, extract the fields: `symbol`,
      `timestamp`, `open`, `high`, `low`, `close`, `volume`, and `adjusted_close`.
      Log request latency (in milliseconds) and data center region (e.g., US‑East‑Coast,
      US‑West‑Coast) from the `x-datacenter-location` header. Store the parsed records
      in a structured format (e.g., Pandas DataFrame or Parquet) for downstream analysis.'
  fetch_toronto_stock_exchange_stock_data:
    agent: false
    description: Retrieves real‑time stock price and volume data for the identified
      Toronto Stock Exchange securities. The node performs a secure HTTPS request
      to the TSE API, handling authentication, failover between primary and secondary
      data centers, and ensuring low‑latency delivery. It validates the response schema,
      logs errors, and emits a clean JSON payload for downstream analytics.
    name: fetch_toronto_stock_exchange_stock_data
    nodes_depended_on:
    - construct_toronto_stock_exchange_api_request
    nodes_dependent_on: []
    prompt: 'Using the fully constructed API request, perform a HTTPS GET to the Toronto
      Stock Exchange data service at `https://api.tse.ca/v1/quotes` with the specified
      query parameters and authentication headers. Ensure the request includes a `User-Agent:
      DataPipeline/1.0` and a `Cache-Control: no-cache`. Execute the call against
      the primary data center located in Toronto (Canada Central) with an expected
      round‑trip latency of 80–120 ms; if a failover is required, automatically redirect
      to the secondary data center in London (EU West) with a 120–160 ms latency.
      Capture the JSON response, validate the schema against the TSE public spec,
      and return the payload as a parsed JSON object. Log any HTTP status codes outside
      the 2xx range and retry up to two times with exponential backoff (initial delay
      200 ms, multiplier 2).'
  identify_lse_stocks:
    agent: false
    description: Generates a comprehensive, protocol‑aware catalogue of London Stock
      Exchange (LSE) equities to be queried. The output includes precise data‑feed
      details—protocol, latency expectations, and geographically proximate data‑centre
      information—to enable downstream nodes to select the optimal ingestion pathway
      and satisfy strict performance SLAs.
    name: identify_lse_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "Retrieve the list of LSE stock symbols to be fetched. For each symbol,\
      \ specify:\n1. The primary market code (e.g., \"LON\") and ticker.\n2. The preferred\
      \ data feed protocol (e.g., FIX, REST, WebSocket). \n3. Expected latency window\
      \ (ms) for real‑time quotes and end‑of‑day snapshots.\n4. The nearest data centre\
      \ location (e.g., \"London‑West\", \"London‑East\").\n5. Optional: the subscription\
      \ tier required (e.g., Tier 1, Tier 2, Tier 3).\nEnsure the output is a JSON\
      \ array where each element contains the keys: `symbol`, `market`, `protocol`,\
      \ `latency_ms`, `datacenter`, `tier`."
  identify_nasdaq_stocks:
    agent: false
    description: Selects a curated set of NASDAQ-listed equities for data retrieval,
      specifying for each the optimal data feed protocol, expected latency, and preferred
      datacenter location. This node equips downstream analytics with precise, low‑latency
      access to both historical and real‑time market data while respecting feed‑specific
      authentication and rate‑limit policies.
    name: identify_nasdaq_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a comma‑separated list of the NASDAQ stock symbols that should
      be retrieved. For each symbol, include:

      - The primary data feed protocol to use (e.g., Bloomberg API v4, Refinitiv Eikon
      REST, IEX Cloud, Nasdaq TotalView 2.0)

      - The expected round‑trip latency (in milliseconds) for historical price data
      and for real‑time tick updates

      - The nearest available data center or region (e.g., US‑East‑Coast, EU‑London,
      APAC‑Tokyo) that offers the lowest latency for each feed

      - Any protocol‑specific authentication or rate‑limit constraints that must be
      respected


      Return the information in a structured JSON array where each element has the
      keys: "symbol", "feed", "latency_ms", "datacenter", and "constraints". Ensure
      the list is concise (no more than 20 symbols) and prioritizes high‑volume, high‑liquidity
      stocks suitable for intraday analytics.'
  identify_nyse_stocks:
    agent: false
    description: Retrieves the comprehensive, real‑time list of NYSE equities by querying
      the NYSE public data feed via HTTPS/2 with TLS 1.3, handling pagination, authentication,
      and rate‑limit retries. The node captures per‑request latency, identifies the
      serving data center, and outputs a clean JSON array of symbols along with company
      names and listing dates for downstream analysis.
    name: identify_nyse_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Query the NYSE market data API to enumerate all active equities for the
      current trading day. Request the list using the HTTPS/2 protocol with TLS 1.3
      encryption, specifying a `Content-Type: application/json` header and a `Accept:
      application/json` header. Ensure the request includes a `User-Agent: NYSE-DataClient/1.0`
      string and an `X-API-Token` authentication header. The API endpoint `https://api.nyse.com/v1/market/equities`
      supports pagination; retrieve all pages by following the `Link` header `rel="next"`.
      For each equity, extract the `symbol`, `companyName`, and `listingDate` fields.
      Return a JSON array where each element is a JSON object containing these three
      keys. The response should be retrieved with a timeout of 5 seconds per request,
      and the client must retry up to 3 times on HTTP 429 or 5xx responses with exponential
      backoff. Additionally, provide the latency in milliseconds for each request
      and indicate the data center region (`us-east-1`, `us-west-2`, or `eu-central-1`)
      from which the data was served, as reported in the `X-DataCenter-Location` header.
      If any symbol cannot be fetched after retries, log the symbol and error code
      but continue processing the remaining symbols.'
  identify_toronto_stock_exchange_stocks:
    agent: false
    description: Compiles a comprehensive, protocol‑aware catalog of active Toronto
      Stock Exchange equities for automated data ingestion. The node specifies each
      ticker’s sector, market‑cap classification, optimal data‑feed protocol with
      associated latency expectations, and the primary data‑center location to enable
      latency‑optimized routing and high‑availability strategies.
    name: identify_toronto_stock_exchange_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "Generate a curated list of Toronto Stock Exchange (TSE) equities for\
      \ downstream data acquisition, including:\n\n1. **Ticker Symbol** – 4‑letter\
      \ code.\n2. **Company Name** – Full legal name.\n3. **Sector & Industry** –\
      \ Standard Global Industry Classification.\n4. **Market Cap Tier** – Large,\
      \ Mid, or Small cap.\n5. **Preferred Data Feed Protocol** – WebSocket, REST,\
      \ or FIX, with associated **expected latency** (e.g., WebSocket ~20 ms, REST\
      \ ~200 ms, FIX ~5 ms). \n6. **Primary Data Center** – e.g., Toronto (ON‑1),\
      \ New York (NY‑2), Frankfurt (DE‑3) – to inform routing and redundancy.\n\n\
      Output the information in a single JSON array, each element containing the fields\
      \ listed above. Ensure the list is sorted alphabetically by ticker and excludes\
      \ any delisted or inactive securities.\n\nExample element:\n```json\n{\n  \"\
      ticker\": \"RY\",\n  \"company\": \"Royal Bank of Canada\",\n  \"sector\": \"\
      Financials\",\n  \"industry\": \"Banking\",\n  \"market_cap_tier\": \"Large\"\
      ,\n  \"feed_protocol\": \"WebSocket\",\n  \"latency_ms\": 20,\n  \"data_center\"\
      : \"Toronto\"\n}\n```\n"
  normalize_combined_stock_data:
    agent: false
    description: Performs protocol‑level alignment, missing‑value handling, consistency
      validation, latency annotation, and datacenter tagging on the consolidated multi‑exchange
      stock dataset to produce a clean, uniformly formatted, and traceable Parquet
      archive ready for downstream analytics and model training.
    name: normalize_combined_stock_data
    nodes_depended_on:
    - store_combined_stock_data
    nodes_dependent_on: []
    prompt: "Normalize the unified stock dataset obtained from `store_combined_stock_data`.\
      \ The dataset consolidates tick‑level feeds from LSE, NASDAQ, NYSE, and Toronto\
      \ Stock Exchange. Perform the following steps:\n\n1. **Protocol Alignment**\
      \ – Convert all timestamps to UTC, enforce ISO‑8601 format, and reconcile time‑zone\
      \ offsets using the exchange’s official time‑zone metadata.\n2. **Missing‑Value\
      \ Imputation** – Apply exchange‑specific imputation strategies: forward‑fill\
      \ for intra‑day price series, linear interpolation for cross‑exchange arbitrage\
      \ gaps, and mean‑substitution for low‑frequency fundamental fields.\n3. **Data\
      \ Consistency Checks** – Validate price bounds, trade‑volume sanity, and symbol‑to‑ticker\
      \ mapping consistency. Flag and discard entries violating ±3σ bounds.\n4. **Latency\
      \ Annotation** – Append a `ingest_latency_ms` field capturing the round‑trip\
      \ delay from feed reception to storage, sampled from a 5‑second moving window\
      \ per exchange.\n5. **Datacenter Tagging** – Tag each record with `storage_datacenter`\
      \ (e.g., \"us-east‑1\", \"eu-west-2\") based on the region where `store_combined_stock_data`\
      \ persisted the data.\n6. **Output Schema** – Return a Parquet file with the\
      \ following columns:\n   - `exchange_id`, `symbol`, `timestamp_utc`, `price`,\
      \ `volume`, `ingest_latency_ms`, `storage_datacenter`, `normalized_flag`.\n\n\
      Ensure the output schema and field names match those expected by downstream\
      \ analytical and modeling pipelines."
  parse_lse_stock_data:
    agent: false
    description: Transforms raw LSE stock data fetched via HTTPS into a sanitized,
      schema‑validated Pandas DataFrame, enriching the output with protocol, latency,
      and datacenter provenance for downstream analytics and SLA monitoring.
    name: parse_lse_stock_data
    nodes_depended_on:
    - fetch_lse_stock_data
    nodes_dependent_on: []
    prompt: "Parse the raw CSV/JSON payload returned by the LSE API into a clean,\
      \ normalized Pandas DataFrame. \n\n1. **Protocol Verification**: Ensure the\
      \ payload was retrieved over HTTPS/TLS 1.3 and validate the API’s X‑509 certificate\
      \ chain against the LSE’s trusted root store. Log any mismatches.\n2. **Latency\
      \ Accounting**: Record the round‑trip latency (ms) captured during `fetch_lse_stock_data`.\
      \ Flag responses exceeding 200 ms for downstream SLA monitoring.\n3. **Data‑Center\
      \ Mapping**: Cross‑reference the response header `x-datacenter-id` with the\
      \ LSE data‑center registry (e.g., `DC‑01: London‑Central`, `DC‑02: Frankfurt‑East`).\
      \ Include the datacenter tag in the output for provenance.\n4. **Cleaning &\
      \ Normalization**:\n   - Strip leading/trailing whitespace from string columns.\n\
      \   - Convert numeric strings to appropriate dtypes, coercing errors to NaN.\n\
      \   - Standardize date formats to ISO 8601 UTC.\n   - Impute missing price fields\
      \ using forward‑fill; if a full row is missing critical identifiers (symbol,\
      \ date), drop the row with a warning.\n5. **Schema Enforcement**: Validate that\
      \ the DataFrame conforms to the expected schema (`symbol`, `date`, `open`, `high`,\
      \ `low`, `close`, `volume`) and raise a descriptive error if columns are missing\
      \ or mis‑typed.\n6. **Output**: Return a dictionary containing:\n   - `data`:\
      \ the cleaned DataFrame\n   - `metadata`: `{request_latency_ms, datacenter_id,\
      \ protocol_version}`\n\nProvide the function signature and a concise code example\
      \ demonstrating the transformation.\n"
  parse_nasdaq_stock_data:
    agent: false
    description: Converts raw NASDAQ API responses into a clean, structured dataset.
      Handles protocol‑level details such as datacenter origin, fetch latency, and
      parse timing, while ensuring data integrity and compliance with the feed’s latency
      SLAs.
    name: parse_nasdaq_stock_data
    nodes_depended_on:
    - fetch_nasdaq_stock_data
    nodes_dependent_on: []
    prompt: 'Parse the raw NASDAQ JSON payload returned by the API into a normalized,
      query‑ready table. The input will include a timestamped, multi‑asset bundle
      from a specific datacenter (US‑East or US‑West). For each record, extract the
      fields: `symbol`, `date`, `open`, `high`, `low`, `close`, `volume`, `adjusted_close`,
      and `market_cap`. Convert all numeric fields to IEEE 754 doubles, ensure dates
      are ISO‑8601 UTC, and flag any missing or NaN values with a sentinel `NULL`.
      Output a JSON array where each element is a flat object keyed by these columns,
      and include metadata: `source_datacenter`, `fetch_latency_ms`, and `parse_duration_ms`.
      The parsing must honor the latency constraints specified by the datafeed: 100 ms
      per 1 kB chunk, with an upper bound of 5 s per full payload. If the payload
      exceeds 10 MB, split it into paginated segments and process each sequentially,
      aggregating the results into the final array.'
  parse_nyse_stock_data:
    agent: false
    description: Transforms raw NYSE stock data retrieved over HTTPS into a normalized,
      time‑stamped JSON structure, incorporating latency metrics, datacenter provenance,
      and rigorous validation to ensure downstream consistency.
    name: parse_nyse_stock_data
    nodes_depended_on:
    - fetch_nyse_stock_data
    nodes_dependent_on: []
    prompt: "Parse the fetched NYSE stock data into a clean, query‑friendly schema:\n\
      \n1. **Protocol details** – Assume the data arrives over HTTPS via the NYSE’s\
      \ public API using JSON‑lines format with `application/json` content‑type.\n\
      2. **Latency handling** – The raw payload may contain up to 200 ms of network\
      \ latency; implement a timeout of 5 s and retry logic with exponential back‑off\
      \ (max 3 attempts). \n3. **Datacenter mapping** – NYSE data is replicated across\
      \ two primary datacenters: **New York (US‑East‑1)** and **London (EU‑West‑2)**.\
      \ Select the nearest datacenter based on the client’s IP location and record\
      \ the chosen region in the output metadata.\n4. **Output structure** – Emit\
      \ a JSON object with the following keys:\n   * `timestamp` – ISO‑8601 UTC of\
      \ record ingestion.\n   * `exchange` – \"NYSE\".\n   * `symbol` – ticker symbol.\n\
      \   * `price` – last traded price (float).\n   * `volume` – total traded volume\
      \ (integer).\n   * `metadata` – object containing `latency_ms`, `datacenter`,\
      \ and `source_url`.\n5. **Validation** – Verify that all numeric fields are\
      \ non‑negative and that `timestamp` is within ±30 seconds of the current system\
      \ time. Flag and discard any malformed records.\n6. **Return** – A list of validated,\
      \ structured records ready for downstream analytics or storage."
  parse_toronto_stock_exchange_stock_data:
    agent: false
    description: Transforms the raw JSON stock feed from the Toronto Stock Exchange
      into a rigorously validated, high‑precision time‑series DataFrame, enriching
      it with latency and datacenter provenance metadata for auditability and downstream
      analytics.
    name: parse_toronto_stock_exchange_stock_data
    nodes_depended_on:
    - fetch_toronto_stock_exchange_stock_data
    nodes_dependent_on: []
    prompt: 'Parse the raw JSON payload returned from the Toronto Stock Exchange API
      into a canonical, time‑series DataFrame with the following schema:


      1. **Ticker** (string) – Ticker symbol.

      2. **Timestamp** (ISO 8601 UTC) – Exact trade timestamp.

      3. **Open** (float) – Opening price.

      4. **High** (float) – Highest price during the interval.

      5. **Low** (float) – Lowest price during the interval.

      6. **Close** (float) – Closing price.

      7. **Volume** (integer) – Traded volume.

      8. **Adjusted Close** (float) – Adjusted close for splits/dividends.


      The parser must:

      - Validate the presence of all required fields and discard rows with missing
      or NaN values.

      - Convert numeric fields to high‑precision `Decimal` to avoid floating‑point
      drift.

      - Ensure timestamps are coerced to UTC and sorted ascending.

      - Detect and flag anomalies where price jumps exceed 10× the previous day’s
      range, logging them for downstream risk checks.

      - Output a Pandas DataFrame, serialized as a parquet file (`{ticker}_data.parquet`)
      stored in the designated data lake, with a partition key on `Ticker`.


      Additionally, annotate the output with metadata:

      - **Source**: `https://api.torontostockexchange.com/v1/quotes`.

      - **Request Latency**: Report the round‑trip time recorded by the fetch node
      (in milliseconds).

      - **Datacenter**: Indicate the originating CDN edge (e.g., `toronto-east`, `toronto-west`).


      If the fetch node reports a latency > 200 ms or an error code, the parser should
      emit a warning but continue processing the available payload. The final artifact
      must be consumable by downstream analytics nodes without further transformation.

      '
  repartition_combined_stock_data:
    agent: false
    description: Reorganizes the normalized stock dataset into an efficient, distributed
      partition layout that matches the chosen storage engine’s key strategy. The
      node orchestrates protocol‑aware data ingestion, enforces low‑latency guarantees
      per data source, and aligns partitions with datacenter geography to reduce cross‑region
      costs and improve query performance.
    name: repartition_combined_stock_data
    nodes_depended_on:
    - normalize_combined_stock_data
    nodes_dependent_on: []
    prompt: Repartition the normalized combined stock dataset across the distributed
      storage fabric to optimize query latency and ingestion throughput. For each
      data feed, explicitly specify the transport protocol (e.g., Kafka, Pulsar, or
      Amazon Kinesis), the target ingestion latency (≤ 200 ms for real‑time feeds,
