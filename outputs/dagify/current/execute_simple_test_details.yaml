dag_type: plain_text
description: A workflow that prepares a test environment, runs a test, analyzes the
  outcome, and produces a concise report.
name: execute_simple_test
nodes:
  analyze_test_result:
    agent: false
    description: Analyzes the test outcome against expected results.
    name: analyze_test_result
    nodes_depended_on:
    - capture_test_output
    nodes_dependent_on:
    - generate_test_report
    prompt: Compare the captured output against the defined success criteria. Determine
      whether the test passed or failed and note any discrepancies.
  capture_test_output:
    agent: false
    description: Formats and stores the raw test output for analysis.
    name: capture_test_output
    nodes_depended_on:
    - run_test
    nodes_dependent_on:
    - analyze_test_result
    prompt: 'Collect the raw output from the test execution and format it as a JSON
      object with keys: `output`, `timestamp`, and `status`.'
  define_test_conditions:
    agent: false
    description: Creates a clear set of test conditions for the upcoming test.
    name: define_test_conditions
    nodes_depended_on: []
    nodes_dependent_on:
    - prepare_test_environment
    - run_test
    prompt: Specify the test conditions including input data, expected output, and
      success criteria. List each condition as a bullet point.
  generate_test_report:
    agent: false
    description: Produces the final test report.
    name: generate_test_report
    nodes_depended_on:
    - analyze_test_result
    nodes_dependent_on: []
    prompt: Create a concise test report that includes the test name, pass/fail status,
      key metrics, and any notable observations. Format as a markdown section.
  prepare_test_environment:
    agent: false
    description: Prepares the environment required to run the test.
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on:
    - run_test
    prompt: 'Set up the required environment for the test: install necessary software,
      configure settings, and ensure resources are available. Provide a checklist
      of completed actions.'
  run_test:
    agent: false
    description: Runs the test and captures the raw output.
    name: run_test
    nodes_depended_on:
    - define_test_conditions
    - prepare_test_environment
    nodes_dependent_on:
    - capture_test_output
    prompt: Execute the test using the prepared environment and defined conditions.
      Record the raw output data.
