dag_type: plain_text
description: A workflow for a B2B SaaS company to manage advertisement buys for shoes,
  from initial lead generation to campaign execution and analysis.
name: b2b_saas_advertisement_pipeline
nodes:
  analyze_advertisement_results:
    agent: false
    description: Analyze the results of the advertisement campaign
    name: analyze_advertisement_results
    nodes_depended_on:
    - monitor_advertisement_performance
    nodes_dependent_on: []
    prompt: Analyze the results of the advertisement campaign, identifying areas for
      improvement and opportunities for optimization.
  create_advertisement_content:
    agent: false
    description: Create advertisement content for shoe buys
    name: create_advertisement_content
    nodes_depended_on:
    - define_target_audience
    - research_advertisement_platforms
    nodes_dependent_on: []
    prompt: Create a set of advertisement content for shoe buys, including ad copy,
      images, and videos, based on the defined target audience and researched advertisement
      platforms.
  define_target_audience:
    agent: false
    description: Define the target audience for shoe advertisement buys
    name: define_target_audience
    nodes_depended_on:
    - generate_lead_list
    nodes_dependent_on: []
    prompt: Define the target audience for shoe advertisement buys, including demographics,
      interests, and behaviors, based on the generated lead list.
  generate_lead_list:
    agent: false
    description: Create a list of potential leads for shoe advertisement buys
    name: generate_lead_list
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate a list of 100 potential leads for shoe advertisement buys, including
      company name, contact email, and job title.
  launch_advertisement_campaign:
    agent: false
    description: Launch the advertisement campaign for shoe buys
    name: launch_advertisement_campaign
    nodes_depended_on:
    - create_advertisement_content
    - set_advertisement_budget
    nodes_dependent_on: []
    prompt: Launch the advertisement campaign for shoe buys, using the created advertisement
      content and allocated budget.
  monitor_advertisement_performance:
    agent: false
    description: Monitor the performance of the advertisement campaign
    name: monitor_advertisement_performance
    nodes_depended_on:
    - launch_advertisement_campaign
    nodes_dependent_on: []
    prompt: Monitor the performance of the advertisement campaign, tracking metrics
      such as click-through rate, conversion rate, and return on ad spend.
  optimize_advertisement_campaign:
    agent: false
    description: Optimize the advertisement campaign for better performance
    name: optimize_advertisement_campaign
    nodes_depended_on:
    - analyze_advertisement_results
    nodes_dependent_on: []
    prompt: Optimize the advertisement campaign, adjusting targeting, ad creative,
      and budget allocation to improve performance and achieve better results.
  research_advertisement_platforms:
    agent: false
    description: Research available advertisement platforms for shoe buys
    name: research_advertisement_platforms
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Research and list 5 available advertisement platforms for shoe buys, including
      Google Ads, Facebook Ads, and Instagram Ads.
  set_advertisement_budget:
    agent: false
    description: Set a budget for shoe advertisement buys
    name: set_advertisement_budget
    nodes_depended_on:
    - research_advertisement_platforms
    nodes_dependent_on: []
    prompt: Set a budget of $10,000 for shoe advertisement buys, allocated across
      the researched advertisement platforms.
