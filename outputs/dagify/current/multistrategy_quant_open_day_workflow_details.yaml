dag_type: plain_text
description: A detailed, highly concurrent workflow for planning and executing an
  open day event at a multistrategy quant trading firm, covering agenda design, speaker
  coordination, venue and technology setup, marketing, registration, execution, and
  post‑event follow‑up.
name: multistrategy_quant_open_day_workflow
nodes:
  arrange_exhibit_boards:
    agent: false
    description: Plan exhibit board setup.
    name: arrange_exhibit_boards
    nodes_depended_on:
    - plan_venue_layout
    nodes_dependent_on:
    - design_exhibit_materials
    prompt: Determine the number and placement of exhibit boards for each strategy
      team. Provide a list of board titles and locations.
  assign_speakers_to_sessions:
    agent: false
    description: Allocate speakers to agenda sessions.
    name: assign_speakers_to_sessions
    nodes_depended_on:
    - create_agenda_structure
    nodes_dependent_on:
    - request_speaker_confirmations
    - prepare_speaker_materials
    prompt: 'Match each agenda session with an internal speaker from the relevant
      strategy team. Provide a list with columns: Session Title, Speaker Name, Team.'
  collect_speaker_biographies:
    agent: false
    description: Gather speaker bios.
    name: collect_speaker_biographies
    nodes_depended_on:
    - request_speaker_confirmations
    nodes_dependent_on:
    - compile_biography_list
    prompt: Ask each confirmed speaker to provide a 100‑word bio and headshot. Specify
      the submission deadline.
  compile_biography_list:
    agent: false
    description: Compile speaker information for program.
    name: compile_biography_list
    nodes_depended_on:
    - collect_speaker_biographies
    nodes_dependent_on:
    - populate_event_program
    prompt: 'Create a master list of speakers with their bios and headshots. Output
      in a markdown table with columns: Name, Team, Bio.'
  confirm_audio_visual_equipment:
    agent: false
    description: Validate AV equipment readiness.
    name: confirm_audio_visual_equipment
    nodes_depended_on:
    - set_up_presentation_gear
    nodes_dependent_on:
    - install_audio_visual_equipment
    prompt: Check that all listed equipment is available and functional. Report any
      missing items.
  coordinate_catering:
    agent: false
    description: Arrange catering logistics.
    name: coordinate_catering
    nodes_depended_on:
    - plan_venue_layout
    nodes_dependent_on:
    - finalize_catering_menu
    prompt: Identify the catering service needed for the event and draft a request
      for quote. Include attendee count, dietary requirements, and event time.
  create_agenda_structure:
    agent: false
    description: Develop the core event agenda.
    name: create_agenda_structure
    nodes_depended_on:
    - define_open_day_objectives
    - select_event_date_time
    nodes_dependent_on:
    - assign_speakers_to_sessions
    - plan_venue_layout
    - schedule_tech_rehearsal
    - draft_mailing_campaign
    prompt: 'Outline a session list with titles, durations, and target audiences for
      the open day, based on the objectives and date/time. Use a table with columns:
      Session Title, Duration (minutes), Target Audience.'
  define_open_day_objectives:
    agent: false
    description: Establish the high‑level objectives that will guide all subsequent
      planning.
    name: define_open_day_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - create_agenda_structure
    - select_event_date_time
    prompt: Specify the primary goals of the open day (e.g., brand awareness, lead
      generation, talent scouting) as a short bullet list. Do not include operational
      details.
  draft_mailing_campaign:
    agent: false
    description: Prepare email templates for invitation and follow‑up.
    name: draft_mailing_campaign
    nodes_depended_on:
    - create_agenda_structure
    nodes_dependent_on:
    - send_invitation_emails
    - post_event_survey
    prompt: Write an email invitation template and a follow‑up thank‑you template
      for attendees. Include placeholders for event details and RSVP link.
  install_audio_visual_equipment:
    agent: false
    description: Set up AV hardware physically.
    name: install_audio_visual_equipment
    nodes_depended_on:
    - confirm_audio_visual_equipment
    nodes_dependent_on:
    - verify_av_setup
    prompt: Deploy the AV equipment in the venue according to the layout plan. Note
      any adjustments needed.
  plan_venue_layout:
    agent: false
    description: Plan the spatial arrangement of the venue.
    name: plan_venue_layout
    nodes_depended_on:
    - create_agenda_structure
    nodes_dependent_on:
    - coordinate_catering
    - arrange_exhibit_boards
    prompt: 'Design the physical layout for the event: stage, breakout rooms, networking
      area, and exhibit boards. Provide a schematic description or list of zones with
      capacity.'
  prepare_speaker_materials:
    agent: false
    description: Provide speakers with a standardized material template.
    name: prepare_speaker_materials
    nodes_depended_on:
    - assign_speakers_to_sessions
    nodes_dependent_on:
    - review_speaker_slides
    prompt: Create a slide deck outline template for speakers, specifying required
      sections and time allocation. Provide it in markdown format.
  request_speaker_confirmations:
    agent: false
    description: Send confirmation requests to speakers.
    name: request_speaker_confirmations
    nodes_depended_on:
    - assign_speakers_to_sessions
    nodes_dependent_on:
    - collect_speaker_biographies
    prompt: Draft a confirmation email to each speaker with session details and ask
      for confirmation within 48 hours. Include a polite sign‑off.
  schedule_tech_rehearsal:
    agent: false
    description: Plan the technical rehearsal schedule.
    name: schedule_tech_rehearsal
    nodes_depended_on:
    - create_agenda_structure
    nodes_dependent_on:
    - set_up_presentation_gear
    - test_live_streaming
    prompt: 'Create a rehearsal timetable for all presenters, including tech check
      times. Use a table with columns: Time Slot, Speaker, Activity.'
  select_event_date_time:
    agent: false
    description: Determine the event schedule timing.
    name: select_event_date_time
    nodes_depended_on: []
    nodes_dependent_on:
    - create_agenda_structure
    prompt: Choose a date and time for the open day that maximizes attendee availability.
      Provide the date in ISO format and the time zone. Do not provide reasoning.
  set_up_presentation_gear:
    agent: false
    description: Prepare the technical gear list.
    name: set_up_presentation_gear
    nodes_depended_on:
    - schedule_tech_rehearsal
    nodes_dependent_on:
    - confirm_audio_visual_equipment
    prompt: List all hardware and software required for presentations (projectors,
      microphones, Zoom, etc.) and the responsible personnel for each.
  test_live_streaming:
    agent: false
    description: Verify live streaming capability.
    name: test_live_streaming
    nodes_depended_on:
    - schedule_tech_rehearsal
    nodes_dependent_on: []
    prompt: Perform a mock live stream of a short presentation. Log any connectivity
      or audio issues and recommend fixes.
  verify_av_setup:
    agent: false
    description: Confirm AV setup works during rehearsal.
    name: verify_av_setup
    nodes_depended_on:
    - install_audio_visual_equipment
    nodes_dependent_on:
    - schedule_tech_rehearsal
    prompt: Run a quick test of each AV system in place. Confirm speaker audio, presentation
      display, and live stream output.
