dag_type: plain_text
description: A minimal workflow defining elemental steps to perform a generic 'test'
  action by validating input, performing a simple operation, and reporting results.
name: elemental_test_workflow
nodes:
  generate_test_report:
    agent: false
    description: Create a concise report summarizing the test results.
    name: generate_test_report
    nodes_depended_on:
    - perform_test_operation
    nodes_dependent_on: []
    prompt: Summarize the test operation outcome in clear, concise language. Include
      status, any errors, and final result interpretation.
  perform_test_operation:
    agent: false
    description: Execute the core testing operation using the validated input.
    name: perform_test_operation
    nodes_depended_on:
    - validate_test_input
    nodes_dependent_on:
    - generate_test_report
    prompt: Perform the main test action using the valid input data. Produce a definitive
      outcome or result strictly based on the input without additional assumptions.
  receive_test_input:
    agent: false
    description: Receive or define the input data for the test.
    name: receive_test_input
    nodes_depended_on: []
    nodes_dependent_on:
    - validate_test_input
    prompt: Provide or specify the data or parameters that represent the input for
      the test. This input should be precise and self-contained.
  validate_test_input:
    agent: false
    description: Check that the test input data meets required format and criteria.
    name: validate_test_input
    nodes_depended_on:
    - receive_test_input
    nodes_dependent_on:
    - perform_test_operation
    prompt: Examine the provided test input data and confirm it satisfies the expected
      format and constraints. State 'valid' if successful or specify validation errors
      clearly.
