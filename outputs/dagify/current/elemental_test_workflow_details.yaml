dag_type: plain_text
description: A minimal workflow that performs and verifies a fundamental test action
  to validate test execution.
name: elemental_test_workflow
nodes:
  define_test_action:
    agent: false
    description: Define the specific test action to be performed, specifying the conditions
      and expected outcome.
    name: define_test_action
    nodes_depended_on: []
    nodes_dependent_on:
    - execute_test_action
    - prepare_test_environment
    prompt: Specify a clear and simple test action, with input parameters and the
      expected result. Describe only the test action without reasoning about test
      framework or environment.
  execute_test_action:
    agent: false
    description: Perform the test action using the defined parameters and prepared
      environment.
    name: execute_test_action
    nodes_depended_on:
    - define_test_action
    - prepare_test_environment
    nodes_dependent_on:
    - verify_test_result
    prompt: Execute the specified test action in the provided environment setup. Return
      only the raw test execution output or result data.
  prepare_test_environment:
    agent: false
    description: Set up all necessary conditions, variables, or mock data needed to
      run the test action.
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on:
    - execute_test_action
    prompt: Create and describe the environment setup including variables, configurations,
      or mock inputs required to run the defined test action. Only specify setup details
      relevant for the test execution.
  verify_test_result:
    agent: false
    description: Compare the test execution output against the expected outcome to
      determine pass or fail status.
    name: verify_test_result
    nodes_depended_on:
    - execute_test_action
    - define_test_action
    nodes_dependent_on: []
    prompt: Compare the actual result from test execution with the expected result
      defined in the test action. Return a concise verdict of PASS or FAIL with a
      brief explanation.
