dag_type: spec
description: A strongly-typed functional quicksort workflow that recursively sorts
  an array by selecting a pivot, partitioning, recursively sorting partitions, and
  combining results.
name: quicksort_functional_workflow
nodes:
  base_case_check:
    agent: false
    description: Check if array is empty and return it directly if true
    name: base_case_check
    nodes_depended_on: []
    nodes_dependent_on:
    - select_first_element_pivot
    output_structure:
    - description: Whether the input array is empty
      key: is_empty
      type: bool
    - description: The input array, either empty or unchanged
      key: output_array
      type: List[int]
    prd:
      conceptual_info: This node serves as the quicksort algorithm's base case checker,
        immediately returning empty arrays to terminate recursion for efficiency.
      docstring:
        examples:
        - lines:
          - base_case_check([])
          output: '{''is_empty'': True, ''output_array'': []}'
        - lines:
          - base_case_check([3, 1, 4])
          output: '{''is_empty'': False, ''output_array'': [3, 1, 4]}'
        parameters:
        - description: Input list of integers to check for emptiness
          name: array
          type: List[int]
        raises: []
        returns:
          description: 'is_empty: Boolean indicating array emptiness, output_array:
            Same input array or empty list'
          type: Tuple[bool, List[int]]
        summary: Check if input array is empty and return a tuple with boolean flag
          and array. Returns same array regardless of emptiness for non-empty cases.
    prompt: Write a function 'base_case_check' that takes an array and returns it
      if empty. Otherwise return the array unchanged.
  combine_sorted_partitions:
    agent: false
    description: Concatenate sorted left + equal + sorted right
    name: combine_sorted_partitions
    nodes_depended_on:
    - sort_left_partition
    - partition_equal_to
    - sort_right_partition
    nodes_dependent_on:
    - quicksort
    output_structure:
    - description: The fully concatenated sorted list resulting from combining the
        left, equal, and right partitions.
      key: combined_list
      type: List[int]
    prd:
      conceptual_info: The combine_sorted_partitions node merges the three sublists—sorted
        left, equal elements, and sorted right—into one fully sorted list, forming
        the core step that assembles the final quicksort result.
      docstring:
        examples:
        - lines:
          - combine_partitions([1, 2], [3], [4, 5])
          output: '[1, 2, 3, 4, 5]'
        - lines:
          - combine_partitions([1, 2, 2], [2, 2], [3, 4])
          output: '[1, 2, 2, 2, 2, 3, 4]'
        parameters:
        - description: A list of integers that has been recursively sorted and contains
            all elements less than the pivot.
          name: sorted_left
          type: List[int]
        - description: A list of integers that are equal to the pivot.
          name: equal_elements
          type: List[int]
        - description: A list of integers that has been recursively sorted and contains
            all elements greater than the pivot.
          name: sorted_right
          type: List[int]
        raises:
        - description: If any input is not a list of integers.
          type: TypeError
        returns:
          description: A list containing all elements from sorted_left, equal_elements,
            and sorted_right in that order.
          type: List[int]
        summary: Concatenates the sorted left partition, the equal-to-pivot partition,
          and the sorted right partition to produce a single sorted list.
    prompt: Write 'combine_partitions' that takes sorted left partition from 'sort_left',
      equal partition from 'partition_equal', and sorted right partition from 'sort_right',
      and concatenates them in order.
  partition_equal_to:
    agent: false
    description: Create list of elements == pivot
    name: partition_equal_to
    nodes_depended_on:
    - select_first_element_pivot
    nodes_dependent_on:
    - combine_sorted_partitions
    output_structure:
    - description: List of elements equal to the pivot
      key: equal_elements
      type: List[int]
    prd:
      conceptual_info: Filters the original array to extract all elements strictly
        equal to the selected pivot value.
      docstring:
        examples:
        - lines:
          - partition_equal_to([3,2,1,3,4], pivot=3)
          output: '[3, 3]'
        - lines:
          - partition_equal_to([5,5,5], pivot=5)
          output: '[5, 5, 5]'
        parameters:
        - description: The original array to partition after base case check and pivot
            selection
          name: array
          type: List[int]
        - description: The pivot value selected by the select_first_element_pivot
            node
          name: pivot
          type: int
        raises: []
        returns:
          description: A list containing only the elements from the array equal to
            the pivot
          type: List[int]
        summary: Extracts elements from the array that are equal to the provided pivot
          value.
    prompt: Write 'partition_equal' that takes array and pivot from 'select_pivot'
      and returns elements == pivot.
  partition_greater_than:
    agent: false
    description: Create list of elements > pivot
    name: partition_greater_than
    nodes_depended_on:
    - select_first_element_pivot
    nodes_dependent_on:
    - sort_right_partition
    output_structure:
    - description: List of elements greater than the pivot
      key: greater_than_partition
      type: List[int]
    prd:
      conceptual_info: Filters elements from the input array that are strictly greater
        than the selected pivot, used for partitioning in the quicksort workflow.
      docstring:
        examples:
        - lines:
          - partition_greater_than([5, 3, 8, 1, 6], 5)
          output: '[8, 6]'
        - lines:
          - partition_greater_than([5, 5, 5], 5)
          output: '[]'
        parameters:
        - description: The unmodified input array from which to filter elements (does
            not exclude the pivot itself).
          name: array
          type: List[int]
        - description: The pivot value selected by 'select_first_element_pivot', used
            as the comparison threshold.
          name: pivot
          type: int
        raises:
        - description: If the input array is empty (though unlikely due to upstream
            'base_case_check').
          type: ValueError
        returns:
          description: A new list containing only elements from the input array with
            values > pivot, preserving original order.
          type: List[int]
        summary: Returns a list of elements from the input array that are strictly
          greater than the given pivot.
    prompt: Write 'partition_greater' that takes array and pivot from 'select_pivot'
      and returns elements > pivot.
  partition_less_than:
    agent: false
    description: Create list of elements < pivot
    name: partition_less_than
    nodes_depended_on:
    - select_first_element_pivot
    nodes_dependent_on:
    - sort_left_partition
    output_structure:
    - description: List of elements less than the pivot
      key: less_than_elements
      type: int
    prd:
      conceptual_info: Filters the input array to produce a new list containing only
        elements strictly less than the selected pivot value. This is a core partitioning
        step in the quicksort algorithm.
      docstring:
        examples:
        - lines:
          - partition_less_than([3,1,2], 3)
          output: '{''less_than_elements'': [1, 2]}'
        - lines:
          - partition_less_than([5,4,5,6], 5)
          output: '{''less_than_elements'': [4]}'
        parameters:
        - description: The input list of integers to filter.
          name: array
          type: List[int]
        - description: The pivot value for comparison, selected via the parent node.
          name: pivot
          type: int
        raises:
        - description: If input array is empty (validated by parent nodes).
          type: ValueError
        returns:
          description: A list containing all elements from 'array' that are less than
            'pivot'.
          type: List[int]
        summary: Returns a list of all elements in the input array that are strictly
          less than the specified pivot value.
    prompt: Write 'partition_less_than' that takes array and pivot from 'select_pivot'
      and returns elements < pivot.
  quicksort:
    agent: false
    description: Main quicksort function that executes full sorting workflow
    name: quicksort
    nodes_depended_on:
    - combine_sorted_partitions
    nodes_dependent_on: []
    output_structure:
    - description: The final sorted array after applying full quicksort algorithm
      key: sorted_array
      type: int
    prd:
      conceptual_info: 'The quicksort node implements the full quicksort sorting algorithm.
        It orchestrates the workflow defined by the preceding nodes: it first checks
        for the base case (empty array), then selects the first element as a pivot,
        partitions the remaining elements into less‑than, equal, and greater‑than
        groups, recursively sorts the less and greater partitions, and finally concatenates
        the sorted left partition, the pivot group, and the sorted right partition
        into the final sorted list.'
      docstring:
        examples:
        - lines:
          - quicksort([3, 1, 4, 1, 5, 9, 2, 6])
          output: '[1, 1, 2, 3, 4, 5, 6, 9]'
        - lines:
          - quicksort([])
          output: '[]'
        parameters:
        - description: The list of integers to be sorted.
          name: array
          type: List[int]
        raises:
        - description: If `array` is not a list.
          type: TypeError
        - description: If any element of `array` is not an integer.
          type: ValueError
        returns:
          description: A new list containing the elements of `array` sorted in non‑decreasing
            order.
          type: List[int]
        summary: Recursively sorts a list of integers using the quicksort algorithm.
    prompt: Write a function 'quicksort' that checks if array is empty (base case),
      selects a pivot, partitions the array, recursively sorts left/right partitions,
      and combines results to return final sorted array.
  select_first_element_pivot:
    agent: false
    description: Select first element as pivot
    name: select_first_element_pivot
    nodes_depended_on:
    - base_case_check
    nodes_dependent_on:
    - partition_less_than
    - partition_equal_to
    - partition_greater_than
    output_structure:
    - description: The selected pivot element (first element of the array)
      key: pivot
      type: int
    - description: The index of the pivot element in the original array (always 0)
      key: pivot_index
      type: int
    prd:
      conceptual_info: Selects the first element of a non-empty array as the pivot
        for quicksort. This provides a deterministic pivot choice and tracks its original
        index for partitioning.
      docstring:
        examples:
        - lines:
          - select_pivot([7, 2, 5, 1])
          output: (7, 0)
        - lines:
          - select_pivot([42])
          output: (42, 0)
        parameters:
        - description: Non-empty array from base_case_check validation. Assumed to
            contain only integers.
          name: arr
          type: List[int]
        raises:
        - description: 'If input array is empty. Note: This should never occur as
            base_case_check already validates non-emptiness.'
          type: ValueError
        returns:
          description: Tuple where first element is the pivot value (int) and second
            is the pivot index (int, always 0).
          type: Tuple[int, int]
        summary: Returns the first element of a non-empty array as the pivot value
          and its index.
    prompt: Write a function 'select_pivot' that takes a non-empty array from 'base_case_check'
      and returns first element as pivot.
  sort_left_partition:
    agent: false
    description: Recursively sort the elements that are less than the pivot.
    name: sort_left_partition
    nodes_depended_on:
    - partition_less_than
    nodes_dependent_on:
    - combine_sorted_partitions
    output_structure:
    - description: The fully sorted list of elements that were less than the pivot
      key: sorted_left
      type: List[int]
    prd:
      conceptual_info: Recursively sorts a list of elements less than a pivot using
        the quicksort algorithm, as part of a functional decomposition.
      docstring:
        examples:
        - lines:
          - sort_left([3, 1, 2])
          output: '[1, 2, 3]'
        - lines:
          - sort_left([5, 4, 3])
          output: '[3, 4, 5]'
        parameters:
        - description: List of integers less than the pivot from the 'partition_less_than'
            node output
          name: less_than_elements
          type: List[int]
        raises: []
        returns:
          description: A sorted list of integers produced by recursively applying
            the quicksort algorithm
          type: List[int]
        summary: Applies a recursive quicksort to the output of the 'partition_less_than'
          node, returning a sorted list.
    prompt: Write 'sort_left' that recursively applies quicksort to 'partition_less_than'
      output.
  sort_right_partition:
    agent: false
    description: Recursively sort greater-than partition
    name: sort_right_partition
    nodes_depended_on:
    - partition_greater_than
    nodes_dependent_on:
    - combine_sorted_partitions
    output_structure:
    - description: The sorted list of elements greater than the pivot
      key: sorted_partition
      type: int
    prd:
      conceptual_info: Recursively sort the elements greater than the chosen pivot
        using quicksort.
      docstring:
        examples:
        - lines:
          - sorted_list = sort_right([3, 1, 4])
          output: '[1, 3, 4]'
        - lines:
          - sorted_list = sort_right([])
          output: '[]'
        parameters:
        - description: The list of elements greater than the pivot that need to be
            sorted.
          name: greater_than_partition
          type: List[int]
        raises:
        - description: If 'greater_than_partition' is not a list or contains non-integer
            elements.
          type: ValueError
        returns:
          description: A sorted list of the elements that were greater than the pivot.
          type: List[int]
        summary: Recursively applies quicksort to the list of elements greater than
          the chosen pivot and returns the sorted list.
    prompt: Write 'sort_right' that recursively applies quicksort to 'partition_greater'
      output.
