dag_type: plain_text
description: Generated workflow with each node split into two concurrent nodes, where
  each output flows downstream to both split successors.
name: weather_forecasting_system_split_concurrent
nodes:
  collect_historical_weather_data_a:
    agent: false
    description: Gather partial data from governmental sources such as weather stations.
    name: collect_historical_weather_data_a
    nodes_depended_on:
    - define_forecasting_requirements_a
    nodes_dependent_on: []
    prompt: Collect historical weather data for the specified region and variables
      from government databases, weather stations.
  define_forecasting_requirements_a:
    agent: false
    description: Define the basic parameters of the weather forecasting system.
    name: define_forecasting_requirements_a
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Specify the geographic region, forecast horizon (e.g., 1‑3 day, 1‑week),
      target variables (temperature, precipitation, wind speed).
  define_forecasting_requirements_b:
    agent: false
    description: Define the evaluation criteria of the weather forecasting system.
    name: define_forecasting_requirements_b
    nodes_depended_on:
    - define_forecasting_requirements_a
    nodes_dependent_on: []
    prompt: Specify the evaluation metrics for the weather forecasting system performance.
