dag_type: plain_text
description: A comprehensive, concurrent workflow to establish the foundational structure
  of a hedge fund, decomposed into elemental, executable steps covering strategy,
  legal, operations, compliance, technology, fundraising, and launch planning.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Determine the primary investment approach for the fund.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Choose one dominant hedge fund strategy (e.g., long/short equity, global
      macro, event-driven). Justify in one sentence how it supports the stated fund
      objectives.
  choose_legal_entity_type:
    agent: false
    description: Select the fund’s legal structure.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    prompt: Specify the legal entity form (e.g., LP, LLC, SICAV) suitable for the
      selected jurisdiction. Include a one-sentence rationale.
  clarify_fund_objectives:
    agent: false
    description: Define the core business and investment goals of the hedge fund.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the primary objectives for creating this hedge fund, including investment
      purpose, target returns, differentiation, and long-term vision. Use up to 8
      bullet points. Focus only on goals, not execution details.
  compile_pitch_deck_outline:
    agent: false
    description: Construct the structure of the investor pitch presentation.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: Create a 10-slide pitch deck outline with titles only. Include slides
      for fund objectives, strategy, team, edge, risk, fees, target returns, and investor
      terms.
  create_hiring_plan:
    agent: false
    description: Determine staffing needs for launch.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    prompt: List essential full-time positions required to cover all operational gaps
      (max 8). For each, provide a one-line summary of responsibilities.
  define_asset_universe:
    agent: false
    description: List the specific financial instruments the fund will trade.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    prompt: Enumerate the asset classes and instruments the strategy will target (e.g.,
      US mid-cap equities, 10Y Treasury futures). Include no more than 10 items. Do
      not add descriptions.
  define_investor_profile:
    agent: false
    description: Specify the characteristics of ideal investors.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Describe the target investor type (e.g., endowments, family offices).
      Include typical investment size, risk tolerance, liquidity expectations, and
      geographic origin. Limit to one paragraph.
  define_technology_stack:
    agent: false
    description: Specify required technology systems.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    prompt: 'For each step in the operations workflow, list the corresponding technology
      or software needed (e.g., OMS, EMS, reconciliation tool). Present as a 2-column
      table: Ops Step | Tech Component.'
  design_compliance_program:
    agent: false
    description: Build a structured compliance framework.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: 'Create a compliance checklist with two columns: Regulatory Requirement
      | Internal Policy or Procedure. Map each obligation to a control.'
  design_risk_management_framework:
    agent: false
    description: Define risk control mechanisms.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    prompt: List 4–6 key risk controls such as position limits, VaR thresholds, stop-loss
      rules, and liquidity buffers. Align each with the risk targets. Use bullet points.
  develop_timeline_and_milestones:
    agent: false
    description: Establish a phased implementation plan.
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on: []
    prompt: Create a 12-month launch timeline with monthly milestones. Include regulatory
      filing, service provider onboarding, first capital close, tech deployment, and
      go-live date.
  draft_fee_structure:
    agent: false
    description: Design the fund’s fee model.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    prompt: Propose management and performance fee percentages. Include a high-water
      mark or hurdle rate if applicable. Summarize in no more than 3 sentences.
  draft_operations_workflow:
    agent: false
    description: Map the end-to-end operational lifecycle.
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: 'Outline the daily operational flow: idea generation → order entry → execution
      → confirmation → settlement → reconciliation. For each step, specify responsible
      party (internal or provider).'
  estimate_setup_and_operating_costs:
    agent: false
    description: Create a preliminary cost model.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on: []
    prompt: 'Estimate annual costs in USD for each service provider and for overhead
      (office, insurance, travel). Present as two columns: Cost Item | Estimated USD.'
  identify_regulatory_requirements:
    agent: false
    description: Determine key regulatory filings and registrations.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: List the main regulatory filings or registrations required (e.g., SEC
      Form ADV, AIFMD notification). Include only official names and governing authorities.
  list_service_providers:
    agent: false
    description: Identify required external service provider categories.
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: 'Generate a checklist of essential third-party providers: prime broker,
      fund administrator, auditor, legal counsel, compliance consultant, custodian.
      List types only—no details.'
  outline_governance_structure:
    agent: false
    description: Define internal roles and responsibilities.
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: List up to 5 governance roles (e.g., General Partner, CIO) with one-line
      descriptions of their duties. Keep concise and functional.
  produce_final_fund_plan_summary:
    agent: false
    description: Generate a consolidated executive summary of the full plan.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    prompt: Synthesize the key elements into a concise executive summary (≤400 words).
      Cover strategy, structure, target investors, risk controls, operations, fees,
      and launch timeline.
  select_jurisdiction:
    agent: false
    description: Choose the legal domicile for the fund based on objectives.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Select a fund domicile (e.g., Cayman Islands, Delaware, Luxembourg) that
      aligns with the fund's objectives. Provide exactly 2 advantages and 2 disadvantages
      of this jurisdiction.
  set_performance_and_risk_targets:
    agent: false
    description: Establish quantitative return and risk benchmarks.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    prompt: 'Set annual numeric targets for gross return, volatility (standard deviation),
      Sharpe ratio, and maximum drawdown. Present as a 4-row table with columns: Metric
      | Target Value.'
