dag_type: plain_text
description: Creates a complete, actionable plan for launching a hedge fund, covering
  objectives, structure, strategy, compliance, operations, technology, staffing, cost,
  timeline and final presentation.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Selects the high‑level investment strategy.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Select one primary hedge‑fund strategy (e.g., long/short equity, global
      macro, market neutral) that best matches the objectives. Provide a one‑sentence
      rationale.
  choose_legal_entity_type:
    agent: false
    description: Identifies the legal vehicle for the fund.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    prompt: Specify the legal entity structure (LP, LLC, SICAV, etc.) appropriate
      for the chosen jurisdiction. Give a one‑sentence explanation of why it fits.
  clarify_fund_objectives:
    agent: false
    description: Produces a bullet list of the hedge fund's fundamental objectives.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the core business objectives for the new hedge fund as concise bullet
      points (max 8). Cover investment purpose, target returns, risk philosophy, and
      long‑term vision.
  compile_pitch_deck_outline:
    agent: false
    description: Provides the structure for a fundraising presentation.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: Create a 10‑slide outline (slide titles only) for an investor pitch deck
      covering objectives, strategy, team, edge, risk controls, fees, expected returns,
      and timeline.
  create_hiring_plan:
    agent: false
    description: Determines initial staffing requirements.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    prompt: List essential full‑time positions for launch (max 8). Provide a one‑line
      responsibility for each and indicate which operational gaps they fill.
  define_asset_universe:
    agent: false
    description: Enumerates the tradable assets for the strategy.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    prompt: List up to ten specific asset classes and instruments the chosen strategy
      will trade (e.g., US large‑cap equities, S&P 500 futures, EUR/USD).
  define_investor_profile:
    agent: false
    description: Specifies the fund's prospective investor base.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: 'Describe the ideal target investor (family office, pension fund, high‑net‑worth
      individual, etc.) with key attributes: ticket size, risk tolerance, liquidity
      needs, geographic focus.'
  define_technology_stack:
    agent: false
    description: Specifies technology tools supporting the operational workflow.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    prompt: 'Identify required software and infrastructure for each operations step
      (e.g., OMS, EMS, risk analytics, data warehouse). Present as a two‑column table:
      Ops Step | Tech Component.'
  design_compliance_program:
    agent: false
    description: Builds a compliance program linked to regulations and risk controls.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: 'Create a compliance checklist mapping each regulatory requirement to
      a specific internal policy or procedure. Format as a table: Requirement | Policy
      Reference.'
  design_risk_management_framework:
    agent: false
    description: Outlines quantitative and qualitative risk controls.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    prompt: 'List core risk controls aligned with the target metrics: position limits,
      VaR limits, stop‑loss rules, liquidity thresholds, and stress‑test frequency.
      Provide 4–6 bullet points.'
  develop_timeline_and_milestones:
    agent: false
    description: Creates a phased schedule leading to fund launch.
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on: []
    prompt: Prepare a launch timeline with monthly milestones over the next 12 months.
      Include regulatory filing, service provider onboarding, capital raise, tech
      deployment, hiring, and go‑live.
  draft_fee_structure:
    agent: false
    description: Creates the fund's fee model.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    prompt: Propose management and performance fee percentages that balance cost recovery
      and market competitiveness. Include any hurdle rate if relevant. Summarize in
      ≤3 sentences.
  draft_operations_workflow:
    agent: false
    description: Maps core trade and post‑trade operational steps.
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: 'Sketch the daily trade lifecycle: idea generation → order entry → execution
      → confirmation → settlement → reconciliation. List each step with the primary
      responsible party (internal team or external provider).'
  estimate_setup_and_operating_costs:
    agent: false
    description: Produces a rough cost model for launch and ongoing operations.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on: []
    prompt: 'Provide a simple annual cost estimate (USD) for each listed service provider
      plus internal overhead (office, tech, salaries). Present as a two‑column table:
      Cost Item | Estimated USD.'
  identify_regulatory_requirements:
    agent: false
    description: Outlines key regulatory obligations.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: List the primary regulatory filings and registrations needed for the selected
      entity and jurisdiction (e.g., SEC Form ADV, Cayman regulator filing). Include
      only the filing name and governing authority.
  list_service_providers:
    agent: false
    description: Enumerates required external service providers.
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: 'Generate a checklist of mandatory third‑party service provider categories:
      prime broker, fund administrator, auditor, legal counsel, compliance consultant,
      custodian, and technology vendor.'
  produce_final_fund_plan_summary:
    agent: false
    description: Generates an all‑in summary of the hedge‑fund launch plan.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    prompt: Synthesize all prior outputs into a concise executive summary (≤400 words)
      covering strategy, structure, risk, operations, fees, timeline, and investor
      proposition. Use bullet points or short paragraphs.
  select_jurisdiction:
    agent: false
    description: Determines the fund's legal domicile and rationale.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Choose the optimal domicile for the fund (e.g., Cayman, Delaware, Luxembourg).
      Provide two advantages and two disadvantages of the selected jurisdiction.
  set_performance_and_risk_targets:
    agent: false
    description: Specifies the fund's performance and risk goals.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    prompt: 'Define quantitative annual targets: gross return (%), volatility (%),
      Sharpe ratio, and maximum drawdown (%). Present as a 4‑row table.'
