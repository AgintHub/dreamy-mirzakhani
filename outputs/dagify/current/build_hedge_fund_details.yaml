dag_type: plain_text
description: Creates a comprehensive, step‑by‑step plan for launching a hedge fund,
  covering strategy definition, legal setup, operations, technology, staffing, compliance,
  risk management, service providers, cost modeling, fundraising materials, timeline
  and final executive summary.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Identifies the high‑level investment strategy.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Select one primary hedge‑fund strategy category (e.g., long/short equity,
      global macro, systematic statistical arbitrage) that best serves the objectives.
      Provide a one‑sentence justification.
  choose_legal_entity_type:
    agent: false
    description: Selects the legal entity form for the fund.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    prompt: Specify the legal vehicle structure appropriate for the chosen jurisdiction
      (e.g., LP, LLC, SICAV). Provide a brief one‑sentence explanation.
  clarify_fund_objectives:
    agent: false
    description: Produces a bullet‑list of the fund’s primary business objectives.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the core objectives of the hedge fund in up to eight concise bullet
      points. Cover investment purpose, target return profile, competitive advantage,
      and long‑term vision. Do not include any strategy or structural details.
  compile_pitch_deck_outline:
    agent: false
    description: Provides the structure for fundraising presentation materials.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: Create a 10‑slide outline (titles only) for an investor pitch deck covering
      objectives, strategy, team, edge, risk controls, fees, target returns, market
      opportunity, service providers, and timeline.
  create_hiring_plan:
    agent: false
    description: Determines initial staffing requirements.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    prompt: Identify up to eight essential full‑time roles needed at launch (e.g.,
      Portfolio Manager, Quant Analyst, Risk Manager, Compliance Officer, Operations
      Manager, IT Engineer, CFO, Investor Relations). Include a one‑line responsibility
      for each.
  define_asset_universe:
    agent: false
    description: Enumerates the tradable assets and instruments.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    prompt: List up to ten specific asset classes or instruments the strategy will
      trade (e.g., US large‑cap equities, Euro‑dollar futures, credit default swaps).
      Keep the list concise.
  define_investor_profile:
    agent: false
    description: Articulates the target investor segment.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Describe the ideal investor type for the fund (e.g., family offices, pension
      funds, high‑net‑worth individuals). Include typical ticket size, risk tolerance,
      liquidity preference, and geographic focus.
  define_technology_stack:
    agent: false
    description: Specifies the software and infrastructure needed to support operations.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    prompt: 'List the technology components required for each operation step identified
      in the workflow (e.g., OMS, EMS, risk engine, data warehouse). Present as a
      two‑column table: Ops Step | Tech Component.'
  design_compliance_program:
    agent: false
    description: Generates the compliance framework aligned with regulations and risk
      controls.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: 'Create a compliance checklist linking each regulatory requirement to
      an internal policy or procedure. Present as a two‑column table: Requirement
      | Policy/Procedure.'
  design_risk_management_framework:
    agent: false
    description: Creates the quantitative and qualitative risk control architecture.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    prompt: Provide 5‑6 core risk controls aligned with the performance and risk targets
      (e.g., position limits, VaR caps, stop‑loss levels, liquidity thresholds). Use
      bullet points.
  develop_timeline_and_milestones:
    agent: false
    description: Creates a phased schedule leading to fund launch.
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on: []
    prompt: 'Construct a 12‑month launch timeline with monthly milestones (e.g., legal
      formation, regulatory filings, service provider contracts, tech deployment,
      capital raise, first trade). Present as a table: Month | Milestone.'
  draft_fee_structure:
    agent: false
    description: Sets the fund’s fee schedule.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    prompt: Propose management and performance fee percentages that balance cost recovery
      with market competitiveness. Include any hurdle rate if appropriate. Summarize
      in up to three sentences.
  draft_operations_workflow:
    agent: false
    description: Maps core trade and post‑trade operational steps.
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on: []
    prompt: 'Sketch the end‑to‑end daily trade lifecycle: idea generation → order
      creation → execution → confirmation → settlement → reconciliation. For each
      step, indicate the primary responsible party (internal team or specific service
      provider).'
  estimate_setup_and_operating_costs:
    agent: false
    description: Produces a high‑level cost model for launch and ongoing operations.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on: []
    prompt: 'Provide an approximate annual cost (USD) for each listed service provider
      category and for internal overhead (office, tech, staffing). Show as a two‑column
      table: Cost Item | Estimated USD.'
  identify_regulatory_requirements:
    agent: false
    description: Outlines key regulatory obligations.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    prompt: List the principal regulatory filings or registrations required for the
      selected entity and jurisdiction (e.g., SEC Form ADV, FCA Registration). Include
      only the filing names and the governing authority.
  list_service_providers:
    agent: false
    description: Identifies required external service providers.
    name: list_service_providers
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    prompt: 'Create a checklist of mandatory third‑party service providers: prime
      broker, fund administrator, auditor, legal counsel, compliance consultant, and
      custodian. List only provider categories.'
  produce_final_fund_plan_summary:
    agent: false
    description: Generates a comprehensive final plan document.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    prompt: Synthesize all prior outputs into a concise executive summary (≤400 words)
      covering strategy, structure, risk, operations, fees, cost model, compliance,
      hiring, technology, timeline, and fundraising materials. Use bullet points or
      short paragraphs.
  select_jurisdiction:
    agent: false
    description: Determines the legal domicile and rationale.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    prompt: Choose a domicile for the fund (e.g., Cayman, Delaware, Luxembourg) that
      best aligns with the stated objectives. Provide two advantages and two disadvantages
      of the chosen jurisdiction.
  set_performance_and_risk_targets:
    agent: false
    description: Specifies numerical performance and risk goals.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    prompt: Define quantitative targets for annual gross return, annual volatility,
      Sharpe ratio, and maximum drawdown that are realistic for the chosen strategy.
      Present them in a simple table.
