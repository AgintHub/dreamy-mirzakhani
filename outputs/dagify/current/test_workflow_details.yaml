dag_type: plain_text
description: Create a workflow DAG to test fundamental operations.
name: test_workflow
nodes:
  construct_test_workflow:
    agent: false
    description: Construct the fundamental workflow DAG from the mapped tasks.
    name: construct_test_workflow
    nodes_depended_on:
    - map_decomposed_objective
    nodes_dependent_on: []
    prompt: Create a fundamental workflow DAG that is maximally concurrent, async,
      and parallel from the mapped tasks and Elemental Thoughts framework.
  decompose_objective:
    agent: false
    description: Decompose the parsed objective into constituent tasks.
    name: decompose_objective
    nodes_depended_on:
    - parse_test_objective
    nodes_dependent_on: []
    prompt: Decompose the provided fundamental task into elemental operations.
  execute_test_workflow:
    agent: false
    description: Execute the validated workflow DAG to finalize the test execution.
    name: execute_test_workflow
    nodes_depended_on:
    - validate_test_workflow
    nodes_dependent_on: []
    prompt: Run the validated workflow DAG to execute the fundamental test objective.
  map_decomposed_objective:
    agent: false
    description: Map each decomposed task to Elemental Thoughts framework.
    name: map_decomposed_objective
    nodes_depended_on:
    - decompose_objective
    nodes_dependent_on: []
    prompt: Map the decomposed task elements to the Elemental Thoughts framework to
      execute fundamental operations.
  parse_test_objective:
    agent: false
    description: Parse the given Objective description.
    name: parse_test_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Parse the provided Objective description to create a fundamental and specific
      task.
  validate_test_workflow:
    agent: false
    description: Validate that the constructed workflow DAG adheres to acyclicity
      and dependency requirements.
    name: validate_test_workflow
    nodes_depended_on:
    - construct_test_workflow
    nodes_dependent_on: []
    prompt: Verify that the constructed workflow DAG is acyclic and enforces the correct
      dependencies.
