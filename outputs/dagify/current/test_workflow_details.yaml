dag_type: plain_text
description: A workflow for testing
name: test_workflow
nodes:
  evaluate_test:
    agent: false
    description: Assess the test results
    name: evaluate_test
    nodes_depended_on:
    - run_test
    nodes_dependent_on: []
    prompt: Analyze the test outcome
  report_test:
    agent: false
    description: Report the test findings
    name: report_test
    nodes_depended_on:
    - evaluate_test
    nodes_dependent_on: []
    prompt: Document and communicate the test results
  run_test:
    agent: false
    description: Execute the test
    name: run_test
    nodes_depended_on:
    - start_test
    nodes_dependent_on: []
    prompt: Perform the test
  start_test:
    agent: false
    description: Initiate the test process
    name: start_test
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Begin testing
