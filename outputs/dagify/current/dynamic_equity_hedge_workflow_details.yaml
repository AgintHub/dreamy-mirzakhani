dag_type: plain_text
description: A workflow to ingest financial data, analyze an equity portfolio's implied
  valuation vs NAV to construct an overnight dynamic hedge, and schedule trade execution
  for the morning auction.
name: dynamic_equity_hedge_workflow
nodes:
  calculate_hedge_ratios:
    agent: false
    description: Determine the required notional and contract counts for futures and
      ETFs to neutralize market risk.
    name: calculate_hedge_ratios
    nodes_depended_on:
    - calculate_portfolio_greeks
    - fetch_market_data_etfs
    - fetch_market_data_futures
    nodes_dependent_on: []
    prompt: Using the portfolio Delta and the current prices of ETFs and Futures,
      calculate the precise number of contracts or shares required to hedge the portfolio
      to neutral (zero delta). Prioritize liquidity in instrument selection.
  calculate_nav_valuation:
    agent: false
    description: Determine the current Net Asset Value (NAV) and aggregate market
      value of the portfolio.
    name: calculate_nav_valuation
    nodes_depended_on:
    - ingest_portfolio_holdings
    - fetch_market_data_stocks
    nodes_dependent_on: []
    prompt: Calculate the total market value and the Net Asset Value (NAV) of the
      current equity portfolio based on the latest closing prices.
  calculate_portfolio_greeks:
    agent: false
    description: Compute the total delta, gamma, and vega exposure of the equity portfolio.
    name: calculate_portfolio_greeks
    nodes_depended_on:
    - ingest_portfolio_holdings
    - fetch_market_data_stocks
    nodes_dependent_on: []
    prompt: Calculate the total portfolio Delta, Gamma, and Vega based on the current
      holdings and the latest market data (prices and implied volatilities). Provide
      the net aggregate Greeks.
  fetch_market_data_etfs:
    agent: false
    description: Collect real-time and closing market data for correlated ETFs.
    name: fetch_market_data_etfs
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Fetch market data (Last, Bid, Ask, Volume, IV) for a predefined list of
      sector and broad market ETFs relevant to the portfolio (e.g., SPY, QQQ, IWM,
      XLK, XLF).
  fetch_market_data_futures:
    agent: false
    description: Collect real-time and closing market data for index and volatility
      futures.
    name: fetch_market_data_futures
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Fetch market data and front-month contract specifications for relevant
      index futures (e.g., ES, NQ, RTY) and volatility futures (e.g., VIX).
  fetch_market_data_stocks:
    agent: false
    description: Collect real-time and closing market data for all portfolio stock
      holdings.
    name: fetch_market_data_stocks
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Using the provided list of portfolio tickers, fetch the latest market
      data including Last Price, Bid, Ask, Volume, and Implied Volatility for each
      stock.
  generate_hedge_orders:
    agent: false
    description: Format the calculated hedge ratios into specific trade orders including
      symbols, quantities, and sides.
    name: generate_hedge_orders
    nodes_depended_on:
    - calculate_hedge_ratios
    nodes_dependent_on: []
    prompt: 'Convert the hedge ratios into a list of trade orders. Each order must
      specify: Symbol, Side (Buy/Sell), Quantity, and Order Type (Limit). Ensure the
      total directional exposure offsets the portfolio.'
  ingest_portfolio_holdings:
    agent: false
    description: Retrieve the current list of equity holdings and positions from the
      portfolio database.
    name: ingest_portfolio_holdings
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Retrieve the current equity portfolio composition from the internal source,
      including ticker symbols, shares held, and average cost basis. Format as a list
      of positions.
  schedule_auction_trades:
    agent: false
    description: Create execution instructions to place the approved hedge trades
      at the market open auction.
    name: schedule_auction_trades
    nodes_depended_on:
    - validate_risk_limits
    nodes_dependent_on: []
    prompt: Generate the execution instructions to submit the approved hedge orders
      specifically for the opening auction. Instructions should include the exact
      timing (e.g., 'At the Open') and any price collars.
  validate_risk_limits:
    agent: false
    description: Ensure the proposed hedge trades adhere to predefined risk and leverage
      constraints.
    name: validate_risk_limits
    nodes_depended_on:
    - generate_hedge_orders
    - fetch_market_data_futures
    nodes_dependent_on: []
    prompt: Check the generated hedge orders against risk limits (max leverage, margin
      usage, max position size). Reject the set if it violates constraints, otherwise
      approve.
