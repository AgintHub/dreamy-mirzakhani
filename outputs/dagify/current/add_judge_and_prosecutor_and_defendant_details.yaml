dag_type: plain_text
description: Add a defendant component and route its output to the judge, alongside
  the prosecutor.
name: add_judge_and_prosecutor_and_defendant
nodes:
  defendant:
    agent: false
    description: Implement and document the defendant component throughout its lifecycle.
    name: defendant
    nodes_depended_on: []
    nodes_dependent_on:
    - judge
    prompt: Define the defendant role, design its representation and interactions,
      develop interfaces for interaction, integrate it with the simulator, validate
      its outputs, test the component thoroughly, and produce comprehensive documentation
      covering all aspects.
  judge:
    agent: false
    description: Implement and document the judge component throughout its lifecycle.
    name: judge
    nodes_depended_on:
    - prosecutor
    - defendant
    nodes_dependent_on: []
    prompt: Define the judge role, design its decision-making logic, develop interfaces
      for interaction, integrate it with the simulator, validate decisions against
      expected outcomes, test the component thoroughly, and produce comprehensive
      documentation covering all aspects.
  prosecutor:
    agent: false
    description: Implement and document the prosecutor component throughout its lifecycle.
    name: prosecutor
    nodes_depended_on: []
    nodes_dependent_on:
    - judge
    prompt: Define the prosecutor role, design its evidence gathering and argumentation
      logic, develop interfaces for interaction, integrate it with the simulator,
      validate its outputs, test the component thoroughly, and produce comprehensive
      documentation covering all aspects.
