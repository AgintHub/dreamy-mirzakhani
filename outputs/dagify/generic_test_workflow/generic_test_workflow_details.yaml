dag_type: spec
description: Generated workflow from UI.
name: generic_test_workflow
nodes:
  analyze_failures:
    agent: false
    description: Investigate why tests failed.
    name: analyze_failures
    nodes_depended_on:
    - capture_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Identifier of the failed test case
      key: test_id
      type: str
    - description: Concise hypothesis explaining why the test failed
      key: root_cause_hypothesis
      type: str
    - description: Suggested action or change to resolve the failure
      key: fix_suggestion
      type: str
    prd:
      conceptual_info: The analyze_failures node investigates the root causes of failed
        test cases and suggests potential fixes.
      docstring:
        examples:
        - lines:
          - test_results = {
          - '  ''test_case_ids'': [''test1'', ''test2'', ''test3''],'
          - '  ''pass_fail_status'': [True, False, True],'
          - '  ''execution_times'': [1.0, 2.0, 3.0],'
          - '  ''failure_details'': ['''', ''AssertionError'', ''''],'
          - '  ''total_tests'': 3,'
          - '  ''total_passed'': 2,'
          - '  ''total_failed'': 1'
          - '}'
          - analyze_failures(test_results)
          output: '[{''test_id'': ''test2'', ''root_cause_hypothesis'': ''Assertion
            error in test2'', ''fix_suggestion'': ''Verify the assertion in test2''}]'
        parameters:
        - description: Test results from the capture_test_results node, including
            test_case_ids, pass_fail_status, execution_times, failure_details, total_tests,
            total_passed, and total_failed.
          name: test_results
          type: dict
        raises:
        - description: If the input test results are invalid or incomplete.
          type: ValueError
        returns:
          description: A list of dictionaries containing the test_id, root_cause_hypothesis,
            and fix_suggestion for each failed test case.
          type: List[dict]
        summary: Analyze failed test cases to determine their root causes and suggest
          fixes.
    prompt: For each failed test case, provide a concise root cause hypothesis and
      suggest potential fixes.
  capture_test_results:
    agent: false
    description: Aggregate raw results from the test run.
    name: capture_test_results
    nodes_depended_on:
    - execute_test_cases
    nodes_dependent_on: []
    output_structure:
    - description: List of test case IDs
      key: test_case_ids
      type: List[str]
    - description: List of pass/fail status for each test case
      key: pass_fail_status
      type: List[bool]
    - description: List of execution times for each test case
      key: execution_times
      type: List[float]
    - description: List of failure details for each failed test case
      key: failure_details
      type: List[str]
    - description: Total number of tests executed
      key: total_tests
      type: int
    - description: Total number of tests passed
      key: total_passed
      type: int
    - description: Total number of tests failed
      key: total_failed
      type: int
    prd:
      conceptual_info: This node aggregates raw results from the test run, collecting
        data on pass/fail status, execution time, and failure details for each test
        case.
      docstring:
        examples:
        - lines:
          - capture_test_results([
          - '    {''test_case_id'': ''TC1'', ''passed'': True, ''failure_reason'':
            None, ''execution_time'': 10.0},'
          - '    {''test_case_id'': ''TC2'', ''passed'': False, ''failure_reason'':
            ''Assertion error'', ''execution_time'': 5.0}'
          - '])'
          output: '{''test_case_ids'': [''TC1'', ''TC2''], ''pass_fail_status'': [True,
            False], ''execution_times'': [10.0, 5.0], ''failure_details'': [None,
            ''Assertion error''], ''total_tests'': 2, ''total_passed'': 1, ''total_failed'':
            1}'
        parameters:
        - description: List of dictionaries containing test case execution results,
            each with 'test_case_id', 'passed', 'failure_reason', 'execution_time'
            keys.
          name: test_case_results
          type: List[Dict[str, Any]]
        raises:
        - description: If the input test_case_results is empty or contains invalid
            data.
          type: ValueError
        returns:
          description: Dictionary containing aggregated test results, including lists
            of test case IDs, pass/fail status, execution times, failure details,
            and totals for tests, passed, and failed.
          type: Dict[str, Any]
        summary: Captures and aggregates test execution data from the output of execute_test_cases
          node.
    prompt: Collect all test execution data, including pass/fail status, execution
      time, and any failure details.
  create_test_cases:
    agent: false
    description: Develop individual test cases that will be executed.
    name: create_test_cases
    nodes_depended_on:
    - define_test_objectives
    - identify_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of unique test case IDs
      key: test_case_ids
      type: List[str]
    - description: List of short titles for each test case
      key: test_case_titles
      type: List[str]
    - description: List of preconditions for each test case
      key: preconditions
      type: List[str]
    - description: List of steps for each test case
      key: test_steps
      type: List[str]
    - description: List of expected results for each test case
      key: expected_results
      type: List[str]
    - description: List of priority levels for each test case
      key: priority_levels
      type: List[int]
    prd:
      conceptual_info: This node generates individual test cases based on the defined
        test objectives and identified test scope.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Verify functionality', 'Verify performance']
          - 'test_scope = {''features'': [''feature1'', ''feature2''], ''modules'':
            [''module1'', ''module2'']}'
          - test_cases = create_test_cases(test_objectives, test_scope)
          output: '{''test_case_ids'': [''TC-1'', ''TC-2''], ''test_case_titles'':
            [''Test Case 1'', ''Test Case 2''], ''preconditions'': [''Precondition
            1'', ''Precondition 2''], ''test_steps'': [''Step 1'', ''Step 2''], ''expected_results'':
            [''Result 1'', ''Result 2''], ''priority_levels'': [1, 2]}'
        parameters:
        - description: List of primary objectives of the test suite
          name: test_objectives
          type: List[str]
        - description: Dictionary containing the test scope features, modules, user
            flows, and boundary conditions
          name: test_scope
          type: Dict[str, List[str]]
        raises:
        - description: If the test objectives or test scope are invalid or empty
          type: ValueError
        returns:
          description: Dictionary containing the test case IDs, titles, preconditions,
            steps, expected results, and priority levels
          type: Dict[str, List[str] or List[int]]
        summary: Creates a list of test cases with their respective IDs, titles, preconditions,
          steps, expected results, and priority levels.
    prompt: Generate a list of test case IDs with short titles, preconditions, steps,
      expected results, and priority.
  define_test_objectives:
    agent: false
    description: Establish the main goals that the test suite should achieve.
    name: define_test_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A list of concise bullet points describing the primary objectives
        of the test suite.
      key: test_objectives
      type: str
    prd:
      conceptual_info: This node defines the strategic objectives that guide the entire
        testing effort, ensuring that all subsequent test cases, scopes, and environments
        are aligned with these high‑level goals.
      docstring:
        examples:
        - lines:
          - objective_list = define_test_objectives("List the primary objectives of
            the test in concise bullet points.")
          output: '[''Verify functional correctness'', ''Assess performance under
            load'', ''Validate security controls'']'
        - lines:
          - objective_list = define_test_objectives("Identify core goals for the test
            suite.")
          output: '[''Ensure feature parity with specifications'', ''Confirm regression
            safety'', ''Detect potential security vulnerabilities'']'
        parameters:
        - description: Human‑readable instruction asking for the main objectives of
            the test suite.
          name: prompt_text
          type: str
        raises:
        - description: If `prompt_text` is empty or does not contain any actionable
            instruction.
          type: ValueError
        returns:
          description: A list of bullet‑point strings, each describing a primary test
            objective such as functionality verification, performance assessment,
            or security validation.
          type: List[str]
        summary: Generate a list of primary test objectives from a concise natural‑language
          prompt.
    prompt: List the primary objectives of the test in concise bullet points (e.g.,
      verify functionality, performance, security).
  execute_test_cases:
    agent: false
    description: Perform the actual test execution.
    name: execute_test_cases
    nodes_depended_on:
    - create_test_cases
    - prepare_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier of the test case
      key: test_case_id
      type: str
    - description: Short title of the test case
      key: title
      type: str
    - description: Preconditions required before executing the test case
      key: preconditions
      type: str
    - description: Steps executed during the test case
      key: steps
      type: str
    - description: Expected results for the test case
      key: expected_results
      type: str
    - description: Priority level of the test case (e.g., 1-5)
      key: priority
      type: int
    - description: Whether the test case passed or failed
      key: passed
      type: bool
    - description: Reason for failure if the test case failed
      key: failure_reason
      type: str
    - description: Captured error logs or console output
      key: error_logs
      type: str
    - description: Path or URL to the screenshot taken during failure
      key: screenshot
      type: str
    prd:
      conceptual_info: Executes a sequence of pre‑defined test cases in a prepared
        environment, capturing detailed pass/fail data, diagnostics, and visual evidence
        for any failures.
      docstring:
        examples:
        - lines:
          - test_cases = [
          - '    {'
          - '        ''test_case_id'': ''TC001'','
          - '        ''title'': ''Login success'','
          - '        ''preconditions'': ''User exists'','
          - '        ''steps'': ''Enter credentials, click login'','
          - '        ''expected_results'': ''Redirect to dashboard'','
          - '        ''priority'': 1'
          - '    }'
          - ']'
          - results = execute_test_cases(test_cases, environment_ready=True, capture_screenshots=False)
          - print(results[0]['passed'])
          output: 'True'
        - lines:
          - test_cases = [
          - '    {'
          - '        ''test_case_id'': ''TC002'','
          - '        ''title'': ''Password reset'','
          - '        ''preconditions'': ''User registered'','
          - '        ''steps'': ''Click forgot password, submit email'','
          - '        ''expected_results'': ''Email sent with reset link'','
          - '        ''priority'': 2'
          - '    }'
          - ']'
          - results = execute_test_cases(test_cases, environment_ready=False, capture_screenshots=True)
          - print(results)
          output: 'RuntimeError: Test environment not prepared.'
        parameters:
        - description: List of test case dictionaries produced by the `create_test_cases`
            node. Each dictionary must contain `test_case_id`, `title`, `preconditions`,
            `steps`, `expected_results`, and `priority` keys.
          name: test_cases
          type: List[Dict[str, Any]]
        - description: Flag indicating that the environment setup from `prepare_test_environment`
            is complete. If False, execution is aborted.
          name: environment_ready
          type: bool
        - description: Whether to capture screenshots on failure. If True, a screenshot
            path or URL is stored in the `screenshot` field.
          name: capture_screenshots
          type: bool
        raises:
        - description: If `environment_ready` is False, indicating the test environment
            is not prepared.
          type: RuntimeError
        - description: If any required key is missing from a test case definition.
          type: ValueError
        returns:
          description: A list of result dictionaries, one per test case, matching
            the node's output structure.
          type: List[Dict[str, Any]]
        summary: Run each test case and record detailed execution results.
    prompt: Run each test case in the order given, record whether it passed or failed,
      and capture any error logs or screenshots.
  identify_test_scope:
    agent: false
    description: Determine the boundaries and focus areas of the testing effort.
    name: identify_test_scope
    nodes_depended_on:
    - define_test_objectives
    nodes_dependent_on: []
    output_structure:
    - description: List of feature names that will be included in the test scope.
      key: scope_features
      type: List[str]
    - description: List of module or component identifiers that fall within the test
        scope.
      key: scope_modules
      type: List[str]
    - description: List of high-level user flow identifiers that are covered by the
        tests.
      key: scope_user_flows
      type: List[str]
    - description: List of boundary or edge case conditions that the tests will exercise.
      key: scope_boundary_conditions
      type: List[str]
    prd:
      conceptual_info: This node determines the scope of the testing effort based
        on the defined test objectives.
      docstring:
        examples:
        - lines:
          - test_objectives = ['Verify functionality', 'Test performance']
          - test_scope = identify_test_scope(test_objectives)
          output: '{''scope_features'': [''feature1'', ''feature2''], ''scope_modules'':
            [''module1'', ''module2''], ''scope_user_flows'': [''user_flow1'', ''user_flow2''],
            ''scope_boundary_conditions'': [''boundary_condition1'', ''boundary_condition2'']}'
        parameters:
        - description: A list of concise bullet points describing the primary objectives
            of the test suite.
          name: test_objectives
          type: List[str]
        raises:
        - description: If the test objectives are empty or invalid.
          type: ValueError
        returns:
          description: A dictionary containing the test scope, including features,
            modules, user flows, and boundary conditions.
          type: Dict[str, List[str]]
        summary: Identify the test scope by analyzing the test objectives and specifying
          features, modules, user flows, and boundary conditions.
    prompt: 'Based on the test objectives, specify the scope: features, modules, user
      flows, and boundary conditions to be covered.'
  prepare_test_environment:
    agent: false
    description: Set up the necessary test environment.
    name: prepare_test_environment
    nodes_depended_on:
    - identify_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Checklist of required hardware components
      key: hardware_requirements
      type: List[str]
    - description: Checklist of required software components and versions
      key: software_requirements
      type: List[str]
    - description: Checklist of steps to prepare test data
      key: data_setup_steps
      type: List[str]
    - description: Checklist of configuration settings to apply
      key: configuration_steps
      type: List[str]
    - description: Whether the environment is fully prepared for test execution
      key: environment_ready
      type: bool
    prd:
      conceptual_info: Prepares a complete, reproducible test environment by enumerating
        all necessary hardware, software, data, and configuration steps, and signals
        readiness for execution.
      docstring:
        examples:
        - lines:
          - env = prepare_test_environment(
          - '    scope_features=["Login", "Checkout"],'
          - '    scope_modules=["auth_service", "payment_gateway"],'
          - '    scope_user_flows=["user_login_flow", "user_checkout_flow"],'
          - '    scope_boundary_conditions=["max_session_time", "zero_payment_amount"]'
          - )
          - print(env["hardware_requirements"])
          output: '["NVIDIA RTX 3080 GPU", "8x Intel Xeon CPUs"]'
        - lines:
          - env = prepare_test_environment(
          - '    scope_features=[],'
          - '    scope_modules=[],'
          - '    scope_user_flows=[],'
          - '    scope_boundary_conditions=[]'
          - )
          output: 'ValueError: Scope inputs cannot be empty.'
        parameters:
        - description: List of feature names that will be included in the test scope.
          name: scope_features
          type: List[str]
        - description: List of module or component identifiers that fall within the
            test scope.
          name: scope_modules
          type: List[str]
        - description: List of high‑level user flow identifiers that are covered by
            the tests.
          name: scope_user_flows
          type: List[str]
        - description: List of boundary or edge case conditions that the tests will
            exercise.
          name: scope_boundary_conditions
          type: List[str]
        raises:
        - description: If any of the scope inputs are empty or None, indicating insufficient
            context to determine environment needs.
          type: ValueError
        returns:
          description: 'A dictionary containing five keys: hardware_requirements,
            software_requirements, data_setup_steps, configuration_steps, and environment_ready.'
          type: Dict[str, Any]
        summary: Generate a checklist of environment setup steps required for executing
          the test suite.
    prompt: Outline the required environment setup steps, including hardware, software,
      data, and configuration. List each item as a checklist.
  report_test_results:
    agent: false
    description: Create the final test report.
    name: report_test_results
    nodes_depended_on:
    - capture_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Total number of tests executed
      key: total_tests
      type: int
    - description: Number of tests that passed
      key: passed_tests
      type: int
    - description: Number of tests that failed
      key: failed_tests
      type: int
    - description: Pass rate as a percentage (0 to 100)
      key: pass_rate
      type: float
    - description: High‑level observations of the test results
      key: observations
      type: str
    prd:
      conceptual_info: Aggregates summarized metrics from raw test execution data
        to produce a concise, human‑readable test report.
      docstring:
        examples:
        - lines:
          - 'report = report_test_results(

            '
          - '    test_case_ids=[''TC1'', ''TC2'', ''TC3''],

            '
          - '    pass_fail_status=[True, False, True],

            '
          - '    execution_times=[0.12, 0.45, 0.08],

            '
          - '    failure_details=['''', ''AssertionError: expected 5, got 3'', ''''],

            '
          - '    total_tests=3,

            '
          - '    total_passed=2,

            '
          - '    total_failed=1

            '
          - )
          output: "{\n  \"total_tests\": 3,\n  \"passed_tests\": 2,\n  \"failed_tests\"\
            : 1,\n  \"pass_rate\": 66.66666666666666,\n  \"observations\": \"2 tests\
            \ passed, 1 failed. Majority of failures due to assertion errors.\"\n}"
        - lines:
          - 'report = report_test_results(

            '
          - '    test_case_ids=[''A'', ''B''],

            '
          - '    pass_fail_status=[False, False],

            '
          - '    execution_times=[0.5, 0.6],

            '
          - '    failure_details=[''Timeout'', ''NullPointerException''],

            '
          - '    total_tests=2,

            '
          - '    total_passed=0,

            '
          - '    total_failed=2

            '
          - )
          output: "{\n  \"total_tests\": 2,\n  \"passed_tests\": 0,\n  \"failed_tests\"\
            : 2,\n  \"pass_rate\": 0.0,\n  \"observations\": \"All tests failed. Common\
            \ issues: timeouts and null references.\"\n}"
        parameters:
        - description: List of test case identifiers.
          name: test_case_ids
          type: list[str]
        - description: Boolean list indicating pass (True) or fail (False) for each
            test case.
          name: pass_fail_status
          type: list[bool]
        - description: Execution time in seconds for each test case.
          name: execution_times
          type: list[float]
        - description: Failure details for each failed test case; empty strings for
            passed cases.
          name: failure_details
          type: list[str]
        - description: Total number of tests executed.
          name: total_tests
          type: int
        - description: Total number of tests passed.
          name: total_passed
          type: int
        - description: Total number of tests failed.
          name: total_failed
          type: int
        raises:
        - description: Raised if input lists are of mismatched lengths or if total_counts
            do not match list lengths.
          type: ValueError
        returns:
          description: A dictionary containing summarized test metrics.
          type: dict
        summary: Generate a summary report of test execution results.
    prompt: 'Summarize the test outcomes in a report: total tests, passes, failures,
      pass rate, and high‑level observations.'
