dag_type: typed
description: Generated workflow from UI.
name: audio_sample_identifier
nodes:
  build_song_database_data_ingestion:
    agent: false
    description: Efficiently ingest and populate the song database with a comprehensive
      collection of songs and their associated metadata, technical audio features
      (such as tempo, key, duration, loudness, and spectral descriptors), as well
      as relevant attributes like genre, artist, release year, and album. Ensure data
      is validated, normalized, and adheres to the schema designed for optimal storage,
      indexing, and querying. The ingestion process should be robust against duplicates,
      handle missing or malformed data gracefully, and record provenance information
      (such as data sources and timestamps) for auditing and reproducibility.
    name: build_song_database_data_ingestion
    nodes_depended_on:
    - build_song_database_schema
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the ingestion process completed successfully
        without critical errors.
      key: ingestion_success
      type: bool
    - description: Total number of song records attempted for ingestion.
      key: total_records_attempted
      type: int
    - description: Total number of new, valid song records successfully ingested into
        the database.
      key: total_records_ingested
      type: int
    - description: Number of duplicate records identified and handled during ingestion.
      key: duplicate_records_found
      type: int
    - description: Number of records that failed schema validation.
      key: schema_validation_errors
      type: int
    - description: Descriptions of schema validation errors encountered (may include
        sample messages or summaries).
      key: validation_error_messages
      type: List[str]
    - description: List of unique artist names ingested in this operation.
      key: unique_artist_names
      type: List[str]
    - description: List of unique genres captured in this ingestion run.
      key: unique_genres
      type: List[str]
    - description: List of data sources from which records were ingested.
      key: provenance_sources
      type: List[str]
    - description: List of ISO8601-formatted timestamps representing when data batches
        were ingested.
      key: ingestion_timestamps
      type: List[str]
    prompt: 'Ingest song data into the newly created database schema. Load a diverse
      set of songs, ensuring for each entry the inclusion of core fields—title, artist,
      album, genre, release year, and unique identifiers. Supplement each song with
      technical audio features like tempo (BPM), key (musical scale), duration (in
      seconds), loudness (in dB), and additional descriptors (e.g., MFCCs, spectral
      centroid). Validate incoming data against the schema, normalize categorical
      values (such as genres and artists), and de-duplicate entries. If available,
      capture and log data provenance (source and ingestion timestamp). Execute bulk
      insertion using efficient batch processing and transactional safety guarantees—rolling
      back or flagging any problematic records. After ingestion, report key statistics:
      total records ingested, duplicates resolved, and any schema validation errors.'
  build_song_database_schema:
    agent: false
    description: Architect and formalize a robust, normalized relational database
      schema tailored for full-featured song data management, including entity relationships,
      metadata fields, scalability considerations, and provisions for advanced querying
      and integrity. The design must ensure optimal performance and seamless integration
      within the overall app architecture.
    name: build_song_database_schema
    nodes_depended_on:
    - design_app_architecture_components
    nodes_dependent_on: []
    output_structure:
    - description: Complete SQL DDL statements representing the relational schema
        design, including table definitions, keys, indexes, and constraints.
      key: schema_ddl
      type: str
    - description: Names of all tables included in the schema.
      key: table_names
      type: List[str]
    - description: Primary key field(s) for each table, in order corresponding to
        table_names.
      key: primary_keys
      type: List[str]
    - description: List of foreign key relationships, each described in a standardized
        string format (e.g., 'song.album_id -> album.id').
      key: foreign_keys
      type: List[str]
    - description: Fields in each table that have explicit indexes for efficient lookup.
      key: indexed_fields
      type: List[str]
    - description: Fields or tables specifically designed for planned extensibility
        (e.g., lyrics, audio features, user-generated content).
      key: extensible_fields
      type: List[str]
    - description: Description of all additional data integrity constraints (e.g.,
        UNIQUE, NOT NULL, CHECK) applied in the schema.
      key: integrity_constraints
      type: List[str]
    - description: Coherent textual commentary on major schema design decisions and
        technical considerations.
      key: design_commentary
      type: str
    prompt: Design a comprehensive, normalized relational database schema optimized
      for efficient storage and querying of song-related data within the application's
      architecture. Specify the table structures, including primary keys, foreign
      key relationships, indexes for frequent lookup fields, and requisite constraints
      for data integrity. Account for fundamental song metadata (such as title, artist,
      album, genre, duration, release date, and track number), and extensibility for
      future enhancements (e.g., lyrics, audio features, user-generated ratings).
      Ensure the schema supports scalable associations with artists and albums, facilitates
      search and retrieval for high-volume usage, and enforces referential integrity
      across all related entities. Deliver the schema as SQL DDL (Data Definition
      Language) statements with commentary to explain design decisions and critical
      technical considerations.
  design_app_architecture_components:
    agent: false
    description: Systematically decompose the application architecture into detailed,
      well-defined technical components—covering presentation layers, domain logic,
      data persistence, API interfaces, integrations, third-party services, security
      modules, and infrastructure elements—ensuring each constituent part is precisely
      delineated in terms of its responsibilities, interactions, and implementation
      technologies.
    name: design_app_architecture_components
    nodes_depended_on:
    - design_app_architecture_overview
    nodes_dependent_on: []
    output_structure:
    - description: List of UI layer components (frameworks, hierarchies, routing,
        and state management strategies)
      key: presentation_ui_components
      type: List[str]
    - description: List of domain logic elements (patterns, aggregates, and service
        definitions)
      key: domain_business_logic_components
      type: List[str]
    - description: List of database systems, ORM frameworks, caching mechanisms, and
        schema versioning strategies
      key: data_access_persistence_components
      type: List[str]
    - description: List of API protocols, gateways, and service discovery implementations
      key: api_integrationlayer_components
      type: List[str]
    - description: List of third-party services and their integration patterns
      key: external_service_components
      type: List[str]
    - description: List of authentication, encryption, and compliance implementations
      key: security_modules_components
      type: List[str]
    - description: List of hosting solutions, containerization tools, and monitoring
        strategies
      key: infrastructure_components
      type: List[str]
    - description: Descriptive list of interactions between architectural components
      key: component_interactions
      type: List[str]
    prompt: 'Break down the app architecture into its granular technical layers and
      components. For each of the following categories, specify the concrete elements,
      patterns, technologies, and responsibilities involved:


      1. Presentation/UI Layer: Define the frameworks (e.g., React, Flutter), component
      hierarchies, routing, UI state management, and theming.

      2. Domain/Business Logic: Outline core application logic, domain-driven design
      (DDD) aggregates, services, and relevant patterns (e.g., CQRS, event sourcing).

      3. Data Access & Persistence: Detail database engines (SQL/NoSQL), ORM/ODM frameworks,
      data schema, caching strategies, and migration/versioning approaches.

      4. API & Integration Layer: Specify REST, GraphQL, gRPC, or WebSocket endpoints,
      API gateways, service discovery mechanisms, and contract validation.

      5. External Services: List third-party dependencies (auth, payments, analytics),
      their integration method, and error/resilience handling.

      6. Security Modules: Explain authentication, authorization, encryption, secrets
      management, and compliance considerations.

      7. Infrastructure: Enumerate hosting solutions (cloud/on-prem), containerization
      (Docker/Kubernetes), CI/CD pipelines, monitoring/logging, and scaling strategies.


      For each component, describe its purpose, technical approach, technology choices,
      and how it interacts with other architectural elements. Present the breakdown
      in a structured format (table or diagram, if possible) for maximum clarity.'
  design_app_architecture_interfaces:
    agent: false
    description: Define precise technical interfaces, contracts, and communication
      protocols between core architectural components, ensuring alignment with the
      high-level design and enabling modular, maintainable system integration.
    name: design_app_architecture_interfaces
    nodes_depended_on:
    - design_app_architecture_overview
    nodes_dependent_on: []
    output_structure:
    - description: List of API endpoints with HTTP verbs and JSON schema definitions
        (e.g., 'GET /songs', 'POST /users')
      key: api_endpoints
      type: List[str]
    - description: List of authentication/authorization mechanisms used (e.g., 'OAuth2',
        'JWT')
      key: authentication_methods
      type: List[str]
    - description: List of message serialization formats (e.g., 'gRPC', 'Avro')
      key: serialization_formats
      type: List[str]
    - description: List of HTTP status codes defined for error handling (e.g., 400,
        404, 500)
      key: error_handling_status_codes
      type: List[int]
    - description: Description of API versioning strategy (e.g., 'Semantic versioning
        with backward compatibility')
      key: versioning_strategy
      type: str
    - description: Whether idempotency patterns are implemented for critical endpoints
      key: idempotency_supported
      type: bool
    - description: Whether circuit breaker patterns are implemented for fault tolerance
      key: circuit_breaker_implemented
      type: bool
    - description: Required logging level (e.g., 'INFO', 'DEBUG') for standard interface
        operations
      key: log_level_required
      type: str
    - description: Whether distributed tracing is enabled across all interface calls
      key: distributed_tracing
      type: bool
    prompt: Design and document robust interfaces between architectural components
      including service APIs, internal module boundary contracts, data access patterns,
      and system-to-system communication protocols. Specify details such as API endpoint
      definitions (HTTP verbs, JSON schemas), authentication/authorization mechanisms
      (OAuth2, JWT), message serialization formats (gRPC, Avro), circuit breakers,
      retries, logging/monitoring semantics, idempotency patterns, and cross-cutting
      concerns like request tracing. Establish interface versioning strategy, backward
      compatibility rules, and error handling contracts (HTTP status codes, error
      payload formats). Align interface design with the app's high-level architectural
      principles, security postures, and scalability requirements.
  design_app_architecture_overview:
    agent: false
    description: Define a holistic, production-grade technical architecture for the
      application, incorporating modern software engineering patterns, system resilience
      principles, and performance optimization strategies across client, server, and
      data tiers.
    name: design_app_architecture_overview
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of application-wide communication protocols (e.g., REST, gRPC,
        WebSockets)
      key: communication_protocols
      type: List[str]
    - description: List of data architecture components including database engines
        and caching systems
      key: data_layer_components
      type: List[str]
    - description: Whether the application employs a microservices architecture
      key: is_microservices_architecture
      type: bool
    - description: List of implemented security standards and mechanisms
      key: security_frameworks
      type: List[str]
    - description: List of active scalability patterns (e.g., horizontal, vertical,
        load balancing)
      key: scaling_strategies
      type: List[str]
    - description: List of infrastructure tools/platforms (e.g., Kubernetes, CI/CD
        pipelines)
      key: infrastructure_components
      type: List[str]
    - description: List of regulatory standards the architecture complies with
      key: compliance_standards
      type: List[str]
    - description: Whether UML diagrams were produced for architectural documentation
      key: has_uml_diagrams
      type: bool
    - description: Whether Architecture Decision Records (ADRs) were created
      key: has_architecture_decision_records
      type: bool
    - description: List of critical architectural trade-offs documented
      key: key_trade_offs
      type: List[str]
    prompt: Design a comprehensive application architecture that includes a detailed
      breakdown of client-server communication protocols (REST/gRPC/WebSockets), data
      layer architecture (relational/non-relational databases, caching strategies,
      and data partitioning), microservices architecture (if applicable) with service
      discovery mechanisms, security frameworks (OAuth2/JWT, encryption in-transit/at-rest),
      real-time processing pipelines, scalability patterns (horizontal/vertical scaling,
      load balancing), observability solutions (logging, metrics, distributed tracing),
      and infrastructure considerations (containerization with Kubernetes, CI/CD pipelines,
      and cost optimization). Include technical trade-offs between monolithic vs.
      microservices approaches, latency vs. throughput requirements, fault tolerance
      mechanisms, and compliance with relevant industry standards (e.g., GDPR, HIPAA).
      Document the architecture using UML diagrams and architecture decision records
      (ADRs).
  design_user_interface_elements:
    agent: false
    description: Define and implement interactive UI components including buttons,
      input fields, modals, accordions, and navigation elements with semantic structure
      and accessibility features, ensuring alignment with the established layout and
      design system.
    name: design_user_interface_elements
    nodes_depended_on:
    - design_user_interface_layout
    nodes_dependent_on: []
    output_structure:
    - description: List of all types of UI elements implemented (e.g., button, slider,
        modal, tab, etc.).
      key: ui_element_types
      type: List[str]
    - description: List of semantic names or IDs corresponding to each UI element
        for reference and integration.
      key: element_names
      type: List[str]
    - description: List of accessibility features implemented across UI elements (e.g.,
        ARIA roles, keyboard navigation, label association).
      key: accessibility_features
      type: List[str]
    - description: List of all supported UI states across elements (e.g., hover, focus,
        active, disabled, error, success).
      key: states_supported
      type: List[str]
    - description: List of platform-specific or design system patterns (e.g., Material,
        iOS, Tailwind) referenced or implemented.
      key: platform_design_patterns
      type: List[str]
    - description: List of validation and error state cues (e.g., invalid input, required,
        helper text, tooltip error messages) included in form elements.
      key: validation_error_states
      type: List[str]
    - description: Brief descriptions of responsive/adaptive behavior handled for
        core UI elements (e.g., breakpoint adaptation for buttons, navigation collapse,
        input resizing).
      key: responsive_behavior_descriptions
      type: List[str]
    - description: List of visual principles adhered to (e.g., color contrast, font
        size hierarchy, spacing conventions) across UI components.
      key: visual_hierarchy_principles
      type: List[str]
    - description: List of component libraries or style sheets referenced or used
        (e.g., React-Bootstrap, Ant Design, Tailwind CSS).
      key: component_library_references
      type: List[str]
    - description: Whether the designed UI elements are compliant with WCAG 2.1 AA
        accessibility standards.
      key: is_wcag_compliant
      type: bool
    prompt: 'Design and document the following UI elements with technical specifications:
      (1) interactive controls (buttons, sliders, checkboxes) with hover/focus/disabled
      states, (2) form components (text fields, dropdowns, date pickers) with validation
      cues and error states, (3) navigational elements (tabs, breadcrumbs, search
      bars) with responsive behavior. Incorporate platform-specific design patterns,
      accessibility standards (ARIA roles, WCAG 2.1 AA compliance), and visual hierarchy
      principles (typography, color contrast, spacing). Reference the established
      layout framework and apply component libraries or style sheets for consistent
      theming and reusability.'
  design_user_interface_layout:
    agent: false
    description: Architects the comprehensive, user-centered interface layout by integrating
      best practices of responsive design, usability heuristics, and modern UI/UX
      frameworks. Ensures cohesive alignment with previously defined app architecture
      components, logical information hierarchy, intuitive navigation flows, adaptive
      breakpoints, accessibility standards (WCAG), and pixel density awareness—setting
      a robust visual and interactive foundation for the final application.
    name: design_user_interface_layout
    nodes_depended_on:
    - design_app_architecture_components
    nodes_dependent_on: []
    output_structure:
    - description: Textual summary describing the overall UI layout structure, primary
        regions, and spatial hierarchy.
      key: layout_description
      type: str
    - description: List of major UI regions present in the layout (e.g., navigation,
        content, sidebar, footer, notifications, modals).
      key: layout_regions
      type: List[str]
    - description: List of pixel values for responsive design breakpoints used in
        the layout (e.g., [320, 768, 1024, 1440]).
      key: responsive_breakpoints
      type: List[int]
    - description: Names of key reusable UI components defined at the layout level
        (e.g., navigation bar, search bar, card, modal, drawer).
      key: component_names
      type: List[str]
    - description: Accessibility strategies and WCAG-related practices included in
        the layout (e.g., ARIA labels, color contrast, keyboard navigation, focus
        order).
      key: accessibility_features
      type: List[str]
    - description: List of design system libraries or CSS frameworks integrated with
        the layout (e.g., Material Design, Tailwind CSS, Bootstrap).
      key: ui_frameworks_utilized
      type: List[str]
    - description: Description of global rules for margins, paddings, alignment, and
        spacing conventions across the layout.
      key: alignment_and_spacing_rules
      type: str
    - description: Whether the layout is aware of and supports pixel density scaling
        (e.g., retina/display density awareness).
      key: has_retina_scaling
      type: bool
    - description: A textual or pseudo-visual representation of the layout wireframe,
        diagram, or component map.
      key: wireframe_representation
      type: str
    prompt: Develop a detailed, technically sound user interface layout that reflects
      the specified app architecture components. Specify an adaptive grid or flexbox
      system, define regions for navigation, content, inputs, notifications, and other
      functional modules. Illustrate the spatial hierarchy, responsive breakpoints,
      alignment rules, and margin/padding conventions. Ensure adherence to accessibility
      guidelines (e.g., contrast, keyboard navigation, screen reader compatibility).
      Document modal flows and interaction patterns for primary tasks. Annotate your
      layout with component boundaries, z-index layering for overlays, device scaling
      strategies (e.g., retina readiness), and integration points for UI frameworks
      such as Material Design or Tailwind CSS. Present layout diagrams or wireframes
      (textual or pseudo-visual if graphics are not possible), and explain how the
      layout underpins usability, extensibility, and architectural cohesion within
      the app’s modular structure.
  develop_artist_page_redirector_model_integration:
    agent: false
    description: Seamlessly integrate the trained song identification model into the
      artist page redirector module. This step ensures that the redirector can leverage
      model predictions to efficiently route user requests or queries to the correct
      artist pages, thereby enhancing the accuracy and responsiveness of user navigation.
      Incorporate robust error handling, graceful fallback mechanisms, and asynchronous
      model invocation to maintain high throughput. Ensure compatibility with API
      endpoints, adherence to security and privacy standards, and optimize inference
      latency for seamless user experience.
    name: develop_artist_page_redirector_model_integration
    nodes_depended_on:
    - train_song_identification_model_training
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the integration of the model into the redirector
        was successful
      key: integration_success
      type: bool
    - description: Total number of test queries used to validate the integration
      key: num_test_queries
      type: int
    - description: Number of test queries for which the artist redirection matched
        the expected result
      key: num_successful_redirections
      type: int
    - description: Number of test queries where fallback logic (non-model route) was
        used due to errors or prediction failures
      key: num_fallbacks_triggered
      type: int
    - description: List of error or warning messages encountered during integration
        or test runs
      key: integration_error_messages
      type: List[str]
    - description: Average inference latency in milliseconds for the model during
        artist page redirection
      key: average_inference_latency_ms
      type: float
    - description: Whether privacy, security, and data retention compliance requirements
        were met
      key: compliance_checks_passed
      type: bool
    - description: List of key log event descriptions (with timestamps) from the integration
        and validation process
      key: integration_log_events
      type: List[str]
    prompt: 'Integrate the trained song identification model into the artist page
      redirector module with the following technical requirements:

      - Expose the model''s inference function as an asynchronous service or microservice,
      enabling batch or real-time prediction.

      - Interface the redirector logic with the model''s API endpoint—in-process or
      over HTTP/gRPC as appropriate.

      - Implement robust error handling for prediction failures, with fallback to
      rule-based logic or default routing.

      - Ensure input data transformation and normalization in line with model training
      specifications (e.g., feature encoding, string preprocessing).

      - Optimize model loading for low-latency inference (consider model warm-up routines
      and connection pooling if remote).

      - Validate integration by running test cases simulating diverse user queries,
      verifying correct redirection outcomes.

      - Log integration events and prediction results with timestamps for monitoring
      and debugging.

      - Ensure compliance with all privacy, security, and data retention requirements
      for served predictions.

      Document deployment instructions, configuration options, and recommended validation/checklist
      steps for seamless handoff and maintenance.'
  develop_audio_processing_module_codec:
    agent: false
    description: Design and implement a robust audio codec tailored for the audio
      processing module. The codec should enable efficient encoding and decoding of
      audio snippets, supporting standard and high-fidelity audio formats (e.g., PCM,
      AAC, or Opus), variable bitrates, and real-time processing capabilities. Ensure
      compatibility with the overall application architecture as defined in prior
      design stages, with clear interfaces for integration with input/output pipelines.
      Address error resilience, scalability, and extensibility for future enhancements
      such as streaming and adaptive bitrate control.
    name: develop_audio_processing_module_codec
    nodes_depended_on:
    - design_app_architecture_components
    nodes_dependent_on: []
    output_structure:
    - description: List of audio formats supported by the codec (e.g., PCM, AAC, Opus).
      key: supported_formats
      type: List[str]
    - description: Supported audio sampling rates in Hz (e.g., 16000, 44100).
      key: supported_sample_rates
      type: List[int]
    - description: List of supported bitrates in kbps for encoding/decoding.
      key: supported_bitrates
      type: List[int]
    - description: Measured latency of the encoding process in milliseconds.
      key: encoding_latency_ms
      type: float
    - description: Measured latency of the decoding process in milliseconds.
      key: decoding_latency_ms
      type: float
    - description: Whether real-time streaming of audio is supported.
      key: streaming_supported
      type: bool
    - description: True if adaptive bitrate adjustments are supported.
      key: adaptive_bitrate_supported
      type: bool
    - description: List of implemented error resilience features (e.g., buffer management,
        frame recovery).
      key: error_resilience_features
      type: List[str]
    - description: True if audio data integrity tests passed.
      key: test_pass_audio_integrity
      type: bool
    - description: True if codec meets performance requirements in tests.
      key: test_pass_performance
      type: bool
    - description: Descriptions of edge case scenarios that failed, if any.
      key: edge_case_failures
      type: List[str]
    - description: List of available extensibility hooks for additional audio processing
        features (e.g., noise reduction, gain normalization).
      key: extensibility_hooks
      type: List[str]
    prompt: Engineer a high-performance audio codec for the audio processing module.
      Architect the codec to support encoding and decoding of audio snippets in widely
      adopted formats (e.g., PCM, AAC, Opus), allowing for configurable sampling rates
      (e.g., 16kHz, 44.1kHz), variable bitrates, and low-latency real-time operations.
      Implement robust error handling and buffer management, with interfaces compatible
      with the modular app architecture and seamless integration into audio input/output
      pipelines. Include adaptive bitrate adjustments, support for streaming, and
      extensibility hooks for advanced audio effects (e.g., noise reduction, gain
      normalization). Document all APIs and provide comprehensive test coverage for
      audio data integrity, performance, and edge cases (e.g., corrupted frames, incomplete
      packets).
  develop_audio_processing_module_feature_extraction:
    agent: false
    description: Design and implement a sophisticated audio feature extraction component
      that ingests codec-processed audio snippets and outputs a rich set of discriminative
      audio features. This module should support robust time-domain, frequency-domain,
      and time–frequency representations (such as MFCCs, chroma features, spectral
      contrast, zero-crossing rate, RMS energy, spectral centroid, bandwidth, and
      roll-off). Ensure the extraction process is configurable for windowing strategy,
      hop size, preprocessing (e.g., normalization, silence removal), and feature
      aggregation. The component must be extensible for additional feature types (e.g.,
      pitch, tonnetz, onset envelope) and optimized for efficiency with batch and
      streaming inference compatibility.
    name: develop_audio_processing_module_feature_extraction
    nodes_depended_on:
    - develop_audio_processing_module_codec
    nodes_dependent_on: []
    output_structure:
    - description: Names of audio feature types extracted (e.g., MFCCs, chroma, spectral_centroid,
        etc).
      key: audio_feature_type_names
      type: List[str]
    - description: Flattened list of Mel-frequency cepstral coefficients (MFCCs) extracted
        from the input audio snippet.
      key: mfccs
      type: List[float]
    - description: Flattened list of chroma feature values extracted from the audio
        snippet.
      key: chroma_features
      type: List[float]
    - description: List of spectral contrast features per frame.
      key: spectral_contrast
      type: List[float]
    - description: Frame-wise spectral centroid values.
      key: spectral_centroid
      type: List[float]
    - description: Frame-wise spectral bandwidths.
      key: spectral_bandwidth
      type: List[float]
    - description: Spectral roll-off values per frame.
      key: spectral_rolloff
      type: List[float]
    - description: List of zero-crossing rates for each frame or segment.
      key: zero_crossing_rate
      type: List[float]
    - description: Frame-wise root mean square (RMS) energy values.
      key: rms_energy
      type: List[float]
    - description: 'Optional: List of pitch-related features if extracted (flattened
        or per frame).'
      key: pitch_features
      type: List[float]
    - description: 'Optional: Tonnetz harmonic features extracted from the audio snippet.'
      key: tonnetz_features
      type: List[float]
    - description: Names of aggregation statistics applied (e.g., mean, std, min,
        max) for each feature type.
      key: aggregation_stat_names
      type: List[str]
    - description: Flattened list of aggregated values (e.g., mean MFCC, std chroma,
        etc.), corresponding to audio_feature_type_names and aggregation_stat_names.
      key: aggregation_stat_values
      type: List[float]
    - description: The window size (in samples or ms) used for feature extraction.
      key: window_size
      type: int
    - description: The hop length (in samples or ms) between frames.
      key: hop_length
      type: int
    - description: The dimensionality of the extracted feature vector for each feature
        type.
      key: feature_dimensionality
      type: int
    - description: Names/descriptions of preprocessing steps applied (e.g., normalization,
        silence_trimming, SSL).
      key: preprocessing_applied
      type: List[str]
    - description: Whether feature extraction was successful with no errors.
      key: extraction_success
      type: bool
    prompt: 'Develop an advanced audio feature extraction component for the audio
      processing module. The implementation should:

      - Accept codec-standardized audio snippets as input.

      - Extract a comprehensive suite of audio features, including but not limited
