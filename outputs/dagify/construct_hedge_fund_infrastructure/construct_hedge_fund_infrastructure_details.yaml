dag_type: plain_text
description: Comprehensive workflow to build a hedge fund encompassing strategic planning,
  legal structuring, operational design, and launch preparation with maximal parallel
  execution
name: construct_hedge_fund_infrastructure
nodes:
  choose_investment_strategy:
    agent: false
    description: Select primary trading methodology
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - define_asset_universe
    - set_performance_and_risk_targets
    prompt: 'Choose one primary hedge fund strategy from: long/short equity, event-driven,
      global macro, fixed income arbitrage, multi-strategy. Provide rationale specific
      to the fund objectives'
  choose_legal_entity_type:
    agent: false
    description: Determine appropriate corporate structure
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on:
    - list_service_providers
    - outline_governance_structure
    prompt: Select between LP, LLC, SICAV, or other entity types for the chosen jurisdiction.
      Justify with 3 specific regulatory, tax, or operational advantages
  clarify_fund_objectives:
    agent: false
    description: Establish the core business objectives for the hedge fund
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - choose_investment_strategy
    - select_jurisdiction
    - define_investor_profile
    prompt: Specify 8-12 concise bullet points outlining the fund's objectives including
      investment purpose, competitive differentiators, target return expectations,
      risk appetite, and long-term vision
  compile_pitch_deck_outline:
    agent: false
    description: Create investor presentation framework
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    - design_compliance_program
    - outline_governance_structure
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: 'Create 12-slide investor deck outline with specific slide content: Objectives,
      Edge, Strategy, Portfolio, Risk Management, Compliance, Team, Fee Structure,
      Performance Targets, Capital Requirements, Timeline, Commitment Ask'
  create_hiring_plan:
    agent: false
    description: Define personnel requirements
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: 'List 8-10 FTE roles with: job title, key responsibilities, and hiring
      priority (1-3). Include 2 offshore/outsource options'
  define_asset_universe:
    agent: false
    description: Specify investable instruments
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - draft_operations_workflow
    prompt: Create an ordered list of 8-12 asset classes and specific instruments
      the strategy will trade (e.g., 'Russell 2000 options', 'Euro corporate bonds')
  define_investor_profile:
    agent: false
    description: Characterize the target investor demographic
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: 'Produce a 4-category profile of ideal investors including: typical investor
      types, average commitment size range (in USD), liquidity expectations (time
      horizon), and geographic focus region'
  define_technology_stack:
    agent: false
    description: Specify required technology infrastructure
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: 'Catalog 6-8 technology components with use cases: trading platform, portfolio
      accounting system, risk analytics, data feeds, communication tools'
  design_compliance_program:
    agent: false
    description: Develop regulatory adherence framework
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: Create compliance matrix mapping each regulatory requirement to specific
      policies. Include 5-7 regulatory domains with corresponding internal controls
  design_risk_management_framework:
    agent: false
    description: Create control system architecture
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: 'List 7-10 risk controls with implementation details: position sizing
      rules, VaR thresholds, liquidity coverage ratios, portfolio stress tests, and
      exit strategies'
  develop_timeline_and_milestones:
    agent: false
    description: Create launch schedule
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    prompt: 'Create 18-month Gantt chart with 4 phases: Foundations (entity setup),
      Capabilities (tech/hr), Marketing (pitch deck/referrals), Launch (AUM threshold).
      Include 3-5 measurable milestones per phase'
  draft_fee_structure:
    agent: false
    description: Establish revenue model
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: Define management fee (1.25-2.00%) and performance fee (15-25%) with hurdle
      rate (if applicable). Include 5-year fee breakpoint schedule
  draft_operations_workflow:
    agent: false
    description: Map core operational processes
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    nodes_dependent_on:
    - define_technology_stack
    - create_hiring_plan
    prompt: Document daily operational cycle from idea generation through settlement.
      Use swimlane format showing service providers and internal teams
  estimate_setup_and_operating_costs:
    agent: false
    description: Quantify capital requirements
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on:
    - develop_timeline_and_milestones
    prompt: 'Produce USD cost estimates for 12 months including: legal setup, tech,
      service providers, marketing, and office expenses. Format as 3-column table'
  identify_regulatory_requirements:
    agent: false
    description: Map compliance obligations
    name: identify_regulatory_requirements
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on:
    - design_compliance_program
    prompt: List all mandatory regulatory filings and registrations required for the
      selected jurisdiction and entity type within the next 18 months
  list_service_providers:
    agent: false
    description: Identify required third-party partners
    name: list_service_providers
    nodes_depended_on:
    - choose_investment_strategy
    - choose_legal_entity_type
    nodes_dependent_on:
    - estimate_setup_and_operating_costs
    prompt: Create checklist of 6-8 service provider categories with brief role descriptions
      (e.g., 'Prime Broker - execute trades and provide financing')
  outline_governance_structure:
    agent: false
    description: Define internal management hierarchy
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on:
    - compile_pitch_deck_outline
    prompt: 'Create RACI matrix (Responsible, Accountable, Consulted, Informed) for
      core governance roles: GP, CIO, Compliance Officer, and Board'
  select_jurisdiction:
    agent: false
    description: Determine legal domicile for fund establishment
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on:
    - choose_legal_entity_type
    - identify_regulatory_requirements
    prompt: Recommend 3 jurisdictions with rankings (1st, 2nd, 3rd) based on fund
      objectives. For each include 2 advantages and 2 disadvantages in 50 words each
  set_performance_and_risk_targets:
    agent: false
    description: Quantify financial goals
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on:
    - design_risk_management_framework
    - draft_fee_structure
    prompt: 'Define annual targets for: gross return (%), volatility (std dev), Sharpe
      ratio, max drawdown, and liquidity. Include 2-3 key performance drivers'
