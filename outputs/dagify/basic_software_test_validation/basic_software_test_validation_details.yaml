dag_type: spec
description: Generated workflow from UI.
name: basic_software_test_validation
nodes:
  aggregate_test_results:
    agent: false
    description: Compile collected test outcome metrics
    name: aggregate_test_results
    nodes_depended_on:
    - run_regression_test
    - run_unit_test
    - run_integration_test
    nodes_dependent_on: []
    output_structure:
    - description: Percentage of test cases that passed
      key: test_pass_rate
      type: float
    - description: Percentage of test cases that failed
      key: test_fail_rate
      type: float
    - description: Number of errors encountered during each test run
      key: error_counts
      type: int
    - description: Time taken to execute each test run
      key: execution_times
      type: float
    prd:
      conceptual_info: This node aggregates test results from regression, unit, and
        integration tests into a standardized format.
      docstring:
        examples:
        - lines:
          - regression_test_results = run_regression_test(input_data)
          - unit_test_results = run_unit_test(input_data)
          - integration_test_results = run_integration_test(input_data)
          - aggregate_test_results(regression_test_results, unit_test_results, integration_test_results)
          output: '{test_pass_rate: 0.8, test_fail_rate: 0.2, error_counts: [2, 3,
            1], execution_times: [10.5, 8.2, 12.1]}'
        - lines:
          - 'regression_test_results = {''test_completion_status'': ''success'', ''test_failure_count'':
            1, ''test_error_counts'': [1], ''test_execution_time'': 10.5, ''stack_trace_reports'':
            ''''}'
          - 'unit_test_results = {''unit_test_results'': [''pass'', ''fail''], ''exception_details'':
            [''Exception''], ''execution_time'': 8.2}'
          - 'integration_test_results = {''integration_test_results'': [''pass'',
            ''pass'', ''fail''], ''test_success_status'': True, ''error_counts'':
            [2], ''execution_times'': [12.1, 15.6]}'
          - aggregate_test_results(regression_test_results, unit_test_results, integration_test_results)
          output: '{test_pass_rate: 0.8333, test_fail_rate: 0.1667, error_counts:
            [2, 0, 1], execution_times: [10.5, 8.2, 15.6]}'
        parameters:
        - description: Output of run_regression_test node
          name: regression_test_results
          type: PrimitiveType.DICT
        - description: Output of run_unit_test node
          name: unit_test_results
          type: PrimitiveType.DICT
        - description: Output of run_integration_test node
          name: integration_test_results
          type: PrimitiveType.DICT
        raises: []
        returns:
          description: '{''test_pass_rate'': float, ''test_fail_rate'': float, ''error_counts'':
            list[int], ''execution_times'': list[float]}'
          type: PrimitiveType.DICT
        summary: Compile collected test outcome metrics from regression, unit, and
          integration tests.
    prompt: Consolidate test results from regression, unit, and integration tests
      into standardized format (pass/fail percentages, error counts, execution times)
  generate_test_summary:
    agent: false
    description: Prepare structured test validation report
    name: generate_test_summary
    nodes_depended_on:
    - aggregate_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Human-readable format of success metrics
      key: success_metrics
      type: str
    - description: Detailed analysis of test failures
      key: failure_analysis
      type: str
    - description: Notable anomalies detected in test results
      key: anomaly_highlights
      type: str
    prd:
      conceptual_info: This node's purpose is to generate a structured test validation
        report by analyzing aggregated test data.
      docstring:
        examples:
        - lines:
          - aggregated_test_data = aggregate_test_results.run(...)
          - test_summary = generate_test_summary.run(aggregated_test_data)
          output: "\n                {\n                  'success_metrics': 'Test\
            \ pass rate: 80%, Test fail rate: 20%',\n                  'failure_analysis':\
            \ 'Detailed analysis of test failures',\n                  'anomaly_highlights':\
            \ 'Notable anomalies detected in test results'\n                }\n  \
            \            "
        parameters:
        - description: Aggregated test data obtained from the `aggregate_test_results`
            node.
          name: aggregated_test_data
          type: object
        raises: []
        returns:
          description: "\n              A dictionary containing the following key-value\
            \ pairs:\n              - `success_metrics`: Human-readable format of\
            \ success metrics\n              - `failure_analysis`: Detailed analysis\
            \ of test failures\n              - `anomaly_highlights`: Notable anomalies\
            \ detected in test results\n            "
          type: object
        summary: Prepare a human-readable test summary document including success
          metrics, failure analysis, and anomaly highlights using aggregated test
          data.
    prompt: Create human-readable test summary document including success metrics,
      failure analysis, and anomaly highlights using aggregated test data.
  initialize_test_environment:
    agent: false
    description: Set up temporary testing sandbox environment
    name: initialize_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Status of the test environment initialization
      key: test_environment_status
      type: str
    - description: List of paths to isolated log directories
      key: log_directory_paths
      type: List[str]
    - description: List of configuration settings for the testing environment
      key: configuration_settings
      type: List[str]
    prd:
      conceptual_info: This node sets up a temporary testing environment with the
        required configurations, installs dependencies, and isolates log directories
        for test execution.
      docstring:
        examples:
        - lines:
          - setup_test_environment(environment_config=['config1', 'config2'], dependencies=['dep1',
            'dep2'])
          output: '{''test_environment_status'': ''initialized'', ''log_directory_paths'':
            [''/log1'', ''/log2''], ''configuration_settings'': [''config1'', ''config2'']}'
        - lines:
          - setup_test_environment(environment_config=['config3', 'config4'], dependencies=['dep3',
            'dep4'])
          output: '{''test_environment_status'': ''initialized'', ''log_directory_paths'':
            [''/log3'', ''/log4''], ''configuration_settings'': [''config3'', ''config4'']}'
        parameters:
        - description: Configuration settings for the testing environment
          name: environment_config
          type: List[str]
        - description: List of dependencies to be installed
          name: dependencies
          type: List[str]
        raises:
        - description: Raised when the test environment setup fails.
          type: Exception -> test_environment_failure
        returns:
          description: A tuple containing the test environment status, log directory
            paths, and configuration settings.
          type: Tuple[str, List[str], List[str]] -> [test_environment_status, log_directory_paths,
            configuration_settings]
        summary: Sets up a temporary testing environment and initializes its status,
          log directories, and configuration settings.
    prompt: Initialize temporary testing environment with required configurations,
      dependency installations, and isolate log directories for test execution.
  run_integration_test:
    agent: false
    description: Execute system component integration tests
    name: run_integration_test
    nodes_depended_on:
    - initialize_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of test results from integration tests
      key: integration_test_results
      type: List[str]
    - description: Whether the integration tests were successful
      key: test_success_status
      type: bool
    - description: List of error counts from integration tests
      key: error_counts
      type: List[int]
    - description: List of execution times from integration tests
      key: execution_times
      type: List[float]
    prd:
      conceptual_info: Execute system component integration tests to validate interactions
        between software modules.
      docstring:
        examples:
        - lines:
          - integration_test_results, test_success_status, error_counts, execution_times
            = run_integration_test(initialize_test_environment)
          - print(integration_test_results)
          output: '[''test1 passed'', ''test2 failed'', ...]

            test_success_status = False

            error_counts = [1, 0, ...]

            execution_times = [1.0, 2.0, ...]'
        parameters: []
        raises:
        - description: If integration test environment is not properly set up.
          type: ValueError
        returns:
          description: 'integration_test_results: List[str], test_success_status:
            bool, error_counts: List[int], execution_times: List[float]'
          type: dict[str, type]
        summary: Run integration tests and return test results, success status, error
          counts, and execution times.
    prompt: Run test scenarios that validate interactions between software modules,
      recording integration validation results
  run_regression_test:
    agent: false
    description: Execute comprehensive regression test suite
    name: run_regression_test
    nodes_depended_on:
    - initialize_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Completion status of regression testing
      key: test_completion_status
      type: str
    - description: Number of tests that failed
      key: test_failure_count
      type: int
    - description: List of error counts for each test case
      key: test_error_counts
      type: int
    - description: Cumulative execution time of all tests
      key: test_execution_time
      type: float
    - description: List of stack trace reports for failed test cases
      key: stack_trace_reports
      type: str
    prd:
      conceptual_info: This node executes a comprehensive regression test suite against
        baseline reference implementations and logs success/failure states and stack
        traces for each test case.
      docstring:
        examples:
        - lines:
          - test_results = run_regression_test()
          - print(test_results['test_completion_status'])
          output: '[''success'']'
        - lines:
          - test_results = run_regression_test()
          - print(test_results['test_failure_count'])
          output: '0'
        parameters: []
        raises:
        - description: Raised when test suite execution fails or encounters unexpected
            issues.
          type: TestException
        returns:
          description: '{''test_completion_status'': ..., ''test_failure_count'':
            ..., ''test_error_counts'': ..., ''test_execution_time'': ..., ''stack_trace_reports'':
            ...}'
          type: PrimitiveType.DICT
        summary: Execute regression test suite and return test completion status,
          failure count, error counts, execution time, and stack trace reports.
    prompt: Run full regression test suite against baseline reference implementations,
      logging success/failure states and stack traces for each test case
  run_unit_test:
    agent: false
    description: Execute isolated unit-level test cases
    name: run_unit_test
    nodes_depended_on:
    - initialize_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: Results of individual unit tests (pass/fail)
      key: unit_test_results
      type: List[str]
    - description: Details of any exceptions encountered during unit testing
      key: exception_details
      type: List[str]
    - description: Total execution time for all unit tests
      key: execution_time
      type: float
    prd:
      conceptual_info: Execute unit tests in isolation with mocking dependencies.
      docstring:
        examples:
        - lines:
          - initialize_test_environment() -> test_environment_status, log_directory_paths,
            configuration_settings
          - test_environment_status, log_directory_paths, configuration_settings =
            initialize_test_environment()
          - run_unit_test(test_environment_status, log_directory_paths, configuration_settings)
            -> unit_test_results, exception_details, execution_time
          - unit_test_results, exception_details, execution_time = run_unit_test(test_environment_status,
            log_directory_paths, configuration_settings)
          - print(unit_test_results)
          output: '[''pass'', ''pass'', ''fail'']'
        - lines:
          - initialize_test_environment() -> test_environment_status, log_directory_paths,
            configuration_settings
          - test_environment_status, log_directory_paths, configuration_settings =
            initialize_test_environment()
          - run_unit_test(test_environment_status, log_directory_paths, configuration_settings)
            -> unit_test_results, exception_details, execution_time
          - unit_test_results, exception_details, execution_time = run_unit_test(test_environment_status,
            log_directory_paths, configuration_settings)
          - print(exception_details)
          output: '[''Exception details 1'', ''Exception details 2'', ''Exception
            details 3'']'
        parameters:
        - description: Status of the test environment initialization (output from
            initialize_test_environment)
          name: test_environment_status
          type: str
        - description: List of paths to isolated log directories (output from initialize_test_environment)
          name: log_directory_paths
          type: List[str]
        - description: List of configuration settings for the testing environment
            (output from initialize_test_environment)
          name: configuration_settings
          type: List[str]
        raises:
        - description: If the test environment is not properly initialized.
          type: ValueError
        returns:
          description: A tuple containing the results of individual unit tests, details
            of any exceptions encountered, and the total execution time.
          type: Tuple[List[str], List[str], float]
        summary: Run unit tests in isolation with mocking dependencies.
    prompt: Run individual module/unit test cases in isolation with mocking dependencies,
      capturing pass/fail status and exception details
